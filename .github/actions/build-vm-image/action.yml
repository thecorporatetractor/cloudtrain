# Build one KubeVirt containerDisk with tools/images/build.sh on a GitHub-hosted
# ubuntu runner (free for a public repository) and boot it once under KVM. Shared by the
# build-only pull request job and the publish job of .github/workflows/vm-images.yml.
# The built image stays in the local Docker store as the catalog name (build.sh) and
# the customized disk stays at tools/images/.cache/<variant>/out/disk.qcow2.
name: Build a VM containerDisk
description: Free runner disk, enable KVM, run tools/images/build.sh <variant>, boot-smoke the disk.
inputs:
  variant:
    description: build.sh variant (kubeadm-node, kubeadm-upgrade, etcd-host, docker-vm, kubeadm-full)
    required: true
  source-url:
    description: Repository URL for the org.opencontainers.image.source label (links the GHCR package)
    required: true
  revision:
    description: Commit for the org.opencontainers.image.revision label
    required: true
  base-package:
    description: GHCR package of the kubeadm-node disk that kubeadm-full layers on (empty for the other variants)
    default: ''
  base-tags:
    description: Space-separated tags of base-package to try, first hit wins (e.g. "sha-<commit> main")
    default: ''
  base-identity:
    description: Regexp of the Sigstore certificate identity that must have signed the base
    default: ''
  base-optional:
    description: "true: a missing base skips the build (pull requests before the first publish) instead of failing"
    default: 'false'
outputs:
  built:
    description: "false when the build was skipped because the optional base is not published yet"
    value: ${{ steps.base.outputs.have != 'false' }}
runs:
  using: composite
  steps:
    # The standard runner has ~14 GB free; the base image, the customized qcow2, its
    # sparse copy and the containerDisk layer need more. These toolchains are unused here.
    - name: Free runner disk
      shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
          /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/.ghcup /opt/microsoft
        sudo docker image prune -af >/dev/null
        df -h / | tail -1

    # /dev/kvm exists on hosted Linux runners but is not writable by the runner user.
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        for _ in $(seq 1 15); do [[ -w /dev/kvm ]] && exit 0; sleep 2; done
        ls -l /dev/kvm || true
        echo "::error::/dev/kvm is missing or not writable on this runner"
        exit 1

    # kubeadm-full is layered on the kubeadm-node containerDisk (build.sh expects it in the
    # local Docker store under its catalog name): pull it by digest and verify its signature.
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      if: inputs.base-package != ''

    - name: Pull the kubeadm-node base by digest
      id: base
      if: inputs.base-package != ''
      shell: bash
      env:
        PACKAGE: ${{ inputs.base-package }}
        TAGS: ${{ inputs.base-tags }}
        IDENTITY: ${{ inputs.base-identity }}
        OPTIONAL: ${{ inputs.base-optional }}
      run: |
        digest=
        for t in $TAGS; do
          digest=$(docker buildx imagetools inspect "$PACKAGE:$t" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) || digest=
          [[ $digest == sha256:* ]] && { echo "base $PACKAGE:$t = $digest"; break; }
          digest=
        done
        if [[ -z $digest ]]; then
          if [[ $OPTIONAL == true ]]; then
            echo "::notice::$PACKAGE is not published yet; skipping the layered build"
            echo "have=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::no published base $PACKAGE ($TAGS)"; exit 1
        fi
        cosign verify "$PACKAGE@$digest" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp "$IDENTITY" >/dev/null
        docker pull -q "$PACKAGE@$digest"
        # shellcheck source=/dev/null
        . deploy/versions.env
        docker tag "$PACKAGE@$digest" "${GOLDEN_IMAGE_REPO}:${LAB_K8S_VERSION}"
        echo "have=true" >> "$GITHUB_OUTPUT"

    - name: Build the containerDisk
      if: steps.base.outputs.have != 'false'
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        OCI_IMAGE_SOURCE: ${{ inputs.source-url }}
        OCI_IMAGE_REVISION: ${{ inputs.revision }}
        GUESTFS_KVM: '1'
        LOAD_INTO_KIND: '0'
        CLEAN_DISK: '0' # keep the disk for the boot test and the SBOM
        DOCKERIO_MIRROR: mirror.gcr.io # Docker Hub rate-limits anonymous pulls from runners
      run: |
        bash tools/images/build.sh "$VARIANT"
        df -h / | tail -1

    # The disk must boot to a login prompt (kernel, initramfs, root filesystem, cloud-init
    # without a datasource). The full lab test (tools/images/boot-test.sh) needs a cluster.
    - name: Boot smoke test
      if: steps.base.outputs.have != 'false'
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends qemu-system-x86
        disk="tools/images/.cache/$VARIANT/out/disk.qcow2"
        test -s "$disk"
        qemu-system-x86_64 -enable-kvm -cpu host -m 3072 -smp 2 -display none -nic none \
          -snapshot -drive "file=$disk,if=virtio,format=qcow2" -serial file:serial.log &
        qpid=$!
        ok=0
        for _ in $(seq 1 60); do
          if grep -qE ' login: ?$|login:' serial.log 2>/dev/null; then ok=1; break; fi
          kill -0 "$qpid" 2>/dev/null || break
          sleep 5
        done
        kill "$qpid" 2>/dev/null || true
        if ((ok)); then echo "boot ok: $(grep -m1 'login:' serial.log)"
        else echo "no login prompt within 5 minutes; serial console tail:"; tail -n 60 serial.log || true; exit 1; fi
