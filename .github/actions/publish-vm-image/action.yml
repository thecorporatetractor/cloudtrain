# Push a containerDisk built by ./build-vm-image to GHCR and sign it: tags (branch,
# sha-<commit>, semver, the catalog tag), cosign keyless signature by digest, SLSA
# provenance and an SBOM attestation (dpkg database read out of the disk), the digest as
# a file for the catalog overlay. The calling job needs packages: write, id-token: write
# and attestations: write, and must upload ./digests and ./sbom-*.json itself.
name: Publish a VM containerDisk
description: docker push, cosign sign, attest provenance and SBOM, record the digest.
inputs:
  variant:
    description: build.sh variant that was built
    required: true
  publish-name:
    description: GHCR package name (catalog publishName)
    required: true
  local-image:
    description: Catalog image name build.sh produced (cloudtrain/etcd-host:3.6)
    required: true
  catalog-tag:
    description: Tag of the catalog image (v1.37.1, 3.6, 29), pushed as a tag of the package too
    required: true
  registry:
    description: Registry prefix, lower case (ghcr.io/<owner>/<repo>)
    required: true
outputs:
  digest:
    description: Digest of the pushed image
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        images: ${{ inputs.registry }}/${{ inputs.publish-name }}
        tags: |
          type=ref,event=branch
          type=sha,format=long
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ inputs.catalog-tag }}

    - name: Push every tag
      id: push
      shell: bash
      env:
        LOCAL: ${{ inputs.local-image }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        digest=
        while IFS= read -r t; do
          [[ -n $t ]] || continue
          docker tag "$LOCAL" "$t"
          d=$(docker push "$t" | tee /dev/stderr | grep -oE 'digest: sha256:[0-9a-f]{64}' | head -1 | cut -d' ' -f2)
          [[ $d == sha256:* ]] || { echo "::error::no digest in the push output of $t"; exit 1; }
          [[ -z $digest || $digest == "$d" ]] || { echo "::error::the tags of $LOCAL differ in digest ($digest vs $d)"; exit 1; }
          digest=$d
        done <<<"$TAGS"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: cosign sign (keyless, by digest)
      shell: bash
      env:
        REF: ${{ inputs.registry }}/${{ inputs.publish-name }}@${{ steps.push.outputs.digest }}
      run: cosign sign --yes "$REF"

    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/${{ inputs.publish-name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    # A containerDisk is a qcow2 in a scratch image, so scanning the pushed image lists
    # nothing useful. Read the dpkg database and os-release out of the disk (libguestfs in
    # the builder image build.sh used) and let syft catalog that tree. Best effort: the
    # image-level SBOM is the fallback, so a libguestfs hiccup never blocks a release.
    - name: SBOM (packages inside the disk)
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
        NAME: ${{ inputs.publish-name }}
        REF: ${{ inputs.registry }}/${{ inputs.publish-name }}@${{ steps.push.outputs.digest }}
      run: |
        bash .github/scripts/install-tools.sh syft
        work="$PWD/tools/images/.cache/$VARIANT/out"
        builder=$(docker images --format '{{.Repository}}:{{.Tag}}' cloudtrain/image-builder | head -1)
        rm -rf "$work/sbom-root"; mkdir -p "$work/sbom-root"
        if docker run --rm --memory 6g --device /dev/kvm -e LIBGUESTFS_BACKEND=direct -e LIBGUESTFS_MEMSIZE=2048 \
             -v "$work:/work" "$builder" \
             virt-copy-out -a /work/disk.qcow2 /var/lib/dpkg /usr/lib/os-release /work/sbom-root \
           && [[ -s $work/sbom-root/dpkg/status ]]; then
          syft scan "dir:$work/sbom-root" --source-name "$NAME" \
            -o "spdx-json=sbom-$NAME.spdx.json" -o "cyclonedx-json=sbom-$NAME.cdx.json"
        else
          echo "::warning::could not read the package database out of the disk; SBOM of the pushed image instead"
          syft scan "registry:$REF" --source-name "$NAME" \
            -o "spdx-json=sbom-$NAME.spdx.json" -o "cyclonedx-json=sbom-$NAME.cdx.json"
        fi

    - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-name: ${{ inputs.registry }}/${{ inputs.publish-name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        sbom-path: sbom-${{ inputs.publish-name }}.spdx.json
        push-to-registry: true

    - name: Record the digest (for the catalog overlay)
      shell: bash
      env:
        NAME: ${{ inputs.publish-name }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: mkdir -p digests && printf '%s\n' "$DIGEST" > "digests/$NAME"
