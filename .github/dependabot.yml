# Dependabot version + security updates. Minor/patch updates are grouped per
# ecosystem; majors come one PR each. Security updates are grouped separately
# (repo setting "Dependabot security updates" must be on, docs/security-ci.md).
# cooldown: a release must be 7 days old before a version update proposes it
# (supply-chain hygiene; security updates are not delayed).
# Not covered: tool versions in .github/scripts/install-tools.sh and
# deploy/versions.env (sha256-pinned, bumped by hand), and the ARG-parameterised
# bases of tools/images/linux-pod/* and tools/mirrors/content (pinned in
# deploy/versions.env).
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # @types/node follows the Node runtime major, not the newest Node: CI
      # (.github/workflows, node-version: 22), the gateway's engines (>=22) and the
      # dev machines run Node 22. Newer majors describe APIs Node 22 lacks; bump this
      # together with the runtime. Minor/patch updates of the 22 line still come.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    labels: [dependencies, javascript]

  - package-ecosystem: gomod
    directory: /services/lab-orchestrator
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      k8s:
        applies-to: version-updates
        patterns: ['k8s.io/*', 'sigs.k8s.io/*']
      go-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ['*']
    labels: [dependencies, go]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directories:
      - /services/lab-orchestrator
      - /tools/images/builder
      - /tools/images/jumphost
      - /tools/images/linux-pod-interim/deb
      - /tools/images/linux-pod-interim/el
      - /tools/images/netdev/frr
      - /tools/images/netdev/netsvc
      - /tools/images/netdev/nettools
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A new Ubuntu release (24.04 -> 26.04) is a content migration, not a base
      # bump: catalog ref linux-pod-deb:24.04, the noble snapshot mirror and the
      # Linux labs all assume noble. Digest refreshes of 24.04 still come.
      - dependency-name: ubuntu
        # Ubuntu tags are YY.MM, so interim releases (24.10, 25.04) look like minor
        # bumps; only LTS-to-LTS moves are wanted, and those are planned by hand.
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      docker-bases:
        patterns: ['*']
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /deploy/dev
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      dev-deps:
        patterns: ['*']
    labels: [dependencies, docker]
