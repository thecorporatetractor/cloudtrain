# Accepted misconfigurations for the report-only Trivy scan of the whole repository
# (iac.yml "Trivy config (SARIF, report)"), each scoped to the file that needs it.
misconfigurations:
  # Lab add-on (tools/images/kubeadm-addons, applied only inside lab clusters): the CSI
  # hostpath node driver needs a privileged, root, writable container with /dev and the
  # kubelet directories mounted (Bidirectional propagation). Its sidecars are unprivileged.
  - id: KSV-0014
    paths: ["tools/images/kubeadm-addons/manifests/csi-hostpath.yaml"]
    statement: CSI node driver writes to its root filesystem
  - id: KSV-0017
    paths: ["tools/images/kubeadm-addons/manifests/csi-hostpath.yaml"]
    statement: CSI node driver must be privileged (Bidirectional mount propagation)
  - id: KSV-0118
    paths: ["tools/images/kubeadm-addons/manifests/csi-hostpath.yaml"]
    statement: CSI node driver runs as root
  - id: KSV-0121
    paths: ["tools/images/kubeadm-addons/manifests/csi-hostpath.yaml"]
    statement: CSI node driver mounts /dev to publish volumes
