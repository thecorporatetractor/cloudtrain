# Accepted misconfigurations in the lab-orchestrator's own manifests (iac.yml
# blocks on every other HIGH/CRITICAL). The operator builds each lab: Secrets
# (kubeconfigs, SSH keys), Roles/RoleBindings for vcluster, Services and
# NetworkPolicies, exec for setup and grading. Since the RBAC scope-down these sit
# in the session ClusterRole (config/rbac/session_role.yaml), which the manager binds
# only in lab namespaces; the cluster-wide ClusterRole keeps RoleBinding writes and
# bind on that one role, limited further by config/rbac/admission_policy.yaml
# (docs/deploy.md, Orchestrator RBAC).
misconfigurations:
  - id: KSV-0041
    statement: manages lab Secrets (kubeconfigs, SSH keys) by design
  - id: KSV-0050
    statement: binds its session ClusterRole (bind by resourceNames) and the vcluster Role in lab namespaces; no escalate
  - id: KSV-0053
    statement: execs into lab pods (lab namespaces) and ovn-central (kube-system Role, optional)
  - id: KSV-0056
    statement: creates per-lab Services, Endpoints and NetworkPolicies
