# Accepted misconfigurations in the lab-orchestrator's own manifests (iac.yml
# blocks on every other HIGH/CRITICAL). The operator builds each lab: it creates
# per-lab namespaces, Secrets (kubeconfigs, SSH keys), Roles/RoleBindings for
# learners and vcluster, Services/NetworkPolicies, and execs into lab pods for
# setup and grading. Follow-up before production: a ValidatingAdmissionPolicy
# that limits its ServiceAccount to lab namespaces and lab-labelled roles.
misconfigurations:
  - id: KSV-0041
    statement: manages lab Secrets (kubeconfigs, SSH keys) by design
  - id: KSV-0050
    statement: binds learner/vcluster roles in lab namespaces (escalate/bind)
  - id: KSV-0053
    statement: execs into lab pods for setup actions and grading
  - id: KSV-0056
    statement: creates per-lab Services, Endpoints and NetworkPolicies
