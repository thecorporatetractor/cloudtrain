# Trivy ignores for the image gate in images.yml (--ignorefile). Same rules as
# .grype.yaml: the narrowest path, a reason, and an expiry date to re-check.
vulnerabilities:
  # IaC workstation (tools/images/iac): the offline provider mirror ships upstream
  # HashiCorp provider builds, byte for byte (sha256 from their signed SHA256SUMS).
  # Older releases are there on purpose (version-constraint labs) and cannot be rebuilt.
  # Providers run only as plugin child processes of terraform/tofu inside the learner's
  # pod, talking gRPC over a local mTLS connection to that one process.
  - id: GHSA-r277-6w6q-xmqw
    paths: ["opt/cloudtrain/providers/**/hashicorp/kubernetes/3.3.0/**"]
    statement: kin-openapi ValidationHandler fail-open authentication; the provider uses kin-openapi only to read OpenAPI schemas and serves no HTTP API. 3.3.0 is the newest kubernetes provider.
    expired_at: 2027-01-31
  - id: CVE-2026-33186
    paths: ["opt/cloudtrain/providers/**/hashicorp/random/3.8.1/**", "opt/cloudtrain/providers/**/hashicorp/random/3.7.2/**"]
    statement: gRPC authz-interceptor path bypass; provider plugins use no gRPC authorization policies. Old random releases are kept for the version-constraint labs.
    expired_at: 2027-01-31
  - id: CVE-2025-68121
    paths: ["opt/cloudtrain/providers/**/hashicorp/random/3.8.1/**", "opt/cloudtrain/providers/**/hashicorp/random/3.7.2/**"]
    statement: crypto/tls session resumption with a Config mutated between handshakes; the plugin TLS config is fixed per process. Old random releases are kept for the version-constraint labs.
    expired_at: 2027-01-31
