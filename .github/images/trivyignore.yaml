# Trivy ignores for the image gate in images.yml (--ignorefile). Same rules as
# .grype.yaml: the narrowest path, a reason, and an expiry date to re-check.
vulnerabilities:
  # IaC workstation (tools/images/iac): the offline provider mirror ships upstream
  # HashiCorp provider builds, byte for byte (sha256 from their signed SHA256SUMS).
  # Older releases are there on purpose (version-constraint labs) and cannot be rebuilt.
  # Providers run only as plugin child processes of terraform/tofu inside the learner's
  # pod, talking gRPC over a local mTLS connection to that one process.
  - id: GHSA-r277-6w6q-xmqw
    paths: ["opt/cloudtrain/providers/**/hashicorp/kubernetes/3.3.0/**"]
    statement: kin-openapi ValidationHandler fail-open authentication; the provider uses kin-openapi only to read OpenAPI schemas and serves no HTTP API. 3.3.0 is the newest kubernetes provider.
    expired_at: 2027-01-31
  - id: CVE-2026-33186
    paths: ["opt/cloudtrain/providers/**/hashicorp/random/3.8.1/**", "opt/cloudtrain/providers/**/hashicorp/random/3.7.2/**"]
    statement: gRPC authz-interceptor path bypass; provider plugins use no gRPC authorization policies. Old random releases are kept for the version-constraint labs.
    expired_at: 2027-01-31
  - id: CVE-2025-68121
    paths: ["opt/cloudtrain/providers/**/hashicorp/random/3.8.1/**", "opt/cloudtrain/providers/**/hashicorp/random/3.7.2/**"]
    statement: crypto/tls session resumption with a Config mutated between handshakes; the plugin TLS config is fixed per process. Old random releases are kept for the version-constraint labs.
    expired_at: 2027-01-31
  # Round 2 additions: staged Terraform 1.5.7 (the last MPL-2.0 release, kept only for the
  # migration lab; it runs as the learner inside the lab pod, never as a server) and the
  # older providers the upgrade labs start from (kubernetes 2.38.0, vsphere 2.12.0, the
  # newest vsphere build on releases.hashicorp.com). Upstream builds, cannot be rebuilt.
  - id: CVE-2024-24790
    paths: ["opt/cloudtrain/terraform/1.5.7/**"]
    statement: net/netip IPv4-mapped address classification; terraform 1.5.7 is a CLI run by the learner in the lab pod and exposes no network service.
    expired_at: 2027-01-31
  - id: CVE-2024-3817
    paths: ["opt/cloudtrain/terraform/1.5.7/**"]
    statement: go-getter git argument injection; the migration lab uses no remote module sources with terraform 1.5.7 (offline, mirror only).
    expired_at: 2027-01-31
  - id: CVE-2025-68121
    paths: ["opt/cloudtrain/terraform/1.5.7/**", "opt/cloudtrain/providers/**/hashicorp/vsphere/2.12.0/**", "opt/cloudtrain/providers/**/hashicorp/kubernetes/2.38.0/**"]
    statement: crypto/tls session resumption with a Config mutated between handshakes; these binaries never mutate their TLS config. Kept for the migration and upgrade labs.
    expired_at: 2027-01-31
  - id: CVE-2026-33186
    paths: ["opt/cloudtrain/terraform/1.5.7/**", "opt/cloudtrain/providers/**/hashicorp/vsphere/2.12.0/**", "opt/cloudtrain/providers/**/hashicorp/kubernetes/2.38.0/**"]
    statement: gRPC authz-interceptor path bypass; plugins and the CLI use no gRPC authorization policies. Kept for the migration and upgrade labs.
    expired_at: 2027-01-31
  - id: GHSA-r277-6w6q-xmqw
    paths: ["opt/cloudtrain/providers/**/hashicorp/kubernetes/2.38.0/**"]
    statement: kin-openapi ValidationHandler fail-open; the provider only reads OpenAPI schemas and serves no HTTP API. 2.38.0 is the start point of the major-upgrade labs.
    expired_at: 2027-01-31
