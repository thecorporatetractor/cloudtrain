# Helm charts (deploy/charts): embedded copies in sync with their sources, lint
# and render every example values file, the chart's behaviour tests
# (tools/charts/test.sh), and kube-linter + Trivy (HIGH+) over the rendered
# manifests. Blocking for chart changes.
# Publish: on push to main (and manual runs) every chart whose Chart.yaml version is not
# in GHCR yet is packaged and pushed as an OCI artifact to
# ghcr.io/<owner>/<repo>/charts/<chart>:<version> with a cosign keyless signature and
# SLSA provenance. Bumping a chart's version is what releases it. A tag
# <chart>-<version> (cloudtrain-0.2.0, cloudtrain-crds-0.2.0) releases that chart and
# must match its Chart.yaml. Published versions are never overwritten.
name: charts

on:
  push:
    branches: [main]
    tags: ['cloudtrain-[0-9]*', 'cloudtrain-crds-[0-9]*']
  pull_request:
    paths:
      - deploy/charts/**
      - deploy/images/**
      - services/lab-orchestrator/config/**
      - tools/charts/**
      - .github/workflows/charts.yml
      - .github/scripts/install-tools.sh
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  charts:
    name: helm (lint, template, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/install-tools.sh helm kube-linter trivy
      - run: helm version --short && yq --version
      - name: Chart tests (sync, lint, render, behaviour)
        run: OUT=rendered bash tools/charts/test.sh
      - name: Gate - kube-linter on the rendered examples
        run: kube-linter lint rendered/values-*.yaml
      - name: Gate - Trivy HIGH/CRITICAL on the rendered examples
        run: >-
          trivy config --severity HIGH,CRITICAL --exit-code 1
          --ignorefile .github/iac/trivyignore.yaml rendered

  publish:
    name: publish (${{ matrix.chart }})
    needs: charts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless + attestations (Sigstore OIDC)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        chart: [cloudtrain-crds, cloudtrain]
    env:
      CHART: ${{ matrix.chart }}
      REPO: ${{ github.repository }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/install-tools.sh helm
      - name: Is this version published?
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(yq -r .version "deploy/charts/$CHART/Chart.yaml")
          if [[ $REF_TYPE == tag ]]; then
            # a tag releases the chart it names, and only at the version in Chart.yaml
            case $REF_NAME in
              "$CHART-$version") ;;
              "$CHART"-[0-9]*) echo "::error::tag $REF_NAME does not match $CHART $version in Chart.yaml"; exit 1 ;;
              *) echo "tag $REF_NAME is not for $CHART"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          ref="ghcr.io/${REPO,,}/charts"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          if helm show chart "oci://$ref/$CHART" --version "$version" >/dev/null 2>&1; then
            echo "$CHART $version is already published"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "publish=true"; echo "version=$version"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"
      - name: Package and push
        id: push
        if: steps.v.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REF: ${{ steps.v.outputs.ref }}
        run: |
          helm package "deploy/charts/$CHART" --destination out
          pushed=$(helm push "out/$CHART-$VERSION.tgz" "oci://$REF" 2>&1 | tee /dev/stderr)
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' <<<"$pushed" | tail -1)
          [[ -n $digest ]] || { echo "::error::no digest in the helm push output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.v.outputs.publish == 'true'
      - name: cosign sign (keyless, by digest)
        if: steps.v.outputs.publish == 'true'
        env:
          REF: ${{ steps.v.outputs.ref }}/${{ matrix.chart }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.v.outputs.publish == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository }}/charts/${{ matrix.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
