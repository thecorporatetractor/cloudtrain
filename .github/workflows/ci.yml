# Build, test and content gates. Every job here is a required check on main.
# Path-aware on pull requests (docs/security-ci.md, "What runs when"): the
# `changes` job classifies the PR's files; a job a change does not need is
# skipped, which satisfies its required check. A content-only PR runs the node
# and go jobs in content mode (content gates, no full build/test). Push to main
# and manual runs skip `changes` and run everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's files
    outputs:
      content: ${{ steps.c.outputs.content }}
      node: ${{ steps.c.outputs.node }}
      go: ${{ steps.c.outputs.go }}
      licenses: ${{ steps.c.outputs.licenses }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/changes.sh --pr "$PR" >> "$GITHUB_OUTPUT"

  # Gated jobs run when `changes` was skipped (not a PR) or failed (fail-safe), or
  # when their group is on; they are skipped (= success) otherwise.
  node:
    name: node (build, typecheck, test, content)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.node == 'true' || needs.changes.outputs.content == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # Content mode needs no database: an empty image skips the service.
        image: ${{ (needs.changes.result != 'success' || needs.changes.outputs.node == 'true') && 'postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873' || '' }}
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      # Owner connection of the gateway's DB test suites (roles from deploy/dev/postgres/init.sql).
      CT_TEST_DATABASE_URL: postgres://cloudtrain_owner:owner-dev-only@127.0.0.1:5432/cloudtrain
      # true: the full TypeScript build and test; false: content mode only.
      FULL: ${{ needs.changes.result != 'success' || needs.changes.outputs.node == 'true' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lab-orchestrator/go.mod
          cache-dependency-path: services/lab-orchestrator/go.sum
      - name: Postgres roles (deploy/dev/postgres/init.sql)
        if: env.FULL == 'true'
        env:
          PGPASSWORD: postgres-ci-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f deploy/dev/postgres/init.sql
      - run: pnpm install --frozen-lockfile
      - name: labctl (the gateway's compiler tests use it)
        run: go build -o services/lab-orchestrator/bin/labctl ./services/lab-orchestrator/cmd/labctl
      - if: env.FULL == 'true'
        run: pnpm -r build
      - if: env.FULL == 'true'
        run: pnpm -r --if-present typecheck
      - if: env.FULL == 'true'
        run: pnpm -r test
      - name: Content mode - schema, lab-verify and gateway content tests
        if: env.FULL != 'true'
        run: |
          pnpm --filter "@cloudtrain/gateway^..." build
          pnpm --filter @cloudtrain/lab-schema --filter @cloudtrain/lab-verify test
          pnpm --filter @cloudtrain/gateway exec vitest run --testTimeout=30000 test/content.test.ts
      - name: lab-verify --strict
        run: node tools/lab-verify/bin/lab-verify.mjs --strict
      - name: docs/curriculum.md is up to date
        run: node tools/curriculum/render.mjs --check

  go:
    name: go (vet, test, build, generate drift, labs)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.content == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # true: vet, test, build, generate drift, catalog check; false: labctl + the lab gates.
      FULL: ${{ needs.changes.result != 'success' || needs.changes.outputs.go == 'true' }}
    defaults:
      run:
        working-directory: services/lab-orchestrator
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lab-orchestrator/go.mod
          cache-dependency-path: services/lab-orchestrator/go.sum
      - if: env.FULL == 'true'
        run: go vet ./...
      - if: env.FULL == 'true'
        run: go test -race ./...
      - name: envtest (RBAC and admission policy, tier sandboxes; a real API server)
        if: env.FULL == 'true'
        run: make test-envtest
      - if: env.FULL == 'true'
        run: make build
      - if: env.FULL != 'true'
        run: make labctl
      - name: make generate leaves no diff (schema copy, deepcopy, CRDs, RBAC)
        if: env.FULL == 'true'
        run: |
          make generate
          git diff --exit-code -- . ../../packages/lab-schema
          test -z "$(git status --porcelain -- .)"
      - name: labctl catalog check (CI publishes only publishable images; never Terraform)
        if: env.FULL == 'true'
        run: bin/labctl catalog check --catalog ../../deploy/images/catalog.yaml,../../deploy/images/overlays/iac-opentofu.yaml --workflow ../../.github/workflows/images.yml
      - name: labctl validate (every pack)
        run: |
          for d in ../../content/packs/*/labs; do bin/labctl validate "$d"; done
          make samples
      - name: labctl exam compile (exams whose pools are complete)
        # The other curriculum exams wait for their pool labs (docs/handoffs/security-ci.md);
        # add an exam here once `bin/labctl exam compile <id>` passes.
        run: |
          bin/labctl exam compile sim-k8s-admin sim-k8s-developer sim-k8s-security sim-iac-associate sim-iac-advanced sim-el-automation sim-containers-docker sim-containers-podman sim-linux-pro >/dev/null
          bin/labctl exam compile --exams testdata/exams/exams.yaml --labs testdata/exams/tasks sim-test-k8s-dev >/dev/null

  licenses:
    name: licenses (inventory drift, copyleft gate)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.licenses == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lab-orchestrator/go.mod
          cache-dependency-path: services/lab-orchestrator/go.sum
      - run: pnpm install --frozen-lockfile
      - name: go-licenses (built by the module's toolchain)
        working-directory: services/lab-orchestrator
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: THIRD_PARTY_LICENSES.md is up to date
        run: |
          bash tools/licenses/inventory.sh
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            git diff --stat -- THIRD_PARTY_LICENSES.md
            # Dependabot bumps change versions in the inventory on every PR; the copyleft
            # gate below still blocks, and the inventory is refreshed after merging.
            if [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
              echo "::warning::THIRD_PARTY_LICENSES.md needs regenerating after this dependency update (tools/licenses/inventory.sh)"
            else
              echo "::error::THIRD_PARTY_LICENSES.md is stale: run tools/licenses/inventory.sh and commit it"; exit 1
            fi
          fi
      - name: No GPL/LGPL/AGPL/SSPL in production dependencies
        run: bash tools/licenses/check.sh
