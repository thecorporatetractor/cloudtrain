# CodeQL (advanced setup): keep the repository's code scanning "default setup"
# OFF, or the two configurations conflict. Blocking via the code scanning merge
# protection rule (high or higher), see docs/security-ci.md.
# Not path-filtered: the ruleset's code scanning rule needs results for every
# configuration main has (/language:go, javascript-typescript, actions) on each PR,
# or it reports "configurations not found" and blocks the merge.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per language. No matrix: GitHub would append the matrix values to the
  # check name, so the language comes from the job's env and the steps are a shared
  # YAML anchor.
  analyze-js:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: &codeql-permissions
      actions: read
      contents: read
      security-events: write
    env:
      LANGUAGE: javascript-typescript
      BUILD_MODE: none
    steps: &codeql-steps
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.LANGUAGE == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lab-orchestrator/go.mod
          cache: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ env.LANGUAGE }}
          build-mode: ${{ env.BUILD_MODE }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - 'apps/web/public/mockServiceWorker.js'
              - '**/*.generated.ts'
      - if: env.LANGUAGE == 'go'
        name: Build (go)
        working-directory: services/lab-orchestrator
        run: go build ./...
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ env.LANGUAGE }}

  analyze-go:
    name: analyze (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: *codeql-permissions
    env:
      LANGUAGE: go
      BUILD_MODE: manual
    steps: *codeql-steps

  analyze-actions:
    name: analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: *codeql-permissions
    env:
      LANGUAGE: actions
      BUILD_MODE: none
    steps: *codeql-steps
