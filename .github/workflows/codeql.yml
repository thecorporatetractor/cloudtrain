# CodeQL (advanced setup): keep the repository's code scanning "default setup"
# OFF, or the two configurations conflict. Blocking via the code scanning merge
# protection rule (high or higher), see docs/security-ci.md.
# Path-aware on pull requests: one job per language (literal check names, so a
# skipped job still satisfies its required check), gated by the `changes` job.
# Push to main, the weekly schedule and manual runs analyze every language.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's files
    outputs:
      js: ${{ steps.c.outputs.js }}
      go: ${{ steps.c.outputs.go }}
      actions: ${{ steps.c.outputs.actions }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/changes.sh --pr "$PR" >> "$GITHUB_OUTPUT"

  # Each job runs when `changes` was skipped (not a PR) or failed (fail-safe), or
  # when its language's files changed. The one-entry matrix keeps the shared steps.
  analyze-js:
    name: analyze (javascript-typescript)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.js == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: &codeql-permissions
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps: &codeql-steps
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lab-orchestrator/go.mod
          cache: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - 'apps/web/public/mockServiceWorker.js'
              - '**/*.generated.ts'
      - if: matrix.language == 'go'
        name: Build (go)
        working-directory: services/lab-orchestrator
        run: go build ./...
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  analyze-go:
    name: analyze (go)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: *codeql-permissions
    strategy:
      matrix:
        include:
          - language: go
            build-mode: manual
    steps: *codeql-steps

  analyze-actions:
    name: analyze (actions)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.actions == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: *codeql-permissions
    strategy:
      matrix:
        include:
          - language: actions
            build-mode: none
    steps: *codeql-steps
