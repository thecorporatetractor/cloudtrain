# Container images that CI can build: the platform (lab-orchestrator, gateway,
# web) and the lab images, but not the KubeVirt golden VM images, which need KVM
# (vm-images.yml; docs/deploy.md, "Publishing containerDisks"), nor tools/images/linux-pod,
# which needs the package mirror as a build context. Pull requests build only the
# images whose inputs changed (`plan` job, per-image `paths`). Every build: Trivy +
# Grype (fail on a CRITICAL vulnerability that has a fix; SARIF for fixable findings only, per
# tier, see docs/security-ci.md), full reports and SBOMs as artifacts. Push to main and v* tags
# only: push to GHCR, cosign keyless signature, SLSA build provenance and SBOM
# attestations (stored in the registry and in GitHub's attestation store).
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - services/lab-orchestrator/**
      - services/gateway/**
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - .dockerignore
      - tools/images/jumphost/**
      - tools/images/netdev/**
      - tools/images/iac/**
      - tools/images/ansible/**
      - tools/images/oci-registry/**
      - tools/images/kql-ws/**
      - deploy/versions.env
      - deploy/vcluster/values.yaml
      - .github/workflows/images.yml
      - .github/scripts/install-tools.sh
      - .github/scripts/build-args.sh
      - .github/scripts/image-matrix.sh
      - .github/images/**
  schedule:
    - cron: '23 1 * * *' # rescan for newly published vulnerabilities
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests build and scan only the images whose inputs changed (the
  # per-image `paths` in the publish matrix below). Push to main, v* tags, the
  # nightly rescan and manual runs build every image.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's files
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            bash .github/scripts/image-matrix.sh .github/workflows/images.yml --pr "$PR" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/image-matrix.sh .github/workflows/images.yml --all >> "$GITHUB_OUTPUT"
          fi

  build-scan:
    name: build + scan (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ci.local/${{ matrix.name }}:scan
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build args from deploy/versions.env
        id: args
        env:
          ARGS: ${{ matrix.args }}
        run: bash .github/scripts/build-args.sh "$ARGS" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ steps.args.outputs.list }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          provenance: false
      - run: bash .github/scripts/install-tools.sh trivy grype syft
      # Full reports: every finding, every severity, fixed or not. Kept as a workflow
      # artifact and summarised in the job summary; never uploaded to code scanning.
      - name: Trivy full report
        run: |
          trivy image --scanners vuln,secret --format json --output trivy-full.json "$IMAGE"
          trivy convert --format table --output trivy-full.txt trivy-full.json
      - name: Grype full report
        run: grype -o json=grype-full.json -o table=grype-full.txt "$IMAGE"
      # Code scanning gets only what someone can act on (docs/security-ci.md, "Image scan
      # policy"). Platform images: fixable HIGH and CRITICAL. Lab and workstation images
      # (they bundle third-party tools on purpose): fixable CRITICAL, Trivy only.
      - name: Trivy SARIF (fixable, by tier)
        env:
          TIER: ${{ matrix.tier }}
        run: |
          sev=CRITICAL; [[ $TIER == platform ]] && sev=HIGH,CRITICAL
          trivy image --scanners vuln,secret --severity "$sev" --ignore-unfixed \
            --format sarif --output trivy.sarif "$IMAGE"
      - name: Grype SARIF (platform images only; fixable HIGH and CRITICAL)
        if: matrix.tier == 'platform'
        run: |
          grype --only-fixed -o sarif=grype-all.sarif "$IMAGE"
          # Grype SARIF level: error = Critical or High; warning/note = the rest
          jq '.runs[] |= (
                .results = [(.results // [])[] | select(.level == "error")]
                | ([.results[].ruleId] | unique) as $ids
                | .tool.driver.rules = [(.tool.driver.rules // [])[] | select(.id as $i | $ids | index($i))])' \
            grype-all.sarif > grype.sarif
      - name: Job summary
        env:
          NAME: ${{ matrix.name }}
          TIER: ${{ matrix.tier }}
        run: |
          {
            echo "### $NAME ($TIER image)"
            echo
            echo "Full reports: artifact \`scan-reports-$NAME\`. Code scanning receives fixable findings only (docs/security-ci.md)."
            echo
            echo "| Scanner | Severity | All | With a fix |"
            echo "|---|---|---|---|"
            for sev in CRITICAL HIGH MEDIUM LOW; do
              t=$(jq --arg s "$sev" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $s)] | length' trivy-full.json)
              f=$(jq --arg s "$sev" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $s and (.FixedVersion // "") != "")] | length' trivy-full.json)
              echo "| Trivy | $sev | $t | $f |"
              g=$(jq --arg s "$sev" '[.matches[] | select((.vulnerability.severity | ascii_upcase) == $s)] | length' grype-full.json)
              gf=$(jq --arg s "$sev" '[.matches[] | select((.vulnerability.severity | ascii_upcase) == $s and .vulnerability.fix.state == "fixed")] | length' grype-full.json)
              echo "| Grype | $sev | $g | $gf |"
            done
            echo
            echo "<details><summary>Fixable CRITICAL and HIGH (Trivy, first 200)</summary>"
            echo
            echo "| Severity | Package | Installed | Fixed in | CVE |"
            echo "|---|---|---|---|---|"
            jq -r '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and (.FixedVersion // "") != "")]
                   | sort_by(.Severity) | .[:200][]
                   | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) |"' trivy-full.json
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: SBOMs (SPDX + CycloneDX)
        env:
          NAME: ${{ matrix.name }}
        run: |
          syft scan "docker:$IMAGE" --source-name "$NAME" \
            -o "spdx-json=sbom-$NAME.spdx.json" -o "cyclonedx-json=sbom-$NAME.cdx.json"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-image-${{ matrix.name }}
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && matrix.tier == 'platform' && hashFiles('grype.sarif') != ''
        with:
          sarif_file: grype.sarif
          category: grype-image-${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scan-reports-${{ matrix.name }}
          path: |
            trivy-full.json
            trivy-full.txt
            grype-full.json
            grype-full.txt
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.*.json
          retention-days: 30
      - name: Gate - no fixable CRITICAL vulnerability (Trivy)
        run: >-
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile .github/images/trivyignore.yaml "$IMAGE"
      - name: Gate - no fixable CRITICAL vulnerability (Grype)
        if: always()
        run: grype --only-fixed --fail-on critical "$IMAGE"

  publish:
    name: publish (${{ matrix.name }})
    needs: build-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless + attestations (Sigstore OIDC)
      attestations: write
    strategy:
      fail-fast: false
      # The image list: name, build context, Dockerfile, build args (deploy/versions.env)
      # and the paths that rebuild it on a pull request (.github/scripts/image-matrix.sh;
      # images.yml, the shared scripts and deploy/versions.env for images with args
      # rebuild all). labctl catalog check reads the names from here.
      matrix:
        include:
          - name: lab-orchestrator
            tier: platform
            paths: services/lab-orchestrator/* go.work go.work.sum deploy/vcluster/values.yaml deploy/versions.env .dockerignore
            context: .
            file: services/lab-orchestrator/Dockerfile
            args: ''
          # Platform: the gateway (BFF + labctl + content) and the web app (static build
          # behind unprivileged nginx). Deployed by deploy/charts/cloudtrain.
          - name: gateway
            tier: platform
            paths: services/gateway/* services/lab-orchestrator/* packages/* content/* pnpm-lock.yaml package.json pnpm-workspace.yaml turbo.json .dockerignore
            context: .
            file: services/gateway/Dockerfile
            args: ''
          - name: web
            tier: platform
            paths: apps/web/* packages/* pnpm-lock.yaml package.json pnpm-workspace.yaml turbo.json .dockerignore
            context: .
            file: apps/web/Dockerfile
            args: ''
          - name: jumphost
            tier: lab
            paths: tools/images/jumphost/*
            context: tools/images/jumphost
            file: tools/images/jumphost/Dockerfile
            # build arg (=versions.env variable when the names differ), see tools/images/build-jumphost.sh
            args: >-
              UBUNTU_APT_SNAPSHOT KUBECTL_VERSION=LAB_K8S_VERSION HELM_VERSION HELM_TARBALL_SHA256
              ETCD_VERSION ETCD_TARBALL_SHA256 YQ_VERSION YQ_BINARY_SHA256
          - name: frr
            tier: lab
            paths: tools/images/netdev/frr/*
            context: tools/images/netdev/frr
            file: tools/images/netdev/frr/Dockerfile
            args: ''
          - name: nettools
            tier: lab
            paths: tools/images/netdev/nettools/*
            context: tools/images/netdev/nettools
            file: tools/images/netdev/nettools/Dockerfile
            args: ''
          - name: netsvc
            tier: lab
            paths: tools/images/netdev/netsvc/*
            context: tools/images/netdev/netsvc
            file: tools/images/netdev/netsvc/Dockerfile
            args: ''
          # In-lab OCI registry (catalog oci-registry:3): thin layer on CNCF Distribution registry:3.
          - name: oci-registry
            tier: lab
            paths: tools/images/oci-registry/*
            context: tools/images/oci-registry
            file: tools/images/oci-registry/Dockerfile
            args: ''
          # IaC workstation, OpenTofu flavour only (IAC_CLI=tofu, no BUSL binary). The
          # Terraform flavour is built locally with tools/images/build-iac-ws.sh and is
          # never published from public CI (decision 2026-10-17, docs/handoff.md).
          - name: iac-ws-tofu
            tier: lab
            paths: tools/images/iac/*
            context: tools/images/iac
            file: tools/images/iac/Dockerfile
            args: >-
              IAC_CLI=IAC_CLI_PUBLISHED UBUNTU_APT_SNAPSHOT KUBECTL_VERSION=LAB_K8S_VERSION HELM_VERSION HELM_TARBALL_SHA256
              YQ_VERSION YQ_BINARY_SHA256 TERRAFORM_VERSION TERRAFORM_ZIP_SHA256
              TOFU_VERSION TOFU_ZIP_SHA256 SEAWEEDFS_VERSION SEAWEEDFS_TARBALL_SHA256
              TERRAFORM_STAGED_19_VERSION TERRAFORM_STAGED_19_ZIP_SHA256 TERRAFORM_STAGED_15_VERSION
              TERRAFORM_STAGED_15_ZIP_SHA256 TERRAFORM_STAGED_15_LICENSE_SHA256 CONFTEST_VERSION CONFTEST_TARBALL_SHA256
              GOVMOMI_VERSION VCSIM_TARBALL_SHA256 ORAS_VERSION ORAS_TARBALL_SHA256 DISTRIBUTION_VERSION DISTRIBUTION_TARBALL_SHA256
          # Ansible control node (catalog ansible-ctl:2.21). ansible-core is GPL-3.0-or-later,
          # shipped as a separate program with its licence text (docs/handoffs/automation.md).
          - name: ansible-ctl
            tier: lab
            paths: tools/images/ansible/*
            context: tools/images/ansible
            file: tools/images/ansible/Dockerfile
            args: UBUNTU_APT_SNAPSHOT ANSIBLE_CORE_VERSION
          # KQL workstation (catalog kql-ws:1): KustoLoco (MIT) + tools/images/kql-ws/patches,
          # Kusto.Language from Apache-2.0 source, Azure-Sentinel sample data (MIT). The build
          # runs KustoLoco's test suites on the patched tree.
          - name: kql-ws
            tier: lab
            paths: tools/images/kql-ws/*
            context: tools/images/kql-ws
            file: tools/images/kql-ws/Dockerfile
            args: >-
              UBUNTU_APT_SNAPSHOT KUSTOLOCO_VERSION KUSTOLOCO_COMMIT KUSTO_LANGUAGE_COMMIT
              AZURE_SENTINEL_COMMIT AZURE_SENTINEL_LICENSE_SHA256
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and build args
        id: args
        env:
          ARGS: ${{ matrix.args }}
          REPO: ${{ github.repository }}
          NAME: ${{ matrix.name }}
        run: |
          echo "image=ghcr.io/${REPO,,}/$NAME" >> "$GITHUB_OUTPUT"
          bash .github/scripts/build-args.sh "$ARGS" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.args.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ steps.args.outputs.list }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: false # SLSA provenance comes from attest-build-provenance below
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign (keyless, by digest)
        env:
          REF: ${{ steps.args.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.args.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - run: bash .github/scripts/install-tools.sh syft
      - name: SBOM of the pushed image
        env:
          REF: ${{ steps.args.outputs.image }}@${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          syft scan "registry:$REF" --source-name "$NAME" \
            -o "spdx-json=sbom-$NAME.spdx.json" -o "cyclonedx-json=sbom-$NAME.cdx.json"
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.args.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-published-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.*.json
          retention-days: 90
      - name: Record the pushed digest (for the release catalog overlay)
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p digests && printf '%s\n' "$DIGEST" > "digests/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 90

  # The release catalog overlay: every publishable catalog ref (deploy/images/catalog.yaml
  # plus the OpenTofu overlay: Terraform is never published) mapped to
  # ghcr.io/<repo>/<name>@<digest> of this run. Workflow artifact on every push; attached
  # to the GitHub release on v* tags. Clusters merge it over the catalog (Helm value
  # orchestrator.catalog.releaseOverlay) and, when they pull from their own registry,
  # rewrite the registry with orchestrator.images.mirrors (docs/deploy.md).
  catalog-overlay:
    name: catalog overlay
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # attach the overlay to the release (v* tags)
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lab-orchestrator/go.mod
          cache: false # a publishing workflow: no cache that a PR could poison
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Generate the overlay
        env:
          REPO: ${{ github.repository }}
        run: |
          cd services/lab-orchestrator && GOWORK=off go build -o ../../labctl ./cmd/labctl && cd ../..
          ./labctl catalog check --catalog deploy/images/catalog.yaml,deploy/images/overlays/iac-opentofu.yaml --workflow .github/workflows/images.yml
          ./labctl catalog overlay --allow-missing \
            --catalog deploy/images/catalog.yaml,deploy/images/overlays/iac-opentofu.yaml \
            --registry "ghcr.io/${REPO,,}" --digests digests > catalog-release.yaml
          cat catalog-release.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-release
          path: catalog-release.yaml
          retention-days: 90
      - name: Attach to the release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "CloudTrain $TAG"
          gh release upload "$TAG" catalog-release.yaml --clobber
