# Static analysis. Blocking: actionlint, zizmor (medium+), shellcheck (warning+),
# hadolint (error). Report-only (SARIF to code scanning, triaged there): semgrep,
# gosec, hadolint warnings, zizmor (all). See docs/security-ci.md.
# Path-aware on pull requests (`changes` job): semgrep when code outside
# content/ and docs/ changed, gosec for Go, the lint job for workflows, shell
# scripts and Dockerfiles. Push to main and the weekly run do everything.
name: sast

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's files
    outputs:
      code: ${{ steps.c.outputs.code }}
      go: ${{ steps.c.outputs.go }}
      lint: ${{ steps.c.outputs.lint }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/changes.sh --pr "$PR" >> "$GITHUB_OUTPUT"

  # Gated jobs run when `changes` was skipped (not a PR) or failed (fail-safe), or
  # when their group is on; they are skipped (= success) otherwise.
  semgrep:
    name: semgrep (report)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check semgrep==1.180.0
      - name: semgrep scan
        # content/ is training material: lab assets are deliberately insecure
        # (privileged pods, weak configs) for learners to find and fix.
        run: >-
          semgrep scan --metrics=off --timeout 60
          --config p/default --config p/typescript --config p/golang --config p/secrets
          --config p/dockerfile --config p/kubernetes
          --exclude content --exclude docs
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gosec:
    name: gosec (report)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/lab-orchestrator/go.mod
          cache-dependency-path: services/lab-orchestrator/go.sum
      - run: bash .github/scripts/install-tools.sh gosec
      - name: gosec
        working-directory: services/lab-orchestrator
        run: gosec -no-fail -exclude-generated -fmt sarif -out ../../gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: gosec.sarif
          category: gosec

  lint:
    name: hadolint, shellcheck, actionlint, zizmor
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lint == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/install-tools.sh actionlint hadolint shellcheck zizmor
      - name: hadolint (SARIF, all levels)
        run: git ls-files -z '*Dockerfile*' | xargs -0 hadolint --no-fail --format sarif > hadolint.sarif
      - name: zizmor (SARIF, all levels)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format sarif .github > zizmor.sarif || true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - name: hadolint (blocking at error)
        if: always()
        run: git ls-files -z '*Dockerfile*' | xargs -0 hadolint --failure-threshold error
      - name: shellcheck (blocking at warning; repo scripts, not lab content)
        if: always()
        run: git ls-files -z 'deploy/*.sh' 'tools/*.sh' 'services/*.sh' '.github/*.sh' | xargs -0 shellcheck -S warning
      - name: actionlint (blocking)
        if: always()
        run: actionlint -shellcheck "$(command -v shellcheck)"
      - name: zizmor (blocking at medium)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium .github
