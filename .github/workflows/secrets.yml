# gitleaks over git history only (never the working tree: gitignored build
# output such as apps/web/dist would trip it). PRs: the PR's commits (blocking).
# Push to main: the pushed commits. Nightly and manual: every commit on every
# branch. Reviewed false positives are allowlisted in .gitleaks.toml.
# Not path-filtered: a secret can land in any file, and the PR scan is quick.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '13 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/install-tools.sh gitleaks
      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          zero=0000000000000000000000000000000000000000
          case $EVENT in
            pull_request) opts="--no-merges $PR_BASE..$PR_HEAD" ;;
            push) if [[ -n $PUSH_BEFORE && $PUSH_BEFORE != "$zero" ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    opts="$PUSH_BEFORE..$PUSH_AFTER"; else opts="--all"; fi ;;
            *) git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*'; opts="--all" ;;
          esac
          echo "log-opts=$opts" >> "$GITHUB_OUTPUT"
          echo "gitleaks log-opts: $opts"
      - name: gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: >-
          gitleaks git --config .gitleaks.toml --redact --no-banner
          --log-opts="$LOG_OPTS"
          --report-format sarif --report-path gitleaks.sarif .
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
