# gitleaks configuration: the default rules plus allowlists for reviewed false
# positives (full-history scan of all branches, 2026-10-14; see
# docs/handoffs/security-ci.md). Keep every entry narrow and explained.
title = "CloudTrain gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "kubeadm documentation example bootstrap token used in unit tests"
regexTarget = "match"
regexes = ['''abcdef\.0123456789abcdef''']

[[allowlists]]
description = "Public APT repository signing-key fingerprints (deploy/versions.env)"
regexTarget = "line"
regexes = ['''^[A-Z0-9_]+_APT_KEY_FPR=[0-9A-F]{40}$''']

[[allowlists]]
description = "Keyboard shortcut definitions ({ keys: 'mod+shift+...' }) in the web app"
regexTarget = "match"
regexes = ['''keys:\s*'mod\+[a-z+]+''']
