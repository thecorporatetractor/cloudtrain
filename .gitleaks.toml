# gitleaks configuration: the default rules plus allowlists for reviewed false
# positives (full-history scan of all branches, 2026-10-14; see
# docs/handoffs/security-ci.md). Keep every entry narrow and explained.
title = "CloudTrain gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "kubeadm documentation example bootstrap token used in unit tests"
regexTarget = "match"
regexes = ['''abcdef\.0123456789abcdef''']

[[allowlists]]
description = "Public key fingerprints (40 hex) and sha256 pins (64 hex) of downloads in deploy/versions.env"
condition = "AND"
paths = ['''^deploy/versions\.env$''']
regexes = ['''^[0-9A-Fa-f]{40}$''', '''^[0-9a-f]{64}$''']

[[allowlists]]
description = "Keyboard shortcut definitions ({ keys: 'mod+shift+...' }) in the web app"
regexTarget = "match"
regexes = ['''keys:\s*'mod\+[a-z+]+''']

[[allowlists]]
description = "HashiCorp's public release-signing key fingerprint, pinned in the IaC provider lock script"
condition = "AND"
paths = ['''^tools/images/iac/lock-providers\.sh$''']
regexes = ['''^C874011F0AB405110D02105534365D9472D7468F$''']

[[allowlists]]
description = "Fixed lab-only credentials of the IaC workstation's in-pod S3 store (127.0.0.1 only, no data of value)"
condition = "AND"
paths = ['''^tools/images/iac/(ct-s3|s3\.json|aws-credentials)$''']
regexes = ['''saltmarsh-lab(-secret)?''']
