# Grype ignores for images.yml. Each entry: the narrowest match, a reason, and a
# date to re-check. Remove an entry once the upstream release ships the fix.
ignore:
  # HTTP/2 *server* flow-control bug (x/net < 0.60, Go < 1.26.9). It sits in
  # upstream CLI clients we download by checksum (helm in lab-orchestrator;
  # kubectl, helm, etcdctl, etcdutl in the jumphost), which never run an HTTP/2
  # server. Re-check 2026-11-15: bump HELM/LAB_K8S/ETCD versions when rebuilt.
  - vulnerability: GO-2026-6612
    reason: HTTP/2 server-side bug in upstream CLI client binaries (no server role)
    package:
      location: /usr/local/bin/*
  # IaC workstation (tools/images/iac): upstream HashiCorp provider builds in the offline
  # mirror (sha256 from their signed SHA256SUMS; older releases kept on purpose for the
  # version-constraint labs). Providers run only as plugin child processes of
  # terraform/tofu, serving gRPC to that one process over a local mTLS connection.
  # Re-check 2027-01-31, or when tools/images/iac/providers.txt changes.
  - vulnerability: GO-2026-6612
    reason: HTTP/2 server flow-control bug; the plugin server only talks to its parent terraform/tofu process
    package:
      location: /opt/cloudtrain/providers/**
  - vulnerability: GHSA-p77j-4mvh-x3m3
    reason: gRPC authz-interceptor path bypass; provider plugins use no gRPC authorization policies
    package:
      location: /opt/cloudtrain/providers/**
  - vulnerability: GO-2026-4337
    reason: crypto/tls resumption with a Config mutated between handshakes; plugin TLS config is fixed per process
    package:
      location: /opt/cloudtrain/providers/**
  - vulnerability: GO-2025-3563
    reason: net/http chunked-encoding request smuggling needs a front proxy; the plugin's gRPC server is reached only by its parent process (random 3.7.2, kept for version-constraint labs)
    package:
      location: /opt/cloudtrain/providers/**
  # Windows-only os.Root junction bug in the Go runtime of the Terraform 1.15.9 binary;
  # the workstation is Linux. Re-check when TERRAFORM_VERSION is bumped.
  - vulnerability: GO-2026-6604
    reason: Windows-only (junction handling in os.Root); the binary runs on Linux only
    package:
      location: /usr/local/bin/terraform
