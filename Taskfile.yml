# CloudTrain developer tasks (go-task v3). Run `task --list`.
# All versions are pinned in deploy/versions.env; see docs/dev-environment.md.
version: '3'

dotenv: ['deploy/versions.env']

env:
  PATH: '{{.HOME}}/.local/bin:{{.PATH}}'

tasks:
  default:
    cmds: [task --list]
    silent: true

  tools:
    desc: Install pinned CLIs (kind, task, vcluster, virtctl, jq, yq) into ~/.local/bin
    cmds: [bash deploy/scripts/install-tools.sh]

  dev:up:
    desc: Create/converge the kind cluster 'cloudtrain-dev' with Kube-OVN, Multus, KubeVirt (KVM), CDI
    deps: [tools]
    cmds: [bash deploy/scripts/dev-up.sh]

  dev:down:
    desc: Delete the kind cluster 'cloudtrain-dev' (leaves every other cluster/container alone)
    cmds: [bash deploy/scripts/dev-down.sh]

  dev:status:
    desc: Show cluster, add-on, KVM and lab namespace status
    cmds: [bash deploy/scripts/dev-status.sh]

  dev:verify-kvm:
    desc: Boot a throwaway VMI and prove libvirt uses KVM (not TCG)
    cmds: [bash deploy/scripts/verify-kvm.sh]

  image:build:
    desc: Build the golden kubeadm node image (alias of image:build:kubeadm-node)
    cmds: [task: 'image:build:kubeadm-node']

  image:build:kubeadm-node:
    desc: 'containerDisk cloudtrain/kubeadm-node:<LAB_K8S_VERSION> (catalog kubeadm:1.37): kubeadm node + preloaded images'
    cmds: [bash tools/images/build.sh kubeadm-node]

  image:build:kubeadm-upgrade:
    desc: 'containerDisk cloudtrain/kubeadm-node:<UPGRADE_IMAGE_TAG> (catalog kubeadm:1.36): N-1 node, LAB_K8S_VERSION staged offline'
    cmds: [bash tools/images/build.sh kubeadm-upgrade]

  image:build:etcd-host:
    desc: 'containerDisk <ETCD_HOST_IMAGE> (catalog etcd-host:3.6): etcd as a TLS systemd service + etcdctl/etcdutl'
    cmds: [bash tools/images/build.sh etcd-host]

  image:build:jumphost:
    desc: 'Learner workstation image <JUMPHOST_IMAGE> (catalog jumphost:1)'
    cmds: [bash tools/images/build-jumphost.sh]

  image:build:all:
    desc: Build every lab image, one at a time (VM builds are memory heavy)
    cmds:
      - task: 'image:build:jumphost'
      - task: 'image:build:kubeadm-node'
      - task: 'image:build:kubeadm-upgrade'
      - task: 'image:build:etcd-host'

  image:lock:
    desc: Re-resolve image digests into tools/images/lock/*.lock (after a version or catalog workloadImages change)
    cmds: [UPDATE_LOCK=1 LOCK_ONLY=1 bash tools/images/build.sh kubeadm-upgrade]

  image:load:
    desc: 'Load built images into kind (all, or IMAGES="kubeadm-node jumphost workloads")'
    cmds: ['bash tools/images/load.sh {{.IMAGES}}']

  image:load:workloads:
    desc: Pull the locked lab workload images (by digest) into every kind node, for virtual labs
    cmds: [bash tools/images/load.sh workloads]

  image:test:
    desc: 'Boot-test VM images on the dev cluster (all, or IMAGES="etcd-host")'
    cmds: ['bash tools/images/boot-test.sh {{.IMAGES}}']

  image:netdev:
    desc: Build the netdev lab images cloudtrain/frr:10 and cloudtrain/nettools:1 and load them into kind
    cmds: [bash tools/images/netdev/build.sh]

  lab:demo:
    desc: 'End-to-end lab proof: 2 kubeadm VMs + jumphost + vcluster in a fresh namespace (KEEP=1 to keep it)'
    cmds: [bash deploy/scripts/lab-demo.sh]

  lab:clean:
    desc: Delete all demo lab namespaces
    cmds: [bash deploy/scripts/lab-demo.sh --clean]

  # ------------------------------------------------------- platform dependencies
  # Postgres 17 (127.0.0.1:55432), Keycloak 26 (http://localhost:8180, admin/admin-dev-only),
  # Mailpit (http://localhost:8025, SMTP 1025). Compose project cloudtrain-dev-deps only.

  dev:deps:
    desc: 'Start Postgres, Keycloak and Mailpit (deploy/dev/compose.yaml), migrate, seed when empty, sync Keycloak organizations'
    cmds:
      - docker compose -f deploy/dev/compose.yaml up -d --wait
      - pnpm --filter @cloudtrain/gateway db:migrate
      - pnpm --filter @cloudtrain/gateway db:seed --if-empty
      - pnpm --filter @cloudtrain/gateway kc:sync

  dev:deps:down:
    desc: Stop the platform dependencies (data volume kept; dev:deps:reset also deletes it)
    cmds: [docker compose -f deploy/dev/compose.yaml down]

  dev:deps:reset:
    desc: Delete the platform dependencies and their data (fresh realm import and seed on next dev:deps)
    cmds: [docker compose -f deploy/dev/compose.yaml down -v]

  dev:seed:
    desc: 'Re-seed the fictional dev data (replaces the seeded orgs; DEV ONLY)'
    cmds: [pnpm --filter @cloudtrain/gateway db:seed, pnpm --filter @cloudtrain/gateway kc:sync]

  dev:realms:
    desc: Regenerate the Keycloak realm imports from deploy/dev/people.json (then dev:deps:reset + dev:deps)
    cmds: [node deploy/dev/keycloak/gen-realms.mjs]

  # ---------------------------------------------------------------- web + gateway
  # Real-mode development: `task dev:orchestrator`, `task dev:gateway` and
  # `task dev:web` in three terminals. Every kubectl/manager call is pinned to
  # CT_KUBE_CONTEXT; the kubeconfig's current-context is never changed.

  gateway:labctl:
    desc: Build the Go lab compiler the gateway shells out to (services/lab-orchestrator/bin/labctl)
    sources: ['services/lab-orchestrator/**/*.go', 'services/lab-orchestrator/internal/labschema/lab.schema.json']
    generates: [services/lab-orchestrator/bin/labctl]
    cmds: [go build -o services/lab-orchestrator/bin/labctl ./services/lab-orchestrator/cmd/labctl]

  dev:orchestrator:
    desc: Deploy the lab-orchestrator into the cluster for the web/gateway sessions (scoped to sessions the gateway creates; ephemeral VM disks)
    cmds:
      # In-cluster, not `go run`: the image bundles helm and the vcluster chart the drivers need.
      # Scoped by label so it never reconciles other managers' verify sessions.
      - for f in services/lab-orchestrator/config/crd/labs.cloudtrain.dev_*.yaml; do kubectl --context kind-{{.CLUSTER_NAME}} get -f "$f" >/dev/null 2>&1 || kubectl --context kind-{{.CLUSTER_NAME}} apply -f "$f"; done
      - ORCH_NAMESPACE=cloudtrain-system SESSION_SELECTOR=app.kubernetes.io/managed-by=cloudtrain-gateway SKIP_CRDS=1 VM_DISKS=${VM_DISKS:-ephemeral} LOAD_LAB_IMAGES=${LOAD_LAB_IMAGES:-0} bash deploy/scripts/orchestrator-deploy.sh

  dev:gateway:
    desc: Run services/gateway (BFF for apps/web) against CT_KUBE_CONTEXT, sessions in CT_NAMESPACE (default cloudtrain-sessions)
    deps: [gateway:labctl]
    vars:
      CTX: '{{.CT_KUBE_CONTEXT | default "kind-cloudtrain-dev"}}'
      NS: '{{.CT_NAMESPACE | default "cloudtrain-sessions"}}'
    env:
      CT_KUBE_CONTEXT: '{{.CTX}}'
      CT_NAMESPACE: '{{.NS}}'
      # Dev only: the acme-idp realm stands in for AzarGuard's Entra tenant (may grant platform_admin),
      # and domain verification accepts without the DNS TXT record.
      CT_PLATFORM_IDPS: '{{.CT_PLATFORM_IDPS | default "azarguard-entra,acme-idp"}}'
      CT_DEV_DOMAIN_VERIFY_BYPASS: '{{.CT_DEV_DOMAIN_VERIFY_BYPASS | default "1"}}'
    cmds:
      - pnpm --filter @cloudtrain/lab-schema build
      - kubectl --context {{.CTX}} get namespace {{.NS}} >/dev/null 2>&1 || kubectl --context {{.CTX}} create namespace {{.NS}}
      - pnpm --filter @cloudtrain/gateway dev

  dev:web:
    desc: Run apps/web in real API mode (proxies /api and the terminal WebSocket to the gateway on :8787)
    env:
      VITE_API_MODE: real
    cmds: [pnpm --filter web dev]

  dev:web:mock:
    desc: Run apps/web with the in-browser mock API (no cluster needed)
    cmds: [pnpm --filter web dev]

  orchestrator:deploy:
    desc: 'Build the lab-orchestrator image and deploy CRDs, RBAC and the manager into cloudtrain-dev (CATALOG_OVERLAY=<file> merges a local catalog overlay)'
    cmds: [bash deploy/scripts/orchestrator-deploy.sh]

  lab:verify:
    desc: 'Run the verifier cycle against the live cluster: task lab:verify -- [--only <lab-id>] [--parallel N] [--keep] <lab dir>...'
    dir: services/lab-orchestrator
    cmds:
      - go run ./cmd/labctl verify --context kind-{{.CLUSTER_NAME}} --repo-root {{.ROOT_DIR}} {{.CLI_ARGS}}

  curriculum:render:
    desc: 'Regenerate docs/curriculum.md from content/curriculum.yaml'
    cmds: [node tools/curriculum/render.mjs]

  curriculum:check:
    desc: 'Validate content (incl. content/curriculum.yaml) and check that docs/curriculum.md is up to date'
    cmds:
      - node tools/lab-verify/bin/lab-verify.mjs
      - node tools/curriculum/render.mjs --check
