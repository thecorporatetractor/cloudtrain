# CloudTrain developer tasks (go-task v3). Run `task --list`.
# All versions are pinned in deploy/versions.env; see docs/dev-environment.md.
version: '3'

dotenv: ['deploy/versions.env']

env:
  PATH: '{{.HOME}}/.local/bin:{{.PATH}}'

tasks:
  default:
    cmds: [task --list]
    silent: true

  tools:
    desc: Install pinned CLIs (kind, task, vcluster, virtctl, jq, yq) into ~/.local/bin
    cmds: [bash deploy/scripts/install-tools.sh]

  dev:up:
    desc: Create/converge the kind cluster 'cloudtrain-dev' with Kube-OVN, Multus, KubeVirt (KVM), CDI
    deps: [tools]
    cmds: [bash deploy/scripts/dev-up.sh]

  dev:down:
    desc: Delete the kind cluster 'cloudtrain-dev' (leaves every other cluster/container alone)
    cmds: [bash deploy/scripts/dev-down.sh]

  dev:status:
    desc: Show cluster, add-on, KVM and lab namespace status
    cmds: [bash deploy/scripts/dev-status.sh]

  dev:verify-kvm:
    desc: Boot a throwaway VMI and prove libvirt uses KVM (not TCG)
    cmds: [bash deploy/scripts/verify-kvm.sh]

  image:build:
    desc: Build the golden kubeadm node image (Ubuntu 24.04 + containerd + kubeadm) as a KubeVirt containerDisk
    cmds: [bash tools/images/build.sh]

  lab:demo:
    desc: 'End-to-end lab proof: 2 kubeadm VMs + jumphost + vcluster in a fresh namespace (KEEP=1 to keep it)'
    cmds: [bash deploy/scripts/lab-demo.sh]

  lab:clean:
    desc: Delete all demo lab namespaces
    cmds: [bash deploy/scripts/lab-demo.sh --clean]
