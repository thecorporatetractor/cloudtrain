# Production web server for apps/web (static build). Runs as an unprivileged
# user on a read-only root filesystem: everything nginx writes goes to /tmp
# (an emptyDir in Kubernetes). The server block is rendered at container start
# from templates/ (CT_* environment variables, see apps/web/Dockerfile).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 64k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  include /tmp/cloudtrain-web.conf;
}
