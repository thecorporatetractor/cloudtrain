<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>CloudTrain</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e6e8eb'/%3E%3Cpath d='M9 20.5h11.2a3.8 3.8 0 0 0 .5-7.56A5.3 5.3 0 0 0 10.4 14.9 3 3 0 0 0 9 20.5Z' fill='none' stroke='%230e0f11' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ct.theme');
        if (t === 'dark' || t === 'light' || t === 'cream') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
