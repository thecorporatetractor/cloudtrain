<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>CloudTrain</title>
    <meta name="description" content="Hands-on infrastructure training on real systems, graded automatically, with timed exam simulations." />
    <meta name="application-name" content="CloudTrain" />
    <meta name="apple-mobile-web-app-title" content="CloudTrain" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f11" />
    <!-- Brand assets: apps/web/public/brand, built by scripts/brand-assets.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Social cards. Scrapers need an absolute URL: a deployment rewrites og:image and og:url for its host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloudTrain" />
    <meta property="og:title" content="CloudTrain" />
    <meta property="og:description" content="Hands-on infrastructure training on real systems, graded automatically, with timed exam simulations." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Boot splash: the mark until React mounts (tokens.css is not loaded yet, so the colours are inlined). */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0e0f11;
        color: #ffffff;
      }
      [data-theme='light'] .boot {
        background: #f6f6f7;
        color: #111111;
      }
      [data-theme='cream'] .boot {
        background: #f1ece2;
        color: #111111;
      }
      .boot svg {
        width: 56px;
        height: auto;
        opacity: 0;
        animation: boot-in 240ms ease-out 160ms forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 0.9;
        }
      }
    </style>
    <script src="/theme-init.js"></script>
    <script src="/runtime-config.js"></script>
  </head>

    <div id="root">

        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
