domains:
  - id: kubernetes
    title: Kubernetes
    summary: "Operate, develop for and secure Kubernetes clusters on real kubeadm VMs and virtual clusters: workloads, scheduling, networking, storage, access control, cluster lifecycle, troubleshooting and security hardening, graded against live cluster state."
    skillDomain: k8s
    owner: kubernetes-content
    organisation:
      name: Quillmoor Logistics
      summary: A fictional freight and parcel logistics operator with depots, a container yard, a harbour terminal and a customs desk. Clusters are named qm-<area>; nodes <area>-cp-N and <area>-wk-N; namespaces name business functions in kebab-case; labels use the quillmoor.example domain.
    competencies:
      - id: k8s.cli
        title: kubectl and manifests
      - id: k8s.workloads
        title: Workloads
      - id: k8s.delivery
        title: Application build and delivery
      - id: k8s.scheduling
        title: Scheduling and nodes
      - id: k8s.networking
        title: Services and networking
      - id: k8s.storage
        title: Storage
      - id: k8s.rbac
        title: Identity and access control
      - id: k8s.cluster
        title: Cluster lifecycle
      - id: k8s.troubleshooting
        title: Troubleshooting
      - id: k8s.security
        title: Security hardening
  - id: linux
    title: Linux administration
    summary: Hands-on Linux administration from the first shell prompt to boot recovery, storage engineering, hardening, performance analysis and container internals, on both Enterprise Linux and Debian-family images. Labs grade end state, not the tool used, and run on the cheapest tier that stays authentic.
    skillDomain: linux
    owner: linux-content
    organisation:
      name: Tallowmere Rail
      summary: A fictional regional rail operator with a signalling centre, ticketing systems, rolling-stock depots and a timetable office; hosts are named tr-signal-01, tkt-web-02, depot-nfs-1 and similar.
    competencies:
      - id: linux.shell
        title: Shell and text processing
      - id: linux.files
        title: Files and permissions
      - id: linux.users
        title: Users and privilege
      - id: linux.identity
        title: Central identity
      - id: linux.systemd
        title: Services and boot
      - id: linux.boot
        title: Boot and recovery
      - id: linux.kernel
        title: Kernel and hardware
      - id: linux.packages
        title: Software management
      - id: linux.remote
        title: Remote access
      - id: linux.security
        title: Host security
      - id: linux.storage
        title: Storage
      - id: linux.processes
        title: Processes and scheduling
      - id: linux.net
        title: Host networking
      - id: linux.services
        title: Network services
      - id: linux.observability
        title: Logging and monitoring
      - id: linux.performance
        title: Performance and tracing
      - id: linux.internals
        title: Container internals
      - id: linux.virt
        title: Virtualization and provisioning
      - id: linux.git
        title: Version control
  - id: containers
    title: Containers with Docker
    summary: Build, ship, run, secure and debug OCI containers with Docker Engine 29, BuildKit, buildx, Bake and Compose, graded on end state (inspect output, registry contents, attestations, reachability) rather than on command history. Digests, OCI referrers and attestations are first-class from the image-building path onward. Podman 5 is a short optional track for Enterprise Linux hosts.
    notes: Docker-first since revision 2 (2026-10-14). Paths, exams and the image budget centre on Docker Engine 29 (containerd image store), BuildKit/buildx/Bake, Compose, networking, storage, registries, runtime security, supply chain (Scout, cosign, Notation, SBOM and provenance, Docker Hardened Images), troubleshooting and production CI. Podman keeps five labs (differences from Docker, rootless, SELinux mounts, pods with Kubernetes YAML, Quadlet) and a smaller optional simulation; Swarm stays optional and unexamined.
    skillDomain: containers
    owner: containers-content
    organisation:
