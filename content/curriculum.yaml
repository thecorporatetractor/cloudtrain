    title: Night-shift intrusion and quiet data loss
    oneLine: "An overnight alert on the bfw-tw1 jump host starts an investigation: find the guessed account, the source address, the first command run, the staged file and the domain its contents left through in DNS queries."
    type: ctf
    difficulty: medium
    minutes: 60
    skills: [secops.investigation.timeline, secops.logs.linux-auth, secops.endpoint.network, secops.ir.reporting]
    frameworks: [sc200-aligned:incident-response, ct-soc-analyst:l2-investigation, attack-tactics:initial-access, attack-tactics:exfiltration]
    envTier: A
    images: [kql-ws:1]
    status: proposed
    notes: "CTF investigation: 10 answer-check questions with per-seed answers, points, hints that cost points and sequential unlock (graded with ct-kql answer KEY against the ct-loggen answers); playable solo or in a timed team or individual event with a scoreboard. Data: seeded synthetic Syslog, auditd and DnsEvents. Needs a new ct-loggen scenario and the DnsEvents table."
    owner: secops-content
  - id: ctf-push-fatigue-forwarding
    domain: secops
    title: Push fatigue to a mailbox forwarding rule
    oneLine: A billing clerk approved a push at 03:12; trace the denial burst, the approving sign-in's address and device, the inbox rule created afterwards, its forwarding address and how many messages it moved.
    type: ctf
    difficulty: medium
    minutes: 50
    skills: [secops.cloud-identity.mfa-abuse, secops.cloud-identity.mailbox, secops.investigation.entity-pivot]
    frameworks: [sc200-aligned:incident-response, ct-soc-analyst:l2-investigation, attack-tactics:credential-access, attack-tactics:collection]
    envTier: A
    images: [kql-ws:1]
    status: proposed
    notes: "CTF investigation: 9 answer-check questions with per-seed answers, points, hints that cost points and sequential unlock (graded with ct-kql answer KEY against the ct-loggen answers); playable solo or in a timed team or individual event with a scoreboard. Data: seeded synthetic SigninLogs, AuditLogs and OfficeActivity, with patterns from Azure-Sentinel sample data (MIT). Runs on the existing ct-loggen identity-compromise scenario (steps 2 and 6)."
    owner: secops-content
  - id: ctf-ransomware-precursor
    domain: secops
    title: Ransomware precursor across the head office
    oneLine: Before anything was encrypted, someone moved from a phished workstation to the file server; find the initial host, the reused credential, each lateral hop, the backup deletion attempt and the host to isolate first.
    type: ctf
    difficulty: hard
    minutes: 90
    skills: [secops.investigation.scoping, secops.endpoint.process, secops.endpoint.windows-events, secops.investigation.timeline, secops.ir.containment]
    frameworks: [sc200-aligned:incident-response, ct-soc-analyst:l2-investigation, ct-soc-analyst:l2-incident-response, attack-tactics:lateral-movement, attack-tactics:discovery, attack-tactics:impact]
    envTier: A
    images: [kql-ws:1]
    status: proposed
    notes: "CTF investigation: 12 answer-check questions with per-seed answers, points, hints that cost points and sequential unlock (graded with ct-kql answer KEY against the ct-loggen answers); playable solo or in a timed team or individual event with a scoreboard. Data: seeded synthetic SecurityEvent and DeviceProcessEvents, with Windows event patterns from EVTX-ATTACK-SAMPLES (GPL-3.0, converted as data). Needs a new ct-loggen scenario (lateral movement and backup deletion)."
    owner: secops-content
  - id: ctf-insider-departure
    domain: secops
    title: Data taken before a resignation
    oneLine: An engineer leaving for a competitor may have taken network drawings; establish the baseline, then find the bulk downloads, the personal address mail went to, the USB-style archive and the total volume taken.
    type: ctf
    difficulty: medium
    minutes: 50
    skills: [secops.investigation.entity-pivot, secops.cloud-identity.mailbox, secops.hunting.hypothesis]
    frameworks: [sc200-aligned:incident-response, ct-soc-analyst:l2-investigation, attack-tactics:collection, attack-tactics:exfiltration]
    envTier: A
    images: [kql-ws:1]
    status: proposed
    notes: "CTF investigation: 8 answer-check questions with per-seed answers, points, hints that cost points and sequential unlock (graded with ct-kql answer KEY against the ct-loggen answers); playable solo or in a timed team or individual event with a scoreboard. Data: seeded synthetic OfficeActivity, DeviceFileEvents and SigninLogs. Needs a new ct-loggen scenario and the DeviceFileEvents table."
    owner: secops-content
  - id: ctf-cloud-role-vault
    domain: secops
    title: Role assignment abuse and vault secret reads
    oneLine: A service principal in bfw-dev gained Owner on rg-bfw-billing; find who granted it, from where, which key vault secrets it read, the first use of a read secret elsewhere and the assignment to remove.
    type: ctf
    difficulty: hard
    minutes: 60
    skills: [secops.cloud-identity.roles, secops.cloud-identity.cloud-activity, secops.query.parse-dynamic, secops.investigation.timeline]
