    images: [jumphost:1]
    status: verified
    owner: k8s-content
  - id: count-schedulable-nodes
    domain: kubernetes
    title: Report how many nodes can take new workloads
    oneLine: Before the peak-season freight wave, write to a file how many qm-capacity nodes are Ready and carry no NoSchedule taint, without changing any node.
    type: do
    difficulty: easy
    minutes: 8
    skills: [k8s.cli.scoped-changes, k8s.scheduling.node-status, k8s.scheduling.taints-tolerations, linux.shell.redirection]
