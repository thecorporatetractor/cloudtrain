  - id: networking
    title: Network administration
    summary: Routing, switching, IP services, network security and automation, taught on open network stacks (FRR 10 routers, Linux bridges and hosts, optional Nokia SR Linux) inside a per-lab netdev topology. Labs grade end state (routes, adjacencies, reachability, captured packets, device state through APIs). No vendor-proprietary CLI is used. Objectives the substrate cannot teach authentically (wireless LAN architecture and security, switch port security, DHCP snooping, vendor-specific CLI muscle memory) are quiz-only and have no labs.
    skillDomain: net
    owner: networking-content
    organisation:
      name: Marlow Valley Schools
      summary: A fictional school district with a district office, four campuses (north, south, east and a vocational annex), a small data centre and an upstream link to a regional education network. Routers are named mv-core-1, mv-edge-1, mv-campus-north and so on; switches mv-sw-<site>-N; hosts are classroom, staff, printer and server machines on per-function VLANs.
    notes: "Quiz-only (no labs): wireless fundamentals and WLAN security (net.wireless.fundamentals), port security and DHCP snooping (net.security.port-security), controller-based and SDN architecture concepts. CCNA v1.1 is the alignment target; third-party sources say v1.1 runs until early February 2027 and a v2.0 blueprint follows (unverified; re-check before launch)."
