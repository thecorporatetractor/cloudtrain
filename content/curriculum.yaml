# CloudTrain curriculum: single source of truth for domains, labs, paths and exam simulations.
# Schema: packages/lab-schema/schema/curriculum.schema.json. Cross-checked by tools/lab-verify
# (lab ids in paths/exams exist, skills exist in content/skills.yaml or newSkills, built/verified
# labs match content/packs). docs/curriculum.md is generated from this file:
#   node tools/curriculum/render.mjs
# STATUS: proposal. Everything with status 'proposed' awaits approval.
apiVersion: cloudtrain.dev/v1
kind: Curriculum
metadata:
  version: 2
  status: proposal
  updated: 2026-10-14
  summary: Proposed CloudTrain curriculum across six domains. Everything not yet built is status proposed and awaits approval. Alignment to external exams lives only in `frameworks` refs, path/exam disclaimers and descriptive text; titles never name an exam, exam code or certifying body.
  conventions: ["Lab types: learn (guided first exposure), do (complete a task), fix (repair a broken system), hack (attack then mitigate), exam (exam task: fully graded, no hints, drawn only by exam simulations).", "CTF labs (type ctf) are investigations: the learner answers questions (answer checks) about a seeded incident or system, playable solo or in a timed CTF event. Every expected answer comes from the session (a secret param or a value computed on a lab node at setup), so answers differ per learner (per team in events) and are never sent to the browser; questions carry points, optional attempt limits, penalties and hints with a point cost; the solution gives every answer and misconceptions give wrong answers that must be rejected. CTF labs are never exam tasks.", "Every lab is set in its domain's fictional organisation and graded on end state, never on the commands used.", "Exam tasks are separate labs; each belongs to exactly one exam pool; every pool holds at least twice the tasks drawn from it so two attempts can be fully disjoint, and params randomise each task further.", Skills not yet in content/skills.yaml are listed under newSkills and merged into the graph after approval., Image refs not yet in deploy/images/catalog.yaml are listed under images (proposed)., docs/curriculum.md is generated from this file by tools/curriculum/render.mjs; do not edit it by hand.]
envTiers:
  A:
    title: Unprivileged pod
    substrate: "Pod with hostUsers: false (Kata in production, runc locally), Baseline/Restricted PSS, egress only to in-cluster mirrors"
    authenticFor: Shell, text, files, permissions, users, packages via mirror, scripting, Git, SSH clients, user-space servers, tool-only IaC and Ansible fundamentals
  B:
    title: Kata pod with capabilities
    substrate: Kata RuntimeClass with a custom guest kernel; privileged or NET_ADMIN/SYS_ADMIN inside the guest only (privileged_without_host_devices)
    authenticFor: systemd units and journald, runtime networking and nftables, loop/LVM/mdadm storage, cgroups and namespaces, rootful dockerd, Podman
  C:
    title: KubeVirt VM
    substrate: KubeVirt VMs from golden containerDisks with cloud-init, pre-warmed pools, Multus networks
    authenticFor: Boot and recovery, GRUB, SELinux, auditd, persistent network config, reboot-graded storage, Docker/Podman host administration, multi-node Ansible estates
  K:
    title: kubeadm cluster VMs
    substrate: "k8s-cluster driver, mode kubeadm: VM nodes cloned from golden snapshots, ssh and sudo on every node"
    authenticFor: Node, kubelet, control-plane and etcd work; CNI-enforced NetworkPolicy; host hardening for cluster security
  V:
    title: Virtual cluster
    substrate: k8s-cluster driver, mode virtual (vcluster) on the platform cluster
    authenticFor: Namespaced and API-level Kubernetes work; Terraform kubernetes/helm provider targets
  N:
    title: Netdev topology
    substrate: "netdev driver (Clabernetes): FRR, Nokia SR Linux and Linux hosts wired by per-link OVN logical switches"
    authenticFor: Routing, switching on Linux bridges, IP services, network security and network automation on open network stacks
