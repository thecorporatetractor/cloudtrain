    images: [kql-ws:1]
    status: proposed
    notes: "CTF investigation: 9 answer-check questions with per-seed answers, points, hints that cost points and sequential unlock (graded with ct-kql answer KEY against the ct-loggen answers); playable solo or in a timed team or individual event with a scoreboard. Data: seeded synthetic AzureActivity, AuditLogs and key vault diagnostic logs. Needs a new ct-loggen scenario and key vault diagnostic events."
    owner: secops-content
  - id: ctf-cluster-breach-audit
    domain: secops
    title: Cluster breach told by the audit log
    oneLine: Using only the bfw-k8s-prod audit log, find the exposed workload, the stolen ServiceAccount, the RBAC binding the intruder created, the Secrets read and the image of the pod they left running.
    type: ctf
    difficulty: hard
