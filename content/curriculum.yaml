  - id: secops
    title: Security operations
    summary: "Work a security operations centre shift: query security logs, triage alerts, investigate incidents, write and tune detection rules, hunt for threats and respond, in an open-source KQL query workspace over seeded synthetic cloud identity, cloud activity, endpoint, DNS, Linux and Kubernetes telemetry. Hack-then-detect labs generate the evidence live on Linux and Kubernetes lab nodes; CTF investigations grade answers to per-seed questions, solo or as timed events with a scoreboard."
    notes: "The query engine is KustoLoco (MIT), an open-source KQL implementation; the Microsoft Kusto emulator and Splunk are not used for licence reasons, and real Microsoft Sentinel follows once an Azure sandbox offering exists. The kql-ws:1 image ships KustoLoco v1.4.9 with CloudTrain patches (docs/handoffs/soc.md): bag_unpack, make-series, search, stdev and union wildcards work; top-nested, evaluate pivot/autocluster/basket, percentiles() (use percentile()), row_cumsum, parse-kv, series_periods_*, ingestion_time() and gettype remain unsupported. Labs teach the core analyst subset and every lab that needs or works around a missing operator says so in its notes. Labs grade with ct-kql (saved queries and rules) and CTF answers with ct-kql answer KEY; data comes from ct-loggen per session seed. ct-loggen today generates SigninLogs, AuditLogs, AzureActivity, OfficeActivity, SecurityEvent, DeviceProcessEvents, DeviceNetworkEvents, CommonSecurityLog, Syslog, IdentityInfo and IpGeo with one scenario (identity-compromise); labs that need DnsEvents, DeviceFileEvents, KubeAudit or key vault diagnostics, or another scenario, say so in their notes. CTF labs (type ctf) use the CTF engine that has landed (answer checks with per-seed expected values, points, hints that cost points, sequential unlock, event mode and scoreboard). Every xsoc exam task and lab above that needs a table or scenario ct-loggen lacks says so in its notes; a lab or exam is not marked built while its data does not exist. Data sources: our own seeded synthetic data first, then Azure-Sentinel sample data (MIT), splunk/attack_data (Apache-2.0), the CC0 security dataset series v1-v3 (never under its original name) and EVTX-ATTACK-SAMPLES (GPL-3.0, kept as separate data files with its licence notice). CloudTrain is not affiliated with or endorsed by Microsoft, Splunk or The MITRE Corporation."
    licensingNote: "KustoLoco is MIT. Sample datasets keep their licence notices in THIRD_PARTY_LICENSES.md: Azure-Sentinel samples MIT, splunk/attack_data Apache-2.0, the security dataset series v1-v3 CC0 (its original name and branding are not used), EVTX-ATTACK-SAMPLES GPL-3.0 (shipped as unmodified data files with the licence; confirm the GPL position for hosted use before external launch). Not legal advice."
    skillDomain: secops
    owner: secops-content
    organisation:
      name: Brackenford Water
      summary: "A fictional regional water utility with two treatment works (tw1 Brackenford, tw2 Ashby Mill), fourteen pumping stations, a SCADA historian, a customer billing portal, a contact centre and a head office. Users are firstname.lastname@brackenford.example with admin accounts adm-<initials>@brackenford.example and service principals sp-<app>; the cloud tenant is bfw-prod (subscriptions bfw-prod-core and bfw-dev), key vaults kv-bfw-<app>, resource groups rg-bfw-<app>. Hosts are bfw-<site>-<role><nn> (bfw-hq-ws014, bfw-tw1-hist01, bfw-hq-dc01, bfw-ps07-rtu01, bfw-dmz-web02); Kubernetes clusters bfw-k8s-<env> with namespaces per service (billing, meter-ingest, portal). Internal addresses are 10.40.<site>.0/24 (hq 10.40.1.0/24, tw1 10.40.11.0/24, tw2 10.40.12.0/24, dmz 10.40.200.0/24); external and attacker addresses come only from the documentation ranges 192.0.2.0/24, 198.51.100.0/24 and 203.0.113.0/24, and external domains use .example and .test."
    competencies:
      - id: secops.logs
        title: Log fundamentals
        new: true
