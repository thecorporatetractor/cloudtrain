labs:
  - id: scale-berth-planner
    domain: kubernetes
    title: Scale one Deployment among several
    oneLine: The harbour dispatch team needs more capacity for the berth planner only; scale that Deployment in qm-dispatch to the requested replica count with every replica ready while its neighbours stay untouched.
    type: do
    difficulty: easy
    minutes: 5
    skills: [k8s.cli.contexts, k8s.cli.scoped-changes, k8s.workloads.scaling]
    frameworks: [cka:workloads-scheduling, ckad:deployment]
    envTier: V
    images: [jumphost:1]
    status: verified
    owner: k8s-content
  - id: two-container-pod
    domain: kubernetes
    title: Run a web server and its cache in one Pod
    oneLine: Quillmoor's tracking kiosk needs a web server and a Redis cache sharing one Pod; create it in qm-depot with both app containers running in spec.containers.
    type: do
    difficulty: easy
    minutes: 8
    skills: [k8s.cli.contexts, k8s.cli.scoped-changes, k8s.workloads.multi-container-pods]
    frameworks: [cka:workloads-scheduling, ckad:design-build]
    envTier: V
    images: [jumphost:1]
    status: verified
    owner: k8s-content
  - id: rbac-pipeline-grant
    domain: kubernetes
    title: Scoped create-only access for a release pipeline
    oneLine: The release pipeline's ServiceAccount may only create Deployments, StatefulSets and DaemonSets in one namespace of qm-depot; grant exactly that with a ClusterRole bound by a RoleBinding.
    type: do
    difficulty: medium
    minutes: 12
    skills: [k8s.cli.contexts, k8s.rbac.service-accounts, k8s.rbac.roles, k8s.rbac.clusterroles, k8s.rbac.binding-scope]
    frameworks: [cka:cluster-architecture, ckad:environment-config-security, cks:cluster-hardening]
