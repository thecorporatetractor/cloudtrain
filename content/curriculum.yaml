paths:
  - id: kubernetes-foundations
    domain: kubernetes
    title: Kubernetes foundations
    audience: Engineers new to Kubernetes who can use a Linux shell
    level: beginner
    prerequisites: []
    estimatedHours: 6
    frameworks: []
    modules:
      - id: k8s-found-cli
        title: kubectl and manifests
        labs: [kubectl-first-contact, generate-manifest-dry-run, patch-without-clobbering, jsonpath-depot-inventory]
      - id: k8s-found-workloads
        title: First workloads
        labs: [two-container-pod, scale-berth-planner, routing-engine-config, label-printer-crashloop]
      - id: k8s-found-network
        title: Reaching your app
        labs: [dns-debug-pod, named-port-nodeport, tariff-api-no-endpoints]
  - id: cluster-administration
    domain: kubernetes
    title: Kubernetes cluster administration
    audience: Platform and operations engineers who run clusters
    level: intermediate
    prerequisites: [kubernetes-foundations]
    estimatedHours: 22
    frameworks: [cka]
    disclaimer: CloudTrain is not affiliated with or endorsed by the Cloud Native Computing Foundation and The Linux Foundation. CKA is a trademark of the Cloud Native Computing Foundation and The Linux Foundation. This path covers objectives aligned to that exam; completing it confers no certification.
    modules:
      - id: cka-workloads
        title: Workloads and scheduling
        labs: [waybill-rollback, rolling-update-surge, routing-engine-config, dock-scheduler-probes, telemetry-daemonset, nodeselector-nvme-pod, affinity-cold-chain, spread-tracking-replicas, taint-gpu-workers, priority-preemption-peak, qos-class-forecast, sandbox-quota-limitrange, berth-planner-hpa, native-sidecar-log-shipper]
      - id: cka-networking
        title: Services and networking
        labs: [named-port-nodeport, loadbalancer-kiosk-ip, dns-debug-pod, coredns-customs-forward, tracking-ingress-two-paths, brokers-gateway-routes, netpol-namespace-port, cni-trace-pod-path]
      - id: cka-storage
        title: Storage
        labs: [hostpath-pv-readonly, pvc-pending-mismatch, manifest-store-dynamic, csi-driver-inventory, shared-scratch-emptydir]
      - id: cka-access
        title: Access control
        labs: [rbac-pipeline-grant, who-can-delete-secrets, night-shift-user-cert]
      - id: cka-lifecycle
        title: Cluster lifecycle
        labs: [control-plane-tour, fleet-node-prep-join, kubeadm-bootstrap-cluster, drain-yard-worker, kubeadm-control-plane-upgrade, worker-kubelet-upgrade, etcd-snapshot-restore, kubeadm-etcd-static-restore, ledger-second-control-plane, helm-shipment-events, kustomize-depot-overlays, shipment-operator-crd]
