    images: [kql-ws:1]
    status: proposed
    notes: "CTF investigation: 10 answer-check questions with per-seed answers, points, hints that cost points and sequential unlock (graded with ct-kql answer KEY against the ct-loggen answers); playable solo or in a timed team or individual event with a scoreboard. Data: seeded synthetic KubeAudit events in the Kubernetes audit format. Needs a KubeAudit table and scenario in ct-loggen."
    owner: secops-content
  - id: ctf-beacon-hunt
    domain: secops
    title: Hunt for a quiet beacon
    oneLine: Threat intelligence says a water utility peer was hit by low-and-slow callbacks; hunt Brackenford's network telemetry for the host, process, destination, interval and jitter of a beacon.
    type: ctf
    difficulty: medium
    minutes: 45
    skills: [secops.hunting.beaconing, secops.hunting.hypothesis, secops.endpoint.network]
