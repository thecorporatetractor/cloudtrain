  - id: iac
    title: Infrastructure as code with Terraform
    summary: Terraform 1.15 is the primary CLI throughout. Learners provision real Kubernetes objects in a per-learner vcluster, AWS-shaped resources on Moto and vSphere inventory on vcsim, fully offline, graded on target truth, state and plan convergence. Recent Terraform features (ephemeral values, write-only arguments, S3 native locking, terraform test, terraform query and actions) are hands-on where the offline runtime allows; HCP Terraform and Stacks are concept-only. OpenTofu is a short optional track.
    notes: Terraform-first since revision 2 (2026-10-14). Shared-core labs stay CLI-agnostic where it is cheap (same HCL, state format, providers and grading through show -json and target truth), so OpenTofu can be swapped in as the default binary if the licensing position requires it. Terraform-only labs say so in their notes (terraform query, actions, Stacks and hosted-platform concepts).
    licensingNote: Terraform 1.6 and later is source-available under BUSL-1.1 with IBM as licensor. Internal training of AzarGuard staff is production use that the Additional Use Grant allows. Offering Terraform as a hosted lab to external paying customers may count as a competitive offering, so it needs written confirmation from IBM/HashiCorp (licensing@hashicorp.com) before launch; until then external tenants get the OpenTofu binary. Providers are MPL-2.0 and are mirrored with their licence notices. Content stays CLI-agnostic where cheap so OpenTofu can be swapped in. Not legal advice.
