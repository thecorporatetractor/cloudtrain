    envTier: A
    images: [kql-ws:1]
    status: proposed
    notes: "CTF investigation: 6 answer-check questions with per-seed answers, points, hints that cost points and sequential unlock (graded with ct-kql answer KEY against the ct-loggen answers); playable solo or in a timed team or individual event with a scoreboard. Data: seeded synthetic DeviceNetworkEvents with splunk/attack_data (Apache-2.0) traffic patterns. Needs series_periods_detect, which the engine lacks today; the intended path uses serialize, prev() and summarize stdev(). Needs a new ct-loggen scenario with a quieter beacon than identity-compromise step 8."
    owner: secops-content
  - id: ctf-web-defacement-dataset
