    oneLine: A faulty migration corrupted the billing ledger's etcd; snapshot the running TLS-secured member to the archive, then restore the approved baseline so etcd.service serves it on the same endpoint.
    type: do
    difficulty: hard
    minutes: 30
    skills: [k8s.cluster.etcd-tls, k8s.cluster.etcd-snapshot, k8s.cluster.etcd-restore, linux.systemd.units]
