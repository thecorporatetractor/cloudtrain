# Cisco CCNA (200-301) exam topics mapped onto shared skills.
apiVersion: cloudtrain.dev/v1
kind: Framework
id: ccna
title: Cisco Certified Network Associate (CCNA 200-301)
issuer: Cisco
domain: networking
disclaimer: CloudTrain is not affiliated with or endorsed by Cisco Systems, Inc. CCNA is a trademark of Cisco Systems, Inc. This framework maps CloudTrain skills to objectives aligned to that exam; readiness shown here confers no certification.
