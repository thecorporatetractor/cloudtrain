      - k8s.cluster.kustomize
      - k8s.networking.cni
      - k8s.storage.csi-drivers
      - k8s.cluster.container-runtime
      - k8s.cluster.extensions
  - id: services-networking
    title: Services and networking
    weight: 20
    topics:
      - id: pod-connectivity
        title: Connectivity between Pods
        skills: [k8s.networking.cni, k8s.networking.connectivity-testing]
      - id: network-policies
        title: Defining and enforcing NetworkPolicies
        skills: [k8s.networking.netpol-basics, k8s.networking.netpol-selectors, k8s.networking.netpol-ports]
      - id: service-types
        title: Service types (ClusterIP, NodePort, LoadBalancer) and endpoints
        skills: [k8s.networking.services, k8s.networking.named-ports, k8s.networking.nodeport, k8s.networking.loadbalancer, k8s.networking.endpoints]
      - id: gateway-api
        title: Managing ingress traffic with the Gateway API
        skills: [k8s.networking.gateway-api]
      - id: ingress
        title: Ingress controllers and Ingress resources
        skills: [k8s.networking.ingress-gateway]
      - id: coredns
        title: Using and configuring CoreDNS
        skills: [k8s.networking.dns, k8s.networking.coredns-config]
    skills:
