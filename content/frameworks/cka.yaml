# Certified Kubernetes Administrator — curriculum domains mapped onto shared skills.
# Objective titles paraphrase the public curriculum; weights are the published domain weights.
apiVersion: cloudtrain.dev/v1
kind: Framework
id: cka
title: Certified Kubernetes Administrator (CKA)
issuer: CNCF / Linux Foundation
curriculumVersion: "1.35"
objectives:
  - id: storage
    title: Storage
    weight: 10
    topics:
      - Storage classes and dynamic provisioning
      - Volume types, access modes and reclaim policies
      - PersistentVolumes and PersistentVolumeClaims
    skills:
      - k8s.storage.persistent-volumes
      - k8s.storage.access-modes
      - k8s.storage.capacity-units
      - k8s.storage.claims
      - k8s.storage.storage-classes
  - id: troubleshooting
    title: Troubleshooting
    weight: 30
    topics:
      - Clusters and nodes
      - Cluster components
      - Resource usage of applications
      - Container output streams
      - Services and networking
    skills:
      - k8s.troubleshooting.events
      - k8s.troubleshooting.logs
      - k8s.troubleshooting.nodes
      - k8s.troubleshooting.control-plane
      - k8s.troubleshooting.networking
      - k8s.scheduling.node-status
      - k8s.scheduling.taints-tolerations
      - k8s.cli.output-formatting
  - id: workloads-scheduling
    title: Workloads and scheduling
    weight: 15
    topics:
      - Deployments, rolling updates and rollbacks
      - ConfigMaps and Secrets
      - Autoscaling
      - Self-healing primitives
      - Pod admission and scheduling (limits, node affinity)
    skills:
      - k8s.workloads.pods
      - k8s.workloads.multi-container-pods
      - k8s.workloads.native-sidecars
      - k8s.workloads.deployments
      - k8s.workloads.scaling
      - k8s.workloads.rollouts
      - k8s.workloads.daemonsets
      - k8s.workloads.config
      - k8s.workloads.resources
      - k8s.workloads.probes
      - k8s.workloads.autoscaling
      - k8s.scheduling.node-labels
      - k8s.scheduling.node-selector
      - k8s.scheduling.node-affinity
      - k8s.scheduling.taints-tolerations
      - k8s.scheduling.cordon-drain
  - id: cluster-architecture
    title: Cluster architecture, installation and configuration
    weight: 25
    topics:
      - Role-based access control
      - Preparing infrastructure and installing clusters with kubeadm
      - Managing the cluster lifecycle (upgrades, backups)
      - Highly available control planes
      - Helm and Kustomize
      - Extension interfaces (CNI, CSI, CRI), CRDs and operators
    skills:
      - k8s.cli.contexts
      - k8s.rbac.service-accounts
      - k8s.rbac.roles
      - k8s.rbac.clusterroles
      - k8s.rbac.binding-scope
      - k8s.rbac.auth-can-i
      - k8s.cluster.components
      - k8s.cluster.kubeadm-install
      - k8s.cluster.version-skew
      - k8s.cluster.kubeadm-upgrade
      - k8s.cluster.kubelet
      - k8s.cluster.etcd-tls
      - k8s.cluster.etcd-snapshot
      - k8s.cluster.etcd-restore
      - k8s.cluster.ha-control-plane
      - k8s.cluster.packaging
      - k8s.cluster.extensions
  - id: services-networking
    title: Services and networking
    weight: 20
    topics:
      - Pod-to-pod connectivity
      - NetworkPolicies
      - Service types and endpoints
      - Gateway API and Ingress
      - CoreDNS
    skills:
      - k8s.networking.services
      - k8s.networking.named-ports
      - k8s.networking.nodeport
      - k8s.networking.endpoints
      - k8s.networking.dns
      - k8s.networking.ingress-gateway
      - k8s.networking.netpol-basics
      - k8s.networking.netpol-selectors
      - k8s.networking.netpol-ports
      - k8s.networking.connectivity-testing
      - k8s.networking.cni
