# Certified Kubernetes Administrator: curriculum domains mapped onto shared skills.
# Domain titles and weights follow the public curriculum; topic titles are our own
# paraphrases of its competencies. Lab metadata references objectives as
# `cka:<objective id>`; topics are finer-grained and only used for coverage
# reporting (content/skills-review.md). `skills` is the union of the topic skills.
apiVersion: cloudtrain.dev/v1
kind: Framework
id: cka
title: Certified Kubernetes Administrator (CKA)
issuer: CNCF / Linux Foundation
domain: kubernetes
disclaimer: CloudTrain is not affiliated with or endorsed by the Cloud Native Computing Foundation and The Linux Foundation. CKA is a trademark of the Cloud Native Computing Foundation and The Linux Foundation. This framework maps CloudTrain skills to objectives aligned to that exam; readiness shown here confers no certification.
curriculumVersion: "1.35"
objectives:
  - id: storage
    title: Storage
    weight: 10
    topics:
      - id: dynamic-provisioning
        title: StorageClasses and dynamic provisioning
        skills: [k8s.storage.storage-classes, k8s.storage.csi-drivers]
      - id: volume-types-modes
        title: Volume types, access modes and reclaim policies
        skills: [k8s.storage.access-modes, k8s.storage.reclaim-policy, k8s.storage.ephemeral-volumes]
      - id: pv-pvc
        title: Managing PersistentVolumes and claims
        skills: [k8s.storage.persistent-volumes, k8s.storage.capacity-units, k8s.storage.claims]
    skills:
      - k8s.storage.storage-classes
      - k8s.storage.csi-drivers
      - k8s.storage.access-modes
      - k8s.storage.reclaim-policy
      - k8s.storage.ephemeral-volumes
      - k8s.storage.persistent-volumes
      - k8s.storage.capacity-units
      - k8s.storage.claims
  - id: troubleshooting
    title: Troubleshooting
    weight: 30
    topics:
      - id: clusters-nodes
        title: Clusters and nodes
        skills: [k8s.scheduling.node-status, k8s.scheduling.taints-tolerations, k8s.troubleshooting.nodes]
      - id: components
        title: Cluster components
        skills: [k8s.troubleshooting.control-plane, k8s.cluster.container-runtime]
      - id: resource-usage
        title: Cluster and application resource usage
        skills: [k8s.troubleshooting.resource-usage, k8s.cli.output-formatting]
      - id: output-streams
        title: Container output streams
        skills: [k8s.troubleshooting.logs, k8s.troubleshooting.events, k8s.troubleshooting.debug-containers]
      - id: services-networking
        title: Services and networking
        skills: [k8s.troubleshooting.networking]
    skills:
      - k8s.scheduling.node-status
      - k8s.scheduling.taints-tolerations
      - k8s.troubleshooting.nodes
      - k8s.troubleshooting.control-plane
      - k8s.cluster.container-runtime
      - k8s.troubleshooting.resource-usage
      - k8s.cli.output-formatting
      - k8s.troubleshooting.logs
      - k8s.troubleshooting.events
      - k8s.troubleshooting.debug-containers
      - k8s.troubleshooting.networking
  - id: workloads-scheduling
    title: Workloads and scheduling
    weight: 15
    topics:
      - id: deployments-rollouts
        title: Deployments, rolling updates and rollbacks
        skills: [k8s.workloads.deployments, k8s.workloads.scaling, k8s.workloads.rollouts]
      - id: config
        title: Configuring applications with ConfigMaps and Secrets
        skills: [k8s.workloads.config]
      - id: autoscaling
        title: Workload autoscaling
        skills: [k8s.workloads.autoscaling]
      - id: self-healing
        title: Primitives for robust, self-healing applications
        skills: [k8s.workloads.pods, k8s.workloads.multi-container-pods, k8s.workloads.native-sidecars, k8s.workloads.probes, k8s.workloads.daemonsets, k8s.workloads.statefulsets]
      - id: admission-scheduling
        title: Pod admission and scheduling (resource limits, placement)
        skills: [k8s.workloads.resources, k8s.workloads.quotas-limitranges, k8s.scheduling.node-labels, k8s.scheduling.node-selector, k8s.scheduling.node-affinity, k8s.scheduling.pod-affinity, k8s.scheduling.taints-tolerations, k8s.scheduling.priority-preemption]
    skills:
      - k8s.workloads.deployments
      - k8s.workloads.scaling
      - k8s.workloads.rollouts
      - k8s.workloads.config
      - k8s.workloads.autoscaling
      - k8s.workloads.pods
      - k8s.workloads.multi-container-pods
      - k8s.workloads.native-sidecars
      - k8s.workloads.probes
      - k8s.workloads.daemonsets
      - k8s.workloads.statefulsets
      - k8s.workloads.resources
      - k8s.workloads.quotas-limitranges
      - k8s.scheduling.node-labels
      - k8s.scheduling.node-selector
      - k8s.scheduling.node-affinity
      - k8s.scheduling.pod-affinity
      - k8s.scheduling.taints-tolerations
      - k8s.scheduling.priority-preemption
  - id: cluster-architecture
    title: Cluster architecture, installation and configuration
    weight: 25
    topics:
      - id: rbac
        title: Role-based access control
        skills: [k8s.rbac.service-accounts, k8s.rbac.roles, k8s.rbac.clusterroles, k8s.rbac.binding-scope, k8s.rbac.auth-can-i, k8s.rbac.user-certificates]
      - id: infrastructure
        title: Preparing hosts for a cluster install
        skills: [k8s.cluster.node-prep]
      - id: kubeadm
        title: Creating and managing clusters with kubeadm
        skills: [k8s.cluster.components, k8s.cluster.kubeadm-install, k8s.cluster.kubelet]
      - id: lifecycle
        title: Cluster lifecycle (upgrades, node maintenance, etcd backup and restore)
        skills: [k8s.cluster.version-skew, k8s.cluster.kubeadm-upgrade, k8s.scheduling.cordon-drain, k8s.cluster.etcd-tls, k8s.cluster.etcd-snapshot, k8s.cluster.etcd-restore]
      - id: ha-control-plane
        title: Highly available control planes
        skills: [k8s.cluster.ha-control-plane]
      - id: helm-kustomize
        title: Installing cluster components with Helm and Kustomize
        skills: [k8s.cluster.packaging, k8s.cluster.kustomize]
      - id: extension-interfaces
        title: Extension interfaces (CNI, CSI, CRI)
        skills: [k8s.networking.cni, k8s.storage.csi-drivers, k8s.cluster.container-runtime]
      - id: crds-operators
        title: CRDs and operators
        skills: [k8s.cluster.extensions]
    skills:
      - k8s.rbac.service-accounts
      - k8s.rbac.roles
      - k8s.rbac.clusterroles
      - k8s.rbac.binding-scope
      - k8s.rbac.auth-can-i
      - k8s.rbac.user-certificates
      - k8s.cluster.node-prep
      - k8s.cluster.components
      - k8s.cluster.kubeadm-install
      - k8s.cluster.kubelet
      - k8s.cluster.version-skew
      - k8s.cluster.kubeadm-upgrade
      - k8s.scheduling.cordon-drain
      - k8s.cluster.etcd-tls
      - k8s.cluster.etcd-snapshot
      - k8s.cluster.etcd-restore
      - k8s.cluster.ha-control-plane
