# Certified Kubernetes Application Developer: curriculum domains mapped onto shared
# skills. Domain titles and weights follow the public curriculum; topic titles are
# our own paraphrases of its competencies. `skills` is the union of the topic skills.
apiVersion: cloudtrain.dev/v1
kind: Framework
id: ckad
title: Certified Kubernetes Application Developer (CKAD)
issuer: CNCF / Linux Foundation
curriculumVersion: "1.37"
objectives:
  - id: design-build
    title: Application design and build
    weight: 20
    topics:
      - id: container-images
        title: Building and changing container images
        skills: [k8s.delivery.image-build]
      - id: workload-resources
        title: Picking the right workload resource
        skills: [k8s.workloads.deployments, k8s.workloads.daemonsets, k8s.workloads.statefulsets, k8s.workloads.jobs]
      - id: multi-container
        title: Multi-container Pod patterns (sidecar, init and others)
        skills: [k8s.workloads.multi-container-pods, k8s.workloads.native-sidecars]
      - id: volumes
        title: Persistent and ephemeral volumes
        skills: [k8s.storage.claims, k8s.storage.ephemeral-volumes]
    skills:
      - k8s.delivery.image-build
      - k8s.workloads.deployments
      - k8s.workloads.daemonsets
      - k8s.workloads.statefulsets
      - k8s.workloads.jobs
      - k8s.workloads.multi-container-pods
      - k8s.workloads.native-sidecars
      - k8s.storage.claims
      - k8s.storage.ephemeral-volumes
  - id: deployment
    title: Application deployment
    weight: 20
    topics:
      - id: strategies
        title: Blue/green and canary releases with core primitives
        skills: [k8s.delivery.deployment-strategies]
      - id: rolling-updates
        title: Deployments and rolling updates
        skills: [k8s.workloads.rollouts, k8s.workloads.scaling]
      - id: helm
        title: Deploying existing Helm charts
        skills: [k8s.cluster.packaging]
      - id: kustomize
        title: Kustomize
        skills: [k8s.cluster.kustomize]
    skills:
      - k8s.delivery.deployment-strategies
      - k8s.workloads.rollouts
      - k8s.workloads.scaling
      - k8s.cluster.packaging
      - k8s.cluster.kustomize
  - id: observability-maintenance
    title: Application observability and maintenance
    weight: 15
    topics:
      - id: api-deprecations
        title: API deprecations
        skills: [k8s.delivery.api-deprecations]
      - id: probes
        title: Probes and health checks
        skills: [k8s.workloads.probes]
      - id: cli-monitoring
        title: Monitoring applications with built-in CLI tools
        skills: [k8s.troubleshooting.resource-usage, k8s.cli.output-formatting]
      - id: logs
        title: Container logs
        skills: [k8s.troubleshooting.logs]
      - id: debugging
        title: Debugging in Kubernetes
        skills: [k8s.troubleshooting.events, k8s.troubleshooting.debug-containers]
    skills:
      - k8s.delivery.api-deprecations
      - k8s.workloads.probes
      - k8s.troubleshooting.resource-usage
      - k8s.cli.output-formatting
      - k8s.troubleshooting.logs
      - k8s.troubleshooting.events
      - k8s.troubleshooting.debug-containers
  - id: environment-config-security
    title: Application environment, configuration and security
    weight: 25
    topics:
      - id: extensions
        title: Resources that extend Kubernetes (CRDs, operators)
        skills: [k8s.cluster.extensions]
      - id: authn-authz-admission
        title: Authentication, authorization and admission control
        skills: [k8s.rbac.roles, k8s.rbac.binding-scope, k8s.rbac.auth-can-i, k8s.security.admission-control]
      - id: requests-limits-quotas
        title: Requests, limits and quotas
        skills: [k8s.workloads.resources, k8s.workloads.quotas-limitranges, k8s.storage.capacity-units]
      - id: configmaps-secrets
        title: ConfigMaps and Secrets
        skills: [k8s.workloads.config]
      - id: service-accounts
        title: ServiceAccounts
        skills: [k8s.rbac.service-accounts]
      - id: app-security
        title: Application security (securityContext, capabilities)
        skills: [k8s.security.security-context]
    skills:
      - k8s.cluster.extensions
      - k8s.rbac.roles
      - k8s.rbac.binding-scope
      - k8s.rbac.auth-can-i
      - k8s.security.admission-control
      - k8s.workloads.resources
      - k8s.workloads.quotas-limitranges
      - k8s.storage.capacity-units
      - k8s.workloads.config
      - k8s.rbac.service-accounts
      - k8s.security.security-context
  - id: services-networking
    title: Services and networking
    weight: 20
    topics:
      - id: network-policies
        title: NetworkPolicy basics
        skills: [k8s.networking.netpol-basics, k8s.networking.netpol-selectors, k8s.networking.netpol-ports]
      - id: services
        title: Providing and troubleshooting access through Services
        skills: [k8s.networking.services, k8s.networking.named-ports, k8s.networking.nodeport, k8s.networking.endpoints, k8s.troubleshooting.networking]
      - id: ingress
        title: Exposing applications with Ingress rules
        skills: [k8s.networking.ingress-gateway]
    skills:
      - k8s.networking.netpol-basics
      - k8s.networking.netpol-selectors
      - k8s.networking.netpol-ports
      - k8s.networking.services
      - k8s.networking.named-ports
      - k8s.networking.nodeport
      - k8s.networking.endpoints
      - k8s.troubleshooting.networking
      - k8s.networking.ingress-gateway
