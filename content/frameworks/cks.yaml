# Certified Kubernetes Security Specialist: curriculum domains mapped onto shared
# skills. Domain titles and weights follow the public curriculum; topic titles are
# our own paraphrases of its competencies. `skills` is the union of the topic skills.
apiVersion: cloudtrain.dev/v1
kind: Framework
id: cks
title: Certified Kubernetes Security Specialist (CKS)
issuer: CNCF / Linux Foundation
curriculumVersion: "1.34"
objectives:
  - id: cluster-setup
    title: Cluster setup
    weight: 15
    topics:
      - id: network-policies
        title: Restricting cluster-level access with network policies
        skills: [k8s.networking.netpol-selectors, k8s.networking.netpol-ports, k8s.security.netpol-default-deny]
      - id: cis-benchmark
        title: Reviewing component configuration against the CIS benchmark
        skills: [k8s.security.cis-benchmark]
      - id: ingress-tls
        title: Ingress with TLS
        skills: [k8s.security.ingress-tls]
      - id: node-metadata
        title: Protecting node metadata and endpoints
        skills: [k8s.security.node-metadata]
      - id: binaries
        title: Verifying platform binaries
        skills: [k8s.security.binary-verification]
    skills:
      - k8s.networking.netpol-selectors
      - k8s.networking.netpol-ports
      - k8s.security.netpol-default-deny
      - k8s.security.cis-benchmark
      - k8s.security.ingress-tls
      - k8s.security.node-metadata
      - k8s.security.binary-verification
  - id: cluster-hardening
    title: Cluster hardening
    weight: 15
    topics:
      - id: rbac
        title: Minimising exposure with RBAC
        skills: [k8s.rbac.roles, k8s.rbac.binding-scope, k8s.security.rbac-least-privilege]
      - id: service-accounts
        title: Careful ServiceAccount use (defaults, minimal permissions)
        skills: [k8s.security.sa-token-hygiene]
      - id: api-access
        title: Restricting access to the Kubernetes API
        skills: [k8s.security.api-server-hardening]
      - id: upgrades
        title: Keeping Kubernetes upgraded
        skills: [k8s.cluster.kubeadm-upgrade]
    skills:
      - k8s.rbac.roles
      - k8s.rbac.binding-scope
      - k8s.security.rbac-least-privilege
      - k8s.security.sa-token-hygiene
      - k8s.security.api-server-hardening
      - k8s.cluster.kubeadm-upgrade
  - id: system-hardening
    title: System hardening
    weight: 10
    topics:
      - id: host-footprint
        title: Minimising the host OS footprint
        skills: [linux.security.attack-surface]
      - id: least-privilege-iam
        title: Least-privilege identity and access
        skills: [linux.users.sudo, k8s.security.kubelet-hardening]
      - id: network-access
        title: Minimising external network access
        skills: [linux.net.firewall]
      - id: kernel-hardening
        title: Kernel hardening tools (AppArmor, seccomp)
        skills: [linux.security.mac, k8s.security.seccomp-apparmor]
    skills:
      - linux.security.attack-surface
      - linux.users.sudo
      - k8s.security.kubelet-hardening
      - linux.net.firewall
      - linux.security.mac
      - k8s.security.seccomp-apparmor
  - id: microservice-vulnerabilities
    title: Minimising microservice vulnerabilities
    weight: 20
    topics:
      - id: pod-security
        title: Pod Security Standards
        skills: [k8s.security.pod-security-admission, k8s.security.security-context]
      - id: secrets
        title: Managing Kubernetes Secrets
        skills: [k8s.security.secrets]
      - id: isolation
        title: Isolation techniques (multi-tenancy, sandboxed runtimes)
        skills: [k8s.security.sandboxing]
      - id: pod-encryption
        title: Pod-to-pod encryption
        skills: [k8s.security.mtls]
    skills:
      - k8s.security.pod-security-admission
      - k8s.security.security-context
      - k8s.security.secrets
      - k8s.security.sandboxing
      - k8s.security.mtls
  - id: supply-chain-security
    title: Supply chain security
    weight: 20
    topics:
      - id: base-images
        title: Minimising base image footprint
        skills: [k8s.security.image-footprint]
      - id: understand-supply-chain
        title: Understanding the supply chain (SBOMs, pipelines, registries)
        skills: [k8s.security.sbom]
      - id: secure-supply-chain
        title: Securing the supply chain (permitted registries, signatures)
        skills: [k8s.security.image-signing, k8s.security.admission-control]
      - id: static-analysis
        title: Static analysis of workloads and images
        skills: [k8s.security.static-analysis, k8s.security.supply-chain]
    skills:
      - k8s.security.image-footprint
      - k8s.security.sbom
      - k8s.security.image-signing
      - k8s.security.admission-control
      - k8s.security.static-analysis
      - k8s.security.supply-chain
  - id: monitoring-runtime-security
    title: Monitoring, logging and runtime security
    weight: 20
    topics:
      - id: behavioural-analytics
        title: Behavioural analytics to detect malicious activity
        skills: [k8s.security.runtime-detection]
      - id: threat-detection
        title: Detecting threats across infrastructure and workloads
        skills: [k8s.security.runtime-detection]
      - id: investigation
        title: Investigating attack phases and actors
        skills: [k8s.security.incident-investigation]
      - id: immutability
        title: Container immutability at runtime
        skills: [k8s.security.immutability]
      - id: audit-logs
        title: Monitoring access with audit logs
        skills: [k8s.security.audit-logging]
    skills:
      - k8s.security.runtime-detection
      - k8s.security.incident-investigation
      - k8s.security.immutability
      - k8s.security.audit-logging
