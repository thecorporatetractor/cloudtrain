# Certified Kubernetes Security Specialist — curriculum domains mapped onto shared skills.
apiVersion: cloudtrain.dev/v1
kind: Framework
id: cks
title: Certified Kubernetes Security Specialist (CKS)
issuer: CNCF / Linux Foundation
curriculumVersion: "1.35"
objectives:
  - id: cluster-setup
    title: Cluster setup
    weight: 15
    topics:
      - Network policies to restrict cluster-level access
      - CIS benchmark review of components
      - Ingress with TLS
      - Protecting node metadata and endpoints
      - Verifying platform binaries
    skills:
      - k8s.networking.netpol-selectors
      - k8s.networking.netpol-ports
      - k8s.security.netpol-default-deny
      - k8s.security.cis-benchmark
      - k8s.networking.ingress-gateway
  - id: cluster-hardening
    title: Cluster hardening
    weight: 15
    topics:
      - Restricting access to the Kubernetes API
      - RBAC to minimise exposure
      - ServiceAccount hygiene
      - Keeping Kubernetes up to date
    skills:
      - k8s.rbac.binding-scope
      - k8s.rbac.auth-can-i
      - k8s.security.rbac-least-privilege
      - k8s.security.sa-token-hygiene
      - k8s.security.api-server-hardening
      - k8s.cluster.kubeadm-upgrade
  - id: system-hardening
    title: System hardening
    weight: 10
    topics:
      - Minimising host OS footprint
      - Least-privilege identity and access
      - Minimising external network access
      - Kernel hardening tools (AppArmor, seccomp)
    skills:
      - linux.security.mac
      - linux.net.firewall
      - k8s.security.seccomp-apparmor
      - k8s.security.kubelet-hardening
  - id: microservice-vulnerabilities
    title: Minimising microservice vulnerabilities
    weight: 20
    topics:
      - Pod Security Standards
      - Managing Kubernetes Secrets
      - Isolation techniques (sandboxed runtimes)
      - Pod-to-pod encryption
    skills:
      - k8s.security.pod-security-admission
      - k8s.security.security-context
      - k8s.security.secrets
      - k8s.security.sandboxing
      - k8s.security.mtls
  - id: supply-chain-security
    title: Supply chain security
    weight: 20
    topics:
      - Minimising base image footprint
      - Understanding the supply chain (SBOM, signing)
      - Securing the supply chain (registries, admission)
      - Static analysis of workloads and images
    skills:
      - k8s.security.supply-chain
  - id: monitoring-runtime-security
    title: Monitoring, logging and runtime security
    weight: 20
    topics:
      - Behavioural analytics to detect malicious activity
      - Threat detection across infrastructure and workloads
      - Container immutability
      - Audit logs
    skills:
      - k8s.security.runtime-detection
      - k8s.security.audit-logging
      - k8s.security.security-context
