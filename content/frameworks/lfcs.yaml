# Linux Foundation Certified Sysadmin — curriculum domains mapped onto shared skills.
apiVersion: cloudtrain.dev/v1
kind: Framework
id: lfcs
title: Linux Foundation Certified System Administrator (LFCS)
issuer: Linux Foundation
curriculumVersion: "2025"
objectives:
  - id: operations-deployment
    title: Operations deployment
    weight: 25
    topics:
      - Kernel and boot, services and scheduled jobs
      - Software installation and package repositories
      - Processes and resource usage
      - Basic container and VM management
    skills:
      - linux.systemd.units
      - linux.systemd.unit-editing
      - linux.systemd.journal
      - linux.packages.apt
      - linux.packages.version-pinning
      - linux.packages.repositories
      - linux.processes.management
      - linux.processes.scheduled-jobs
      - linux.security.mac
  - id: networking
    title: Networking
    weight: 25
    topics:
      - IPv4/IPv6 configuration and name resolution
      - Firewalling and packet filtering
      - Remote access and secure transport
      - Network troubleshooting
    skills:
      - linux.net.ip-config
      - linux.net.name-resolution
      - linux.net.firewall
      - linux.net.troubleshooting
      - linux.remote.ssh
      - linux.security.tls-certificates
  - id: storage
    title: Storage
    weight: 20
    topics:
      - Filesystems and mounts
      - LVM
      - Swap and quotas
    skills:
      - linux.storage.filesystems
      - linux.storage.mounts
      - linux.storage.lvm
  - id: essential-commands
    title: Essential commands
    weight: 20
    topics:
      - Files, directories and links
      - Text search and manipulation
      - Archives and backups
      - Shell scripting
    skills:
      - linux.shell.navigation
      - linux.shell.redirection
      - linux.shell.text-processing
      - linux.shell.scripting
      - linux.files.permissions
      - linux.files.links-archives
  - id: users-groups
    title: Users and groups
    weight: 10
    topics:
      - Local accounts and groups
      - Privilege escalation with sudo
      - Resource limits and access policy
    skills:
      - linux.users.accounts
      - linux.users.sudo
