    description: The run history shows a failed run of branch ci whose syntax check passed and whose lint step failed
    type: shell
    'on': ov-ctl
    skills:
    - automation.quality.ci
    weight: 3
    command: |
      /opt/ansible/bin/python3 -I - failed <<'EOF'
      import json, glob, sys, os, re, shlex
      runs = [json.load(open(f)) for f in sorted(glob.glob('/var/ci/runs/*.json'))]
      ci = [r for r in runs if r['ref'] == 'refs/heads/ci']
      LINT_FLAGS = {'--strict', '-v', '-vv', '-q', '--nocolor', '--offline', '-p', '--parseable'}


      def segments(cmd):
          # simple commands joined by && only: no pipes, ;, ||, background, redirects or substitutions
          # (a block scalar step ends with a newline, which is not part of the command)
          cmd = cmd.strip()
          if re.search(r'[|;<>`$(){}&\\\n]', cmd.replace('&&', '')):
              return None
          try:
              return [shlex.split(seg) for seg in cmd.split('&&')]
          except ValueError:
              return None


      def is_step(cmd, key):
          segs = segments(cmd)
          if not segs:
              return False
          hits = 0
          for w in segs:
              if not w:
                  return False
              if w[0] == 'cd' and len(w) == 2:
                  continue
              # only the bare tool names or their /opt/ansible/bin absolute paths: any other
              # path (a learner-made script named molecule) is not the real tool
              if '/' in w[0] and os.path.dirname(w[0]) != '/opt/ansible/bin':
                  return False
              b = os.path.basename(w[0])
              if key == 'syntax' and b == 'ansible-playbook' and '--syntax-check' in w and 'site.yml' in w:
                  hits += 1
              elif key == 'molecule' and b == 'molecule' and len(w) >= 2 and w[1] == 'test':
                  hits += 1
              elif key == 'lint' and b == 'ansible-lint':
                  args, i = w[1:], 0
                  while i < len(args):
                      a = args[i]
                      if a == '--profile' and i + 1 < len(args):
                          i += 2
                          continue
                      if a.startswith('--profile='):
                          i += 1
                          continue
                      if a in LINT_FLAGS or not a.startswith('-'):
                          i += 1
                          continue
                      return False
                  hits += 1
              else:
                  return False
          return hits == 1


      def st(r, key):
          return [s for s in r['steps'] if is_step(s['run'], key) and s.get('rc') not in (126, 127)]


      def verdict(r):
          return (r.get('lint') or {}).get('verdict')


      want = sys.argv[1]
      if want == 'failed':
          for r in ci:
              lint = st(r, 'lint'); syn = st(r, 'syntax')
              if r['status'] == 'failed' and verdict(r) == 'findings' and lint and lint[0]['status'] == 'failed' and syn and syn[0]['status'] == 'passed':
                  print('ok'); raise SystemExit
          print('no-failed-lint-run' if ci else 'no-runs-on-ci')
      else:
          for i, r in enumerate(ci):
              lint = st(r, 'lint'); syn = st(r, 'syntax'); mol = st(r, 'molecule')
              if r['status'] != 'passed' or verdict(r) != 'clean' or (r.get('molecule') or {}).get('verdict') != 'passed' or not (lint and syn and mol) or any(s['status'] != 'passed' for s in r['steps']):
                  continue
              for f in ci[:i]:
                  if f['status'] == 'failed' and verdict(f) == 'findings' and f['sha'] in r['chain'] and f['sha'] != r['sha']:
                      print('ok'); raise SystemExit
          print('no-green-run-after-a-failure')
      EOF
    expect:
      match: exact
      value: ok
