  solution:
    explanation: |
      The pipeline file `.ov-ci.yml` lists three steps: `ansible-playbook --syntax-check site.yml`, `ansible-lint` and
      `molecule test` in the role directory. Pushing it together with a task that has no name and uses `shell` makes the lint
      step fail (the run history shows the syntax check green, lint red, Molecule skipped). A second commit removes the task;
      the next run passes all three steps. `main` is never touched. The run history is in `/var/ci/runs` (`ov-ci-runs`).
    steps:
    - 'on': ov-ctl
      as: learner
      timeoutSec: 600
      run: |
        set -e
        cd ~ && rm -rf claims-automation && git clone -q git@ov-git:claims-automation.git && cd claims-automation
        git config user.name learner && git config user.email learner@orrinvale.example
        git switch -q -c ci
        wait_runs() { i=0; while [ "$(ls /var/ci/runs/*.json 2>/dev/null | wc -l)" -lt "$1" ] && [ $i -lt 180 ]; do sleep 3; i=$((i+1)); done; }
        cat > .ov-ci.yml <<'EOF'
        steps:
          - name: syntax
            run: ansible-playbook --syntax-check site.yml
          - name: lint
            run: ansible-lint
          - name: molecule
            run: cd roles/audit_agent && molecule test
            timeout: 420
        EOF
        cat >> roles/audit_agent/tasks/main.yml <<'EOF'

        - ansible.builtin.shell: echo audit agent ready
        EOF
        git add -A
        git commit -q -m 'Add pipeline (and a sloppy task)'
        git push -q -u origin ci
        wait_runs 1
    - 'on': ov-ctl
      as: learner
      timeoutSec: 600
      run: |
        set -e
        cd ~/claims-automation
        wait_runs() { i=0; while [ "$(ls /var/ci/runs/*.json 2>/dev/null | wc -l)" -lt "$1" ] && [ $i -lt 180 ]; do sleep 3; i=$((i+1)); done; }
        python3 - <<'PY'
        import re
        p='roles/audit_agent/tasks/main.yml'
        s=open(p).read()
        s=s[:s.index('\n- ansible.builtin.shell: echo audit agent ready')]+'\n'
        open(p,'w').write(s.rstrip('\n')+'\n')
        PY
        git commit -qam 'Remove the unnamed task'
        git push -q origin ci
        wait_runs 2
    alternatives:
    - id: basic-profile
      description: Runs ansible-lint with the basic profile and removes the sloppy task with sed.
      steps:
      - 'on': ov-ctl
        as: learner
        timeoutSec: 600
        run: |
          set -e
          cd ~ && rm -rf claims-automation && git clone -q git@ov-git:claims-automation.git && cd claims-automation
          git config user.name learner && git config user.email learner@orrinvale.example
          git switch -q -c ci
          wait_runs() { i=0; while [ "$(ls /var/ci/runs/*.json 2>/dev/null | wc -l)" -lt "$1" ] && [ $i -lt 180 ]; do sleep 3; i=$((i+1)); done; }
          cat > .ov-ci.yml <<'EOF'
          steps:
            - name: syntax
              run: ansible-playbook --syntax-check site.yml
            - name: lint
              run: ansible-lint --profile basic
            - name: molecule
              run: cd roles/audit_agent && molecule test
              timeout: 420
          EOF
          cat >> roles/audit_agent/tasks/main.yml <<'EOF'

