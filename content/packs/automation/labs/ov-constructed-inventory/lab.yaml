apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ov-constructed-inventory
  title: Group hosts by facts with a constructed inventory
  domain: automation
  frameworks:
  - ex374-aligned:dynamic-inventory
  difficulty: medium
  estimatedMinutes: 25
  tags:
  - ansible
  - inventory
  - constructed
  - groups
  version: 1
spec:
  description: |
    The inventory directory **`/home/learner/claims-automation/inventory`** holds `01-hosts.yml`, the claims
    estate with a few variables per host: `os_family`, `tier` and `mem_mb`. Do not edit that file.

    Add a constructed inventory source to the same directory so that `ansible-inventory --graph` shows

    - a group **`os_<family>`** for every operating system family value,
    - a group **`tier_<tier>`** for every tier value, and
    - a group **`big_mem`** with every host that has **more than 4 GiB** of memory.

    There must be no other new groups.
  objectives:
  - Use the constructed inventory plugin
  - Create groups from host variables with keyed_groups
  - Derive groups from an expression
  params:
    memweb1:
      type: choice
      values:
      - 8192
      - 12288
    tierweb2:
      type: choice
      values:
      - silver
      - bronze
    memweb2:
      type: choice
      values:
      - 2048
      - 6144
    memquote:
      type: choice
      values:
      - 1024
      - 4096
      - 16384
  topology:
    entry: ov-ctl
    nodes:
    - name: ov-ctl
      driver: container
      image: ansible-ctl:2.21
      access:
      - shell
  setup:
  - 'on': ov-ctl
    run: |
      set -eu
      p=/home/learner/claims-automation
      install -d -o learner -g learner $p $p/inventory
      cat > $p/inventory/01-hosts.yml <<'EOF'
      all:
        children:
          claims:
            hosts:
              ov-claims-web1: {os_family: el, tier: gold, mem_mb: {{memweb1}}}
              ov-claims-web2: {os_family: el, tier: {{tierweb2}}, mem_mb: {{memweb2}}}
              ov-db-1: {os_family: el, tier: gold, mem_mb: 4096}
          quoting:
            hosts:
              ov-quote-api1: {os_family: deb, tier: bronze, mem_mb: {{memquote}}}
      EOF
      printf '[defaults]\ninventory = inventory\n' > $p/ansible.cfg
      chown -R learner:learner $p
      sha256sum $p/inventory/01-hosts.yml $p/ansible.cfg > /var/tmp/.ct-constructed.sum
  checks:
  - id: constructed-source
    description: The inventory directory holds a constructed inventory source next to the unchanged host file
    type: shell
    'on': ov-ctl
    skills:
    - automation.inventory.dynamic
    weight: 1
    command: |
      cd /
      ct-ansible run /home/learner timeout 30 sha256sum -c --quiet /var/tmp/.ct-constructed.sum >/dev/null 2>&1 || { echo static-inventory-edited; exit 0; }
      # Every source besides 01-hosts.yml must be a plain constructed-plugin file: a hand-written static group file, an ini or
      # script source, a symlink or a subdirectory would let the groups be typed in instead of derived.
      ct-ansible run /home/learner/claims-automation timeout 30 sh -c '
        n=0
        for f in $(find inventory -mindepth 1 ! -name 01-hosts.yml 2>/dev/null | head -50); do
          [ -f "$f" ] && [ ! -L "$f" ] || { echo "static-source:$f"; exit 0; }
          case $f in *.yml|*.yaml) ;; *) echo "static-source:$f"; exit 0;; esac
          head -c 65536 "$f" | grep -qE "^plugin: *(ansible\.builtin\.)?constructed *$" || { echo "static-source:$f"; exit 0; }
          head -c 65536 "$f" | grep -qE "^(keyed_groups|groups):" || { echo "no-rules:$f"; exit 0; }
          n=$((n+1))
        done
        [ "$n" -ge 1 ] && echo ok || echo no-constructed-source'
    expect:
      match: exact
      value: ok
  - id: groups-graph
    description: ansible-inventory lists exactly the expected os_*, tier_* and big_mem groups with the right hosts
    type: shell
    'on': ov-ctl
    skills:
    - automation.inventory.dynamic
    weight: 4
    timeoutSec: 120
    command: |
      /opt/ansible/bin/python3 -I - <<'EOF'
      import json, subprocess
      def load(args):
          out = subprocess.run(['ct-ansible', 'run', '/home/learner/claims-automation'] + args, capture_output=True, text=True, timeout=100).stdout
          return json.loads(out)
      def judge(inv, rows):
          want = {}
          for h, (osf, tier, mem) in rows.items():
              want.setdefault('os_' + osf, set()).add(h)
              want.setdefault('tier_' + tier, set()).add(h)
              if mem > 4096:
                  want.setdefault('big_mem', set()).add(h)
          bad = [g for g, hs in want.items() if set(inv.get(g, {}).get('hosts', [])) != hs]
          extra = [g for g in inv if g not in want and g not in ('_meta', 'all', 'claims', 'quoting', 'ungrouped')]
          return sorted(bad) + ['extra:' + ','.join(sorted(extra))] * bool(extra)
      real = {'ov-claims-web1': ('el', 'gold', {{memweb1}}), 'ov-claims-web2': ('el', '{{tierweb2}}', {{memweb2}}),
              'ov-db-1': ('el', 'gold', 4096), 'ov-quote-api1': ('deb', 'bronze', {{memquote}})}
      # the same sources against a different estate: groups that were typed in instead of derived do not follow
      alt = {'ov-claims-web1': ('deb', 'silver', 3000), 'ov-claims-web2': ('el', 'gold', 9000),
             'ov-db-1': ('deb', 'bronze', 4097), 'ov-quote-api1': ('el', 'silver', 4096)}
      try:
          inv = load(['ansible-inventory', '--list'])
      except Exception:
          print('inventory-does-not-load'); raise SystemExit
      res = judge(inv, real)
      if res:
          print(' '.join(res)); raise SystemExit
      hosts = "all:\n  children:\n    claims:\n      hosts:\n"
      for h, (osf, tier, mem) in alt.items():
          hosts += "        %s: {os_family: %s, tier: %s, mem_mb: %d}\n" % (h, osf, tier, mem)
      script = 'd=$(mktemp -d) && cp -r inventory "$d/inventory" && rm -f "$d/inventory/01-hosts.yml" && printf "%s" "$1" > "$d/inventory/01-hosts.yml" && timeout 60 ansible-inventory -i "$d/inventory" --list; rm -rf "$d"'
      try:
          inv2 = load(['sh', '-c', script, 'sh', hosts])
      except Exception:
          print('groups-not-derived'); raise SystemExit
      res = judge(inv2, alt)
      print('groups-not-derived' if res else 'ok')
      EOF
    expect:
      match: exact
      value: ok
  hints:
  - title: Plugin file
    body: 'An inventory source file named `*.yml` in the inventory directory that starts with `plugin: ansible.builtin.constructed` is a constructed source. `ansible-doc -t inventory ansible.builtin.constructed` documents `keyed_groups` and `groups`.'
    cost: 1
  - title: Names and conditions
    body: '`keyed_groups` entries take `key`, `prefix` and `separator` (the default separator is an underscore). Entries in `groups` map a group name to a Jinja condition evaluated per host; variables from YAML flow mappings keep their type, but converting with `| int` is harmless.'
    cost: 2
  misconceptions:
  - id: no-prefix
    description: Creates keyed groups without a prefix, so the groups are named with a bare separator (_el, _deb, _gold...)
    feedback: The groups must be called os_<family> and tier_<tier>; give each keyed group a prefix.
    expectFail:
    - groups-graph
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        cat > inventory/02-constructed.yml <<'EOF'
        plugin: ansible.builtin.constructed
        strict: false
        keyed_groups:
          - key: os_family
            prefix: ''
          - key: tier
            prefix: ''
        groups:
          big_mem: mem_mb | int > 4096
        EOF
  - id: at-least-4-gib
    description: Uses greater-or-equal, so a host with exactly 4 GiB lands in big_mem.
    feedback: 'The condition is "more than 4 GiB": exactly 4096 MB does not qualify.'
    expectFail:
    - groups-graph
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        cat > inventory/02-constructed.yml <<'EOF'
        plugin: ansible.builtin.constructed
        strict: false
        keyed_groups:
          - key: os_family
            prefix: os
            separator: "_"
          - key: tier
            prefix: tier
            separator: "_"
        groups:
          big_mem: mem_mb | int >= 4096
        EOF
  - id: static-groups
    description: Types the groups into a static inventory file and adds an empty constructed file so the plugin check passes.
    feedback: The groups must be derived from the host variables by the constructed plugin; a static group file stops following the hosts when they change.
    expectFail:
    - constructed-source
    - groups-graph
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        python3 - <<'PYEOF'
        import json, subprocess
        inv = json.loads(subprocess.run(['ansible-inventory', '--list'], capture_output=True, text=True).stdout)
        meta = inv['_meta']['hostvars']
        groups = {}
        for h, v in meta.items():
            groups.setdefault('os_' + v['os_family'], []).append(h)
            groups.setdefault('tier_' + v['tier'], []).append(h)
            if int(v['mem_mb']) > 4096:
                groups.setdefault('big_mem', []).append(h)
        lines = ['all:', '  children:']
        for g, hs in groups.items():
            lines += ['    %s:' % g, '      hosts:'] + ['        %s: {}' % h for h in hs]
        open('inventory/02-groups.yml', 'w').write('\n'.join(lines) + '\n')
        open('inventory/03-constructed.yml', 'w').write('plugin: ansible.builtin.constructed\n')
        PYEOF
  - id: source-outside-inventory
    description: Saves the constructed source next to the playbooks instead of in the inventory directory.
    feedback: The configured inventory is the inventory directory; a source outside it is never read.
    expectFail:
    - constructed-source
    - groups-graph
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        cat > constructed.yml <<'EOF'
        plugin: ansible.builtin.constructed
        strict: false
        keyed_groups:
          - key: os_family
            prefix: os
            separator: "_"
          - key: tier
            prefix: tier
            separator: "_"
        groups:
          big_mem: mem_mb | int > 4096
        EOF
  solution:
    explanation: |
      `ansible.builtin.constructed` is an inventory plugin that builds groups from variables the other sources already set. A
      file `inventory/02-constructed.yml` with `plugin: ansible.builtin.constructed` loads after `01-hosts.yml`. `keyed_groups` turns
      the values of `os_family` and `tier` into `os_<family>` and `tier_<tier>` groups (prefix and separator); the `groups`
      expression `mem_mb | int > 4096` creates `big_mem` for hosts with more than 4 GiB.
    steps:
    - 'on': ov-ctl
      as: learner
      timeoutSec: 120
      run: |
        cd ~/claims-automation
        cat > inventory/02-constructed.yml <<'EOF'
        plugin: ansible.builtin.constructed
        strict: false
        keyed_groups:
          - key: os_family
            prefix: os
            separator: "_"
          - key: tier
            prefix: tier
            separator: "_"
        groups:
          big_mem: mem_mb | int > 4096
        EOF
        ansible-inventory --graph
    alternatives:
    - id: explicit-group-expressions
      description: Spells every group out as a boolean expression instead of keyed_groups.
      steps:
      - 'on': ov-ctl
        as: learner
        timeoutSec: 120
        run: |
          cd ~/claims-automation
          cat > inventory/02-constructed.yml <<'EOF'
          plugin: ansible.builtin.constructed
          strict: false
          groups:
            os_el: os_family == 'el'
            os_deb: os_family == 'deb'
            tier_gold: tier == 'gold'
            tier_silver: tier == 'silver'
            tier_bronze: tier == 'bronze'
            big_mem: mem_mb | int > 4096
          EOF
          ansible-inventory --graph
