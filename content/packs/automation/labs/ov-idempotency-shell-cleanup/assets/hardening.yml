# Legacy hardening for the claims fleet (2019). Every task "works", every run reports changes.
- name: Baseline hardening
  hosts: all
  become: true
  tasks:
    - name: Ignore ICMP redirects
      ansible.builtin.shell: echo 'net.ipv4.conf.all.accept_redirects = 0' > /etc/sysctl.d/90-ov-hardening.conf

    - name: No root logins over SSH
      ansible.builtin.shell: sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config

    - name: Audit service account
      ansible.builtin.shell: useradd -r -M -s /sbin/nologin ovaudit || true

    - name: Audit log directory
      ansible.builtin.shell: mkdir -p /var/log/ov-audit && chown ovaudit:root /var/log/ov-audit && chmod 0750 /var/log/ov-audit

    - name: Network login banner
      ansible.builtin.shell: "printf 'Orrin & Vale Insurance: authorised use only\\n' > /etc/issue.net"

    - name: Restrictive default umask
      ansible.builtin.shell: grep -q '^umask 027' /etc/profile.d/ov.sh || echo 'umask 027' >> /etc/profile.d/ov.sh

    - name: Protect the system crontab
      ansible.builtin.command: chmod 0600 /etc/crontab

    - name: Mark the host as hardened
      ansible.builtin.shell: mkdir -p /etc/ov && touch /etc/ov/hardened
