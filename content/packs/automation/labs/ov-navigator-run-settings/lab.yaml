apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ov-navigator-run-settings
  title: Run playbooks through a navigator settings file
  domain: automation
  frameworks:
  - ex294-aligned:run-content
  difficulty: easy
  estimatedMinutes: 15
  tags:
  - ansible
  - navigator
  - artifacts
  version: 1
spec:
  description: |
    The claims platform team standardises on **ansible-navigator**. In
    **`/home/learner/claims-automation`** you find `inventory.yml` and a working `site.yml`
    that configures the claims web nodes.

    Add a project settings file **`ansible-navigator.yml`** that

    - runs without execution environments (this workstation has no container engine),
    - uses the non-interactive `stdout` mode, and
    - saves the playbook artifact of every run under **`/home/learner/claims-automation/artifacts/`**.

    Then run `site.yml` with `ansible-navigator run` so that an artifact file appears there. Do not
    change `site.yml`; running it again must report no changes.
  objectives:
  - Configure ansible-navigator with a project settings file
  - Run a playbook in stdout mode
  - Keep playbook artifacts for later review
  params:
    bootpw:
      type: int
      min: 100000
      max: 999999
    rel:
      type: int
      min: 100
      max: 999
  topology:
    entry: ov-ctl
    nodes:
    - name: ov-ctl
      driver: container
      image: ansible-ctl:2.21
      access:
      - shell
    - name: ov-claims-web1
      driver: container
      image: el-lab:10
      resources:
        cpu: 0.2
        memoryMiB: 256
    - name: ov-claims-web2
      driver: container
      image: el-lab:10
      resources:
        cpu: 0.2
        memoryMiB: 256
    links:
    - a: ov-ctl:eth1
      b: ov-claims-web1:eth1
    - a: ov-ctl:eth2
      b: ov-claims-web2:eth1
  setup:
  - 'on': ov-claims-web1
    run: &ov-node |
      set -eu
      case $(hostname) in
        ov-claims-web1) a=11 ;; ov-claims-web2) a=12 ;;
        *) echo "unknown host $(hostname)" >&2; exit 1 ;;
      esac
      ip link set eth1 up
      ip addr replace 10.70.0.$a/24 dev eth1
      id ovauto >/dev/null 2>&1 || useradd -m -s /bin/bash -c "Orrin and Vale automation" ovauto
      echo 'ovauto:Ov-boot-{{bootpw}}' | chpasswd
      printf 'ovauto ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/ovauto
      chmod 0440 /etc/sudoers.d/ovauto
      ssh-keygen -A >/dev/null 2>&1
      mkdir -p /run/sshd
      pgrep -x sshd >/dev/null || /usr/sbin/sshd
      # run stamp: every fact gathering (as root) gets a fresh token, logged on the host for the grader
      mkdir -p /etc/ansible/facts.d /var/lib/ov-nav
      chmod 0700 /var/lib/ov-nav
      : > /var/lib/ov-nav/tokens
      cat > /etc/ansible/facts.d/ov_run.fact <<'EOF'
      #!/bin/sh
      # Orrin and Vale run stamp
      t=$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
      echo "$(date +%s) $t" >> /var/lib/ov-nav/tokens
      printf '{"token": "%s"}\n' "$t"
      EOF
      chmod 0755 /etc/ansible/facts.d/ov_run.fact
  - 'on': ov-claims-web2
    run: *ov-node
  - 'on': ov-ctl
    timeoutSec: 300
    run: |
      set -eu
      ct-fleet-net 10.70.0.10/24 ov-claims-web1=10.70.0.11 ov-claims-web2=10.70.0.12
      ct-ansible pushkey --seal ovauto Ov-boot-{{bootpw}} ov-claims-web1 ov-claims-web2
      # grading account: a separate uid with its own key for ovauto on the nodes; graded runs never execute as the learner
      id ctjudge >/dev/null 2>&1 || useradd -r -m -d /var/lib/ctjudge -s /usr/sbin/nologin ctjudge
      chmod 0700 /var/lib/ctjudge
      install -d -m 0700 -o ctjudge -g ctjudge /var/lib/ctjudge/.ssh
      [ -f /var/lib/ctjudge/.ssh/id_ed25519 ] || runuser -u ctjudge -- ssh-keygen -q -t ed25519 -N '' -C ctjudge -f /var/lib/ctjudge/.ssh/id_ed25519
      printf 'Host *\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' > /var/lib/ctjudge/.ssh/config
      chown ctjudge:ctjudge /var/lib/ctjudge/.ssh/config; chmod 0600 /var/lib/ctjudge/.ssh/config
      k=$(cat /var/lib/ctjudge/.ssh/id_ed25519.pub)
      for h in ov-claims-web1 ov-claims-web2; do ct-ansible run /home/learner ssh ovauto@$h "grep -qxF '$k' .ssh/authorized_keys || echo '$k' >> .ssh/authorized_keys"; done
  - 'on': ov-ctl
    run: |
      p=/home/learner/claims-automation
      install -d -o learner -g learner $p
      cat > $p/inventory.yml <<'EOF'
      claims:
        children:
          claims_web:
            hosts:
              ov-claims-web1:
              ov-claims-web2:
      EOF
      printf '[defaults]\ninventory = inventory.yml\nremote_user = ovauto\n' > $p/ansible.cfg
      chown learner:learner $p/inventory.yml $p/ansible.cfg

      cat > $p/site.yml <<'EOF'
      - name: Claims portal baseline
        hosts: claims_web
        become: true
        vars:
          portal_release: r{{rel}}
        tasks:
          - name: Portal configuration directory
            ansible.builtin.file:
              path: /etc/ov/claims-portal
              state: directory
              mode: "0755"
          - name: Portal release marker
            ansible.builtin.copy:
              dest: /etc/ov/claims-portal/site.conf
              content: |
                release={{ portal_release }}
                owner=claims-platform
              mode: "0644"
      EOF
      chown learner:learner $p/site.yml
      sha256sum $p/site.yml > /var/tmp/.ct-nav-site.sum
      touch /var/tmp/.ct-nav-start
  checks:
  - id: navigator-config
    description: ansible-navigator.yml in the project disables execution environments, uses stdout mode and saves artifacts under artifacts/
    type: shell
    'on': ov-ctl
    skills:
    - automation.devworkflow.navigator
    weight: 2
    command: |
      # the learner's file is read as the learner (bounded) into a copy; the verdict is computed by an unprivileged
      # account the learner cannot signal, from that copy
      snap=$(mktemp); trap 'rm -f "$snap"' EXIT; chmod 0644 "$snap"
      ct-ansible run /home/learner/claims-automation timeout 10 head -c 262145 ansible-navigator.yml > "$snap" 2>/dev/null
      runuser -u nobody -- env -i HOME=/nonexistent PATH=/opt/ansible/bin:/usr/bin:/bin LANG=C.UTF-8 timeout 30 /opt/ansible/bin/python3 -I - "$snap" <<'EOF'
      import os, sys, yaml
      try:
          if os.path.getsize(sys.argv[1]) > 262144: raise ValueError('large')
          d = yaml.safe_load(open(sys.argv[1]))['ansible-navigator']
      except Exception:
          print('no-config'); raise SystemExit
      r = []
      if (d.get('execution-environment') or {}).get('enabled') is not False: r.append('ee')
      if d.get('mode') != 'stdout': r.append('mode')
      pa = d.get('playbook-artifact') or {}
      proj = '/home/learner/claims-automation'
      sa = str(pa.get('save-as', '')).replace('{playbook_dir}', proj)
      if sa.startswith('~'): sa = '/home/learner' + sa[1:]
      sa = os.path.normpath(os.path.join(proj, sa))
      if not sa.startswith(proj + '/artifacts/'): r.append('save-as')
      if pa.get('enable') is False: r.append('disabled')
      print(' '.join(r) or 'ok')
      EOF
    expect:
      match: exact
      value: ok
  - id: artifact-saved
    description: An artifact that ansible-navigator saved for a site.yml run is under artifacts/, with navigator's fields, both web nodes' task results and recap, and fact-gathering stamps the web nodes issued during this lab
    type: shell
    'on': ov-ctl
    skills:
    - automation.devworkflow.navigator
    weight: 2
    timeoutSec: 120
    command: |
      # Each artifact is copied as the learner (bounded) into a root-owned file and parsed by nobody. It must be a real
      # navigator artifact of a site.yml run: navigator's own fields, the per-host task events of both web nodes and a clean
      # recap in its stdout, and the run stamps that fact gathering issued on each node (the nodes log every stamp they
      # hand out, and the grading account ctjudge reads those logs). A hand-written JSON file has none of these stamps.
      d=/home/learner/claims-automation/artifacts
      s=$(mktemp); trap 'rm -f $s' EXIT; chmod 0644 $s
      S() { runuser -u ctjudge -- env -i HOME=/var/lib/ctjudge PATH=/usr/bin:/bin timeout 30 ssh ovauto@$1 "$2" 2>/dev/null; }
      r=none
      for f in $(ct-ansible run $d timeout 20 sh -c 'ls -t -- *.json 2>/dev/null | head -20'); do
        case $f in *[!A-Za-z0-9._:+-]*) continue ;; esac
        ( ulimit -f 65536; ct-ansible run $d timeout 20 sh -c 'test -f "$1" && test ! -L "$1" && test "$1" -nt /var/tmp/.ct-nav-start && head -c 33554433 "$1"' sh "$f" > $s 2>/dev/null ) || continue
        v=$(runuser -u nobody -- env -i HOME=/nonexistent PATH=/usr/bin:/bin LANG=C.UTF-8 timeout 60 /opt/ansible/bin/python3 -I - "$s" <<'EOF'
      import json, os, re, sys
      try:
          if os.path.getsize(sys.argv[1]) > 33554432:
              raise ValueError('large')
          j = json.load(open(sys.argv[1]))
      except Exception:
          print('invalid'); raise SystemExit
      if not (isinstance(j, dict) and j.get('status') == 'successful' and j.get('version') == '2.0.0'
              and isinstance(j.get('stdout'), list) and isinstance(j.get('settings_entries'), dict) and isinstance(j.get('plays'), list) and j['plays']):
          print('incomplete'); raise SystemExit
      pb = (((j['settings_entries'].get('ansible-navigator') or {}).get('ansible') or {}).get('playbook') or {}).get('path')
      if pb != '/home/learner/claims-automation/site.yml':
          print('not-site'); raise SystemExit
      H = ('ov-claims-web1', 'ov-claims-web2')
      toks, seen = {}, {h: set() for h in H}
      for play in j['plays']:
          for t in (play.get('tasks') or []) if isinstance(play, dict) else []:
              if not isinstance(t, dict) or t.get('host') not in H:
                  continue
              seen[t['host']].add(t.get('task'))
              loc = (((t.get('res') or {}).get('ansible_facts') or {}).get('ansible_local') or {}).get('ov_run') or {}
              if t.get('task_action') in ('gather_facts', 'setup', 'ansible.builtin.gather_facts', 'ansible.builtin.setup') and re.fullmatch(r'[0-9a-f]{16}', str(loc.get('token', ''))):
                  toks.setdefault(t['host'], set()).add(loc['token'])
      out = re.sub(r'\x1b\[[0-9;]*m', '', '\n'.join(str(x) for x in j['stdout']))
      bad = []
      for h in H:
          if not re.search(r'^%s\s*:\s*ok=\d+\s+changed=\d+\s+unreachable=0\s+failed=0\b' % re.escape(h), out, re.M):
              bad.append('recap-' + h)
          if not {'Portal configuration directory', 'Portal release marker'} <= seen[h]:
              bad.append('tasks-' + h)
          if len(toks.get(h, ())) != 1:
              bad.append('stamp-' + h)
      print(' '.join(bad) if bad else 'ok ' + ' '.join(next(iter(toks[h])) for h in H))
      EOF
        )
        set -- $v
        [ "$1" = ok ] || { r=${1:-parse-failed}; continue; }
        a=$(S ov-claims-web1 'sudo -n cat /var/lib/ov-nav/tokens' | awk -v t="$2" '$2 == t {print $1; exit}')
        b=$(S ov-claims-web2 'sudo -n cat /var/lib/ov-nav/tokens' | awk -v t="$3" '$2 == t {print $1; exit}')
        if [ -n "$a" ] && [ -n "$b" ] && [ $((a - b)) -le 600 ] && [ $((b - a)) -le 600 ]; then echo ok; exit 0; fi
        r=stamps-not-issued
      done
      echo "$r"
    expect:
      match: exact
      value: ok
  - id: portal-claimsweb1
    description: ov-claims-web1 has the portal release marker from site.yml
    type: shell
    'on': ov-claims-web1
    skills: &a208
    - automation.devworkflow.navigator
    command: &chk_portal-n |
      [ "$(cat /etc/ov/claims-portal/site.conf 2>/dev/null)" = "$(printf 'release=r{{rel}}\nowner=claims-platform')" ] && echo ok || echo wrong
    expect:
      match: exact
      value: ok
  - id: portal-claimsweb2
    description: ov-claims-web2 has the portal release marker from site.yml
    type: shell
    'on': ov-claims-web2
    skills: *a208
    command: *chk_portal-n
    expect:
      match: exact
      value: ok
  - id: site-unchanged-idempotent
    description: site.yml is unchanged and runs again without changes
    type: shell
    'on': ov-ctl
    skills:
    - automation.devworkflow.navigator
    weight: 1
    timeoutSec: 240
    command: |
      ct-ansible run /home/learner timeout 30 sha256sum -c --quiet /var/tmp/.ct-nav-site.sum >/dev/null 2>&1 || { echo site-edited; exit 0; }
      ct-ansible recap /home/learner/claims-automation site.yml
    expect:
      match: exact
      value: changed=0 failed=0 unreachable=0
  hints:
  - title: Where settings live
    body: navigator reads `ansible-navigator.yml` from the current directory. The top-level key is `ansible-navigator`, with keys such as `execution-environment`, `mode` and `playbook-artifact`.
    cost: 1
  - title: Artifact settings
    body: '`playbook-artifact` has `enable` and `save-as`. The save-as value may use `{playbook_dir}`, `{playbook_name}` and `{time_stamp}`. The command `ansible-navigator settings --sample` prints every option.'
    cost: 2
  misconceptions:
  - id: ee-left-enabled
    description: Saves artifacts but leaves execution environments enabled, so navigator tries to start a container.
    feedback: 'There is no container engine here: set execution-environment enabled to false in the settings file.'
    expectFail:
    - navigator-config
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        mkdir -p artifacts
        cat > ansible-navigator.yml <<'EOF'
        ---
        ansible-navigator:
          execution-environment:
            enabled: true
          mode: stdout
          playbook-artifact:
            enable: true
            save-as: "{playbook_dir}/artifacts/{playbook_name}-{time_stamp}.json"
        EOF
        ansible-navigator run site.yml || true
  - id: default-artifact-path
    description: Runs navigator with execution environments off but never configures where artifacts go.
    feedback: The artifact must be saved under the project artifacts directory; set playbook-artifact save-as in the settings file.
    expectFail:
    - navigator-config
    - artifact-saved
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        mkdir -p artifacts
        cat > ansible-navigator.yml <<'EOF'
        ansible-navigator:
          execution-environment:
            enabled: false
          mode: stdout
        EOF
        ansible-navigator run site.yml
  - id: plain-ansible-playbook
    description: Runs ansible-playbook directly and expects a navigator artifact to appear.
    feedback: ansible-playbook does not write playbook artifacts; run the playbook through ansible-navigator with the settings file.
    expectFail:
    - navigator-config
    - artifact-saved
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        ansible-playbook site.yml
  - id: hand-written-artifact
    description: Runs the playbook with ansible-playbook and writes a navigator-style artifact by hand (navigator's fields, task events for both nodes, a recap and made-up run stamps).
    feedback: The artifact has to come from an ansible-navigator run; its fact-gathering stamps must be ones the web nodes issued.
    expectFail:
    - artifact-saved
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/claims-automation
        mkdir -p artifacts
        cat > ansible-navigator.yml <<'EOF'
        ---
        ansible-navigator:
          execution-environment:
            enabled: false
          mode: stdout
          playbook-artifact:
            enable: true
            save-as: "{playbook_dir}/artifacts/{playbook_name}-{time_stamp}.json"
        EOF
        ansible-playbook site.yml
        /opt/ansible/bin/python3 - <<'EOF'
        import json
        tasks = []
        for h, tok in (('ov-claims-web1', '0123456789abcdef'), ('ov-claims-web2', 'fedcba9876543210')):
            tasks.append({'host': h, 'task': 'Gathering Facts', 'task_action': 'gather_facts',
                          'res': {'ansible_facts': {'ansible_local': {'ov_run': {'token': tok}}}}})
            tasks.append({'host': h, 'task': 'Portal configuration directory', 'task_action': 'ansible.builtin.file', 'res': {}})
            tasks.append({'host': h, 'task': 'Portal release marker', 'task_action': 'ansible.builtin.copy', 'res': {}})
        art = {'version': '2.0.0', 'status': 'successful', 'status_color': 42,
               'settings_entries': {'ansible-navigator': {'ansible': {'playbook': {'path': '/home/learner/claims-automation/site.yml'}}}},
               'settings_sources': {}, 'plays': [{'name': 'Claims portal baseline', 'tasks': tasks}],
               'stdout': ['PLAY RECAP ****',
                          'ov-claims-web1             : ok=3    changed=0    unreachable=0    failed=0    skipped=0',
                          'ov-claims-web2             : ok=3    changed=0    unreachable=0    failed=0    skipped=0']}
        json.dump(art, open('artifacts/site-artifact-2026-10-19T00:00:00.000000+00:00.json', 'w'))
        EOF
  solution:
    explanation: |
      The project settings file `ansible-navigator.yml` turns execution environments off (the pod has no
      container engine), selects the non-interactive stdout mode and tells navigator where to save the
      playbook artifact. Running `ansible-navigator run site.yml` then configures the portal and leaves a JSON
      artifact under `artifacts/`; the second run changes nothing.
    steps:
    - 'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        set -e
        cd ~/claims-automation
        mkdir -p artifacts
        cat > ansible-navigator.yml <<'EOF'
        ---
        ansible-navigator:
          execution-environment:
            enabled: false
          mode: stdout
          playbook-artifact:
            enable: true
            save-as: "{playbook_dir}/artifacts/{playbook_name}-{time_stamp}.json"
        EOF
        ansible-navigator run site.yml
    alternatives:
    - id: fixed-artifact-name
      description: Flow-style settings and one artifact file per playbook name instead of a time stamp.
      steps:
      - 'on': ov-ctl
        as: learner
        timeoutSec: 240
        run: |
          set -e
          cd ~/claims-automation
          mkdir -p artifacts
          cat > ansible-navigator.yml <<'EOF'
          ansible-navigator: {execution-environment: {enabled: false}, mode: stdout, playbook-artifact: {enable: true, save-as: "{playbook_dir}/artifacts/{playbook_name}-latest.json"}}
          EOF
          ansible-navigator run site.yml
