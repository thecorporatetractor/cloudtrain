                        add(v[0], v[1])
                        return
                    for x in v:
                        walk(x)
            walk(d)
            return out
        ids = {'lon': '10.255.{{octet}}.1', 'man': '10.255.{{octet}}.2', 'lds': '10.255.{{octet}}.3'}
        adj = {'lon': ['man', 'lds'], 'man': ['lon'], 'lds': ['lon']}
        fault = '{{fault}}'
        me = 'man'
        present = sorted(ids[x] for x in adj[me] if me != fault and x != fault)
        got = norm(json.load(open(sys.argv[1])))
        print('ok' if sorted(got) == present and all(got[i] == 'full' for i in present) else 'wrong-content')
        PY
      expect: { match: exact, value: "ok" }
    - id: parsed-lds
      description: "The parsed neighbour data of ov-branch-lds-gw is saved as structured JSON: exactly the neighbours the router really has, each in state Full"
      type: shell
      on: ov-ctl
      skills: [automation.network.parsing, automation.control-flow.error-handling]
      weight: 1.5
      command: |
        /opt/ansible/bin/python3 - /home/learner/net/ospf/ov-branch-lds-gw.json <<'PY' 2>/dev/null || echo unreadable
        import json, re, sys
        IP = re.compile(r'^\d+\.\d+\.\d+\.\d+$')
        def state_of(v):
            if isinstance(v, str):
