        PY
      expect: { match: exact, value: "ok" }
    - id: reported
      description: "ospf-health.yml really fails (no ignored errors) only for the routers with a broken adjacency, names the missing neighbour, and the JSON files it writes match what the routers report"
      type: shell
      on: ov-ctl
      skills: [automation.network.parsing, automation.control-flow.error-handling]
      weight: 3
      timeoutSec: 240
      command: |
        d=/home/learner/net
        [ -f $d/ospf-health.yml ] || { echo no-playbook; exit 0; }
        rm -f $d/ospf/ov-branch-lon-gw.json $d/ospf/ov-branch-man-gw.json $d/ospf/ov-branch-lds-gw.json
        out=$(ct-ansible run $d env ANSIBLE_NOCOLOR=1 ANSIBLE_STDOUT_CALLBACK=ansible.builtin.default ANSIBLE_RETRY_FILES_ENABLED=0 ansible-playbook ospf-health.yml 2>&1)
        rec=$(echo "$out" | awk '/^PLAY RECAP/ { r = 1; next } r && / : /')
        [ -n "$rec" ] || { echo no-recap; exit 0; }
        f() { echo "$rec" | awk -v h="$1" -v k="$2" '$1 == h { for (i = 2; i <= NF; i++) { split($i, kv, "="); if (kv[1] == k) print kv[2] } }'; }
        for h in ov-branch-lon-gw ov-branch-man-gw ov-branch-lds-gw; do
          [ "$(f $h unreachable)" = 0 ] || { echo "unreachable-or-missing=$h"; exit 0; }
        done
        [ {{fault}} = man ] && good=ov-branch-lds-gw fid=2 || good=ov-branch-man-gw fid=3
        [ "$(f $good failed)" = 0 ] || { echo "healthy-router-failed=$good"; exit 0; }
        for h in ov-branch-lon-gw ov-branch-{{fault}}-gw; do
          [ "$(f $h failed)" -ge 1 ] 2>/dev/null || { echo "not-failed=$h"; exit 0; }
          [ "$(f $h ignored)" = 0 ] || { echo "errors-ignored=$h"; exit 0; }
        done
        echo "$out" | grep -E '^(fatal|failed): \[ov-branch-lon-gw\]' | grep -qE "10\.255\.{{octet}}\.$fid([^0-9]|$)" || { echo neighbour-not-named=ov-branch-lon-gw; exit 0; }
        echo "$out" | grep -E '^(fatal|failed): \[ov-branch-{{fault}}-gw\]' | grep -qE '10\.255\.{{octet}}\.1([^0-9]|$)' || { echo neighbour-not-named=ov-branch-{{fault}}-gw; exit 0; }
        t=$(mktemp -d)
        for h in ov-branch-lon-gw ov-branch-man-gw ov-branch-lds-gw; do
          [ -s $d/ospf/$h.json ] || { echo "not-saved=$h"; rm -rf $t; exit 0; }
          ct-ansible run $d ssh -o BatchMode=yes ovauto@$h "sudo -n vtysh -c 'show ip ospf neighbor json'" > $t/$h.json 2>/dev/null || { echo "device-unreadable=$h"; rm -rf $t; exit 0; }
        done
        /opt/ansible/bin/python3 - $d/ospf $t <<'PY' 2>/dev/null || echo unreadable
        import json, re, sys
        IP = re.compile(r'^\d+\.\d+\.\d+\.\d+$')
        def state_of(v):
            if isinstance(v, str):
                return v
            if isinstance(v, list):
                for x in v:
                    r = state_of(x)
                    if r:
                        return r
            if isinstance(v, dict):
                for k, x in v.items():
                    if 'state' in str(k).lower() and isinstance(x, str):
                        return x
            return None
        def norm(d):
            out = {}
            def add(i, st):
                if isinstance(st, str):
                    out[i] = st.split('/')[0].strip().lower()
            def walk(v):
                if isinstance(v, dict):
                    ips = [k for k in v if isinstance(k, str) and IP.match(k)]
                    if ips:
                        for k in ips:
                            add(k, state_of(v[k]))
                        return
                    ids = [x for k, x in v.items() if isinstance(x, str) and IP.match(x) and any(w in str(k).lower() for w in ('id', 'neighbo', 'router'))]
                    st = state_of(v) if ids else None
                    if isinstance(st, str):
                        add(ids[0], st)
                        return
                    for x in v.values():
                        walk(x)
                elif isinstance(v, list):
                    if len(v) == 2 and all(isinstance(x, str) for x in v) and IP.match(v[0]):
                        add(v[0], v[1])
                        return
                    for x in v:
                        walk(x)
            walk(d)
            return out
        bad = []
        for h in ('ov-branch-lon-gw', 'ov-branch-man-gw', 'ov-branch-lds-gw'):
            try:
                mine = norm(json.load(open(sys.argv[1] + '/' + h + '.json')))
            except Exception:
                bad.append('unreadable=' + h)
                continue
            if mine != norm(json.load(open(sys.argv[2] + '/' + h + '.json'))):
                bad.append('differs-from-device=' + h)
        print(' '.join(bad) or 'ok')
        PY
        rm -rf $t
      expect: { match: exact, value: "ok" }
    - id: fault-man-intact
      description: "The network was only observed: ov-branch-man-gw keeps its configuration"
      type: shell
      on: ov-branch-man-gw
      skills: [automation.control-flow.error-handling]
      weight: 0.5
      command: |
        [ "{{fault}}" = man ] && want=1 || want=0
        have=$(vtysh -c 'show running-config' | grep -c 'ip ospf hello-interval 20')
        [ "$have" = "$want" ] && echo intact || echo changed
      expect: { match: exact, value: "intact" }
    - id: fault-lds-intact
      description: "The network was only observed: ov-branch-lds-gw keeps its configuration"
      type: shell
      on: ov-branch-lds-gw
      skills: [automation.control-flow.error-handling]
      weight: 0.5
      command: |
        [ "{{fault}}" = lds ] && want=1 || want=0
        have=$(vtysh -c 'show running-config' | grep -c 'ip ospf hello-interval 20')
        [ "$have" = "$want" ] && echo intact || echo changed
      expect: { match: exact, value: "intact" }
  hints:
    - title: "Text to data"
      body: |
        `show ip ospf neighbor` prints a table. The `regex_findall` filter with `multiline=True` can pull the neighbour id and the state out of every row at once; `dict()` of the resulting pairs gives a lookup by neighbour id.
      cost: 2
    - title: "Saying which router failed"
      body: |
        `ansible.builtin.assert` fails the task for the host with `fail_msg`. Put `{{ inventory_hostname }}` and the neighbour id in the message; a `loop` over the host's expected neighbours reports the first one that is missing.
      cost: 1
    - title: "Keep the data even when it fails"
      body: |
        The task that saves the parsed data must come before the assertion, otherwise a failing host leaves no file behind.
      cost: 1
  misconceptions:
    - id: failures-ignored
      description: "Prints the problem but ignores the failure so the play ends green."
      feedback: "The play must fail for a router with a missing or not-Full neighbour."
      expectFail: [reported]
      mutation:
        on: ov-ctl
        as: learner
        timeoutSec: 300
        run: |
          set -e
          cd ~/net
          cat > ospf-health.yml <<'EOF'
          - name: OSPF health
            hosts: branch_routers
            become: true
            gather_facts: false
            vars_files:
              - vars/expected.yml
            tasks:
              - name: OSPF neighbours
                ansible.builtin.command: vtysh -c 'show ip ospf neighbor'
                register: nb
                changed_when: false
              - name: Parse the neighbour table
                ansible.builtin.set_fact:
                  ospf_state: "{{ dict(nb.stdout | regex_findall('^(\\d+\\.\\d+\\.\\d+\\.\\d+)\\s+\\d+\\s+(\\w+)', multiline=True)) }}"
              - name: Keep the structured data
                ansible.builtin.copy:
                  dest: /home/learner/net/ospf/{{ inventory_hostname }}.json
                  content: "{{ ospf_state | to_nice_json }}\n"
                  mode: "0644"
                delegate_to: localhost
                become: false
              - name: Every expected neighbour is Full
                ansible.builtin.assert:
                  that: ospf_state[item] | default('missing') == 'Full'
                  fail_msg: "{{ inventory_hostname }}: OSPF neighbour {{ item }} is {{ ospf_state[item] | default('missing') }}"
                loop: "{{ expected_neighbors[inventory_hostname] }}"
                ignore_errors: true
          EOF
          ansible-playbook ospf-health.yml || true
    - id: any-full-neighbour
      description: "Passes a router as soon as any neighbour is Full."
      feedback: "Every expected neighbour must be Full, not just one of them."
      expectFail: [reported]
      mutation:
        on: ov-ctl
        as: learner
        timeoutSec: 300
        run: |
          set -e
          cd ~/net
          cat > ospf-health.yml <<'EOF'
          - name: OSPF health
            hosts: branch_routers
            become: true
            gather_facts: false
            vars_files:
              - vars/expected.yml
            tasks:
              - name: OSPF neighbours
                ansible.builtin.command: vtysh -c 'show ip ospf neighbor'
                register: nb
                changed_when: false
              - name: Parse the neighbour table
                ansible.builtin.set_fact:
                  ospf_state: "{{ dict(nb.stdout | regex_findall('^(\\d+\\.\\d+\\.\\d+\\.\\d+)\\s+\\d+\\s+(\\w+)', multiline=True)) }}"
              - name: Keep the structured data
                ansible.builtin.copy:
                  dest: /home/learner/net/ospf/{{ inventory_hostname }}.json
                  content: "{{ ospf_state | to_nice_json }}\n"
                  mode: "0644"
                delegate_to: localhost
                become: false
              - name: Every expected neighbour is Full
                ansible.builtin.assert:
                  that: "'Full' in nb.stdout"
                  fail_msg: "{{ inventory_hostname }}: OSPF neighbour {{ item }} is {{ ospf_state[item] | default('missing') }}"
                loop: "{{ expected_neighbors[inventory_hostname] }}"
          EOF
          ansible-playbook ospf-health.yml || true
    - id: nothing-saved
      description: "Asserts correctly but keeps no structured data."
      feedback: "The parsed data must be saved per router for later reports."
      expectFail: [parsed-lon, parsed-man, parsed-lds]
      mutation:
        on: ov-ctl
        as: learner
        timeoutSec: 300
        run: |
          set -e
          cd ~/net
          cat > ospf-health.yml <<'EOF'
          - name: OSPF health
            hosts: branch_routers
            become: true
            gather_facts: false
            vars_files:
              - vars/expected.yml
            tasks:
              - name: OSPF neighbours
                ansible.builtin.command: vtysh -c 'show ip ospf neighbor'
                register: nb
                changed_when: false
              - name: Parse the neighbour table
                ansible.builtin.set_fact:
                  ospf_state: "{{ dict(nb.stdout | regex_findall('^(\\d+\\.\\d+\\.\\d+\\.\\d+)\\s+\\d+\\s+(\\w+)', multiline=True)) }}"
              - name: Every expected neighbour is Full
                ansible.builtin.assert:
                  that: ospf_state[item] | default('missing') == 'Full'
                  fail_msg: "{{ inventory_hostname }}: OSPF neighbour {{ item }} is {{ ospf_state[item] | default('missing') }}"
                loop: "{{ expected_neighbors[inventory_hostname] }}"
          EOF
          ansible-playbook ospf-health.yml || true
  solution:
    explanation: |
      The play reads the neighbour table on every router, extracts neighbour id and state with `regex_findall`, keeps the
      result as a dictionary and saves it as JSON on the control node before asserting. The assertion loops over the
      router's expected neighbours (from the supplied variables) and fails with a message naming the router and the
      neighbour, so exactly the routers that miss a Full adjacency fail the play. Nothing on the network is changed.
    steps:
      - on: ov-ctl
        as: learner
        timeoutSec: 300
        run: |
          set -e
          cd ~/net
          cat > ospf-health.yml <<'EOF'
          - name: OSPF health
            hosts: branch_routers
            become: true
            gather_facts: false
            vars_files:
              - vars/expected.yml
            tasks:
              - name: OSPF neighbours
                ansible.builtin.command: vtysh -c 'show ip ospf neighbor'
                register: nb
                changed_when: false
              - name: Parse the neighbour table
                ansible.builtin.set_fact:
                  ospf_state: "{{ dict(nb.stdout | regex_findall('^(\\d+\\.\\d+\\.\\d+\\.\\d+)\\s+\\d+\\s+(\\w+)', multiline=True)) }}"
              - name: Keep the structured data
                ansible.builtin.copy:
                  dest: /home/learner/net/ospf/{{ inventory_hostname }}.json
                  content: "{{ ospf_state | to_nice_json }}\n"
                  mode: "0644"
                delegate_to: localhost
                become: false
              - name: Every expected neighbour is Full
                ansible.builtin.assert:
                  that: ospf_state[item] | default('missing') == 'Full'
                  fail_msg: "{{ inventory_hostname }}: OSPF neighbour {{ item }} is {{ ospf_state[item] | default('missing') }}"
                loop: "{{ expected_neighbors[inventory_hostname] }}"
          EOF
          ansible-playbook ospf-health.yml || true
    alternatives:
      - id: split-columns
        description: "Splits each table row into columns in a loop instead of using a regular expression."
        steps:
          - on: ov-ctl
            as: learner
            timeoutSec: 300
            run: |
              set -e
              cd ~/net
              cat > ospf-health.yml <<'EOF'
              - name: OSPF health
                hosts: branch_routers
                become: true
                gather_facts: false
                vars_files:
                  - vars/expected.yml
                tasks:
                  - name: OSPF neighbours
                    ansible.builtin.command: vtysh -c 'show ip ospf neighbor'
                    register: nb
                    changed_when: false
                  - name: Start with an empty table
                    ansible.builtin.set_fact:
                      ospf_state: {}
                  - name: Parse the neighbour table row by row
                    ansible.builtin.set_fact:
                      ospf_state: "{{ ospf_state | combine({item.split()[0]: item.split()[2].split('/')[0]}) }}"
                    loop: "{{ nb.stdout_lines | select('match', '^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+ ') | list }}"
                  - name: Keep the structured data
                    ansible.builtin.copy:
                      dest: /home/learner/net/ospf/{{ inventory_hostname }}.json
                      content: "{{ ospf_state | to_nice_json }}\n"
                      mode: "0644"
                    delegate_to: localhost
                    become: false
                  - name: Every expected neighbour is Full
                    ansible.builtin.assert:
                      that: ospf_state[item] | default('missing') == 'Full'
                      fail_msg: "{{ inventory_hostname }}: OSPF neighbour {{ item }} is {{ ospf_state[item] | default('missing') }}"
                    loop: "{{ expected_neighbors[inventory_hostname] }}"
              EOF
              ansible-playbook ospf-health.yml || true
