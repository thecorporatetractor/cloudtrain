  solution:
    explanation: |
      The module lives in the collection (`plugins/modules/ov_print_queue.py`) with `DOCUMENTATION`, `EXAMPLES` and `RETURN`
      blocks. It reads the file into a dictionary, computes the wanted dictionary for the requested state, and compares the two:
      only a difference means `changed`. The file is written (sorted by queue name) only when something differs **and**
      `module.check_mode` is false; the module declares `supports_check_mode=True` and always returns the sorted list of queues
      that the file has (or would have, in check mode). `required_if` demands a device for `state=present`.
    steps:
    - 'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        set -e
        cd ~/printer-modules
        f=collections/ansible_collections/orrinvale/claims/plugins/modules
        mkdir -p $f
        cat > $f/ov_print_queue.py <<'EOF'
        #!/usr/bin/python
        # -*- coding: utf-8 -*-
        from __future__ import absolute_import, division, print_function
        __metaclass__ = type

        DOCUMENTATION = r'''
        module: ov_print_queue
        short_description: Manage branch printer queues
        description:
          - Adds, changes or removes one queue entry in the printers file (one C(queue=device) line per queue, sorted by name).
        options:
          queue:
            description: Name of the queue.
            type: str
            required: true
          device:
            description: Device URI of the queue. Required when O(state=present).
            type: str
          state:
            description: Whether the queue must exist.
            type: str
            choices: [present, absent]
            default: present
          path:
            description: The printers file.
            type: path
            default: /etc/ov/printers.conf
        author:
          - Orrin and Vale platform team
        '''

        EXAMPLES = r'''
        - name: Add a queue
          orrinvale.claims.ov_print_queue:
            queue: lon-ground
            device: lpd://10.70.9.12
        '''

        RETURN = r'''
        queues:
          description: Names of all queues in the file after the run (sorted).
          returned: always
          type: list
          elements: str
        '''

        import os

        from ansible.module_utils.basic import AnsibleModule


        def read_queues(path):
            queues = {}
            if os.path.exists(path):
                with open(path) as handle:
                    for line in handle:
                        line = line.strip()
                        if line and "=" in line:
                            name, device = line.split("=", 1)
                            queues[name] = device
            return queues


        def main():
            module = AnsibleModule(
                argument_spec=dict(
                    queue=dict(type="str", required=True),
                    device=dict(type="str"),
                    state=dict(type="str", default="present", choices=["present", "absent"]),
                    path=dict(type="path", default="/etc/ov/printers.conf"),
                ),
                required_if=[("state", "present", ["device"])],
                supports_check_mode=True,
            )
            path = module.params["path"]
            name = module.params["queue"]
            queues = read_queues(path)
            new = dict(queues)
            if module.params["state"] == "present":
                new[name] = module.params["device"]
            else:
                new.pop(name, None)
            changed = new != queues
            if changed and not module.check_mode:
                text = "".join("%s=%s\n" % (key, new[key]) for key in sorted(new))
                with open(path, "w") as handle:
                    handle.write(text)
            module.exit_json(changed=changed, queues=sorted(new))


        if __name__ == "__main__":
            main()
        EOF
