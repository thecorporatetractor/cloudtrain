        if __name__ == "__main__":
            main()
        EOF
        ansible-playbook printers.yml
  - id: no-queue-list
    description: Does not return the final list of queues.
    feedback: The module returns the queue names that exist after the run, in the key queues.
    expectFail:
    - module-contract
    mutation:
      'on': ov-ctl
      as: learner
      timeoutSec: 240
      run: |
        cd ~/printer-modules
        f=collections/ansible_collections/orrinvale/claims/plugins/modules
        mkdir -p $f
        cat > $f/ov_print_queue.py <<'EOF'
        #!/usr/bin/python
        # -*- coding: utf-8 -*-
        from __future__ import absolute_import, division, print_function
        __metaclass__ = type

        DOCUMENTATION = r'''
