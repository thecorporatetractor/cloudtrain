                  root {{ claims_docroot }};
                  index index.html;
              }
          }
          EOF
          cat > roles/claims_web/meta/main.yml <<'EOF'
          dependencies:
            - role: ov_firewall
              vars:
                ov_firewall_ports:
                  - "{{ claims_port }}/tcp"
          EOF
          cat > site.yml <<'EOF'
          - hosts: claims_web
            roles:
