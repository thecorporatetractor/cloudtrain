          EOF
          rmdir roles/claims_web/vars 2>/dev/null || true
          ansible-playbook site.yml
    alternatives:
      - id: split-tasks
        description: "Splits the role's tasks into install and configure files that main.yml imports."
        steps:
          - on: ov-ctl
            as: learner
            timeoutSec: 600
            run: |
              set -e
              cd ~/claims-automation
              mkdir -p roles/claims_web/tasks roles/claims_web/handlers roles/claims_web/defaults roles/claims_web/meta roles/claims_web/templates roles/claims_web/vars
              cat > roles/claims_web/defaults/main.yml <<'EOF'
              claims_port: {{port}}
              claims_docroot: {{docroot}}
              EOF
              cat > roles/claims_web/tasks/install.yml <<'EOF'
              - name: nginx package
                ansible.builtin.dnf:
                  name: nginx
                  state: present
              - name: Document root
                ansible.builtin.file:
                  path: "{{ claims_docroot }}"
                  state: directory
                  mode: "0755"
              - name: Landing page
                ansible.builtin.copy:
                  dest: "{{ claims_docroot }}/index.html"
                  content: "Orrin and Vale claims portal on {{ inventory_hostname }}\n"
                  mode: "0644"
              EOF
              cat > roles/claims_web/tasks/configure.yml <<'EOF'
              - name: Site configuration
                ansible.builtin.template:
                  src: nginx.conf.j2
                  dest: /etc/nginx/nginx.conf
                  mode: "0644"
                  validate: nginx -t -c %s
                notify: Reload nginx
              - name: nginx running and enabled
                ansible.builtin.service:
                  name: nginx
                  state: started
                  enabled: true
              EOF
              cat > roles/claims_web/tasks/main.yml <<'EOF'
              - ansible.builtin.import_tasks: install.yml
              - ansible.builtin.import_tasks: configure.yml
              EOF
              cat > roles/claims_web/handlers/main.yml <<'EOF'
              - name: Reload nginx
                ansible.builtin.service:
                  name: nginx
                  state: reloaded
              EOF
              cat > roles/claims_web/templates/nginx.conf.j2 <<'EOF'
              user nginx;
              worker_processes 1;
              error_log /var/log/nginx/error.log;
              pid /run/nginx.pid;
              events {
                  worker_connections 256;
              }
              http {
                  access_log /var/log/nginx/access.log;
                  default_type text/plain;
                  server {
                      listen {{ claims_port }};
                      server_name {{ inventory_hostname }};
                      root {{ claims_docroot }};
                      index index.html;
                  }
              }
              EOF
              cat > roles/claims_web/meta/main.yml <<'EOF'
              dependencies:
                - role: ov_firewall
                  vars:
                    ov_firewall_ports:
                      - "{{ claims_port }}/tcp"
              EOF
              cat > site.yml <<'EOF'
              - hosts: claims_web
                roles:
                  - claims_web
              EOF
              rmdir roles/claims_web/vars 2>/dev/null || true
              ansible-playbook site.yml
