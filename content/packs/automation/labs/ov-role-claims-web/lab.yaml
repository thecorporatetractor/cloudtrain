                  - "{{ claims_port }}/tcp"
          EOF
          cat > site.yml <<'EOF'
          - hosts: claims_web
            roles:
              - claims_web
            tasks:
              - ansible.builtin.debug:
                  msg: portal configured
          EOF
          rmdir roles/claims_web/vars 2>/dev/null || true
          ansible-playbook site.yml
  solution:
    explanation: |
      The legacy tasks move into `roles/claims_web/tasks/main.yml`, the reload handler into `handlers/main.yml`,
      the configuration into a Jinja2 template, and the port and document root become role defaults. The firewall
      step is replaced by a dependency in `meta/main.yml` on `ov_firewall`, passing the port. `site.yml` then only
      names the host group and the role, and `become` comes from `ansible.cfg`. The end state matches the legacy
      playbook, and a second run changes nothing.
    steps:
      - on: ov-ctl
        as: learner
        timeoutSec: 600
        run: |
          set -e
          cd ~/claims-automation
          mkdir -p roles/claims_web/tasks roles/claims_web/handlers roles/claims_web/defaults roles/claims_web/meta roles/claims_web/templates roles/claims_web/vars
          cat > roles/claims_web/defaults/main.yml <<'EOF'
          claims_port: {{port}}
          claims_docroot: {{docroot}}
          EOF
          cat > roles/claims_web/tasks/main.yml <<'EOF'
