# Automation content pack: Ansible labs set in one fictional insurer.
apiVersion: cloudtrain.dev/v1
kind: Pack
metadata:
  id: automation
  title: Configuration management with Ansible
  domain: automation
  version: 1
  owners: [automation-content]
  description: |
    Hands-on, agentless configuration management with Ansible: inventories, ad-hoc
    commands, playbooks, variables, loops, conditionals, handlers and templates, run
    from a control node against a small fleet of real managed nodes. Every lab is graded
    on the managed nodes' end state, then the learner's playbook is run again and must
    report no changes; it is never graded on the commands used.

# The fictional organisation every lab in this pack is set in.
universe:
  organisation: Orrin & Vale Insurance
  summary: A fictional insurer with a claims portal, a policy database, a quoting API and twelve branch offices.
  namingRules:
    hosts: "ov-<role><n>: ov-claims-web1, ov-db-1, ov-quote-api1, ov-branch-lon-gw"
    controlNode: "ov-ctl (the learner's workstation)"
    automationUser: "ovauto on every managed node (key-only, passwordless sudo)"
    projects: "/home/learner/<project> on the control node, e.g. claims-automation"
    paths: "/etc/ov/<service> for configuration, /var/log/ov-<area> for logs"
    domain: orrinvale.example

# Runtime (see docs/handoffs/automation.md, "Lab topology"):
#  - Entry node `ov-ctl` runs ansible-ctl:2.21 (tools/images/ansible). The learner works
#    as `learner` (no sudo); ansible-core, navigator, lint and the mirrored collections
#    are installed. There is no internet; packages come from the in-cluster mirror.
#  - Managed nodes are tier-A pods (el-lab:10 AlmaLinux 10, deb-lab:24.04 Ubuntu) with
#    sshd, python3 and sudo, one topology link each to ov-ctl. Setup on ov-ctl runs
#    `ct-fleet-net`, which bridges the links into one lab LAN 10.70.0.0/24 (ov-ctl .10),
#    publishes the names in /etc/hosts and the host keys in /etc/ssh/ssh_known_hosts.
#    Standard fleet: ov-claims-web1 .11, ov-claims-web2 .12, ov-db-1 .21 (el-lab),
#    ov-quote-api1 .31 (deb-lab).
#  - Managed-node setup (anchor `&ov-node`): address from the hostname, user ovauto with a
#    one-time password and passwordless sudo, sshd. ov-ctl then pushes the learner's key
#    with `ct-ansible pushkey --seal`, which also clears that password (key-only).
#  - Checks read end state on the managed nodes directly (root exec). Idempotency is
#    graded with `ct-ansible recap DIR PLAYBOOK` (runs it as the learner, prints the
#    PLAY RECAP totals); only one check per lab re-runs a playbook, so concurrent checks
#    never run two plays against the same hosts.
#  - Jinja: `{{ name }}` written with spaces stays literal in lab content (only declared
#    params are substituted), so playbooks are written the normal way. Never declare a
#    param with the name of a Jinja variable the lab uses.
#  - Tier B/C labs (systemd, services, reboots, storage) use el-vm:10 / ubuntu-vm:24.04 KubeVirt
#    VMs instead of pods. The VMs are wired by the platform (host aliases, known hosts, the
#    learner key); the control node ov-ctl has no links and no ct-fleet-net there. Setup on
#    each VM creates ovauto with a copy of the learner's authorized_keys and a NOPASSWD drop-in.
#  - Tier N labs use frr:10 routers linked to ov-ctl (Linux-style: ssh + vtysh); blocked until
#    the image has an SSH daemon, python3 and an automation account.
conventions:
  entryNode: ov-ctl
  entryImage: ansible-ctl:2.21
  nodeImages: [el-lab:10, deb-lab:24.04]

courses:
  - id: ov-inventory-fleet
    title: Inventory and a reachable fleet
    description: Static inventories, key-based access with privilege escalation, project configuration and ad-hoc commands.
    level: beginner
    labs: [ov-first-inventory, ov-bootstrap-automation-user, ov-ansible-cfg-project, ov-adhoc-kernel-census]
  - id: ov-first-playbooks
    title: First playbooks and idempotency
    description: Plays, tasks and modules, idempotent rewrites of shell-heavy playbooks, and dry runs with check and diff mode.
    level: beginner
    labs: [ov-first-playbook-motd, ov-idempotency-shell-cleanup, ov-check-diff-preview]
  - id: ov-vars-loops-conditions
    title: Variables, loops and conditions
    description: Group and host variables with their precedence, loops over data files and conditional tasks.
    level: beginner
    labs: [ov-branch-group-vars, ov-loop-adjuster-accounts, ov-conditionals-os-family]
  - id: ov-handlers-templates
    title: Handlers and templates
    description: Reload services only when their configuration changes and render per-host files from Jinja2 templates.
    level: beginner
    labs: [ov-handlers-web-reload, ov-template-claims-vhost]
  - id: ov-engineer-data
    title: Facts, results and error handling
    description: Group tasks with block, rescue and always so failed maintenance rolls back and still leaves a record.
    level: intermediate
    labs: [ov-block-rescue-db-maintenance]
  - id: ov-engineer-reuse
    title: Roles and system roles
    description: Package a playbook as a role with defaults, a handler, a template and a dependency, and apply a packaged system role.
    level: intermediate
    labs: [ov-role-claims-web, ov-system-role-timesync]
  - id: ov-engineer-system-tasks
    title: Automating system administration
    description: Repositories and packages, users with password ageing, LVM storage, SELinux and firewalld, scheduling, and settings that must survive a reboot.
    level: intermediate
    labs: [ov-automate-repos-packages, ov-automate-users-aging, ov-automate-lvm-storage, ov-automate-web-firewall-selinux, ov-automate-cron-timers, ov-reboot-persistence-fix]
  - id: ov-content-orchestration
    title: Orchestrating long-running work
    description: Asynchronous tasks, polling and conditional reboots across a database tier.
    level: advanced
    labs: [ov-async-patching]
  - id: ov-content-packaging
    title: Execution environments
    description: Describe, build, publish and run an execution environment for a project.
    level: advanced
    labs: [ov-execution-environment-build]
  - id: ov-network-connect
    title: Connecting to network devices and gathering facts
    description: Inventory for branch routers and per-device structured facts.
    level: intermediate
    labs: [ov-net-inventory-facts]
  - id: ov-network-config
    title: Configuring network devices
    description: Drive router configuration from variables, data files and a role.
    level: intermediate
    labs: [ov-net-ospf-branch-config, ov-net-srlinux-interfaces, ov-net-branch-template-role]
  - id: ov-network-operate
    title: Validation and backups
    description: Assert on parsed OSPF state and keep restorable configuration backups in Git.
    level: intermediate
    labs: [ov-net-parse-neighbors, ov-net-config-backup-restore]
  - id: ov-eda-rulebooks
    title: Event-driven rulebooks
    description: React to webhook events with a rulebook that runs a playbook for the right events only.
    level: advanced
    labs: [ov-eda-webhook-rulebook]
