apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-buildx-cache-export
  title: Share build cache between throwaway CI builders through the registry
  domain: containers
  frameworks: [docker-practitioner:build]
  difficulty: hard
  estimatedMinutes: 25
  tags: [docker, buildx, cache-export, registry, ci]
  version: 1
spec:
  description: |
    Every CI run starts on a fresh builder and rebuilds the transcoder (release {{rev}})
    from scratch, including a 20 MiB dependency download step. The repository is
    `~/transcoder-ci/` on `cl-ci-01` (`ssh cl-ci-01`; you are in the `docker` group). Its
    Dockerfile has three stages: `build` (dependencies, then compile), `dist` (only the
    compiled program, for export) and `runtime` (the image). A registry for CI artefacts
    listens on `localhost:5000`, and `~/buildkitd.toml` lets a builder container use it
    over plain HTTP.

    1. Create a **docker-container** buildx builder (use `--driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2` and
       `--buildkitd-config ~/buildkitd.toml`) and build the `runtime` target as
       `copperleaf/transcoder:2.0`, exporting the cache to the registry at
       **`localhost:5000/cache/transcoder:buildcache`** with **`mode=max`**, so the
       intermediate `build` stage is cached too.
    2. Prove that a **brand-new builder** reuses it: remove the first builder, create
       another, and build with `--cache-from` that reference.
    3. Export the compiled program to `~/transcoder-ci/dist/` with the **local exporter**
       (`--target dist`); `dist/transcoder` must be the compiled program.
  objectives:
    - Create a docker-container builder
    - Export cache to a registry with mode=max
    - Import it into a fresh builder and use the local exporter
  params:
    rev:
      type: int
      min: 100
      max: 899
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-ci-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-ci-01
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        docker rm -f registry >/dev/null 2>&1 || true
        docker run -d --name registry --restart always -p 127.0.0.1:5000:5000 registry:3 >/dev/null
        for i in $(seq 30); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
        docker tag alpine:3.22 localhost:5000/library/alpine:3.22
        docker push localhost:5000/library/alpine:3.22 >/dev/null
        s=/home/learner/transcoder-ci
        rm -rf "$s"; install -d "$s/src"
        printf '%s\n' 'libframe 2.4' 'libmux 1.9' > "$s/deps.txt"
        printf '%s\n' '#!/bin/sh' 'echo "transcoder 2.0 rev {{rev}}"' > "$s/src/transcoder.sh"
        cat > "$s/Dockerfile" <<'DF'
        FROM localhost:5000/library/alpine:3.22 AS build
        WORKDIR /src
        COPY deps.txt .
        RUN head -c 20971520 /dev/urandom > /deps.bin && cp deps.txt /deps.lst
        COPY src/ src/
        RUN install -m 0755 src/transcoder.sh /transcoder

        FROM scratch AS dist
        COPY --from=build /transcoder /transcoder

        FROM localhost:5000/library/alpine:3.22 AS runtime
        COPY --from=build /transcoder /usr/local/bin/transcoder
        ENTRYPOINT ["transcoder"]
        DF
        cat > /home/learner/buildkitd.toml <<'TOML'
        [registry."localhost:5000"]
          http = true
          insecure = true
        TOML
        chown -R learner:learner "$s" /home/learner/buildkitd.toml
        runuser -u learner -- sh -c 'docker buildx ls --format json | jq -r .Name | grep -v "^default$" | xargs -r -n1 docker buildx rm' || true
  checks:
    - id: builder-exists
      description: A docker-container builder exists
      type: shell
      timeoutSec: 60
      on: cl-ci-01
      skills: [containers.buildkit.cache-export]
      weight: 1
      command: |
        n=$(runuser -u learner -- docker buildx ls --format json 2>/dev/null | jq -s '[.[] | select(.Driver == "docker-container" and (.Name | startswith("ct-verify") | not))] | length')
        [ "${n:-0}" -ge 1 ] && echo yes || echo none
      expect: {match: exact, value: "yes"}
    - id: cache-exported-max
      description: The registry holds the build cache with the intermediate stage (mode=max)
      type: shell
      timeoutSec: 60
      on: cl-ci-01
      skills: [containers.buildkit.cache-export]
      weight: 3
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
        m=$(curl -fsS -H "$A" http://127.0.0.1:5000/v2/cache/transcoder/manifests/buildcache 2>/dev/null) || { echo missing; exit 0; }
        s=$(echo "$m" | jq '[((.manifests // [])[].size), ((.layers // [])[].size)] | add // 0')
        # the 20 MiB dependency layer of the build stage is only exported with mode=max
        [ "$s" -gt 15728640 ] && echo max || echo "min-or-empty-$s"
      expect: {match: exact, value: max}
    - id: fresh-builder-reuses
      description: A new builder with --cache-from reuses the cached layers instead of rebuilding them
      type: shell
      timeoutSec: 400
      on: cl-ci-01
      skills: [containers.buildkit.cache-export]
      weight: 3
      command: |
        b=ct-verify-$$
        runuser -u learner -- docker buildx create --name "$b" --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config /home/learner/buildkitd.toml >/dev/null 2>&1 || { echo no-builder; exit 0; }
        d=$(mktemp -d)
        out=$(cd /home/learner/transcoder-ci && runuser -u learner -- docker buildx build --builder "$b" --target dist --output type=local,dest=$d --progress plain --cache-from type=registry,ref=localhost:5000/cache/transcoder:buildcache . 2>&1)
        runuser -u learner -- docker buildx rm "$b" >/dev/null 2>&1
        rm -rf "$d"
        # the dependency step must be reported CACHED (same vertex number), which needs the build stage cache (mode=max)
        n=$(echo "$out" | grep -E '^#[0-9]+ \[build [0-9]+/[0-9]+\] RUN head -c 20971520' | head -1 | sed -E 's/^#([0-9]+) .*/\1/')
        [ -n "$n" ] && echo "$out" | grep -qE "^#$n CACHED" && echo reused || echo "dependency-step-not-cached"
      expect: {match: exact, value: reused}
    - id: dist-exported
      description: dist/transcoder is the compiled program
      type: shell
      timeoutSec: 60
      on: cl-ci-01
      skills: [containers.buildkit.cache-export]
      weight: 2
      command: |
        f=/home/learner/transcoder-ci/dist/transcoder
        [ -x "$f" ] && "$f" || echo missing
      expect: {match: exact, value: "transcoder 2.0 rev {{rev}}"}
  hints:
    - title: A builder that can export cache
      body: "The default builder cannot be chosen freely; create one with `docker buildx create --name ci-1 --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config ~/buildkitd.toml --use`. Check it with `docker buildx inspect --bootstrap`."
      cost: 1
    - title: Export and import
      body: "`--cache-to type=registry,ref=<ref>,mode=max` writes the cache after a build; `--cache-from type=registry,ref=<ref>` reads it. `mode=min` (the default) only keeps layers of the final image."
      cost: 2
    - title: Files instead of an image
      body: "`--target dist --output type=local,dest=dist` writes the stage's filesystem to a directory instead of producing an image."
      cost: 1
  misconceptions:
    - id: cache-mode-min
      description: Exports the cache with the default mode, which skips intermediate stages.
      feedback: "mode=min only exports layers of the final image. The expensive dependency step lives in the build stage, so a new builder rebuilds it. Use mode=max."
      expectFail: [cache-exported-max, fresh-builder-reuses]
      mutation:
        on: cl-ci-01
        as: learner
        timeoutSec: 480
        run: |
          cd ~/transcoder-ci
          docker buildx create --name ci-1 --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config ~/buildkitd.toml --use
          docker buildx build --builder ci-1 --target runtime -t copperleaf/transcoder:2.0 --cache-to type=registry,ref=localhost:5000/cache/transcoder:buildcache --load .
          docker buildx build --builder ci-1 --target dist --output type=local,dest=dist .
    - id: no-registry-cache
      description: Builds and exports the program but never writes the cache to the registry.
      feedback: "A builder keeps its own cache, but a throwaway CI builder starts empty. Export the cache to the registry so the next builder can import it."
      expectFail: [cache-exported-max, fresh-builder-reuses]
      mutation:
        on: cl-ci-01
        as: learner
        timeoutSec: 480
        run: |
          cd ~/transcoder-ci
          docker buildx create --name ci-1 --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config ~/buildkitd.toml --use
          docker buildx build --builder ci-1 --target runtime -t copperleaf/transcoder:2.0 --load .
          docker buildx build --builder ci-1 --target dist --output type=local,dest=dist .
    - id: no-dist
      description: Handles the cache but never exports the compiled program.
      feedback: "The cache is shared, but dist/ is still empty. Build the dist target with the local exporter."
      expectFail: [dist-exported]
      mutation:
        on: cl-ci-01
        as: learner
        timeoutSec: 480
        run: |
          cd ~/transcoder-ci
          docker buildx create --name ci-1 --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config ~/buildkitd.toml --use
          docker buildx build --builder ci-1 --target runtime -t copperleaf/transcoder:2.0 --cache-to type=registry,ref=localhost:5000/cache/transcoder:buildcache,mode=max --load .
  solution:
    explanation: |
      A docker-container builder can export cache. `mode=max` includes the build stage. A
      second, brand-new builder imports that reference and finds the expensive steps
      cached; the local exporter writes the dist stage to `dist/`.
    steps:
      - on: cl-ci-01
        as: learner
        timeoutSec: 480
        run: |
          cd ~/transcoder-ci
          REF=localhost:5000/cache/transcoder:buildcache
          docker buildx create --name ci-1 --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config ~/buildkitd.toml
          docker buildx build --builder ci-1 --target runtime -t copperleaf/transcoder:2.0 --cache-to type=registry,ref=$REF,mode=max --load .
          docker buildx rm ci-1
          docker buildx create --name ci-2 --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config ~/buildkitd.toml
          docker buildx build --builder ci-2 --target runtime --cache-from type=registry,ref=$REF -t copperleaf/transcoder:2.0 --load .
          docker buildx build --builder ci-2 --target dist --cache-from type=registry,ref=$REF --output type=local,dest=dist .
    alternatives:
      - id: image-manifest-cache
        description: Export the cache as an image manifest with OCI media types.
        steps:
          - on: cl-ci-01
            as: learner
            timeoutSec: 480
            run: |
              cd ~/transcoder-ci
              REF=localhost:5000/cache/transcoder:buildcache
              docker buildx create --name ci-1 --driver docker-container --driver-opt network=host --driver-opt image=moby/buildkit:v0.23.2 --buildkitd-config ~/buildkitd.toml --use
              docker buildx build --target runtime -t copperleaf/transcoder:2.0 --cache-to type=registry,ref=$REF,mode=max,image-manifest=true,oci-mediatypes=true --load .
              docker buildx build --target dist --cache-from type=registry,ref=$REF --output type=local,dest=dist .
