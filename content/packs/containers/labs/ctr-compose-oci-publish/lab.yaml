apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-compose-oci-publish
  title: Ship the caption review stack to QA as an OCI artifact
  domain: containers
  frameworks: [docker-practitioner:compose]
  difficulty: hard
  estimatedMinutes: 20
  tags: [docker, compose, oci, registry, digest]
  version: 1
spec:
  description: |
    On `cl-captions-02` (`ssh cl-captions-02`; you are in the `docker` group) the
    caption-review application is described by `~/caption-review/compose.yaml` (project
    `caption-review`: services `review` and `queue`, images in the private registry that
    runs on this host at `localhost:5000`, standing in for the registry at
    `registry.copperleaf.example:5000`). QA wants the application as an artifact, not as
    files to copy around.

    1. **Publish** the Compose application to the registry as the OCI artifact
       **`localhost:5000/stacks/caption-review:1.0`**, with **every image pinned by
       digest** inside the published file, so QA runs exactly the bits you tested.
    2. **Start it as QA would**: project name **`caption-qa`**, straight from the registry
       reference with `docker compose -f oci://...`, **without** the project files:
       run it from a directory with no Compose files, and do not copy `compose.yaml`
       anywhere else. It publishes the review UI on host port **{{port}}**
       (`caption review {{rev}}`).

    Leave the QA project running.
  objectives:
    - Publish a Compose application as an OCI artifact
    - Pin the images of a published application by digest
    - Run an application directly from a registry reference
  params:
    port:
      type: int
      min: 8800
      max: 8899
    rev:
      type: int
      min: 200
      max: 899
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-captions-02
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-captions-02
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        for pr in caption-qa caption-review; do docker ps -aq --filter label=com.docker.compose.project=$pr | xargs -r docker rm -f >/dev/null; done
        docker rm -f registry >/dev/null 2>&1 || true
        docker run -d --name registry --restart always -p 127.0.0.1:5000:5000 registry:3 >/dev/null
        for i in $(seq 30); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
        d=$(mktemp -d); mkdir "$d/www"; echo "caption review {{rev}}" > "$d/www/index.html"
        printf '%s\n' 'FROM busybox:1.37' 'COPY www /www' 'EXPOSE 80' 'CMD ["httpd", "-f", "-p", "80", "-h", "/www"]' > "$d/Dockerfile"
        docker build -q -t localhost:5000/caption-review:1.0 "$d" >/dev/null; rm -rf "$d"
        printf '%s\n' 'FROM redis:7.4-alpine' | docker build -q -t localhost:5000/caption-queue:1.0 - >/dev/null
        docker push -q localhost:5000/caption-review:1.0 >/dev/null
        docker push -q localhost:5000/caption-queue:1.0 >/dev/null
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        install -d -m 0700 /var/lib/cloudtrain
        for r in caption-review caption-queue; do
          curl -fsSI -H "$A" "http://127.0.0.1:5000/v2/$r/manifests/1.0" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' > "/var/lib/cloudtrain/$r.digest"
          grep -qE '^sha256:[0-9a-f]{64}$' "/var/lib/cloudtrain/$r.digest"
        done
        p=/home/learner/caption-review
        rm -rf "$p" /home/learner/qa; install -d -o learner -g learner "$p" /home/learner/qa
        cat > "$p/compose.yaml" <<'YML'
        name: caption-review
        services:
          review:
            image: localhost:5000/caption-review:1.0
            ports:
              - "{{port}}:80"
            depends_on:
              - queue
          queue:
            image: localhost:5000/caption-queue:1.0
        YML
        chown -R learner:learner "$p"
  checks:
    - id: artifact-pinned
      description: The published artifact holds a Compose file whose two images are pinned to the registry's digests
      type: shell
      timeoutSec: 60
      on: cl-captions-02
      skills: [containers.compose.distribution]
      weight: 4
      command: |
        A='Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json'
        R=http://127.0.0.1:5000/v2/stacks/caption-review
        m=$(curl -fsS -H "$A" "$R/manifests/1.0" 2>/dev/null) || { echo no-artifact; exit 0; }
        file=""
        for dg in $(echo "$m" | jq -r '.layers[]?.digest'); do
          b=$(curl -fsS "$R/blobs/$dg" 2>/dev/null) || continue
          echo "$b" | grep -qE '^(services|name):' && file=$(printf '%s\n%s' "$file" "$b")
        done
        [ -n "$file" ] || { echo no-compose-layer; exit 0; }
        got=$(echo "$file" | grep -E '^[[:space:]]+image:' | grep -oE 'sha256:[0-9a-f]{64}' | sort -u | paste -sd, -)
        want=$(cat /var/lib/cloudtrain/caption-review.digest /var/lib/cloudtrain/caption-queue.digest | sort -u | paste -sd, -)
        if [ "$got" = "$want" ]; then echo pinned; else echo "images-not-pinned-to-registry-digests"; fi
      expect: {match: exact, value: pinned}
    - id: qa-from-registry
      description: caption-qa runs both services from the pinned images, and its project file did not come from ~/caption-review
      type: shell
      timeoutSec: 60
      on: cl-captions-02
      skills: [containers.compose.distribution]
      weight: 4
      command: |
        out=""
        for s in review queue; do
          c=$(docker ps -q --filter label=com.docker.compose.project=caption-qa --filter label=com.docker.compose.service="$s" | head -1)
          [ -n "$c" ] || { out="$out $s=absent"; continue; }
          img=$(docker inspect "$c" | jq -r '.[0].Config.Image')
          cfg=$(docker inspect "$c" | jq -r '.[0].Config.Labels["com.docker.compose.project.config_files"] // ""')
          want=$(cat /var/lib/cloudtrain/caption-$s.digest)
          case "$img" in *"@$want") p=pinned ;; *) p=unpinned ;; esac
          case "$cfg" in *caption-review/compose*) p="$p+local-file" ;; esac
          out="$out $s=$p"
        done
        echo "${out# }"
      expect: {match: exact, value: "review=pinned queue=pinned"}
    - id: qa-serves
      description: The QA review UI answers on the published port
      type: shell
      timeoutSec: 60
      on: cl-captions-02
      skills: [containers.compose.distribution]
      weight: 1
      command: |
        for i in $(seq 20); do r=$(curl -fsS --max-time 3 http://127.0.0.1:{{port}}/ 2>/dev/null) && break; sleep 1; done
        echo "${r:-down}"
      expect: {match: exact, value: "caption review {{rev}}"}
    - id: no-copied-project-files
      description: No Compose file was copied outside ~/caption-review
      type: shell
      timeoutSec: 30
      on: cl-captions-02
      skills: [containers.compose.distribution]
      weight: 1
      command: |
        find /home/learner /tmp /srv -maxdepth 4 -type f \( -name 'compose*.y*ml' -o -name 'docker-compose*.y*ml' \) -not -path '/home/learner/caption-review/*' -not -path '*/.cache/*' 2>/dev/null | wc -l
      expect: {match: exact, value: "0"}
  hints:
    - title: Publish
      body: "`docker compose publish <registry>/<repo>:<tag>` pushes the project's Compose file as an OCI artifact; the local registry speaks plain HTTP, so add `--insecure-registry localhost:5000`. Add `--resolve-image-digests` to rewrite every `image:` to `name@sha256:...`, and `-y` to skip the confirmation."
      command: cd ~/caption-review && docker compose publish --insecure-registry localhost:5000 --resolve-image-digests -y localhost:5000/stacks/caption-review:1.0
      cost: 2
    - title: Run from the registry
      body: "Compose accepts an `oci://` reference wherever it accepts a file: `docker compose -f oci://localhost:5000/stacks/caption-review:1.0 -p caption-qa up -d`. Do it from a directory without Compose files."
      cost: 1
    - title: Look at what you published
      body: "The registry's API shows the artifact: `curl -s -H 'Accept: application/vnd.oci.image.manifest.v1+json' localhost:5000/v2/stacks/caption-review/manifests/1.0 | jq` lists its layers; fetch the Compose layer from /blobs/<digest>."
      cost: 1
  misconceptions:
    - id: unpinned-artifact
      description: Publishes without pinning the images, so the artifact refers to mutable tags.
      feedback: "Tags can move after you publish. Use --resolve-image-digests so the artifact names the exact image digests you tested."
      expectFail: [artifact-pinned, qa-from-registry]
      mutation:
        on: cl-captions-02
        as: learner
        run: |
          cd ~/caption-review
          docker compose publish --insecure-registry localhost:5000 -y localhost:5000/stacks/caption-review:1.0
          cd /tmp
          docker compose -f oci://localhost:5000/stacks/caption-review:1.0 -p caption-qa up -d
    - id: run-from-local-files
      description: Publishes correctly but starts QA from the local project files.
      feedback: "QA must run the artifact, not your working copy: start it with -f oci://... from a directory that has no Compose files."
      expectFail: [qa-from-registry]
      mutation:
        on: cl-captions-02
        as: learner
        run: |
          cd ~/caption-review
          docker compose publish --insecure-registry localhost:5000 --resolve-image-digests -y localhost:5000/stacks/caption-review:1.0
          docker compose -p caption-qa up -d
  solution:
    explanation: |
      `compose publish` stores the Compose model in the registry as an OCI artifact;
      `--resolve-image-digests` rewrites the image references to digests so the artifact is
      immutable in practice. `docker compose -f oci://...` then loads the model from the
      registry, so QA needs nothing but the reference.
    steps:
      - on: cl-captions-02
        as: learner
        run: |
          cd ~/caption-review
          docker compose publish --insecure-registry localhost:5000 --resolve-image-digests -y localhost:5000/stacks/caption-review:1.0
          cd /tmp
          docker compose -f oci://localhost:5000/stacks/caption-review:1.0 -p caption-qa up -d
          docker compose -p caption-qa ps
    alternatives:
      - id: pin-by-hand
        description: Pin the digests in the file yourself, publish without the resolve flag, and start QA from a new shell directory.
        steps:
          - on: cl-captions-02
            as: learner
            run: |
              cd ~/caption-review
              A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
              for r in caption-review caption-queue; do
                dg=$(curl -fsSI -H "$A" "http://localhost:5000/v2/$r/manifests/1.0" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
                sed -i "s|localhost:5000/$r:1.0|localhost:5000/$r@$dg|" compose.yaml
              done
              docker compose publish --insecure-registry localhost:5000 -y localhost:5000/stacks/caption-review:1.0
              cd "$(mktemp -d)"
              docker compose -f oci://localhost:5000/stacks/caption-review:1.0 -p caption-qa up -d
