apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-leaked-secret-history
  title: Purge a leaked storage key from published image history
  domain: containers
  frameworks: [docker-practitioner:supply-chain, docker-practitioner:registry]
  difficulty: medium
  estimatedMinutes: 20
  tags: [docker, security, secrets, registry, history]
  version: 1
spec:
  description: |
    On **`cl-transcode-04`** (`ssh cl-transcode-04`; you are in the `docker` group) the
    registry at `127.0.0.1:5000` holds `transcoder:7.1`, whose build baked in an
    object-storage key (`CLSK-{{a}}-{{b}}`) in an early layer. The build context is
    `~/transcoder-src/`. A mock key service runs on `127.0.0.1:9400` with a revoke
    endpoint at `POST /revoke/<key>`.

    1. **Find** the key in the image (it is not visible from `docker inspect` alone).
    2. **Revoke** it through the key service.
    3. **Rebuild** the image with **no layer, no history entry and no config field**
       containing the key, under the **same tag**, `transcoder:7.1`, and **push** it.
    4. **Delete** the leaked manifest (the one that still contains the key) from the
       registry, so no digest in the registry carries it any more. The clean image must
       still run and print `transcoder 7.1 ready` (it reads the key from
       `/run/secrets/storage_key` at run time if present, not at build time).
  objectives:
    - Find a secret baked into an image's layers, config or history
    - Revoke a leaked credential before relying on an image rebuild alone
    - Rebuild without secrets and remove the leaked manifest from the registry
  params:
    a:
      type: int
      min: 1000
      max: 9999
    b:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-transcode-04
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-transcode-04
      timeoutSec: 420
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        docker rm -f registry key-service >/dev/null 2>&1 || true
        rm -rf /srv/registry /srv/key-service; install -d /srv/registry /srv/key-service
        docker run -d --name registry --restart always -p 127.0.0.1:5000:5000 -e REGISTRY_STORAGE_DELETE_ENABLED=true -v /srv/registry:/var/lib/registry registry:3 >/dev/null
        for i in $(seq 30); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
        cat > /srv/key-service/server.py <<'PY'
        import http.server, json
        REVOKED = set()
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                if self.path.startswith("/revoke/"):
                    REVOKED.add(self.path[len("/revoke/"):])
                    self.send_response(200); self.end_headers(); self.wfile.write(b"revoked\n")
                else:
                    self.send_response(404); self.end_headers()
            def do_GET(self):
                if self.path.startswith("/status/"):
                    k = self.path[len("/status/"):]
                    self.send_response(200); self.end_headers()
                    self.wfile.write((("revoked" if k in REVOKED else "active") + "\n").encode())
                else:
                    self.send_response(404); self.end_headers()
            def log_message(self, *a):
                pass
        http.server.ThreadingHTTPServer(("0.0.0.0", 9400), H).serve_forever()
        PY
        cat > /etc/systemd/system/cl-key-service.service <<'UNIT'
        [Unit]
        Description=Copperleaf mock object-storage key service
        After=network.target
        [Service]
        ExecStart=/usr/bin/python3 /srv/key-service/server.py
        Restart=always
        [Install]
        WantedBy=multi-user.target
        UNIT
        systemctl daemon-reload
        systemctl enable --now cl-key-service
        for i in $(seq 20); do curl -fs http://127.0.0.1:9400/status/x >/dev/null && break; sleep 1; done
        s=/home/learner/transcoder-src
        install -d -o learner -g learner "$s"
        cat > "$s/app.sh" <<'SH'
        #!/bin/sh
        if [ -r /run/secrets/storage_key ]; then echo "storage key loaded"; fi
        echo "transcoder 7.1 ready"
        SH
        chmod 0755 "$s/app.sh"
        cat > "$s/Dockerfile" <<'DF'
        FROM busybox:1.37
        ENV STORAGE_KEY=CLSK-{{a}}-{{b}}
        RUN mkdir -p /etc/transcoder && echo "$STORAGE_KEY" > /etc/transcoder/storage.key
        COPY app.sh /app.sh
        RUN rm -f /etc/transcoder/storage.key
        CMD ["/app.sh"]
        DF
        chown -R learner:learner "$s"
        docker build -q --provenance=false --sbom=false -t localhost:5000/transcoder:7.1 "$s" >/dev/null
        docker push -q localhost:5000/transcoder:7.1 >/dev/null
        A='Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        install -d /var/lib/cloudtrain
        curl -fsSI -H "$A" http://127.0.0.1:5000/v2/transcoder/manifests/7.1 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' > /var/lib/cloudtrain/leaked.digest
        chmod 0600 /var/lib/cloudtrain/leaked.digest; chmod 0700 /var/lib/cloudtrain
  checks:
    - id: key-revoked
      description: The leaked key is revoked in the key service
      type: shell
      timeoutSec: 60
      on: cl-transcode-04
      skills: [containers.supply-chain.secret-hygiene]
      weight: 2
      command: curl -fsS "http://127.0.0.1:9400/status/CLSK-{{a}}-{{b}}" 2>/dev/null || echo unknown
      expect: {match: exact, value: revoked}
    - id: no-key-anywhere
      description: No blob of the current transcoder:7.1 (layers, config, history) contains the key
      type: shell
      timeoutSec: 90
      on: cl-transcode-04
      skills: [containers.supply-chain.secret-hygiene]
      weight: 3
      command: |
        t=$(mktemp -d)
        skopeo copy -q --all --src-tls-verify=false docker://localhost:5000/transcoder:7.1 "oci:$t:x" >/dev/null 2>&1 || { echo pull-failed; rm -rf "$t"; exit 0; }
        n=0; for f in "$t"/blobs/sha256/*; do zcat -f "$f" 2>/dev/null | grep -aq 'CLSK-{{a}}-{{b}}' && n=$((n + 1)); done
        rm -rf "$t"; [ "$n" = 0 ] && echo clean || echo "leaks-in-$n-blobs"
      expect: {match: exact, value: clean}
    - id: leaked-manifest-deleted
      description: The original leaked manifest digest no longer resolves in the registry
      type: shell
      timeoutSec: 60
      on: cl-transcode-04
      skills: [containers.registry.garbage-collection]
      weight: 2.5
      command: |
        d=$(cat /var/lib/cloudtrain/leaked.digest)
        A='Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        c=$(curl -s -o /dev/null -w '%{http_code}' -H "$A" "http://127.0.0.1:5000/v2/transcoder/manifests/$d")
        cur=$(curl -fsSI -H "$A" http://127.0.0.1:5000/v2/transcoder/manifests/7.1 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
        if [ "$c" = 404 ] && [ "$cur" != "$d" ]; then echo deleted; else echo "code=$c same=$([ "$cur" = "$d" ] && echo yes || echo no)"; fi
      expect: {match: exact, value: deleted}
    - id: still-works
      description: The clean, pushed image still starts and prints the ready banner
      type: shell
      timeoutSec: 90
      on: cl-transcode-04
      skills: [containers.supply-chain.secret-hygiene]
      weight: 1.5
      command: docker run --rm --pull always localhost:5000/transcoder:7.1 2>/dev/null | tail -n 1 || echo broken
      expect: {match: exact, value: "transcoder 7.1 ready"}
  hints:
    - title: Where secrets hide
      body: "`docker history --no-trunc` shows RUN command lines (and ARG values used by them); the image config's Env also travels with the image. A secret in any of those survives even if a later layer deletes the file."
      cost: 1
    - title: Revoke before you rebuild
      body: "A leaked key stays usable by anyone who already copied the old image or manifest until it is revoked at the source, independent of what you do to the registry afterward."
      cost: 1
    - title: Deleting the old manifest
      body: "`DELETE /v2/<repo>/manifests/<digest>` on the registry's own digest for the old push removes that reference once a new one has replaced the tag."
      cost: 1
  misconceptions:
    - id: revoke-only
      description: Revokes the key but never rebuilds the image, so the old key still sits in every layer and in history.
      feedback: "Revoking stops the key from working, but the leaked value is still published in the image's layers and history. Rebuild without it and remove the old manifest too."
      expectFail: [no-key-anywhere, leaked-manifest-deleted]
      mutation:
        on: cl-transcode-04
        as: learner
        run: |
          curl -fsS -X POST "http://127.0.0.1:9400/revoke/CLSK-{{a}}-{{b}}" >/dev/null
    - id: rebuild-without-revoke
      description: Rebuilds a clean image and deletes the old manifest, but never revokes the leaked key at the source.
      feedback: "Anyone who already has a copy of the old image or manifest can still read the key out of it; deleting the registry's copy does not revoke the key itself. Call the key service's revoke endpoint."
      expectFail: [key-revoked]
      mutation:
        on: cl-transcode-04
        as: learner
        run: |
          cd ~/transcoder-src
          printf '%s\n' 'FROM busybox:1.37' 'COPY app.sh /app.sh' 'CMD ["/app.sh"]' > Dockerfile
          docker build -q --provenance=false --sbom=false -t localhost:5000/transcoder:7.1 .
          docker push -q localhost:5000/transcoder:7.1
          d=$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' http://127.0.0.1:5000/v2/transcoder/manifests/7.1 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          curl -fsS -X DELETE "http://127.0.0.1:5000/v2/transcoder/manifests/$d" >/dev/null || true
  solution:
    explanation: |
      Revoke the leaked key at the source first, then rebuild from a Dockerfile that
      never references it, push over the same tag, and delete the old manifest digest
      from the registry so no reference to the leaked layers remains.
    steps:
      - on: cl-transcode-04
        as: learner
        run: |
          d=$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' http://127.0.0.1:5000/v2/transcoder/manifests/7.1 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          curl -fsS -X POST "http://127.0.0.1:9400/revoke/CLSK-{{a}}-{{b}}" >/dev/null
          cd ~/transcoder-src
          printf '%s\n' 'FROM busybox:1.37' 'COPY app.sh /app.sh' 'CMD ["/app.sh"]' > Dockerfile
          docker build -q --provenance=false --sbom=false -t localhost:5000/transcoder:7.1 .
          docker push -q localhost:5000/transcoder:7.1
          curl -fsS -X DELETE "http://127.0.0.1:5000/v2/transcoder/manifests/$d"
    alternatives:
      - id: skopeo-inspect-first
        description: Confirm the leak with skopeo inspect --config before rebuilding.
        steps:
          - on: cl-transcode-04
            as: learner
            run: |
              skopeo inspect --config --tls-verify=false docker://localhost:5000/transcoder:7.1 | grep -o 'CLSK-[0-9]*-[0-9]*' | head -1
              d=$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' http://127.0.0.1:5000/v2/transcoder/manifests/7.1 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
              curl -fsS -X POST "http://127.0.0.1:9400/revoke/CLSK-{{a}}-{{b}}" >/dev/null
              cd ~/transcoder-src
              printf '%s\n' 'FROM busybox:1.37' 'COPY app.sh /app.sh' 'CMD ["/app.sh"]' > Dockerfile
              docker build -q --provenance=false --sbom=false -t localhost:5000/transcoder:7.1 .
              docker push -q localhost:5000/transcoder:7.1
              curl -fsS -X DELETE "http://127.0.0.1:5000/v2/transcoder/manifests/$d"
