apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-local-registry-tls
  title: Run Copperleaf's private registry with TLS and passwords
  domain: containers
  frameworks: [dca-legacy:images-registry, ex188-aligned:manage-images, docker-practitioner:registry]
  difficulty: medium
  estimatedMinutes: 20
  tags: [docker, registry, tls, htpasswd, push]
  version: 1
spec:
  description: |
    Copperleaf wants its own registry on **`cl-registry-02`** (`ssh cl-registry-02`; you are
    in the `docker` group and have `sudo`). It must be reachable as
    **`registry.copperleaf.example:5443`** (the name already resolves to the host) and
    serve nothing to anonymous users.

    The platform team left the material in `/etc/copperleaf/registry/`:
    `tls/server.crt`, `tls/server.key` and the CA `tls/ca.crt`, and the password of the
    CI user in `ci-push.pass`. The image `copperleaf/catalogue-api:2.3` (build {{pin}}) is
    in the local engine.

    1. Run the registry (`registry:3`) as a container named **`registry`** on port 5443
       with TLS from the supplied certificate, **htpasswd** authentication with one user,
       **`ci-push`** (password from `ci-push.pass`), a data directory `/srv/registry/data`
       and a restart policy.
    2. Make the engine trust the registry **through the CA** (do not mark it insecure).
    3. Log in as `ci-push` and push the image as
       **`registry.copperleaf.example:5443/catalogue-api:2.3`**. Anonymous requests must
       be refused.
  objectives:
    - Run a registry with TLS and basic authentication
    - Trust a private CA per registry instead of disabling verification
    - Tag, log in and push an image to a private registry
  params:
    pin:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-registry-02
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-registry-02
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        grep -q ' registry.copperleaf.example' /etc/hosts || echo '127.0.0.1 registry.copperleaf.example' >> /etc/hosts
        docker rm -f registry >/dev/null 2>&1 || true
        rm -rf /etc/docker/certs.d/registry.copperleaf.example:5443 /srv/registry /etc/copperleaf/registry
        if [ -f /etc/docker/daemon.json ]; then
          jq 'del(."insecure-registries")' /etc/docker/daemon.json > /tmp/daemon.json.new && mv /tmp/daemon.json.new /etc/docker/daemon.json
        fi
        install -d /etc/copperleaf/registry/tls /var/lib/cloudtrain
        cd /etc/copperleaf/registry/tls
        openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf registry CA" 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=registry.copperleaf.example" 2>/dev/null
        printf 'subjectAltName=DNS:registry.copperleaf.example\nextendedKeyUsage=serverAuth\n' > ext.cnf
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
        mv ca.key /var/lib/cloudtrain/registry-ca.key
        rm -f server.csr ext.cnf ca.srl
        chmod 0644 server.key server.crt ca.crt
        printf '%s\n' "Copperleaf-{{pin}}" > /etc/copperleaf/registry/ci-push.pass
        chmod 0644 /etc/copperleaf/registry/ci-push.pass
        install -d -o learner -g learner /srv/registry /srv/registry/data
        d=$(mktemp -d)
        printf '%s\n' 'FROM busybox:1.37' 'RUN echo "catalogue-api 2.3 build {{pin}}" > /version' 'LABEL com.copperleaf.build={{pin}}' 'CMD ["cat", "/version"]' > "$d/Dockerfile"
        docker build -q -t copperleaf/catalogue-api:2.3 "$d" >/dev/null
        rm -rf "$d"
  checks:
    - id: tls-and-auth
      description: The registry answers over TLS (private CA), refuses anonymous requests and accepts ci-push
      type: shell
      timeoutSec: 60
      on: cl-registry-02
      skills: [containers.registry.run-registry]
      weight: 3
      command: |
        ca=/etc/copperleaf/registry/tls/ca.crt; u=https://registry.copperleaf.example:5443/v2/
        a=$(curl -s --cacert $ca -o /dev/null -w '%{http_code}' $u)
        b=$(curl -s --cacert $ca -u "ci-push:Copperleaf-{{pin}}" -o /dev/null -w '%{http_code}' $u)
        c=$(curl -s --cacert $ca -u "ci-push:wrong" -o /dev/null -w '%{http_code}' $u)
        echo "$a $b $c"
      expect: {match: exact, value: "401 200 401"}
    - id: image-pushed
      description: catalogue-api:2.3 (build {{pin}}) is in the registry and anonymous pulls of it are refused
      type: shell
      timeoutSec: 90
      on: cl-registry-02
      skills: [containers.registry.run-registry]
      weight: 3
      command: |
        ca=/etc/copperleaf/registry/tls/ca.crt; r=registry.copperleaf.example:5443
        anon=$(curl -s --cacert $ca -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.oci.image.manifest.v1+json' https://$r/v2/catalogue-api/manifests/2.3)
        t=$(mktemp -d); cp $ca "$t/ca.crt"
        b=$(skopeo inspect --creds "ci-push:Copperleaf-{{pin}}" --cert-dir "$t" "docker://$r/catalogue-api:2.3" 2>/dev/null | jq -r '.Labels["com.copperleaf.build"] // "none"')
        rm -rf "$t"
        echo "anon=$anon build=$b"
      expect: {match: exact, value: "anon=401 build={{pin}}"}
    - id: trusted-by-ca
      description: The engine trusts the registry through its CA in certs.d, not as an insecure registry
      type: shell
      timeoutSec: 60
      on: cl-registry-02
      skills: [containers.registry.run-registry]
      weight: 2
      command: |
        c=/etc/docker/certs.d/registry.copperleaf.example:5443/ca.crt
        insecure=$(jq -r '(."insecure-registries" // []) | map(select(test("copperleaf"))) | length' /etc/docker/daemon.json 2>/dev/null || echo 0)
        if [ -f "$c" ] && cmp -s "$c" /etc/copperleaf/registry/tls/ca.crt && [ "${insecure:-0}" = 0 ]; then echo trusted; else echo not-trusted; fi
      expect: {match: exact, value: trusted}
    - id: durable
      description: The registry keeps its data in /srv/registry/data and restarts by itself
      type: shell
      timeoutSec: 60
      on: cl-registry-02
      skills: [containers.registry.run-registry, containers.operations.restart-health]
      weight: 1.5
      command: |
        docker inspect registry 2>/dev/null | jq -r '.[0] | ((.HostConfig.RestartPolicy.Name | IN("always", "unless-stopped")) | tostring) + " " + (([.Mounts[]? | select(.Source == "/srv/registry/data" and .Destination == "/var/lib/registry")] | length) | tostring)'
      expect: {match: exact, value: "true 1"}
  hints:
    - title: Registry settings are environment variables
      body: "The registry image reads `REGISTRY_HTTP_ADDR`, `REGISTRY_HTTP_TLS_CERTIFICATE`, `REGISTRY_HTTP_TLS_KEY`, `REGISTRY_AUTH`, `REGISTRY_AUTH_HTPASSWD_REALM` and `REGISTRY_AUTH_HTPASSWD_PATH`. Mount the certificates and the htpasswd file read-only."
      cost: 1
    - title: htpasswd needs bcrypt
      body: "`htpasswd -Bbn ci-push <password>` writes a bcrypt line the registry accepts. Put it in a file you mount into the container."
      cost: 1
    - title: Trusting the CA
      body: "The engine reads one CA per registry from `/etc/docker/certs.d/<host>:<port>/ca.crt`. No engine restart is needed."
      cost: 2
  misconceptions:
    - id: no-auth
      description: Runs the registry with TLS but without htpasswd, so anyone can pull.
      feedback: "TLS protects the connection, not who may use it. Add htpasswd authentication so anonymous requests get 401."
      expectFail: [tls-and-auth, image-pushed]
      mutation:
        on: cl-registry-02
        as: admin
        run: |
          docker run -d --name registry --restart always -p 5443:5443 -v /etc/copperleaf/registry/tls:/certs:ro -v /srv/registry/data:/var/lib/registry \
            -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3
          install -D -m 0644 /etc/copperleaf/registry/tls/ca.crt /etc/docker/certs.d/registry.copperleaf.example:5443/ca.crt
          for i in $(seq 30); do curl -s --cacert /etc/copperleaf/registry/tls/ca.crt -o /dev/null https://registry.copperleaf.example:5443/v2/ && break; sleep 1; done
          runuser -u learner -- docker tag copperleaf/catalogue-api:2.3 registry.copperleaf.example:5443/catalogue-api:2.3
          runuser -u learner -- docker push -q registry.copperleaf.example:5443/catalogue-api:2.3
    - id: insecure-registry
      description: Marks the registry insecure in daemon.json instead of trusting its CA.
      feedback: "insecure-registries switches certificate verification off. Put the CA in /etc/docker/certs.d/<host>:<port>/ca.crt instead."
      expectFail: [trusted-by-ca]
      mutation:
        on: cl-registry-02
        as: admin
        run: |
          mkdir -p /etc/copperleaf/registry/auth
          htpasswd -Bbn ci-push "Copperleaf-{{pin}}" > /etc/copperleaf/registry/auth/htpasswd
          docker run -d --name registry --restart always -p 5443:5443 -v /etc/copperleaf/registry/tls:/certs:ro -v /etc/copperleaf/registry/auth:/auth:ro -v /srv/registry/data:/var/lib/registry \
            -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=copperleaf -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:3
          echo '{ "insecure-registries": ["registry.copperleaf.example:5443"] }' > /etc/docker/daemon.json
          systemctl restart docker
          for i in $(seq 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
          for i in $(seq 30); do curl -s --cacert /etc/copperleaf/registry/tls/ca.crt -o /dev/null https://registry.copperleaf.example:5443/v2/ && break; sleep 1; done
          echo "Copperleaf-{{pin}}" | runuser -u learner -- docker login -u ci-push --password-stdin registry.copperleaf.example:5443
          runuser -u learner -- docker tag copperleaf/catalogue-api:2.3 registry.copperleaf.example:5443/catalogue-api:2.3
          runuser -u learner -- docker push -q registry.copperleaf.example:5443/catalogue-api:2.3
  solution:
    explanation: |
      The registry container gets the certificate and an htpasswd file and a data
      directory; the engine trusts the CA through certs.d; then login, tag and push.
    steps:
      - on: cl-registry-02
        as: learner
        run: |
          sudo mkdir -p /etc/copperleaf/registry/auth
          htpasswd -Bbn ci-push "$(cat /etc/copperleaf/registry/ci-push.pass)" | sudo tee /etc/copperleaf/registry/auth/htpasswd >/dev/null
          docker run -d --name registry --restart always -p 5443:5443 \
            -v /etc/copperleaf/registry/tls:/certs:ro -v /etc/copperleaf/registry/auth:/auth:ro -v /srv/registry/data:/var/lib/registry \
            -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=copperleaf -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:3
          sudo install -D -m 0644 /etc/copperleaf/registry/tls/ca.crt /etc/docker/certs.d/registry.copperleaf.example:5443/ca.crt
          for i in $(seq 30); do curl -s --cacert /etc/copperleaf/registry/tls/ca.crt -o /dev/null https://registry.copperleaf.example:5443/v2/ && break; sleep 1; done
          docker login -u ci-push --password-stdin registry.copperleaf.example:5443 < /etc/copperleaf/registry/ci-push.pass
          docker tag copperleaf/catalogue-api:2.3 registry.copperleaf.example:5443/catalogue-api:2.3
          docker push registry.copperleaf.example:5443/catalogue-api:2.3
    alternatives:
      - id: config-file
        description: Put the settings in a mounted config file instead of environment variables.
        steps:
          - on: cl-registry-02
            as: learner
            run: |
              sudo mkdir -p /etc/copperleaf/registry/auth
              htpasswd -Bbn ci-push "$(cat /etc/copperleaf/registry/ci-push.pass)" | sudo tee /etc/copperleaf/registry/auth/htpasswd >/dev/null
              cat > /srv/registry/config.yml <<'YML'
              version: 0.1
              storage:
                filesystem:
                  rootdirectory: /var/lib/registry
              http:
                addr: :5443
                tls:
                  certificate: /certs/server.crt
                  key: /certs/server.key
              auth:
                htpasswd:
                  realm: copperleaf
                  path: /auth/htpasswd
              YML
              docker run -d --name registry --restart unless-stopped -p 5443:5443 \
                -v /etc/copperleaf/registry/tls:/certs:ro -v /etc/copperleaf/registry/auth:/auth:ro -v /srv/registry/data:/var/lib/registry \
                -v /srv/registry/config.yml:/etc/distribution/config.yml:ro registry:3
              sudo install -D -m 0644 /etc/copperleaf/registry/tls/ca.crt /etc/docker/certs.d/registry.copperleaf.example:5443/ca.crt
              for i in $(seq 30); do curl -s --cacert /etc/copperleaf/registry/tls/ca.crt -o /dev/null https://registry.copperleaf.example:5443/v2/ && break; sleep 1; done
              docker login -u ci-push --password-stdin registry.copperleaf.example:5443 < /etc/copperleaf/registry/ci-push.pass
              docker tag copperleaf/catalogue-api:2.3 registry.copperleaf.example:5443/catalogue-api:2.3
              docker push registry.copperleaf.example:5443/catalogue-api:2.3
