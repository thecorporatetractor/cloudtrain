apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-log-rotation
  title: Cap container logs that filled the batch host
  domain: containers
  frameworks: [dca-legacy:install-config, docker-practitioner:operations]
  difficulty: easy
  estimatedMinutes: 12
  tags: [docker, logging, json-file, daemon-json]
  version: 1
spec:
  description: |
    On `cl-ingest-01` (`ssh cl-ingest-01`; you are in the `docker` group) the chatty
    container **`ingest`** (image `copperleaf/ingest:1`, site `{{site}}`, restart policy
    `unless-stopped`) writes a line every few milliseconds and its `json-file` log
    grows without bound; the disk filled up.

    1. Recreate **`ingest`** from the same image and with the same `SITE` setting and
       restart policy, with log rotation at **20 MB per file, keeping 5 files** (still
       the `json-file` driver).
    2. Set the same default for **new containers** on the host: the `json-file` driver
       with `max-size` 20m and `max-file` 5 in `/etc/docker/daemon.json` (keep every
       other setting in that file), and make the engine pick it up.
  objectives:
    - Set log driver options on a single container
    - Set host-wide logging defaults in daemon.json
    - Know which settings apply to existing containers and which to new ones
  params:
    site:
      type: choice
      values: [ingest-ams, ingest-fra, ingest-osl]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-ingest-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-ingest-01
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        d=$(mktemp -d)
        printf '%s\n' 'FROM busybox:1.37' \
          'CMD ["sh", "-c", "while :; do echo ingest $SITE record $(date +%s) ........................................; sleep 0.05; done"]' > "$d/Dockerfile"
        docker build -q -t copperleaf/ingest:1 "$d" >/dev/null
        rm -rf "$d"
        f=/etc/docker/daemon.json
        [ -s "$f" ] || echo '{}' > "$f"
        jq 'del(."log-driver", ."log-opts")' "$f" > "$f.new" && mv "$f.new" "$f"
        docker rm -f ingest >/dev/null 2>&1 || true
        docker run -d --name ingest --restart unless-stopped -e SITE={{site}} copperleaf/ingest:1 >/dev/null
  checks:
    - id: container-rotation
      description: ingest rotates its json-file log at 20m keeping 5 files
      type: shell
      timeoutSec: 60
      on: cl-ingest-01
      skills: [containers.operations.logging]
      weight: 2
      command: |
        docker inspect ingest 2>/dev/null | jq -r '.[0].HostConfig.LogConfig | [.Type, .Config["max-size"], .Config["max-file"]] | join(" ")'
      expect: {match: exact, value: "json-file 20m 5"}
    - id: host-default
      description: daemon.json and the running engine default new containers to json-file, 20m, 5 files
      type: shell
      timeoutSec: 90
      on: cl-ingest-01
      skills: [containers.operations.logging, containers.operations.daemon-config]
      weight: 3
      command: |
        file=$(jq -r '[."log-driver", ."log-opts"."max-size", ."log-opts"."max-file"] | join(" ")' /etc/docker/daemon.json 2>/dev/null || echo unreadable)
        docker rm -f logprobe-grader >/dev/null 2>&1 || true
        docker create --name logprobe-grader busybox:1.37 true >/dev/null 2>&1
        live=$(docker inspect logprobe-grader 2>/dev/null | jq -r '.[0].HostConfig.LogConfig | [.Type, .Config["max-size"], .Config["max-file"]] | join(" ")')
        docker rm -f logprobe-grader >/dev/null 2>&1 || true
        echo "$file | $live"
      expect: {match: exact, value: "json-file 20m 5 | json-file 20m 5"}
    - id: same-service
      description: ingest still runs copperleaf/ingest:1 with its site and restart policy
      type: shell
      timeoutSec: 60
      on: cl-ingest-01
      skills: [containers.operations.logging, containers.operations.restart-health]
      weight: 1
      command: |
        docker inspect ingest 2>/dev/null | jq -r '[.[0].Config.Image, (.[0].Config.Env | index("SITE={{site}}") != null | tostring), .[0].HostConfig.RestartPolicy.Name, .[0].State.Status] | join(" ")'
      expect: {match: exact, value: "copperleaf/ingest:1 true unless-stopped running"}
  hints:
    - title: Per container
      body: "`--log-opt max-size=20m --log-opt max-file=5` on `docker run` (with the default json-file driver) sets the rotation for one container. A container's log options cannot be changed afterwards, so recreate it."
      cost: 1
    - title: Host default
      body: "daemon.json takes `log-driver` and a `log-opts` object. Use jq to merge the keys so other settings stay. Log defaults are read when the engine starts, and only containers created afterwards use them."
      cost: 1
    - title: Check it took effect
      body: "`docker info --format json | jq .LoggingDriver` shows the default driver; a freshly created container's HostConfig.LogConfig shows the options."
      cost: 1
  misconceptions:
    - id: container-only
      description: Recreates ingest with the options but never touches daemon.json.
      feedback: "Per-container options do not change the host default. New containers would still log without a limit."
      expectFail: [host-default]
      mutation:
        on: cl-ingest-01
        as: learner
        run: |
          docker rm -f ingest
          docker run -d --name ingest --restart unless-stopped -e SITE={{site}} --log-opt max-size=20m --log-opt max-file=5 copperleaf/ingest:1
    - id: daemon-only
      description: Sets the daemon default and restarts the engine, leaving ingest as it was.
      feedback: "Existing containers keep the log configuration they were created with. Recreate ingest after setting the default."
      expectFail: [container-rotation]
      mutation:
        on: cl-ingest-01
        as: learner
        run: |
          sudo sh -c 'jq ". + {\"log-driver\": \"json-file\", \"log-opts\": {\"max-size\": \"20m\", \"max-file\": \"5\"}}" /etc/docker/daemon.json > /etc/docker/daemon.json.new && mv /etc/docker/daemon.json.new /etc/docker/daemon.json'
          sudo systemctl restart docker
          sleep 8
    - id: local-driver
      description: Switches ingest to the local driver instead of rotating json-file.
      feedback: "The task keeps the json-file driver; set max-size and max-file on it."
      expectFail: [container-rotation]
      mutation:
        on: cl-ingest-01
        as: learner
        run: |
          docker rm -f ingest
          docker run -d --name ingest --restart unless-stopped -e SITE={{site}} --log-driver local --log-opt max-size=20m --log-opt max-file=5 copperleaf/ingest:1
  solution:
    explanation: |
      Recreate the container with `--log-opt max-size=20m --log-opt max-file=5`, merge the
      same defaults into daemon.json with jq, and restart the engine (ingest has a
      restart policy and comes back).
    steps:
      - on: cl-ingest-01
        as: learner
        run: |
          docker rm -f ingest
          docker run -d --name ingest --restart unless-stopped -e SITE={{site}} --log-opt max-size=20m --log-opt max-file=5 copperleaf/ingest:1
          sudo sh -c 'jq ". + {\"log-driver\": \"json-file\", \"log-opts\": {\"max-size\": \"20m\", \"max-file\": \"5\"}}" /etc/docker/daemon.json > /etc/docker/daemon.json.new && mv /etc/docker/daemon.json.new /etc/docker/daemon.json'
          sudo systemctl restart docker
    alternatives:
      - id: default-first
        description: Set the host default first, restart the engine, then recreate ingest so it inherits the default.
        steps:
          - on: cl-ingest-01
            as: learner
            run: |
              sudo sh -c 'jq ". + {\"log-driver\": \"json-file\", \"log-opts\": {\"max-size\": \"20m\", \"max-file\": \"5\"}}" /etc/docker/daemon.json > /etc/docker/daemon.json.new && mv /etc/docker/daemon.json.new /etc/docker/daemon.json'
              sudo systemctl restart docker
              for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
              docker rm -f ingest
              docker run -d --name ingest --restart unless-stopped -e SITE={{site}} copperleaf/ingest:1
