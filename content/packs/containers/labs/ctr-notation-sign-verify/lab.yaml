apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-notation-sign-verify
  title: Sign the subtitle release with a trust policy
  domain: containers
  frameworks: [docker-practitioner:supply-chain]
  difficulty: hard
  estimatedMinutes: 20
  tags: [docker, notation, signing, trust-policy, registry]
  version: 1
spec:
  description: |
    On **`cl-subtitle-04`** (`ssh cl-subtitle-04`) `subtitle:{{rel}}` is built and pushed
    to `localhost:5000/subtitle:{{rel}}`. Copperleaf's test CA material is at
    `~/notation-setup/`: `copperleaf-ca.crt`, `copperleaf-ca.key`, a certificate extensions
    file `leaf.ext` for signing certificates, and a second, unrelated CA `other-ca.crt` /
    `other-ca.key` that signed `localhost:5000/other-source:1.0` (already pushed and signed
    by that unrelated source).

    1. Issue a signing **leaf certificate** from `copperleaf-ca` (use `leaf.ext`; keep the
       chain leaf-then-CA in one file), register the key and chain with Notation, and
       **sign** the digest of `subtitle:{{rel}}`.
    2. Add `copperleaf-ca.crt` to the Notation trust store **`copperleaf`** (type `ca`) and
       write a **trust policy** at `~/notation-setup/trustpolicy.json` that trusts **only**
       that store. Scope it with the single wildcard `*` (Notation scopes name whole
       repositories, so `*` is the only way to cover every repository), then **import** it
       with `notation policy import`.
    3. Show **`notation verify`** **succeeds** for `subtitle:{{rel}}` and **fails** for
       `other-source:1.0`, which was signed with the unrelated CA.
  objectives:
    - Issue a signing leaf certificate from a private CA
    - Sign an image digest with Notation
    - Write and import a trust policy that trusts exactly one CA
  params:
    rel:
      type: int
      min: 100
      max: 899
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-subtitle-04
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-subtitle-04
      timeoutSec: 420
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        docker rm -f registry >/dev/null 2>&1 || true
        rm -rf /srv/registry; install -d /srv/registry
        docker run -d --name registry --restart always -p 127.0.0.1:5000:5000 -v /srv/registry:/var/lib/registry registry:3 >/dev/null
        for i in $(seq 30); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
        s=/home/learner/notation-setup
        rm -rf "$s" /home/learner/.config/notation; install -d -o learner -g learner "$s"
        for n in copperleaf other; do
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$s/${n}-ca.key" -out "$s/${n}-ca.crt" -days 30 -subj "/C=US/ST=CA/O=${n}/CN=${n} test CA" -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign 2>/dev/null
        done
        printf '%s\n' 'basicConstraints=CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=codeSigning' > "$s/leaf.ext"
        d=$(mktemp -d)
        printf '%s\n' 'FROM busybox:1.37' "RUN echo 'subtitle {{rel}}' > /version" > "$d/Dockerfile"
        docker build -q --provenance=false --sbom=false -t localhost:5000/subtitle:{{rel}} "$d" >/dev/null
        docker push -q localhost:5000/subtitle:{{rel}} >/dev/null
        printf '%s\n' 'FROM busybox:1.37' "RUN echo 'other-source 1.0' > /version" > "$d/Dockerfile"
        docker build -q --provenance=false --sbom=false -t localhost:5000/other-source:1.0 "$d" >/dev/null
        docker push -q localhost:5000/other-source:1.0 >/dev/null
        rm -rf "$d"
        if command -v notation >/dev/null 2>&1; then
          cd "$s"
          openssl req -new -newkey rsa:2048 -nodes -keyout other-leaf.key -out other-leaf.csr -subj "/C=US/ST=CA/O=other/CN=other source signer" 2>/dev/null
          openssl x509 -req -in other-leaf.csr -CA other-ca.crt -CAkey other-ca.key -CAcreateserial -out other-leaf.crt -days 7 -extfile leaf.ext 2>/dev/null
          cat other-leaf.crt other-ca.crt > other-chain.crt
          chown -R learner:learner "$s"
          N="runuser -u learner -- env HOME=/home/learner notation"
          install -d -o learner -g learner /home/learner/.config/notation
          printf '{"keys":[{"name":"other-source-signer","keyPath":"%s","certPath":"%s"}]}\n' "$s/other-leaf.key" "$s/other-chain.crt" > /home/learner/.config/notation/signingkeys.json
          chown learner:learner /home/learner/.config/notation/signingkeys.json
          dother=$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json' http://127.0.0.1:5000/v2/other-source/manifests/1.0 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          $N sign --signature-format cose --key other-source-signer --insecure-registry "localhost:5000/other-source@$dother"
        else
          printf '%s\n' 'notation is not installed on this host image, so the comparison signature could not be created.' > "$s/NOTE.txt"
        fi
        chown -R learner:learner "$s"
  checks:
    - id: trust-policy-shape
      description: The imported trust policy trusts only the copperleaf store and covers every repository
      type: shell
      timeoutSec: 60
      on: cl-subtitle-04
      skills: [containers.supply-chain.signing]
      weight: 2
      command: |
        f=/home/learner/.config/notation/trustpolicy.json
        jq -r '.trustPolicies | map([(.registryScopes | sort | join(",")), (.trustStores | join(",")), .signatureVerification.level] | join(" | ")) | join(" ; ")' "$f" 2>/dev/null || echo invalid
      expect: {match: regex, value: "^(\\*|localhost:5000/other-source,localhost:5000/subtitle) \\| ca:copperleaf \\| (strict|permissive)$"}
    - id: subtitle-signed-and-verifies
      description: subtitle:{{rel}} verifies against the imported trust policy
      type: shell
      timeoutSec: 90
      on: cl-subtitle-04
      skills: [containers.supply-chain.signing]
      weight: 3
      command: |
        runuser -u learner -- env HOME=/home/learner notation verify --insecure-registry localhost:5000/subtitle:{{rel}} >/dev/null 2>&1 && echo verified || echo not-verified
      expect: {match: exact, value: verified}
    - id: other-source-rejected
      description: other-source:1.0 (signed with the unrelated CA) fails verification under an imported policy
      type: shell
      timeoutSec: 90
      on: cl-subtitle-04
      skills: [containers.supply-chain.signing]
      weight: 2.5
      command: |
        [ -s /home/learner/.config/notation/trustpolicy.json ] || { echo no-policy; exit 0; }
        runuser -u learner -- env HOME=/home/learner notation verify --insecure-registry localhost:5000/other-source:1.0 >/dev/null 2>&1 && echo verified || echo rejected
      expect: {match: exact, value: rejected}
  hints:
    - title: A signing certificate needs its own key
      body: "Create a leaf key and CSR with `openssl req -new -newkey rsa:2048 -nodes`, then have `copperleaf-ca.key` sign it with `openssl x509 -req -CA ... -CAkey ... -extfile leaf.ext`. Concatenate leaf then CA into a chain file and register it by adding an entry (`name`, `keyPath`, `certPath` with absolute paths; no `default` field) to the `keys` list in `~/.config/notation/signingkeys.json` (`notation key list` shows it; `notation key add` only handles plugin keys); `notation sign --key <name>` then uses it."
      cost: 1
    - title: Trust store vs trust policy
      body: "The CA certificate goes into Notation's trust store (`notation cert add --type ca --store copperleaf copperleaf-ca.crt`); the trust policy names that store in `trustStores` as `ca:copperleaf`. Load the policy with `notation policy import trustpolicy.json`; `notation verify` has no policy-file flag."
      cost: 1
    - title: Scoping the policy
      body: "`registryScopes` entries are full repository names such as `localhost:5000/subtitle`, or a lone `\"*\"`. A prefix wildcard like `localhost:5000/*` is not valid. Trusting only `ca:copperleaf` is what makes other-source (signed by a different CA) fail."
      cost: 2
  misconceptions:
    - id: trust-both-cas
      description: Adds both CAs to the trust store, so the unrelated signature also verifies.
      feedback: "A trust policy that trusts every CA you happen to have around defeats the point: it should trust only the organisation's own CA, so a signature from an unrelated source is rejected."
      expectFail: [other-source-rejected]
      mutation:
        on: cl-subtitle-04
        as: learner
        run: |
          cd ~/notation-setup
          notation cert add -t ca -s acme copperleaf-ca.crt
          notation cert add -t ca -s acme other-ca.crt
          jq -n '{"version": "1.0", "trustPolicies": [{"name": "copperleaf", "registryScopes": ["*"], "signatureVerification": {"level": "strict"}, "trustStores": ["ca:acme"], "trustedIdentities": ["*"]}]}' > trustpolicy.json
          notation policy import --force trustpolicy.json
    - id: scope-too-narrow
      description: Scopes the trust policy to only the subtitle repository, so every other repository has no applicable policy.
      feedback: "Scopes name whole repositories. Listing only localhost:5000/subtitle leaves other repositories without a policy, so the gate cannot be reused. Use the single wildcard or list every repository."
      expectFail: [trust-policy-shape]
      mutation:
        on: cl-subtitle-04
        as: learner
        run: |
          cd ~/notation-setup
          notation cert add -t ca -s copperleaf copperleaf-ca.crt
          jq -n '{"version": "1.0", "trustPolicies": [{"name": "copperleaf", "registryScopes": ["localhost:5000/subtitle"], "signatureVerification": {"level": "strict"}, "trustStores": ["ca:copperleaf"], "trustedIdentities": ["*"]}]}' > trustpolicy.json
          notation policy import --force trustpolicy.json
  solution:
    explanation: |
      Issue a leaf certificate from the Copperleaf CA, register it as a Notation signing
      key and sign the release digest; import only the Copperleaf CA into the trust store
      and load a policy that trusts just that store. Verification then succeeds for the
      signed release and fails for the image signed by the unrelated CA.
    steps:
      - on: cl-subtitle-04
        as: learner
        timeoutSec: 180
        run: |
          cd ~/notation-setup
          openssl req -new -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr -subj "/C=US/ST=CA/O=copperleaf/CN=copperleaf release signer" 2>/dev/null
          openssl x509 -req -in leaf.csr -CA copperleaf-ca.crt -CAkey copperleaf-ca.key -CAcreateserial -out leaf.crt -days 7 -extfile leaf.ext 2>/dev/null
          cat leaf.crt copperleaf-ca.crt > chain.crt
          mkdir -p ~/.config/notation
          printf '{"keys":[{"name":"copperleaf-release","keyPath":"%s","certPath":"%s"}]}\n' "$PWD/leaf.key" "$PWD/chain.crt" > ~/.config/notation/signingkeys.json
          d=$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json' http://127.0.0.1:5000/v2/subtitle/manifests/{{rel}} | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          notation sign --signature-format cose --key copperleaf-release --insecure-registry "localhost:5000/subtitle@$d"
          notation cert add -t ca -s copperleaf copperleaf-ca.crt
          jq -n '{"version": "1.0", "trustPolicies": [{"name": "copperleaf", "registryScopes": ["*"], "signatureVerification": {"level": "strict"}, "trustStores": ["ca:copperleaf"], "trustedIdentities": ["*"]}]}' > trustpolicy.json
          notation policy import --force trustpolicy.json
          notation verify --insecure-registry localhost:5000/subtitle:{{rel}}
          notation verify --insecure-registry localhost:5000/other-source:1.0 || true
    alternatives:
      - id: strict-trusted-identity
        description: Narrow trustedIdentities to the signing certificate's subject and use explicit repository scopes instead of a wildcard.
        steps:
          - on: cl-subtitle-04
            as: learner
            timeoutSec: 180
            run: |
              cd ~/notation-setup
              notation cert add -t ca -s copperleaf copperleaf-ca.crt
              jq -n '{"version": "1.0", "trustPolicies": [{"name": "copperleaf", "registryScopes": ["localhost:5000/subtitle", "localhost:5000/other-source"], "signatureVerification": {"level": "strict"}, "trustStores": ["ca:copperleaf"], "trustedIdentities": ["x509.subject: C=US,ST=CA,O=copperleaf,CN=copperleaf release signer"]}]}' > trustpolicy.json
              notation policy import --force trustpolicy.json
              openssl req -new -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr -subj "/C=US/ST=CA/O=copperleaf/CN=copperleaf release signer" 2>/dev/null
              openssl x509 -req -in leaf.csr -CA copperleaf-ca.crt -CAkey copperleaf-ca.key -CAcreateserial -out leaf.crt -days 7 -extfile leaf.ext 2>/dev/null
              cat leaf.crt copperleaf-ca.crt > chain.crt
              mkdir -p ~/.config/notation
              printf '{"keys":[{"name":"copperleaf-release","keyPath":"%s","certPath":"%s"}]}\n' "$PWD/leaf.key" "$PWD/chain.crt" > ~/.config/notation/signingkeys.json
              d=$(curl -fsSI -H 'Accept: application/vnd.oci.image.manifest.v1+json' http://127.0.0.1:5000/v2/subtitle/manifests/{{rel}} | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
              notation sign --signature-format cose --key copperleaf-release --insecure-registry "localhost:5000/subtitle@$d"
              notation verify --insecure-registry localhost:5000/subtitle:{{rel}}
