apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-podman-pod-kube-play
  title: "Run the catalogue pod from a manifest with a secret"
  domain: containers
  frameworks: [ex188-aligned:multi-container]
  difficulty: medium
  estimatedMinutes: 25
  tags: [podman, pods, secrets, kube-play]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell media@` to work as the unprivileged user `media`)

    The catalogue API (`registry.copperleaf.example:5443/catalogue-api:2.3`, listens on 8080, reads the
    database password from the variable `REDIS_PASSWORD` or the file named by `REDIS_PASSWORD_FILE`,
    connects to the database on localhost) and its Redis database
    (`registry.copperleaf.example:5443/library/redis:7.4-alpine`, which must require that password) belong
    in one pod. The password is in `/srv/catalogue/db-password` and must never appear in plain text in a
    command line or manifest.

    As `media`:

    1. Store the password as a Podman secret named **`catalogue-db`**. `podman kube play` can only
       resolve a secret that holds a Kubernetes `Secret` manifest, so write one (`kind: Secret`, name
       `catalogue-db`, `stringData` key **`password`** with the value from the file) and create the secret
       with `podman kube play`.
    2. Write the pod manifest **`~/catalogue.yaml`** (`kind: Pod`, name **`catalogue`**) with the API and the
       database as containers, host port **8080** published, and the password supplied only through
       `secretKeyRef` (name `catalogue-db`, key `password`). The database must be started from a config
       file rather than a password on its command line.
    3. Create the pod with **`podman kube play ~/catalogue.yaml`**. `http://127.0.0.1:8080/` returns
       `catalogue ok db=authenticated`.
  objectives:
    - "Run containers in a pod that share localhost"
    - "Supply a password through a Podman secret"
    - "Write and play a pod manifest with kube play"
  params:
    pin:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.copperleaf.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
        d=$(mktemp -d)
        cat > $d/app.py <<'EOP'
        import os, socket, http.server
        pw = os.environ.get("REDIS_PASSWORD")
        if not pw and os.environ.get("REDIS_PASSWORD_FILE"):
            pw = open(os.environ["REDIS_PASSWORD_FILE"]).read().strip()
        def talk():
            s = socket.create_connection(("127.0.0.1", 6379), timeout=3)
            def cmd(*a):
                s.sendall(("*%d\r\n" % len(a) + "".join("$%d\r\n%s\r\n" % (len(x), x) for x in a)).encode())
                return s.recv(4096).decode()
            r = cmd("AUTH", pw or "")
            s.close()
            return r.startswith("+OK")
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                try:
                    ok = talk()
                except Exception:
                    ok = False
                body = ("catalogue ok db=authenticated\n" if ok else "catalogue db=unavailable\n").encode()
                self.send_response(200 if ok else 502)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass
        http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
        EOP
        printf 'FROM python:3.13-alpine\nCOPY app.py /app.py\nEXPOSE 8080\nCMD ["python", "/app.py"]\n' > $d/Dockerfile
        docker build -q -t "$R:5443/catalogue-api:2.3" $d >/dev/null
        docker push -q "$R:5443/catalogue-api:2.3" >/dev/null
        rm -rf $d
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=media; R=registry.copperleaf.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2301 -s /bin/bash $U
        loginctl enable-linger $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        pull library/redis:7.4-alpine
        pull catalogue-api:2.3
        install -d -o $U -g $U /srv/catalogue
        printf 'Copperleaf-{{pin}}' > /srv/catalogue/db-password
        chown $U:$U /srv/catalogue/db-password; chmod 0600 /srv/catalogue/db-password
        px podman pod rm -f catalogue >/dev/null 2>&1 || true
        px podman secret rm catalogue-db >/dev/null 2>&1 || true
        rm -f /home/$U/catalogue.yaml
  checks:
    - id: pod-serves
      description: "The pod answers on 8080 with an authenticated database connection"
      type: shell
      timeoutSec: 120
      on: cl-podman-01
      skills: [containers.podman.pods]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user media "$@"; }
        px podman pod start catalogue >/dev/null 2>&1 || true
        r=no-answer
        for i in $(seq 30); do o=$(curl -s -m 3 http://127.0.0.1:8080/) && [ -n "$o" ] && { r=$o; break; }; sleep 1; done
        echo "$r"
      expect: {match: exact, value: "catalogue ok db=authenticated"}
    - id: secret-holds-password
      description: "The Podman secret catalogue-db holds the password as a Kubernetes Secret"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.secrets]
      weight: 1.5
      command: |
        px() { /usr/local/lib/cloudtrain/as-user media "$@"; }
        b=$(printf %s 'Copperleaf-{{pin}}' | base64)
        px podman secret inspect --showsecret catalogue-db 2>/dev/null | jq -r '.[0].SecretData // ""' | grep -qF -e 'Copperleaf-{{pin}}' -e "$b" && echo 'Copperleaf-{{pin}}' || echo none
      expect: {match: exact, value: "Copperleaf-{{pin}}"}
    - id: db-requires-auth
      description: "The database refuses unauthenticated commands"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.secrets]
      weight: 1.5
      command: |
        px() { /usr/local/lib/cloudtrain/as-user media "$@"; }
        n=$(px podman ps -a --filter pod=catalogue 2>/dev/null | awk '/redis/ {print $NF; exit}')
        [ -n "$n" ] || { echo no-db; exit 0; }
        px podman exec "$n" redis-cli PING 2>&1 | grep -q NOAUTH && echo auth-required || echo open
      expect: {match: exact, value: "auth-required"}
    - id: manifest-clean
      description: "~/catalogue.yaml is a pod manifest that refers to the secret without the plain-text password"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.kube-play]
      weight: 1.5
      command: |
        f=/home/media/catalogue.yaml
        if [ -s $f ] && grep -q '^kind: Pod' $f && grep -qE "secretKeyRef|secretName" $f && ! grep -qF 'Copperleaf-{{pin}}' $f; then echo clean; else echo bad; fi
      expect: {match: exact, value: "clean"}
    - id: replayed
      description: "The pod was recreated from the manifest after it was written"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.kube-play]
      weight: 2
      command: |
        px() { /usr/local/lib/cloudtrain/as-user media "$@"; }
        f=/home/media/catalogue.yaml
        [ -s $f ] || { echo no-manifest; exit 0; }
        c=$(px podman pod inspect catalogue 2>/dev/null | jq -r '(if type == "array" then .[0] else . end) | .Created // empty')
        [ -n "$c" ] || { echo no-pod; exit 0; }
        pc=$(date -d "$c" +%s.%N); fm=$(stat -c %.9Y $f)
        awk -v a="$pc" -v b="$fm" 'BEGIN{exit !(a>b)}' && echo replayed || echo not-recreated
      expect: {match: exact, value: "replayed"}
  hints:
    - title: "A secret kube play can read"
      body: "kube play resolves secretKeyRef against Kubernetes Secret objects. Write a Secret manifest with stringData and play it: the Podman secret that results has the same name."
      cost: 1
    - title: "Keep the password out of argv"
      body: "Give the containers the value through env valueFrom secretKeyRef (or a secret volume). Redis can read requirepass from a config file that the container writes from the variable."
      cost: 1
    - title: "Play the manifest"
      body: "podman kube play <file> creates the pod, with hostPort entries published. If a pod of the same name exists, remove it first (podman pod rm -f)."
      command: "podman kube play ~/catalogue.yaml"
      cost: 2
  misconceptions:
    - id: plain-text-password
      description: "Passes the password as a plain environment variable."
      feedback: "Anything given with -e or on a command line lands in the manifest as plain text. Use a Podman secret and refer to it by name."
      expectFail: [secret-holds-password, manifest-clean]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user media "$@"; }

          pw=$(cat /srv/catalogue/db-password)
          px podman pod create --name catalogue -p 8080:8080 >/dev/null
          px podman run -d --pod catalogue --name catalogue-db registry.copperleaf.example:5443/library/redis:7.4-alpine redis-server --requirepass "$pw" >/dev/null
          px podman run -d --pod catalogue --name catalogue-api -e REDIS_PASSWORD="$pw" registry.copperleaf.example:5443/catalogue-api:2.3 >/dev/null
          px sh -c 'cd /home/media && podman generate kube catalogue > catalogue.yaml'
          px podman pod rm -f catalogue >/dev/null
          px sh -c 'cd /home/media && podman kube play catalogue.yaml' >/dev/null
    - id: restart-not-replay
      description: "Writes the manifest again but only restarts the existing pod."
      feedback: "The pod has to come out of the manifest. Remove the pod and play the file, so the pod is newer than the manifest."
      expectFail: [replayed]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          X() { sudo -u media -H env XDG_RUNTIME_DIR=/run/user/$(id -u media) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u media)/bus "$@"; }
          cd /
          printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: catalogue-db\nstringData:\n  password: %s\n' "$(cat /srv/catalogue/db-password)" > /home/media/secret.yaml
          chown media:media /home/media/secret.yaml; chmod 0600 /home/media/secret.yaml
          X podman kube play /home/media/secret.yaml
          cat > /home/media/catalogue.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: catalogue
          spec:
            containers:
            - name: db
              image: registry.copperleaf.example:5443/library/redis:7.4-alpine
              command: ["sh", "-c"]
              args: ["printf 'requirepass %s\\n' \"$REDIS_PASSWORD\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf"]
              env:
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef: {name: catalogue-db, key: password}
            - name: api
              image: registry.copperleaf.example:5443/catalogue-api:2.3
              ports:
              - containerPort: 8080
                hostPort: 8080
              env:
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef: {name: catalogue-db, key: password}
          EOF
          chown media:media /home/media/catalogue.yaml
          X sh -c 'cd /home/media && podman kube play catalogue.yaml'
          touch /home/media/catalogue.yaml
          X podman pod restart catalogue
  solution:
    explanation: |
      Turn the password file into a Kubernetes Secret manifest and play it, which creates the Podman secret. Write the pod manifest so both containers read the password through secretKeyRef, and play it; Redis writes its config from the variable, so the password is on no command line.
    steps:
      - on: cl-podman-01
        as: admin
        run: |
          X() { sudo -u media -H env XDG_RUNTIME_DIR=/run/user/$(id -u media) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u media)/bus "$@"; }
          cd /
          printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: catalogue-db\nstringData:\n  password: %s\n' "$(cat /srv/catalogue/db-password)" > /home/media/secret.yaml
          chown media:media /home/media/secret.yaml; chmod 0600 /home/media/secret.yaml
          X podman kube play /home/media/secret.yaml
          cat > /home/media/catalogue.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: catalogue
          spec:
            containers:
            - name: db
              image: registry.copperleaf.example:5443/library/redis:7.4-alpine
              command: ["sh", "-c"]
              args: ["printf 'requirepass %s\\n' \"$REDIS_PASSWORD\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf"]
              env:
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef: {name: catalogue-db, key: password}
            - name: api
              image: registry.copperleaf.example:5443/catalogue-api:2.3
              ports:
              - containerPort: 8080
                hostPort: 8080
              env:
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef: {name: catalogue-db, key: password}
          EOF
          chown media:media /home/media/catalogue.yaml
          X sh -c 'cd /home/media && podman kube play catalogue.yaml'
    alternatives:
      - id: secret-volume
        description: "Mount the secret as a volume and use REDIS_PASSWORD_FILE."
        steps:
          - on: cl-podman-01
            as: admin
            run: |
              X() { sudo -u media -H env XDG_RUNTIME_DIR=/run/user/$(id -u media) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u media)/bus "$@"; }
              cd /
              printf 'apiVersion: v1\nkind: Secret\nmetadata:\n  name: catalogue-db\nstringData:\n  password: %s\n' "$(cat /srv/catalogue/db-password)" > /home/media/secret.yaml
              chown media:media /home/media/secret.yaml; chmod 0600 /home/media/secret.yaml
              X podman kube play /home/media/secret.yaml
              cat > /home/media/catalogue.yaml <<'EOF'
              apiVersion: v1
              kind: Pod
              metadata:
                name: catalogue
              spec:
                containers:
                - name: db
                  image: registry.copperleaf.example:5443/library/redis:7.4-alpine
                  command: ["sh", "-c"]
                  args: ["printf 'requirepass %s\\n' \"$(cat /run/pw/password)\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf"]
                  volumeMounts:
                  - {name: pw, mountPath: /run/pw, readOnly: true}
                - name: api
                  image: registry.copperleaf.example:5443/catalogue-api:2.3
                  ports:
                  - containerPort: 8080
                    hostPort: 8080
                  env:
                  - {name: REDIS_PASSWORD_FILE, value: /run/pw/password}
                  volumeMounts:
                  - {name: pw, mountPath: /run/pw, readOnly: true}
                volumes:
                - name: pw
                  secret: {secretName: catalogue-db}
              EOF
              chown media:media /home/media/catalogue.yaml
              X sh -c 'cd /home/media && podman kube play catalogue.yaml'
