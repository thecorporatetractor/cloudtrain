apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-quadlet-reboot
  title: "Keep the subtitle service running across reboots with a unit file"
  domain: containers
  frameworks: [ex188-aligned:run-containers]
  difficulty: hard
  estimatedMinutes: 25
  tags: [podman, quadlet, systemd, linger, reboot]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell media@` to work as the unprivileged user `media`)

    The subtitle service image is `registry.copperleaf.example:5443/subtitle-svc:1` (build {{n}}; listens
    on 8080 inside). Podman has no daemon to restart containers when the host boots.

    As `media`, define the service as a **systemd user service** (a Quadlet container unit), so that
    it is running and answering on `http://127.0.0.1:8090/` and has everything a reboot needs (the unit
    file, an `[Install]` section that wants `default.target`, and lingering) so it comes back without
    anyone logging in. The container is named **`subtitle-svc`** and publishes container port 8080 on
    host port **8090**.
  objectives:
    - "Declare a container as a Quadlet unit"
    - "Enable the unit for boot"
    - "Enable lingering so the user's service manager runs without a login"
  params:
    n:
      type: int
      min: 100
      max: 999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.copperleaf.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
        printf 'FROM busybox:1.37\nRUN mkdir /www && echo "subtitle-svc build {{n}}" > /www/index.html\nEXPOSE 8080\nCMD ["httpd", "-f", "-p", "8080", "-h", "/www"]\n' \
          | docker build -q -t "$R:5443/subtitle-svc:1" - >/dev/null
        docker push -q "$R:5443/subtitle-svc:1" >/dev/null
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=media; R=registry.copperleaf.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2301 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        rm -rf /home/$U/.config/containers/systemd
        rm -f /var/lib/systemd/linger/$U
        px podman rm -f subtitle-svc >/dev/null 2>&1 || true
  checks:
    - id: unit-defined
      description: "A Quadlet container unit defines subtitle-svc with port 8090"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 2
      command: |
        d=/home/media/.config/containers/systemd
        f=""
        for c in $d/*.container; do
          [ -f "$c" ] || continue
          if grep -qE '^ContainerName=subtitle-svc$' "$c" || [ "$(basename "$c" .container)" = subtitle-svc ]; then f=$c; break; fi
        done
        [ -n "$f" ] || { echo missing; exit 0; }
        # read the image and port from the container the unit created
        px() { /usr/local/lib/cloudtrain/as-user media "$@"; }
        n=$(basename "$f" .container)
        r=missing
        for i in $(seq 30); do
          name=$(px podman ps -a --filter label=PODMAN_SYSTEMD_UNIT=$n.service --format json 2>/dev/null | jq -r '.[0].Names[0] // empty')
          if [ -n "$name" ]; then
            r=$(px podman inspect "$name" 2>/dev/null | jq -r '.[0] | if (.ImageName == "registry.copperleaf.example:5443/subtitle-svc:1") and ((.HostConfig.PortBindings["8080/tcp"] // []) | map(.HostPort) | index("8090") != null) then "defined" else "missing" end')
            break
          fi
          sleep 2
        done
        echo "$r"
      expect: {match: exact, value: "defined"}
    - id: install-section
      description: "The unit is wanted by default.target"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 2
      command: |
        d=/home/media/.config/containers/systemd
        f=""
        for c in $d/*.container; do
          [ -f "$c" ] || continue
          if grep -qE '^ContainerName=subtitle-svc$' "$c" || [ "$(basename "$c" .container)" = subtitle-svc ]; then f=$c; break; fi
        done
        [ -n "$f" ] && awk '/^\[/{s=$0} s=="[Install]" && /^WantedBy=.*default\.target/{ok=1} END{print ok ? "enabled" : "not-enabled"}' "$f" || echo not-enabled
      expect: {match: exact, value: "enabled"}
    - id: linger
      description: "Lingering is enabled for media"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 2
      command: |
        if [ -e /var/lib/systemd/linger/media ]; then echo yes; else echo no; fi
      expect: {match: exact, value: "yes"}
    - id: service-answers
      description: "The user service is active and answers on 8090"
      type: shell
      timeoutSec: 180
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user media "$@"; }
        d=/home/media/.config/containers/systemd
        f=""
        for c in $d/*.container; do
          [ -f "$c" ] || continue
          if grep -qE '^ContainerName=subtitle-svc$' "$c" || [ "$(basename "$c" .container)" = subtitle-svc ]; then f=$c; break; fi
        done
        [ -n "$f" ] || { echo no-unit; exit 0; }
        n=$(basename "$f" .container)
        r=no-answer
        for i in $(seq 60); do
          if [ "$(px systemctl --user is-active $n.service 2>/dev/null)" = active ]; then
            o=$(curl -s -m 3 http://127.0.0.1:8090/) && [ -n "$o" ] && { r="$o"; break; }
          fi
          sleep 2
        done
        echo "$r"
      expect: {match: exact, value: "subtitle-svc build {{n}}"}
  hints:
    - title: "Where Quadlet files live"
      body: "A rootless user's Quadlet files go in ~/.config/containers/systemd/ with the suffix .container; systemctl --user daemon-reload turns them into <name>.service."
      cost: 1
    - title: "Starting at boot"
      body: "A user service only starts at boot if the unit is wanted by default.target ([Install] WantedBy=default.target) and the user's manager is started at boot, which needs lingering (loginctl enable-linger)."
      cost: 2
    - title: "Check it like the grader"
      body: "systemctl --user is-active subtitle-svc and loginctl show-user media -p Linger show both halves. A restart policy on podman run is not enough: nothing starts it after a reboot."
      cost: 1
  misconceptions:
    - id: no-linger
      description: "Writes and starts a correct unit but never enables lingering."
      feedback: "Without lingering the user's manager stops with the last session and is not started at boot; the service vanishes at the reboot."
      expectFail: [linger]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user media "$@"; }

          D=/home/media/.config/containers/systemd
          install -d -o media -g media /home/media/.config /home/media/.config/containers $D
          cat > $D/subtitle-svc.container <<'EOF'
          [Unit]
          Description=Subtitle service

          [Container]
          Image=registry.copperleaf.example:5443/subtitle-svc:1
          ContainerName=subtitle-svc
          PublishPort=8090:8080

          [Service]
          Restart=always

          [Install]
          WantedBy=default.target
          EOF
          chown media:media $D/subtitle-svc.container
          px systemctl --user daemon-reload
          px systemctl --user start subtitle-svc.service
    - id: no-install
      description: "Enables lingering but leaves out the [Install] section."
      feedback: "Add [Install] WantedBy=default.target so the user manager starts the unit at boot."
      expectFail: [install-section]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user media "$@"; }

          D=/home/media/.config/containers/systemd
          install -d -o media -g media /home/media/.config /home/media/.config/containers $D
          cat > $D/subtitle-svc.container <<'EOF'
          [Unit]
          Description=Subtitle service

          [Container]
          Image=registry.copperleaf.example:5443/subtitle-svc:1
          ContainerName=subtitle-svc
          PublishPort=8090:8080

          [Service]
          Restart=always

          EOF
          chown media:media $D/subtitle-svc.container
          loginctl enable-linger media
          px systemctl --user daemon-reload
          px systemctl --user start subtitle-svc.service
    - id: restart-policy-only
      description: "Runs the container with --restart always and calls it done."
      feedback: "Podman has no daemon: nothing applies a restart policy at boot. Use a unit that systemd starts."
      expectFail: [unit-defined, install-section, linger, service-answers]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user media "$@"; }
          px podman run -d --name subtitle-svc --restart always -p 8090:8080 registry.copperleaf.example:5443/subtitle-svc:1 >/dev/null
  solution:
    explanation: |
      A Quadlet .container file becomes a systemd user service; WantedBy=default.target plus loginctl enable-linger starts it at boot without a login.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u media -H env XDG_RUNTIME_DIR=/run/user/$(id -u media) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u media)/bus "$@"; }
          cd /
          X podman pull registry.copperleaf.example:5443/subtitle-svc:1
          X mkdir -p /home/media/.config/containers/systemd
          X tee /home/media/.config/containers/systemd/subtitle-svc.container >/dev/null <<'EOF'
          [Unit]
          Description=Subtitle service

          [Container]
          Image=registry.copperleaf.example:5443/subtitle-svc:1
          ContainerName=subtitle-svc
          PublishPort=8090:8080

          [Service]
          Restart=always

          [Install]
          WantedBy=default.target
          EOF
          sudo loginctl enable-linger media
          X systemctl --user daemon-reload
          X systemctl --user start subtitle-svc.service
    alternatives:
      - id: other-name
        description: "Name the file subtitles.container; the service name follows the file."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u media -H env XDG_RUNTIME_DIR=/run/user/$(id -u media) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u media)/bus "$@"; }
              cd /
              X podman pull registry.copperleaf.example:5443/subtitle-svc:1
              X mkdir -p /home/media/.config/containers/systemd
              X tee /home/media/.config/containers/systemd/subtitles.container >/dev/null <<'EOF'
              [Unit]
              Description=Subtitle service

              [Container]
              Image=registry.copperleaf.example:5443/subtitle-svc:1
              ContainerName=subtitle-svc
              PublishPort=8090:8080

              [Service]
              Restart=always

              [Install]
              WantedBy=default.target
              EOF
              sudo loginctl enable-linger media
              X systemctl --user daemon-reload
              X systemctl --user start subtitles.service
