apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-sbom-provenance
  title: Publish the subtitle image with SBOM and provenance attestations
  domain: containers
  frameworks: [docker-practitioner:supply-chain]
  difficulty: medium
  estimatedMinutes: 15
  tags: [docker, buildx, sbom, provenance, registry]
  version: 1
spec:
  description: |
    On **`cl-subtitle-03`** (`ssh cl-subtitle-03`) build and push
    **`localhost:5000/subtitle:4.2.0`** from `~/subtitle-build/` so that the registry
    holds, for that digest:

    1. an **SBOM attestation** generated by the builder;
    2. **maximum-detail provenance** (`mode=max`).

    Both attestations must be attached to the pushed image (BuildKit stores them as
    attestation manifests inside the image index). The image must still print
    `subtitle 4.2.0 build {{rel}}` when run.
  objectives:
    - Generate an SBOM attestation at build time
    - Attach maximum-detail build provenance
    - Confirm both attestations are discoverable through the registry
  params:
    rel:
      type: int
      min: 100
      max: 899
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-subtitle-03
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-subtitle-03
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        # offline host: Docker Hub names resolve to loopback, so BuildKit's registry lookup of the SBOM scanner
        # image fails at once and it uses the preloaded copy (each DNS timeout here costs ~40 s per lookup)
        grep -q 'cloudtrain-offline-hub' /etc/hosts || echo '127.0.0.1 registry-1.docker.io auth.docker.io index.docker.io # cloudtrain-offline-hub' >> /etc/hosts
        docker rm -f registry >/dev/null 2>&1 || true
        rm -rf /srv/registry; install -d /srv/registry
        docker run -d --name registry --restart always -p 127.0.0.1:5000:5000 -v /srv/registry:/var/lib/registry registry:3 >/dev/null
        for i in $(seq 30); do curl -fs http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
        s=/home/learner/subtitle-build
        install -d -o learner -g learner "$s"
        printf '%s\n' 'FROM busybox:1.37' 'RUN echo "subtitle 4.2.0 build {{rel}}" > /version' 'CMD ["cat", "/version"]' > "$s/Dockerfile"
        chown -R learner:learner "$s"
  checks:
    - id: pushed
      description: localhost:5000/subtitle:4.2.0 exists in the registry
      type: shell
      timeoutSec: 60
      on: cl-subtitle-03
      skills: [containers.supply-chain.sbom-provenance]
      weight: 1
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
        curl -s -H "$A" -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/subtitle/manifests/4.2.0
      expect: {match: exact, value: "200"}
    - id: sbom-attached
      description: The image index carries an SBOM attestation manifest
      type: shell
      timeoutSec: 60
      on: cl-subtitle-03
      skills: [containers.supply-chain.sbom-provenance]
      weight: 3
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json'
        idx=$(curl -fsS -H "$A" http://127.0.0.1:5000/v2/subtitle/manifests/4.2.0 2>/dev/null) || { echo no-image; exit 0; }
        att=$(echo "$idx" | jq -r '[(.manifests // [])[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest][0] // empty')
        [ -n "$att" ] || { echo no-attestation; exit 0; }
        curl -fsS -H "$A" "http://127.0.0.1:5000/v2/subtitle/manifests/$att" 2>/dev/null \
          | jq -r 'if ([.layers[]? | .annotations["in-toto.io/predicate-type"] // ""] | any(test("spdx"))) then "spdx-sbom" else "no-sbom" end'
      expect: {match: exact, value: spdx-sbom}
    - id: provenance-max
      description: The image carries maximum-detail provenance
      type: shell
      timeoutSec: 60
      on: cl-subtitle-03
      skills: [containers.supply-chain.sbom-provenance]
      weight: 3
      command: |
        docker buildx imagetools inspect --format '{{json .Provenance}}' localhost:5000/subtitle:4.2.0 2>/dev/null \
          | jq -r '(.SLSA.buildConfig // .SLSA.buildDefinition.internalParameters.buildConfig // null) | if . == null then "none" else "max" end'
      expect: {match: exact, value: max}
    - id: image-runs
      description: The pushed image runs and prints this release's version line
      type: shell
      timeoutSec: 60
      on: cl-subtitle-03
      skills: [containers.supply-chain.sbom-provenance]
      weight: 1
      command: docker run --rm localhost:5000/subtitle:4.2.0 2>&1 || echo broken
      expect: {match: exact, value: "subtitle 4.2.0 build {{rel}}"}
  hints:
    - title: Both attestations come from one flag set
      body: "`docker buildx build --sbom=true --provenance=mode=max --push -t ... .` asks the builder for an SBOM and the fullest provenance detail in one build."
      cost: 1
    - title: Checking what landed
      body: "`docker buildx imagetools inspect --format '{{json .SBOM}}' <ref>` and `... .Provenance` read the attestations back from the registry (the space inside the template keeps the lab templater from treating it as a parameter)."
      cost: 1
  misconceptions:
    - id: default-provenance-only
      description: Builds with the default provenance mode instead of mode=max, so detail is missing.
      feedback: "The default provenance mode omits the build configuration; mode=max includes it. Build with --provenance=mode=max."
      expectFail: [provenance-max]
      mutation:
        on: cl-subtitle-03
        as: learner
        run: |
          cd ~/subtitle-build
          docker buildx build --sbom=true --push -t localhost:5000/subtitle:4.2.0 .
    - id: provenance-without-sbom
      description: Asks for provenance but never for an SBOM.
      feedback: "Provenance says how the image was built; it does not list what is inside it. Build with --sbom=true as well."
      expectFail: [sbom-attached]
      mutation:
        on: cl-subtitle-03
        as: learner
        run: |
          cd ~/subtitle-build
          docker buildx build --provenance=mode=max --push -t localhost:5000/subtitle:4.2.0 .
  solution:
    explanation: One build asking for both an SBOM and maximum-detail provenance attaches both as attestations of the pushed digest.
    steps:
      - on: cl-subtitle-03
        as: learner
        run: |
          cd ~/subtitle-build
          docker buildx build --sbom=true --provenance=mode=max --push -t localhost:5000/subtitle:4.2.0 .
    alternatives:
      - id: separate-flags-order
        description: Pass the flags in a different order with --tag instead of -t.
        steps:
          - on: cl-subtitle-03
            as: learner
            run: |
              cd ~/subtitle-build
              docker buildx build --provenance=mode=max --sbom=true --tag localhost:5000/subtitle:4.2.0 --push .
