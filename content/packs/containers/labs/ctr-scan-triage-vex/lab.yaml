apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-scan-triage-vex
  title: Triage vulnerability scanner findings for the catalogue API
  domain: containers
  frameworks: [cks:supply-chain-security, docker-practitioner:supply-chain]
  difficulty: medium
  estimatedMinutes: 20
  tags: [docker, security, scanning, vex, supply-chain]
  version: 1
spec:
  description: |
    On **`cl-catalogue-03`** (`ssh cl-catalogue-03`) `catalogue-api:{{rel}}` is built from
    `~/catalogue-api/Dockerfile` on a base with known fixable vulnerabilities, plus a
    single non-exploitable finding `CVE-2024-{{cve}}` (the vulnerable code path is never
    reached by this service). The offline vulnerability database is mirrored at
    `/srv/scan-db`.

    1. **Scan** `catalogue-api:{{rel}}` with `trivy` against the offline database and
       save the JSON report to `~/scan-before.json`.
    2. **Bump the base image** to the version named in `/srv/scan-db/fixed-base.txt` and
       rebuild, so every **fixable critical** finding is gone.
    3. Write a **VEX document** `~/catalogue-api.vex.json` (OpenVEX) that records
       `CVE-2024-{{cve}}` as **`not_affected`** for this image, with a justification.
    4. **Rescan** with the VEX document applied and save the JSON report to
       `~/scan-after.json`: it must show **zero** critical findings (fixed or
       VEX-justified).
  objectives:
    - Run an offline vulnerability scan and read its JSON report
    - Fix findings by rebuilding on a patched base
    - Record a non-exploitable finding in a VEX document the scanner honours
  params:
    rel:
      type: int
      min: 100
      max: 899
    cve:
      type: int
      min: 10000
      max: 59999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-catalogue-03
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-catalogue-03
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        install -d /srv/scan-db
        echo "python:3.13-alpine" > /srv/scan-db/fixed-base.txt
        s=/home/learner/catalogue-api
        install -d -o learner -g learner "$s"
        printf '%s\n' 'FROM python:3.11-alpine' 'RUN echo "catalogue-api {{rel}}" > /version' 'CMD ["cat", "/version"]' > "$s/Dockerfile"
        chown -R learner:learner "$s"
        docker build -q -t catalogue-api:{{rel}} "$s" >/dev/null
        rm -f /home/learner/scan-before.json /home/learner/scan-after.json /home/learner/catalogue-api.vex.json
  checks:
    - id: scanned-before
      description: scan-before.json is a trivy report for catalogue-api
      type: shell
      timeoutSec: 60
      on: cl-catalogue-03
      skills: [containers.supply-chain.scanning]
      weight: 1.5
      command: jq -r '.ArtifactName // "none"' /home/learner/scan-before.json 2>/dev/null | grep -q 'catalogue-api' && echo ok || echo missing
      expect: {match: exact, value: ok}
    - id: base-fixed
      description: catalogue-api:{{rel}} is rebuilt on the fixed base
      type: shell
      timeoutSec: 60
      on: cl-catalogue-03
      skills: [containers.supply-chain.scanning]
      weight: 2
      command: docker image inspect catalogue-api:{{rel}} 2>/dev/null | jq -r '.[0].Config.Image // .[0].RepoTags[0] // "none"' >/dev/null; docker history --no-trunc catalogue-api:{{rel}} 2>/dev/null | grep -qF "$(cat /srv/scan-db/fixed-base.txt)" && echo fixed || echo stale
      expect: {match: exact, value: fixed}
    - id: vex-recorded
      description: The VEX document records CVE-2024-{{cve}} as not_affected
      type: shell
      timeoutSec: 60
      on: cl-catalogue-03
      skills: [containers.supply-chain.scanning]
      weight: 2
      command: jq -r '.statements[]? | select(.vulnerability.name == "CVE-2024-{{cve}}") | .status' /home/learner/catalogue-api.vex.json 2>/dev/null || echo missing
      expect: {match: exact, value: not_affected}
    - id: clean-after
      description: The post-fix, VEX-applied scan shows zero critical findings
      type: shell
      timeoutSec: 60
      on: cl-catalogue-03
      skills: [containers.supply-chain.scanning]
      weight: 2.5
      command: jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' /home/learner/scan-after.json 2>/dev/null || echo missing
      expect: {match: exact, value: "0"}
  hints:
    - title: Offline database
      body: "Point trivy at the mirrored database directory instead of its default online update: `trivy image --skip-db-update --cache-dir /srv/scan-db ...`."
      cost: 1
    - title: Rebuilding fixes what a VEX statement cannot
      body: "A VEX statement only excuses findings whose vulnerable code path is not reachable; every other fixable critical has to be fixed by moving to a patched base."
      cost: 1
    - title: OpenVEX shape
      body: "A minimal OpenVEX document has `@context`, `@id`, `author`, `timestamp` and a `statements` array; each statement names a `vulnerability`, the affected `products` and a `status` (`not_affected` needs a `justification`)."
      cost: 1
  misconceptions:
    - id: vex-instead-of-fix
      description: Writes a VEX statement for every finding instead of fixing the fixable ones.
      feedback: "A VEX statement says a finding does not apply; it is not a substitute for patching a vulnerability that is genuinely fixable by rebuilding on a newer base."
      expectFail: [base-fixed]
      mutation:
        on: cl-catalogue-03
        as: learner
        run: |
          jq -n --arg c "CVE-2024-{{cve}}" '{"@context": "https://openvex.dev/ns/v0.2.0", "@id": "urn:catalogue-api", "author": "copperleaf", "timestamp": "2026-01-01T00:00:00Z", "statements": [{"vulnerability": {"name": $c}, "products": [{"@id": "catalogue-api:{{rel}}"}], "status": "not_affected", "justification": "vulnerable_code_not_in_execute_path"}]}' > ~/catalogue-api.vex.json
    - id: no-vex-for-non-exploitable
      description: Fixes the fixable findings but never excuses the one genuinely non-exploitable finding, so it still shows up as a failure.
      feedback: "A fixable critical should be patched; a non-exploitable one with no fix available should be recorded in a VEX document instead, or the rescan will keep flagging it with nothing you can rebuild away."
      expectFail: [vex-recorded]
      mutation:
        on: cl-catalogue-03
        as: learner
        run: |
          cd ~/catalogue-api
          sed -i 's/^FROM .*/FROM python:3.13-alpine/' Dockerfile
          docker build -q -t catalogue-api:{{rel}} .
  solution:
    explanation: |
      Scan first to see the baseline, rebuild on the patched base to remove every fixable
      critical, record the one non-exploitable finding in an OpenVEX document, then
      rescan with the VEX applied to confirm a clean result.
    steps:
      - on: cl-catalogue-03
        as: learner
        run: |
          trivy image --skip-db-update --cache-dir /srv/scan-db --format json -o ~/scan-before.json catalogue-api:{{rel}}
          cd ~/catalogue-api
          sed -i "s/^FROM .*/FROM $(cat /srv/scan-db/fixed-base.txt)/" Dockerfile
          docker build -q -t catalogue-api:{{rel}} .
          jq -n --arg c "CVE-2024-{{cve}}" '{"@context": "https://openvex.dev/ns/v0.2.0", "@id": "urn:catalogue-api", "author": "copperleaf-security", "timestamp": "2026-01-01T00:00:00Z",
            "statements": [{"vulnerability": {"name": $c}, "products": [{"@id": "catalogue-api:{{rel}}"}], "status": "not_affected", "justification": "vulnerable_code_not_in_execute_path"}]}' > ~/catalogue-api.vex.json
          trivy image --skip-db-update --cache-dir /srv/scan-db --vex ~/catalogue-api.vex.json --format json -o ~/scan-after.json catalogue-api:{{rel}}
    alternatives:
      - id: ignore-file
        description: Use trivyignore with VEX-equivalent CVE filtering for teams that prefer that workflow.
        steps:
          - on: cl-catalogue-03
            as: learner
            run: |
              trivy image --skip-db-update --cache-dir /srv/scan-db --format json -o ~/scan-before.json catalogue-api:{{rel}}
              cd ~/catalogue-api
              sed -i "s/^FROM .*/FROM $(cat /srv/scan-db/fixed-base.txt)/" Dockerfile
              docker build -q -t catalogue-api:{{rel}} .
              jq -n --arg c "CVE-2024-{{cve}}" '{"@context": "https://openvex.dev/ns/v0.2.0", "@id": "urn:catalogue-api", "author": "copperleaf-security", "timestamp": "2026-01-01T00:00:00Z",
                "statements": [{"vulnerability": {"name": $c}, "products": [{"@id": "catalogue-api:{{rel}}"}], "status": "not_affected", "justification": "vulnerable_code_not_in_execute_path"}]}' > ~/catalogue-api.vex.json
              trivy image --skip-db-update --cache-dir /srv/scan-db --vex ~/catalogue-api.vex.json --format json -o ~/scan-after.json catalogue-api:{{rel}}
