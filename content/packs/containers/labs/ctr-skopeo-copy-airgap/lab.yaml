apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: ctr-skopeo-copy-airgap
  title: Ship the playout image set to the air-gapped studio registry
  domain: containers
  frameworks: [ex188-aligned:manage-images, docker-practitioner:registry]
  difficulty: medium
  estimatedMinutes: 15
  tags: [docker, registry, skopeo, air-gap, digest]
  version: 1
spec:
  description: |
    On **`cl-transfer-01`** (`ssh cl-transfer-01`; you are in the `docker` group) two
    registries run. The **build registry** is `127.0.0.1:5000`, with the four playout
    images `playout/encoder:3`, `playout/mux:3`, `playout/graphics:3` and `playout/epg:3`
    (release {{rev}}). The **studio registry** is `127.0.0.1:{{sport}}` and is empty. In
    production the studio side cannot see the build side: the images travel as an
    archive on the transfer share `/srv/transfer` (owned by you).

    1. Export the four images from the build registry into `/srv/transfer` (an archive
       or an image layout; keep **all platforms** of the multi-platform images).
    2. Import them from `/srv/transfer` into the studio registry under the same names
       and tags.
    3. Every image in the studio registry must have **exactly the digest** it has in the
       build registry.

    Both registries are plain HTTP; `skopeo` is installed.
  objectives:
    - Copy images between registries and archives without a container engine
    - Preserve digests and all platforms of an index when copying
  params:
    rev:
      type: int
      min: 100
      max: 899
    sport:
      type: int
      min: 5101
      max: 5199
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-transfer-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-transfer-01
      timeoutSec: 480
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        docker rm -f build-registry studio-registry >/dev/null 2>&1 || true
        rm -rf /srv/transfer /srv/build-registry /srv/studio-registry; install -d /var/lib/cloudtrain /srv/build-registry /srv/studio-registry
        install -d -o learner -g learner /srv/transfer
        docker run -d --name build-registry --restart always -p 127.0.0.1:5000:5000 -v /srv/build-registry:/var/lib/registry registry:3 >/dev/null
        docker run -d --name studio-registry --restart always -p 127.0.0.1:{{sport}}:5000 -v /srv/studio-registry:/var/lib/registry registry:3 >/dev/null
        for p in 5000 {{sport}}; do for i in $(seq 30); do curl -fs http://127.0.0.1:$p/v2/ >/dev/null && break; sleep 1; done; done
        d=$(mktemp -d)
        for n in encoder mux; do
          printf '%s\n' 'FROM busybox:1.37' "RUN echo 'playout-$n 3 release {{rev}}' > /release" 'CMD ["cat", "/release"]' > "$d/Dockerfile"
          docker build -q --provenance=false --sbom=false -t "localhost:5000/playout/$n:3" "$d" >/dev/null
          docker push -q "localhost:5000/playout/$n:3" >/dev/null
          docker rmi "localhost:5000/playout/$n:3" >/dev/null
        done
        for n in graphics epg; do
          echo "playout-$n 3 release {{rev}} amd64" > "$d/pack-amd64"; echo "playout-$n 3 release {{rev}} arm64" > "$d/pack-arm64"
          printf '%s\n' 'FROM scratch' 'ARG TARGETARCH' 'COPY pack-${TARGETARCH} /pack' > "$d/Dockerfile"
          docker buildx build --provenance=false --sbom=false --platform linux/amd64,linux/arm64 -t "localhost:5000/playout/$n:3" --push "$d" >/dev/null
        done
        rm -rf "$d"
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        : > /var/lib/cloudtrain/source.digests
        for n in encoder mux graphics epg; do
          echo "$n $(curl -fsSI -H "$A" http://127.0.0.1:5000/v2/playout/$n/manifests/3 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')" >> /var/lib/cloudtrain/source.digests
        done
        grep -c 'sha256:' /var/lib/cloudtrain/source.digests | grep -qx 4
  checks:
    - id: digests-identical
      description: All four images exist in the studio registry with the build registry's digests
      type: shell
      timeoutSec: 90
      on: cl-transfer-01
      skills: [containers.registry.portability]
      weight: 4
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        ok=0; while read -r n d; do
          s=$(curl -sI -H "$A" http://127.0.0.1:{{sport}}/v2/playout/$n/manifests/3 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          [ "$s" = "$d" ] && ok=$((ok + 1)); done < /var/lib/cloudtrain/source.digests; echo "same=$ok"
      expect: {match: exact, value: "same=4"}
    - id: platforms-kept
      description: The two multi-platform images still list both platforms in the studio registry
      type: shell
      timeoutSec: 60
      on: cl-transfer-01
      skills: [containers.registry.portability]
      weight: 2
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
        for n in graphics epg; do curl -s -H "$A" http://127.0.0.1:{{sport}}/v2/playout/$n/manifests/3 | jq -r '[.manifests[]?.platform.architecture] | sort | join("+")'; done | paste -sd' ' -
      expect: {match: exact, value: "amd64+arm64 amd64+arm64"}
    - id: via-archive
      description: /srv/transfer holds the exported images (archive or layout), and the build registry still has its own copy
      type: shell
      timeoutSec: 60
      on: cl-transfer-01
      skills: [containers.registry.portability]
      weight: 2
      command: |
        f=$(find /srv/transfer -type f | wc -l); sz=$(du -sk /srv/transfer | cut -f1)
        b=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.oci.image.index.v1+json' http://127.0.0.1:5000/v2/playout/epg/manifests/3)
        if [ "$f" -ge 4 ] && [ "$sz" -ge 4 ] && [ "$b" = 200 ]; then echo archived; else echo "files=$f kb=$sz build=$b"; fi
      expect: {match: exact, value: archived}
    - id: runnable
      description: The encoder image runs from the studio registry
      type: shell
      timeoutSec: 90
      on: cl-transfer-01
      skills: [containers.registry.portability]
      weight: 1
      command: docker run --rm --pull always 127.0.0.1:{{sport}}/playout/encoder:3 2>/dev/null || echo broken
      expect: {match: exact, value: "playout-encoder 3 release {{rev}}"}
  hints:
    - title: One tool, three transports
      body: "`skopeo copy` reads and writes `docker://` registries, `oci:` layouts, `dir:` directories and `oci-archive:` tar files. Copy registry to archive first, then archive to registry."
      cost: 1
    - title: Index images need --all
      body: "Without `--all`, skopeo copies only the platform of this host and the destination gets a different manifest (a different digest). Add `--all`, and `--preserve-digests` so nothing is rewritten."
      cost: 2
    - title: Plain HTTP registries
      body: "Both registries speak plain HTTP: add `--src-tls-verify=false` or `--dest-tls-verify=false` on the sides that use them."
      cost: 1
  misconceptions:
    - id: single-platform-copy
      description: Copies without --all, so the multi-platform images lose their index and change digest.
      feedback: "Without --all skopeo copies one platform and stores a single manifest. The digest differs and arm64 is gone. Use --all so the whole index and every platform manifest move."
      expectFail: [digests-identical, platforms-kept]
      mutation:
        on: cl-transfer-01
        as: learner
        run: |
          for n in encoder mux graphics epg; do
            skopeo copy --src-tls-verify=false "docker://127.0.0.1:5000/playout/$n:3" "oci-archive:/srv/transfer/$n.tar:playout/$n:3"
            skopeo copy --dest-tls-verify=false "oci-archive:/srv/transfer/$n.tar:playout/$n:3" "docker://127.0.0.1:{{sport}}/playout/$n:3"
          done
    - id: direct-copy
      description: Copies registry to registry directly and never uses the transfer share.
      feedback: "The studio registry is not reachable from the build side in production. The images have to travel as an archive or layout on /srv/transfer, then be imported."
      expectFail: [via-archive]
      mutation:
        on: cl-transfer-01
        as: learner
        run: |
          for n in encoder mux graphics epg; do
            skopeo copy --all --preserve-digests --src-tls-verify=false --dest-tls-verify=false "docker://127.0.0.1:5000/playout/$n:3" "docker://127.0.0.1:{{sport}}/playout/$n:3"
          done
  solution:
    explanation: |
      `skopeo copy --all` moves a whole index with every platform; exporting to an
      `oci-archive:` file on the transfer share and importing from it keeps the manifests
      byte for byte, so the digests do not change.
    steps:
      - on: cl-transfer-01
        as: learner
        run: |
          for n in encoder mux graphics epg; do
            skopeo copy --all --preserve-digests --src-tls-verify=false "docker://127.0.0.1:5000/playout/$n:3" "oci-archive:/srv/transfer/$n.tar:playout/$n:3"
          done
          for n in encoder mux graphics epg; do
            skopeo copy --all --preserve-digests --dest-tls-verify=false "oci-archive:/srv/transfer/$n.tar:playout/$n:3" "docker://127.0.0.1:{{sport}}/playout/$n:3"
          done
    alternatives:
      - id: oci-layout
        description: Use one OCI image layout directory as the transfer medium.
        steps:
          - on: cl-transfer-01
            as: learner
            run: |
              for n in encoder mux graphics epg; do
                skopeo copy --all --preserve-digests --src-tls-verify=false "docker://127.0.0.1:5000/playout/$n:3" "oci:/srv/transfer/playout:$n-3"
              done
              for n in encoder mux graphics epg; do
                skopeo copy --all --preserve-digests --dest-tls-verify=false "oci:/srv/transfer/playout:$n-3" "docker://127.0.0.1:{{sport}}/playout/$n:3"
              done
