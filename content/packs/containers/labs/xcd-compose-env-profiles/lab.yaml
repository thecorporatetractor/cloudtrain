apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xcd-compose-env-profiles
  title: Drive a stack from an env file with an optional profile
  domain: containers
  frameworks: [docker-practitioner:compose]
  difficulty: medium
  estimatedMinutes: 10
  tags: [exam, docker, compose, env-file, profiles]
  version: 1
spec:
  description: |
    **Host:** `cl-docker-01` (`ssh cl-docker-01`)

    `~/exam/staging/compose.yaml` (project name `staging`) hard-codes the site image tag
    and port. The values for staging live in `~/exam/staging/.env.staging`
    (`SITE_TAG`, `SITE_PORT`). Change the Compose file so that:

    - service **`web`** uses the image **`copperleaf/site:${SITE_TAG}`** and publishes
      container port 80 on the host port **`${SITE_PORT}`**, with the restart policy
      `unless-stopped`;
    - service **`dbadmin`** starts **only when the `debug` profile is enabled**;
    - the values come from the env file: with `--env-file .env.staging` the stack
      uses the tag and port in that file, and a variable set in the environment overrides it.

    Bring the stack up with `docker compose --env-file .env.staging up -d`, **without**
    the debug profile.
  objectives:
    - Interpolate image tag and port from an env file
    - Gate an optional service behind a profile
  params:
    port:
      type: int
      min: 8300
      max: 8399
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-docker-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-docker-01
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        docker ps -aq --filter label=com.docker.compose.project=staging | xargs -r docker rm -f >/dev/null
        for v in 1.0 1.4; do
          d=$(mktemp -d); mkdir "$d/www"; echo "site $v" > "$d/www/index.html"
          printf '%s\n' 'FROM busybox:1.37' 'COPY www /www' 'CMD ["httpd", "-f", "-p", "80", "-h", "/www"]' > "$d/Dockerfile"
          docker build -q -t "copperleaf/site:$v" "$d" >/dev/null; rm -rf "$d"
        done
        d=$(mktemp -d); mkdir "$d/www"; echo "dbadmin" > "$d/www/index.html"
        printf '%s\n' 'FROM busybox:1.37' 'COPY www /www' 'CMD ["httpd", "-f", "-p", "80", "-h", "/www"]' > "$d/Dockerfile"
        docker build -q -t copperleaf/dbadmin:1 "$d" >/dev/null; rm -rf "$d"
        s=/home/learner/exam/staging
        rm -rf "$s"; install -d -o learner -g learner /home/learner/exam "$s"
        printf '%s\n' 'SITE_TAG=1.4' 'SITE_PORT={{port}}' > "$s/.env.staging"
        cat > "$s/compose.yaml" <<'YML2'
        name: staging
        services:
          web:
            image: copperleaf/site:1.0
            ports:
              - "8250:80"
          dbadmin:
            image: copperleaf/dbadmin:1
        YML2
        chown -R learner:learner "$s"
  checks:
    - id: interpolated
      description: The file values reach the config, and variables in the environment override them
      type: shell
      timeoutSec: 60
      on: cl-docker-01
      skills: [containers.compose.interpolation]
      weight: 3
      command: |
        cd /home/learner/exam/staging
        f='[.services.web.image, (.services.web.ports[0].published | tostring)] | join(" ")'
        a=$(docker compose --env-file .env.staging config --format json 2>/dev/null | jq -r "$f" 2>/dev/null)
        b=$(SITE_TAG=9.9 SITE_PORT=9999 docker compose --env-file .env.staging config --format json 2>/dev/null | jq -r "$f" 2>/dev/null)
        echo "$a / $b"
      expect: {match: exact, value: "copperleaf/site:1.4 {{port}} / copperleaf/site:9.9 9999"}
    - id: profile-gated
      description: dbadmin is part of the project only with the debug profile
      type: shell
      timeoutSec: 60
      on: cl-docker-01
      skills: [containers.compose.overrides]
      weight: 2.5
      command: |
        cd /home/learner/exam/staging
        a=$(docker compose --env-file .env.staging config --services 2>/dev/null | sort | tr '\n' ',')
        b=$(docker compose --env-file .env.staging --profile debug config --services 2>/dev/null | sort | tr '\n' ',')
        echo "$a / $b"
      expect: {match: exact, value: "web, / dbadmin,web,"}
    - id: stack-running
      description: web answers on the staging port with the staging tag and dbadmin is not running
      type: shell
      timeoutSec: 60
      on: cl-docker-01
      skills: [containers.compose.interpolation, containers.compose.overrides]
      weight: 2
      command: |
        r=$(curl -fsS --max-time 3 http://127.0.0.1:{{port}}/ 2>/dev/null || echo down)
        n=$(docker ps -q --filter label=com.docker.compose.project=staging --filter label=com.docker.compose.service=dbadmin | wc -l)
        echo "$r dbadmin=$n"
      expect: {match: exact, value: "site 1.4 dbadmin=0"}
    - id: web-restarts
      description: The web container restarts on its own after a host reboot
      type: shell
      timeoutSec: 60
      on: cl-docker-01
      skills: [containers.operations.restart-health]
      weight: 1
      command: |
        c=$(docker ps -q --filter label=com.docker.compose.project=staging --filter label=com.docker.compose.service=web | head -1)
        docker inspect "$c" 2>/dev/null | jq -r 'if (.[0].HostConfig.RestartPolicy.Name | IN("always", "unless-stopped")) then "restarts" else "stays-down" end'
      expect: {match: exact, value: restarts}
  misconceptions:
    - id: hardcoded-values
      description: Copies the values from the env file into the Compose file.
      feedback: "The file works today, but the tag and port no longer come from the environment. Use ${SITE_TAG} and ${SITE_PORT} in the Compose file."
      expectFail: [interpolated]
      mutation:
        on: cl-docker-01
        as: learner
        run: |
          cd ~/exam/staging
          printf '%s\n' 'name: staging' 'services:' '  web:' '    image: copperleaf/site:1.4' '    restart: unless-stopped' '    ports:' '      - "{{port}}:80"' \
            '  dbadmin:' '    image: copperleaf/dbadmin:1' '    profiles: [debug]' > compose.yaml
          docker compose up -d
    - id: dbadmin-always
      description: Leaves dbadmin outside any profile.
      feedback: "A service without profiles is always part of the project. Add profiles: [debug] so it starts only on request."
      expectFail: [profile-gated, stack-running]
      mutation:
        on: cl-docker-01
        as: learner
        run: |
          cd ~/exam/staging
          printf '%s\n' 'name: staging' 'services:' '  web:' '    image: copperleaf/site:${SITE_TAG}' '    restart: unless-stopped' '    ports:' '      - "${SITE_PORT}:80"' \
            '  dbadmin:' '    image: copperleaf/dbadmin:1' > compose.yaml
          docker compose --env-file .env.staging up -d
    - id: debug-left-running
      description: Defines the profile but brings the stack up with the debug profile enabled.
      feedback: "The task asks for the stack without the debug profile. Start it without --profile debug, and remove the dbadmin container that is running."
      expectFail: [stack-running]
      mutation:
        on: cl-docker-01
        as: learner
        run: |
          cd ~/exam/staging
          printf '%s\n' 'name: staging' 'services:' '  web:' '    image: copperleaf/site:${SITE_TAG}' '    restart: unless-stopped' '    ports:' '      - "${SITE_PORT}:80"' \
            '  dbadmin:' '    image: copperleaf/dbadmin:1' '    profiles: [debug]' > compose.yaml
          docker compose --env-file .env.staging --profile debug up -d
  solution:
    explanation: |
      Interpolation reads the env file given with `--env-file`; `profiles: [debug]` keeps a
      service out of the default project. Bring the stack up without the profile.
    steps:
      - on: cl-docker-01
        as: learner
        run: |
          cd ~/exam/staging
          cat > compose.yaml <<'YML2'
          name: staging
          services:
            web:
              image: copperleaf/site:${SITE_TAG}
              restart: unless-stopped
              ports:
                - "${SITE_PORT}:80"
            dbadmin:
              image: copperleaf/dbadmin:1
              profiles: [debug]
          YML2
          docker compose --env-file .env.staging up -d --remove-orphans
    alternatives:
      - id: dotenv-link
        description: Link the env file as .env so plain compose commands pick it up.
        steps:
          - on: cl-docker-01
            as: learner
            run: |
              cd ~/exam/staging
              ln -sf .env.staging .env
              cat > compose.yaml <<'YML2'
              name: staging
              services:
                web:
                  image: "copperleaf/site:${SITE_TAG:?set SITE_TAG}"
                  restart: unless-stopped
                  ports:
                    - target: 80
                      published: "${SITE_PORT}"
                dbadmin:
                  image: copperleaf/dbadmin:1
                  profiles: ["debug"]
              YML2
              docker compose up -d --remove-orphans
