apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xcd-registry-multiarch-index
  title: Publish a two-platform image index
  domain: containers
  frameworks: [docker-practitioner:registry]
  difficulty: hard
  estimatedMinutes: 12
  tags: [exam, docker, buildx, multi-platform, registry]
  version: 1
spec:
  description: |
    **Host:** `cl-docker-01` (`ssh cl-docker-01`)

    `~/exam/multiarch/` holds the prebuilt tool bundles `tools-amd64` and `tools-arm64`
    and a Dockerfile that only knows the first. The edge registry listens on
    **`localhost:5101`** (plain HTTP, no login).

    Build and push **`localhost:5101/tools:1.4`** for **`linux/amd64` and `linux/arm64`**
    as **one index**, so that each platform's image carries the bundle for its own
    architecture. Nothing needs to run during the build, so no emulation is needed.
    Attestation manifests in the index are not platforms.
  objectives:
    - Select per-platform files with TARGETARCH
    - Push one multi-platform index to a registry
  params:
    rel:
      type: int
      min: 100
      max: 999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-docker-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: cl-docker-01
      timeoutSec: 300
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        r=/srv/exam/multiarch-index/registry
        mkdir -p "$r"
        docker rm -f xcd-multiarch-registry >/dev/null 2>&1 || true
        docker run -d --name xcd-multiarch-registry --restart always -p 127.0.0.1:5101:5000 -v "$r:/var/lib/registry" registry:3 >/dev/null
        for i in $(seq 30); do curl -fs http://127.0.0.1:5101/v2/ >/dev/null && break; sleep 1; done
        s=/home/learner/exam/multiarch
        rm -rf "$s"; install -d -o learner -g learner /home/learner/exam "$s"
        printf '%s\n' 'tools 1.4 build {{rel}} amd64' > "$s/tools-amd64"
        printf '%s\n' 'tools 1.4 build {{rel}} arm64' > "$s/tools-arm64"
        printf '%s\n' 'FROM scratch' 'COPY tools-amd64 /tools' 'ENTRYPOINT ["/tools"]' > "$s/Dockerfile"
        chown -R learner:learner "$s"
        # start from an empty repository
        rm -rf "$r/docker/registry/v2/repositories/tools"
  checks:
    - id: two-platform-index
      description: localhost:5101/tools:1.4 is an index with exactly linux/amd64 and linux/arm64, each with its own manifest digest
      type: shell
      timeoutSec: 60
      on: cl-docker-01
      skills: [containers.buildkit.multi-platform]
      weight: 3
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
        curl -fsS -H "$A" http://127.0.0.1:5101/v2/tools/manifests/1.4 2>/dev/null \
          | jq -r '[(.manifests // [])[] | select((.platform.os // "unknown") != "unknown")] | (map(.platform.os + "/" + .platform.architecture) | sort | join(",")) + " distinct=" + (map(.digest) | unique | length | tostring)' 2>/dev/null || echo none
      expect: {match: exact, value: "linux/amd64,linux/arm64 distinct=2"}
    - id: platform-content
      description: Each platform's image carries the bundle for its own architecture
      type: shell
      timeoutSec: 120
      on: cl-docker-01
      skills: [containers.buildkit.multi-platform, containers.registry.references]
      weight: 3
      command: |
        out=""
        for a in amd64 arm64; do
          d=$(mktemp -d)
          if skopeo copy -q --override-os linux --override-arch "$a" --src-tls-verify=false docker://localhost:5101/tools:1.4 "dir:$d" >/dev/null 2>&1; then
            c=""
            for h in $(jq -r '.layers[].digest | sub("sha256:"; "")' "$d/manifest.json"); do
              x=$(zcat -f "$d/$h" 2>/dev/null | tar -xO --wildcards '*tools' 2>/dev/null)
              [ -n "$x" ] && c="$x"
            done
            out="$out $a=${c:-empty}"
          else
            out="$out $a=pull-failed"
          fi
          rm -rf "$d"
        done
        echo "${out# }"
      expect: {match: exact, value: "amd64=tools 1.4 build {{rel}} amd64 arm64=tools 1.4 build {{rel}} arm64"}
  misconceptions:
    - id: single-platform
      description: Pushes only the host platform.
      feedback: "Without --platform the build targets one architecture and the registry gets a single image. Name both platforms in one build."
      expectFail: [two-platform-index, platform-content]
      mutation:
        on: cl-docker-01
        as: learner
        run: |
          cd ~/exam/multiarch
          docker buildx build -t localhost:5101/tools:1.4 --push .
    - id: same-bundle
      description: Builds both platforms from the amd64 bundle.
      feedback: "The index is right, but the arm64 image carries the amd64 bundle. Pick the file with TARGETARCH."
      expectFail: [platform-content]
      mutation:
        on: cl-docker-01
        as: learner
        run: |
          cd ~/exam/multiarch
          docker buildx build --platform linux/amd64,linux/arm64 -t localhost:5101/tools:1.4 --push .
  solution:
    explanation: |
      `ARG TARGETARCH` after `FROM` is set per platform by BuildKit; `COPY tools-${TARGETARCH}`
      picks the matching file, and one `buildx build --platform ... --push` publishes an
      index with both images.
    steps:
      - on: cl-docker-01
        as: learner
        run: |
          cd ~/exam/multiarch
          printf '%s\n' 'FROM scratch' 'ARG TARGETARCH' 'COPY tools-${TARGETARCH} /tools' 'ENTRYPOINT ["/tools"]' > Dockerfile
          docker buildx build --platform linux/amd64,linux/arm64 -t localhost:5101/tools:1.4 --push .
    alternatives:
      - id: no-attestations
        description: Build without attestations so the index lists only the two platforms.
        steps:
          - on: cl-docker-01
            as: learner
            run: |
              cd ~/exam/multiarch
              printf '%s\n' 'FROM scratch' 'ARG TARGETARCH' 'COPY tools-${TARGETARCH} /tools' 'ENTRYPOINT ["/tools"]' > Dockerfile
              docker buildx build --provenance=false --sbom=false --platform linux/amd64,linux/arm64 -t localhost:5101/tools:1.4 --push .
