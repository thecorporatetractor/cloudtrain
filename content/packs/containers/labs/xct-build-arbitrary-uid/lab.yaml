apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-build-arbitrary-uid
  title: "Build an image that works under any assigned UID"
  domain: containers
  frameworks: [ex188-aligned:build-images]
  difficulty: hard
  estimatedMinutes: 12
  tags: [exam, podman, build, non-root, uid]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    A platform that runs images under a random UID (with group 0) starts **`localhost/queue-worker:3`** as
    `--user {{uid}}:0`, and the worker cannot write its data directory. The image is built from
    `~/exam/xct-build-uid/Containerfile`.

    Fix the Containerfile and rebuild `localhost/queue-worker:3` (as `examuser`) so that:

    - `/var/lib/queue` is owned by **group 0** and **group-writable**, so any UID in group 0 can write;
    - the image still defaults to a **non-root** user;
    - `podman run --rm --user {{uid}}:0 localhost/queue-worker:3` starts and prints a line beginning `queue-worker ok`.
  objectives:
    - "Make a data directory usable under an arbitrary UID"
    - "Keep the image non-root by default"
  params:
    uid:
      type: int
      min: 20000
      max: 60000
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-build-uid
        install -d -o $U -g $U /home/$U/exam $D
        printf '%s\n' '#!/bin/sh' 'echo "job" >> /var/lib/queue/jobs.log && echo "queue-worker ok uid=$(id -u) gid=$(id -g)"' > $D/worker.sh
        printf '%s\n' 'FROM registry.exam.example:5443/library/alpine:3.22' 'COPY worker.sh /usr/local/bin/worker' \
          'RUN chmod 0755 /usr/local/bin/worker && mkdir -p /var/lib/queue' 'USER 1001' 'ENTRYPOINT ["/usr/local/bin/worker"]' > $D/Containerfile
        chown $U:$U $D/worker.sh $D/Containerfile
        px podman build -q -t localhost/queue-worker:3 $D >/dev/null
  checks:
    - id: arbitrary-uid
      description: "The worker starts and writes under an arbitrary UID in group 0"
      type: shell
      timeoutSec: 120
      on: cl-podman-01
      skills: [containers.build.non-root]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman run --rm --user {{uid}}:0 localhost/queue-worker:3 2>&1 | tail -1
      expect: {match: exact, value: "queue-worker ok uid={{uid}} gid=0"}
    - id: group-writable
      description: "/var/lib/queue is group 0 and group-writable in the image"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.build.non-root]
      weight: 1.5
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        o=$(px podman run --rm --user 0 --entrypoint stat localhost/queue-worker:3 -c '%g %a' /var/lib/queue 2>/dev/null) || o=""
        set -- $o
        if [ "${1:-x}" = 0 ] && [ -n "${2:-}" ] && [ $(( (0$2 >> 3) & 7 )) -eq 7 ]; then echo group0-writable; else echo "no:$o"; fi
      expect: {match: exact, value: "group0-writable"}
    - id: non-root-default
      description: "The image's default user is not root"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.build.non-root]
      weight: 1.5
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        u=$(px podman image inspect localhost/queue-worker:3 2>/dev/null | jq -r '.[0].Config.User // ""')
        if [ -n "$u" ] && [ "$u" != 0 ] && [ "$u" != root ] && [ "${u%%:*}" != 0 ]; then echo non-root; else echo "root:$u"; fi
      expect: {match: exact, value: "non-root"}
  misconceptions:
    - id: owner-only
      description: "Chowns the directory to UID 1001 only."
      feedback: "An arbitrary UID is not 1001; it is only guaranteed to be in group 0. Give group 0 the same permissions as the owner (chgrp 0, chmod g=u)."
      expectFail: [arbitrary-uid, group-writable]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          D=/home/examuser/exam/xct-build-uid
          sed -i 's|^RUN chmod .*|RUN chmod 0755 /usr/local/bin/worker \&\& mkdir -p /var/lib/queue \&\& chown -R 1001:1001 /var/lib/queue|' $D/Containerfile
          px podman build -q -t localhost/queue-worker:3 $D >/dev/null
    - id: run-as-root
      description: "Switches the image to root so the write works."
      feedback: "Running as root defeats the point: the platform assigns the UID, and a root image would also be refused. Keep a non-root USER and fix the directory permissions instead."
      expectFail: [non-root-default]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          D=/home/examuser/exam/xct-build-uid
          sed -i 's|^RUN chmod .*|RUN chmod 0755 /usr/local/bin/worker \&\& mkdir -p /var/lib/queue \&\& chgrp -R 0 /var/lib/queue \&\& chmod -R g=u /var/lib/queue|; s|^USER .*|USER 0|' $D/Containerfile
          px podman build -q -t localhost/queue-worker:3 $D >/dev/null
  solution:
    explanation: |
      OpenShift-style images make the data directory group 0 with group permissions equal to the owner's (chgrp -R 0, chmod -R g=u), so any UID that runs in group 0 can write.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X sh -c 'cd ~/exam/xct-build-uid && sed -i "s|^RUN chmod .*|RUN chmod 0755 /usr/local/bin/worker \&\& mkdir -p /var/lib/queue \&\& chgrp -R 0 /var/lib/queue \&\& chmod -R g=u /var/lib/queue|" Containerfile && podman build -q -t localhost/queue-worker:3 .'
    alternatives:
      - id: install-d
        description: "Create the directory with install -d, group 0, mode 0775."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X sh -c 'cd ~/exam/xct-build-uid && sed -i "s|^RUN chmod .*|RUN chmod 0755 /usr/local/bin/worker \&\& install -d -g 0 -m 0775 /var/lib/queue|" Containerfile && podman build -q -t localhost/queue-worker:3 .'
