apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-build-volume-selinux
  title: "Serve host content through an image-declared volume"
  domain: containers
  frameworks: [ex188-aligned:build-images]
  difficulty: medium
  estimatedMinutes: 12
  tags: [exam, podman, build, volume, selinux]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    The site content is in `~/exam/xct-build-volume/www` (owned by `examuser`, page revision {{rev}}).
    SELinux is enforcing and must stay enforcing.

    As `examuser`:

    1. Build **`localhost/static-web`** from `registry.exam.example:5443/library/busybox:1.37`, with
       `/srv/www` **declared as a volume**, serving that directory on port 8080 with
       `httpd -f -p 8080 -h /srv/www`.
    2. Run it as the container **`static-web`**, with the host directory `~/exam/xct-build-volume/www`
       mounted at `/srv/www` **with the correct SELinux label**, publishing host port **8081**, so
       `http://127.0.0.1:8081/index.html` serves the page.
  objectives:
    - "Declare a volume in an image"
    - "Mount host content into a rootless container with the right SELinux label"
  params:
    rev:
      type: int
      min: 100
      max: 999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-build-volume
        install -d -o $U -g $U /home/$U/exam $D
        mkdir -p $D/www
        echo "static site rev {{rev}}" > $D/www/index.html
        chown -R $U:$U $D
        pull library/busybox:1.37
        px podman rm -f static-web >/dev/null 2>&1 || true
  checks:
    - id: volume-declared
      description: "The image declares /srv/www as a volume"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.build.dockerfile]
      weight: 1.5
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman image inspect localhost/static-web:latest 2>/dev/null | jq -r '(.[0].Config.Volumes // {}) | keys | join(",")' || true
      expect: {match: exact, value: "/srv/www"}
    - id: mounted-from-host
      description: "Container static-web mounts the host www directory at /srv/www"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.storage.permissions]
      weight: 1
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman inspect static-web 2>/dev/null | jq -r '[.[0].Mounts[]? | select(.Destination == "/srv/www") | .Source] | .[0] // "none"' || echo none
      expect: {match: exact, value: "/home/examuser/exam/xct-build-volume/www"}
    - id: serving
      description: "Port 8081 serves the page from the mounted directory"
      type: shell
      timeoutSec: 120
      on: cl-podman-01
      skills: [containers.storage.permissions, containers.build.dockerfile]
      weight: 2
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman start static-web >/dev/null 2>&1 || true
        r=no-answer
        for i in $(seq 20); do o=$(curl -s -m 3 http://127.0.0.1:8081/index.html) && [ -n "$o" ] && { r=$o; break; }; sleep 1; done
        echo "$r"
      expect: {match: exact, value: "static site rev {{rev}}"}
    - id: labelled
      description: "The host directory and page carry the container file label"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.storage.permissions]
      weight: 1.5
      command: |
        D=/home/examuser/exam/xct-build-volume/www
        echo "$(stat -c %C $D | cut -d: -f3) $(stat -c %C $D/index.html | cut -d: -f3)"
      expect: {match: exact, value: "container_file_t container_file_t"}
    - id: enforcing
      description: "SELinux is still enforcing"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.storage.permissions]
      weight: 1
      command: |
        # guard: counts only once the host directory is labelled
        l=$(stat -c %C /home/examuser/exam/xct-build-volume/www | cut -d: -f3)
        if [ "$l" = container_file_t ]; then getenforce; else echo unlabelled; fi
      expect: {match: exact, value: "Enforcing"}
  misconceptions:
    - id: no-label
      description: "Mounts the directory without a relabel option."
      feedback: "The directory keeps its home-directory label, which a container process cannot read. Add :Z (private) or :z (shared) to the volume, or relabel the directory to container_file_t."
      expectFail: [serving, labelled]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          D=/home/examuser/exam/xct-build-volume
          cat > $D/Containerfile <<'EOF'
          FROM registry.exam.example:5443/library/busybox:1.37
          RUN mkdir -p /srv/www
          VOLUME /srv/www
          EXPOSE 8080
          CMD ["httpd", "-f", "-p", "8080", "-h", "/srv/www"]
          EOF
          chown examuser:examuser $D/Containerfile
          px podman build -q -t localhost/static-web:latest $D >/dev/null
          px podman rm -f static-web >/dev/null 2>&1 || true
          px podman run -d --name static-web -p 8081:8080 -v $D/www:/srv/www localhost/static-web:latest >/dev/null
    - id: permissive
      description: "Turns SELinux off instead of labelling the mount."
      feedback: "Do not disable SELinux: the page is served only because enforcement is off. Keep enforcing and label the mount with :Z."
      expectFail: [labelled, enforcing]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          D=/home/examuser/exam/xct-build-volume
          cat > $D/Containerfile <<'EOF'
          FROM registry.exam.example:5443/library/busybox:1.37
          RUN mkdir -p /srv/www
          VOLUME /srv/www
          EXPOSE 8080
          CMD ["httpd", "-f", "-p", "8080", "-h", "/srv/www"]
          EOF
          chown examuser:examuser $D/Containerfile
          px podman build -q -t localhost/static-web:latest $D >/dev/null
          setenforce 0
          px podman rm -f static-web >/dev/null 2>&1 || true
          px podman run -d --name static-web -p 8081:8080 -v $D/www:/srv/www localhost/static-web:latest >/dev/null
  solution:
    explanation: |
      Declare the volume with VOLUME, then bind-mount the host directory with :Z so podman relabels it container_file_t for this container.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X tee /home/examuser/exam/xct-build-volume/Containerfile >/dev/null <<'EOF'
          FROM registry.exam.example:5443/library/busybox:1.37
          RUN mkdir -p /srv/www
          VOLUME /srv/www
          EXPOSE 8080
          CMD ["httpd", "-f", "-p", "8080", "-h", "/srv/www"]
          EOF
          X sh -c 'cd ~/exam/xct-build-volume && podman build -q -t localhost/static-web:latest . && podman run -d --name static-web -p 8081:8080 -v $PWD/www:/srv/www:Z localhost/static-web:latest'
    alternatives:
      - id: shared-label
        description: "Use the shared label :z."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X tee /home/examuser/exam/xct-build-volume/Containerfile >/dev/null <<'EOF'
              FROM registry.exam.example:5443/library/busybox:1.37
              RUN mkdir -p /srv/www
              VOLUME /srv/www
              EXPOSE 8080
              CMD ["httpd", "-f", "-p", "8080", "-h", "/srv/www"]
              EOF
              X sh -c 'cd ~/exam/xct-build-volume && podman build -q -t localhost/static-web:latest . && podman run -d --name static-web -p 8081:8080 -v $PWD/www:/srv/www:z localhost/static-web:latest'
      - id: chcon
        description: "Relabel the host directory with chcon and mount it without an option."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X tee /home/examuser/exam/xct-build-volume/Containerfile >/dev/null <<'EOF'
              FROM registry.exam.example:5443/library/busybox:1.37
              RUN mkdir -p /srv/www
              VOLUME /srv/www
              EXPOSE 8080
              CMD ["httpd", "-f", "-p", "8080", "-h", "/srv/www"]
              EOF
              sudo chcon -R -t container_file_t /home/examuser/exam/xct-build-volume/www
              X sh -c 'cd ~/exam/xct-build-volume && podman build -q -t localhost/static-web:latest . && podman run -d --name static-web -p 8081:8080 -v $PWD/www:/srv/www localhost/static-web:latest'
