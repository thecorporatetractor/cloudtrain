apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-manage-image-archive
  title: "Back up an image to an archive file"
  domain: containers
  frameworks: [ex188-aligned:manage-images]
  difficulty: easy
  estimatedMinutes: 6
  tags: [exam, podman, save, load, archive]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    Save **`localhost/caption-api:2.1`** (revision {{rev}}, as `examuser`) to
    **`~/exam/xct-manage-archive/caption-api.tar`**, so that loading the archive on a clean system
    recreates the image **with its tag**. Keep the image in the local store.
  objectives:
    - "Save an image with its tag to an archive"
    - "Know why an archive loses its name when saved by ID"
  params:
    rev:
      type: int
      min: 100
      max: 999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-manage-archive
        install -d -o $U -g $U /home/$U/exam $D
        printf '%s\n' 'FROM registry.exam.example:5443/library/alpine:3.22' 'LABEL com.copperleaf.rev={{rev}}' 'CMD ["echo", "caption-api 2.1"]' > $D/Containerfile
        chown $U:$U $D/Containerfile
        px podman build -q -t localhost/caption-api:2.1 $D >/dev/null
        rm -f $D/caption-api.tar
  checks:
    - id: archive-restores
      description: "Loading the archive into an empty store recreates the tagged image"
      type: shell
      timeoutSec: 150
      on: cl-podman-01
      skills: [containers.registry.portability]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        f=/home/examuser/exam/xct-manage-archive/caption-api.tar
        [ -s "$f" ] || { echo missing; exit 0; }
        t=$(mktemp -d /tmp/cl-arch.XXXXXX); chmod 0777 $t
        if px podman --root $t/root --runroot $t/run --storage-driver vfs load -q -i "$f" >/dev/null 2>&1; then
          n=$(px podman --root $t/root --runroot $t/run --storage-driver vfs images --format json 2>/dev/null | jq -r '[.[].Names[]?] | sort | join(",")')
          r=$(px podman --root $t/root --runroot $t/run --storage-driver vfs image inspect localhost/caption-api:2.1 2>/dev/null | jq -r '.[0].Config.Labels["com.copperleaf.rev"] // "none"')
          echo "$n $r"
        else
          echo load-failed
        fi
        rm -rf $t
      expect: {match: exact, value: "localhost/caption-api:2.1 {{rev}}"}
    - id: local-image-kept
      description: "The image is still in examuser's store"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.registry.portability]
      weight: 1
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman image exists localhost/caption-api:2.1 && echo present || echo missing
      expect: {match: exact, value: "present"}
  misconceptions:
    - id: saved-by-id
      description: "Saves the image by its ID, which carries no name."
      feedback: "An archive made from a bare image ID loads as an untagged image. Save by name:tag so the tag travels with the archive."
      expectFail: [archive-restores]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          id=$(px podman image inspect localhost/caption-api:2.1 | jq -r '.[0].Id')
          rm -f /home/examuser/exam/xct-manage-archive/caption-api.tar
          px podman save -o /home/examuser/exam/xct-manage-archive/caption-api.tar "$id"
    - id: export-container
      description: "Exports a container's filesystem instead of saving the image."
      feedback: "podman export writes a flat filesystem of a container, not an image: it has no layers, tags or configuration and podman load cannot restore it."
      expectFail: [archive-restores]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          px podman rm -f archive-src >/dev/null 2>&1 || true
          px podman create --name archive-src localhost/caption-api:2.1 >/dev/null
          rm -f /home/examuser/exam/xct-manage-archive/caption-api.tar
          px podman export -o /home/examuser/exam/xct-manage-archive/caption-api.tar archive-src
          px podman rm -f archive-src >/dev/null
  solution:
    explanation: |
      podman save with the name:tag writes an image archive that includes the tag; podman load recreates the tagged image.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X podman save -o /home/examuser/exam/xct-manage-archive/caption-api.tar localhost/caption-api:2.1
    alternatives:
      - id: oci-archive
        description: "Save as an OCI archive; the reference name is kept inside."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X podman save --format oci-archive -o /home/examuser/exam/xct-manage-archive/caption-api.tar localhost/caption-api:2.1
      - id: skopeo-copy
        description: "Copy to a docker-archive with skopeo, naming the tag."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X skopeo copy containers-storage:localhost/caption-api:2.1 docker-archive:/home/examuser/exam/xct-manage-archive/caption-api.tar:localhost/caption-api:2.1
