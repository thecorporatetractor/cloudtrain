apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-manage-registry-push
  title: "Push to the authenticated exam registry over TLS"
  domain: containers
  frameworks: [ex188-aligned:manage-images]
  difficulty: medium
  estimatedMinutes: 10
  tags: [exam, podman, registry, tls, login, push]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    The secured exam registry is **`secure.exam.example:5444`** (TLS with a private CA, basic auth).
    The CA certificate is `/srv/exam/registry-ca.crt`; the login is in `/srv/exam/registry-credentials.txt`.

    As `examuser`:

    1. Make Podman **trust the registry through its CA** (do not mark the registry insecure and do not
       skip TLS verification).
    2. Log in and push `localhost/media-api:1.0` as **`secure.exam.example:5444/media/api:1.0`**.
    3. Write the pushed image's **digest** (`sha256:...`) to `~/exam/xct-manage-push/digest.txt`, so the
       image can be pulled back by digest.
  objectives:
    - "Trust a private registry CA for Podman"
    - "Authenticate, tag and push to a private registry"
    - "Record a pushed image's digest"
  params:
    pin:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
        # secured registry for the push task: TLS from the shared CA, basic auth, own data directory
        grep -q " secure.exam.example\$" /etc/hosts || echo "127.0.0.1 secure.exam.example" >> /etc/hosts
        s=/srv/registry/secure; mkdir -p $s/auth
        htpasswd -Bbn exam-push "Copperleaf-{{pin}}" > $s/auth/htpasswd
        docker rm -f cl-secure-registry >/dev/null 2>&1 || true
        rm -rf $s/data; mkdir -p $s/data
        docker run -d --name cl-secure-registry --restart always -p 5444:5444 \
          -v $d/certs:/certs:ro -v $s/auth:/auth:ro -v $s/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5444 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key \
          -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=copperleaf -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:3 >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://secure.exam.example:5444/v2/ && break; sleep 1; done
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-manage-push
        install -d -o $U -g $U /home/$U/exam $D
        # media-api:1.0 is seeded only when absent; the seed runs as root from /app, so it never satisfies the build task
        seed_media_api() {
          px podman image exists localhost/media-api:1.0 && return 0
          s=/var/lib/cloudtrain/seed/media-api; rm -rf $s; install -d -m 0755 $s
          cat > $s/app.py <<'EOP'
        import os, http.server
        here = os.path.dirname(os.path.abspath(__file__))
        try:
            build = open(os.path.join(here, "build.txt")).read().strip()
        except OSError:
            build = "seed"
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                body = ("media-api region=%s build=%s uid=%d\n" % (os.environ.get("MEDIA_REGION", "unset"), build, os.getuid())).encode()
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass
        http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
        EOP
          printf '%s\n' 'FROM registry.exam.example:5443/library/python:3.13-alpine' 'COPY app.py /app/app.py' 'EXPOSE 8080' 'CMD ["python", "/app/app.py"]' > $s/Containerfile
          chmod -R a+rX $s
          px podman build -q -t localhost/media-api:1.0 $s >/dev/null
        }
        seed_media_api
        printf '%s\n' 'username: exam-push' "password: Copperleaf-{{pin}}" > /srv/exam/registry-credentials.txt
        chmod 0644 /srv/exam/registry-credentials.txt
        rm -f $D/digest.txt
  checks:
    - id: pushed
      description: "media/api:1.0 is in the secured registry and carries the media-api content (port 8080, app.py)"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.registry.run-registry]
      weight: 2
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        U="exam-push:Copperleaf-{{pin}}"; C="curl -s --cacert /srv/exam/registry-ca.crt -u $U"
        c=$($C -H "$A" https://secure.exam.example:5444/v2/media/api/manifests/1.0 | jq -r '.config.digest // "none"')
        case "$c" in sha256:*) ;; *) echo "missing:$c"; exit 0 ;; esac
        $C https://secure.exam.example:5444/v2/media/api/blobs/$c | jq -r 'if ((.config.ExposedPorts // {}) | has("8080/tcp")) and (((.config.Cmd // []) + (.config.Entrypoint // [])) | join(" ") | contains("app.py")) then "same-image" else "differs" end' 2>/dev/null || echo differs
      expect: {match: exact, value: "same-image"}
    - id: digest-recorded
      description: "~/exam/xct-manage-push/digest.txt holds the digest the registry serves for 1.0"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.registry.portability]
      weight: 2
      command: |
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        U="exam-push:Copperleaf-{{pin}}"; d=$(curl -sI --cacert /srv/exam/registry-ca.crt -u "$U" -H "$A" https://secure.exam.example:5444/v2/media/api/manifests/1.0 | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
        [ -n "$d" ] && grep -qF "$d" /home/examuser/exam/xct-manage-push/digest.txt 2>/dev/null && echo recorded || echo wrong
      expect: {match: exact, value: "recorded"}
    - id: pull-by-digest
      description: "The image can be pulled back by the recorded digest with verification on"
      type: shell
      timeoutSec: 120
      on: cl-podman-01
      skills: [containers.registry.portability, containers.podman.registries-conf]
      weight: 1.5
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        d=$(tr -d ' \n' < /home/examuser/exam/xct-manage-push/digest.txt 2>/dev/null) || d=""
        case "$d" in sha256:*) ;; *) echo no-digest; exit 0 ;; esac
        px podman pull -q --tls-verify=true --creds "exam-push:Copperleaf-{{pin}}" "secure.exam.example:5444/media/api@$d" >/dev/null 2>&1 && echo pulled || echo failed
      expect: {match: exact, value: "pulled"}
    - id: trusted-by-ca
      description: "The registry CA is trusted and the registry is not marked insecure"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.registries-conf]
      weight: 1.5
      command: |
        ok=0
        for c in /etc/containers/certs.d/secure.exam.example:5444/ca.crt /etc/docker/certs.d/secure.exam.example:5444/ca.crt /home/examuser/.config/containers/certs.d/secure.exam.example:5444/ca.crt; do
          [ -f "$c" ] && cmp -s "$c" /srv/exam/registry-ca.crt && ok=1
        done
        openssl verify -CAfile /etc/pki/tls/certs/ca-bundle.crt /srv/exam/registry-ca.crt >/dev/null 2>&1 && ok=1
        bad=0
        for f in $(grep -rEls 'insecure *= *true' /etc/containers /home/examuser/.config/containers 2>/dev/null); do grep -q 'secure.exam.example' "$f" && bad=1; done
        if [ $ok = 1 ] && [ $bad = 0 ]; then echo trusted; else echo not-trusted; fi
      expect: {match: exact, value: "trusted"}
  misconceptions:
    - id: insecure-registry
      description: "Marks the registry insecure and skips TLS verification."
      feedback: "insecure = true and --tls-verify=false switch certificate checking off. Put the CA where Podman looks for it (certs.d/<host>:<port>/ca.crt) and keep verification on."
      expectFail: [trusted-by-ca, pull-by-digest]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          install -d -o examuser -g examuser /home/examuser/.config /home/examuser/.config/containers /home/examuser/.config/containers/registries.conf.d
          printf '[[registry]]\nlocation = "secure.exam.example:5444"\ninsecure = true\n' > /home/examuser/.config/containers/registries.conf.d/50-insecure.conf
          chown examuser:examuser /home/examuser/.config/containers/registries.conf.d/50-insecure.conf
          px podman login --tls-verify=false -u exam-push -p "Copperleaf-{{pin}}" secure.exam.example:5444
          px podman push --tls-verify=false --digestfile /home/examuser/exam/xct-manage-push/digest.txt localhost/media-api:1.0 secure.exam.example:5444/media/api:1.0
    - id: no-digest-file
      description: "Trusts the CA and pushes, but never records the digest."
      feedback: "Without --digestfile (or reading the digest afterwards) there is nothing to pull back by. podman push --digestfile <file> writes it for you."
      expectFail: [digest-recorded, pull-by-digest]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/secure.exam.example:5444/ca.crt
          px podman login -u exam-push -p "Copperleaf-{{pin}}" secure.exam.example:5444
          px podman push localhost/media-api:1.0 secure.exam.example:5444/media/api:1.0
  solution:
    explanation: |
      Podman reads per-registry CAs from certs.d/<host>:<port>/ca.crt. After login, podman push --digestfile writes the pushed digest.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          sudo install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/secure.exam.example:5444/ca.crt
          X podman login -u exam-push -p "$(sed -n 's/^password: //p' /srv/exam/registry-credentials.txt)" secure.exam.example:5444
          X podman push --digestfile /home/examuser/exam/xct-manage-push/digest.txt localhost/media-api:1.0 secure.exam.example:5444/media/api:1.0
    alternatives:
      - id: system-trust
        description: "Add the CA to the system trust store instead of certs.d."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              sudo cp /srv/exam/registry-ca.crt /etc/pki/ca-trust/source/anchors/exam-registry-ca.crt
              sudo update-ca-trust
              X podman login -u exam-push -p "$(sed -n 's/^password: //p' /srv/exam/registry-credentials.txt)" secure.exam.example:5444
              X podman push --digestfile /home/examuser/exam/xct-manage-push/digest.txt localhost/media-api:1.0 secure.exam.example:5444/media/api:1.0
      - id: docker-certs-dir
        description: "Use the Docker-style certificate directory, which Podman also reads."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              sudo install -D -m 0644 /srv/exam/registry-ca.crt /etc/docker/certs.d/secure.exam.example:5444/ca.crt
              X podman login -u exam-push -p "$(sed -n 's/^password: //p' /srv/exam/registry-credentials.txt)" secure.exam.example:5444
              X podman push --digestfile /home/examuser/exam/xct-manage-push/digest.txt localhost/media-api:1.0 secure.exam.example:5444/media/api:1.0
