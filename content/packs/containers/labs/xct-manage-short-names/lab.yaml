apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-manage-short-names
  title: "Make a short image name resolve unambiguously"
  domain: containers
  frameworks: [ex188-aligned:manage-images]
  difficulty: medium
  estimatedMinutes: 8
  tags: [exam, podman, registries, short-names, aliases]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    Today `podman pull ledger` (as `examuser`) searches only `registry.exam.example:5443` and finds an old
    copy of the repository `ledger` (release {{pin}} of the ledger service lives elsewhere). The ledger
    service is the repository **`registry.exam.example:5443/finance/ledger`**.

    Configure `examuser`'s own registries settings (under `~/.config/containers`) so that
    `podman pull ledger` fetches **`registry.exam.example:5443/finance/ledger`**, without prompting and
    without querying any other registry. Do not change the system-wide files in `/etc/containers`.
  objectives:
    - "Map a short image name to a fully qualified repository with an alias"
    - "Keep short-name resolution strict and non-interactive"
  params:
    pin:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
        # finance/ledger is the right image; ledger (no namespace) is an old copy the default search would find
        for repo in finance/ledger ledger; do
          case $repo in finance/ledger) txt="ledger finance {{pin}}" ;; *) txt="ledger legacy {{pin}}" ;; esac
          printf 'FROM busybox:1.37\nCMD ["echo", "%s"]\n' "$txt" | docker build -q -t "$R:5443/$repo:latest" - >/dev/null
          docker push -q "$R:5443/$repo:latest" >/dev/null
        done
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-manage-short
        install -d -o $U -g $U /home/$U/exam $D
        printf 'unqualified-search-registries = ["registry.exam.example:5443"]\n' > /etc/containers/registries.conf.d/20-copperleaf.conf
        rm -rf /home/$U/.config/containers/registries.conf /home/$U/.config/containers/registries.conf.d
        px podman rmi -f $R:5443/ledger:latest $R:5443/finance/ledger:latest >/dev/null 2>&1 || true
  checks:
    - id: pulls-finance
      description: "podman pull ledger fetches finance/ledger non-interactively"
      type: shell
      timeoutSec: 150
      on: cl-podman-01
      skills: [containers.podman.registries-conf]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman rmi -f registry.exam.example:5443/ledger:latest registry.exam.example:5443/finance/ledger:latest >/dev/null 2>&1 || true
        timeout 90 /usr/local/lib/cloudtrain/as-user examuser podman pull -q ledger </dev/null >/dev/null 2>&1 || { echo pull-failed; exit 0; }
        if px podman image exists registry.exam.example:5443/finance/ledger:latest; then echo finance; else echo other; fi
      expect: {match: exact, value: "finance"}
    - id: alias-in-user-config
      description: "The alias lives in the user's own registries configuration"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.registries-conf]
      weight: 1.5
      command: |
        cat /home/examuser/.config/containers/registries.conf /home/examuser/.config/containers/registries.conf.d/*.conf 2>/dev/null | grep -E '^ *"?ledger"? *= *"registry.exam.example:5443/finance/ledger"' >/dev/null && echo alias || echo none
      expect: {match: exact, value: "alias"}
    - id: strict-mode-kept
      description: "Short-name resolution was not relaxed to permissive or disabled"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.registries-conf]
      weight: 1
      command: |
        if cat /home/examuser/.config/containers/registries.conf /home/examuser/.config/containers/registries.conf.d/*.conf /etc/containers/registries.conf.d/*.conf 2>/dev/null | grep -qiE 'short-name-mode *= *"?(permissive|disabled)'; then echo relaxed; else echo strict; fi
      expect: {match: exact, value: "strict"}
  misconceptions:
    - id: full-name-only
      description: "Pulls the fully qualified name once and configures nothing."
      feedback: "The pull works once, but podman pull ledger still resolves through the search list to the old repository. Add an alias for ledger."
      expectFail: [pulls-finance, alias-in-user-config]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
          px podman pull -q registry.exam.example:5443/finance/ledger:latest >/dev/null
    - id: alias-to-legacy
      description: "Writes the alias but points it at the old repository."
      feedback: "The alias must name finance/ledger; registry.exam.example:5443/ledger is the old copy."
      expectFail: [pulls-finance, alias-in-user-config]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          install -d -o examuser -g examuser /home/examuser/.config /home/examuser/.config/containers /home/examuser/.config/containers/registries.conf.d
          printf '[aliases]\n"ledger" = "registry.exam.example:5443/ledger"\n' > /home/examuser/.config/containers/registries.conf.d/10-ledger.conf
          chown examuser:examuser /home/examuser/.config/containers/registries.conf.d/10-ledger.conf
  solution:
    explanation: |
      A short-name alias in [aliases] maps ledger to its full repository and is consulted before the search registries.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X install -d /home/examuser/.config/containers/registries.conf.d
          X tee /home/examuser/.config/containers/registries.conf.d/10-ledger.conf >/dev/null <<'EOF'
          [aliases]
          "ledger" = "registry.exam.example:5443/finance/ledger"
          EOF
          X podman pull ledger
    alternatives:
      - id: user-registries-conf
        description: "Put the alias in the user's registries.conf instead of a drop-in."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X install -d /home/examuser/.config/containers
              X tee /home/examuser/.config/containers/registries.conf >/dev/null <<'EOF'
              [aliases]
              "ledger" = "registry.exam.example:5443/finance/ledger"
              EOF
              X podman pull ledger
