apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-multi-kube-play
  title: "Start a multi-container application from a pod manifest"
  domain: containers
  frameworks: [ex188-aligned:multi-container]
  difficulty: medium
  estimatedMinutes: 12
  tags: [exam, podman, kube-play, pods, manifest]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    The catalog application is described by the Kubernetes-style manifest
    `~/exam/xct-multi-kube/catalog.yaml` (a pod with a web and a cache container). One image reference
    in it is wrong.

    As `examuser`, fix the manifest and start the application from it with **`podman kube play`**, so
    that the web container answers on host port **8086** and the cache container carries the
    environment variable from the manifest (`CATALOG_REV={{rev}}`).
  objectives:
    - "Read and correct a pod manifest"
    - "Start a multi-container application from a manifest with Podman"
  params:
    rev:
      type: int
      min: 100
      max: 999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-multi-kube
        install -d -o $U -g $U /home/$U/exam $D
        pull library/nginx:1.29-alpine
        pull library/redis:7.4-alpine
        cat > $D/catalog.yaml <<'EOP'
        apiVersion: v1
        kind: Pod
        metadata:
          name: catalog
          labels:
            app: catalog
        spec:
          containers:
            - name: web
              image: registry.exam.example:5443/library/ngnix:1.29-alpine
              ports:
                - containerPort: 80
                  hostPort: 8086
            - name: cache
              image: registry.exam.example:5443/library/redis:7.4-alpine
              env:
                - name: CATALOG_REV
                  value: "{{rev}}"
        EOP
        chown $U:$U $D/catalog.yaml
        px podman pod rm -f catalog >/dev/null 2>&1 || true
  checks:
    - id: web-answers
      description: "The web container answers on host port 8086"
      type: shell
      timeoutSec: 150
      on: cl-podman-01
      skills: [containers.podman.kube-play]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman pod start catalog >/dev/null 2>&1 || true
        c=000
        for i in $(seq 30); do c=$(curl -s -m 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8086/); [ "$c" = 200 ] && break; sleep 1; done
        echo "$c"
      expect: {match: exact, value: "200"}
    - id: pod-images
      description: "Pod catalog runs the nginx and redis images"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.kube-play]
      weight: 2
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman inspect catalog-web catalog-cache 2>/dev/null | jq -r '[.[].ImageName] | sort | join(",")' || true
      expect: {match: exact, value: "registry.exam.example:5443/library/nginx:1.29-alpine,registry.exam.example:5443/library/redis:7.4-alpine"}
    - id: manifest-env
      description: "The cache container was created from the manifest (CATALOG_REV is set)"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.kube-play]
      weight: 1.5
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman inspect catalog-cache 2>/dev/null | jq -r '.[0].Config.Env[] | select(startswith("CATALOG_REV="))' || echo none
      expect: {match: exact, value: "CATALOG_REV={{rev}}"}
  misconceptions:
    - id: hand-built
      description: "Builds the pod by hand with podman run instead of the manifest."
      feedback: "The task is to start the application from the manifest. A hand-built pod lacks what the manifest defines (here the CATALOG_REV variable)."
      expectFail: [manifest-env]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          px podman pod create --name catalog -p 8086:80 >/dev/null
          px podman run -d --pod catalog --name catalog-web registry.exam.example:5443/library/nginx:1.29-alpine >/dev/null
          px podman run -d --pod catalog --name catalog-cache registry.exam.example:5443/library/redis:7.4-alpine >/dev/null
    - id: dropped-web
      description: "Deletes the web container from the manifest to get past the error."
      feedback: "Removing the container with the wrong reference removes the web service. Correct the image name instead."
      expectFail: [web-answers, pod-images]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          D=/home/examuser/exam/xct-multi-kube
          sed -i '/- name: web/,/hostPort: 8086/d' $D/catalog.yaml
          px podman kube play $D/catalog.yaml >/dev/null
  solution:
    explanation: |
      The web image name is misspelt (ngnix). Correct it in the manifest and run podman kube play on the file.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X sh -c 'cd ~/exam/xct-multi-kube && sed -i s/ngnix/nginx/ catalog.yaml && podman kube play catalog.yaml'
    alternatives:
      - id: create-then-start
        description: "Create the pod without starting it, then start it."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X sh -c 'cd ~/exam/xct-multi-kube && sed -i s/ngnix/nginx/ catalog.yaml && podman kube play --start=false catalog.yaml && podman pod start catalog'
