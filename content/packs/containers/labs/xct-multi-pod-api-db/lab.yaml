apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-multi-pod-api-db
  title: "Assemble an API and database in one pod"
  domain: containers
  frameworks: [ex188-aligned:multi-container]
  difficulty: medium
  estimatedMinutes: 15
  tags: [exam, podman, pods, multi-container, localhost]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    The ledger API image is `localhost/ledger-api:1.0` (listens on 8085, finds its database through the
    variable `DB_HOST`, which defaults to a host name that does not exist here). The database image is
    `registry.exam.example:5443/library/redis:7.4-alpine` (port 6379).

    As `examuser`, create the pod **`ledger-pod`** that publishes host port **8085**, with the API and the
    database as containers **inside it**, the API reaching the database over the pod's shared localhost.
    `http://127.0.0.1:8085/` must return the ledger summary (`ledger entries={{n}} db=ok`).
  objectives:
    - "Group containers in a pod and publish its port"
    - "Use the pod's shared network namespace for service discovery"
  params:
    n:
      type: int
      min: 100
      max: 999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-multi-pod
        install -d -o $U -g $U /home/$U/exam $D
        pull library/redis:7.4-alpine
        pull library/python:3.13-alpine
        cat > $D/ledger_api.py <<'EOP'
        import os, socket, http.server
        H = os.environ.get("DB_HOST", "db")
        def cmd(*a):
            s = socket.create_connection((H, 6379), timeout=3)
            s.sendall(("*%d\r\n" % len(a) + "".join("$%d\r\n%s\r\n" % (len(x), x) for x in a)).encode())
            r = s.recv(4096).decode()
            s.close()
            return r
        class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                try:
                    cmd("SET", "ledger:entries", os.environ.get("ENTRIES", "0"))
                    n = cmd("GET", "ledger:entries").split("\r\n")[1]
                    body, code = "ledger entries=%s db=ok\n" % n, 200
                except Exception:
                    body, code = "ledger db=unreachable host=%s\n" % H, 502
                b = body.encode()
                self.send_response(code)
                self.send_header("Content-Length", str(len(b)))
                self.end_headers()
                self.wfile.write(b)
            def log_message(self, *a):
                pass
        http.server.HTTPServer(("0.0.0.0", 8085), Handler).serve_forever()
        EOP
        printf '%s\n' 'FROM registry.exam.example:5443/library/python:3.13-alpine' 'COPY ledger_api.py /app/ledger_api.py' 'ENV DB_HOST=db ENTRIES={{n}}' 'EXPOSE 8085' \
          'CMD ["python", "/app/ledger_api.py"]' > $D/Containerfile
        chown $U:$U $D/ledger_api.py $D/Containerfile
        px podman build -q -t localhost/ledger-api:1.0 $D >/dev/null
        px podman pod rm -f ledger-pod >/dev/null 2>&1 || true
  checks:
    - id: pod-members
      description: "ledger-pod holds the API and the database containers"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.pods]
      weight: 2
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        pid=$(px podman pod inspect ledger-pod 2>/dev/null | jq -r 'if type == "array" then .[0].Id else .Id end // empty' || true)
        px podman ps -a --format json 2>/dev/null | jq -r --arg p "$pid" '[.[] | select($p != "" and .Pod == $p and (.IsInfra | not)) | .Image] | sort | join(",")' || true
      expect: {match: exact, value: "localhost/ledger-api:1.0,registry.exam.example:5443/library/redis:7.4-alpine"}
    - id: summary
      description: "The published port returns the ledger summary through the pod's localhost"
      type: shell
      timeoutSec: 150
      on: cl-podman-01
      skills: [containers.podman.pods]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman pod start ledger-pod >/dev/null 2>&1 || true
        r=no-answer
        for i in $(seq 30); do o=$(curl -s -m 3 http://127.0.0.1:8085/) && [ -n "$o" ] && { r=$o; break; }; sleep 1; done
        echo "$r"
      expect: {match: exact, value: "ledger entries={{n}} db=ok"}
    - id: pod-published
      description: "The pod publishes 8085"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.pods]
      weight: 1
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        pid=$(px podman pod inspect ledger-pod 2>/dev/null | jq -r 'if type == "array" then .[0].Id else .Id end // empty' || true)
        px podman ps -a --format json 2>/dev/null | jq -r --arg p "$pid" '[.[] | select($p != "" and .Pod == $p and .IsInfra) | (.Ports // [])[]? | select(.host_port == 8085) | .host_port] | length' || echo 0
      expect: {match: exact, value: "1"}
  misconceptions:
    - id: separate-network
      description: "Runs two separate containers on a user network instead of one pod."
      feedback: "The task asks for a pod: its containers share one network namespace, so the API reaches the database on localhost. Two containers on a network are not in a pod."
      expectFail: [pod-members, pod-published]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          px podman network create ledger-net >/dev/null 2>&1 || true
          px podman run -d --name ledger-net-db --network ledger-net --network-alias db registry.exam.example:5443/library/redis:7.4-alpine >/dev/null
          px podman run -d --name ledger-net-api --network ledger-net -p 8085:8085 localhost/ledger-api:1.0 >/dev/null
    - id: default-db-host
      description: "Builds the pod but leaves DB_HOST at its default."
      feedback: "Inside a pod the database is on localhost, not on a host called db. Set DB_HOST=127.0.0.1 for the API."
      expectFail: [summary]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          px podman pod create --name ledger-pod -p 8085:8085 >/dev/null
          px podman run -d --pod ledger-pod --name ledger-pod-db registry.exam.example:5443/library/redis:7.4-alpine >/dev/null
          px podman run -d --pod ledger-pod --name ledger-pod-api localhost/ledger-api:1.0 >/dev/null
  solution:
    explanation: |
      Create the pod with the port, then run both containers with --pod; containers in one pod share localhost, so DB_HOST=127.0.0.1 reaches the database.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X podman pod create --name ledger-pod -p 8085:8085
          X podman run -d --pod ledger-pod --name ledger-pod-db registry.exam.example:5443/library/redis:7.4-alpine
          X podman run -d --pod ledger-pod --name ledger-pod-api -e DB_HOST=127.0.0.1 localhost/ledger-api:1.0
    alternatives:
      - id: localhost-name
        description: "Use the name localhost for DB_HOST."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X podman pod create --name ledger-pod -p 8085:8085
              X podman run -d --pod ledger-pod --name ledger-pod-api -e DB_HOST=localhost localhost/ledger-api:1.0
              X podman run -d --pod ledger-pod --name ledger-pod-db registry.exam.example:5443/library/redis:7.4-alpine
