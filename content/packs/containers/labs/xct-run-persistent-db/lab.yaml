apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-run-persistent-db
  title: "Run a database whose data outlives the container"
  domain: containers
  frameworks: [ex188-aligned:run-containers]
  difficulty: medium
  estimatedMinutes: 10
  tags: [exam, podman, run, volume, database]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    The ledger database image is `registry.exam.example:5443/library/redis:7.4-alpine` (it keeps its data in
    `/data`). The named volume **`ledger-data`** already exists for `examuser` and holds the seeded ledger
    (the key `ledger:entries`, currently {{n}}).

    As `examuser`, run the image as the container **`ledger-db`** with `ledger-data` mounted at `/data`, so
    the seeded ledger is served and removing and recreating the container keeps it.
  objectives:
    - "Attach an existing named volume to a container"
    - "Tell a named volume from a bind mount or an anonymous volume"
  params:
    n:
      type: int
      min: 100
      max: 999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-run-db
        install -d -o $U -g $U /home/$U/exam $D
        pull library/redis:7.4-alpine
        px podman rm -f ledger-db >/dev/null 2>&1 || true
        if ! px podman volume exists ledger-data; then
          px podman volume create ledger-data >/dev/null
          px podman run --rm -v ledger-data:/data $R:5443/library/redis:7.4-alpine sh -c 'redis-server --daemonize yes --dir /data >/dev/null; sleep 1; redis-cli SET ledger:entries {{n}} >/dev/null; redis-cli SAVE >/dev/null; redis-cli shutdown nosave'
        fi
  checks:
    - id: named-volume
      description: "ledger-data is mounted at /data as a named volume"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.storage.mount-types]
      weight: 2
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman inspect ledger-db 2>/dev/null | jq -r '[.[0].Mounts[]? | select(.Destination == "/data") | (.Type + ":" + (.Name // "-"))] | .[0] // "none"' || echo none
      expect: {match: exact, value: "volume:ledger-data"}
    - id: seeded-served
      description: "The database serves the seeded ledger"
      type: shell
      timeoutSec: 120
      on: cl-podman-01
      skills: [containers.storage.mount-types]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman start ledger-db >/dev/null 2>&1 || true
        r=no-answer
        for i in $(seq 20); do o=$(px podman exec ledger-db redis-cli GET ledger:entries 2>/dev/null) && [ -n "$o" ] && { r=$o; break; }; sleep 1; done
        echo "$r"
      expect: {match: exact, value: "{{n}}"}
    - id: survives-recreate
      description: "A fresh container on the volume sees data written by ledger-db"
      type: shell
      timeoutSec: 150
      on: cl-podman-01
      skills: [containers.storage.mount-types]
      weight: 2
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman start ledger-db >/dev/null 2>&1 || true
        for i in $(seq 20); do px podman exec ledger-db redis-cli PING >/dev/null 2>&1 && break; sleep 1; done
        px podman exec ledger-db redis-cli SET ledger:probe {{n}}x >/dev/null 2>&1 || true
        px podman exec ledger-db redis-cli SAVE >/dev/null 2>&1 || true
        px podman stop -t 3 ledger-db >/dev/null 2>&1 || true
        out=$(px podman run --rm -v ledger-data:/data registry.exam.example:5443/library/redis:7.4-alpine sh -c 'redis-server --daemonize yes --dir /data >/dev/null; sleep 1; redis-cli GET ledger:probe; redis-cli shutdown nosave' 2>/dev/null | head -1)
        px podman start ledger-db >/dev/null 2>&1 || true
        echo "${out:-none}"
      expect: {match: exact, value: "{{n}}x"}
  misconceptions:
    - id: anonymous-volume
      description: "Runs the image without naming a volume."
      feedback: "The image declares /data as a volume, so an anonymous one is created and discarded with the container. Name the volume: -v ledger-data:/data."
      expectFail: [named-volume, seeded-served, survives-recreate]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
          px podman run -d --name ledger-db registry.exam.example:5443/library/redis:7.4-alpine >/dev/null
    - id: bind-dir
      description: "Mounts a host directory instead of the named volume."
      feedback: "A bind mount is not the volume the seeded ledger lives in. Use the named volume ledger-data."
      expectFail: [named-volume, seeded-served, survives-recreate]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          install -d -o examuser -g examuser /home/examuser/exam/xct-run-db/data
          px podman run -d --name ledger-db -v /home/examuser/exam/xct-run-db/data:/data:Z registry.exam.example:5443/library/redis:7.4-alpine >/dev/null
  solution:
    explanation: |
      Mount the existing named volume at /data; the volume, not the container, owns the data.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X podman run -d --name ledger-db -v ledger-data:/data registry.exam.example:5443/library/redis:7.4-alpine
    alternatives:
      - id: mount-flag
        description: "Use the long --mount syntax."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X podman run -d --name ledger-db --mount type=volume,source=ledger-data,target=/data registry.exam.example:5443/library/redis:7.4-alpine
