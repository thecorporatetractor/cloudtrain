apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-run-quadlet-service
  title: "Run a container as a service that survives reboot"
  domain: containers
  frameworks: [ex188-aligned:run-containers]
  difficulty: hard
  estimatedMinutes: 15
  tags: [exam, podman, quadlet, systemd, reboot, linger]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    As `examuser`, run the image `localhost/media-api:1.0` as a **systemd user service** that starts
    automatically at boot, even when nobody is logged in: the container is named **`media-edge`**, has
    `MEDIA_REGION=zone-{{zone}}` and publishes container port 8080 on host port **18090**. After the
    system reboots it must be running and answering on `http://127.0.0.1:18090/`.
  objectives:
    - "Declare a container as a Quadlet unit"
    - "Enable the unit for boot and enable lingering for the user"
  params:
    zone:
      type: int
      min: 10
      max: 99
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-run-quadlet
        install -d -o $U -g $U /home/$U/exam $D
        # media-api:1.0 is seeded only when absent; the seed runs as root from /app, so it never satisfies the build task
        seed_media_api() {
          px podman image exists localhost/media-api:1.0 && return 0
          s=/var/lib/cloudtrain/seed/media-api; rm -rf $s; install -d -m 0755 $s
          cat > $s/app.py <<'EOP'
        import os, http.server
        here = os.path.dirname(os.path.abspath(__file__))
        try:
            build = open(os.path.join(here, "build.txt")).read().strip()
        except OSError:
            build = "seed"
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                body = ("media-api region=%s build=%s uid=%d\n" % (os.environ.get("MEDIA_REGION", "unset"), build, os.getuid())).encode()
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a):
                pass
        http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
        EOP
          printf '%s\n' 'FROM registry.exam.example:5443/library/python:3.13-alpine' 'COPY app.py /app/app.py' 'EXPOSE 8080' 'CMD ["python", "/app/app.py"]' > $s/Containerfile
          chmod -R a+rX $s
          px podman build -q -t localhost/media-api:1.0 $s >/dev/null
        }
        seed_media_api
        rm -rf /home/$U/.config/containers/systemd
        rm -f /var/lib/systemd/linger/$U
        px podman rm -f media-edge >/dev/null 2>&1 || true
  checks:
    - id: unit-defined
      description: "A Quadlet container unit defines media-edge from the image with port 18090"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 2
      command: |
        d=/home/examuser/.config/containers/systemd
        f=""
        for c in $d/*.container; do
          [ -f "$c" ] || continue
          if grep -qE '^ContainerName=media-edge$' "$c" || [ "$(basename "$c" .container)" = media-edge ]; then f=$c; break; fi
        done
        [ -n "$f" ] || { echo missing; exit 0; }
        # read the image, environment and port from the container the unit created
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        n=$(basename "$f" .container)
        r=missing
        for i in $(seq 30); do
          name=$(px podman ps -a --filter label=PODMAN_SYSTEMD_UNIT=$n.service --format json 2>/dev/null | jq -r '.[0].Names[0] // empty')
          if [ -n "$name" ]; then
            r=$(px podman inspect "$name" 2>/dev/null | jq -r '.[0] | if (.ImageName == "localhost/media-api:1.0") and ((.Config.Env // []) | index("MEDIA_REGION=zone-{{zone}}") != null) and ((.HostConfig.PortBindings["8080/tcp"] // []) | map(.HostPort) | index("18090") != null) then "defined" else "missing" end')
            break
          fi
          sleep 2
        done
        echo "$r"
      expect: {match: exact, value: "defined"}
    - id: install-section
      description: "The unit is wanted by default.target"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 2
      command: |
        d=/home/examuser/.config/containers/systemd
        f=""
        for c in $d/*.container; do
          [ -f "$c" ] || continue
          if grep -qE '^ContainerName=media-edge$' "$c" || [ "$(basename "$c" .container)" = media-edge ]; then f=$c; break; fi
        done
        [ -n "$f" ] && awk '/^\[/{s=$0} s=="[Install]" && /^WantedBy=.*default\.target/{ok=1} END{print ok ? "enabled" : "not-enabled"}' "$f" || echo not-enabled
      expect: {match: exact, value: "enabled"}
    - id: linger
      description: "Lingering is enabled for examuser"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 2
      command: |
        if [ -e /var/lib/systemd/linger/examuser ]; then echo yes; else echo no; fi
      expect: {match: exact, value: "yes"}
    - id: service-answers
      description: "The user service is active and the container answers on 18090"
      type: shell
      timeoutSec: 180
      on: cl-podman-01
      skills: [containers.podman.quadlet]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        d=/home/examuser/.config/containers/systemd
        f=""
        for c in $d/*.container; do
          [ -f "$c" ] || continue
          if grep -qE '^ContainerName=media-edge$' "$c" || [ "$(basename "$c" .container)" = media-edge ]; then f=$c; break; fi
        done
        [ -n "$f" ] || { echo no-unit; exit 0; }
        n=$(basename "$f" .container)
        r=no-answer
        for i in $(seq 60); do
          if [ "$(px systemctl --user is-active $n.service 2>/dev/null)" = active ]; then
            o=$(curl -s -m 3 http://127.0.0.1:18090/) && [ -n "$o" ] && { r="active $(echo "$o" | sed -n 's/.*region=\([^ ]*\).*/\1/p')"; break; }
          fi
          sleep 2
        done
        echo "$r"
      expect: {match: exact, value: "active zone-{{zone}}"}
  misconceptions:
    - id: no-linger
      description: "Writes a correct unit and starts it, but never enables lingering."
      feedback: "Without lingering a user's service manager stops when the last session ends and is not started at boot, so the service is gone after a reboot. Enable it with loginctl enable-linger."
      expectFail: [linger]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          D=/home/examuser/.config/containers/systemd
          install -d -o examuser -g examuser /home/examuser/.config /home/examuser/.config/containers $D
          cat > $D/media-edge.container <<'EOF'
          [Unit]
          Description=Media edge API

          [Container]
          Image=localhost/media-api:1.0
          ContainerName=media-edge
          PublishPort=18090:8080
          Environment=MEDIA_REGION=zone-{{zone}}

          [Service]
          Restart=always

          [Install]
          WantedBy=default.target
          EOF
          chown examuser:examuser $D/media-edge.container
          px systemctl --user daemon-reload
          px systemctl --user start media-edge.service
    - id: no-install
      description: "Enables lingering but the unit has no [Install] section."
      feedback: "A Quadlet unit needs an [Install] section with WantedBy=default.target to be started with the user manager at boot."
      expectFail: [install-section]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          D=/home/examuser/.config/containers/systemd
          install -d -o examuser -g examuser /home/examuser/.config /home/examuser/.config/containers $D
          cat > $D/media-edge.container <<'EOF'
          [Unit]
          Description=Media edge API

          [Container]
          Image=localhost/media-api:1.0
          ContainerName=media-edge
          PublishPort=18090:8080
          Environment=MEDIA_REGION=zone-{{zone}}

          [Service]
          Restart=always

          EOF
          chown examuser:examuser $D/media-edge.container
          loginctl enable-linger examuser
          px systemctl --user daemon-reload
          px systemctl --user start media-edge.service
    - id: restart-policy
      description: "Starts the container with a restart policy and nothing else."
      feedback: "Podman has no daemon to restart containers at boot. Define a unit (Quadlet) so systemd starts the container."
      expectFail: [unit-defined, install-section, linger, service-answers]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
          px podman run -d --name media-edge --restart always -e MEDIA_REGION=zone-{{zone}} -p 18090:8080 localhost/media-api:1.0 >/dev/null
  solution:
    explanation: |
      A .container file under ~/.config/containers/systemd is turned into a systemd user service by the Quadlet generator; [Install] WantedBy=default.target plus loginctl enable-linger starts it at boot without a login.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X mkdir -p /home/examuser/.config/containers/systemd
          X tee /home/examuser/.config/containers/systemd/media-edge.container >/dev/null <<'EOF'
          [Unit]
          Description=Media edge API

          [Container]
          Image=localhost/media-api:1.0
          ContainerName=media-edge
          PublishPort=18090:8080
          Environment=MEDIA_REGION=zone-{{zone}}

          [Service]
          Restart=always

          [Install]
          WantedBy=default.target
          EOF
          sudo loginctl enable-linger examuser
          X systemctl --user daemon-reload
          X systemctl --user start media-edge.service
    alternatives:
      - id: other-file-name
        description: "Name the file edge.container and set ContainerName=media-edge."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              X mkdir -p /home/examuser/.config/containers/systemd
              X tee /home/examuser/.config/containers/systemd/edge.container >/dev/null <<'EOF'
              [Unit]
              Description=Media edge API

              [Container]
              Image=localhost/media-api:1.0
              ContainerName=media-edge
              PublishPort=18090:8080
              Environment=MEDIA_REGION=zone-{{zone}}

              [Service]
              Restart=always

              [Install]
              WantedBy=default.target
              EOF
              sudo loginctl enable-linger examuser
              X systemctl --user daemon-reload
              X systemctl --user start edge.service
