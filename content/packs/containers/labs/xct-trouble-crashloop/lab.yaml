apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xct-trouble-crashloop
  title: "Get a crash-looping container running"
  domain: containers
  frameworks: [ex188-aligned:troubleshoot]
  difficulty: medium
  estimatedMinutes: 10
  tags: [exam, podman, troubleshoot, logs, exit-code]
  version: 1
spec:
  description: |
    **Host:** `cl-podman-01` (`ssh cl-podman-01`, then `sudo machinectl shell examuser@` to work as `examuser`)

    The container **`metrics-agent`** (image `localhost/metrics-agent:1`, owned by `examuser`) exits right
    after it starts. Find out why from its logs and exit code, correct the misnamed configuration
    variable, and leave `metrics-agent` running. The endpoint value itself is right
    (`http://127.0.0.1:{{port}}/push`). Keep the container name and image.
  objectives:
    - "Diagnose an immediate exit from logs and exit code"
    - "Recreate a container with corrected configuration"
  params:
    port:
      type: int
      min: 9100
      max: 9199
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: cl-podman-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
      - name: cl-registry-01
        driver: vm
        image: docker-vm:29
        resources: {cpu: 1, memoryMiB: 1024}
        access: [ssh]
  setup:
    - on: cl-registry-01
      timeoutSec: 600
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        R=registry.exam.example; d=/srv/registry
        grep -q " $R\$" /etc/hosts || echo "127.0.0.1 $R" >> /etc/hosts
        if [ ! -s $d/certs/ca.crt ]; then
          rm -rf $d/certs; mkdir -p $d/certs $d/pub $d/data; cd $d/certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Copperleaf exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=$R" 2>/dev/null
          printf 'subjectAltName=DNS:%s,DNS:secure.exam.example,DNS:cl-registry-01\nextendedKeyUsage=serverAuth\n' "$R" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key
        fi
        mkdir -p $d/pub $d/data
        cp -f $d/certs/ca.crt $d/pub/ca.crt
        install -D -m 0644 $d/certs/ca.crt /etc/docker/certs.d/$R:5443/ca.crt
        docker inspect cl-registry >/dev/null 2>&1 || docker run -d --name cl-registry --restart always -p 5443:5443 \
          -v $d/certs:/certs:ro -v $d/data:/var/lib/registry -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker inspect cl-ca-share >/dev/null 2>&1 || docker run -d --name cl-ca-share --restart always -p 8099:8099 \
          -v $d/pub:/pub:ro busybox:1.37 httpd -f -p 8099 -h /pub >/dev/null
        for i in $(seq 30); do curl -s --cacert $d/certs/ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        A='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        push_base() {  # <local image> <repo:tag>: republish a preloaded image as a single-platform manifest
          curl -fsI --cacert $d/certs/ca.crt -H "$A" -o /dev/null "https://$R:5443/v2/${2%%:*}/manifests/${2#*:}" && return 0
          printf 'FROM %s\n' "$1" | docker build -q -t "$R:5443/$2" - >/dev/null
          docker push -q "$R:5443/$2" >/dev/null
        }
        push_base busybox:1.37 library/busybox:1.37
        push_base alpine:3.22 library/alpine:3.22
        push_base python:3.13-alpine library/python:3.13-alpine
        push_base nginx:1.29-alpine library/nginx:1.29-alpine
        push_base redis:7.4-alpine library/redis:7.4-alpine
    - on: cl-podman-01
      timeoutSec: 1200
      run: |
        set -eu
        U=examuser; R=registry.exam.example
        rpm -q podman buildah skopeo container-selinux systemd-container >/dev/null 2>&1 || dnf -y -q install podman buildah skopeo container-selinux systemd-container >/dev/null
        id $U >/dev/null 2>&1 || useradd -m -u 2300 -s /bin/bash $U
        systemctl start user@$(id -u $U).service
        for i in $(seq 30); do [ -S /run/user/$(id -u $U)/bus ] && break; sleep 1; done
        install -d -m 0755 /usr/local/lib/cloudtrain /srv/exam /var/lib/cloudtrain
        cat > /usr/local/lib/cloudtrain/as-user <<'EOS'
        #!/bin/sh
        # run a command as an unprivileged user with a working user session bus
        u=$1; shift
        id=$(id -u "$u")
        if [ ! -S /run/user/$id/bus ]; then
          systemctl start user@$id.service
          for i in $(seq 30); do [ -S /run/user/$id/bus ] && break; sleep 1; done
        fi
        cd /
        exec runuser -u "$u" -- env HOME="$(getent passwd "$u" | cut -d: -f6)" XDG_RUNTIME_DIR=/run/user/$id DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$id/bus "$@"
        EOS
        chmod 0755 /usr/local/lib/cloudtrain/as-user
        px() { /usr/local/lib/cloudtrain/as-user $U "$@"; }
        ip=""
        for i in $(seq 60); do ip=$(getent ahostsv4 cl-registry-01 | awk 'NR==1{print $1}'); [ -n "$ip" ] && break; sleep 2; done
        [ -n "$ip" ]
        sed -i "/ $R\$/d;/ secure.exam.example\$/d" /etc/hosts
        echo "$ip $R" >> /etc/hosts
        echo "$ip secure.exam.example" >> /etc/hosts
        for i in $(seq 60); do curl -fs -o /srv/exam/registry-ca.crt http://$ip:8099/ca.crt && break; sleep 2; done
        chmod 0644 /srv/exam/registry-ca.crt
        install -D -m 0644 /srv/exam/registry-ca.crt /etc/containers/certs.d/$R:5443/ca.crt
        for i in $(seq 30); do curl -s --cacert /srv/exam/registry-ca.crt -o /dev/null https://$R:5443/v2/ && break; sleep 1; done
        pull() { for t in 1 2 3; do px podman pull -q "$R:5443/$1" >/dev/null 2>&1 && return 0; sleep 3; done; return 1; }
        D=/home/$U/exam/xct-trouble-agent
        install -d -o $U -g $U /home/$U/exam $D
        pull library/alpine:3.22
        cat > $D/agent.sh <<'EOP'
        #!/bin/sh
        if [ -z "$METRICS_ENDPOINT" ]; then
          echo "agent: METRICS_ENDPOINT is not set" >&2
          exit 3
        fi
        echo "agent up endpoint=$METRICS_ENDPOINT"
        while :; do sleep 5; done
        EOP
        printf '%s\n' 'FROM registry.exam.example:5443/library/alpine:3.22' 'COPY agent.sh /usr/local/bin/agent' 'RUN chmod 0755 /usr/local/bin/agent' 'ENTRYPOINT ["/usr/local/bin/agent"]' > $D/Containerfile
        chown $U:$U $D/agent.sh $D/Containerfile
        px podman build -q -t localhost/metrics-agent:1 $D >/dev/null
        px podman rm -f metrics-agent >/dev/null 2>&1 || true
        px podman run -d --name metrics-agent -e METRIC_ENDPOINT=http://127.0.0.1:{{port}}/push localhost/metrics-agent:1 >/dev/null || true
  checks:
    - id: config-fixed
      description: "The container has METRICS_ENDPOINT with the right value and no misnamed variable"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.foundations.exec-logs]
      weight: 3
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman inspect metrics-agent 2>/dev/null | jq -r '.[0].Config.Env as $e | if ($e | index("METRICS_ENDPOINT=http://127.0.0.1:{{port}}/push")) != null and ([$e[] | select(startswith("METRIC_ENDPOINT="))] | length) == 0 then "fixed" else "wrong" end' || echo wrong
      expect: {match: exact, value: "fixed"}
    - id: stays-up
      description: "The agent starts and keeps running"
      type: shell
      timeoutSec: 120
      on: cl-podman-01
      skills: [containers.operations.exit-codes]
      weight: 2
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman start metrics-agent >/dev/null 2>&1 || true
        sleep 6
        px podman inspect metrics-agent 2>/dev/null | jq -r '.[0].State.Running' || echo false
      expect: {match: exact, value: "true"}
    - id: same-image
      description: "It still runs localhost/metrics-agent:1 with its own entrypoint"
      type: shell
      timeoutSec: 90
      on: cl-podman-01
      skills: [containers.operations.exit-codes]
      weight: 1
      command: |
        px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }
        px podman inspect metrics-agent 2>/dev/null | jq -r '[.[0].ImageName, (.[0].Config.Entrypoint | join(" "))] | join(" ")' || true
      expect: {match: exact, value: "localhost/metrics-agent:1 /usr/local/bin/agent"}
  misconceptions:
    - id: keepalive-hack
      description: "Overrides the entrypoint with a sleep so the container stays up."
      feedback: "The container stays up but the agent never runs. Read the log: it names the variable it needs. Fix the variable, not the entrypoint."
      expectFail: [config-fixed, same-image]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          px podman rm -f metrics-agent >/dev/null
          px podman run -d --name metrics-agent --entrypoint sh -e METRIC_ENDPOINT=http://127.0.0.1:{{port}}/push localhost/metrics-agent:1 -c 'sleep 3600' >/dev/null
    - id: wrong-value
      description: "Renames the variable but gives it a different endpoint."
      feedback: "Only the name was wrong. Keep the value http://127.0.0.1:{{port}}/push."
      expectFail: [config-fixed]
      mutation:
        on: cl-podman-01
        as: admin
        run: |
          px() { /usr/local/lib/cloudtrain/as-user examuser "$@"; }

          px podman rm -f metrics-agent >/dev/null
          px podman run -d --name metrics-agent -e METRICS_ENDPOINT=http://127.0.0.1:9/push localhost/metrics-agent:1 >/dev/null
  solution:
    explanation: |
      podman logs shows 'METRICS_ENDPOINT is not set' and the exit code is 3. Environment cannot be edited in place, so recreate the container with the correct name.
    steps:
      - on: cl-podman-01
        as: learner
        run: |
          X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
          cd /
          X podman logs metrics-agent || true
          X podman rm -f metrics-agent
          X podman run -d --name metrics-agent -e METRICS_ENDPOINT=http://127.0.0.1:{{port}}/push localhost/metrics-agent:1
    alternatives:
      - id: env-file
        description: "Recreate with an env file."
        steps:
          - on: cl-podman-01
            as: learner
            run: |
              X() { sudo -u examuser -H env XDG_RUNTIME_DIR=/run/user/$(id -u examuser) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u examuser)/bus "$@"; }
              cd /
              echo METRICS_ENDPOINT=http://127.0.0.1:{{port}}/push | X tee /home/examuser/exam/xct-trouble-agent/agent.env >/dev/null
              X podman rm -f metrics-agent
              X podman run -d --name metrics-agent --env-file /home/examuser/exam/xct-trouble-agent/agent.env localhost/metrics-agent:1
