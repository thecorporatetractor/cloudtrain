apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xpe-image-build-push
  title: Build and publish the tracking API image
  domain: containers
  frameworks: [ct-platform:containers-delivery]
  difficulty: medium
  estimatedMinutes: 20
  tags: [exam, docker, build, multi-stage, registry]
  version: 1
spec:
  description: |
    **Host:** `qm-docker-1` (`ssh qm-docker-1`)

    The harbour-tracking API's build context is `~/exam/tracking-build/` (`Dockerfile`,
    `build.py`, `build-cache.bin`). Today's `Dockerfile` is a single stage on
    `python:3.13-alpine` that runs as root and ships the whole build directory, including
    the 20 MB `build-cache.bin`, in the final image.

    1. Rewrite the build as a **multi-stage** image: a `python:3.13-alpine` build stage
       that runs `python3 build.py /out/tracking-api`, and a final stage on
       **`alpine:3.22`** that contains only the built `tracking-api` program (no Python,
       no `/src`) and runs as the fixed **non-root UID 10001**.
    2. Build and **push** it as **`registry.quillmoor.example:5443/tracking-api-build:{{ver}}`**
       (TLS; the CA is trusted on this host already).
    3. Write the pushed image's **digest** (`sha256:...`, as the registry reports it for
       that tag) to **`~/exam/tracking-build/digest.txt`**.
    4. The grader pulls **by digest**; running it must print
       `tracking-api {{ver}} uid=10001`.
  objectives:
    - Build a slim multi-stage image with a fixed non-root UID
    - Push an image by version and record its digest
  params:
    ver:
      type: int
      min: 100
      max: 899
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: qm-docker-1
        driver: vm
        image: docker-vm:29
        resources: {cpu: 2, memoryMiB: 2048}
        access: [ssh]
  setup:
    - on: qm-docker-1
      timeoutSec: 420
      run: |
        set -eu
        usermod -aG docker learner
        for i in $(seq 90); do docker info >/dev/null 2>&1 && break; sleep 2; done
        grep -q ' registry.quillmoor.example' /etc/hosts || echo '127.0.0.1 registry.quillmoor.example' >> /etc/hosts
        r=/srv/exam/registry; mkdir -p "$r/certs" "$r/data"
        if [ ! -f "$r/certs/server.crt" ]; then
          cd "$r/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 30 -subj "/CN=Quillmoor exam CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=registry.quillmoor.example" 2>/dev/null
          printf 'subjectAltName=DNS:registry.quillmoor.example\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 30 -extfile ext.cnf 2>/dev/null
          chmod 0644 server.key; rm -f server.csr ext.cnf ca.srl ca.key
        fi
        install -D -m 0644 "$r/certs/ca.crt" /etc/docker/certs.d/registry.quillmoor.example:5443/ca.crt
        docker inspect qm-exam-registry >/dev/null 2>&1 || docker run -d --name qm-exam-registry --restart always -p 5443:5443 -v "$r/certs:/certs:ro" -v "$r/data:/var/lib/registry" \
          -e REGISTRY_HTTP_ADDR=0.0.0.0:5443 -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server.crt -e REGISTRY_HTTP_TLS_KEY=/certs/server.key registry:3 >/dev/null
        docker start qm-exam-registry >/dev/null 2>&1 || true
        for i in $(seq 30); do curl -fs --cacert "$r/certs/ca.crt" https://registry.quillmoor.example:5443/v2/ >/dev/null && break; sleep 1; done
        s=/home/learner/exam/tracking-build
        rm -rf "$s"; install -d -o learner -g learner /home/learner/exam "$s"
        cat > "$s/build.py" <<'PY'
        import os, sys
        out = sys.argv[1]
        os.makedirs(os.path.dirname(out), exist_ok=True)
        with open(out, "w") as f:
            f.write('#!/bin/sh\necho "tracking-api {{ver}} uid=$(id -u)"\n')
        os.chmod(out, 0o755)
        PY
        head -c 20971520 /dev/urandom > "$s/build-cache.bin"
        cat > "$s/Dockerfile" <<'DF'
        FROM python:3.13-alpine
        WORKDIR /src
        COPY build.py build-cache.bin ./
        RUN python3 build.py /usr/local/bin/tracking-api
        ENTRYPOINT ["/usr/local/bin/tracking-api"]
        DF
        chown -R learner:learner "$s"
  checks:
    - id: runs-as-uid
      description: The pushed image runs as UID 10001
      type: shell
      timeoutSec: 120
      on: qm-docker-1
      skills: [k8s.delivery.image-build, k8s.security.image-footprint]
      weight: 2
      command: docker run --rm registry.quillmoor.example:5443/tracking-api-build:{{ver}} 2>/dev/null || echo broken
      expect: {match: exact, value: "tracking-api {{ver}} uid=10001"}
    - id: pushed-by-version
      description: The registry serves tracking-api-build:{{ver}}
      type: shell
      timeoutSec: 60
      on: qm-docker-1
      skills: [k8s.delivery.image-build]
      weight: 1
      command: |
        A='Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        curl -s --cacert /srv/exam/registry/certs/ca.crt -H "$A" -o /dev/null -w '%{http_code}' https://registry.quillmoor.example:5443/v2/tracking-api-build/manifests/{{ver}}
      expect: {match: exact, value: "200"}
    - id: slim-final-stage
      description: The final image contains neither Python nor the build directory
      type: shell
      timeoutSec: 120
      on: qm-docker-1
      skills: [k8s.delivery.image-build, k8s.security.image-footprint]
      weight: 2
      command: |
        I=registry.quillmoor.example:5443/tracking-api-build:{{ver}}
        s=$(docker run --rm --entrypoint sh "$I" -c 'ls /src 2>/dev/null | wc -l' 2>/dev/null || echo none)
        p=$(docker run --rm --entrypoint sh "$I" -c 'command -v python3 >/dev/null && echo present || echo none' 2>/dev/null || echo none)
        echo "src=$s python=$p"
      expect: {match: exact, value: "src=0 python=none"}
    - id: digest-recorded-and-pullable
      description: digest.txt holds the registry's digest for the tag, and that digest pulls and runs correctly
      type: shell
      timeoutSec: 120
      on: qm-docker-1
      skills: [k8s.delivery.image-build]
      weight: 3
      command: |
        A='Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json'
        d=$(curl -fsSI --cacert /srv/exam/registry/certs/ca.crt -H "$A" https://registry.quillmoor.example:5443/v2/tracking-api-build/manifests/{{ver}} | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
        [ -n "$d" ] || { echo no-digest; exit 0; }
        [ "$(tr -d ' \n' < /home/learner/exam/tracking-build/digest.txt 2>/dev/null)" = "$d" ] || { echo digest-file-mismatch; exit 0; }
        docker run --rm "registry.quillmoor.example:5443/tracking-api-build@$d" 2>/dev/null || echo broken
      expect: {match: exact, value: "tracking-api {{ver}} uid=10001"}
  misconceptions:
    - id: default-user
      description: Builds a working multi-stage image but never sets a fixed UID, so it runs as root.
      feedback: "The task requires a fixed non-root UID 10001, not whatever the base image defaults to (root on alpine). Add a user with that exact UID and set USER before the entrypoint."
      expectFail: [runs-as-uid, digest-recorded-and-pullable]
      mutation:
        on: qm-docker-1
        as: learner
        timeoutSec: 300
        run: |
          cd ~/exam/tracking-build
          printf '%s\n' 'FROM python:3.13-alpine AS build' 'WORKDIR /src' 'COPY build.py .' 'RUN python3 build.py /out/tracking-api' \
            'FROM alpine:3.22' 'COPY --from=build /out/tracking-api /usr/local/bin/tracking-api' 'ENTRYPOINT ["/usr/local/bin/tracking-api"]' > Dockerfile
          docker build --provenance=false --sbom=false -t registry.quillmoor.example:5443/tracking-api-build:{{ver}} .
          docker push registry.quillmoor.example:5443/tracking-api-build:{{ver}}
    - id: single-stage-fat
      description: Sets UID 10001 but keeps the single fat stage, so Python and the build directory ship in the final image.
      feedback: "A non-root UID does not make the image slim. Build in one stage, copy only the finished program into a fresh alpine:3.22 stage, and leave Python and /src behind."
      expectFail: [slim-final-stage]
      mutation:
        on: qm-docker-1
        as: learner
        timeoutSec: 300
        run: |
          cd ~/exam/tracking-build
          printf '%s\n' 'FROM python:3.13-alpine' 'WORKDIR /src' 'COPY build.py build-cache.bin ./' 'RUN python3 build.py /usr/local/bin/tracking-api' \
            'RUN adduser -D -u 10001 tracking' 'USER 10001' 'ENTRYPOINT ["/usr/local/bin/tracking-api"]' > Dockerfile
          docker build --provenance=false --sbom=false -t registry.quillmoor.example:5443/tracking-api-build:{{ver}} .
          docker push registry.quillmoor.example:5443/tracking-api-build:{{ver}}
    - id: digest-not-recorded
      description: Pushes a correct image but never writes the digest file.
      feedback: "The grader compares ~/exam/tracking-build/digest.txt with what the registry reports for the tag. Record the digest after the push."
      expectFail: [digest-recorded-and-pullable]
      mutation:
        on: qm-docker-1
        as: learner
        timeoutSec: 300
        run: |
          cd ~/exam/tracking-build
          cat > Dockerfile <<'DF'
          FROM python:3.13-alpine AS build
          WORKDIR /src
          COPY build.py .
          RUN python3 build.py /out/tracking-api
          FROM alpine:3.22
          RUN adduser -D -u 10001 tracking
          COPY --from=build /out/tracking-api /usr/local/bin/tracking-api
          USER 10001
          ENTRYPOINT ["/usr/local/bin/tracking-api"]
          DF
          docker build --provenance=false --sbom=false -t registry.quillmoor.example:5443/tracking-api-build:{{ver}} .
          docker push registry.quillmoor.example:5443/tracking-api-build:{{ver}}
  solution:
    explanation: |
      A build stage runs the generator; the final alpine stage receives only the finished
      program and a fixed UID 10001 user. After the push, the registry's digest for the tag
      is recorded in digest.txt, which the grader compares with the registry.
    steps:
      - on: qm-docker-1
        as: learner
        timeoutSec: 300
        run: |
          cd ~/exam/tracking-build
          cat > Dockerfile <<'DF'
          FROM python:3.13-alpine AS build
          WORKDIR /src
          COPY build.py .
          RUN python3 build.py /out/tracking-api
          FROM alpine:3.22
          RUN adduser -D -u 10001 tracking
          COPY --from=build /out/tracking-api /usr/local/bin/tracking-api
          USER 10001
          ENTRYPOINT ["/usr/local/bin/tracking-api"]
          DF
          docker build --provenance=false --sbom=false -t registry.quillmoor.example:5443/tracking-api-build:{{ver}} .
          docker push registry.quillmoor.example:5443/tracking-api-build:{{ver}}
          docker buildx imagetools inspect registry.quillmoor.example:5443/tracking-api-build:{{ver}} --format '{{json .Manifest}}' | jq -r .digest > digest.txt
    alternatives:
      - id: digest-from-push-output
        description: Take the digest from the push output and a .dockerignore instead of reading it back with imagetools.
        steps:
          - on: qm-docker-1
            as: learner
            timeoutSec: 300
            run: |
              cd ~/exam/tracking-build
              cat > Dockerfile <<'DF'
              FROM python:3.13-alpine AS build
              WORKDIR /src
              COPY build.py .
              RUN python3 build.py /out/tracking-api
              FROM alpine:3.22
              RUN adduser -D -u 10001 tracking
              COPY --from=build /out/tracking-api /usr/local/bin/tracking-api
              USER 10001
              ENTRYPOINT ["/usr/local/bin/tracking-api"]
              DF
              echo build-cache.bin > .dockerignore
              docker build --provenance=false --sbom=false -t registry.quillmoor.example:5443/tracking-api-build:{{ver}} .
              docker push registry.quillmoor.example:5443/tracking-api-build:{{ver}} | awk '/digest:/ {print $3}' > digest.txt
