# Containers content pack: Docker-first labs set in one fictional media company.
apiVersion: cloudtrain.dev/v1
kind: Pack
metadata:
  id: containers
  title: Containers with Docker
  domain: containers
  version: 1
  owners: [containers-content]
  description: |
    Hands-on container labs on a real Docker Engine 29 host: running, inspecting and
    debugging containers, building images, networks, volumes, registries, Compose,
    security and operations. Every lab is graded automatically on end state (inspect
    output, files, reachability), never on the commands used.

# The fictional organisation every lab in this pack is set in.
universe:
  organisation: Copperleaf Media
  summary: A fictional streaming and publishing company running a video transcoder farm, a catalogue API, a subtitle service, an ad-insertion service and a playout encoder, with a private registry at registry.copperleaf.example.
  namingRules:
    hosts: "cl-<function>-NN (cl-transcode-01, cl-batch-01); the exam host is cl-docker-01"
    images: "copperleaf/<service>:<version> locally, registry.copperleaf.example:5000/<service> in the registry"
    containers: "<service> or <service>-N (probe-1, subtitle-svc)"
    paths: "/srv/<area> for shared data, /etc/copperleaf/<service> for configuration"
    domain: copperleaf.example

# Runtime (see docs/handoffs/containers.md, "Engine design"): every lab is a workstation
# pod (jumphost:1, entry) plus one KubeVirt VM from docker-vm:29 (Ubuntu 24.04, Docker
# Engine 29 with the containerd image store, buildx, compose; preloaded base images,
# no internet). The VM is the isolation boundary: the learner has passwordless sudo
# there, and labs that use the engine put `learner` in the docker group in setup.
# Checks run as root on the VM; they read `docker inspect` JSON with jq (Go templates
# like {{.Name}} would collide with lab {{params}}), files and reachability.
conventions:
  entryNode: workstation
  entryImage: jumphost:1
  hostImage: docker-vm:29
  # Podman labs (ctr-podman-*, ctr-selinux-relabel, ctr-quadlet-reboot and the xct-* exam tasks):
  # cl-podman-01 is an el-vm:10 (SELinux enforcing, Podman from its dnf-local mirror) and
  # cl-registry-01 is a docker-vm:29 holding a TLS registry with the base images; podman-vm:5
  # does not exist. Rootless work is done as `media` (labs) or `examuser` (exam).
  podmanHostImage: el-vm:10

courses:
  - id: ctr-run-inspect
    title: Run, inspect and debug containers
    description: Start, read, exec into, inspect and remove containers on a transcoder host.
    level: beginner
    labs: [ctr-first-transcoder-run, ctr-override-defaults, ctr-exec-into-subtitle, ctr-inspect-report]
  - id: ctr-images-networks-volumes
    title: Images, networks, volumes and housekeeping
    description: Digests, user-defined networks, the three mount types and reclaiming engine storage.
    level: beginner
    labs: [ctr-tag-vs-digest, ctr-user-bridge-dns, ctr-volume-vs-bind, ctr-disk-reclaim]
  - id: ctr-dockerfile-fundamentals
    title: Dockerfile fundamentals
    description: A first Dockerfile with a lean context, build arguments and labels, signals and health checks.
    level: intermediate
    labs: [ctr-dockerfile-catalogue-api, ctr-build-args-labels, ctr-exec-form-signals, ctr-healthcheck]
  - id: ctr-images-efficient
    title: Small, cache-friendly, non-root, reproducible images
    description: Reorder layers for the cache, shrink an image with stages, run as a fixed non-root user, pin bases by digest and rebuild bit for bit.
    level: intermediate
    labs: [ctr-cache-order, ctr-shrink-transcoder, ctr-non-root-uid, ctr-digest-pin, ctr-reproducible-build]
  - id: ctr-images-buildkit
    title: Builders, secrets, caches and multi-platform images
    description: Cache mounts, build secrets, build checks, multi-platform indexes, one definition for many images and cache shared through a registry.
    level: advanced
    labs: [ctr-buildkit-cache-mount, ctr-build-secret-token, ctr-build-checks, ctr-multi-platform, ctr-bake-matrix, ctr-buildx-cache-export]
  - id: ctr-podman-differences
    title: Differences from Docker and rootless operation
    description: Move a Docker routine to a daemonless host, run rootless and clear an SELinux denial on a bind mount.
    level: intermediate
    labs: [ctr-podman-docker-differences, ctr-podman-rootless-basics, ctr-selinux-relabel]
  - id: ctr-podman-services
    title: Pods and systemd services
    description: Pods with secrets, replaying a pod from a manifest, and services that survive a reboot.
    level: intermediate
    labs: [ctr-podman-pod-kube-play, ctr-quadlet-reboot]
  - id: ctr-compose-model
    title: The application model
    description: Describe a stack as a Compose project, drive it from environment files, and layer overrides and profiles.
    level: intermediate
    labs: [ctr-compose-first-stack, ctr-compose-env-interp, ctr-compose-override-profiles]
  - id: ctr-compose-operate
    title: Startup, secrets and the inner loop
    description: Order startup by health, deliver secrets, sync files while developing and repair a broken proxy.
    level: intermediate
    labs: [ctr-compose-healthy-start, ctr-compose-secrets, ctr-compose-watch, ctr-compose-proxy-repair]
  - id: ctr-compose-scale
    title: Composition and distribution
    description: Split a platform file per team and ship an application as an OCI artifact.
    level: advanced
    labs: [ctr-compose-include-split, ctr-compose-oci-publish]
  - id: ctr-net-basics
    title: Bridges, names and published ports
    description: User-defined bridges, publishing on one address only, and reaching a service without publishing it.
    level: intermediate
    labs: [ctr-user-bridge-dns, ctr-publish-scoped, ctr-reach-without-publish]
  - id: ctr-net-host
    title: Host integration, firewall backends and drivers
    description: Address pools, the DOCKER-USER chain, the nftables backend, macvlan and dual-stack networks.
    level: advanced
    labs: [ctr-cidr-clash, ctr-docker-user-chain, ctr-nftables-backend, ctr-macvlan-encoder, ctr-ipv6-dual-stack]
  - id: ctr-net-diagnose
    title: Packet-level diagnosis
    description: Capture on the right veth to find a flooder and fix an MTU hang.
    level: advanced
    labs: [ctr-net-tcpdump-veth, ctr-net-mtu-hang]
  - id: ctr-storage-mounts
    title: Mounts and data operations
    description: Choose mount types, back up and restore a volume, fix bind-mount permissions and mount a model pack from an image.
    level: intermediate
    labs: [ctr-volume-vs-bind, ctr-volume-backup-restore, ctr-bind-permission-denied, ctr-image-mount-models]
  - id: ctr-storage-backends
    title: The image store
    description: Find where layers live and migrate a host to the new image store.
    level: advanced
    labs: [ctr-storage-backend-tour, ctr-containerd-store-migration]
  - id: ctr-registry-run
    title: References and private registries
    description: Run a private registry with TLS and authentication, and reclaim its storage.
    level: intermediate
    labs: [ctr-tag-vs-digest, ctr-local-registry-tls, ctr-registry-gc]
  - id: ctr-registry-distribute
    title: Mirrors, air gaps and OCI artifacts
    description: Route pulls through a mirror, move images across an air gap, and attach an OCI artifact to an image.
    level: intermediate
    labs: [ctr-offline-mirror, ctr-skopeo-copy-airgap, ctr-oci-artifacts-referrers]
  - id: ctr-sec-runtime
    title: Runtime and engine least privilege
    description: Drop capabilities, remove a socket mount, reach an engine over SSH, go rootless, write a seccomp profile and fix a hardening audit.
    level: advanced
    labs: [ctr-cap-drop-readonly, ctr-socket-escape, ctr-remote-engine-ssh, ctr-rootless-engine, ctr-seccomp-profile, ctr-cis-bench]
  - id: ctr-sec-scan
    title: Scanning, policy and hardened bases
    description: Triage scanner findings with a VEX document, meet a supply-chain policy, purge a leaked secret and migrate to a hardened base.
    level: advanced
    labs: [ctr-scan-triage-vex, ctr-scout-policy, ctr-leaked-secret-history, ctr-hardened-base-migration, ctr-dhi-vex-reconcile]
  - id: ctr-sec-supply
    title: Attestations and signatures
    description: Attach SBOM and provenance attestations, sign and verify a release two ways, and build a signed-only release gate.
    level: advanced
    labs: [ctr-sbom-provenance, ctr-content-trust-retired, ctr-cosign-sign-verify, ctr-notation-sign-verify, ctr-signed-only-gate]
