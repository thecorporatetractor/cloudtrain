[[- $secret := lookup "v1" "Secret" .Release.Namespace .Values.credentialsSecret ]]
[[- if not $secret ]]
[[- fail (printf "collector: Secret %q not found in namespace %q; create it before installing" .Values.credentialsSecret .Release.Namespace) ]]
[[- end ]]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  labels:
    app: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: collector
          image: [[ .Values.image ]]
          command: ["sh", "-c", "test -s /etc/collector/ingest-token && sleep 1d"]
          volumeMounts:
            - name: credentials
              mountPath: /etc/collector
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: [[ .Values.credentialsSecret ]]
