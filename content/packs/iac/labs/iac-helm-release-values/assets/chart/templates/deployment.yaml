apiVersion: apps/v1
kind: Deployment
metadata:
  name: [[ .Release.Name ]]
  labels:
    app: [[ .Release.Name ]]
spec:
  replicas: [[ .Values.replicas ]]
  selector:
    matchLabels:
      app: [[ .Release.Name ]]
  template:
    metadata:
      labels:
        app: [[ .Release.Name ]]
      annotations:
        saltmarsh.example/panels: [[ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 12 | quote ]]
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: panels
              mountPath: /usr/local/apache2/htdocs/panels
      volumes:
        - name: panels
          configMap:
            name: [[ .Release.Name ]]-panels
