# Saltmarsh Energy: hosted-platform layout (organisation, projects, workspaces,
# variable sets, team access). Complete this file; the platform project is filled in
# as an example of the shape. Access levels: read, plan, write, admin.
organisation: saltmarsh

projects:
  - name: platform
    team_access:
      platform: admin
    workspaces:
      - name: platform-staging
        environment: staging
        execution_mode: remote
        auto_apply: true
      - name: platform-prod
        environment: prod
        execution_mode: remote
        auto_apply: false

variable_sets:
  - name: cloud-credentials-staging
    workspaces: [platform-staging]
  - name: cloud-credentials-prod
    workspaces: [platform-prod]
