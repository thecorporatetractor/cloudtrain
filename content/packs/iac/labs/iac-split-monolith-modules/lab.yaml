          }

          module "workload" {
            source         = "./modules/workload"
            namespace      = kubernetes_namespace_v1.grid.metadata[0].name
            components     = local.components
            labels         = local.stack_label
            settings_names = module.storage.settings_names
          }
          HCL
          iac init -input=false -no-color >/dev/null
          iac state mv -no-color kubernetes_service_v1.svc module.network.kubernetes_service_v1.svc
          iac state mv -no-color kubernetes_network_policy_v1.default_deny module.network.kubernetes_network_policy_v1.default_deny
          iac state mv -no-color kubernetes_network_policy_v1.allow module.network.kubernetes_network_policy_v1.allow
          iac state mv -no-color kubernetes_config_map_v1.settings module.storage.kubernetes_config_map_v1.settings
          iac state mv -no-color kubernetes_config_map_v1.retention module.storage.kubernetes_config_map_v1.retention
          iac state mv -no-color kubernetes_secret_v1.creds module.storage.kubernetes_secret_v1.creds
          iac state mv -no-color kubernetes_service_account_v1.sa module.workload.kubernetes_service_account_v1.sa
          iac state mv -no-color kubernetes_deployment_v1.app module.workload.kubernetes_deployment_v1.app
          iac apply -auto-approve -input=false -no-color
  solution:
    explanation: |
      Each module receives the namespace, the component map and the labels as
      inputs; storage exposes the ConfigMap names as an output that workload
      consumes. Eight moved blocks (one per resource block, each moving all its
      instances) turn every change into a move, so the plan lists 30 moved objects
      (the namespace stays in the root) and no destroy.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 600
        run: |
          set -e
          cd ~/stacks/grid-telemetry
          mkdir -p modules/network modules/storage modules/workload
          cat > modules/network/main.tf <<'HCL'
          variable "namespace" {
            type = string
          }

          variable "components" {
            type = map(object({ port = number, clients = list(string) }))
          }

          variable "labels" {
            type = map(string)
          }

          resource "kubernetes_service_v1" "svc" {
            for_each = var.components
            metadata {
              name      = each.key
              namespace = var.namespace
              labels    = var.labels
            }
            spec {
              selector = { app = each.key }
              port {
                port        = each.value.port
                target_port = 80
              }
            }
          }

          resource "kubernetes_network_policy_v1" "default_deny" {
            metadata {
              name      = "default-deny"
              namespace = var.namespace
              labels    = var.labels
            }
            spec {
              pod_selector {}
              policy_types = ["Ingress"]
            }
          }

          resource "kubernetes_network_policy_v1" "allow" {
            for_each = var.components
            metadata {
              name      = "allow-${each.key}"
              namespace = var.namespace
              labels    = var.labels
            }
            spec {
              pod_selector {
                match_labels = { app = each.key }
              }
              policy_types = ["Ingress"]
              dynamic "ingress" {
                for_each = each.value.clients
                content {
                  from {
                    pod_selector {
                      match_labels = { app = ingress.value }
                    }
                  }
                  ports {
                    port     = "80"
                    protocol = "TCP"
                  }
                }
              }
            }
          }
          HCL
          cat > modules/storage/main.tf <<'HCL'
          variable "namespace" {
            type = string
          }

          variable "components" {
            type = map(object({ port = number, clients = list(string) }))
          }

          variable "credentials" {
            type = set(string)
          }

          variable "labels" {
            type = map(string)
          }

          output "settings_names" {
            value = { for k, cm in kubernetes_config_map_v1.settings : k => cm.metadata[0].name }
          }

          resource "kubernetes_config_map_v1" "settings" {
            for_each = var.components
            metadata {
              name      = "${each.key}-settings"
              namespace = var.namespace
              labels    = var.labels
            }
            data = {
              COMPONENT = each.key
              PORT      = tostring(each.value.port)
            }
          }

          resource "kubernetes_config_map_v1" "retention" {
            metadata {
              name      = "retention-policy"
              namespace = var.namespace
              labels    = var.labels
            }
            data = {
              raw_days        = "{{rawdays}}"
              aggregated_days = "730"
            }
          }

          resource "kubernetes_secret_v1" "creds" {
            for_each = var.credentials
            metadata {
              name      = "${each.key}-credentials"
              namespace = var.namespace
              labels    = var.labels
            }
            data = {
              username = "svc-${each.key}"
            }
          }
          HCL
          cat > modules/workload/main.tf <<'HCL'
          variable "namespace" {
            type = string
          }

          variable "components" {
            type = map(object({ port = number, clients = list(string) }))
          }

          variable "labels" {
            type = map(string)
          }

          variable "settings_names" {
            type = map(string)
          }

          resource "kubernetes_service_account_v1" "sa" {
            for_each = var.components
            metadata {
              name      = each.key
              namespace = var.namespace
              labels    = var.labels
            }
          }

          resource "kubernetes_deployment_v1" "app" {
            for_each = var.components
            metadata {
              name      = each.key
              namespace = var.namespace
              labels    = var.labels
            }
            spec {
              replicas = 1
              selector {
                match_labels = { app = each.key }
              }
              template {
                metadata {
                  labels = { app = each.key }
                }
                spec {
                  service_account_name = kubernetes_service_account_v1.sa[each.key].metadata[0].name
                  container {
                    name  = each.key
                    image = "httpd:2.4-alpine"
                    env_from {
                      config_map_ref {
                        name = var.settings_names[each.key]
                      }
                    }
                  }
                }
              }
            }
            wait_for_rollout = false
          }
          HCL
          cat > main.tf <<'HCL'
          terraform {
            required_providers {
              kubernetes = {
                source  = "hashicorp/kubernetes"
                version = "~> 3.3.0"
              }
            }
          }

          provider "kubernetes" {
            config_path    = "~/.kube/config"
            config_context = "sm-grid"
          }

          # grid-telemetry: one flat root module that grew to 31 objects.
          locals {
            components = {
              collector = { port = 4317, clients = ["gateway"] }
              historian = { port = 5432, clients = ["collector", "forecast"] }
              alerting  = { port = 9093, clients = ["collector", "historian"] }
              forecast  = { port = 8080, clients = ["gateway"] }
              gateway   = { port = 8443, clients = [] }
            }
            credentials = toset(["historian", "alerting", "forecast"])
            stack_label = { "saltmarsh.example/stack" = "grid-telemetry" }
          }

          resource "kubernetes_namespace_v1" "grid" {
            metadata {
              name = "grid-telemetry"
            }
          }

          module "network" {
            source     = "./modules/network"
            namespace  = kubernetes_namespace_v1.grid.metadata[0].name
            components = local.components
            labels     = local.stack_label
          }

          module "storage" {
            source      = "./modules/storage"
            namespace   = kubernetes_namespace_v1.grid.metadata[0].name
            components  = local.components
            credentials = local.credentials
            labels      = local.stack_label
          }

          module "workload" {
            source         = "./modules/workload"
            namespace      = kubernetes_namespace_v1.grid.metadata[0].name
            components     = local.components
            labels         = local.stack_label
            settings_names = module.storage.settings_names
          }
          HCL
          cat > moved.tf <<'HCL'
          moved {
            from = kubernetes_service_v1.svc
            to   = module.network.kubernetes_service_v1.svc
          }

          moved {
            from = kubernetes_network_policy_v1.default_deny
            to   = module.network.kubernetes_network_policy_v1.default_deny
          }

          moved {
            from = kubernetes_network_policy_v1.allow
            to   = module.network.kubernetes_network_policy_v1.allow
          }

          moved {
            from = kubernetes_config_map_v1.settings
            to   = module.storage.kubernetes_config_map_v1.settings
          }

          moved {
            from = kubernetes_config_map_v1.retention
            to   = module.storage.kubernetes_config_map_v1.retention
          }

          moved {
            from = kubernetes_secret_v1.creds
            to   = module.storage.kubernetes_secret_v1.creds
          }

          moved {
            from = kubernetes_service_account_v1.sa
            to   = module.workload.kubernetes_service_account_v1.sa
          }

          moved {
            from = kubernetes_deployment_v1.app
            to   = module.workload.kubernetes_deployment_v1.app
          }
          HCL
          iac init -input=false -no-color >/dev/null
          iac plan -input=false -no-color
          iac apply -auto-approve -input=false -no-color
