apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: iac-write-only-rotation
  title: Rotate a password held in a write-only argument
  domain: iac
  frameworks: [tf-associate:secrets, tf-professional:credentials-secrets]
  difficulty: medium
  estimatedMinutes: 20
  tags: [terraform, write-only, ephemeral, secrets, rotation]
  version: 1
spec:
  description: |
    The telemetry database credentials in `~/stacks/telemetry-db` (applied on
    `sm-grid`) are generated by an **ephemeral** `random_password` and written to
    the Secret `telemetry-db-credentials` through its **write-only** argument
    `data_wo`, so the password is never stored by Terraform. Quarterly rotation is
    due.

    1. First show why rotation needs a deliberate step: run `terraform plan` and
       save its output to **`~/reports/plan-before-rotation.txt`**. The ephemeral
       password is different on every run, yet the plan reports no changes.
    2. **Rotate** the password the write-only way, by bumping the revision
       attribute, and apply. The Secret must get a new 24-character password
       (the username stays).
    3. Confirm that neither `terraform.tfstate` nor its backup contains the
       password now in the Secret. A plan afterwards reports no changes.
  objectives:
    - Explain why changing a write-only value alone plans no change
    - Rotate a write-only argument by bumping its revision
    - Verify that state holds no secret
  params:
    user:
      type: choice
      values: [telemetry_rw, grid_ingest, scada_writer]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
      - name: sm-grid
        driver: k8s-cluster
        cluster:
          mode: virtual
          version: "v1.37"
          context: sm-grid
  setup:
    - on: workstation
      file: {path: /var/tmp/ct-seed/main.tf, source: assets/main.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/seed.sh, source: assets/seed.sh, mode: "0755"}
    - on: workstation
      run: install -d -o learner -g learner /home/learner/stacks /home/learner/reports
    - on: workstation
      as: learner
      timeoutSec: 240
      run: /var/tmp/ct-seed/seed.sh
    - on: sm-grid
      run: |
        set -eu
        kubectl -n kube-system get configmap ct-baseline-password >/dev/null 2>&1 && exit 0
        kubectl -n kube-system create configmap ct-baseline-password \
          --from-literal=sha=$(kubectl -n telemetry-db get secret telemetry-db-credentials -o jsonpath='{.data.password}' | base64 -d | sha256sum | cut -c1-64)
  teardown:
    - on: sm-grid
      run: kubectl delete namespace telemetry-db --ignore-not-found --wait=false
  checks:
    - id: no-change-shown
      description: ~/reports/plan-before-rotation.txt is a plan that reported no changes
      type: shell
      on: workstation
      skills: [iac.quality.write-only]
      command: grep -q 'No changes' /home/learner/reports/plan-before-rotation.txt 2>/dev/null && echo shown || echo missing
      expect: {match: exact, value: shown}
    - id: password-rotated
      description: The Secret holds a new 24-character password and the same username
      type: shell
      on: sm-grid
      skills: [iac.quality.write-only]
      weight: 2
      timeoutSec: 30
      command: |
        p=$(kubectl -n telemetry-db get secret telemetry-db-credentials -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null)
        u=$(kubectl -n telemetry-db get secret telemetry-db-credentials -o jsonpath='{.data.username}' 2>/dev/null | base64 -d 2>/dev/null)
        [ "$(printf '%s' "$p" | sha256sum | cut -c1-64)" = "$(kubectl -n kube-system get configmap ct-baseline-password -o jsonpath='{.data.sha}')" ] && r=same || r=new
        echo "password=$r length=${#p} user=$u"
      expect: {match: exact, value: "password=new length=24 user={{user}}"}
    - id: revision-bumped
      description: The state records a higher data_wo_revision
      type: shell
      on: workstation
      skills: [iac.quality.write-only]
      timeoutSec: 60
      command: |
        ct-iac state /home/learner/stacks/telemetry-db | jq -r '[.values.root_module.resources[]? | select(.type | test("^kubernetes_secret")) | .values.data_wo_revision][0] // 0 | if . > 1 then "bumped" else "unchanged" end' 2>/dev/null
      expect: {match: exact, value: bumped}
    - id: state-clean
      description: Neither terraform.tfstate nor its backup contains the live password
      type: shell
      on: workstation
      skills: [iac.quality.secrets, iac.quality.write-only]
      weight: 1.5
      timeoutSec: 30
      command: |
        p=$(runuser -u learner -- env -i HOME=/home/learner PATH=/usr/local/bin:/usr/bin:/bin kubectl --context sm-grid -n telemetry-db get secret telemetry-db-credentials -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null)
        [ -n "$p" ] || { echo "no password"; exit 0; }
        n=$(cat /home/learner/stacks/telemetry-db/terraform.tfstate* 2>/dev/null | grep -c -F "$p")
        echo "copies=$n"
      expect: {match: exact, value: copies=0}
    - id: converged
      description: A new plan of ~/stacks/telemetry-db reports no changes
      type: shell
      on: workstation
      skills: [iac.foundations.workflow]
      timeoutSec: 120
      command: ct-iac plan /home/learner/stacks/telemetry-db
      expect: {match: exact, value: no-changes}
  hints:
    - title: Why nothing changes
      body: Terraform never stores or compares a write-only value, so a different ephemeral password is invisible to the plan. Only the revision attribute is compared.
      cost: 1
    - title: Rotating
      body: Increase `data_wo_revision` (1 to 2). The plan then shows an in-place update, and the apply sends the newly generated password.
      cost: 1
    - title: Checking state
      body: Compare the live password with the state files without printing it.
      command: p=$(kubectl --context sm-grid -n telemetry-db get secret telemetry-db-credentials -o jsonpath='{.data.password}' | base64 -d); grep -c -F "$p" ~/stacks/telemetry-db/terraform.tfstate*
      cost: 1
  misconceptions:
    - id: change-the-generator
      description: Changes the password generator's settings and expects that to rotate the password.
      feedback: Arguments of an ephemeral resource are not compared with anything, so the plan stays empty and the Secret keeps its password. Bump data_wo_revision.
      expectFail: [password-rotated, revision-bumped]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 240
        run: |
          cd ~/stacks/telemetry-db
          iac plan -input=false -no-color > ~/reports/plan-before-rotation.txt
          sed -i 's/  special = false/  special = false\n  upper   = true/' main.tf
          iac apply -auto-approve -input=false -no-color
    - id: stored-password
      description: Replaces the ephemeral password with a random_password resource and plain data to force a rotation.
      feedback: That rotates the password, but a random_password resource and the data argument both store it in state. Keep it ephemeral and write-only.
      expectFail: [state-clean, revision-bumped]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 240
        run: |
          cd ~/stacks/telemetry-db
          iac plan -input=false -no-color > ~/reports/plan-before-rotation.txt
          python3 - <<'PY'
          p = "main.tf"; s = open(p).read()
          s = s.replace('ephemeral "random_password" "db" {', 'resource "random_password" "db" {')
          s = s.replace('  data_wo = {\n    username = "{{user}}"\n    password = ephemeral.random_password.db.result\n  }\n  data_wo_revision = 1\n', '  data = {\n    username = "{{user}}"\n    password = random_password.db.result\n  }\n')
          open(p, "w").write(s)
          PY
          iac apply -auto-approve -input=false -no-color
  solution:
    explanation: |
      Write-only arguments are sent to the provider during apply but never recorded,
      so Terraform cannot notice that the ephemeral generator produced a different
      value: the plan is empty. data_wo_revision is the recorded stand-in; raising it
      makes Terraform plan an update, and the apply writes the freshly generated
      password. The state only knows the revision number.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 240
        run: |
          set -e
          cd ~/stacks/telemetry-db
          iac plan -input=false -no-color > ~/reports/plan-before-rotation.txt
          sed -i 's/  data_wo_revision = 1/  data_wo_revision = 2/' main.tf
          iac apply -auto-approve -input=false -no-color
          p=$(kubectl --context sm-grid -n telemetry-db get secret telemetry-db-credentials -o jsonpath='{.data.password}' | base64 -d)
          grep -c -F "$p" terraform.tfstate* || true
