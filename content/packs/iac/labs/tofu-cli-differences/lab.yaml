          printf 'provider_for_each:\n  terraform: false\n  tofu: true\nlifecycle_enabled:\n  terraform: false\n  tofu: true\nexclude_flag:\n  terraform: false\n  tofu: true\n' > ~/reports/differences.yaml
          cd ~/stacks/inland-tofu && tofu init -input=false -no-color >/dev/null
          cd ~/stacks/inland-tofu
          tofu plan -input=false -no-color -exclude=kubernetes_deployment_v1.dashboard
          tofu apply -auto-approve -input=false -no-color -exclude=kubernetes_deployment_v1.dashboard
