apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xia-fmt-validate-gate
  title: Make a stack pass the format and validation gate
  domain: iac
  frameworks: [tf-associate:core-workflow]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, terraform, fmt, validate]
  version: 1
spec:
  description: |
    **Directory:** `~/exam/farm-alerts` (workstation)

    Fix the farm-alerts stack so that `terraform fmt -check -recursive` and
    `terraform validate` (after `terraform init`) both pass. The plan must still
    create one `local_file.alert` per farm in `variables.tf`, at
    `/home/learner/exam/farm-alerts/out/<farm>.alert` with the content
    `farm=<farm> gust_limit=<limit>`, and the output `alert_count` (the number of
    alert files) must stay. Do not apply.
  objectives:
    - Fix formatting and validation errors without changing the plan
  params:
    rm:
      type: int
      min: 19
      max: 26
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
  setup:
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-fmt-validate-gate/variables.tf, source: assets/variables.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-fmt-validate-gate/main.tf, source: assets/main.tf, mode: "0644"}
    - on: workstation
      run: |
        set -eu
        d=/home/learner/exam/farm-alerts
        install -d -o learner -g learner /home/learner/exam "$d"
        [ -e "$d/.ct-seeded" ] && exit 0
        install -m 0644 -o learner -g learner /var/tmp/ct-seed/xia-fmt-validate-gate/variables.tf /var/tmp/ct-seed/xia-fmt-validate-gate/main.tf "$d"/
        touch "$d/.ct-seeded"
  checks:
    - id: fmt-clean
      description: terraform fmt -check -recursive passes
      type: shell
      on: workstation
      skills: [iac.foundations.style]
      timeoutSec: 60
      command: ct-iac run /home/learner/exam/farm-alerts iac fmt -check -recursive >/dev/null 2>&1 && echo ok || echo unformatted
      expect: {match: exact, value: ok}
    - id: validates
      description: init and validate pass on a clean copy
      type: shell
      on: workstation
      skills: [iac.foundations.style]
      weight: 2
      timeoutSec: 120
      command: |
        t=$(mktemp -d /tmp/gatecheck.XXXXXX); cp /home/learner/exam/farm-alerts/*.tf "$t"/ 2>/dev/null; chown -R learner:learner "$t"
        ct-iac run "$t" sh -c 'iac init -backend=false -input=false && iac validate' >/dev/null 2>&1 && r=pass || r=fail
        rm -rf "$t"; echo $r
      expect: {match: exact, value: pass}
    - id: same-plan
      description: The plan creates the same alert files and keeps alert_count
      type: shell
      on: workstation
      skills: [iac.foundations.style]
      weight: 2
      timeoutSec: 120
      command: |
        t=$(mktemp -d /tmp/gateplan.XXXXXX); cp /home/learner/exam/farm-alerts/*.tf "$t"/ 2>/dev/null; chown -R learner:learner "$t"
        ct-iac run "$t" iac init -backend=false -input=false -no-color >/dev/null 2>&1
        ct-iac planjson "$t" | jq -r '([.resource_changes[]? | select(.change.actions == ["create"]) | "\(.address)=\(.change.after.content)"] | sort | join(";")) + " count=\(.planned_values.outputs.alert_count.value // "none")"' 2>/dev/null
        rm -rf "$t"
      expect: {match: exact, value: 'local_file.alert["gullhaven"]=farm=gullhaven gust_limit=18;local_file.alert["redmoor"]=farm=redmoor gust_limit={{rm}} count=2'}
  misconceptions:
    - id: skip-fmt
      description: Fixes the errors but does not format the files.
      feedback: validate ignores layout; run terraform fmt as well.
      expectFail: [fmt-clean]
      mutation:
        on: workstation
        as: learner
        run: |
          cd ~/exam/farm-alerts
          sed -i 's/each\.value\.limit/each.value/; s/lenght(/length(/' main.tf
    - id: drop-output
      description: Deletes the failing output instead of fixing the function name.
      feedback: The gate passes but alert_count disappears. Fix lenght to length.
      expectFail: [same-plan]
      mutation:
        on: workstation
        as: learner
        run: |
          cd ~/exam/farm-alerts
          sed -i 's/each\.value\.limit/each.value/' main.tf
          python3 -c "
          s=open('main.tf').read(); s=s[:s.index('output')]; open('main.tf','w').write(s)"
          iac fmt -recursive
  solution:
    explanation: var.farms is a map of numbers, so each.value is the limit itself; lenght is not a function (length is); fmt fixes the layout.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 120
        run: |
          set -e
          cd ~/exam/farm-alerts
          sed -i 's/each\.value\.limit/each.value/; s/lenght(/length(/' main.tf
          iac fmt -recursive
          iac init -backend=false -input=false -no-color && iac validate -no-color
