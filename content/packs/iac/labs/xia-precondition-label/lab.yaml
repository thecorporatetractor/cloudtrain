apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xia-precondition-label
  title: Refuse to plan into an unbilled namespace
  domain: iac
  frameworks: [tf-associate:custom-conditions]
  difficulty: medium
  estimatedMinutes: 6
  tags: [exam, terraform, precondition, postcondition]
  version: 1
spec:
  description: |
    **Directory:** `~/exam/dashboard-guard` · **Cluster:** `sm-grid`

    The dashboard stack (applied) writes ConfigMap `dashboard-settings` into
    the namespace named by `var.namespace`. Add a **condition** so that
    planning fails with a clear error when that namespace has **no label
    `saltmarsh.example/cost-centre`**; the error message must contain
    `cost-centre`. Planning against a labelled namespace (the default,
    `dash-billed`) must keep working and report no changes. Namespace
    `dash-unbilled` exists for you to test with.
  objectives:
    - Guard a configuration with a precondition or postcondition
  params:
    refresh:
      type: int
      min: 15
      max: 60
    cc:
      type: choice
      values: [cc-7101, cc-7230, cc-7344]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
      - name: sm-grid
        driver: k8s-cluster
        cluster:
          mode: virtual
          version: "v1.37"
          context: sm-grid
  setup:
    - on: sm-grid
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: dash-billed
          labels: {saltmarsh.example/cost-centre: "{{cc}}"}
        ---
        apiVersion: v1
        kind: Namespace
        metadata:
          name: dash-unbilled
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-precondition-label/stack/providers.tf, source: assets/stack/providers.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-precondition-label/stack/main.tf, source: assets/stack/main.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-precondition-label/seed.sh, source: assets/seed.sh, mode: "0755"}
    - on: workstation
      run: install -d -o learner -g learner /home/learner/exam
    - on: workstation
      as: learner
      timeoutSec: 300
      run: /var/tmp/ct-seed/xia-precondition-label/seed.sh xia-precondition-label dashboard-guard apply
  teardown:
    - on: sm-grid
      run: kubectl delete namespace dash-billed dash-unbilled --ignore-not-found --wait=false
  checks:
    - id: refuses-unbilled
      description: Planning against dash-unbilled fails with a condition error that names cost-centre
      type: shell
      on: workstation
      skills: [iac.quality.conditions]
      weight: 3
      timeoutSec: 120
      command: |
        out=$(ct-iac run /home/learner/exam/dashboard-guard iac plan -input=false -lock=false -no-color -var namespace=dash-unbilled 2>&1) && { echo planned; exit 0; }
        echo "$out" | grep -qi 'condition failed' || { echo "other error"; exit 0; }
        echo "$out" | grep -q 'cost-centre' && echo refused || echo "message without cost-centre"
      expect: {match: exact, value: refused}
    - id: billed-still-plans
      description: The default namespace still plans with no changes
      type: shell
      on: workstation
      skills: [iac.quality.conditions]
      weight: 1.5
      timeoutSec: 120
      command: ct-iac plan /home/learner/exam/dashboard-guard
      expect: {match: exact, value: no-changes}
    - id: settings-intact
      description: dashboard-settings is still in dash-billed
      type: k8s-query
      skills: [iac.quality.conditions]
      weight: 0.5
      query: {cluster: sm-grid, resource: configmap, name: dashboard-settings, namespace: dash-billed, jsonpath: "{.data.refresh_seconds}"}
      expect: {match: exact, value: "{{refresh}}"}
  misconceptions:
    - id: name-check
      description: Tests the namespace name instead of its label, with a message that does not say what is missing.
      feedback: Billing is decided by the cost-centre label, not by the name. Test the label the data source read, and say so in the message.
      expectFail: [refuses-unbilled]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 200
        run: |
          cd ~/exam/dashboard-guard
          python3 - <<'PY'
          p = "main.tf"; s = open(p).read()
          s = s.replace('  data = {\n', '  lifecycle {\n    precondition {\n      condition     = var.namespace != "default"\n      error_message = "Wrong namespace."\n    }\n  }\n  data = {\n', 1)
          open(p, "w").write(s)
          PY
  solution:
    steps:
      - on: workstation
        as: learner
        timeoutSec: 200
        run: |
          set -e
          cd ~/exam/dashboard-guard
          python3 - <<'PY'
          p = "main.tf"; s = open(p).read()
          s = s.replace('  data = {\n', '  lifecycle {\n    precondition {\n      condition     = contains(keys(data.kubernetes_namespace_v1.target.metadata[0].labels), "saltmarsh.example/cost-centre")\n      error_message = "Namespace ${var.namespace} has no saltmarsh.example/cost-centre label."\n    }\n  }\n\n  data = {\n', 1)
          open(p, "w").write(s)
          PY
          iac plan -input=false -no-color -detailed-exitcode
    alternatives:
      - id: data-postcondition
        description: A postcondition on the data source tests what it read.
        steps:
          - on: workstation
            as: learner
            timeoutSec: 200
            run: |
              set -e
              cd ~/exam/dashboard-guard
              python3 - <<'PY'
              p = "main.tf"; s = open(p).read()
              s = s.replace('    name = var.namespace\n  }\n}', '    name = var.namespace\n  }\n\n  lifecycle {\n    postcondition {\n      condition     = lookup(self.metadata[0].labels, "saltmarsh.example/cost-centre", "") != ""\n      error_message = "The target namespace must carry a cost-centre label."\n    }\n  }\n}', 1)
              open(p, "w").write(s)
              PY
              iac plan -input=false -no-color -detailed-exitcode
