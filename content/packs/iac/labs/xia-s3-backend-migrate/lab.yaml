apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xia-s3-backend-migrate
  title: Move local state to an S3 backend with locking
  domain: iac
  frameworks: [tf-associate:state]
  difficulty: medium
  estimatedMinutes: 7
  tags: [exam, terraform, backends, s3, state-locking]
  version: 1
spec:
  description: |
    **Directory:** `~/exam/survey-s3` (workstation only)

    The survey stack ({{farm}} survey runs) keeps local state. Move it to the S3-compatible store that
    runs on this workstation:

    - bucket **`saltmarsh-exam`** (exists), key **`survey/terraform.tfstate`**,
    - state locking with a **lock file in the bucket** (`use_lockfile`),
    - connection settings for the local store:

      ```hcl
      region                      = "us-east-1"
      endpoints                   = { s3 = "http://127.0.0.1:8333" }
      use_path_style              = true
      skip_credentials_validation = true
      skip_region_validation      = true
      skip_requesting_account_id  = true
      skip_metadata_api_check     = true
      ```

      (credentials are already in `~/.aws/credentials`; `ct-s3 status`
      shows whether the store is up and `ct-s3 start` starts it).

    The existing resources must move with the state, not be recreated, and no
    local state file may remain in the directory. A plan afterwards reports no
    changes.
  objectives:
    - Configure an S3 backend with lock-file locking
    - Migrate existing state to a new backend
  params:
    farm:
      type: choice
      values: [gullhaven, redmoor, skerrow]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
  setup:
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-s3-backend-migrate/stack/main.tf, source: assets/stack/main.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-s3-backend-migrate/prepare.sh, source: assets/prepare.sh, mode: "0755"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-s3-backend-migrate/seed.sh, source: assets/seed.sh, mode: "0755"}
    - on: workstation
      run: install -d -o learner -g learner /home/learner/exam
    - on: workstation
      as: learner
      timeoutSec: 150
      run: /var/tmp/ct-seed/xia-s3-backend-migrate/prepare.sh
    - on: workstation
      as: learner
      timeoutSec: 150
      run: |
        set -eu
        /var/tmp/ct-seed/xia-s3-backend-migrate/seed.sh xia-s3-backend-migrate survey-s3 apply
        cd ~/exam/survey-s3
        [ -s .ct-baseline ] || iac state show -no-color random_pet.survey | awk -F'"' '/ id +=/{print $2; exit}' > .ct-baseline
  checks:
    - id: remote-state
      description: survey/terraform.tfstate in bucket saltmarsh-exam holds the original resources
      type: shell
      on: workstation
      skills: [iac.state.backends]
      weight: 2
      timeoutSec: 60
      command: |
        ct-s3 ensure >/dev/null 2>&1
        pet=$(cat /home/learner/exam/survey-s3/.ct-baseline 2>/dev/null)
        ct-s3 api GET '/saltmarsh-exam/survey/terraform.tfstate' 2>/dev/null | jq -r --arg pet "$pet" '
          ([.resources[]? | select(.type == "random_pet") | .instances[].attributes.id] | index($pet) != null) as $p
          | ([.resources[]? | select(.type == "local_file")] | length) as $f
          | "pet=\(if $p then "original" else "other" end) files=\($f)"' 2>/dev/null || echo missing
      expect: {match: exact, value: pet=original files=1}
    - id: lockfile-backend
      description: The stack is initialised with an S3 backend for that bucket and key with use_lockfile
      type: shell
      on: workstation
      skills: [iac.state.backends, iac.state.locking]
      weight: 2
      command: |
        jq -r '"\(.backend.type) \(.backend.config.bucket) \(.backend.config.key) lockfile=\(.backend.config.use_lockfile)"' /home/learner/exam/survey-s3/.terraform/terraform.tfstate 2>/dev/null || echo missing
      expect: {match: exact, value: s3 saltmarsh-exam survey/terraform.tfstate lockfile=true}
    - id: no-local-state
      description: No local terraform.tfstate is left in the directory
      type: shell
      on: workstation
      skills: [iac.state.backends]
      command: '[ -e /home/learner/exam/survey-s3/terraform.tfstate ] && echo present || echo gone'
      expect: {match: exact, value: gone}
    - id: converged
      description: A new plan of ~/exam/survey-s3 reports no changes
      type: shell
      on: workstation
      skills: [iac.state.backends]
      weight: 1.5
      timeoutSec: 120
      command: ct-iac plan /home/learner/exam/survey-s3
      expect: {match: exact, value: no-changes}
  misconceptions:
    - id: reconfigure-without-migrate
      description: Switches the backend with -reconfigure, which starts from an empty remote state.
      feedback: -reconfigure ignores the existing state, so Terraform wants to create everything again. Use -migrate-state to copy it.
      expectFail: [remote-state, converged]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 150
        run: |
          cd ~/exam/survey-s3
          cat > backend.tf <<'HCL'
          terraform {
            backend "s3" {
              bucket                      = "saltmarsh-exam"
              key                         = "survey/terraform.tfstate"
              use_lockfile                = true
              region                      = "us-east-1"
              endpoints                   = { s3 = "http://127.0.0.1:8333" }
              use_path_style              = true
              skip_credentials_validation = true
              skip_region_validation      = true
              skip_requesting_account_id  = true
              skip_metadata_api_check     = true
            }
          }
          HCL
          iac init -reconfigure -input=false -no-color
          rm -f terraform.tfstate terraform.tfstate.backup
    - id: no-locking
      description: Migrates the state but leaves locking out.
      feedback: Without use_lockfile (or a lock table) two runs can write the state at the same time. Set use_lockfile = true.
      expectFail: [lockfile-backend]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 150
        run: |
          cd ~/exam/survey-s3
          cat > backend.tf <<'HCL'
          terraform {
            backend "s3" {
              bucket                      = "saltmarsh-exam"
              key                         = "survey/terraform.tfstate"
              region                      = "us-east-1"
              endpoints                   = { s3 = "http://127.0.0.1:8333" }
              use_path_style              = true
              skip_credentials_validation = true
              skip_region_validation      = true
              skip_requesting_account_id  = true
              skip_metadata_api_check     = true
            }
          }
          HCL
          iac init -migrate-state -force-copy -input=false -no-color
          rm -f terraform.tfstate terraform.tfstate.backup
  solution:
    steps:
      - on: workstation
        as: learner
        timeoutSec: 150
        run: |
          set -e
          cd ~/exam/survey-s3
          cat > backend.tf <<'HCL'
          terraform {
            backend "s3" {
              bucket       = "saltmarsh-exam"
              key          = "survey/terraform.tfstate"
              use_lockfile = true

              region                      = "us-east-1"
              endpoints                   = { s3 = "http://127.0.0.1:8333" }
              use_path_style              = true
              skip_credentials_validation = true
              skip_region_validation      = true
              skip_requesting_account_id  = true
              skip_metadata_api_check     = true
            }
          }
          HCL
          iac init -migrate-state -force-copy -input=false -no-color
          rm -f terraform.tfstate terraform.tfstate.backup
          iac plan -input=false -no-color -detailed-exitcode
