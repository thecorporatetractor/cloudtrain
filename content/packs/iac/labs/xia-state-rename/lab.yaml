apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xia-state-rename
  title: Rename a resource without recreating it
  domain: iac
  frameworks: [tf-associate:state]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, terraform, moved, state]
  version: 1
spec:
  description: |
    **Directory:** `~/exam/farm-settings` · **Cluster:** `sm-grid`

    Rename resource **`kubernetes_config_map_v1.cfg`** to
    **`kubernetes_config_map_v1.farm_settings`** in the applied stack. The
    ConfigMap must keep its identity (UID): the plan has to show a move, not a
    replacement. Finish so that a plan reports no changes.
  objectives:
    - Rename a resource address without recreating the object
  params:
    cutin:
      type: choice
      values: ["3.0", "3.5", "4.0"]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
      - name: sm-grid
        driver: k8s-cluster
        cluster:
          mode: virtual
          version: "v1.37"
          context: sm-grid
  setup:
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-state-rename/stack/providers.tf, source: assets/stack/providers.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-state-rename/stack/main.tf, source: assets/stack/main.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-state-rename/seed.sh, source: assets/seed.sh, mode: "0755"}
    - on: workstation
      run: install -d -o learner -g learner /home/learner/exam
    - on: workstation
      as: learner
      timeoutSec: 300
      run: /var/tmp/ct-seed/xia-state-rename/seed.sh xia-state-rename farm-settings apply
    - on: sm-grid
      run: |
        kubectl -n kube-system get configmap ct-xia-state-rename >/dev/null 2>&1 && exit 0
        kubectl -n kube-system create configmap ct-xia-state-rename --from-literal=uid=$(kubectl -n farm-settings-ns get configmap farm-settings -o jsonpath='{.metadata.uid}')
  teardown:
    - on: sm-grid
      run: kubectl delete namespace farm-settings-ns --ignore-not-found --wait=false
  checks:
    - id: same-object
      description: ConfigMap farm-settings keeps its original UID
      type: shell
      on: sm-grid
      skills: [iac.state.refactor]
      weight: 2
      timeoutSec: 30
      command: |
        u=$(kubectl -n farm-settings-ns get configmap farm-settings -o jsonpath='{.metadata.uid}' 2>/dev/null)
        [ -n "$u" ] && [ "$u" = "$(kubectl -n kube-system get configmap ct-xia-state-rename -o jsonpath='{.data.uid}')" ] && echo same || echo "new or missing"
      expect: {match: exact, value: same}
    - id: new-address
      description: The state tracks the ConfigMap at kubernetes_config_map_v1.farm_settings only
      type: shell
      on: workstation
      skills: [iac.state.refactor]
      weight: 2
      timeoutSec: 60
      command: |
        ct-iac state /home/learner/exam/farm-settings | jq -r '[.values.root_module.resources[]? | select(.type | test("^kubernetes_config_map")) | .address] | join(" ")' 2>/dev/null
      expect: {match: exact, value: kubernetes_config_map_v1.farm_settings}
    - id: data-intact
      description: farm-settings still holds its cut-in speed
      type: k8s-query
      skills: [iac.state.refactor]
      weight: 0.5
      query: {cluster: sm-grid, resource: configmap, name: farm-settings, namespace: farm-settings-ns, jsonpath: "{.data.cut_in_ms}"}
      expect: {match: exact, value: "{{cutin}}"}
    - id: converged
      description: A new plan of ~/exam/farm-settings reports no changes
      type: shell
      on: workstation
      skills: [iac.state.refactor]
      timeoutSec: 120
      command: ct-iac plan /home/learner/exam/farm-settings
      expect: {match: exact, value: no-changes}
  misconceptions:
    - id: rename-only
      description: Renames the block and applies without a moved block.
      feedback: A new address is a new resource to Terraform, so it destroys and recreates the ConfigMap. Add a moved block (or move the state entry) first.
      expectFail: [same-object]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 300
        run: |
          cd ~/exam/farm-settings
          sed -i 's/"kubernetes_config_map_v1" "cfg"/"kubernetes_config_map_v1" "farm_settings"/' main.tf
          # destroy and create race on the same name; the second apply finishes the job
          iac apply -auto-approve -input=false -no-color || iac apply -auto-approve -input=false -no-color
  solution:
    steps:
      - on: workstation
        as: learner
        timeoutSec: 300
        run: |
          set -e
          cd ~/exam/farm-settings
          sed -i 's/"kubernetes_config_map_v1" "cfg"/"kubernetes_config_map_v1" "farm_settings"/' main.tf
          printf '\nmoved {\n  from = kubernetes_config_map_v1.cfg\n  to   = kubernetes_config_map_v1.farm_settings\n}\n' >> main.tf
          iac apply -auto-approve -input=false -no-color
    alternatives:
      - id: state-mv
        description: Rename the block and move the state entry with terraform state mv.
        steps:
          - on: workstation
            as: learner
            timeoutSec: 300
            run: |
              set -e
              cd ~/exam/farm-settings
              sed -i 's/"kubernetes_config_map_v1" "cfg"/"kubernetes_config_map_v1" "farm_settings"/' main.tf
              iac state mv kubernetes_config_map_v1.cfg kubernetes_config_map_v1.farm_settings
              iac plan -input=false -no-color -detailed-exitcode
