apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xia-workspace-layout-design
  title: Lay out projects, workspaces and variable sets
  domain: iac
  frameworks: [tf-associate:hcp]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, terraform, hosted-platform, workspaces, variable-sets]
  version: 1
spec:
  description: |
    **File:** `~/exam/layout/layout.yaml` (workstation)

    Saltmarsh is moving its runs to a hosted Terraform platform. Complete the
    skeleton in `~/exam/layout/layout.yaml` (keep its structure and names) so
    that these rules hold:

    1. One project per team: `trading` and `telemetry`. Each team gets `write`
       on its own project only (team name = project name).
    2. Each project holds two workspaces named `<team>-{{env}}` and
       `<team>-prod`; every workspace belongs to exactly one project.
    3. `common-tags` applies to every workspace in the organisation.
    4. `trading-prod-creds` must reach **only** the trading production
       workspace.
    5. `telemetry-creds` applies to every workspace of the telemetry project,
       including ones added later.
  objectives:
    - Map teams and environments onto projects, workspaces and variable sets
  params:
    env:
      type: choice
      values: [staging, preprod]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
  setup:
    - on: workstation
      file: {path: /var/tmp/ct-seed/xia-workspace-layout-design/layout.yaml, source: assets/layout.yaml, mode: "0644"}
    - on: workstation
      run: |
        set -eu
        d=/home/learner/exam/layout
        install -d -o learner -g learner /home/learner/exam "$d"
        [ -e "$d/.ct-seeded" ] && exit 0
        install -m 0644 -o learner -g learner /var/tmp/ct-seed/xia-workspace-layout-design/layout.yaml "$d/layout.yaml"
        touch "$d/.ct-seeded"
  checks:
    - id: projects
      description: One write-access project per team
      type: shell
      on: workstation
      skills: [iac.collaboration.hcp-concepts]
      weight: 1
      command: |
        yq -o json /home/learner/exam/layout/layout.yaml 2>/dev/null | python3 -c "$(cat <<'PY'
        # Rule checks for layout.yaml (read as JSON on stdin). Prints one word per rule asked for.
        import json, sys
        rule, env = sys.argv[1], sys.argv[2]
        try:
            d = json.load(sys.stdin)
            projects = {p["name"]: p for p in d.get("projects") or []}
            vs = {v["name"]: v for v in d.get("variable_sets") or []}
            def ws(p): return sorted(projects.get(p, {}).get("workspaces") or [])
            def s(x): return sorted(x or [])
            if rule == "projects":
                ok = set(projects) == {"trading", "telemetry"} and all(
                    p["team_access"]["team"] == n and p["team_access"]["permission"] == "write" for n, p in projects.items())
            elif rule == "workspaces":
                ok = ws("trading") == sorted(["trading-" + env, "trading-prod"]) and ws("telemetry") == sorted(["telemetry-" + env, "telemetry-prod"])
            elif rule == "common":
                v = vs["common-tags"]; ok = v["global"] is True
            elif rule == "trading-creds":
                v = vs["trading-prod-creds"]; ok = v["global"] is False and s(v["projects"]) == [] and s(v["workspaces"]) == ["trading-prod"]
            elif rule == "telemetry-creds":
                v = vs["telemetry-creds"]; ok = v["global"] is False and s(v["projects"]) == ["telemetry"] and s(v["workspaces"]) == []
            print("ok" if ok else "violated")
        except Exception as e:
            print("unreadable")
        PY
        )" projects {{env}}
      expect: {match: exact, value: ok}
