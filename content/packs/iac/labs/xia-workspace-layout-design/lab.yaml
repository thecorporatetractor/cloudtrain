            elif rule == "trading-creds":
                v = vs["trading-prod-creds"]; ok = v["global"] is False and s(v["projects"]) == [] and s(v["workspaces"]) == ["trading-prod"]
            elif rule == "telemetry-creds":
                v = vs["telemetry-creds"]; ok = v["global"] is False and s(v["projects"]) == ["telemetry"] and s(v["workspaces"]) == []
            print("ok" if ok else "violated")
        except Exception as e:
            print("unreadable")
        PY
        )" common {{env}}
      expect: {match: exact, value: ok}
    - id: trading-creds
      description: trading-prod-creds reaches only trading-prod
      type: shell
      on: workstation
      skills: [iac.collaboration.hcp-concepts]
      weight: 1.5
      command: |
        yq -o json /home/learner/exam/layout/layout.yaml 2>/dev/null | python3 -c "$(cat <<'PY'
        # Rule checks for layout.yaml (read as JSON on stdin). Prints one word per rule asked for.
        import json, sys
        rule, env = sys.argv[1], sys.argv[2]
        try:
            d = json.load(sys.stdin)
