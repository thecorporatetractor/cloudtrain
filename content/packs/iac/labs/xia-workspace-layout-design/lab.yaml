  misconceptions:
    - id: creds-on-project
      description: Attaches trading-prod-creds to the whole trading project.
      feedback: A project-level variable set also reaches trading's non-production workspace. Attach production credentials to the production workspace only.
      expectFail: [trading-creds]
      mutation:
        on: workstation
        as: learner
        run: |
          cd ~/exam/layout
          yq -i '.projects = [{"name": "trading", "team_access": {"team": "trading", "permission": "write"}, "workspaces": ["trading-{{env}}", "trading-prod"]}, {"name": "telemetry", "team_access": {"team": "telemetry", "permission": "write"}, "workspaces": ["telemetry-{{env}}", "telemetry-prod"]}]' layout.yaml
          yq -i '(.variable_sets[] | select(.name == "common-tags") | .global) = true' layout.yaml
          yq -i '(.variable_sets[] | select(.name == "trading-prod-creds") | .projects) = ["trading"]' layout.yaml
          yq -i '(.variable_sets[] | select(.name == "telemetry-creds") | .projects) = ["telemetry"]' layout.yaml
    - id: workspace-list-for-project
      description: Lists the telemetry workspaces on telemetry-creds instead of attaching the project.
      feedback: A workspace list does not cover workspaces added later; attach the variable set to the project.
      expectFail: [telemetry-creds]
      mutation:
        on: workstation
        as: learner
        run: |
          cd ~/exam/layout
          yq -i '.projects = [{"name": "trading", "team_access": {"team": "trading", "permission": "write"}, "workspaces": ["trading-{{env}}", "trading-prod"]}, {"name": "telemetry", "team_access": {"team": "telemetry", "permission": "write"}, "workspaces": ["telemetry-{{env}}", "telemetry-prod"]}]' layout.yaml
          yq -i '(.variable_sets[] | select(.name == "common-tags") | .global) = true' layout.yaml
          yq -i '(.variable_sets[] | select(.name == "trading-prod-creds") | .workspaces) = ["trading-prod"]' layout.yaml
          yq -i '(.variable_sets[] | select(.name == "telemetry-creds") | .workspaces) = ["telemetry-{{env}}", "telemetry-prod"]' layout.yaml
  solution:
    explanation: Projects group each team's workspaces and carry its access; a global variable set reaches every workspace, a project-scoped one every current and future workspace of that project, and a workspace-scoped one only the named workspaces.
    steps:
      - on: workstation
        as: learner
        run: |
          set -e
          cat > ~/exam/layout/layout.yaml <<'YAML'
          organisation: saltmarsh-energy
          projects:
            - name: trading
              team_access:
                team: trading
                permission: write
              workspaces: [trading-{{env}}, trading-prod]
            - name: telemetry
              team_access:
                team: telemetry
                permission: write
              workspaces: [telemetry-{{env}}, telemetry-prod]
          variable_sets:
            - name: common-tags
              global: true
              projects: []
              workspaces: []
            - name: trading-prod-creds
              global: false
              projects: []
              workspaces: [trading-prod]
            - name: telemetry-creds
              global: false
              projects: [telemetry]
              workspaces: []
          YAML
