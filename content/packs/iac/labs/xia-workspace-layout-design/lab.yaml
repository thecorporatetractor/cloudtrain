                ok = set(projects) == {"trading", "telemetry"} and all(
                    p["team_access"]["team"] == n and p["team_access"]["permission"] == "write" for n, p in projects.items())
            elif rule == "workspaces":
                ok = ws("trading") == sorted(["trading-" + env, "trading-prod"]) and ws("telemetry") == sorted(["telemetry-" + env, "telemetry-prod"])
            elif rule == "common":
