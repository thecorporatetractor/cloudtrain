            vs = {v["name"]: v for v in d.get("variable_sets") or []}
            def ws(p): return sorted(projects.get(p, {}).get("workspaces") or [])
            def s(x): return sorted(x or [])
            if rule == "projects":
                ok = set(projects) == {"trading", "telemetry"} and all(
