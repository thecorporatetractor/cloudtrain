      expect: {match: exact, value: ok}
    - id: telemetry-creds
      description: telemetry-creds is attached to the telemetry project
      type: shell
      on: workstation
      skills: [iac.collaboration.hcp-concepts]
      weight: 1.5
      command: |
        yq -o json /home/learner/exam/layout/layout.yaml 2>/dev/null | python3 -c "$(cat <<'PY'
        # Rule checks for layout.yaml (read as JSON on stdin). Prints one word per rule asked for.
