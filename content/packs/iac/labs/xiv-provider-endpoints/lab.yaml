apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xiv-provider-endpoints
  title: Point a provider at private service endpoints
  domain: iac
  frameworks: [tf-advanced:providers]
  difficulty: medium
  estimatedMinutes: 15
  tags: [exam, terraform, providers, endpoints, aws-shaped]
  version: 1
spec:
  description: |
    **Directory:** `~/exam/ops-endpoints` · **Endpoint:** the AWS-shaped API on
    `http://moto:5000`

    The ops stack (not applied yet) was copied from a public-cloud template:
    its provider block talks to the public service endpoints, which this
    estate cannot reach, so every plan fails.

    Configure the AWS provider **in its provider block** so plan and apply
    work offline against the private endpoint set:

    - the **EC2, S3 and STS** endpoints are all `http://moto:5000`;
    - buckets are addressed **path-style**;
    - the provider must **skip** credential validation, the account id lookup
      and the instance metadata check (none of those services exist here).

    Apply the stack; the following plan must be empty.
  objectives:
    - Configure provider endpoints and offline behaviour flags
  params:
    net: {type: int, min: 90, max: 99}
    suffix:
      type: choice
      values: [c4, h8, v2]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
      - name: moto
        driver: container
        image: moto:5
  setup:
    - on: moto
      file: {path: /root/ct-xiv-pe-ops.py, source: assets/moto-ops.py, mode: "0600"}
    - on: moto
      timeoutSec: 120
      run: for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:5000/ && break; sleep 2; done
    - on: workstation
      file: {path: /var/tmp/ct-seed/xiv-provider-endpoints/stack/providers.tf, source: assets/stack/providers.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xiv-provider-endpoints/stack/main.tf, source: assets/stack/main.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xiv-provider-endpoints/seed.sh, source: assets/seed.sh, mode: "0755"}
    - on: workstation
      run: install -d -o learner -g learner /home/learner/exam
    - on: workstation
      as: learner
      timeoutSec: 180
      run: /var/tmp/ct-seed/xiv-provider-endpoints/seed.sh xiv-provider-endpoints ops-endpoints init
  checks:
    - id: created
      description: The ops VPC, its subnet and the runbook bucket exist on the endpoint
      type: shell
      on: moto
      skills: [iac.targets.aws-api]
      weight: 2
      timeoutSec: 60
      command: python3 /root/ct-xiv-pe-ops.py
      expect: {match: exact, value: "vpcs=1:10.{{net}}.0.0/16 subnets=1 buckets=sm-ops-runbooks-{{suffix}}"}
    - id: provider-config
      description: The provider block sets the three endpoints, path-style addressing and the three skips
      type: shell
      on: workstation
      skills: [iac.language.provider-config]
      weight: 3
      timeoutSec: 150
      command: |
        ct-iac planjson /home/learner/exam/ops-endpoints | jq -r '
          [.configuration.provider_config[]? | select(.name == "aws" and (.alias // "") == "")][0].expressions as $e
          | "endpoints=\([($e.endpoints[0] // {}) | to_entries[] | select(.value.constant_value == "http://moto:5000") | .key] | sort | map(select(. == "ec2" or . == "s3" or . == "sts")) | join(","))"
          + " path_style=\($e.s3_use_path_style.constant_value // false)"
          + " skips=\([$e.skip_credentials_validation.constant_value, $e.skip_requesting_account_id.constant_value, $e.skip_metadata_api_check.constant_value] | map(. == true) | all)"' 2>/dev/null
      expect: {match: exact, value: "endpoints=ec2,s3,sts path_style=true skips=true"}
    - id: converged
      description: A new plan of ~/exam/ops-endpoints reports no changes
      type: shell
      on: workstation
      skills: [iac.language.provider-config]
      weight: 1
      timeoutSec: 150
      command: ct-iac plan /home/learner/exam/ops-endpoints
      expect: {match: exact, value: no-changes}
  misconceptions:
    - id: s3-only
      description: Sets only the S3 endpoint and the skips.
      feedback: Each service needs its own endpoint; without ec2 the VPC calls still go to the public endpoint and fail. Set ec2, s3 and sts in the endpoints block.
      expectFail: [created, provider-config, converged]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 400
        run: |
          cd ~/exam/ops-endpoints
          cat > providers.tf <<'HCL'
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.67.0"
              }
            }
          }

          provider "aws" {
            region                      = "eu-west-2"
            max_retries                 = 1
            s3_use_path_style           = true
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
            endpoints {
              s3 = "http://moto:5000"
            }
          }
          HCL
          iac apply -auto-approve -input=false -no-color || true
  solution:
    steps:
      - on: workstation
        as: learner
        timeoutSec: 400
        run: |
          set -e
          cd ~/exam/ops-endpoints
          cat > providers.tf <<'HCL'
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 6.67.0"
              }
            }
          }

          provider "aws" {
            region                      = "eu-west-2"
            s3_use_path_style           = true
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
            endpoints {
              ec2 = "http://moto:5000"
              s3  = "http://moto:5000"
              sts = "http://moto:5000"
            }
          }
          HCL
          iac apply -auto-approve -input=false -no-color
