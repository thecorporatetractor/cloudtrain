apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xiv-replace-and-protect
  title: Replace a corrupted instance and protect its peer
  domain: iac
  frameworks: [tf-advanced:lifecycle-import-drift]
  difficulty: medium
  estimatedMinutes: 15
  tags: [exam, terraform, replace, lifecycle, prevent-destroy, aws-shaped]
  version: 1
spec:
  description: |
    **Directory:** `~/exam/pricing-repair` · **Endpoint:** the AWS-shaped API on
    `http://moto:5000` (the provider block is ready)

    The pricing stack (applied) runs two instances, `pricing-a` and
    `pricing-b`, and the price-history bucket. The disk of
    **`pricing-{{bad}}`** is corrupted.

    1. Replace **only** `pricing-{{bad}}` with a fresh instance through
       Terraform; the other instance must keep running untouched.
    2. Protect the price-history bucket so that any plan that would destroy
       it fails.

    Afterwards a plan must be empty.
  objectives:
    - Force the replacement of a single resource instance
    - Guard a stateful resource with prevent_destroy
  params:
    bad:
      type: choice
      values: [a, b]
    suffix:
      type: choice
      values: [e2w, k7q, r4m]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: terraform-ws:1.15
        access: [shell]
      - name: moto
        driver: container
        image: moto:5
  setup:
    - on: moto
      file: {path: /root/ct-xiv-rap-baseline.py, source: assets/moto-baseline.py, mode: "0600"}
    - on: moto
      file: {path: /root/ct-xiv-rap-check.py, source: assets/moto-check.py, mode: "0600"}
    - on: moto
      timeoutSec: 120
      run: for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:5000/ && break; sleep 2; done
    - on: workstation
      file: {path: /var/tmp/ct-seed/xiv-replace-and-protect/stack/providers.tf, source: assets/stack/providers.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xiv-replace-and-protect/stack/main.tf, source: assets/stack/main.tf, mode: "0644"}
    - on: workstation
      file: {path: /var/tmp/ct-seed/xiv-replace-and-protect/seed.sh, source: assets/seed.sh, mode: "0755"}
    - on: workstation
      run: install -d -o learner -g learner /home/learner/exam
    - on: workstation
      as: learner
      timeoutSec: 300
      run: /var/tmp/ct-seed/xiv-replace-and-protect/seed.sh xiv-replace-and-protect pricing-repair apply
    - on: moto
      timeoutSec: 60
      run: python3 /root/ct-xiv-rap-baseline.py
  checks:
    - id: replaced-one
      description: pricing-{{bad}} is a new instance, the other instance and the bucket are the originals
      type: shell
      on: moto
      skills: [iac.state.drift]
      weight: 3
      timeoutSec: 60
      command: python3 /root/ct-xiv-rap-check.py {{bad}}
      expect: {match: exact, value: corrupted=new healthy=same archive=same}
    - id: protected
      description: A destroy plan of the stack is refused because of the bucket
      type: shell
      on: workstation
      skills: [iac.language.lifecycle]
      weight: 2
      timeoutSec: 150
      command: |
        ct-iac run /home/learner/exam/pricing-repair iac plan -destroy -input=false -lock=false -no-color 2>&1 | grep -q 'prevent_destroy' && echo refused || echo allowed
      expect: {match: exact, value: refused}
    - id: converged
      description: A new plan of ~/exam/pricing-repair reports no changes
      type: shell
      on: workstation
      skills: [iac.state.drift]
      weight: 1
      timeoutSec: 150
      command: ct-iac plan /home/learner/exam/pricing-repair
      expect: {match: exact, value: no-changes}
  misconceptions:
    - id: replace-all
      description: Replaces both pricing instances.
      feedback: '-replace takes one resource instance address, e.g. -replace=''aws_instance.pricing["{{bad}}"]''. Replacing the whole fleet restarts the healthy instance for nothing.'
      expectFail: [replaced-one]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 400
        run: |
          cd ~/exam/pricing-repair
          sed -i 's/  tags   = { team = "trading", data = "price-history" }/  tags   = { team = "trading", data = "price-history" }\n  lifecycle {\n    prevent_destroy = true\n  }/' main.tf
          iac apply -auto-approve -input=false -no-color -replace='aws_instance.pricing["a"]' -replace='aws_instance.pricing["b"]'
    - id: no-guard
      description: Replaces the instance but does not protect the bucket.
      feedback: Nothing stops a later plan from destroying the price history. Add lifecycle { prevent_destroy = true } to the bucket.
      expectFail: [protected]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 400
        run: |
          cd ~/exam/pricing-repair
          iac apply -auto-approve -input=false -no-color -replace='aws_instance.pricing["{{bad}}"]'
  solution:
    steps:
      - on: workstation
        as: learner
        timeoutSec: 400
        run: |
          set -e
          cd ~/exam/pricing-repair
          python3 - <<'PY'
          p = "main.tf"; s = open(p).read()
          s = s.replace('  tags   = { team = "trading", data = "price-history" }\n', '  tags   = { team = "trading", data = "price-history" }\n\n  lifecycle {\n    prevent_destroy = true\n  }\n', 1)
          open(p, "w").write(s)
          PY
          iac apply -auto-approve -input=false -no-color -replace='aws_instance.pricing["{{bad}}"]'
