# Infrastructure-as-code content pack: Terraform-first labs set in one fictional energy company.
apiVersion: cloudtrain.dev/v1
kind: Pack
metadata:
  id: iac
  title: Infrastructure as code with Terraform
  domain: iac
  version: 1
  owners: [iac-content]
  description: |
    Hands-on infrastructure-as-code labs: the core workflow, the HCL language, state,
    modules, conditions and secrets, then team practice, upgrades, incidents and the
    OpenTofu differences. Learners provision real objects (files, Kubernetes objects in
    their own virtual clusters, an AWS-shaped Moto endpoint, a simulated vCenter) fully
    offline. Every lab is graded on target
    truth, state and plan convergence, never on the commands used.

universe:
  organisation: Saltmarsh Energy
  summary: A fictional renewables operator running offshore and inland wind farms, a grid-telemetry platform and an energy trading desk.
  namingRules:
    farms: "gullhaven, redmoor, skerrow (offshore); fenwick, larkholt (inland)"
    stacks: "~/stacks/<stack> on the workstation, one root module per directory"
    contexts: "sm-<area>; the kubeconfig context name equals the cluster node name"
    namespaces: "business function in kebab-case, e.g. grid-telemetry, trading-desk"
    labelDomain: saltmarsh.example
  clusters:
    sm-grid: Grid-telemetry platform (virtual cluster)
    sm-north-sea: Offshore farms cluster (virtual cluster, two-cluster labs)
    sm-inland: Inland farms cluster (virtual cluster, two-cluster labs)
  endpoints:
    moto: AWS-shaped API (Moto) on http://moto:5000, a lab peer node; emulates API shape, not behaviour

# Conventions every lab in this pack follows:
#  - Entry node `workstation` runs catalog ref terraform-ws:1.15 (tools/images/iac). The
#    learner works as `learner`; providers come from the offline mirror (~/.terraformrc).
#  - Statements say `terraform` (Terraform-first). Setup, checks and solutions call `iac`
#    (the image's primary CLI) and `ct-iac` (grading helper: plan status, state and plan
#    JSON, run as the learner), never `terraform`, so a catalog overlay can swap the
#    binary to OpenTofu (deploy/images/overlays/iac-opentofu.yaml) without lab changes.
#  - Checks read state and plan through `show -json` and jq, match resources by type and
#    attributes (never by provider address: registry.terraform.io vs registry.opentofu.org),
#    and grade Kubernetes objects with admin credentials as target truth.
#  - Everything a lab needs to survive hibernation lives under /home/learner.
#  - Kubernetes provider blocks pin `config_context`, so no `use-context` is needed.
conventions:
  entryImage: terraform-ws:1.15

courses:
  - id: iac-core-workflow
    title: Core workflow and providers
    description: Plan, apply and destroy, offline provider installation and lock files, format and validation gates.
    level: beginner
    labs: [iac-first-plan-apply, iac-provider-lock-offline, iac-fmt-validate-repair]
  - id: iac-language-essentials
    title: Language essentials
    description: Data sources, variables, expressions and functions, repetition, dynamic blocks, lifecycle rules and dependencies.
    level: beginner
    labs: [iac-resources-and-data-sources, iac-variables-tfvars-precedence, iac-for-expressions-functions, iac-count-to-for-each, iac-dynamic-blocks-netpol, iac-lifecycle-rules, iac-depends-on-ordering]
  - id: iac-state-backends
    title: State and backends
    description: Inspecting state, refactoring addresses, importing, drift and environments.
    level: beginner
    labs: [iac-state-inspection-report, iac-s3-backend-lockfile, iac-moved-removed-refactor, iac-import-blocks-generate, iac-drift-refresh-only, iac-workspaces-vs-dirs]
  - id: iac-modules
    title: Modules
    description: Writing, calling and refactoring into modules.
    level: beginner
    labs: [iac-first-module, iac-module-sources-versions]
  - id: iac-conditions-secrets
    title: Conditions, secrets and hosted concepts
    description: Validation, pre- and postconditions, check blocks, and keeping secrets out of state.
    level: beginner
    labs: [iac-custom-conditions, iac-secrets-out-of-state, iac-ephemeral-resources, iac-write-only-rotation, iac-hosted-platform-concepts]
  - id: iac-practitioner-targets
    title: Real targets
    description: Helm releases, aliased providers across clusters, an AWS-shaped endpoint, a simulated vCenter and remote state.
    level: intermediate
    labs: [iac-helm-release-values, iac-provider-aliases-two-clusters, iac-moto-vpc-subnets, iac-vcsim-inventory, iac-remote-state-sharing]
  - id: iac-practitioner-quality
    title: Module contracts, tests and policy
    description: Passing providers into modules, terraform test with mocks, and Conftest policy on plan JSON.
    level: intermediate
    labs: [iac-module-provider-passing, iac-module-tests-mocks, iac-opa-plan-policy]
  - id: iac-practitioner-delivery
    title: Pipelines and credentials
    description: Saved-plan pipelines, short-lived credentials, scheduled drift checks and risky-change review.
    level: intermediate
    labs: [iac-saved-plan-pipeline, iac-dynamic-credentials, iac-scheduled-drift-check, iac-risky-change-review]
  - id: iac-practitioner-ops
    title: Upgrades and troubleshooting
    description: Provider and core upgrade campaigns, provider debug logs and unsatisfiable constraints.
    level: intermediate
    labs: [iac-provider-upgrade-campaign, iac-core-version-upgrade, iac-provider-auth-logs, iac-incident-unsatisfiable-constraint]
  - id: iac-practitioner-recent
    title: Query, actions and Stacks
    description: terraform query with list resources, provider actions and a Stacks design exercise (Terraform 1.14+).
    level: intermediate
    labs: [iac-query-bulk-import, iac-provider-actions, iac-stacks-concepts]
  - id: iac-scale-incidents
    title: Refactoring and incidents at scale
    description: Splitting monoliths and large states, dependency cycles, stale locks, out-of-band drift, rename destroys and state recovery.
    level: advanced
    labs: [iac-split-monolith-modules, iac-split-large-state, iac-incident-dependency-cycle, iac-incident-stale-lock, iac-incident-out-of-band-drift, iac-incident-rename-destroy, iac-state-recovery-versions]
  - id: opentofu-differences
    title: OpenTofu differences
    description: Provider iteration, enabled and -exclude, early evaluation, state encryption, OCI distribution and migration from Terraform.
    level: intermediate
    labs: [tofu-cli-differences, tofu-early-evaluation-backend, tofu-state-encryption-pbkdf2, tofu-oci-module-distribution, tofu-migrate-from-terraform]
