apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: api-access-restrict
  title: Restrict access to the Kubernetes API
  domain: kubernetes
  frameworks: [cks:cluster-hardening]
  difficulty: hard
  estimatedMinutes: 25
  tags: [kube-apiserver, anonymous-auth, nodeport, nftables, api-access]
  version: 1
spec:
  description: |
    A penetration test of Quillmoor Logistics' harbour dispatch cluster
    reached the Kubernetes API from a partner integration host on the node
    network, **without any credentials**, and read the cluster's workloads.

    From your workstation (the bastion), switch to context `qm-dispatch`
    (`kubectl config use-context qm-dispatch`). The control plane runs on
    `dispatch-cp-1` (`ssh dispatch-cp-1`, `sudo` works); the API server is a
    static Pod.

    Close all three holes the report lists, without locking out the admin
    kubeconfig on the bastion:

    1. **Anonymous access.** Unauthenticated requests must be rejected (HTTP
       401) everywhere **except** the health endpoints `/livez`, `/readyz` and
       `/healthz`, which the kubelet's probes call without credentials.
    2. **NodePort exposure.** Someone published the API server through a
       `NodePort` Service on port {{nodeport}} of every node. Remove that
       exposure.
    3. **Network reach.** On `dispatch-cp-1`, port 6443 may only be reached
       from the bastion range `192.168.99.0/24`, from the cluster's own nodes,
       from the Pod network `10.244.0.0/16` and from the node itself. Drop
       everything else with nftables.

    Workloads must keep talking to the API through the `kubernetes` Service,
    and both nodes must stay Ready.
  objectives:
    - Limit anonymous authentication to health endpoints with an AuthenticationConfiguration
    - Find and remove a Service that exposes the API server
    - Restrict API server reachability with nftables without breaking the cluster
  params:
    nodeport:
      type: choice
      values: [30443, 31643, 32064]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: qm-dispatch
        driver: k8s-cluster
        image: kubeadm:1.37-sec
        access: [ssh]
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-dispatch
          nodes:
            - {name: dispatch-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: dispatch-wk-1, role: worker}
  setup:
    - on: qm-dispatch
      apply: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata: {name: dispatch-public-status}
        roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
        subjects:
          - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: "system:unauthenticated"}
        ---
        apiVersion: v1
        kind: Service
        metadata: {name: dispatch-api-gateway, namespace: kube-system}
        spec:
          type: NodePort
          selector: {component: kube-apiserver, tier: control-plane}
          ports:
            - {name: https, port: 443, targetPort: 6443, nodePort: {{nodeport}}}
        ---
        apiVersion: v1
        kind: Namespace
        metadata: {name: harbour-ops}
        ---
        apiVersion: v1
        kind: Pod
        metadata: {name: api-client, namespace: harbour-ops}
        spec:
          containers:
            - {name: client, image: busybox:1.37, command: ["sleep", "1d"]}
    # The partner integration host: a second address on the worker's node
    # network interface (192.168.100.200), used by the grader as an outside source.
    - on: qm-dispatch/dispatch-wk-1
      run: |
        set -e
        dev=$(ip -o route get 192.168.100.10 | sed -n 's/.* dev \([^ ]*\).*/\1/p')
        ip addr add 192.168.100.200/32 dev "$dev" 2>/dev/null || true
    - on: qm-dispatch
      timeoutSec: 150
      run: kubectl -n harbour-ops wait pod/api-client --for=condition=Ready --timeout=140s
    - on: qm-dispatch/dispatch-wk-1
      timeoutSec: 60
      run: |
        # Baseline: the partner address reaches the API directly and anonymously.
        for i in $(seq 1 10); do
          code=$(curl -sk -m 5 --interface 192.168.100.200 -o /dev/null -w '%{http_code}' https://192.168.100.10:6443/api/v1/namespaces/harbour-ops/pods || true)
          [ "$code" = 200 ] && exit 0
          sleep 3
        done
        echo "baseline failed: partner address got '$code'" >&2; exit 1
  teardown:
    - on: qm-dispatch
      run: |
        kubectl delete clusterrolebinding dispatch-public-status --ignore-not-found
        kubectl -n kube-system delete service dispatch-api-gateway --ignore-not-found
        kubectl delete namespace harbour-ops --ignore-not-found --wait=false
  checks:
    - id: context
      description: Terminal is using context qm-dispatch
      type: k8s-context
      on: workstation
      skills: [k8s.cli.contexts]
      weight: 0.5
      expect: {match: exact, value: qm-dispatch}
    - id: anonymous-rejected
      description: An anonymous request for Pods gets 401
      type: shell
      on: qm-dispatch/dispatch-cp-1
      skills: [k8s.security.api-server-hardening]
      weight: 3
      timeoutSec: 30
      command: echo "code=$(curl -sk -m 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/api/v1/namespaces/harbour-ops/pods)"
      expect: {match: exact, value: code=401}
    - id: anonymous-version-rejected
      description: Anonymous requests to non-health paths such as /version get 401 too
      type: shell
      on: qm-dispatch/dispatch-cp-1
      skills: [k8s.security.api-server-hardening]
      timeoutSec: 30
      command: echo "code=$(curl -sk -m 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/version)"
      expect: {match: exact, value: code=401}
    - id: health-open
      description: /livez, /readyz and /healthz still answer 200 without credentials
      type: shell
      on: qm-dispatch/dispatch-cp-1
      skills: [k8s.security.api-server-hardening]
      weight: 2
      timeoutSec: 30
      command: |
        for p in livez readyz healthz; do printf '%s=%s ' $p "$(curl -sk -m 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/$p)"; done; echo
      expect: {match: exact, value: "livez=200 readyz=200 healthz=200 "}
    - id: nodeport-removed
      description: No NodePort or LoadBalancer Service targets the API server port 6443
      type: shell
      on: qm-dispatch
      skills: [k8s.security.api-server-hardening]
      weight: 2
      command: |
        kubectl get svc -A -o json | jq '[.items[] | select(.spec.type == "NodePort" or .spec.type == "LoadBalancer") | select(any(.spec.ports[]; .targetPort == 6443 or .targetPort == "6443"))] | length'
      expect: {match: exact, value: "0"}
    - id: outsider-blocked
      description: The partner address can reach neither port 6443 nor port {{nodeport}}
      type: shell
      on: qm-dispatch/dispatch-wk-1
      skills: [k8s.security.api-server-hardening]
      weight: 3
      timeoutSec: 40
      command: |
        a=$(curl -sk -m 6 --interface 192.168.100.200 -o /dev/null -w '%{http_code}' https://192.168.100.10:6443/livez 2>/dev/null); [ "$a" = 000 ] && a=blocked
        b=$(curl -sk -m 6 --interface 192.168.100.200 -o /dev/null -w '%{http_code}' https://192.168.100.11:{{nodeport}}/livez 2>/dev/null); [ "$b" = 000 ] && b=blocked
        echo "direct=$a nodeport=$b"
      expect: {match: exact, value: direct=blocked nodeport=blocked}
    - id: bastion-admin-works
      description: The admin kubeconfig still works from the bastion
      type: shell
      on: qm-dispatch
      skills: [k8s.security.api-server-hardening]
      timeoutSec: 30
      command: kubectl get --raw /api/v1/namespaces/kube-system >/dev/null 2>&1 && echo ok || echo failed
      expect: {match: exact, value: ok}
    - id: pods-reach-api
      description: A Pod on the worker still reaches the API through the kubernetes Service
      type: shell
      on: qm-dispatch
      skills: [k8s.security.api-server-hardening]
      weight: 2
      timeoutSec: 40
      command: |
        out=$(kubectl -n harbour-ops exec api-client -- sh -c 'wget -q -T 6 --no-check-certificate -O - https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT/livez 2>&1; echo " rc=$?"' 2>&1)
        case "$out" in ok*rc=0*) echo reachable ;; *) echo "unreachable: $out" | tr '\n' ' ' ;; esac
      expect: {match: exact, value: reachable}
    - id: nodes-ready
      description: Both nodes are Ready
      type: shell
      on: qm-dispatch
      skills: [k8s.security.api-server-hardening]
      timeoutSec: 60
      command: |
        kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{" "}{end}'
      expect: {match: exact, value: "True True "}
  hints:
    - title: Who is anonymous allowed to be?
      body: |
        `--anonymous-auth=false` also breaks the unauthenticated liveness probes,
        and the kubelet keeps restarting the API server. An
        `AuthenticationConfiguration` (`apiserver.config.k8s.io/v1`, flag
        `--authentication-config`) can keep anonymous access only for listed
        paths under `anonymous.conditions`.
      cost: 2
    - title: Find the exposure
      body: Look for Services whose targetPort is 6443.
      command: kubectl get svc -A -o wide | grep -E 'NodePort|6443'
      cost: 1
    - title: A separate nftables table
      body: |
        Kubernetes and Calico keep their own tables; never flush the ruleset.
        Accept the allowed sources for TCP 6443 in your own `inet` table, then
        drop the rest of TCP 6443.
      cost: 2
    - title: Who needs the API?
      body: The kubelets (node addresses), Pods through the kubernetes Service (Pod addresses), the bastion and the node itself.
      command: kubectl get nodes -o wide
      cost: 1
  misconceptions:
    - id: anonymous-auth-false
      description: Sets --anonymous-auth=false, which also closes the health endpoints.
      feedback: The kubelet's probes call /livez without credentials and start failing. Keep anonymous only for the health paths with an AuthenticationConfiguration.
      expectFail: [health-open]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 600
        run: |
          kubectl config use-context qm-dispatch
          ssh dispatch-cp-1 'sudo bash -s' <<'EOS'
          sed -i 's#^    - kube-apiserver$#    - kube-apiserver\n    - --anonymous-auth=false#' /etc/kubernetes/manifests/kube-apiserver.yaml
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --anonymous-auth=false && [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/livez)" = 401 ] && break
            sleep 5
          done
          nft add table inet qm_api
          nft add chain inet qm_api input '{ type filter hook input priority 0; policy accept; }'
          nft add rule inet qm_api input tcp dport 6443 ip saddr '{ 127.0.0.0/8, 192.168.99.0/24, 192.168.100.10, 192.168.100.11, 10.244.0.0/16 }' accept
          nft add rule inet qm_api input tcp dport 6443 drop
          EOS
          for i in $(seq 1 30); do kubectl -n kube-system delete service dispatch-api-gateway --ignore-not-found --request-timeout=20s && break; sleep 5; done
    - id: nodeport-left
      description: Firewalls port 6443 on the control plane but leaves the NodePort Service.
      feedback: kube-proxy SNATs NodePort traffic to the node's own address, which the firewall allows, so the API stays reachable through every node. Delete the Service.
      expectFail: [nodeport-removed, outsider-blocked]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 600
        run: &authn-and-fw |
          kubectl config use-context qm-dispatch
          ssh dispatch-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/authn
          cat > /etc/kubernetes/authn/authn.yaml <<'EOF'
          apiVersion: apiserver.config.k8s.io/v1
          kind: AuthenticationConfiguration
          anonymous:
            enabled: true
            conditions:
              - path: /livez
              - path: /readyz
              - path: /healthz
          EOF
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"] = [a for a in c["command"] if not a.startswith("--anonymous-auth")] + ["--authentication-config=/etc/kubernetes/authn/authn.yaml"]
          c.setdefault("volumeMounts", []).append({"name": "authn", "mountPath": "/etc/kubernetes/authn", "readOnly": True})
          m["spec"].setdefault("volumes", []).append({"name": "authn", "hostPath": {"path": "/etc/kubernetes/authn", "type": "Directory"}})
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --authentication-config= && [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/version)" = 401 ] && [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/readyz)" = 200 ] && break
            sleep 5
          done
          nft add table inet qm_api
          nft add chain inet qm_api input '{ type filter hook input priority 0; policy accept; }'
          nft add rule inet qm_api input tcp dport 6443 ip saddr '{ 127.0.0.0/8, 192.168.99.0/24, 192.168.100.10, 192.168.100.11, 10.244.0.0/16 }' accept
          nft add rule inet qm_api input tcp dport 6443 drop
          EOS
    - id: bastion-only
      description: Allows only the bastion range and localhost, forgetting the nodes and the Pod network.
      feedback: Pods reach the API through the kubernetes Service with their own addresses, and kubelets use the node addresses. Allow both.
      expectFail: [pods-reach-api]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 600
        run: |
          kubectl config use-context qm-dispatch
          kubectl -n kube-system delete service dispatch-api-gateway
          ssh dispatch-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/authn
          cat > /etc/kubernetes/authn/authn.yaml <<'EOF'
          apiVersion: apiserver.config.k8s.io/v1
          kind: AuthenticationConfiguration
          anonymous:
            enabled: true
            conditions:
              - path: /livez
              - path: /readyz
              - path: /healthz
          EOF
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"].append("--authentication-config=/etc/kubernetes/authn/authn.yaml")
          c.setdefault("volumeMounts", []).append({"name": "authn", "mountPath": "/etc/kubernetes/authn", "readOnly": True})
          m["spec"].setdefault("volumes", []).append({"name": "authn", "hostPath": {"path": "/etc/kubernetes/authn", "type": "Directory"}})
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --authentication-config= && [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/version)" = 401 ] && [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/readyz)" = 200 ] && break
            sleep 5
          done
          nft add table inet qm_api
          nft add chain inet qm_api input '{ type filter hook input priority 0; policy accept; }'
          nft add rule inet qm_api input tcp dport 6443 ip saddr '{ 127.0.0.0/8, 192.168.99.0/24 }' accept
          nft add rule inet qm_api input tcp dport 6443 drop
          EOS
  solution:
    explanation: |
      An AuthenticationConfiguration keeps anonymous authentication only for
      the three health paths, so probes keep working while every other
      unauthenticated request gets 401 (the view binding for
      system:unauthenticated becomes harmless; deleting it too is good
      practice). Deleting the NodePort Service removes the path that kube-proxy
      would SNAT past any control-plane firewall. A dedicated nftables table
      accepts TCP 6443 only from loopback, the bastion range, the node
      addresses and the Pod network, and drops the rest.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 600
        run: *authn-and-fw
      - on: workstation
        as: learner
        run: |
          kubectl -n kube-system delete service dispatch-api-gateway
          kubectl delete clusterrolebinding dispatch-public-status
    alternatives:
      - id: nft-file-with-set
        description: Load the firewall from an nft file with named sets, and remove the exposure first.
        steps:
          - on: workstation
            as: learner
            timeoutSec: 600
            run: |
              kubectl config use-context qm-dispatch
              kubectl -n kube-system delete svc dispatch-api-gateway
              ssh dispatch-cp-1 'sudo bash -s' <<'EOS'
              set -e
              install -d /etc/kubernetes/authn
              printf 'apiVersion: apiserver.config.k8s.io/v1\nkind: AuthenticationConfiguration\nanonymous:\n  enabled: true\n  conditions:\n  - path: /healthz\n  - path: /livez\n  - path: /readyz\n' > /etc/kubernetes/authn/authn.yaml
              m=/etc/kubernetes/manifests/kube-apiserver.yaml
              sed -i 's#^    - kube-apiserver$#    - kube-apiserver\n    - --authentication-config=/etc/kubernetes/authn/authn.yaml#' $m
              sed -i 's#^    volumeMounts:$#    volumeMounts:\n    - mountPath: /etc/kubernetes/authn\n      name: authn\n      readOnly: true#' $m
              sed -i 's#^  volumes:$#  volumes:\n  - hostPath:\n      path: /etc/kubernetes/authn\n      type: Directory\n    name: authn#' $m
              for i in $(seq 1 90); do
                ps -C kube-apiserver -o args= | grep -q -- --authentication-config= && [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/version)" = 401 ] && [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:6443/readyz)" = 200 ] && break
                sleep 5
              done
              cat > /etc/qm-api-guard.nft <<'NFT'
              table inet qm_api_guard {
                set api_clients {
                  type ipv4_addr; flags interval;
                  elements = { 127.0.0.0/8, 192.168.99.0/24, 192.168.100.10, 192.168.100.11, 10.244.0.0/16 }
                }
                chain input {
                  type filter hook input priority filter; policy accept;
                  tcp dport 6443 ip saddr @api_clients accept
                  tcp dport 6443 drop
                }
              }
              NFT
              nft -f /etc/qm-api-guard.nft
              EOS
