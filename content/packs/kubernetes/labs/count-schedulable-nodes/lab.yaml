apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: count-schedulable-nodes
  title: Report how many nodes can take new workloads
  domain: kubernetes
  frameworks: [cka:troubleshooting, cka:workloads-scheduling]
  difficulty: easy
  estimatedMinutes: 8
  tags: [nodes, taints, jsonpath, capacity]
  version: 1
spec:
  description: |
    Capacity planning at Quillmoor Logistics wants a quick headcount before the
    peak-season freight wave: how many nodes of the capacity cluster could accept a
    brand-new Pod right now?

    Work in context `qm-capacity`:

    ```bash
    kubectl config use-context qm-capacity
    ```

    Count the nodes that are **Ready** and do **not** carry any taint with the
    effect `NoSchedule`. Write only that number (digits, nothing else) to
    `{{report}}` on your workstation.

    Count every node in the cluster, control plane included. A taint with the
    effect `PreferNoSchedule` or `NoExecute` is not `NoSchedule`.
    Do not change any node.
  objectives:
    - Read node readiness from conditions
    - Inspect node taints and their effects
    - Write a scripted answer to a file
  params:
    report:
      type: choice
      values:
        - /home/learner/peak-season/schedulable-nodes.txt
        - /home/learner/capacity-review/ready-untainted.txt
    gpuEffect:
      type: choice
      values: [NoSchedule, PreferNoSchedule]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: qm-capacity
        driver: k8s-cluster
        image: kubeadm:1.35
        cluster:
          mode: kubeadm
          version: "1.35"
          context: qm-capacity
          nodes:
            - {name: cap-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: cap-wk-1, role: worker}
            - {name: cap-wk-2, role: worker, taints: ["quillmoor.example/reserved=customs:NoSchedule"]}
            - {name: cap-wk-3, role: worker}
            - {name: cap-wk-4, role: worker}
            - {name: cap-wk-5, role: worker, state: notready}
  setup:
    - on: qm-capacity
      run: |
        # cap-wk-3: soft preference only, still schedulable.
        kubectl taint node cap-wk-3 quillmoor.example/batch-only=true:PreferNoSchedule --overwrite
        # cap-wk-4: GPU node, effect randomised per learner.
        kubectl taint node cap-wk-4 quillmoor.example/gpu- 2>/dev/null || true
        kubectl taint node cap-wk-4 quillmoor.example/gpu=present:{{gpuEffect}} --overwrite
    - on: workstation
      run: |
        mkdir -p "$(dirname '{{report}}')"
        rm -f '{{report}}'
        chown -R learner:learner "$(dirname '{{report}}')"
  teardown:
    - on: qm-capacity
      run: |
        kubectl taint node cap-wk-3 quillmoor.example/batch-only- 2>/dev/null || true
        kubectl taint node cap-wk-4 quillmoor.example/gpu- 2>/dev/null || true
    - on: workstation
      run: rm -f '{{report}}'
  checks:
    - id: report-exists
      description: The report file exists
      type: shell
      on: workstation
      skills: [linux.shell.redirection]
      weight: 0.5
      command: test -f '{{report}}' && echo present || echo missing
      expect: {match: exact, value: present}
    - id: report-only-number
      description: The report contains a single number and nothing else
      type: shell
      on: workstation
      skills: [linux.shell.redirection]
      weight: 0.5
      command: tr -d '[:space:]' < '{{report}}' | grep -Ec '^[0-9]+$' || true
      expect: {match: exact, value: "1"}
    - id: count-correct
      description: The number matches the Ready nodes without a NoSchedule taint
      type: shell
      on: workstation
      skills: [k8s.scheduling.node-status, k8s.scheduling.taints-tolerations, k8s.cli.output-formatting]
      weight: 3
      command: |
        want=$(kubectl --context qm-capacity get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"|"}{.spec.taints[*].effect}{"\n"}{end}' \
          | awk -F'|' '$2=="True" && $3 !~ /(^| )NoSchedule( |$)/' | wc -l)
        got=$(tr -d '[:space:]' < '{{report}}')
        [ "$want" = "$got" ] && echo match || echo "expected $want got $got"
      expect: {match: exact, value: match}
    - id: nodes-untouched
      description: No node taints were removed to make the count easier
      type: shell
      on: qm-capacity
      skills: [k8s.scheduling.taints-tolerations]
      command: kubectl get node cap-wk-2 cap-wk-4 -o jsonpath='{range .items[*]}{.spec.taints[*].effect}{"\n"}{end}' | grep -c . || true
      expect: {match: exact, value: "2"}
  hints:
    - title: Switch context
      body: The question is about the capacity cluster.
      command: kubectl config use-context qm-capacity
      cost: 0
    - title: Readiness first
      body: The STATUS column of `kubectl get nodes` shows readiness. A NotReady node never counts, whatever its taints.
      command: kubectl get nodes
      cost: 1
    - title: Taints are not in the default table
      body: Print each node's taint effects next to its name. Remember that a node may have several taints.
      command: kubectl get nodes -o custom-columns='NODE:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,EFFECTS:.spec.taints[*].effect'
      cost: 2
    - title: Only one effect excludes a node
      body: PreferNoSchedule is a soft preference, so such nodes still count. Write just the digits, e.g. with `echo 3 > file`.
      cost: 3
  misconceptions:
    - id: count-all-ready
      description: Counts every Ready node and ignores taints.
      feedback: A node tainted NoSchedule rejects Pods without a matching toleration, so it cannot take new workloads.
      mutation:
        on: workstation
        as: learner
        run: kubectl --context qm-capacity get nodes --no-headers | awk '$2=="Ready"' | wc -l > '{{report}}'
    - id: exclude-prefer-noschedule
      description: Treats PreferNoSchedule (or any taint) as excluding the node.
      feedback: Only the NoSchedule effect is a hard block. PreferNoSchedule merely tells the scheduler to avoid the node when it can.
      mutation:
        on: workstation
        as: learner
        run: |
          kubectl --context qm-capacity get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"|"}{.spec.taints}{"\n"}{end}' \
            | awk -F'|' '$1=="True" && $2==""' | wc -l > '{{report}}'
    - id: grep-ready
      description: Uses `grep -c Ready` on the node table.
      feedback: The pattern Ready also matches NotReady, and the table says nothing about taints. Filter on the Ready condition and the taint effects explicitly.
      mutation:
        on: workstation
        as: learner
        run: kubectl --context qm-capacity get nodes --no-headers | grep -c Ready > '{{report}}'
    - id: verbose-answer
      description: Writes a sentence or the node list instead of a bare number.
      feedback: Automated consumers read this file; it must contain only the number.
      mutation:
        on: workstation
        as: learner
        run: kubectl --context qm-capacity get nodes > '{{report}}'
  solution:
    explanation: |
      Combine the Ready condition with the taint effects in one jsonpath listing, keep
      lines that are Ready and have no `NoSchedule` effect, count them and write the
      bare number. A `PreferNoSchedule` taint is only a soft preference, so those
      nodes still count. The NotReady worker drops out on its Ready condition (the
      node controller also taints it automatically).
    steps:
      - on: workstation
        as: learner
        run: |
          kubectl config use-context qm-capacity
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"|"}{.spec.taints[*].effect}{"\n"}{end}' \
            | awk -F'|' '$2=="True" && $3 !~ /(^| )NoSchedule( |$)/' | wc -l > '{{report}}'
          cat '{{report}}'
    alternatives:
      - id: describe-and-count
        description: Read `kubectl describe nodes | grep -A3 Taints` and `kubectl get nodes` by eye, then echo the count. Correct as long as the number is right.
        steps:
          - on: workstation
            as: learner
            run: |
              n=0
              for node in $(kubectl --context qm-capacity get nodes -o name); do
                ready=$(kubectl --context qm-capacity get "$node" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
                if [ "$ready" = True ] && ! kubectl --context qm-capacity describe "$node" | sed -n '/^Taints:/,/^Unschedulable:/p' | grep -q ':NoSchedule'; then n=$((n+1)); fi
              done
              echo "$n" > '{{report}}'
