apiVersion: apps/v1
kind: Deployment
metadata:
  name: depot-portal
spec:
  replicas: 1
  selector:
    matchLabels: {app: depot-portal}
  template:
    metadata:
      labels: {app: depot-portal}
    spec:
      containers:
        - name: portal
          image: httpd:2.4-alpine
          envFrom:
            - configMapRef: {name: portal-settings}
          ports:
            - {name: http, containerPort: 80}
