apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: depot-portal}
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: portal-settings
    literals:
      - THEME=standard
      - MAX_UPLOAD_MB=10
      - LOCALE=en-GB
