# Nightly odometer sync for the delivery vans.
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: odometer-sync
  namespace: fleet-telemetry
spec:
  schedule: "15 1 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: busybox:1.37
              command: ["sh", "-c", "echo syncing odometers"]
