# Van tablets post telemetry to /api on the fleet host name.
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: telemetry
  namespace: fleet-telemetry
spec:
  rules:
    - host: HOSTNAME
      http:
        paths:
          - path: /api
            backend:
              serviceName: telemetry-api
              servicePort: 80
