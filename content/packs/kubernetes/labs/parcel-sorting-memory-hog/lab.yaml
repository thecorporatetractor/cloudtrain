apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: parcel-sorting-memory-hog
  title: Find the memory hog in a namespace
  domain: kubernetes
  frameworks: [cka:troubleshooting, ckad:observability-maintenance]
  difficulty: easy
  estimatedMinutes: 8
  tags: [metrics, kubectl-top, troubleshooting]
  version: 1
spec:
  description: |
    The capacity team suspects that one parcel-sorting Pod is eating the
    memory of the fleet cluster's workers.

    Use context `qm-fleet`:

    ```bash
    kubectl config use-context qm-fleet
    ```

    Using the cluster's metrics API (`kubectl top`), find the Pod in
    namespace **`parcel-sorting`** that currently uses the **most memory** and
    write its name, and nothing else, to
    `/home/learner/reports/memory-hog.txt`.
  objectives:
    - Read live resource usage with kubectl top
    - Sort Pods by memory use
  params:
    hog:
      type: choice
      values: [sorter-east, sorter-west, sorter-north]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: qm-fleet
        driver: k8s-cluster
        image: kubeadm:1.37-full
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-fleet
          nodes:
            - {name: fleet-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: fleet-wk-1, role: worker}
            - {name: fleet-wk-2, role: worker}
  setup:
    - on: qm-fleet/fleet-cp-1
      timeoutSec: 400
      run: /opt/cloudtrain/bin/addons-install metrics-server --wait
    - on: qm-fleet
      timeoutSec: 300
      run: |
        set -e
        kubectl create namespace parcel-sorting --dry-run=client -o yaml | kubectl apply -f -
        for p in sorter-east sorter-west sorter-north sorter-south; do
          mb=24; [ "$p" = "{{hog}}" ] && mb=96
          cat <<YAML | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata: {name: $p, namespace: parcel-sorting, labels: {app: parcel-sorter}}
        spec:
          terminationGracePeriodSeconds: 1
          containers:
            - name: sorter
              image: busybox:1.37
              command: ["sh", "-c", "x=\$(head -c ${mb}000000 /dev/zero | tr '\\\\0' s); while true; do sleep 30; done"]
              resources: {requests: {memory: 32Mi}, limits: {memory: 256Mi}}
        YAML
        done
        kubectl -n parcel-sorting wait pod --all --for=condition=Ready --timeout=150s
        for i in $(seq 1 40); do
          [ "$(kubectl top pod -n parcel-sorting --no-headers 2>/dev/null | wc -l)" = 4 ] && break; sleep 5
        done
        kubectl top pod -n parcel-sorting --no-headers | wc -l | grep -qx 4
    - on: workstation
      run: install -d -o learner -g learner /home/learner/reports
  teardown:
    - on: qm-fleet
      run: kubectl delete namespace parcel-sorting --ignore-not-found --wait=false
  checks:
    - id: context
      description: Terminal is using context qm-fleet
      type: k8s-context
      on: workstation
      skills: [k8s.cli.contexts]
      weight: 0.5
      expect: {match: exact, value: qm-fleet}
    - id: hog-named
      description: The report names the Pod with the highest memory use
      type: file
      on: workstation
      target: /home/learner/reports/memory-hog.txt
      skills: [k8s.troubleshooting.resource-usage]
      weight: 2
      expect: {match: regex, value: '^{{hog}}\n?$'}
  hints:
    - title: Switch context
      body: The fleet cluster is qm-fleet.
      command: kubectl config use-context qm-fleet
      cost: 0
    - title: Live usage
      body: "`kubectl top` reads the metrics API, which metrics-server fills from the kubelets."
      command: kubectl top pod -n parcel-sorting
      cost: 1
    - title: Sort it
      command: kubectl top pod -n parcel-sorting --sort-by=memory --no-headers | head -1 | awk '{print $1}'
      body: Write only the name.
      cost: 2
  misconceptions:
    - id: highest-request
      description: Picks the Pod with the highest memory request or limit.
      feedback: Requests and limits are reservations, not use. All four sorters request the same; only the metrics API shows real use.
      expectFail: [hog-named]
      mutation:
        on: workstation
        as: learner
        run: |
          kubectl config use-context qm-fleet
          kubectl -n parcel-sorting get pods --sort-by=.spec.containers[0].resources.requests.memory -o name | tail -1 | cut -d/ -f2 > ~/reports/memory-hog.txt
    - id: ascending-sort
      description: Sorts the plain top output ascending and takes the first line, the smallest user.
      feedback: Plain sort is ascending; --sort-by=memory lists the largest first.
      expectFail: [hog-named]
      mutation:
        on: workstation
        as: learner
        run: |
          kubectl config use-context qm-fleet
          kubectl top pod -n parcel-sorting --no-headers | sort -k3 -h | head -1 | awk '{print $1}' > ~/reports/memory-hog.txt
  solution:
    steps:
      - on: workstation
        as: learner
        run: |
          kubectl config use-context qm-fleet
          kubectl top pod -n parcel-sorting --sort-by=memory --no-headers | head -1 | awk '{print $1}' > ~/reports/memory-hog.txt
