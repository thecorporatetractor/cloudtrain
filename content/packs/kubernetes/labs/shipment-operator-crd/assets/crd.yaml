apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shipmentroutes.logistics.quillmoor.example
  labels: {app.kubernetes.io/part-of: shipment-operator}
spec:
  group: logistics.quillmoor.example
  scope: Namespaced
  names:
    plural: shipmentroutes
    singular: shipmentroute
    kind: ShipmentRoute
    shortNames: [sroute]
  versions:
    - name: v1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Origin, type: string, jsonPath: .spec.origin}
        - {name: Destination, type: string, jsonPath: .spec.destination}
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status'}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: One scheduled freight route between two depots.
              required: [origin, destination]
              properties:
                origin: {type: string, minLength: 1, description: Depot or terminal the route starts at.}
                destination: {type: string, minLength: 1, description: Depot or terminal the route ends at.}
                replicas: {type: integer, minimum: 1, maximum: 5, default: 1, description: Number of route workers the operator runs.}
                priority: {type: string, enum: [standard, express], default: standard, description: Service level of the route.}
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
