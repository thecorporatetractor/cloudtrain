# The shipment operator: watches ShipmentRoute objects and runs one Deployment per route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-operator
  namespace: shipment-system
  labels: {app: shipment-operator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: shipment-operator}
  template:
    metadata:
      labels: {app: shipment-operator}
    spec:
      serviceAccountName: shipment-operator
      terminationGracePeriodSeconds: 1
      containers:
        - name: operator
          image: busybox:1.37
          command: [sh, -c, 'while true; do echo "shipment-operator: watching shipmentroutes"; sleep 30; done']
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
