# Identity and permissions of the shipment operator.
apiVersion: v1
kind: Namespace
metadata:
  name: shipment-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipment-operator
  namespace: shipment-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shipment-operator
  labels: {app.kubernetes.io/part-of: shipment-operator}
rules:
  - apiGroups: [logistics.quillmoor.example]
    resources: [shipmentroutes]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [logistics.quillmoor.example]
    resources: [shipmentroutes/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
