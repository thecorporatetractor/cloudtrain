# Serves the depot map tiles. Reviewed and approved last quarter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: depot-map
  namespace: fleet-telemetry
spec:
  replicas: 1
  selector:
    matchLabels: {app: depot-map}
  template:
    metadata:
      labels: {app: depot-map}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: map
          image: busybox:1.37
          command: ["sh", "-c", "while true; do echo tiles; sleep 30; done"]
          securityContext:
            allowPrivilegeEscalation: false
