# Plans next-day truck routes from the depot schedules.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-planner
  namespace: fleet-telemetry
spec:
  replicas: 1
  selector:
    matchLabels: {app: route-planner}
  template:
    metadata:
      labels: {app: route-planner}
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: planner
          image: busybox:1.37
          command: ["sh", "-c", "while true; do echo planning; sleep 30; done"]
