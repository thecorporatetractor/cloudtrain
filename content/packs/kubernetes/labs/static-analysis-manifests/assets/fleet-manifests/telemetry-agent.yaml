# Collects tyre-pressure and engine telemetry from the depot gateways.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: telemetry-agent
  namespace: fleet-telemetry
spec:
  selector:
    matchLabels: {app: telemetry-agent}
  template:
    metadata:
      labels: {app: telemetry-agent}
    spec:
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sh", "-c", "while true; do date >> /buffer/samples.log && touch /tmp/ok; sleep 5; done"]
          securityContext:
            privileged: true
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ok"]}
            periodSeconds: 3
          volumeMounts:
            - name: buffer
              mountPath: /buffer
      volumes:
        - name: buffer
          hostPath:
            path: /var/lib/qm-telemetry
            type: DirectoryOrCreate
