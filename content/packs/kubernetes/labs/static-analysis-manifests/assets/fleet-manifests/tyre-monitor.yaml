# Raises alerts when tyre pressure drifts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tyre-monitor
  namespace: fleet-telemetry
spec:
  replicas: 1
  selector:
    matchLabels: {app: tyre-monitor}
  template:
    metadata:
      labels: {app: tyre-monitor}
    spec:
      containers:
        - name: monitor
          image: busybox:1.37
          command: ["sh", "-c", "while true; do echo watching; sleep 30; done"]
          securityContext:
            privileged: true
            runAsNonRoot: true
            runAsUser: 1000
