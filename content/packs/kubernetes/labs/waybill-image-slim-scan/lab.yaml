apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: waybill-image-slim-scan
  title: Rebuild an image smaller and scan it
  domain: kubernetes
  frameworks: [cks:supply-chain-security, ckad:design-build]
  difficulty: hard
  estimatedMinutes: 30
  tags: [image-build, multi-stage, trivy, supply-chain]
  version: 1
spec:
  description: |
    The waybill printing service at Quillmoor Logistics ships as a 900 MB
    image built on a full Go toolchain, running as root, and every scan
    lists hundreds of findings.

    On node `fleet-cp-1` (`ssh fleet-cp-1`, `sudo` works) you have the
    source in `/srv/waybill/` (with its `Containerfile`), `buildah` and
    `trivy` with an offline database, and two base images available offline:
    `registry.quillmoor.example/mirror/golang:1.25` (builder) and
    `registry.quillmoor.example/base/static-nonroot:2026.10` (runtime).

    1. Scan the current image `registry.quillmoor.example/waybill/printer:1.0`
       and save the count of HIGH and CRITICAL findings to
       `/srv/waybill/report-before.txt` (one number).
    2. Rewrite the `Containerfile` as a **multi-stage** build whose final
       stage uses the static non-root base, runs as a **non-root** user and
       contains only the binary. Build it as
       `registry.quillmoor.example/waybill/printer:1.1`; it must be **under
       40 MB**.
    3. Scan the new image and write each remaining HIGH or CRITICAL
       vulnerability ID, one per line, to `/srv/waybill/report-after.txt`
       (an empty file if there are none).
  objectives:
    - Write a multi-stage build with a minimal runtime base
    - Run as non-root and keep build tools out of the final image
    - Compare scans before and after
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      # Needs buildah, Trivy with an offline DB and the two base images on the node
      # (kubeadm:1.37-sec plus image-build extras).
      - name: qm-fleet
        driver: k8s-cluster
        image: kubeadm:1.37-sec
        access: [ssh]
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-fleet
          nodes:
            - {name: fleet-cp-1, role: control-plane, taints: []}
  setup:
    - on: qm-fleet/fleet-cp-1
      timeoutSec: 900
      run: |
        set -e
        for t in buildah trivy; do command -v $t >/dev/null || { echo "prerequisite missing: $t is not installed on the node image" >&2; exit 1; }; done
        for i in registry.quillmoor.example/mirror/golang:1.25 registry.quillmoor.example/base/static-nonroot:2026.10; do
          buildah inspect --type image "$i" >/dev/null 2>&1 || { echo "prerequisite missing: base image $i not available offline" >&2; exit 1; }
        done
        mkdir -p /srv/waybill/cmd/printer
        cat > /srv/waybill/go.mod <<'EOF'
        module quillmoor.example/waybill

        go 1.25
        EOF
        cat > /srv/waybill/cmd/printer/main.go <<'EOF'
        package main

        import (
        	"fmt"
        	"net/http"
        )

        func main() {
        	http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) { fmt.Fprintln(w, "waybill printer ready") })
        	_ = http.ListenAndServe(":8080", nil)
        }
        EOF
        cat > /srv/waybill/Containerfile <<'EOF'
        FROM registry.quillmoor.example/mirror/golang:1.25
        WORKDIR /src
        COPY . .
        RUN CGO_ENABLED=0 go build -o /usr/local/bin/waybill-printer ./cmd/printer
        EXPOSE 8080
        ENTRYPOINT ["/usr/local/bin/waybill-printer"]
        EOF
        cd /srv/waybill && buildah bud -q -t registry.quillmoor.example/waybill/printer:1.0 . >/dev/null
  checks:
    - id: before-report
      description: report-before.txt holds the HIGH+CRITICAL count of printer:1.0
      type: shell
      on: qm-fleet/fleet-cp-1
      skills: [k8s.security.supply-chain]
      command: |
        want=$(trivy image --offline-scan --skip-db-update --severity HIGH,CRITICAL --format json registry.quillmoor.example/waybill/printer:1.0 2>/dev/null | jq '[.Results[]?.Vulnerabilities[]?] | length')
        got=$(tr -d ' \n' < /srv/waybill/report-before.txt 2>/dev/null)
        [ "$got" = "$want" ] && echo correct || echo "got '$got'"
      expect: {match: exact, value: correct}
    - id: multi-stage-nonroot
      description: printer:1.1 is built on the static non-root base and runs as a non-root user
      type: shell
      on: qm-fleet/fleet-cp-1
      skills: [k8s.delivery.image-build, k8s.security.image-footprint]
      weight: 2
      command: |
        u=$(buildah inspect --type image registry.quillmoor.example/waybill/printer:1.1 2>/dev/null | jq -r '.OCIv1.config.User // ""')
        froms=$(grep -ci '^FROM' /srv/waybill/Containerfile)
        last=$(grep -i '^FROM' /srv/waybill/Containerfile | tail -n1 | awk '{print $2}')
        case "$u" in ""|0|root|0:*|root:*) nr=no ;; *) nr=yes ;; esac
        echo "stages=$froms final=$last nonroot=$nr"
      expect: {match: regex, value: "^stages=[2-9] final=registry\\.quillmoor\\.example/base/static-nonroot:2026\\.10 nonroot=yes$"}
    - id: small
      description: printer:1.1 is smaller than 40 MB
      type: shell
      on: qm-fleet/fleet-cp-1
      skills: [k8s.security.image-footprint]
      weight: 2
      command: |
        b=$(buildah images --json 2>/dev/null | jq '[.[] | select(any(.names[]?; . == "registry.quillmoor.example/waybill/printer:1.1")) | .size] | first // empty')
        [ -n "$b" ] && [ "$b" -lt 41943040 ] && echo under-40MB || echo "size ${b:-unknown}"
      expect: {match: exact, value: under-40MB}
    - id: after-report
      description: report-after.txt lists exactly the remaining HIGH/CRITICAL IDs of printer:1.1
      type: shell
      on: qm-fleet/fleet-cp-1
      skills: [k8s.security.supply-chain]
      command: |
        want=$(trivy image --offline-scan --skip-db-update --severity HIGH,CRITICAL --format json registry.quillmoor.example/waybill/printer:1.1 2>/dev/null | jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' | sort -u | paste -sd, -)
        [ -f /srv/waybill/report-after.txt ] || { echo missing; exit 0; }
        got=$(grep -v '^\s*$' /srv/waybill/report-after.txt | sort -u | paste -sd, -)
        [ "$got" = "$want" ] && echo correct || echo "got '$got'"
      expect: {match: exact, value: correct}
  hints:
    - title: Two stages
      body: Name the Go stage (`AS build`), start a second `FROM` with the static base and `COPY --from=build` only the binary. Set `USER 65532`.
      cost: 2
    - title: Count findings
      command: ssh fleet-cp-1 "sudo trivy image --offline-scan --skip-db-update --severity HIGH,CRITICAL --format json registry.quillmoor.example/waybill/printer:1.0 | jq '[.Results[]?.Vulnerabilities[]?] | length'"
      body: The JSON output is easiest to count.
      cost: 1
  misconceptions:
    - id: single-stage-root
      description: Swaps to a smaller builder but keeps one stage running as root.
      feedback: A single stage still carries the toolchain; split build and runtime and set a non-root USER.
      expectFail: [multi-stage-nonroot, small]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 900
        run: |
          ssh fleet-cp-1 'sudo bash -s' <<'EOS'
          cd /srv/waybill
          buildah bud -q -t registry.quillmoor.example/waybill/printer:1.1 .
          EOS
  solution:
    explanation: The builder stage compiles a static binary; the final stage from the static non-root base contains only that binary and runs as UID 65532, which drops the image well below 40 MB and removes almost every finding.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 900
        run: |
          ssh fleet-cp-1 'sudo bash -s' <<'EOS'
          set -e
          cd /srv/waybill
          trivy image --offline-scan --skip-db-update --severity HIGH,CRITICAL --format json registry.quillmoor.example/waybill/printer:1.0 | jq '[.Results[]?.Vulnerabilities[]?] | length' > report-before.txt
          cat > Containerfile <<'EOF'
          FROM registry.quillmoor.example/mirror/golang:1.25 AS build
          WORKDIR /src
          COPY . .
          RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /out/waybill-printer ./cmd/printer

          FROM registry.quillmoor.example/base/static-nonroot:2026.10
          COPY --from=build /out/waybill-printer /usr/local/bin/waybill-printer
          USER 65532:65532
          EXPOSE 8080
          ENTRYPOINT ["/usr/local/bin/waybill-printer"]
          EOF
          buildah bud -q -t registry.quillmoor.example/waybill/printer:1.1 .
          trivy image --offline-scan --skip-db-update --severity HIGH,CRITICAL --format json registry.quillmoor.example/waybill/printer:1.1 | jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' | sort -u > report-after.txt
          EOS
