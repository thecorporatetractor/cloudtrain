apiVersion: apps/v1
kind: Deployment
metadata:
  name: quay-display
  labels: {app: quay-display}
spec:
  replicas: 1
  selector:
    matchLabels: {app: quay-display}
  template:
    metadata:
      labels: {app: quay-display}
    spec:
      containers:
        - name: display
          image: caddy:2-alpine
