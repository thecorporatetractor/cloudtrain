# Autoscaling for the ETA forecaster (written for an old cluster).
apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: eta-forecast
  namespace: eta-forecast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eta-forecast
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 65
