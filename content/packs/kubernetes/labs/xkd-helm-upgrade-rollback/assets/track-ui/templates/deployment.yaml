# Delimiters are written as [[ ]] and turned into Helm braces by the lab setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: [[ .Release.Name ]]
  labels:
    app: [[ .Release.Name ]]
    chart: [[ .Chart.Name ]]-[[ .Chart.Version ]]
spec:
  replicas: [[ .Values.replicas ]]
  selector:
    matchLabels:
      app: [[ .Release.Name ]]
  template:
    metadata:
      labels:
        app: [[ .Release.Name ]]
        chart: [[ .Chart.Name ]]-[[ .Chart.Version ]]
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: web
          image: busybox:1.37
          env:
            - name: BANNER
              value: [[ .Values.banner | quote ]]
          command: ["sh", "-c", "mkdir -p /www && echo \"$BANNER\" > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
