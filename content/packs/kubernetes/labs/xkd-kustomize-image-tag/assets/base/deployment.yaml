apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parcel-api
  template:
    metadata:
      labels:
        app: parcel-api
    spec:
      containers:
        - name: api
          image: registry.quillmoor.example/parcel-api:2.6
          ports:
            - containerPort: 8080
