apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xkd-rolling-strategy
  title: Set a rolling update strategy and roll out
  domain: kubernetes
  frameworks: [ckad:deployment]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, rolling-update, deployments]
  version: 1
spec:
  description: |
    **Context:** `qm-dispatch` (`kubectl config use-context qm-dispatch`)

    In namespace `manifest-desk`, configure the Deployment
    **`manifest-api`** to roll out with **maxSurge 2** and
    **maxUnavailable 0**. Then roll it out from `httpd:2.4-alpine` to the
    image **`httpd:2.4`** as a rolling update of the existing Deployment and
    let the rollout finish.
  objectives:
    - Configure a RollingUpdate strategy and perform a rollout
  params:
    replicas:
      type: int
      min: 3
      max: 4
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: qm-dispatch
        driver: k8s-cluster
        cluster:
          mode: virtual
          version: "v1.37"
          context: qm-dispatch
  setup:
    - on: qm-dispatch
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata: {name: manifest-desk}
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: manifest-api, namespace: manifest-desk}
        spec:
          replicas: {{replicas}}
          selector: {matchLabels: {app: manifest-api}}
          template:
            metadata: {labels: {app: manifest-api}}
            spec:
              terminationGracePeriodSeconds: 2
              containers:
                - name: api
                  image: httpd:2.4-alpine
                  ports: [{name: http, containerPort: 80}]
    - on: qm-dispatch
      timeoutSec: 150
      run: kubectl -n manifest-desk rollout status deploy/manifest-api --timeout=140s
  teardown:
    - on: qm-dispatch
      run: kubectl delete namespace manifest-desk --ignore-not-found --wait=false
  checks:
    - id: strategy
      description: RollingUpdate with maxSurge 2 and maxUnavailable 0
      type: k8s-query
      skills: [k8s.workloads.rollouts]
      weight: 2
      query: {cluster: qm-dispatch, resource: deployment, name: manifest-api, namespace: manifest-desk, jsonpath: "{.spec.strategy.type} {.spec.strategy.rollingUpdate.maxSurge}/{.spec.strategy.rollingUpdate.maxUnavailable}"}
      expect: {match: exact, value: RollingUpdate 2/0}
    - id: image
      description: manifest-api runs httpd:2.4 on all {{replicas}} Pods
      type: k8s-query
      skills: [k8s.workloads.rollouts]
      query: {cluster: qm-dispatch, resource: deployment, name: manifest-api, namespace: manifest-desk, jsonpath: "{.spec.template.spec.containers[0].image} {.status.updatedReplicas}/{.status.readyReplicas}/{.spec.replicas}"}
      expect: {match: exact, value: "httpd:2.4 {{replicas}}/{{replicas}}/{{replicas}}"}
    - id: rolled-not-recreated
      description: The change was rolled out on the existing Deployment (revision 2 or later)
      type: k8s-query
      skills: [k8s.workloads.rollouts]
      query: {cluster: qm-dispatch, resource: deployment, name: manifest-api, namespace: manifest-desk, jsonpath: '{.metadata.annotations.deployment\.kubernetes\.io/revision}'}
      expect: {match: regex, value: '^([2-9]|[1-9][0-9]+)$'}
  misconceptions:
    - id: recreate
      description: Switches the strategy to Recreate, which stops every Pod before starting new ones.
      feedback: Recreate has downtime by design. maxUnavailable 0 with a surge keeps full capacity during the rollout.
      expectFail: [strategy]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 150
        run: |
          kubectl config use-context qm-dispatch
          kubectl -n manifest-desk patch deploy manifest-api --type=merge -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
          kubectl -n manifest-desk set image deploy/manifest-api api=httpd:2.4
          kubectl -n manifest-desk rollout status deploy/manifest-api --timeout=120s
    - id: delete-and-recreate
      description: Deletes the Deployment and creates it again with the new image, which drops its history and causes an outage.
      feedback: A rollout updates the template of the existing Deployment; recreating it starts again at revision 1 with downtime in between.
      expectFail: [rolled-not-recreated]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 150
        run: |
          kubectl config use-context qm-dispatch
          kubectl -n manifest-desk get deploy manifest-api -o yaml \
            | yq 'del(.status) | del(.metadata.uid) | del(.metadata.resourceVersion) | del(.metadata.creationTimestamp) | del(.metadata.managedFields) | del(.metadata.annotations) | del(.metadata.generation)
                  | .spec.strategy = {"type": "RollingUpdate", "rollingUpdate": {"maxSurge": 2, "maxUnavailable": 0}} | .spec.template.spec.containers[0].image = "httpd:2.4"' > d.yaml
          kubectl -n manifest-desk delete deploy manifest-api --wait=true
          kubectl apply -f d.yaml
          kubectl -n manifest-desk rollout status deploy/manifest-api --timeout=120s
  solution:
    steps:
      - on: workstation
        as: learner
        timeoutSec: 180
        run: |
          kubectl config use-context qm-dispatch
          kubectl -n manifest-desk patch deployment manifest-api -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":2,"maxUnavailable":0}}}}'
          kubectl -n manifest-desk set image deployment/manifest-api api=httpd:2.4
          kubectl -n manifest-desk rollout status deployment/manifest-api --timeout=150s
