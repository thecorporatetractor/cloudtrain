apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xks-audit-policy-secrets
  title: Write and enable an audit policy
  domain: kubernetes
  frameworks: [cks:monitoring-runtime-security]
  difficulty: hard
  estimatedMinutes: 12
  tags: [exam, audit, audit-policy, kube-apiserver]
  version: 1
spec:
  description: |
    Context: `qm-ledger`. The API server is a static Pod on `ledger-cp-1`
    (`ssh ledger-cp-1`, `sudo` works).

    Enable audit logging on the qm-ledger API server:

    - policy file: `/etc/kubernetes/audit/exam-policy.yaml`
    - log file: `/var/log/kubernetes/audit/exam.log`
    - keep at most **{{backups}}** rotated log files

    The policy must record every request on **Secrets** at the **Metadata**
    level and record **nothing** for **Events** (core group and
    `events.k8s.io`). Other requests may be logged at any level.
  objectives:
    - Order audit policy rules so the first match is the intended one
    - Configure audit log flags and mounts on a static Pod
  params:
    backups:
      type: choice
      values: [3, 5, 7]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      # Canonical sim-k8s-security cluster: every K-tier exam task shares it.
      - name: qm-ledger
        driver: k8s-cluster
        image: kubeadm:1.37
        access: [ssh]
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-ledger
          nodes:
            - {name: ledger-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: ledger-wk-1, role: worker}
            - {name: ledger-wk-2, role: worker}
  setup:
    - on: qm-ledger
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata: {name: ledger-audit}
        ---
        apiVersion: v1
        kind: Secret
        metadata: {name: ledger-key, namespace: ledger-audit}
        stringData: {key: not-a-real-key}
  teardown:
    - on: qm-ledger
      run: kubectl delete namespace ledger-audit --ignore-not-found --wait=false
  checks:
    - id: flags
      description: kube-apiserver runs with the policy file, log path and backup count
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.audit-logging]
      command: |
        a=$(ps -C kube-apiserver -o args= | tr ' ' '\n')
        echo "policy=$(echo "$a" | sed -n 's/^--audit-policy-file=//p') log=$(echo "$a" | sed -n 's/^--audit-log-path=//p') backups=$(echo "$a" | sed -n 's/^--audit-log-maxbackup=//p')"
      expect: {match: exact, value: "policy=/etc/kubernetes/audit/exam-policy.yaml log=/var/log/kubernetes/audit/exam.log backups={{backups}}"}
    - id: secrets-metadata
      description: A Secret read is logged at Metadata level
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.audit-logging]
      weight: 3
      timeoutSec: 45
      command: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        log=/var/log/kubernetes/audit/exam.log
        [ -s $log ] || { echo "no log"; exit 0; }
        kubectl -n ledger-audit get secret ledger-key -o name >/dev/null 2>&1
        for i in $(seq 1 15); do
          lvl=$(tail -n 5000 $log | jq -r 'select(.objectRef.resource=="secrets" and .objectRef.name=="ledger-key" and .stage != "RequestReceived") | .level' 2>/dev/null | tail -n1)
          [ -n "$lvl" ] && break; sleep 2
        done
        echo "level=${lvl:-not-logged}"
      expect: {match: exact, value: level=Metadata}
    - id: events-not-logged
      description: Creating an Event leaves no audit entry for events
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.audit-logging]
      weight: 3
      timeoutSec: 45
      command: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        log=/var/log/kubernetes/audit/exam.log
        [ -s $log ] || { echo "no log"; exit 0; }
        name=qm-audit-probe-$(date +%s)
        cat <<EOF | kubectl create -f - >/dev/null 2>&1
        apiVersion: v1
        kind: Event
        metadata: {name: $name, namespace: ledger-audit}
        involvedObject: {kind: Namespace, name: ledger-audit}
        reason: AuditProbe
        message: exam probe
        type: Normal
        EOF
        sleep 6
        n=$(jq -c 'select(.objectRef.resource=="events")' $log 2>/dev/null | wc -l)
        echo "event-entries=$n"
      expect: {match: exact, value: event-entries=0}
  misconceptions:
    - id: catch-all-first
      description: Puts a catch-all Metadata rule before the rule for Events.
      feedback: 'The first matching rule wins. Put the `level: None` rule for events above any catch-all.'
      expectFail: [events-not-logged]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 600
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/audit /var/log/kubernetes/audit
          cat > /etc/kubernetes/audit/exam-policy.yaml <<'EOF'
          apiVersion: audit.k8s.io/v1
          kind: Policy
          rules:
            - level: Metadata
            - level: None
              resources:
                - group: ""
                  resources: [events]
                - group: events.k8s.io
                  resources: [events]
          EOF
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"] += ["--audit-policy-file=/etc/kubernetes/audit/exam-policy.yaml", "--audit-log-path=/var/log/kubernetes/audit/exam.log", "--audit-log-maxbackup={{backups}}"]
          c.setdefault("volumeMounts", []).extend([{"name": "audit", "mountPath": "/etc/kubernetes/audit", "readOnly": True}, {"name": "audit-log", "mountPath": "/var/log/kubernetes/audit"}])
          m["spec"].setdefault("volumes", []).extend([{"name": "audit", "hostPath": {"path": "/etc/kubernetes/audit", "type": "Directory"}}, {"name": "audit-log", "hostPath": {"path": "/var/log/kubernetes/audit", "type": "DirectoryOrCreate"}}])
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --audit-policy-file= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
    - id: secrets-request-level
      description: Logs Secrets at RequestResponse.
      feedback: The task asks for Metadata; bodies of Secret requests would put secret values into the log.
      expectFail: [secrets-metadata]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 600
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/audit /var/log/kubernetes/audit
          cat > /etc/kubernetes/audit/exam-policy.yaml <<'EOF'
          apiVersion: audit.k8s.io/v1
          kind: Policy
          rules:
            - level: None
              resources:
                - group: ""
                  resources: [events]
                - group: events.k8s.io
                  resources: [events]
            - level: RequestResponse
              resources:
                - group: ""
                  resources: [secrets]
          EOF
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"] += ["--audit-policy-file=/etc/kubernetes/audit/exam-policy.yaml", "--audit-log-path=/var/log/kubernetes/audit/exam.log", "--audit-log-maxbackup={{backups}}"]
          c.setdefault("volumeMounts", []).extend([{"name": "audit", "mountPath": "/etc/kubernetes/audit", "readOnly": True}, {"name": "audit-log", "mountPath": "/var/log/kubernetes/audit"}])
          m["spec"].setdefault("volumes", []).extend([{"name": "audit", "hostPath": {"path": "/etc/kubernetes/audit", "type": "Directory"}}, {"name": "audit-log", "hostPath": {"path": "/var/log/kubernetes/audit", "type": "DirectoryOrCreate"}}])
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --audit-policy-file= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
  solution:
    explanation: Rules are evaluated top-down; the events rule with level None comes first, then Secrets at Metadata, then an optional catch-all.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 600
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/audit /var/log/kubernetes/audit
          cat > /etc/kubernetes/audit/exam-policy.yaml <<'EOF'
          apiVersion: audit.k8s.io/v1
          kind: Policy
          omitStages: [RequestReceived]
          rules:
            - level: None
              resources:
                - group: ""
                  resources: [events]
                - group: events.k8s.io
                  resources: [events]
            - level: Metadata
              resources:
                - group: ""
                  resources: [secrets]
            - level: Metadata
          EOF
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"] += ["--audit-policy-file=/etc/kubernetes/audit/exam-policy.yaml", "--audit-log-path=/var/log/kubernetes/audit/exam.log", "--audit-log-maxbackup={{backups}}"]
          c.setdefault("volumeMounts", []).extend([{"name": "audit", "mountPath": "/etc/kubernetes/audit", "readOnly": True}, {"name": "audit-log", "mountPath": "/var/log/kubernetes/audit"}])
          m["spec"].setdefault("volumes", []).extend([{"name": "audit", "hostPath": {"path": "/etc/kubernetes/audit", "type": "Directory"}}, {"name": "audit-log", "hostPath": {"path": "/var/log/kubernetes/audit", "type": "DirectoryOrCreate"}}])
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --audit-policy-file= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
    alternatives:
      - id: secrets-only
        description: Log only Secrets (Metadata) and nothing else at all.
        steps:
          - on: workstation
            as: learner
            timeoutSec: 600
            run: |
              ssh ledger-cp-1 'sudo bash -s' <<'EOS'
              set -e
              mkdir -p /etc/kubernetes/audit
              printf 'apiVersion: audit.k8s.io/v1\nkind: Policy\nrules:\n- level: Metadata\n  resources:\n  - group: ""\n    resources: ["secrets"]\n- level: None\n' > /etc/kubernetes/audit/exam-policy.yaml
              m=/etc/kubernetes/manifests/kube-apiserver.yaml
              sed -i 's#^    - kube-apiserver$#    - kube-apiserver\n    - --audit-policy-file=/etc/kubernetes/audit/exam-policy.yaml\n    - --audit-log-path=/var/log/kubernetes/audit/exam.log\n    - --audit-log-maxbackup={{backups}}#' $m
              sed -i 's#^    volumeMounts:$#    volumeMounts:\n    - mountPath: /etc/kubernetes/audit/exam-policy.yaml\n      name: audit-policy\n      readOnly: true\n    - mountPath: /var/log/kubernetes/audit\n      name: audit-log#' $m
              sed -i 's#^  volumes:$#  volumes:\n  - hostPath:\n      path: /etc/kubernetes/audit/exam-policy.yaml\n      type: File\n    name: audit-policy\n  - hostPath:\n      path: /var/log/kubernetes/audit\n      type: DirectoryOrCreate\n    name: audit-log#' $m
              for i in $(seq 1 90); do
                ps -C kube-apiserver -o args= | grep -q -- --audit-policy-file= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
                sleep 5
              done
              EOS
