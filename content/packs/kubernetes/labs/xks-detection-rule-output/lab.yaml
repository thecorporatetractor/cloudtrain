apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xks-detection-rule-output
  title: Adjust a detection rule's output
  domain: kubernetes
  frameworks: [cks:monitoring-runtime-security]
  difficulty: medium
  estimatedMinutes: 8
  tags: [exam, falco, runtime-detection]
  version: 1
spec:
  description: |
    Context: `qm-ledger`. Falco runs as the DaemonSet `falco` in namespace
    `falco`, one Pod per node, and writes its alerts as JSON lines to its Pod
    log. Each Falco Pod loads extra rules from `/etc/falco/rules.d/` of its
    own node. Node `ledger-wk-1` is reachable with `ssh ledger-wk-1`
    (`sudo` works).

    The rule **`Fleet secret file read`** in
    `/etc/falco/rules.d/qm-ledger.yaml` on `ledger-wk-1` alerts when a
    container reads `/etc/shadow`, but its output lacks context.

    1. Change the rule's output so that every alert also contains the
       **container name** and the **user name** (Falco fields
       `container.name` and `user.name`), and make the Falco Pod on
       `ledger-wk-1` use the new rule.
    2. Copy one complete alert line (one JSON line from the Falco log)
       produced by the changed rule to `~/exam/fleet-alert.txt` on your
       workstation.
  objectives:
    - Change a Falco rule's output fields and reload it in a Falco DaemonSet
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      # Canonical sim-k8s-security cluster: every K-tier exam task shares it.
      - name: qm-ledger
        driver: k8s-cluster
        image: kubeadm:1.37-sec
        access: [ssh]
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-ledger
          nodes:
            - {name: ledger-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: ledger-wk-1, role: worker}
            - {name: ledger-wk-2, role: worker}
  setup:
    - on: qm-ledger/ledger-wk-1
      run: |
        mkdir -p /etc/falco/rules.d
        cat > /etc/falco/rules.d/qm-ledger.yaml <<'EOF'
        # Falco reports only the first matching rule per event (rule_matching: first); the
        # stock rule for /etc/shadow reads would shadow the fleet rule below, so it is off.
        - rule: Read sensitive file untrusted
          enabled: false
          override:
            enabled: replace
        - rule: Fleet secret file read
          desc: A container in the fleet namespaces read /etc/shadow
          condition: open_read and container and fd.name = /etc/shadow and k8s.ns.name startswith "fleet-"
          output: "Fleet secret file read (file=%fd.name pod=%k8s.pod.name)"
          priority: WARNING
        EOF
    - on: qm-ledger/ledger-cp-1
      timeoutSec: 600
      run: |
        /opt/cloudtrain/bin/addons-install falco --wait
        export KUBECONFIG=/etc/kubernetes/admin.conf
        # Falco may already have been running (another task installed it): reload ledger-wk-1's rules.
        kubectl -n falco delete pod -l app=falco --field-selector spec.nodeName=ledger-wk-1 --wait=true
        sleep 5; kubectl -n falco rollout status ds/falco --timeout=240s
    - on: qm-ledger
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata: {name: fleet-tacho}
        ---
        apiVersion: v1
        kind: Pod
        metadata: {name: tacho-collector, namespace: fleet-tacho}
        spec:
          nodeName: ledger-wk-1
          containers:
            - name: collector
              image: busybox:1.37
              command: ["sh", "-c", "while true; do cat /etc/shadow >/dev/null; sleep 10; done"]
    - on: workstation
      run: mkdir -p /home/learner/exam && chown learner:learner /home/learner/exam
  teardown:
    - on: qm-ledger
      run: kubectl delete namespace fleet-tacho --ignore-not-found --wait=false
  checks:
    - id: rule-output-fields
      description: The rule loaded by the Falco Pod on ledger-wk-1 outputs container.name and user.name
      type: shell
      on: qm-ledger
      skills: [k8s.security.runtime-detection]
      weight: 2
      timeoutSec: 60
      command: |
        p=$(kubectl -n falco get pod -l app=falco --field-selector spec.nodeName=ledger-wk-1,status.phase=Running -o jsonpath='{.items[0].metadata.name}')
        out=$(kubectl -n falco logs "$p" --since=1m 2>/dev/null | grep '"rule":"Fleet secret file read"' | tail -n1)
        [ -n "$out" ] || { echo "no recent alert"; exit 0; }
        printf '%s' "$out" | grep -q '"container.name":"collector"' && printf '%s' "$out" | grep -q '"user.name":"root"' && echo enriched || echo "missing fields"
      expect: {match: exact, value: enriched}
    - id: alert-saved
      description: ~/exam/fleet-alert.txt holds an alert line with the container and user names
      type: shell
      on: workstation
      skills: [k8s.security.runtime-detection]
      weight: 2
      command: |
        l=$(grep -m1 'Fleet secret file read' /home/learner/exam/fleet-alert.txt 2>/dev/null)
        [ -n "$l" ] || { echo missing; exit 0; }
        printf '%s' "$l" | grep -q '"container.name":"collector"' && printf '%s' "$l" | grep -q '"user.name":"root"' && echo ok || echo incomplete
      expect: {match: exact, value: ok}
  misconceptions:
    - id: rule-on-wrong-node
      description: Changes the rule on ledger-wk-2 and restarts that node's Falco Pod.
      feedback: Each Falco Pod reads /etc/falco/rules.d of its own node; the rule and the Pod that reads /etc/shadow are on ledger-wk-1.
      expectFail: [rule-output-fields, alert-saved]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 300
        run: |
          kubectl config use-context qm-ledger
          ssh ledger-wk-2 'sudo tee /etc/falco/rules.d/qm-ledger.yaml >/dev/null' <<'EOF'
          - rule: Fleet secret file read
            desc: A container in the fleet namespaces read /etc/shadow
            condition: open_read and container and fd.name = /etc/shadow and k8s.ns.name startswith "fleet-"
            output: "Fleet secret file read (file=%fd.name pod=%k8s.pod.name container=%container.name user=%user.name)"
            priority: WARNING
          EOF
          kubectl -n falco delete pod -l app=falco --field-selector spec.nodeName=ledger-wk-2
          sleep 5; kubectl -n falco rollout status ds/falco --timeout=180s
          sleep 15
          p=$(kubectl -n falco get pod -l app=falco --field-selector spec.nodeName=ledger-wk-1 -o jsonpath='{.items[0].metadata.name}')
          kubectl -n falco logs "$p" | grep 'Fleet secret file read' | tail -n1 > ~/exam/fleet-alert.txt
  solution:
    explanation: Add container=%container.name and user=%user.name to the output on ledger-wk-1, delete that node's Falco Pod so the DaemonSet starts one that reads the changed rule, wait for the next alert and save it.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 300
        run: |
          kubectl config use-context qm-ledger
          ssh ledger-wk-1 'sudo sed -i "s/(file=%fd.name pod=%k8s.pod.name)/(file=%fd.name pod=%k8s.pod.name container=%container.name user=%user.name)/" /etc/falco/rules.d/qm-ledger.yaml'
          kubectl -n falco delete pod -l app=falco --field-selector spec.nodeName=ledger-wk-1
          sleep 5; kubectl -n falco rollout status ds/falco --timeout=180s
          sleep 30
          p=$(kubectl -n falco get pod -l app=falco --field-selector spec.nodeName=ledger-wk-1 -o jsonpath='{.items[0].metadata.name}')
          kubectl -n falco logs "$p" --since=25s | grep 'Fleet secret file read' | tail -n1 > ~/exam/fleet-alert.txt
          cat ~/exam/fleet-alert.txt
