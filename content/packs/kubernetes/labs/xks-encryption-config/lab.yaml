apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xks-encryption-config
  title: Encrypt one resource type at rest
  domain: kubernetes
  frameworks: [cks:microservice-vulnerabilities]
  difficulty: hard
  estimatedMinutes: 12
  tags: [exam, secrets, encryption-at-rest, kube-apiserver]
  version: 1
spec:
  description: |
    Context: `qm-ledger`. The API server is a static Pod on `ledger-cp-1`
    (`ssh ledger-cp-1`, `sudo` works).

    1. Create the encryption configuration
       `/etc/kubernetes/enc/secrets-enc.yaml` that encrypts **Secrets** with
       the **{{provider}}** provider, and configure the qm-ledger API server
       to use it. Data that is not encrypted yet must stay readable.
    2. Re-write all existing Secrets in namespace `forecast-billing` so that they are
       stored encrypted.
  objectives:
    - Configure encryption at rest and re-encrypt existing data
  params:
    provider:
      type: choice
      values: [aescbc, aesgcm, secretbox]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      # Canonical sim-k8s-security cluster: every K-tier exam task shares it.
      - name: qm-ledger
        driver: k8s-cluster
        image: kubeadm:1.37-sec
        access: [ssh]
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-ledger
          nodes:
            - {name: ledger-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: ledger-wk-1, role: worker}
            - {name: ledger-wk-2, role: worker}
  setup:
    - on: qm-ledger
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata: {name: forecast-billing}
        ---
        apiVersion: v1
        kind: Secret
        metadata: {name: forecast-db, namespace: forecast-billing}
        stringData: {password: capacity-forecast-pw}
        ---
        apiVersion: v1
        kind: Secret
        metadata: {name: warehouse-api, namespace: forecast-billing}
        stringData: {token: wh-api-token-0042}
  teardown:
    - on: qm-ledger
      run: kubectl delete namespace forecast-billing --ignore-not-found --wait=false
  checks:
    - id: apiserver-uses-config
      description: kube-apiserver runs with --encryption-provider-config=/etc/kubernetes/enc/secrets-enc.yaml
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.secrets]
      command: ps -C kube-apiserver -o args= | tr ' ' '\n' | sed -n 's/^--encryption-provider-config=//p'
      expect: {match: exact, value: /etc/kubernetes/enc/secrets-enc.yaml}
    - id: forecast-billing-encrypted
      description: Both forecast-billing Secrets are stored in etcd with the {{provider}} prefix
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.secrets]
      weight: 3
      timeoutSec: 45
      command: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        e="kubectl -n kube-system exec etcd-ledger-cp-1 -- etcdctl --cacert /etc/kubernetes/pki/etcd/ca.crt --cert /etc/kubernetes/pki/etcd/healthcheck-client.crt --key /etc/kubernetes/pki/etcd/healthcheck-client.key"
        ok=0; want="k8s:enc:{{provider}}:v1:"
        for s in forecast-db warehouse-api; do
          [ "$($e get /registry/secrets/forecast-billing/$s --print-value-only 2>/dev/null | head -c ${#want} | tr -c '[:print:]' '.')" = "$want" ] && ok=$((ok+1))
        done
        echo "encrypted=$ok/2"
      expect: {match: exact, value: encrypted=2/2}
    - id: still-readable
      description: The forecast-billing Secrets still return their values through the API
      type: shell
      on: qm-ledger
      skills: [k8s.security.secrets]
      timeoutSec: 30
      command: |
        a=$(kubectl -n forecast-billing get secret forecast-db -o jsonpath='{.data.password}' | base64 -d)
        b=$(kubectl -n forecast-billing get secret warehouse-api -o jsonpath='{.data.token}' | base64 -d)
        echo "$a $b"
      expect: {match: exact, value: "capacity-forecast-pw wh-api-token-0042"}
  misconceptions:
    - id: not-rewritten
      description: Configures encryption but does not re-write the forecast-billing Secrets.
      feedback: Existing objects are only encrypted when they are written again.
      expectFail: [forecast-billing-encrypted]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 600
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/enc
          KEY=$(head -c 32 /dev/urandom | base64)
          printf 'apiVersion: apiserver.config.k8s.io/v1\nkind: EncryptionConfiguration\nresources:\n- resources: [secrets]\n  providers:\n  - {{provider}}:\n      keys:\n      - name: key1\n        secret: %s\n  - identity: {}\n' "$KEY" > /etc/kubernetes/enc/secrets-enc.yaml
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"].append("--encryption-provider-config=/etc/kubernetes/enc/secrets-enc.yaml")
          c.setdefault("volumeMounts", []).append({"name": "enc", "mountPath": "/etc/kubernetes/enc", "readOnly": True})
          m["spec"].setdefault("volumes", []).append({"name": "enc", "hostPath": {"path": "/etc/kubernetes/enc", "type": "Directory"}})
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --encryption-provider-config= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
    - id: identity-first
      description: Puts identity before the encrypting provider.
      feedback: The first provider encrypts writes; identity first means nothing gets encrypted.
      expectFail: [forecast-billing-encrypted]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 600
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/enc
          KEY=$(head -c 32 /dev/urandom | base64)
          printf 'apiVersion: apiserver.config.k8s.io/v1\nkind: EncryptionConfiguration\nresources:\n- resources: [secrets]\n  providers:\n  - identity: {}\n  - {{provider}}:\n      keys:\n      - name: key1\n        secret: %s\n' "$KEY" > /etc/kubernetes/enc/secrets-enc.yaml
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"].append("--encryption-provider-config=/etc/kubernetes/enc/secrets-enc.yaml")
          c.setdefault("volumeMounts", []).append({"name": "enc", "mountPath": "/etc/kubernetes/enc", "readOnly": True})
          m["spec"].setdefault("volumes", []).append({"name": "enc", "hostPath": {"path": "/etc/kubernetes/enc", "type": "Directory"}})
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --encryption-provider-config= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
          kubectl config use-context qm-ledger
          kubectl -n forecast-billing get secrets -o json | kubectl replace -f -
  solution:
    explanation: |
      The provider takes a base64-encoded 32-byte key; identity stays last so
      existing plain-text data can still be read. After the API server restarts
      with the flag and a mount for /etc/kubernetes/enc, replacing the Secrets
      re-writes them through the new provider.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 600
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          set -e
          mkdir -p /etc/kubernetes/enc
          KEY=$(head -c 32 /dev/urandom | base64)
          cat > /etc/kubernetes/enc/secrets-enc.yaml <<EOF
          apiVersion: apiserver.config.k8s.io/v1
          kind: EncryptionConfiguration
          resources:
            - resources: [secrets]
              providers:
                - {{provider}}:
                    keys:
                      - name: key1
                        secret: $KEY
                - identity: {}
          EOF
          python3 - <<'PY'
          import yaml
          p = "/etc/kubernetes/manifests/kube-apiserver.yaml"
          m = yaml.safe_load(open(p))
          c = m["spec"]["containers"][0]
          c["command"].append("--encryption-provider-config=/etc/kubernetes/enc/secrets-enc.yaml")
          c.setdefault("volumeMounts", []).append({"name": "enc", "mountPath": "/etc/kubernetes/enc", "readOnly": True})
          m["spec"].setdefault("volumes", []).append({"name": "enc", "hostPath": {"path": "/etc/kubernetes/enc", "type": "Directory"}})
          open(p, "w").write(yaml.safe_dump(m, default_flow_style=False))
          PY
          for i in $(seq 1 90); do
            ps -C kube-apiserver -o args= | grep -q -- --encryption-provider-config= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
          kubectl config use-context qm-ledger
          for i in $(seq 1 30); do kubectl get --raw /readyz >/dev/null 2>&1 && break; sleep 5; done
          kubectl -n forecast-billing get secrets -o json | kubectl replace -f -
    alternatives:
      - id: annotate-rewrite
        description: Re-write each Secret by touching an annotation instead of replace.
        steps:
          - on: workstation
            as: learner
            timeoutSec: 600
            run: |
              ssh ledger-cp-1 'sudo bash -s' <<'EOS'
              set -e
              install -d -m 0700 /etc/kubernetes/enc
              printf 'apiVersion: apiserver.config.k8s.io/v1\nkind: EncryptionConfiguration\nresources:\n- resources:\n  - secrets\n  providers:\n  - {{provider}}:\n      keys:\n      - name: k2026\n        secret: %s\n  - identity: {}\n' "$(head -c 32 /dev/urandom | base64)" > /etc/kubernetes/enc/secrets-enc.yaml
              m=/etc/kubernetes/manifests/kube-apiserver.yaml
              sed -i 's#^    - kube-apiserver$#    - kube-apiserver\n    - --encryption-provider-config=/etc/kubernetes/enc/secrets-enc.yaml#' $m
              sed -i 's#^    volumeMounts:$#    volumeMounts:\n    - mountPath: /etc/kubernetes/enc\n      name: enc\n      readOnly: true#' $m
              sed -i 's#^  volumes:$#  volumes:\n  - hostPath:\n      path: /etc/kubernetes/enc\n      type: Directory\n    name: enc#' $m
              for i in $(seq 1 90); do
                ps -C kube-apiserver -o args= | grep -q -- --encryption-provider-config= && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
                sleep 5
              done
              EOS
              kubectl config use-context qm-ledger
              for i in $(seq 1 30); do kubectl get --raw /readyz >/dev/null 2>&1 && break; sleep 5; done
              for s in $(kubectl -n forecast-billing get secrets -o name); do kubectl -n forecast-billing annotate "$s" qm.example/reencrypted="$(date +%s)" --overwrite; done
