apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xks-ingress-tls-secret
  title: Serve an Ingress over TLS
  domain: kubernetes
  frameworks: [cks:cluster-setup]
  difficulty: medium
  estimatedMinutes: 7
  tags: [exam, ingress, tls]
  version: 1
spec:
  description: |
    Context: `qm-ledger` (`kubectl config use-context qm-ledger`). The cluster's
    Ingress controller is Traefik (default IngressClass `traefik`). Namespace
    `partner-portal` holds a Traefik Middleware `https-redirect` that redirects
    requests to HTTPS; Traefik attaches Middlewares to an Ingress through the
    annotation `traefik.ingress.kubernetes.io/router.middlewares`
    (value `<namespace>-<name>@kubernetescrd`).

    1. Create a TLS Secret `portal-tls` in namespace `partner-portal` from
       `~/exam/portal.crt` and `~/exam/portal.key`.
    2. Make the existing Ingress `portal` serve `portal.quillmoor.example`
       over HTTPS with that certificate.
    3. HTTP requests must not be served: they must be redirected to HTTPS.
  objectives:
    - Add TLS to an Ingress
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      # Canonical sim-k8s-security cluster: every K-tier exam task shares it.
      - name: qm-ledger
        driver: k8s-cluster
        image: kubeadm:1.37-sec
        access: [ssh]
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-ledger
          nodes:
            - {name: ledger-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: ledger-wk-1, role: worker}
            - {name: ledger-wk-2, role: worker}
  setup:
    - on: qm-ledger/ledger-cp-1
      timeoutSec: 400
      run: /opt/cloudtrain/bin/addons-install ingress --wait
    - on: workstation
      run: |
        set -e
        mkdir -p /home/learner/exam && cd /home/learner/exam
        openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/O=Quillmoor Logistics/CN=portal.quillmoor.example" \
          -addext "subjectAltName=DNS:portal.quillmoor.example" -keyout portal.key -out portal.crt 2>/dev/null
        chown -R learner:learner /home/learner/exam
    - on: qm-ledger
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata: {name: partner-portal}
        ---
        apiVersion: v1
        kind: Pod
        metadata: {name: portal, namespace: partner-portal, labels: {app: portal}}
        spec:
          containers:
            - {name: web, image: busybox:1.37, command: ["sh", "-c", "mkdir -p /w && echo 'partner portal' > /w/index.html && exec httpd -f -p 8080 -h /w"]}
        ---
        apiVersion: v1
        kind: Service
        metadata: {name: portal, namespace: partner-portal}
        spec:
          selector: {app: portal}
          ports: [{port: 80, targetPort: 8080}]
        ---
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata: {name: portal, namespace: partner-portal}
        spec:
          ingressClassName: traefik
          rules:
            - host: portal.quillmoor.example
              http:
                paths:
                  - {path: /, pathType: Prefix, backend: {service: {name: portal, port: {number: 80}}}}
        ---
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata: {name: https-redirect, namespace: partner-portal}
        spec:
          redirectScheme: {scheme: https, permanent: true}
    - on: qm-ledger
      timeoutSec: 150
      run: kubectl -n partner-portal wait pod portal --for=condition=Ready --timeout=140s
  teardown:
    - on: qm-ledger
      run: kubectl delete namespace partner-portal --ignore-not-found --wait=false
  checks:
    - id: secret-tls
      description: portal-tls is a kubernetes.io/tls Secret
      type: k8s-query
      skills: [k8s.security.ingress-tls]
      query: {cluster: qm-ledger, resource: secret, name: portal-tls, namespace: partner-portal, jsonpath: "{.type}"}
      expect: {match: exact, value: kubernetes.io/tls}
    - id: https-cert
      description: HTTPS for portal.quillmoor.example presents the provided certificate
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.ingress-tls]
      weight: 3
      timeoutSec: 40
      command: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        ip=$(kubectl -n traefik get svc traefik -o jsonpath='{.spec.clusterIP}')
        sub=$(echo | openssl s_client -connect $ip:443 -servername portal.quillmoor.example 2>/dev/null | openssl x509 -noout -subject -nameopt RFC2253 2>/dev/null)
        body=$(curl -sk -m 5 --resolve portal.quillmoor.example:443:$ip https://portal.quillmoor.example/)
        echo "$sub body=$body"
      expect: {match: exact, value: "subject=CN=portal.quillmoor.example,O=Quillmoor Logistics body=partner portal"}
    - id: http-redirected
      description: Plain HTTP gets a redirect to HTTPS
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.ingress-tls]
      timeoutSec: 30
      command: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        ip=$(kubectl -n traefik get svc traefik -o jsonpath='{.spec.clusterIP}')
        curl -s -m 5 -o /dev/null -w '%{http_code} %{redirect_url}' --resolve portal.quillmoor.example:80:$ip http://portal.quillmoor.example/
      expect: {match: regex, value: "^30[178] https://portal\\.quillmoor\\.example/?$"}
  misconceptions:
    - id: secret-other-namespace
      description: Creates the Secret in the default namespace.
      feedback: An Ingress can only use TLS Secrets from its own namespace.
      expectFail: [secret-tls, https-cert]
      mutation:
        on: workstation
        as: learner
        run: |
          kubectl config use-context qm-ledger
          kubectl -n default create secret tls portal-tls --cert ~/exam/portal.crt --key ~/exam/portal.key
          kubectl -n partner-portal patch ingress portal --type=merge -p '{"metadata":{"annotations":{"traefik.ingress.kubernetes.io/router.middlewares":"partner-portal-https-redirect@kubernetescrd"}},"spec":{"tls":[{"hosts":["portal.quillmoor.example"],"secretName":"portal-tls"}]}}'
          sleep 10
    - id: no-redirect
      description: Adds TLS but leaves plain HTTP served.
      feedback: Traefik serves the HTTP entry point too until the redirect Middleware is attached to the Ingress.
      expectFail: [http-redirected]
      mutation:
        on: workstation
        as: learner
        run: |
          kubectl config use-context qm-ledger
          kubectl -n partner-portal create secret tls portal-tls --cert ~/exam/portal.crt --key ~/exam/portal.key
          kubectl -n partner-portal patch ingress portal --type=merge -p '{"spec":{"tls":[{"hosts":["portal.quillmoor.example"],"secretName":"portal-tls"}]}}'
          sleep 10
  solution:
    explanation: kubectl create secret tls, add spec.tls with the host and secretName, and attach the https-redirect Middleware with the router.middlewares annotation.
    steps:
      - on: workstation
        as: learner
        run: |
          kubectl config use-context qm-ledger
          kubectl -n partner-portal create secret tls portal-tls --cert ~/exam/portal.crt --key ~/exam/portal.key
          kubectl -n partner-portal patch ingress portal --type=merge -p '{"metadata":{"annotations":{"traefik.ingress.kubernetes.io/router.middlewares":"partner-portal-https-redirect@kubernetescrd"}},"spec":{"tls":[{"hosts":["portal.quillmoor.example"],"secretName":"portal-tls"}]}}'
          sleep 10
    alternatives:
      - id: yaml-secret
        description: Write the Secret as YAML with base64 data.
        steps:
          - on: workstation
            as: learner
            run: |
              kubectl config use-context qm-ledger
              kubectl apply -f - <<YAML
              apiVersion: v1
              kind: Secret
              metadata: {name: portal-tls, namespace: partner-portal}
              type: kubernetes.io/tls
              data:
                tls.crt: $(base64 -w0 ~/exam/portal.crt)
                tls.key: $(base64 -w0 ~/exam/portal.key)
              YAML
              kubectl -n partner-portal patch ingress portal --type=json -p '[{"op":"add","path":"/spec/tls","value":[{"hosts":["portal.quillmoor.example"],"secretName":"portal-tls"}]}]'
              kubectl -n partner-portal annotate ingress portal traefik.ingress.kubernetes.io/router.middlewares=partner-portal-https-redirect@kubernetescrd
              sleep 10
