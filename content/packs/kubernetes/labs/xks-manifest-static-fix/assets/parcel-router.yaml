# Routes parcels between sorting belts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-router
  namespace: parcel-routing
spec:
  replicas: 2
  selector:
    matchLabels: {app: parcel-router}
  template:
    metadata:
      labels: {app: parcel-router}
    spec:
      hostNetwork: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: router
          image: busybox:1.37
          command: ["sh", "-c", "while true; do echo routing; sleep 30; done"]
          securityContext:
            allowPrivilegeEscalation: true
