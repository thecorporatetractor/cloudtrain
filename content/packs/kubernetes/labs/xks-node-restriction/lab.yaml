apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xks-node-restriction
  title: Enable the NodeRestriction admission plugin
  domain: kubernetes
  frameworks: [cks:cluster-hardening]
  difficulty: medium
  estimatedMinutes: 8
  tags: [exam, admission, noderestriction, kube-apiserver]
  version: 1
spec:
  description: |
    Context: `qm-ledger` (`kubectl config use-context qm-ledger`). The control
    plane runs on `ledger-cp-1` (`ssh ledger-cp-1`, `sudo` works).

    Enable the **NodeRestriction** admission plugin on the qm-ledger API
    server, so that a kubelet can only modify its own Node object and the
    Pods bound to it. Keep every admission plugin that is already enabled.
  objectives:
    - Change kube-apiserver admission plugins in a static Pod manifest
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      # Canonical sim-k8s-security cluster: every K-tier exam task shares it.
      - name: qm-ledger
        driver: k8s-cluster
        image: kubeadm:1.37-sec
        access: [ssh]
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-ledger
          nodes:
            - {name: ledger-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: ledger-wk-1, role: worker}
            - {name: ledger-wk-2, role: worker}
  setup:
    - on: qm-ledger/ledger-cp-1
      timeoutSec: 400
      run: |
        set -e
        m=/etc/kubernetes/manifests/kube-apiserver.yaml
        sed -i 's/^    - --enable-admission-plugins=.*$/    - --enable-admission-plugins=ServiceAccount/' $m
        grep -q -- '--enable-admission-plugins=ServiceAccount$' $m
        for i in $(seq 1 75); do
          a=$(ps -C kube-apiserver -o args= || true)
          case "$a" in *enable-admission-plugins=ServiceAccount\ *|*enable-admission-plugins=ServiceAccount) curl -sfk https://127.0.0.1:6443/readyz >/dev/null && exit 0 ;; esac
          sleep 5
        done
        echo "API server did not come back" >&2; exit 1
    - on: qm-ledger/ledger-wk-1
      timeoutSec: 120
      run: |
        # Baseline: the worker's kubelet credentials can modify another node. A raw PATCH is
        # used because kubectl label/patch GET the object first, and the node authorizer
        # already denies a foreign GET whatever the admission plugins are.
        c=/var/lib/kubelet/pki/kubelet-client-current.pem
        s=$(sed -n 's/^ *server: //p' /etc/kubernetes/kubelet.conf | head -n1)
        cp_label() { curl -sk --cert $c --key $c -X PATCH -H 'Content-Type: application/merge-patch+json' -d "{\"metadata\":{\"labels\":{\"$1\":$2}}}" "$s/api/v1/nodes/ledger-cp-1"; }
        for i in $(seq 1 20); do
          cp_label qm-baseline '"1"' | grep -q '"kind": *"Node"' && break
          sleep 3
        done
        cp_label qm-baseline null | grep -q '"kind": *"Node"' || { echo 'baseline: kubelet cannot patch foreign node' >&2; exit 1; }
  checks:
    - id: plugin-enabled
      description: The running kube-apiserver lists NodeRestriction in --enable-admission-plugins and keeps ServiceAccount
      type: shell
      on: qm-ledger/ledger-cp-1
      skills: [k8s.security.api-server-hardening]
      command: |
        v=$(ps -C kube-apiserver -o args= | tr ' ' '\n' | sed -n 's/^--enable-admission-plugins=//p' | tail -n1 | tr ',' '\n')
        n=0; s=0
        echo "$v" | grep -qx NodeRestriction && n=1
        echo "$v" | grep -qx ServiceAccount && s=1
        echo "noderestriction=$n serviceaccount=$s"
      expect: {match: exact, value: noderestriction=1 serviceaccount=1}
    - id: foreign-node-denied
      description: ledger-wk-1's kubelet credentials can no longer label ledger-cp-1
      type: shell
      on: qm-ledger/ledger-wk-1
      skills: [k8s.security.api-server-hardening]
      weight: 3
      timeoutSec: 30
      command: |
        c=/var/lib/kubelet/pki/kubelet-client-current.pem
        s=$(sed -n 's/^ *server: //p' /etc/kubernetes/kubelet.conf | head -n1)
        cp_label() { curl -sk --cert $c --key $c -X PATCH -H 'Content-Type: application/merge-patch+json' -d "{\"metadata\":{\"labels\":{\"$1\":$2}}}" "$s/api/v1/nodes/ledger-cp-1"; }
        out=$(cp_label qm-probe '"1"')
        case "$out" in *'"reason": "Forbidden"'*|*'"reason":"Forbidden"'*) echo denied ;; *'"kind": "Node"'*|*'"kind":"Node"'*) cp_label qm-probe null >/dev/null; echo allowed ;; *) echo "error: $out" ;; esac
      expect: {match: exact, value: denied}
    - id: own-node-allowed
      description: ledger-wk-1's kubelet can still update its own Node and the node is Ready
      type: shell
      on: qm-ledger/ledger-wk-1
      skills: [k8s.security.api-server-hardening]
      timeoutSec: 30
      command: |
        out=$(kubectl --kubeconfig /etc/kubernetes/kubelet.conf label node ledger-wk-1 qm-probe=1 --overwrite 2>&1)
        kubectl --kubeconfig /etc/kubernetes/kubelet.conf label node ledger-wk-1 qm-probe- >/dev/null 2>&1
        r=$(kubectl --kubeconfig /etc/kubernetes/kubelet.conf get node ledger-wk-1 -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
        case "$out" in *labeled*) echo "own=allowed ready=$r" ;; *) echo "own=denied ready=$r" ;; esac
      expect: {match: exact, value: own=allowed ready=True}
  misconceptions:
    - id: replaced-plugin-list
      description: Replaces the plugin list with NodeRestriction only, dropping ServiceAccount.
      feedback: Append NodeRestriction to the existing comma-separated list.
      expectFail: [plugin-enabled]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 500
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          sed -i 's/^    - --enable-admission-plugins=.*$/    - --enable-admission-plugins=NodeRestriction/' /etc/kubernetes/manifests/kube-apiserver.yaml
          for i in $(seq 1 75); do
            ps -C kube-apiserver -o args= | grep -q 'enable-admission-plugins=NodeRestriction' && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
    - id: edited-a-copy
      description: Edits a copy of the manifest outside /etc/kubernetes/manifests.
      feedback: The kubelet only watches /etc/kubernetes/manifests; a copy elsewhere changes nothing.
      expectFail: [plugin-enabled, foreign-node-denied]
      mutation:
        on: workstation
        as: learner
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          cp /etc/kubernetes/manifests/kube-apiserver.yaml /root/kube-apiserver.yaml
          sed -i 's/--enable-admission-plugins=ServiceAccount/--enable-admission-plugins=ServiceAccount,NodeRestriction/' /root/kube-apiserver.yaml
          EOS
  solution:
    explanation: Add NodeRestriction to --enable-admission-plugins in the static Pod manifest; the kubelet restarts the API server.
    steps:
      - on: workstation
        as: learner
        timeoutSec: 500
        run: |
          ssh ledger-cp-1 'sudo bash -s' <<'EOS'
          sed -i 's/^\(    - --enable-admission-plugins=.*\)$/\1,NodeRestriction/' /etc/kubernetes/manifests/kube-apiserver.yaml
          grep enable-admission-plugins /etc/kubernetes/manifests/kube-apiserver.yaml
          for i in $(seq 1 75); do
            ps -C kube-apiserver -o args= | grep -q 'NodeRestriction' && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
            sleep 5
          done
          EOS
    alternatives:
      - id: prepend
        description: Put NodeRestriction first in the list.
        steps:
          - on: workstation
            as: learner
            timeoutSec: 500
            run: |
              ssh ledger-cp-1 'sudo bash -s' <<'EOS'
              sed -i 's/--enable-admission-plugins=/--enable-admission-plugins=NodeRestriction,/' /etc/kubernetes/manifests/kube-apiserver.yaml
              for i in $(seq 1 75); do
                ps -C kube-apiserver -o args= | grep -q 'NodeRestriction' && curl -sfk https://127.0.0.1:6443/readyz >/dev/null && break
                sleep 5
              done
              EOS
