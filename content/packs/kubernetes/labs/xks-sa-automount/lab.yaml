apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xks-sa-automount
  title: Stop automounting API tokens
  domain: kubernetes
  frameworks: [cks:cluster-hardening]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, serviceaccount, token]
  version: 1
spec:
  description: |
    Context: `qm-depot` (`kubectl config use-context qm-depot`).

    In namespace `kiosk`:

    1. Disable token automounting for the `default` ServiceAccount.
    2. Disable it explicitly in the Pod template of Deployment `kiosk-ui`, so
       its running Pods no longer have a ServiceAccount token mounted.
  objectives:
    - Disable ServiceAccount token automounting at ServiceAccount and Pod level
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      # Canonical sim-k8s-security virtual cluster: every V-tier exam task shares it.
      - name: qm-depot
        driver: k8s-cluster
        cluster:
          mode: virtual
          version: "v1.37"
          context: qm-depot
  setup:
    - on: qm-depot
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata: {name: kiosk}
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: kiosk-ui, namespace: kiosk}
        spec:
          replicas: 2
          selector: {matchLabels: {app: kiosk-ui}}
          template:
            metadata: {labels: {app: kiosk-ui}}
            spec:
              containers:
                - {name: ui, image: busybox:1.37, command: ["sh", "-c", "while true; do sleep 30; done"]}
    - on: qm-depot
      timeoutSec: 150
      run: kubectl -n kiosk rollout status deploy/kiosk-ui --timeout=140s
  teardown:
    - on: qm-depot
      run: kubectl delete namespace kiosk --ignore-not-found --wait=false
  checks:
    - id: sa-off
      description: The default ServiceAccount in kiosk does not automount tokens
      type: k8s-query
      timeoutSec: 20
      skills: [k8s.security.sa-token-hygiene]
      query: {cluster: qm-depot, resource: serviceaccount, name: default, namespace: kiosk, jsonpath: "{.automountServiceAccountToken}"}
      expect: {match: exact, value: "false"}
    - id: template-off
      description: The kiosk-ui Pod template sets automountServiceAccountToken to false
      type: k8s-query
      timeoutSec: 20
      skills: [k8s.security.sa-token-hygiene]
      query: {cluster: qm-depot, resource: deployment, name: kiosk-ui, namespace: kiosk, jsonpath: "{.spec.template.spec.automountServiceAccountToken}"}
      expect: {match: exact, value: "false"}
    - id: pods-tokenless
      description: No kiosk-ui Pod has a token mounted
      type: shell
      on: qm-depot
      skills: [k8s.security.sa-token-hygiene]
      weight: 2
      timeoutSec: 60
      command: |
        kubectl -n kiosk rollout status deploy/kiosk-ui --timeout=40s >/dev/null 2>&1
        n=0; with=0
        for m in $(kubectl -n kiosk get pods -l app=kiosk-ui -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null) | "\(.metadata.name)=\([.spec.containers[].volumeMounts[]?.mountPath] | join(","))"'); do
          n=$((n+1)); case "$m" in *serviceaccount*) with=$((with+1));; esac
        done
        echo "pods=$n with-token=$with"
      expect: {match: regex, value: "^pods=[1-9][0-9]* with-token=0$"}
  misconceptions:
    - id: sa-only
      description: Patches only the ServiceAccount; the running Pods keep their tokens.
      feedback: Existing Pods keep their token volume. Set the field on the Pod template too, which rolls the Pods.
      expectFail: [template-off, pods-tokenless]
      mutation:
        on: workstation
        as: learner
        run: |
          kubectl config use-context qm-depot
          kubectl -n kiosk patch serviceaccount default -p '{"automountServiceAccountToken": false}'
    - id: template-only
      description: Sets the field only on the Deployment.
      feedback: The default ServiceAccount still hands tokens to every other Pod in the namespace.
      expectFail: [sa-off]
      mutation:
        on: workstation
        as: learner
        run: |
          kubectl config use-context qm-depot
          kubectl -n kiosk patch deploy kiosk-ui -p '{"spec":{"template":{"spec":{"automountServiceAccountToken":false}}}}'
  solution:
    explanation: Set automountServiceAccountToken false on the ServiceAccount and on the Pod template; the template change rolls the Pods without tokens.
    steps:
      - on: workstation
        as: learner
        run: |
          kubectl config use-context qm-depot
          kubectl -n kiosk patch serviceaccount default -p '{"automountServiceAccountToken": false}'
          kubectl -n kiosk patch deploy kiosk-ui -p '{"spec":{"template":{"spec":{"automountServiceAccountToken":false}}}}'
          kubectl -n kiosk rollout status deploy/kiosk-ui
    alternatives:
      - id: jq-edit
        description: Edit both objects as JSON with jq and write them back.
        steps:
          - on: workstation
            as: learner
            run: |
              kubectl config use-context qm-depot
              kubectl -n kiosk get sa default -o json | jq '.automountServiceAccountToken=false' | kubectl replace -f -
              kubectl -n kiosk get deploy kiosk-ui -o json | jq '.spec.template.spec.automountServiceAccountToken=false' | kubectl apply -f -
              kubectl -n kiosk rollout status deploy/kiosk-ui
