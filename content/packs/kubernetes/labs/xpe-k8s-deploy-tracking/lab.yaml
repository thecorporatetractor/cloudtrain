apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xpe-k8s-deploy-tracking
  title: Deploy the tracking API with probes and limits
  domain: kubernetes
  frameworks: [ct-platform:kubernetes-operations]
  difficulty: medium
  estimatedMinutes: 20
  tags: [exam, deployment, probes, resources, services]
  version: 1
spec:
  description: |
    **Context:** `qm-harbour` (`kubectl config use-context qm-harbour`)

    Release engineering signed the tracking API image; deploy exactly that
    build, referenced **by digest**:
    `docker.io/library/httpd@sha256:3440c39d8d6f54fa9ad2549e5a60c19ddd435faadc29c1ad28aa795f71888889`.

    In namespace **`tracking-api`** (it exists), create:

    1. a ConfigMap **`tracking-config`** with `TRACKING_REGION={{region}}`;
    2. a Deployment **`tracking-api`** with **3 replicas**, container `api`
       listening on port 80, the variable `TRACKING_REGION` taken from the
       ConfigMap, requests `cpu: 100m, memory: 64Mi` and limits
       `cpu: 250m, memory: 128Mi`, an HTTP **readiness** probe and an HTTP
       **liveness** probe on `/` port 80;
    3. a ClusterIP Service **`tracking-api`** on port 80 that selects only the
       tracking API's Pods (the namespace also runs `tracking-admin`).

    All 3 replicas must be ready behind the Service.
  objectives:
    - Deploy an image by digest with probes, resources and configuration
    - Expose it with a precise selector
  params:
    region:
      type: choice
      values: [north-sea, irish-sea, channel]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: qm-harbour
        driver: k8s-cluster
        image: kubeadm:1.37
        cluster:
          mode: kubeadm
          version: "v1.37.1"
          context: qm-harbour
          nodes:
            - {name: harbour-cp-1, role: control-plane, taints: ["node-role.kubernetes.io/control-plane:NoSchedule"]}
            - {name: harbour-wk-1, role: worker}
            - {name: harbour-wk-2, role: worker}
  setup:
    - on: qm-harbour
      apply: |
        apiVersion: v1
        kind: Namespace
        metadata: {name: tracking-api}
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: tracking-admin, namespace: tracking-api}
        spec:
          replicas: 1
          selector: {matchLabels: {app: tracking-admin, suite: tracking}}
          template:
            metadata: {labels: {app: tracking-admin, suite: tracking}}
            spec:
              containers:
                - {name: admin, image: "caddy:2-alpine"}
  teardown:
    - on: qm-harbour
      run: kubectl delete namespace tracking-api --ignore-not-found --wait=false
  checks:
    - id: image-by-digest
      description: tracking-api runs the signed image by digest, 3 ready replicas
      type: k8s-query
      skills: [k8s.workloads.deployments]
      weight: 2
      query: {cluster: qm-harbour, resource: deployment, name: tracking-api, namespace: tracking-api, jsonpath: '{.spec.template.spec.containers[0].image} {.status.readyReplicas}/{.spec.replicas}'}
      expect: {match: regex, value: '^(docker\.io/library/)?httpd@sha256:3440c39d8d6f54fa9ad2549e5a60c19ddd435faadc29c1ad28aa795f71888889 3/3$'}
    - id: resources
      description: Requests 100m/64Mi and limits 250m/128Mi
      type: k8s-query
      skills: [k8s.workloads.resources]
      query: {cluster: qm-harbour, resource: deployment, name: tracking-api, namespace: tracking-api, jsonpath: '{.spec.template.spec.containers[0].resources.requests.cpu}/{.spec.template.spec.containers[0].resources.requests.memory} {.spec.template.spec.containers[0].resources.limits.cpu}/{.spec.template.spec.containers[0].resources.limits.memory}'}
      expect: {match: exact, value: 100m/64Mi 250m/128Mi}
    - id: probes
      description: HTTP readiness and liveness probes on / port 80
      type: shell
      on: qm-harbour
      skills: [k8s.workloads.probes]
      command: |
        kubectl -n tracking-api get deploy tracking-api -o json | jq -r '.spec.template.spec.containers[0] | "\(.readinessProbe.httpGet.path):\(.readinessProbe.httpGet.port) \(.livenessProbe.httpGet.path):\(.livenessProbe.httpGet.port)"'
      expect: {match: regex, value: '^/:(80|http) /:(80|http)$'}
    - id: config
      description: TRACKING_REGION comes from ConfigMap tracking-config and reads {{region}}
      type: shell
      on: qm-harbour
      skills: [k8s.workloads.deployments]
      timeoutSec: 20
      command: |
        ref=$(kubectl -n tracking-api get deploy tracking-api -o json | jq -r '[.spec.template.spec.containers[0] | (.env[]? | select(.name == "TRACKING_REGION") | .valueFrom.configMapKeyRef.name), (.envFrom[]? | .configMapRef.name)] | map(select(. != null)) | unique | join(",")')
        val=$(kubectl -n tracking-api exec deploy/tracking-api -- printenv TRACKING_REGION 2>/dev/null)
        echo "$ref $val"
      expect: {match: exact, value: "tracking-config {{region}}"}
    - id: service
      description: Service tracking-api (ClusterIP, port 80) has exactly the 3 API Pods as ready endpoints
      type: shell
      on: qm-harbour
      skills: [k8s.networking.services]
      weight: 2
      command: |
        echo "$(kubectl -n tracking-api get svc tracking-api -o jsonpath='{.spec.type}:{.spec.ports[0].port}') \
        $(kubectl -n tracking-api get endpointslices -l kubernetes.io/service-name=tracking-api -o json | jq -r '[.items[].endpoints[]? | select(.conditions.ready) | .targetRef.name | test("^tracking-api-")] | "\(length):\(all)"')"
      expect: {match: exact, value: "ClusterIP:80 3:true"}
  misconceptions:
    - id: tag-not-digest
      description: Deploys the tag instead of the signed digest.
      feedback: A tag can be moved to another build; the signature covers the digest. Reference the image by digest.
      expectFail: [image-by-digest]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 200
        run: |
          kubectl config use-context qm-harbour
          kubectl -n tracking-api create configmap tracking-config --from-literal=TRACKING_REGION={{region}}
          cat > /tmp/d.yaml <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: tracking-api, namespace: tracking-api}
          spec:
            replicas: 3
            selector: {matchLabels: {app: tracking-api}}
            template:
              metadata: {labels: {app: tracking-api, suite: tracking}}
              spec:
                containers:
                  - name: api
                    image: httpd:2.4-alpine
                    ports: [{containerPort: 80}]
                    envFrom: [{configMapRef: {name: tracking-config}}]
                    resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
                    readinessProbe: {httpGet: {path: /, port: 80}}
                    livenessProbe: {httpGet: {path: /, port: 80}}
          YAML
          kubectl apply -f /tmp/d.yaml
          kubectl -n tracking-api expose deploy tracking-api --port=80
          kubectl -n tracking-api rollout status deploy/tracking-api --timeout=180s
    - id: suite-selector
      description: Selects Pods by the shared suite label, so the Service also sends traffic to tracking-admin.
      feedback: Select by the label unique to the API Pods.
      expectFail: [service]
      mutation:
        on: workstation
        as: learner
        timeoutSec: 200
        run: |
          kubectl config use-context qm-harbour
          kubectl -n tracking-api create configmap tracking-config --from-literal=TRACKING_REGION={{region}}
          SIGNED=docker.io/library/httpd@sha256:3440c39d8d6f54fa9ad2549e5a60c19ddd435faadc29c1ad28aa795f71888889
          cat > /tmp/d.yaml <<YAML
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: tracking-api, namespace: tracking-api}
          spec:
            replicas: 3
            selector: {matchLabels: {app: tracking-api}}
            template:
              metadata: {labels: {app: tracking-api, suite: tracking}}
              spec:
                containers:
                  - name: api
                    image: $SIGNED
                    ports: [{containerPort: 80}]
                    envFrom: [{configMapRef: {name: tracking-config}}]
                    resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
                    readinessProbe: {httpGet: {path: /, port: 80}}
                    livenessProbe: {httpGet: {path: /, port: 80}}
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: tracking-api, namespace: tracking-api}
          spec:
            selector: {suite: tracking}
            ports: [{port: 80, targetPort: 80}]
          YAML
          kubectl apply -f /tmp/d.yaml
          kubectl -n tracking-api rollout status deploy/tracking-api --timeout=180s
  solution:
    steps:
      - on: workstation
        as: learner
        timeoutSec: 200
        run: |
          kubectl config use-context qm-harbour
          kubectl -n tracking-api create configmap tracking-config --from-literal=TRACKING_REGION={{region}}
          SIGNED=docker.io/library/httpd@sha256:3440c39d8d6f54fa9ad2549e5a60c19ddd435faadc29c1ad28aa795f71888889
          kubectl apply -f - <<YAML
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: tracking-api, namespace: tracking-api}
          spec:
            replicas: 3
            selector: {matchLabels: {app: tracking-api}}
            template:
              metadata: {labels: {app: tracking-api, suite: tracking}}
              spec:
                containers:
                  - name: api
                    image: $SIGNED
                    ports: [{name: http, containerPort: 80}]
                    env:
                      - name: TRACKING_REGION
                        valueFrom: {configMapKeyRef: {name: tracking-config, key: TRACKING_REGION}}
                    resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
                    readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}
                    livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: tracking-api, namespace: tracking-api}
          spec:
            selector: {app: tracking-api}
            ports: [{port: 80, targetPort: http}]
          YAML
          kubectl -n tracking-api rollout status deploy/tracking-api --timeout=180s
