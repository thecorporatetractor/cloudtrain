# Kubernetes content pack: hands-on administration labs set in one fictional company.
apiVersion: cloudtrain.dev/v1
kind: Pack
metadata:
  id: kubernetes
  title: Kubernetes administration
  domain: kubernetes
  version: 1
  owners: [content-team]
  description: |
    Hands-on Kubernetes administration labs: access control, node maintenance,
    cluster lifecycle, networking, scheduling and storage. Every lab is graded
    automatically and every check is tagged with skills from content/skills.yaml.

# The fictional organisation every lab in this pack is set in. Keep new labs
# inside this universe so names stay coherent and never come from real companies
# or external question banks.
universe:
  organisation: Quillmoor Logistics
  summary: A fictional freight and parcel logistics operator with depots, a container yard, a harbour terminal and a customs desk.
  namingRules:
    contexts: "qm-<area>; the kubeconfig context name equals the cluster node name in the topology"
    nodes: "<area>-cp-N for control-plane nodes, <area>-wk-N for workers"
    namespaces: "business function in kebab-case, e.g. parcel-tracking, dock-scheduling"
    labelDomain: quillmoor.example
  clusters:
    qm-depot: Shared depot platform (virtual cluster)
    qm-yard: Container-yard operations (kubeadm)
    qm-ledger: Billing ledger (kubeadm); ledger-etcd is its standalone etcd VM
    qm-customs: Customs gateway (virtual cluster)
    qm-tracking: Shipment tracking front end (kubeadm)
    qm-dispatch: Harbour dispatch (virtual cluster)
    qm-fleet: Fleet and label printing (kubeadm)
    qm-capacity: Capacity planning (kubeadm)
    qm-archive: Audit archive (virtual cluster)

# Grader conventions this pack relies on (implemented by services/grader):
#  - k8s-query / k8s-can-i checks run out-of-band with admin credentials for query.cluster.
#  - shell checks with `on: <k8s-cluster node>` run with an admin kubeconfig for that cluster;
#    `on: <cluster>/<cluster-node>` and `on: <vm/container node>` run as root on that host.
#  - k8s-context checks read the current context of the learner's kubeconfig on the entry node.
#  - Mutations and solution steps with `as: learner` run with the learner's own credentials.
conventions:
  entryNode: workstation
  entryImage: jumphost:1

courses:
  - id: k8s-admin-essentials
    title: Kubernetes administration essentials
    description: Day-to-day tasks every cluster operator must do quickly and safely.
    level: beginner
    labs:
      - scale-berth-planner
      - two-container-pod
      - nodeselector-nvme-pod
      - hostpath-pv-readonly
      - count-schedulable-nodes
  - id: k8s-access-and-networking
    title: Access control and network exposure
    description: Least-privilege access, exposing applications and isolating traffic.
    level: intermediate
    labs:
      - rbac-pipeline-grant
      - named-port-nodeport
      - netpol-namespace-port
  - id: k8s-cluster-maintenance
    title: Cluster maintenance and recovery
    description: Node maintenance, control-plane upgrades and etcd disaster recovery on real VMs.
    level: advanced
    labs:
      - drain-yard-worker
      - kubeadm-control-plane-upgrade
      - etcd-snapshot-restore
  - id: k8s-app-developer
    title: Building and running applications
    description: Images, batch workloads, release strategies, API migrations and workload security for application developers.
    level: intermediate
    labs:
      - build-waybill-image
      - ledger-export-cronjob
      - parallel-manifest-job
      - tariff-cache-statefulset
      - quote-engine-canary
      - blue-green-cutover
      - migrate-deprecated-apis
      - app-serviceaccount-api
      - kiosk-restricted-pss
      - registry-allowlist-vap

paths:
  - id: cka-track
    title: Towards CKA
    framework: cka
    courses: [k8s-admin-essentials, k8s-access-and-networking, k8s-cluster-maintenance]
