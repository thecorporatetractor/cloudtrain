apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: awk-fare-report
  title: Build a per-zone fare report with awk
  domain: linux
  frameworks: [lpic1:gnu-commands, linuxplus:automation-scripting]
  difficulty: medium
  estimatedMinutes: 15
  tags: [awk, text-processing, reports, printf]
  version: 1
spec:
  description: |
    Tallowmere Rail's ticket gates log every journey to a raw fares log such as
    `/srv/fares/fares-week41.log`:

    ```
    2026-10-05T07:12:44 gate=G12 card=****1234 zone=2 fare=3.40 status=OK
    ```

    Finance wants a per-zone table. Write `~/bin/fare-report`, an executable
    script that takes one or more log files as arguments and prints exactly this
    format (it is fed into finance's spreadsheet, so spacing matters):

    ```
    ZONE  JOURNEYS   REVENUE
    1           12     40.80
    2            9     38.25
    TOTAL       21     79.05
    ```

    - Count only journeys with `status=OK`.
    - One line per zone that has at least one OK journey, zones in **numeric**
      order, then the `TOTAL` line.
    - Each line is `printf "%-5s %8s %9.2f\n"`-shaped: zone (or ZONE/TOTAL) left
      in 5 characters, journeys right in 8, revenue right in 9 with two decimals.
    - Several gate firmware versions write the `key=value` fields **in a different
      order**, so find fields by their key, not their position.

    Finally save this week's report: `~/bin/fare-report /srv/fares/fares-week41.log
    > ~/reports/fares-week41.txt`. The grader also runs your script on hidden logs.
  objectives:
    - Split key=value fields and filter records in awk
    - Aggregate with associative arrays
    - Format fixed-width output with printf
  params:
    salt:
      type: int
      min: 10
      max: 900
  topology:
    entry: tr-finance-01
    nodes:
      - name: tr-finance-01
        driver: container
        image: linux-pod-deb:24.04
        access: [shell]
  setup:
    - on: tr-finance-01
      file: {path: /var/lib/cloudtrain/case.sh, source: assets/case.sh, mode: "0700"}
    - on: tr-finance-01
      file: {path: /var/lib/cloudtrain/reference.awk, source: assets/reference.awk, mode: "0600"}
    - on: tr-finance-01
      file: {path: /var/lib/cloudtrain/make-logs.sh, source: assets/make-logs.sh, mode: "0700"}
    - on: tr-finance-01
      run: |
        set -eu
        chmod 0700 /var/lib/cloudtrain /var/lib/cloudtrain/case.sh /var/lib/cloudtrain/make-logs.sh
        bash /var/lib/cloudtrain/make-logs.sh {{salt}}
        install -d -o learner -g learner /home/learner/bin /home/learner/reports
        rm -f /home/learner/bin/fare-report /home/learner/reports/fares-week41.txt
  checks:
    - id: report-saved
      description: ~/reports/fares-week41.txt holds this week's table exactly
      type: shell
      on: tr-finance-01
      skills: [linux.shell.regex-sed-awk]
      weight: 1.5
      command: cmp -s /var/lib/cloudtrain/cases/1.expect /home/learner/reports/fares-week41.txt && echo ok || echo no
      expect: {match: exact, value: ok}
    - id: week-log
      description: The script reproduces this week's table
      type: shell
      on: tr-finance-01
      skills: [linux.shell.regex-sed-awk]
      command: /var/lib/cloudtrain/case.sh 1 | head -1
      timeoutSec: 30
      expect: {match: exact, value: pass}
    - id: field-order
      description: Fields in a different order are still found by key
      type: shell
      on: tr-finance-01
      skills: [linux.shell.regex-sed-awk]
      weight: 1.5
      command: /var/lib/cloudtrain/case.sh 2 | head -1
      timeoutSec: 30
      expect: {match: exact, value: pass}
    - id: numeric-zone-order
      description: Zones 10 and 11 come after zone 9
      type: shell
      on: tr-finance-01
      skills: [linux.shell.regex-sed-awk]
      command: /var/lib/cloudtrain/case.sh 3 | head -1
      timeoutSec: 30
      expect: {match: exact, value: pass}
    - id: integer-fares
      description: Whole-number fares still print with two decimals, declined journeys are left out
      type: shell
      on: tr-finance-01
      skills: [linux.shell.regex-sed-awk]
      command: /var/lib/cloudtrain/case.sh 4 | head -1
      timeoutSec: 30
      expect: {match: exact, value: pass}
    - id: nothing-ok
      description: A log with no OK journey prints the header and a zero TOTAL line
      type: shell
      on: tr-finance-01
      skills: [linux.shell.regex-sed-awk]
      weight: 0.5
      command: /var/lib/cloudtrain/case.sh 5 | head -1
      timeoutSec: 30
      expect: {match: exact, value: pass}
  hints:
    - title: Fields by key
      body: "Loop over all fields: `for (i = 1; i <= NF; i++) if ($i ~ /^zone=/) zone = substr($i, 6)`. Do the same for fare and status."
      cost: 1
    - title: Arrays and END
      body: "`j[zone]++; r[zone] += fare` per OK line; print the table in the END block. `for (z in j)` visits keys in no particular order."
      cost: 1
    - title: Numeric order inside awk
      body: "Print the zone lines into a pipe, `print ... | \"sort -n\"`, then `close(\"sort -n\")` before printing TOTAL so it comes last. (This image's awk is mawk, which has no asort.)"
      cost: 2
  misconceptions:
    - id: positional-fields
      description: Reads zone, fare and status from fixed positions ($4, $5, $6).
      feedback: "Older gate firmware swaps the fields around. Find each one by its key."
      expectFail: [field-order]
      mutation:
        on: tr-finance-01
        as: learner
        run: |
          cat > ~/bin/fare-report <<'S'
          #!/bin/sh
          awk '$6 == "status=OK" {z = substr($4, 6); f = substr($5, 6); j[z]++; r[z] += f; tj++; tr += f}
          END {printf "%-5s %8s %9s\n", "ZONE", "JOURNEYS", "REVENUE"; for (z in j) printf "%-5s %8d %9.2f\n", z, j[z], r[z] | "sort -n"; close("sort -n"); printf "%-5s %8d %9.2f\n", "TOTAL", tj, tr}' "$@"
          S
          chmod +x ~/bin/fare-report; ~/bin/fare-report /srv/fares/fares-week41.log > ~/reports/fares-week41.txt
    - id: text-sort
      description: Sorts the zone lines as text.
      feedback: "As text, 10 sorts before 2. Use sort -n."
      expectFail: [numeric-zone-order]
      mutation:
        on: tr-finance-01
        as: learner
        run: |
          cat > ~/bin/fare-report <<'S'
          #!/bin/sh
          awk '{ok = 0; for (i = 1; i <= NF; i++) { if ($i == "status=OK") ok = 1; if ($i ~ /^zone=/) z = substr($i, 6); if ($i ~ /^fare=/) f = substr($i, 6) }
               if (ok) {j[z]++; r[z] += f; tj++; tr += f}}
          END {printf "%-5s %8s %9s\n", "ZONE", "JOURNEYS", "REVENUE"; for (z in j) printf "%-5s %8d %9.2f\n", z, j[z], r[z] | "sort"; close("sort"); printf "%-5s %8d %9.2f\n", "TOTAL", tj, tr}' "$@"
          S
          chmod +x ~/bin/fare-report; ~/bin/fare-report /srv/fares/fares-week41.log > ~/reports/fares-week41.txt
    - id: counts-declined
      description: Counts every journey, declined ones included.
      feedback: "A declined tap earns nothing. Filter on status=OK."
      expectFail: [integer-fares, nothing-ok]
      mutation:
        on: tr-finance-01
        as: learner
        run: |
          cat > ~/bin/fare-report <<'S'
          #!/bin/sh
          awk '{for (i = 1; i <= NF; i++) { if ($i ~ /^zone=/) z = substr($i, 6); if ($i ~ /^fare=/) f = substr($i, 6) }
               j[z]++; r[z] += f; tj++; tr += f}
          END {printf "%-5s %8s %9s\n", "ZONE", "JOURNEYS", "REVENUE"; for (z in j) printf "%-5s %8d %9.2f\n", z, j[z], r[z] | "sort -n"; close("sort -n"); printf "%-5s %8d %9.2f\n", "TOTAL", tj, tr}' "$@"
          S
          chmod +x ~/bin/fare-report
    - id: print-not-printf
      description: Uses print with tabs instead of the fixed-width format.
      feedback: "Finance's import expects fixed columns and two decimals. printf \"%-5s %8d %9.2f\\n\" gives exactly that."
      expectFail: [integer-fares]
      mutation:
        on: tr-finance-01
        as: learner
        run: |
          cat > ~/bin/fare-report <<'S'
          #!/bin/sh
          awk '{ok = 0; for (i = 1; i <= NF; i++) { if ($i == "status=OK") ok = 1; if ($i ~ /^zone=/) z = substr($i, 6); if ($i ~ /^fare=/) f = substr($i, 6) }
               if (ok) {j[z]++; r[z] += f; tj++; tr += f}}
          END {print "ZONE\tJOURNEYS\tREVENUE"; for (z in j) print z "\t" j[z] "\t" r[z] | "sort -n"; close("sort -n"); print "TOTAL\t" tj "\t" tr}' "$@"
          S
          chmod +x ~/bin/fare-report
  solution:
    explanation: |
      Each record is scanned for its zone=, fare= and status= fields wherever they
      are. OK journeys are counted and summed per zone in arrays. In END the header is
      printed, the zone lines go through `sort -n` (closed before the total so the
      total comes last), and printf gives the fixed widths and two decimals.
    steps:
      - on: tr-finance-01
        as: learner
        run: |
          mkdir -p ~/bin ~/reports
          cat > ~/bin/fare-report <<'S'
          #!/usr/bin/awk -f
          # fare-report LOG...: journeys and revenue per zone, OK journeys only.
          {
            ok = 0; zone = ""; fare = 0
            for (i = 1; i <= NF; i++) {
              if ($i == "status=OK") ok = 1
              else if ($i ~ /^zone=/) zone = substr($i, 6)
              else if ($i ~ /^fare=/) fare = substr($i, 6)
            }
            if (!ok) next
            journeys[zone]++; revenue[zone] += fare
            total_j++; total_r += fare
          }
          END {
            printf "%-5s %8s %9s\n", "ZONE", "JOURNEYS", "REVENUE"
            for (z in journeys) printf "%-5s %8d %9.2f\n", z, journeys[z], revenue[z] | "sort -n"
            close("sort -n")
            printf "%-5s %8d %9.2f\n", "TOTAL", total_j, total_r
          }
          S
          chmod +x ~/bin/fare-report
          ~/bin/fare-report /srv/fares/fares-week41.log > ~/reports/fares-week41.txt
          cat ~/reports/fares-week41.txt
    alternatives:
      - id: split-on-equals
        description: A bash wrapper that turns key=value pairs into named columns with sed first, then a short awk.
        steps:
          - on: tr-finance-01
            as: learner
            run: |
              cat > ~/bin/fare-report <<'S'
              #!/bin/bash
              # Normalise every OK line to "zone fare" with sed, then aggregate.
              printf '%-5s %8s %9s\n' ZONE JOURNEYS REVENUE
              cat "$@" | grep -w 'status=OK' \
                | sed -E 's/.*(^| )zone=([0-9]+).*/\2 &/; s/^([0-9]+) .*(^| )fare=([0-9.]+).*/\1 \3/' \
                | awk '{j[$1]++; r[$1] += $2; tj++; tr += $2}
                       END {for (z in j) printf "%-5s %8d %9.2f\n", z, j[z], r[z] | "sort -n"; close("sort -n")
                            printf "%-5s %8d %9.2f\n", "TOTAL", tj, tr}'
              S
              chmod +x ~/bin/fare-report
              ~/bin/fare-report /srv/fares/fares-week41.log > ~/reports/fares-week41.txt
