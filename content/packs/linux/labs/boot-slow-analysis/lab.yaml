apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: boot-slow-analysis
  title: Find what holds up the boot of the platform display host
  domain: linux
  frameworks: [linuxplus:troubleshooting]
  difficulty: medium
  estimatedMinutes: 20
  tags: [boot, systemd-analyze, units, troubleshooting]
  version: 1
spec:
  description: |
    Platform display host **`tr-pis-02`** (`ssh tr-pis-02`; you have `sudo`) drives the
    passenger information screens. Drivers complain that after a restart it sits for more
    than a minute before the screens come up. Someone added a unit for a card reader that
    is not fitted on this host.

    On `tr-pis-02`:

    1. Find the unit that waits on a device which does not exist, and how long it waits
       (the job timeout configured on it).
    2. Fix the cause so that nothing waits on that device any more. The display service
       **`tr-pis-display.service`** (port 8082) and the legitimate warm-up unit
       **`tr-pis-warmup.service`** must stay enabled and keep working.
    3. Write a short report to **`/home/learner/boot-report.txt`**, three lines:

       ```
       culprit=<unit name>
       wait_s=<seconds the unit waits for its device>
       userspace_s=<userspace time of the current boot, in whole seconds, from systemd-analyze>
       ```

    Do not reboot: the grading reads the configuration and the record of the current boot.
    Measuring the boot again after a reboot is part of the real procedure and cannot be
    graded over ssh here.
  objectives:
    - Use systemd-analyze and systemctl to find the unit that stalls a boot
    - Remove a dependency on a missing device without breaking the service that follows it
  params:
    wait:
      type: choice
      values: ["60", "75", "90"]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-pis-02
        driver: vm
        image: ubuntu-vm:24.04
        resources: {cpu: 2, memoryMiB: 1536}
        access: [ssh, console]
  setup:
    - on: tr-pis-02
      timeoutSec: 90
      run: |
        set -eu
        install -d -m 0700 /var/lib/cloudtrain
        echo "{{wait}}" > /var/lib/cloudtrain/boot-wait
        rm -f /home/learner/boot-report.txt
        cat > /etc/systemd/system/tr-reader-wait.service <<'EOU'
        [Unit]
        Description=Card reader attachment for the display host
        Requires=dev-tr\x2dreader.device
        After=dev-tr\x2dreader.device
        JobTimeoutSec={{wait}}

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/true

        [Install]
        WantedBy=multi-user.target
        EOU
        cat > /etc/systemd/system/tr-pis-warmup.service <<'EOU'
        [Unit]
        Description=Warm the display cache

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/sleep 3

        [Install]
        WantedBy=multi-user.target
        EOU
        mkdir -p /srv/tr-pis-02/www
        echo "next trains" > /srv/tr-pis-02/www/index.html
        cat > /etc/systemd/system/tr-pis-display.service <<'EOU'
        [Unit]
        Description=Passenger display content
        Wants=tr-reader-wait.service
        After=tr-reader-wait.service tr-pis-warmup.service network.target

        [Service]
        ExecStart=/usr/bin/python3 -m http.server 8082 --bind 127.0.0.1 --directory /srv/tr-pis-02/www
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
        EOU
        systemctl daemon-reload
        systemctl enable tr-reader-wait.service tr-pis-warmup.service tr-pis-display.service >/dev/null 2>&1
        systemctl start tr-pis-warmup.service
        systemctl start tr-pis-display.service
        systemctl start --no-block tr-reader-wait.service || true
  checks:
    - id: culprit
      description: The report names the unit that waits on the missing device
      type: shell
      on: tr-pis-02
      skills: [linux.boot.analysis]
      weight: 1.5
      command: |
        v=$(sed -n 's/^culprit=//p' /home/learner/boot-report.txt 2>/dev/null | tail -1 | tr -d ' ')
        [ "$v" = tr-reader-wait.service ] || [ "$v" = tr-reader-wait ] && echo right || echo "got:${v:-none}"
      expect: {match: exact, value: right}
    - id: wait-time
      description: The report gives the configured wait in seconds
      type: shell
      on: tr-pis-02
      skills: [linux.boot.analysis]
      weight: 1
      command: |
        v=$(sed -n 's/^wait_s=//p' /home/learner/boot-report.txt 2>/dev/null | tail -1 | tr -d ' ')
        [ "$v" = "$(cat /var/lib/cloudtrain/boot-wait)" ] && echo right || echo "got:${v:-none}"
      expect: {match: exact, value: right}
    - id: userspace-time
      description: The report gives the userspace time of the current boot (within 2 s)
      type: shell
      on: tr-pis-02
      skills: [linux.boot.analysis]
      weight: 1
      command: |
        u=$(systemctl show -p UserspaceTimestampMonotonic --value)
        f=$(systemctl show -p FinishTimestampMonotonic --value)
        v=$(sed -n 's/^userspace_s=//p' /home/learner/boot-report.txt 2>/dev/null | tail -1 | tr -d ' ')
        case "$v" in ''|*[!0-9]*) echo "got:${v:-none}"; exit 0;; esac
        awk -v u="$u" -v f="$f" -v v="$v" 'BEGIN {d = (f - u) / 1000000 - v; if (d < 0) d = -d; print (d <= 2 ? "right" : "off-by-" int(d))}'
      expect: {match: exact, value: right}
    - id: dependency-gone
      description: Nothing is ordered on or requires the missing device any more
      type: shell
      on: tr-pis-02
      skills: [linux.boot.analysis]
      weight: 2
      command: |
        ls=$(systemctl show -p LoadState --value tr-reader-wait.service)
        case "$ls" in not-found|masked) echo gone; exit 0;; esac
        if systemctl show -p Requires -p Requisite -p BindsTo -p Wants -p After -p Before tr-reader-wait.service | grep -qE 'tr\\{1,2}x2dreader'; then echo still-depends; else echo gone; fi
      expect: {match: exact, value: gone}
    - id: display-ok
      description: The display service is enabled, running and answers on port 8082
      type: shell
      on: tr-pis-02
      skills: [linux.boot.analysis]
      weight: 1.5
      command: |
        e=$(systemctl is-enabled tr-pis-display.service 2>/dev/null)
        a=$(systemctl is-active tr-pis-display.service 2>/dev/null)
        c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8082/ 2>/dev/null)
        echo "$e $a $c"
      expect: {match: exact, value: "enabled active 200"}
    - id: warmup-kept
      description: The legitimate warm-up unit is still enabled
      type: shell
      on: tr-pis-02
      skills: [linux.boot.analysis]
      weight: 0.5
      command: systemctl is-enabled tr-pis-warmup.service 2>/dev/null || echo gone
      expect: {match: exact, value: enabled}
    - id: units-verify
      description: systemd-analyze verify is clean for the display units
      type: shell
      on: tr-pis-02
      skills: [linux.boot.analysis]
      weight: 0.5
      command: |
        o=$(systemd-analyze verify /etc/systemd/system/tr-pis-display.service /etc/systemd/system/tr-pis-warmup.service 2>&1 | grep -iE 'error|failed|not found|invalid' || true)
        [ -z "$o" ] && echo clean || echo "issues"
      expect: {match: exact, value: clean}
  hints:
    - title: Where did the time go
      command: systemd-analyze critical-chain tr-pis-display.service; systemctl list-jobs
      body: "blame lists units that already finished. A start job still waiting shows in systemctl list-jobs, and critical-chain shows what the display service is ordered after."
      cost: 1
    - title: Read the unit
      command: systemctl cat tr-reader-wait.service
      body: "Requires= and After= on a .device unit make the job wait until that device appears or the job times out (JobTimeoutSec=). A device unit name uses systemd escaping: dev-tr\\x2dreader.device."
      cost: 2
    - title: Remove it cleanly
      body: "Either delete or mask the unit, or remove the Requires=/After= device lines in a drop-in or the unit. Keep the display service's own ordering working, then systemctl daemon-reload."
      cost: 2
  misconceptions:
    - id: disable-only
      description: Disables the unit but leaves its dependency on the missing device.
      feedback: "Disabling removes the wants symlink, but the display service still pulls the unit in through Wants=; remove the device dependency or the unit itself."
      expectFail: [dependency-gone]
      mutation:
        on: tr-pis-02
        as: learner
        run: |
          sudo systemctl disable tr-reader-wait.service
          u=$(systemctl show -p UserspaceTimestampMonotonic --value); f=$(systemctl show -p FinishTimestampMonotonic --value); s=$(awk -v u="$u" -v f="$f" 'BEGIN {printf "%d", (f - u) / 1000000}')
          printf 'culprit=tr-reader-wait.service\nwait_s=%s\nuserspace_s=%s\n' "$(sudo cat /var/lib/cloudtrain/boot-wait)" "$s" > /home/learner/boot-report.txt
    - id: remove-display
      description: Removes the display service instead of the dependency.
      feedback: "The display must still run; only the reader dependency is wrong."
      expectFail: [display-ok, dependency-gone]
      mutation:
        on: tr-pis-02
        as: learner
        run: |
          sudo systemctl disable --now tr-pis-display.service
          u=$(systemctl show -p UserspaceTimestampMonotonic --value); f=$(systemctl show -p FinishTimestampMonotonic --value); s=$(awk -v u="$u" -v f="$f" 'BEGIN {printf "%d", (f - u) / 1000000}')
          printf 'culprit=tr-reader-wait.service\nwait_s=%s\nuserspace_s=%s\n' "$(sudo cat /var/lib/cloudtrain/boot-wait)" "$s" > /home/learner/boot-report.txt
    - id: wrong-unit
      description: Blames the unit with the longest finished activation time, the warm-up.
      feedback: "systemd-analyze blame only lists units that ran; the stall is a start job waiting for a device."
      expectFail: [culprit, wait-time, dependency-gone, warmup-kept]
      mutation:
        on: tr-pis-02
        as: learner
        run: |
          sudo systemctl disable tr-pis-warmup.service
          u=$(systemctl show -p UserspaceTimestampMonotonic --value); f=$(systemctl show -p FinishTimestampMonotonic --value); s=$(awk -v u="$u" -v f="$f" 'BEGIN {printf "%d", (f - u) / 1000000}')
          printf 'culprit=tr-pis-warmup.service\nwait_s=3\nuserspace_s=%s\n' "$s" > /home/learner/boot-report.txt
  solution:
    explanation: |
      systemctl list-jobs and systemctl cat show tr-reader-wait.service waiting on the
      device unit dev-tr\x2dreader.device. Removing that unit (or its Requires/After lines)
      stops the stall; the display service only Wants it, so it keeps working. The
      report copies the unit name, its JobTimeoutSec and the userspace time of the boot
      from systemd-analyze.
    steps:
      - on: tr-pis-02
        as: learner
        run: |
          set -e
          systemctl list-jobs --no-pager || true
          w=$(systemctl show -p JobTimeoutUSec --value tr-reader-wait.service)
          sudo systemctl stop tr-reader-wait.service 2>/dev/null || true
          sudo systemctl disable tr-reader-wait.service
          sudo sed -i '/dev-tr\\x2dreader.device/d' /etc/systemd/system/tr-reader-wait.service
          sudo systemctl daemon-reload
          u=$(systemctl show -p UserspaceTimestampMonotonic --value); f=$(systemctl show -p FinishTimestampMonotonic --value)
          s=$(awk -v u="$u" -v f="$f" 'BEGIN {printf "%d", (f - u) / 1000000}')
          secs=$(awk -v w="$w" 'BEGIN {n = split(w, a, " "); t = 0; for (i = 1; i <= n; i++) { if (a[i] ~ /min/) t += a[i] * 60; else if (a[i] ~ /s$/) t += a[i] + 0 } ; if (n == 1 && w ~ /^[0-9.]+s$/) t = w + 0; print int(t)}')
          printf 'culprit=tr-reader-wait.service\nwait_s=%s\nuserspace_s=%s\n' "$secs" "$s" > /home/learner/boot-report.txt
          cat /home/learner/boot-report.txt
    alternatives:
      - id: mask-unit
        description: Mask the card reader unit instead of editing it.
        steps:
          - on: tr-pis-02
            as: learner
            run: |
              set -e
              sudo systemctl stop tr-reader-wait.service 2>/dev/null || true
              sudo rm -f /etc/systemd/system/tr-reader-wait.service
              sudo systemctl daemon-reload
              sudo systemctl mask tr-reader-wait.service
              u=$(systemctl show -p UserspaceTimestampMonotonic --value); f=$(systemctl show -p FinishTimestampMonotonic --value)
              s=$(awk -v u="$u" -v f="$f" 'BEGIN {printf "%d", (f - u) / 1000000}')
              printf 'culprit=tr-reader-wait.service\nwait_s=%s\nuserspace_s=%s\n' "$(sudo cat /var/lib/cloudtrain/boot-wait)" "$s" > /home/learner/boot-report.txt
