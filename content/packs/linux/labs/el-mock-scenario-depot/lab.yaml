              printf 'Cmnd_Alias DEPOT_WEB = /usr/bin/systemctl restart httpd\n%%depotops ALL=(root) NOPASSWD: DEPOT_WEB\n' | sudo tee /etc/sudoers.d/depotops >/dev/null
              sudo chmod 0440 /etc/sudoers.d/depotops
