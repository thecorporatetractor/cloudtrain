      - id: extents-and-alias
        description: Size the logical volumes in extents, use a Cmnd_Alias and mapper names in fstab, and make the firewall rule runtime first.
        steps:
          - on: tr-depot-01
            as: learner
            timeoutSec: 600
            run: |
              set -e
              sudo tee /etc/yum.repos.d/depot.repo >/dev/null <<'EOF'
              [depot-local]
              name=Depot local repository
              baseurl=file:///opt/cloudtrain/repo/el10
