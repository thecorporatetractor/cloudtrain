apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: fix-firewall-blocks-app
  title: Restore access to the depot API blocked by the firewall
  domain: linux
  frameworks: [linuxplus:troubleshooting]
  difficulty: medium
  estimatedMinutes: 15
  tags: [nftables, firewall, troubleshooting, persistence]
  version: 1
spec:
  description: |
    Work on **`tr-el-01`** (`ssh tr-el-01`; you have `sudo`), the depot API server. Two client
    networks are network namespaces on it (`sudo ip netns exec <name> <command>`):

    | network | client | cable end on tr-el-01 |
    |---|---|---|
    | depot tablets 10.42.7.0/24 | namespace `tablets` (10.42.7.20) | `fw-tab` (10.42.7.1) |
    | visitors Wi-Fi 10.42.8.0/24 | namespace `visitors` (10.42.8.20) | `fw-vis` (10.42.8.1) |

    After last week's hardening change the depot tablets can no longer reach the depot API on
    **TCP 9443**. The hardening ruleset lives in `/etc/nftables/hardening.nft`, is included by
    `/etc/sysconfig/nftables.conf` and is loaded by the `nftables` service (`firewalld` is not
    used on this host).

    Find the rule responsible and fix it so that:

    - the **tablet subnet 10.42.7.0/24 can reach TCP 9443**, and **nobody else** can (the
      visitors network must still be blocked);
    - **the rest of the hardening policy stays**: TCP {{blocked}} and TCP 3306 are still
      blocked for everyone, and SSH keeps working;
    - the fix is **loaded at boot** from the configuration file, not only in the running ruleset.
  objectives:
    - Read a live nftables ruleset and find the rule that blocks a service
    - Allow one source subnet without opening the port to everybody
    - Apply the change to the running ruleset and to the saved file
  params:
    blocked:
      type: choice
      values: ["9999", "7777"]
    token:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-el-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536, disks: ["1Gi"]}
        access: [ssh, console]
  setup:
    - on: tr-el-01
      timeoutSec: 150
      run: |
        set -eu
        install -d -m 0700 /var/lib/cloudtrain
        for u in tr-depot-9443 tr-depot-{{blocked}} tr-depot-3306; do systemctl stop $u.service 2>/dev/null || true; done
        systemctl disable --now firewalld >/dev/null 2>&1 || true
        for n in tablets visitors; do ip netns del $n 2>/dev/null || true; ip netns add $n; ip -n $n link set lo up; done
        for l in fw-tab fw-vis; do ip link del $l 2>/dev/null || true; done
        mk() { # ns hostif hostaddr peeraddr
          ip link add $2 type veth peer name $2-p
          ip link set $2-p netns $1 name eth0
          ip addr add $3 dev $2; ip link set $2 up
          ip -n $1 addr add $4 dev eth0; ip -n $1 link set eth0 up
          command -v nmcli >/dev/null 2>&1 && nmcli device set $2 managed no >/dev/null 2>&1 || true
        }
        mk tablets fw-tab 10.42.7.1/24 10.42.7.20/24
        mk visitors fw-vis 10.42.8.1/24 10.42.8.20/24
        mkdir -p /srv/tr-depot-api /etc/nftables; echo "depot {{token}}" > /srv/tr-depot-api/index.html
        for p in 9443 {{blocked}} 3306; do
          systemd-run -q --unit=tr-depot-$p --collect /usr/bin/python3 -m http.server $p --directory /srv/tr-depot-api
        done
        cat > /etc/nftables/hardening.nft <<'EONFT'
        # Tallowmere hardening baseline (change ticket HARD-214)
        table inet hardening {
          chain input {
            type filter hook input priority 0; policy accept;
            ct state established,related accept
            iif lo accept
            # block unused admin and database ports
            tcp dport { 9443, {{blocked}}, 3306 } drop comment "hardening: unused ports"
          }
        }
        EONFT
        printf '# Tallowmere gateway ruleset\nflush ruleset\ninclude "/etc/nftables/hardening.nft"\n' > /etc/sysconfig/nftables.conf
        systemctl enable nftables >/dev/null 2>&1
        nft flush ruleset
        nft -f /etc/sysconfig/nftables.conf
        sleep 1
        ! ip netns exec tablets curl -4 -s -m 3 http://10.42.7.1:9443/ >/dev/null
  checks:
    - id: tablets-reach
      description: The tablet network reaches the depot API on 9443
      type: shell
      on: tr-el-01
      skills: [linux.net.firewall]
      weight: 2.5
      timeoutSec: 30
      command: ip netns exec tablets curl -4 -s -m 8 http://10.42.7.1:9443/ 2>/dev/null || echo unreachable
      expect: {match: exact, value: "depot {{token}}"}
    - id: visitors-blocked
      description: The visitors network is still blocked from 9443
      type: shell
      on: tr-el-01
      skills: [linux.net.firewall]
      weight: 2
      timeoutSec: 30
      command: |
        ip netns exec tablets curl -4 -s -m 8 http://10.42.7.1:9443/ | grep -q depot || { echo not-configured; exit 0; }
        ip netns exec visitors curl -4 -s -m 5 http://10.42.8.1:9443/ 2>/dev/null | grep -q depot && echo open || echo blocked
      expect: {match: exact, value: blocked}
    - id: policy-kept
      description: The other blocked ports stay blocked and SSH works
      type: shell
      on: tr-el-01
      skills: [linux.net.firewall]
      weight: 1.5
      timeoutSec: 45
      command: |
        ip netns exec tablets curl -4 -s -m 8 http://10.42.7.1:9443/ | grep -q depot || { echo not-configured; exit 0; }
        a=$(ip netns exec tablets curl -4 -s -m 3 http://10.42.7.1:{{blocked}}/ 2>/dev/null)
        b=$(ip netns exec visitors curl -4 -s -m 3 http://10.42.8.1:3306/ 2>/dev/null)
        s=$(timeout 8 ip netns exec tablets bash -c 'exec 3<>/dev/tcp/10.42.7.1/22 && head -c 4 <&3' 2>/dev/null)
        [ -z "$a$b" ] && [ "$s" = "SSH-" ] && echo kept || echo "a=$a b=$b ssh=$s"
      expect: {match: exact, value: kept}
    - id: persistent
      description: The saved configuration allows only the tablet subnet on 9443 and keeps the other drops
      type: shell
      on: tr-el-01
      skills: [linux.net.firewall]
      weight: 2
      timeoutSec: 30
      command: |
        [ "$(systemctl is-enabled nftables 2>/dev/null)" = enabled ] || { echo not-enabled; exit 0; }
        nft -c -f /etc/sysconfig/nftables.conf >/dev/null 2>&1 || { echo invalid; exit 0; }
        ip netns del trchk 2>/dev/null; ip netns add trchk
        ip netns exec trchk nft -f /etc/sysconfig/nftables.conf >/dev/null 2>&1
        r=$(ip netns exec trchk nft list ruleset 2>/dev/null)
        ip netns del trchk 2>/dev/null
        echo "$r" | awk '
          /10\.42\.7\.0\/24/ && /9443/ && /accept/ && !a {a = NR}
          /9443/ && /drop/ && !/!= 10\.42\.7\.0\/24/ && !d {d = NR}
          /!= 10\.42\.7\.0\/24/ && /9443/ && /drop/ {ne = 1}
          /3306/ && /drop/ {p3 = 1}
          /{{blocked}}/ && /drop/ {pb = 1}
          END {print ((ne || (a && (!d || a < d))) && p3 && pb) ? "persistent" : "incomplete"}'
      expect: {match: exact, value: persistent}
  hints:
    - title: Read the live ruleset
      command: sudo nft -a list ruleset
      body: "-a shows rule handles. Look for a rule that drops port 9443 and note where it sits: nftables evaluates rules in order and the first terminal verdict wins."
      cost: 0
    - title: One rule, three ports
      body: "The drop covers a set of ports. You cannot carve an exception out of a set, but you can add an accept rule for the tablet subnet and port 9443 before the drop rule."
      cost: 1
    - title: Live and saved
      command: sudo nft insert rule inet hardening input position <handle> ip saddr 10.42.7.0/24 tcp dport 9443 accept
      body: "Edit /etc/nftables/hardening.nft too, check it with nft -c -f /etc/sysconfig/nftables.conf and reload with systemctl reload nftables (or restart) so the file and the running rules agree."
      cost: 1
  misconceptions:
    - id: runtime-only
      description: Inserts the accept rule in the running ruleset only.
      feedback: "nft insert rule changes the running ruleset only. Put the same rule into /etc/nftables/hardening.nft so the service loads it at boot."
      expectFail: [persistent]
      mutation:
        on: tr-el-01
        as: learner
        run: |
          h=$(sudo nft -a list chain inet hardening input | awk '/tcp dport/ {print $NF; exit}')
          sudo nft insert rule inet hardening input position "$h" ip saddr 10.42.7.0/24 tcp dport 9443 accept
    - id: deletes-drop
      description: Deletes the drop rule completely.
      feedback: "That opens 9443, {{blocked}} and 3306 to everybody, including the visitors. Keep the drop and add an accept for the tablet subnet before it."
      expectFail: [visitors-blocked, policy-kept, persistent]
      mutation:
        on: tr-el-01
        as: learner
        run: |
          sudo sed -i '/tcp dport {/d' /etc/nftables/hardening.nft
          sudo nft flush ruleset
          sudo nft -f /etc/sysconfig/nftables.conf
  solution:
    explanation: The drop rule matches a set of ports for every source. An accept rule for the tablet subnet and port 9443, placed before it, lets only the tablets through while the visitors and the other ports still hit the drop. Saving it in the included file keeps it across restarts.
    steps:
      - on: tr-el-01
        as: learner
        run: |
          set -e
          sudo sed -i 's|^\( *\)tcp dport { 9443|\1ip saddr 10.42.7.0/24 tcp dport 9443 accept\n&|' /etc/nftables/hardening.nft
          sudo nft -c -f /etc/sysconfig/nftables.conf
          sudo systemctl restart nftables
          sudo nft list ruleset
    alternatives:
      - id: split-set
        description: Rewrite the drop so 9443 is dropped only for sources outside the tablet subnet, and keep the other ports in their own drop rule.
        steps:
          - on: tr-el-01
            as: learner
            run: |
              set -e
              sudo sed -i 's|^\( *\)tcp dport { 9443, \(.*\) } drop|\1ip saddr != 10.42.7.0/24 tcp dport 9443 drop\n\1tcp dport { \2 } drop|' /etc/nftables/hardening.nft
              sudo nft -c -f /etc/sysconfig/nftables.conf
              sudo systemctl restart nftables
