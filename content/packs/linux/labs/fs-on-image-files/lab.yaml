apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: fs-on-image-files
  title: Practise filesystems safely on image files
  domain: linux
  frameworks: [lpic1:devices-filesystems, lfcs:storage]
  difficulty: easy
  estimatedMinutes: 15
  tags: [filesystems, ext4, xfs, partitions, sfdisk, mkfs, image-file]
  version: 1
spec:
  description: |
    Before touching real disks, the storage team practises on image files. On `tr-store-01`
    (you are an ordinary user; no `sudo` and nothing to mount) build a disk image in
    **`~/lab-fs/disk.img`** and prepare the filesystems **inside it** without mounting
    anything. The tools `sfdisk`, `mke2fs`, `mkfs.xfs`, `dumpe2fs`, `xfs_db` and `dd` are
    installed; sample data is in `~/lab-fs/ext4-content/` ({{nfiles}} timetable files) and
    `~/lab-fs/xfs-content/` ({{xfiles}} fares files).

    1. Create `~/lab-fs/disk.img` as a **sparse file of 640 MiB** (`truncate`) and write a
       partition table with **two partitions**: the first at least 64 MiB, the second at
       least **320 MiB** (XFS refuses to be smaller than 300 MB).
    2. Put an **ext4** filesystem filled with `ext4-content/` into the **first** partition
       and an **XFS** filesystem filled with `xfs-content/` into the **second**, both inside
       the image file. Hints: `mke2fs -d DIR -E offset=BYTES` populates ext4 without mounting;
       `mkfs.xfs` has no offset option, so build the XFS filesystem as a **separate image**
       (`-p PROTOFILE` populates it) and copy it into the partition with `dd`.
    3. Write `~/lab-fs/fs.txt` with the **used inodes and used blocks** of each filesystem,
       in filesystem blocks, exactly in this form:

       ```
       ext4 inodes_used=N blocks_used=N
       xfs inodes_used=N blocks_used=N
       ```

       (used = total - free; `dumpe2fs -h` shows the ext4 numbers, `xfs_db -r -c "sb 0" -c "p icount"`
       and friends the XFS ones).
  objectives:
    - Create a sparse disk image and partition it with sfdisk
    - Create ext4 and XFS filesystems inside partitions of an image without mounting
    - Populate filesystems from a directory
    - Read used inodes and blocks from filesystem metadata
  params:
    nfiles:
      type: choice
      values: ["40", "75"]
    xfiles:
      type: choice
      values: ["20", "35"]
  topology:
    entry: tr-store-01
    nodes:
      - name: tr-store-01
        driver: container
        image: deb-lab:24.04
        access: [shell]
  setup:
    - on: tr-store-01
      timeoutSec: 300
      run: |
        set -eu
        apt-get update -q >/dev/null
        DEBIAN_FRONTEND=noninteractive apt-get install -y -q fdisk xfsprogs >/dev/null
        L=/home/learner/lab-fs
        rm -rf $L; mkdir -p $L/ext4-content $L/xfs-content
        python3 - $L {{nfiles}} {{xfiles}} <<'EOT'
        import os, random, sys
        base, n, m = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
        r = random.Random(7)
        for i in range(1, n + 1):
            open("%s/ext4-content/timetable-%03d.dat" % (base, i), "wb").write(r.randbytes(r.randrange(2000, 60000)))
        for i in range(1, m + 1):
            open("%s/xfs-content/fares-%03d.dat" % (base, i), "wb").write(r.randbytes(r.randrange(1000, 90000)))
        EOT
        chown -R learner:learner $L
  checks:
    - id: image-and-partitions
      description: disk.img is a 640 MiB image with a partition table of two partitions of at least 64 MiB and 320 MiB, inside the image
      type: shell
      on: tr-store-01
      skills: [linux.storage.partitions]
      weight: 1.5
      timeoutSec: 30
      command: |
        img=/home/learner/lab-fs/disk.img
        [ -f $img ] || { echo no-image; exit 0; }
        [ "$(stat -c %s $img)" = 671088640 ] || { echo "size-$(stat -c %s $img)"; exit 0; }
        j=$(sfdisk -J $img 2>/dev/null) || { echo no-partition-table; exit 0; }
        printf '%s\n' "$j" | python3 -c '
        import json, sys
        t = json.load(sys.stdin)["partitiontable"]; p = t["partitions"]
        total = 671088640 // 512
        if len(p) != 2: print("partitions=%d" % len(p)); sys.exit()
        if any(x["start"] + x["size"] > total for x in p): print("outside-image"); sys.exit()
        if p[0]["size"] < 64 * 2048: print("first-too-small"); sys.exit()
        if p[1]["size"] < 320 * 2048: print("second-too-small"); sys.exit()
        print("ok")'
      expect: {match: exact, value: ok}
    - id: filesystems-filled
      description: The first partition holds a clean ext4 with all timetable files, the second a clean XFS with all fares files
      type: shell
      on: tr-store-01
      skills: [linux.storage.filesystems]
      weight: 3
      timeoutSec: 150
      command: |
        img=/home/learner/lab-fs/disk.img; [ -f $img ] || { echo no-image; exit 0; }
        set -- $(sfdisk -J $img 2>/dev/null | python3 -c '
        import json, sys
        p = json.load(sys.stdin)["partitiontable"]["partitions"]
        print(p[0]["start"], p[0]["size"], p[1]["start"], p[1]["size"])' 2>/dev/null) || { echo no-table; exit 0; }
        [ $# -eq 4 ] || { echo no-table; exit 0; }
        off1=$(($1 * 512))
        e=$(e2fsck -fn "$img?offset=$off1" >/dev/null 2>&1 && echo clean || echo damaged)
        feat=$(dumpe2fs -h "$img?offset=$off1" 2>/dev/null | awk -F: '/^Filesystem features/ {print $2}')
        case "$feat" in *extent*) ;; *) e="not-ext4" ;; esac
        hdr=$(dumpe2fs -h "$img?offset=$off1" 2>/dev/null)
        bc=$(printf '%s\n' "$hdr" | awk -F: '/^Block count/ {print $2+0}'); bs=$(printf '%s\n' "$hdr" | awk -F: '/^Block size/ {print $2+0}')
        [ "$(( ${bc:-0} * ${bs:-0} ))" -gt $(($2 * 512)) ] && e=overflows
        en=$(debugfs -R "ls -p /" "$img?offset=$off1" 2>/dev/null | grep -c 'timetable-[0-9]*\.dat')
        t=$(mktemp); dd if=$img of=$t bs=512 skip=$3 count=$4 status=none
        magic=$(xfs_db -r -c "sb 0" -c "p magicnum" $t 2>/dev/null | awk '{print $3}')
        x=$([ "$magic" = 0x58465342 ] && xfs_repair -n $t >/dev/null 2>&1 && echo clean || echo bad)
        xn=$(xfs_db -r -c "blockget -n" -c ncheck $t 2>/dev/null | grep -c 'fares-[0-9]*\.dat')
        sz=$(xfs_db -r -c "sb 0" -c "p dblocks" -c "p blocksize" $t 2>/dev/null | awk '/dblocks/ {d = $3} /blocksize/ {b = $3} END {print d * b}')
        rm -f $t
        [ "${sz:-0}" -ge 314572800 ] && s=big-enough || s=xfs-too-small
        echo "ext4=$e files=$en xfs=$x files=$xn $s"
      expect: {match: exact, value: "ext4=clean files={{nfiles}} xfs=clean files={{xfiles}} big-enough"}
    - id: usage-report
      description: fs.txt reports the used inodes and used blocks of both filesystems as they are in the image
      type: shell
      on: tr-store-01
      skills: [linux.storage.filesystems]
      weight: 2
      timeoutSec: 150
      command: |
        img=/home/learner/lab-fs/disk.img; r=/home/learner/lab-fs/fs.txt
        [ -f $img ] && [ -f $r ] || { echo missing; exit 0; }
        set -- $(sfdisk -J $img 2>/dev/null | python3 -c '
        import json, sys
        p = json.load(sys.stdin)["partitiontable"]["partitions"]
        print(p[0]["start"], p[0]["size"], p[1]["start"], p[1]["size"])' 2>/dev/null) || { echo no-table; exit 0; }
        d=$(dumpe2fs -h "$img?offset=$(($1 * 512))" 2>/dev/null)
        ei=$(printf '%s\n' "$d" | awk -F: '/^Inode count/ {a = $2} /^Free inodes/ {b = $2} END {print a - b}')
        eb=$(printf '%s\n' "$d" | awk -F: '/^Block count/ {a = $2} /^Free blocks/ {b = $2} END {print a - b}')
        t=$(mktemp); dd if=$img of=$t bs=512 skip=$3 count=$4 status=none
        xv=$(xfs_db -r -c "sb 0" -c "p icount" -c "p ifree" -c "p dblocks" -c "p fdblocks" $t 2>/dev/null | awk '{v[$1] = $3} END {print v["icount"] - v["ifree"], v["dblocks"] - v["fdblocks"]}')
        rm -f $t
        want="ext4 inodes_used=$ei blocks_used=$eb
        xfs inodes_used=${xv% *} blocks_used=${xv#* }"
        got=$(sed 's/[[:space:]]\+/ /g; s/ $//' $r | grep -E '^(ext4|xfs) ' | sort)
        want=$(printf '%s\n' "$want" | sed 's/^ *//' | sort)
        [ "$got" = "$want" ] && echo match || echo differs
      expect: {match: exact, value: match}
  hints:
    - title: Image and partition table
      body: "`truncate -s 640M disk.img`, then `printf 'label: gpt\\nstart=2048, size=409600\\nstart=411648, size=675840\\n' | sfdisk disk.img` (sizes in 512-byte sectors). `sfdisk -d disk.img` or `fdisk -l disk.img` shows start and size."
      cost: 1
    - title: ext4 without mounting
      body: "Offset in bytes = start sector x 512. `mke2fs -t ext4 -b 4096 -F -d ext4-content -E offset=BYTES disk.img BLOCKS` where BLOCKS = size in sectors x 512 / 4096. Without `-E offset` mke2fs writes at the start of the file and destroys the partition table."
      cost: 2
    - title: XFS as a separate image
      body: "A protofile lists the files: first line `/dev/null`, then `0 0`, then `d--755 0 0`, then one `name ---644 0 0 /full/path` per file and a final `$`. `mkfs.xfs -f -d file,name=xfs.img,size=320m -p xfs.proto` builds it; `dd if=xfs.img of=disk.img bs=512 seek=START conv=notrunc` places it."
      cost: 2
    - title: Reading the numbers
      body: "`dumpe2fs -h 'disk.img?offset=BYTES'` prints Inode count, Free inodes, Block count and Free blocks. For XFS: `xfs_db -r -c 'sb 0' -c 'p icount' -c 'p ifree' -c 'p dblocks' -c 'p fdblocks' xfs.img`."
      cost: 1
  misconceptions:
    - id: mke2fs-without-offset
      description: Runs mke2fs on the image file without an offset, overwriting the start of the image where the partition table lives.
      feedback: "mke2fs writes its filesystem at byte 0 of whatever file you give it unless told otherwise. The partition table at the start of the image is gone. Use `-E offset=` with the partition's byte offset."
      expectFail: [image-and-partitions, filesystems-filled]
      mutation:
        on: tr-store-01
        as: learner
        run: |
          bash <<'EOS'
          set -e
          cd ~/lab-fs
          truncate -s 640M disk.img
          printf 'label: dos\nstart=2048, size=409600\nstart=411648, size=675840\n' | sfdisk -q disk.img >/dev/null
          mke2fs -q -t ext4 -b 4096 -d ext4-content -F disk.img 51200
          echo "ext4 inodes_used=0 blocks_used=0" > fs.txt
          EOS
    - id: xfs-below-minimum
      description: Makes the XFS partition 100 MiB, below the 300 MB minimum, so mkfs.xfs refuses.
      feedback: "XFS needs at least 300 MB; mkfs.xfs reports 'Filesystem must be larger than 300MB'. Make the second partition at least 320 MiB."
      expectFail: [image-and-partitions, filesystems-filled]
      mutation:
        on: tr-store-01
        as: learner
        run: |
          bash <<'EOS'
          cd ~/lab-fs
          truncate -s 640M disk.img
          printf 'label: gpt\nstart=2048, size=409600\nstart=411648, size=204800\n' | sfdisk -q disk.img >/dev/null
          mke2fs -q -t ext4 -b 4096 -d ext4-content -E offset=$((2048 * 512)) -F disk.img 51200
          mkfs.xfs -f -d file,name=xfs.img,size=100m >/dev/null 2>&1 || true
          echo "ext4 inodes_used=0 blocks_used=0" > fs.txt
          EOS
    - id: totals-instead-of-used
      description: Builds both filesystems correctly but reports the total inode and block counts.
      feedback: "The report wants what is used: total minus free. `dumpe2fs -h` prints both totals and free counts; so does the XFS superblock (icount/ifree, dblocks/fdblocks)."
      expectFail: [usage-report]
      mutation:
        on: tr-store-01
        as: learner
        run: |
          bash <<'EOS'
          set -e
          cd ~/lab-fs
          truncate -s 640M disk.img
          printf 'label: gpt\nstart=2048, size=409600\nstart=411648, size=675840\n' | sfdisk -q disk.img >/dev/null
          mke2fs -q -t ext4 -b 4096 -d ext4-content -E offset=$((2048 * 512)) -F disk.img 51200
          { echo /dev/null; echo "0 0"; echo "d--755 0 0"; for f in xfs-content/*; do echo "$(basename $f) ---644 0 0 $PWD/$f"; done; echo '$'; } > xfs.proto
          mkfs.xfs -q -f -d file,name=xfs.img,size=320m -p xfs.proto
          dd if=xfs.img of=disk.img bs=512 seek=411648 conv=notrunc status=none
          ei=$(dumpe2fs -h "disk.img?offset=$((2048 * 512))" 2>/dev/null | awk -F: '/^Inode count/ {print $2+0}')
          eb=$(dumpe2fs -h "disk.img?offset=$((2048 * 512))" 2>/dev/null | awk -F: '/^Block count/ {print $2+0}')
          xi=$(xfs_db -r -c "sb 0" -c "p icount" xfs.img | awk '{print $3}'); xb=$(xfs_db -r -c "sb 0" -c "p dblocks" xfs.img | awk '{print $3}')
          printf 'ext4 inodes_used=%s blocks_used=%s\nxfs inodes_used=%s blocks_used=%s\n' $ei $eb $xi $xb > fs.txt
          EOS
    - id: mke2fs-no-size
      description: Builds the ext4 with the right offset but without a size, so the filesystem runs on across the second partition.
      feedback: "Without a BLOCKS argument mke2fs sizes the filesystem to the rest of the file from the offset, so it overlaps partition 2. Give it the partition's size in filesystem blocks."
      expectFail: [filesystems-filled]
      mutation:
        on: tr-store-01
        as: learner
        run: |
          bash <<'EOS'
          set -e
          cd ~/lab-fs
          truncate -s 640M disk.img
          printf 'label: gpt\nstart=2048, size=409600\nstart=411648, size=675840\n' | sfdisk -q disk.img >/dev/null
          mke2fs -q -t ext4 -b 4096 -d ext4-content -E offset=$((2048 * 512)) -F disk.img
          { echo /dev/null; echo "0 0"; echo "d--755 0 0"; for f in xfs-content/*; do echo "$(basename $f) ---644 0 0 $PWD/$f"; done; echo '$'; } > xfs.proto
          mkfs.xfs -q -f -d file,name=xfs.img,size=320m -p xfs.proto
          dd if=xfs.img of=disk.img bs=512 seek=411648 conv=notrunc status=none
          echo "ext4 inodes_used=0 blocks_used=0" > fs.txt
          EOS
  solution:
    explanation: |
      Partition the sparse image with sfdisk, populate ext4 in place with mke2fs -d and an
      offset, build the XFS filesystem as its own image from a protofile and dd it into the
      second partition, then read the used counts from the superblocks.
    steps:
      - on: tr-store-01
        as: learner
        timeoutSec: 120
        run: |
          bash <<'EOS'
          set -e
          cd ~/lab-fs
          truncate -s 640M disk.img
          printf 'label: gpt\nstart=2048, size=409600\nstart=411648, size=675840\n' | sfdisk -q disk.img
          sfdisk -d disk.img
          mke2fs -q -t ext4 -b 4096 -d ext4-content -E offset=$((2048 * 512)) -F disk.img $((409600 * 512 / 4096))
          { echo /dev/null; echo "0 0"; echo "d--755 0 0"; for f in xfs-content/*; do echo "$(basename $f) ---644 0 0 $PWD/$f"; done; echo '$'; } > xfs.proto
          mkfs.xfs -q -f -d file,name=xfs.img,size=320m -p xfs.proto
          dd if=xfs.img of=disk.img bs=512 seek=411648 conv=notrunc status=none
          d=$(dumpe2fs -h "disk.img?offset=$((2048 * 512))" 2>/dev/null)
          ei=$(echo "$d" | awk -F: '/^Inode count/ {a=$2} /^Free inodes/ {b=$2} END {print a-b}')
          eb=$(echo "$d" | awk -F: '/^Block count/ {a=$2} /^Free blocks/ {b=$2} END {print a-b}')
          xv=$(xfs_db -r -c "sb 0" -c "p icount" -c "p ifree" -c "p dblocks" -c "p fdblocks" xfs.img | awk '{v[$1]=$3} END {print v["icount"]-v["ifree"], v["dblocks"]-v["fdblocks"]}')
          printf 'ext4 inodes_used=%s blocks_used=%s\nxfs inodes_used=%s blocks_used=%s\n' $ei $eb ${xv% *} ${xv#* } > fs.txt
          cat fs.txt
          EOS
    alternatives:
      - id: fdisk-script-and-debugfs-report
        description: Partition with a scripted fdisk (MBR) and read the ext4 numbers with debugfs stats instead of dumpe2fs.
        steps:
          - on: tr-store-01
            as: learner
            timeoutSec: 120
            run: |
              bash <<'EOS'
              set -e
              cd ~/lab-fs
              truncate -s 640M disk.img
              printf 'o\nn\np\n1\n2048\n+200M\nn\np\n2\n\n+330M\nw\n' | fdisk -u disk.img >/dev/null
              read s1 z1 s2 z2 < <(sfdisk -J disk.img | python3 -c 'import json,sys; p=json.load(sys.stdin)["partitiontable"]["partitions"]; print(p[0]["start"],p[0]["size"],p[1]["start"],p[1]["size"])')
              mke2fs -q -t ext4 -b 4096 -d ext4-content -E offset=$((s1 * 512)) -F disk.img $((z1 * 512 / 4096))
              { echo /dev/null; echo "0 0"; echo "d--755 0 0"; for f in xfs-content/*; do echo "$(basename $f) ---644 0 0 $PWD/$f"; done; echo '$'; } > xfs.proto
              mkfs.xfs -q -f -d file,name=xfs.img,size=$((z2 * 512)) -p xfs.proto
              dd if=xfs.img of=disk.img bs=512 seek=$s2 conv=notrunc status=none
              ei=$(debugfs -R "stats" "disk.img?offset=$((s1 * 512))" 2>/dev/null | awk '/^Inode count:/ {a=$3} /^Free inodes:/ {b=$3} END {print a-b}')
              eb=$(debugfs -R "stats" "disk.img?offset=$((s1 * 512))" 2>/dev/null | awk '/^Block count:/ {a=$3} /^Free blocks:/ {b=$3} END {print a-b}')
              xi=$(xfs_db -r -c "sb 0" -c "p icount" -c "p ifree" xfs.img | awk '{v[$1]=$3} END {print v["icount"]-v["ifree"]}'); xb=$(xfs_db -r -c "sb 0" -c "p dblocks" -c "p fdblocks" xfs.img | awk '{v[$1]=$3} END {print v["dblocks"]-v["fdblocks"]}')
              printf 'ext4 inodes_used=%s blocks_used=%s\nxfs inodes_used=%s blocks_used=%s\n' $ei $eb $xi $xb > fs.txt
              EOS
