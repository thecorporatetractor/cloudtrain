apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: iperf-throughput-baseline
  title: Baseline throughput between two depots
  domain: linux
  frameworks: [linuxplus:troubleshooting]
  difficulty: medium
  estimatedMinutes: 15
  tags: [iperf3, throughput, mtu, performance, networking]
  version: 1
spec:
  description: |
    Work on **`tr-net-01`** (`ssh tr-net-01`; you have `sudo`). The two depots are network
    namespaces on it, joined by a virtual link (use `sudo ip netns exec <depot> <command>`):

    | depot | address | interface |
    |---|---|---|
    | `depot-a` | 10.74.1.1/24 | `eth0` |
    | `depot-b` | 10.74.1.2/24 | `eth0` |

    The network team needs a throughput baseline for the depot link before and after a
    tuning change. `iperf3` is installed and an `iperf3` **server is already running in
    `depot-b`** (port 5201); you only run the clients.

    1. Run an `iperf3` **TCP** test and a **UDP** test (`-u -b 1G`) from `depot-a` to
       `depot-b` for **{{duration}} seconds** each (`-t {{duration}}`), with the default MTU
       (1500). Save the JSON reports (`-J`) as `~/answers/tcp-before.json` and
       `~/answers/udp-before.json`.
    2. Tune the link: raise the **MTU of both ends** (`eth0` in both namespaces) to **9000**.
       Ring settings cannot be changed on a virtual link, so the MTU is the tuning knob.
    3. Repeat both tests and save `~/answers/tcp-after.json` and `~/answers/udp-after.json`.
    4. Write the four results (throughput in Mbit/s, as measured by iperf3) to
       `~/answers/baseline.txt`, one `name=value` per line:
       `tcp_before=`, `tcp_after=`, `udp_before=`, `udp_after=`.

    Do not touch the management interface (shown by `ip route show default`) of `tr-net-01`.
  objectives:
    - Run iperf3 clients in one namespace against a server in another
    - Compare TCP and UDP throughput before and after an MTU change
    - Record measured values from the JSON output
  params:
    duration:
      type: choice
      values: ["5", "8"]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-net-01
        driver: vm
        image: ubuntu-vm:24.04
        resources: {cpu: 2, memoryMiB: 1536, disks: ["1Gi"]}
        access: [ssh, console]
  setup:
    - on: tr-net-01
      timeoutSec: 180
      run: |
        set -eu
        install -d -m 0700 /var/lib/cloudtrain
        if ! command -v iperf3 >/dev/null 2>&1; then
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.cloud-init; rm -rf /var/lib/apt/lists/*; fi
          apt-get update -q >/dev/null 2>&1 || true
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q iperf3 >/dev/null 2>&1 || { echo "iperf3 is not in the lab package mirror: add iperf3 to tools/mirrors/packages-noble.txt and rebuild the VM image" >&2; exit 1; }
        fi
        for n in depot-a depot-b; do ip netns del $n 2>/dev/null || true; ip netns add $n; ip -n $n link set lo up; done
        ip link add ab-a type veth peer name ab-b
        ip link set ab-a netns depot-a name eth0
        ip link set ab-b netns depot-b name eth0
        ip -n depot-a addr add 10.74.1.1/24 dev eth0; ip -n depot-a link set eth0 up
        ip -n depot-b addr add 10.74.1.2/24 dev eth0; ip -n depot-b link set eth0 up
        ip netns exec depot-a ping -c1 -W2 10.74.1.2 >/dev/null
        systemctl stop tr-iperf.service 2>/dev/null || true; systemctl reset-failed tr-iperf.service 2>/dev/null || true
        rm -f /var/lib/cloudtrain/iperf-server.log
        systemd-run -q --unit=tr-iperf -p NetworkNamespacePath=/run/netns/depot-b "$(command -v iperf3)" -s -J --logfile /var/lib/cloudtrain/iperf-server.log
        sleep 1
        systemctl is-active tr-iperf.service >/dev/null
        rm -rf /home/learner/answers; install -d -o learner -g learner -m 0755 /home/learner/answers
  checks:
    - id: mtu-tuned
      description: Both ends of the depot link have MTU 9000
      type: shell
      on: tr-net-01
      skills: [linux.performance.network]
      weight: 1.5
      command: echo "$(ip -n depot-a -o link show eth0 | grep -o 'mtu [0-9]*') $(ip -n depot-b -o link show eth0 | grep -o 'mtu [0-9]*')"
      expect: {match: exact, value: "mtu 9000 mtu 9000"}
    - id: reports
      description: The four iperf3 JSON reports are genuine runs seen by the depot-b server and the after runs used larger segments
      type: shell
      on: tr-net-01
      skills: [linux.performance.network]
      weight: 2
      command: |
        python3 - <<'EOP'
        import json
        def server():
            out = {}
            txt = open("/var/lib/cloudtrain/iperf-server.log").read()
            dec = json.JSONDecoder(); i = 0
            while True:
                while i < len(txt) and txt[i].isspace(): i += 1
                if i >= len(txt): break
                try: o, i = dec.raw_decode(txt, i)
                except ValueError: break
                try: out[o["start"]["cookie"]] = o
                except (KeyError, TypeError): pass
            return out
        d = "/home/learner/answers/"
        try:
            r = {n: json.load(open(d + n + ".json")) for n in ("tcp-before", "tcp-after", "udp-before", "udp-after")}
            srv = server()
        except (OSError, ValueError):
            print("missing-or-invalid"); raise SystemExit
        try:
            if len({j["start"]["cookie"] for j in r.values()}) != 4:
                print("duplicate-runs"); raise SystemExit
            for n, j in r.items():
                s = srv.get(j["start"]["cookie"])
                if s is None or s["start"]["test_start"]["protocol"] != j["start"]["test_start"]["protocol"]:
                    print("not-seen-by-server:" + n); raise SystemExit
                if n.startswith("tcp"):
                    cb = j["end"]["sum_received"]["bytes"]; sb = s["end"]["sum_received"]["bytes"]
                    if sb <= 0 or abs(cb - sb) > 0.01 * sb:
                        print("bytes-differ:" + n); raise SystemExit
                ts = j["start"]["test_start"]
                if ts["protocol"] != ("TCP" if n.startswith("tcp") else "UDP") or int(ts["duration"]) != {{duration}}:
                    print("bad-test:" + n); raise SystemExit
                if j["start"]["connecting_to"]["host"] != "10.74.1.2":
                    print("bad-target:" + n); raise SystemExit
            if r["tcp-after"]["start"]["tcp_mss_default"] <= r["tcp-before"]["start"]["tcp_mss_default"]:
                print("mss-not-larger"); raise SystemExit
        except (KeyError, TypeError, ValueError):
            print("bad-json"); raise SystemExit
        print("ok")
        EOP
      expect: {match: exact, value: ok}
    - id: baseline-matches
      description: baseline.txt records the throughput iperf3 measured in the server-confirmed runs
      type: shell
      on: tr-net-01
      skills: [linux.performance.network]
      weight: 1.5
      command: |
        python3 - <<'EOP'
        import json
        def server():
            out = {}
            txt = open("/var/lib/cloudtrain/iperf-server.log").read()
            dec = json.JSONDecoder(); i = 0
            while True:
                while i < len(txt) and txt[i].isspace(): i += 1
                if i >= len(txt): break
                try: o, i = dec.raw_decode(txt, i)
                except ValueError: break
                try: out[o["start"]["cookie"]] = o
                except (KeyError, TypeError): pass
            return out
        d = "/home/learner/answers/"
        try:
            srv = server()
            vals = dict(l.strip().split("=", 1) for l in open(d + "baseline.txt") if "=" in l)
            for k, f, path in (("tcp_before", "tcp-before", ("end", "sum_received")), ("tcp_after", "tcp-after", ("end", "sum_received")),
                               ("udp_before", "udp-before", ("end", "sum")), ("udp_after", "udp-after", ("end", "sum"))):
                j = json.load(open(d + f + ".json"))
                if j["start"]["cookie"] not in srv:
                    print("not-seen-by-server:" + k); raise SystemExit
                m = j[path[0]][path[1]]["bits_per_second"] / 1e6
                v = float(vals[k])
                if m <= 0 or abs(v - m) > 0.05 * m:
                    print("mismatch:" + k); raise SystemExit
        except (OSError, ValueError, KeyError):
            print("unreadable"); raise SystemExit
        print("ok")
        EOP
      expect: {match: exact, value: ok}
  hints:
    - title: Run the client
      command: sudo ip netns exec depot-a iperf3 -c 10.74.1.2 -t {{duration}} -J
      body: "The server already listens in depot-b. Run the client in depot-a against 10.74.1.2 and redirect the JSON to the answer file."
      cost: 0
    - title: UDP and JSON
      body: "-u switches to UDP (set a target with -b 1G or the sender is limited to 1 Mbit/s). -J prints JSON; redirect it to the answer file. TCP reports use end.sum_received, UDP reports end.sum."
      cost: 1
    - title: Change the MTU on both ends
      command: sudo ip -n depot-a link set eth0 mtu 9000
      body: "A larger MTU on one end only gains nothing: set it on depot-a and on depot-b, then repeat the tests."
      cost: 1
  misconceptions:
    - id: mtu-one-side
      description: Raises the MTU on depot-a only.
      feedback: "The path MTU is limited by the smaller end. Set 9000 on both interfaces."
      expectFail: [mtu-tuned]
      mutation:
        on: tr-net-01
        as: learner
        timeoutSec: 150
        run: |
          set -e
          A=/home/learner/answers
          c() { sudo ip netns exec depot-a iperf3 -c 10.74.1.2 -t {{duration}} -J "$@"; }
          c > $A/tcp-before.json; c -u -b 1G > $A/udp-before.json
          sudo ip -n depot-a link set eth0 mtu 9000; sudo ip -n depot-b link set eth0 mtu 9000
          c > $A/tcp-after.json; c -u -b 1G > $A/udp-after.json
          sudo ip -n depot-b link set eth0 mtu 1500
          python3 - <<'EOP'
          import json
          A = "/home/learner/answers/"
          def mbit(f, k):
              return json.load(open(A + f))["end"][k]["bits_per_second"] / 1e6
          open(A + "baseline.txt", "w").write("tcp_before=%f\ntcp_after=%f\nudp_before=%f\nudp_after=%f\n" % (mbit("tcp-before.json", "sum_received"), mbit("tcp-after.json", "sum_received"), mbit("udp-before.json", "sum"), mbit("udp-after.json", "sum")))
          EOP
    - id: numbers-invented
      description: Writes round numbers into baseline.txt instead of the measured values.
      feedback: "baseline.txt must carry what iperf3 reported (end.sum_received for TCP, end.sum for UDP), in Mbit/s."
      expectFail: [baseline-matches]
      mutation:
        on: tr-net-01
        as: learner
        timeoutSec: 150
        run: |
          set -e
          A=/home/learner/answers
          c() { sudo ip netns exec depot-a iperf3 -c 10.74.1.2 -t {{duration}} -J "$@"; }
          c > $A/tcp-before.json; c -u -b 1G > $A/udp-before.json
          sudo ip -n depot-a link set eth0 mtu 9000; sudo ip -n depot-b link set eth0 mtu 9000
          c > $A/tcp-after.json; c -u -b 1G > $A/udp-after.json
          printf 'tcp_before=1000\ntcp_after=2000\nudp_before=1000\nudp_after=1000\n' > $A/baseline.txt
  solution:
    explanation: Run the client in depot-a against the server in depot-b for each protocol, keep the JSON, raise the MTU of both ends to 9000 and repeat. The values written to baseline.txt come straight from the JSON reports.
    steps:
      - on: tr-net-01
        as: learner
        timeoutSec: 180
        run: |
          set -e
          A=/home/learner/answers
          sudo ip netns exec depot-a iperf3 -c 10.74.1.2 -t {{duration}} -J > $A/tcp-before.json
          sudo ip netns exec depot-a iperf3 -c 10.74.1.2 -u -b 1G -t {{duration}} -J > $A/udp-before.json
          sudo ip -n depot-a link set eth0 mtu 9000
          sudo ip -n depot-b link set eth0 mtu 9000
          sudo ip netns exec depot-a iperf3 -c 10.74.1.2 -t {{duration}} -J > $A/tcp-after.json
          sudo ip netns exec depot-a iperf3 -c 10.74.1.2 -u -b 1G -t {{duration}} -J > $A/udp-after.json
          python3 - <<'EOP'
          import json
          A = "/home/learner/answers/"
          def mbit(f, k):
              return json.load(open(A + f))["end"][k]["bits_per_second"] / 1e6
          open(A + "baseline.txt", "w").write("tcp_before=%f\ntcp_after=%f\nudp_before=%f\nudp_after=%f\n" % (mbit("tcp-before.json", "sum_received"), mbit("tcp-after.json", "sum_received"), mbit("udp-before.json", "sum"), mbit("udp-after.json", "sum")))
          EOP
