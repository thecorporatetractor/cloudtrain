apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: mtu-mismatch-tunnel
  title: Fix large transfers that hang across the depot tunnel
  domain: linux
  frameworks: [linuxplus:troubleshooting]
  difficulty: hard
  estimatedMinutes: 20
  tags: [mtu, gre, tunnel, pmtud, troubleshooting]
  version: 1
spec:
  description: |
    Work on **`tr-net-01`** (`ssh tr-net-01`; you have `sudo`). The depot side of the tunnel is
    a network namespace (`sudo ip netns exec depot-b <command>`) that you do **not** own:
    only `tr-net-01` may be changed.

    `tr-net-01` talks to the depot timetable server **172.31.69.2** through a GRE tunnel
    `tun-dep` (172.31.69.1/30). The tunnel runs over an ISP link whose weakest segment has an
    **MTU of 1400**, and the ISP router silently drops oversize packets (it does not send
    ICMP "fragmentation needed" back). Small requests work, but the {{mib}} MiB timetable file
    stalls:

    ```
    curl -o /dev/null http://172.31.69.2:8000/timetable.bin
    ```

    The tunnel is created at boot by `tr-gre.service` from `/etc/default/tr-gre`. Find the
    mismatch with path MTU probes (for example `ping -M do -s <size> 172.31.69.2`), fix it on
    `tr-net-01` so the download completes, and make the fix **survive a restart** of the
    tunnel and the host. Keep the tunnel (same endpoints, same addresses) and do not touch
    `eth0` or its default route.
  objectives:
    - Probe the path MTU with do-not-fragment pings
    - Work out the usable tunnel MTU from the underlay MTU and the encapsulation overhead
    - Fix the MTU (or the TCP MSS) and make it persistent
  params:
    mib:
      type: choice
      values: ["50", "64"]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-net-01
        driver: vm
        image: ubuntu-vm:24.04
        resources: {cpu: 2, memoryMiB: 1536, disks: ["1Gi"]}
        access: [ssh, console]
  setup:
    - on: tr-net-01
      timeoutSec: 150
      run: |
        set -eu
        V=/var/lib/cloudtrain; install -d -m 0700 $V
        modprobe ip_gre 2>/dev/null || grep -q '/ip_gre.ko' /lib/modules/$(uname -r)/modules.builtin 2>/dev/null || { echo "kernel module 'ip_gre' is not available on this image: the GRE tunnel lab cannot run" >&2; exit 1; }
        systemctl stop tr-gre.service tr-timetable.service 2>/dev/null || true
        nft delete table inet trclamp 2>/dev/null || true
        for n in isp1 isp2 depot-b; do ip netns del $n 2>/dev/null || true; ip netns add $n; ip -n $n link set lo up; done
        ip netns del isp 2>/dev/null || true
        ip link del tun-dep 2>/dev/null || true
        ip link del tr-up 2>/dev/null || true
        # VM --(1500)-- isp1 --(1400)-- isp2 --(1500)-- depot-b ; the ISP drops oversize packets and swallows its own ICMP errors.
        # depot-b's own eth0 stays at 1500, so its stack cannot learn the narrow segment by itself.
        ip link add tr-up type veth peer name isp-a
        ip link set isp-a netns isp1
        ip addr add 10.69.1.1/24 dev tr-up; ip link set tr-up up
        ip -n isp1 addr add 10.69.1.2/24 dev isp-a; ip -n isp1 link set isp-a up
        ip -n isp1 link add isp-m1 type veth peer name isp-m2
        ip -n isp1 link set isp-m2 netns isp2
        ip -n isp1 addr add 10.69.3.1/24 dev isp-m1; ip -n isp1 link set isp-m1 mtu 1400 up
        ip -n isp2 addr add 10.69.3.2/24 dev isp-m2; ip -n isp2 link set isp-m2 mtu 1400 up
        ip link add isp-b type veth peer name eth0
        ip link set isp-b netns isp2; ip link set eth0 netns depot-b
        ip -n isp2 addr add 10.69.2.1/24 dev isp-b; ip -n isp2 link set isp-b mtu 1500 up
        ip -n depot-b addr add 10.69.2.2/24 dev eth0; ip -n depot-b link set eth0 mtu 1500 up
        ip -n depot-b route add default via 10.69.2.1
        ip -n isp1 route add 10.69.2.0/24 via 10.69.3.2
        ip -n isp2 route add 10.69.1.0/24 via 10.69.3.1
        for n in isp1 isp2; do
          ip netns exec $n sysctl -q -w net.ipv4.ip_forward=1
          ip netns exec $n nft -f - <<'EONFT'
        table inet isp {
          chain output {
            type filter hook output priority 0; policy accept;
            icmp type destination-unreachable drop
          }
          chain forward {
            type filter hook forward priority 0; policy accept;
            icmp type destination-unreachable drop
          }
        }
        EONFT
        done
        ip route replace 10.69.2.0/24 via 10.69.1.2 dev tr-up
        # depot side of the tunnel (not ours): MTU 1500
        ip -n depot-b link add tun-dep type gre local 10.69.2.2 remote 10.69.1.1
        ip -n depot-b addr add 172.31.69.2/30 dev tun-dep
        ip -n depot-b link set tun-dep mtu 1500 up
        mkdir -p /srv/tt-timetable /var/lib/tt-depot-b
        truncate -s {{mib}}M /var/lib/tt-depot-b/timetable.bin
        systemd-run -q --unit=tr-depot-b-http --collect -p NetworkNamespacePath=/run/netns/depot-b /usr/bin/python3 -m http.server 8000 --directory /var/lib/tt-depot-b
        # our side: the tunnel is created by a unit from /etc/default/tr-gre
        printf '# MTU of the depot tunnel\nTUNNEL_MTU=1476\n' > /etc/default/tr-gre
        cat > /usr/local/sbin/tr-gre-tunnel <<'EOS'
        #!/bin/sh
        # creates the depot GRE tunnel; the MTU comes from /etc/default/tr-gre
        . /etc/default/tr-gre
        ip link del tun-dep 2>/dev/null || true
        ip tunnel add tun-dep mode gre local 10.69.1.1 remote 10.69.2.2
        ip addr add 172.31.69.1/30 dev tun-dep
        ip link set tun-dep mtu "${TUNNEL_MTU:-1476}" up
        EOS
        chmod 0755 /usr/local/sbin/tr-gre-tunnel
        printf '[Unit]\nDescription=Tallowmere depot GRE tunnel\n[Service]\nType=oneshot\nRemainAfterExit=yes\nExecStart=/usr/local/sbin/tr-gre-tunnel\nExecStop=-/usr/bin/env ip link del tun-dep\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/tr-gre.service
        systemctl daemon-reload; systemctl enable --now tr-gre.service >/dev/null 2>&1
        for i in $(seq 10); do curl -s -m 2 http://172.31.69.2:8000/ >/dev/null && break; sleep 1; done
        curl -s -m 5 http://172.31.69.2:8000/ >/dev/null
        # the black hole must be real: the small request works, the big download stalls
        if curl -s -m 15 -o /dev/null http://172.31.69.2:8000/timetable.bin; then echo "setup error: the download completes on the start state" >&2; exit 1; fi
        echo $(( {{mib}} * 1048576 )) > $V/mtu.bytes
  checks:
    - id: download
      description: The whole timetable file downloads through the tunnel
      type: shell
      on: tr-net-01
      skills: [linux.performance.network, linux.net.troubleshooting]
      weight: 3
      timeoutSec: 90
      command: |
        n=$(curl -s -m 60 -o /dev/null -w '%{size_download}' http://172.31.69.2:8000/timetable.bin 2>/dev/null)
        [ "${n:-0}" = "$(cat /var/lib/cloudtrain/mtu.bytes)" ] && echo complete || echo "got=${n:-0}"
      expect: {match: exact, value: complete}
    - id: small-requests
      description: Small requests still work through the tunnel
      type: shell
      on: tr-net-01
      skills: [linux.net.troubleshooting]
      weight: 0.5
      command: curl -s -m 5 -o /dev/null -w '%{http_code}' http://172.31.69.2:8000/ 2>/dev/null || true
      expect: {match: exact, value: "200"}
    - id: tunnel-kept
      description: The tunnel keeps its endpoints and addresses
      type: shell
      on: tr-net-01
      skills: [linux.net.troubleshooting]
      weight: 1
      command: |
        d=$(ip -d link show tun-dep 2>/dev/null | grep -o 'gre remote [0-9.]* local [0-9.]*')
        a=$(ip -o -4 addr show dev tun-dep 2>/dev/null | awk '{print $4}')
        echo "$d $a"
      expect: {match: exact, value: "gre remote 10.69.2.2 local 10.69.1.1 172.31.69.1/30"}
    - id: persistent
      description: The fix is in the boot configuration of the tunnel (or an enabled nftables ruleset)
      type: shell
      on: tr-net-01
      skills: [linux.performance.network, linux.net.troubleshooting]
      weight: 2
      command: |
        . /etc/default/tr-gre 2>/dev/null
        m=${TUNNEL_MTU:-1476}
        if [ "$m" -le 1376 ] 2>/dev/null && [ "$(systemctl is-enabled tr-gre.service 2>/dev/null)" = enabled ]; then echo persistent
        elif [ "$(systemctl is-enabled nftables 2>/dev/null)" = enabled ] && nft -c -f /etc/nftables.conf >/dev/null 2>&1 \
             && grep -Eq 'maxseg size set ([0-9]{1,3}|1[0-2][0-9]{2}|13[0-2][0-9]|133[0-6])([^0-9]|$)' /etc/nftables.conf; then echo persistent
        else echo runtime-only; fi
      expect: {match: exact, value: persistent}
  hints:
    - title: Probe the path
      command: ping -c2 -M do -s 1400 172.31.69.2
      body: "-M do forbids fragmentation, so an oversize probe is lost instead of being split. Lower the -s size until replies come back: payload + 28 bytes is the biggest IP packet that crosses the tunnel."
      cost: 0
    - title: Do the arithmetic
      body: "The weakest segment carries 1400-byte packets. A GRE tunnel adds a 24-byte header (20 outer IP + 4 GRE), so the tunnel interface may carry at most 1400 - 24 = 1376 bytes."
      cost: 1
    - title: Make it stick
      body: "The tunnel MTU is set from TUNNEL_MTU in /etc/default/tr-gre when tr-gre.service runs. Change it there and restart the unit. Alternatively clamp the TCP MSS in nftables, but then the ruleset must be saved and loaded at boot."
      cost: 1
  misconceptions:
    - id: runtime-only
      description: Lowers the MTU with ip link set and moves on.
      feedback: "ip link set mtu is lost when tr-gre.service recreates the tunnel; change TUNNEL_MTU in /etc/default/tr-gre as well."
      expectFail: [persistent]
      mutation:
        on: tr-net-01
        as: learner
        run: sudo ip link set tun-dep mtu 1376
    - id: guessed-mtu
      description: Picks 1450 in the configuration without probing the path.
      feedback: "1450 plus the 24-byte GRE overhead is 1474 bytes on the ISP segment, which only carries 1400. Probe with ping -M do and subtract the overhead."
      expectFail: [download, persistent]
      mutation:
        on: tr-net-01
        as: learner
        run: |
          sudo sed -i 's/^TUNNEL_MTU=.*/TUNNEL_MTU=1450/' /etc/default/tr-gre
          sudo systemctl restart tr-gre.service
  solution:
    explanation: The ISP segment carries 1400 bytes and GRE adds 24, so the tunnel MTU must be at most 1376. Setting TUNNEL_MTU=1376 and restarting the unit recreates the tunnel with that MTU, so TCP announces a smaller MSS and full-size segments fit.
    steps:
      - on: tr-net-01
        as: learner
        run: |
          set -e
          ping -c2 -W2 -M do -s 1348 172.31.69.2
          sudo sed -i 's/^TUNNEL_MTU=.*/TUNNEL_MTU=1376/' /etc/default/tr-gre
          sudo systemctl restart tr-gre.service
          curl -s -m 60 -o /dev/null -w '%{size_download}\n' http://172.31.69.2:8000/timetable.bin
    alternatives:
      - id: mss-clamp
        description: Keep the tunnel MTU and clamp the TCP MSS announced on the tunnel in a saved nftables ruleset.
        steps:
          - on: tr-net-01
            as: learner
            run: |
              set -e
              printf '%s\n' '' 'table inet trclamp {' '  chain post {' '    type filter hook postrouting priority mangle; policy accept;' '    oifname "tun-dep" tcp flags syn tcp option maxseg size set 1336' '  }' '}' | sudo tee -a /etc/nftables.conf >/dev/null
              sudo nft -c -f /etc/nftables.conf
              sudo systemctl enable nftables
              sudo nft -f /etc/nftables.conf
