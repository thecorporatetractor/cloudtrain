apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: script-loops-depot-checks
  title: Loop over depot hosts and report the unreachable ones
  domain: linux
  frameworks: [rhcsa-aligned:scripts, lpic1:shells-scripting, linuxplus:automation-scripting]
  difficulty: medium
  estimatedMinutes: 20
  tags: [bash, loops, exit-codes, networking, timeout]
  version: 1
spec:
  description: |
    Before each night shift, Tallowmere Rail's depot team wants to know which depot
    hosts cannot be reached over SSH. Write the script `~/bin/check-depots`:

    - `check-depots FILE` reads host names from FILE, one per line. Blank lines and
      lines starting with `#` are ignored.
    - For each host, test whether **TCP port 22** accepts a connection, giving up
      after **at most 3 seconds** per host (some hosts drop packets and never
      answer).
    - Write the hosts that failed to `/var/tmp/unreachable.txt`, one per line, in
      the order of the input file. The file must contain only this run's results
      (empty when everything is reachable).
    - Exit **0** when every host is reachable and **1** when at least one is not.

    Try it on `~/depots.txt`. The grader runs your script as you on other host
    lists, including a host that never answers, an unknown host name, comments and
    a leftover result file from an earlier run.
  objectives:
    - Read a file line by line in a loop and skip comments
    - Probe a TCP port with a timeout
    - Collect results in a file and signal failure with the exit status
  params:
    downHost:
      type: choice
      values: [depot-c, depot-e]
  topology:
    entry: tr-depot-ops-01
    nodes:
      - name: tr-depot-ops-01
        driver: container
        image: linux-pod-deb:24.04
        access: [shell]
  setup:
    - on: tr-depot-ops-01
      file: {path: /usr/local/lib/tr/port22, source: assets/port22, mode: "0755"}
    - on: tr-depot-ops-01
      file: {path: /var/lib/cloudtrain/case.sh, source: assets/case.sh, mode: "0700"}
    - on: tr-depot-ops-01
      run: |
        set -eu
        chmod 0755 /usr/local/lib/tr/port22; chmod 0700 /var/lib/cloudtrain /var/lib/cloudtrain/case.sh
        # Depot hosts: loopback addresses; a-f live, but the down host has no listener
        # (refused); depot-x never answers (its listen queue is kept full).
        # /etc/hosts is a bind mount: rewrite it in place, never rename over it.
        h=$(sed '/ depot-[a-x]$/d' /etc/hosts); printf '%s\n' "$h" > /etc/hosts
        for h in a:1 b:2 c:3 d:4 e:5 f:6; do echo "127.0.2.${h#*:} depot-${h%%:*}" >> /etc/hosts; done
        echo "127.0.2.9 depot-x" >> /etc/hosts
        pkill -f '^/usr/bin/python3 /usr/local/lib/tr/port22' || true
        sleep 1
        for h in a:1 b:2 c:3 d:4 e:5 f:6; do
          [ "depot-${h%%:*}" = "{{downHost}}" ] && continue
          setsid -f /usr/local/lib/tr/port22 127.0.2.${h#*:} </dev/null >/dev/null 2>&1
        done
        setsid -f /usr/local/lib/tr/port22 127.0.2.9 silent </dev/null >/dev/null 2>&1
        printf '# Depot hosts for the night shift\ndepot-a\ndepot-b\ndepot-c\n\ndepot-d\ndepot-e\ndepot-f\n' > /home/learner/depots.txt
        chown learner:learner /home/learner/depots.txt
        install -d -o learner -g learner /home/learner/bin
        rm -f /var/tmp/unreachable.txt
        c=/var/lib/cloudtrain/cases; rm -rf $c; mkdir -p $c
        printf 'depot-a\ndepot-b\n' > $c/1.list; printf 'rc=0\n' > $c/1.expect
        printf 'depot-f\n{{downHost}}\ndepot-a\ndepot-zz\n' > $c/2.list; printf '{{downHost}}\ndepot-zz\nrc=1\n' > $c/2.expect
        printf 'depot-b\ndepot-x\ndepot-d\n' > $c/3.list; printf 'depot-x\nrc=1\n' > $c/3.expect
        printf '# retired: depot-q\n\ndepot-a\n#depot-zz\n\ndepot-f\n' > $c/4.list; printf 'rc=0\n' > $c/4.expect
        printf 'depot-d\n' > $c/5.list; printf 'depot-old1\ndepot-old2\n' > $c/5.stale; printf 'rc=0\n' > $c/5.expect
        printf 'depot-b\n{{downHost}}\n' > $c/6.list; printf 'depot-b\n' > $c/6.stale; printf '{{downHost}}\nrc=1\n' > $c/6.expect
        for i in $(seq 1 30); do [ "$(ss -Htln | grep -c ':22 ')" -ge 5 ] && break; sleep 0.5; done
  checks:
    - id: executable
      description: ~/bin/check-depots is an executable script
      type: shell
      on: tr-depot-ops-01
      skills: [linux.shell.scripting]
      weight: 0.5
      command: f=/home/learner/bin/check-depots; [ -x $f ] && head -c2 $f | grep -q '#!' && echo ok || echo no
      expect: {match: exact, value: ok}
    - id: all-reachable
      description: All hosts up -> empty result file, exit 0
      type: shell
      on: tr-depot-ops-01
      skills: [linux.shell.scripting]
      timeoutSec: 60
      command: /var/lib/cloudtrain/case.sh 1
      expect: {match: exact, value: pass}
    - id: refused-and-unknown
      description: A host with port 22 closed and an unknown host name are listed in input order, exit 1
      type: shell
      on: tr-depot-ops-01
      skills: [linux.shell.scripting]
      weight: 1.5
      timeoutSec: 60
      command: /var/lib/cloudtrain/case.sh 2
      expect: {match: exact, value: pass}
    - id: silent-host-timeout
      description: A host that never answers is listed, and the run does not hang
      type: shell
      on: tr-depot-ops-01
      skills: [linux.shell.scripting, linux.net.troubleshooting]
      weight: 1.5
      timeoutSec: 60
      command: /var/lib/cloudtrain/case.sh 3
      expect: {match: exact, value: pass}
    - id: comments-blank-lines
      description: Comments and blank lines are skipped
      type: shell
      on: tr-depot-ops-01
      skills: [linux.shell.scripting]
      timeoutSec: 60
      command: /var/lib/cloudtrain/case.sh 4
      expect: {match: exact, value: pass}
    - id: stale-results-replaced
      description: A result file from an earlier run is replaced, not appended to
      type: shell
      on: tr-depot-ops-01
      skills: [linux.shell.scripting]
      timeoutSec: 60
      command: /var/lib/cloudtrain/case.sh 5 && /var/lib/cloudtrain/case.sh 6
      expect: {match: exact, value: "pass\npass"}
  hints:
    - title: Loop skeleton
      body: "`while read -r host; do ...; done < \"$1\"` reads one line per iteration. `case $host in ''|'#'*) continue ;; esac` skips blanks and comments."
      cost: 1
    - title: Probing a port
      body: "`nc -z -w 3 HOST 22` exits 0 when the port accepts a connection. Without nc, bash can open `/dev/tcp/HOST/22`; wrap it in `timeout 3 bash -c '...'` so a silent host cannot hang the loop."
      cost: 1
    - title: Start clean, remember failure
      body: "Truncate the result file once before the loop (`: > /var/tmp/unreachable.txt`), append inside it, and set a variable like `rc=1` on any failure; `exit $rc` at the end."
      cost: 2
  misconceptions:
    - id: no-timeout
      description: Opens the connection without a time limit.
      feedback: "A host that drops packets makes connect() wait for minutes. Limit every probe (nc -w 3, or timeout 3)."
      expectFail: [silent-host-timeout]
      mutation:
        on: tr-depot-ops-01
        as: learner
        run: |
          cat > ~/bin/check-depots <<'S'
          #!/bin/bash
          out=/var/tmp/unreachable.txt; : > "$out"; rc=0
          while read -r h; do
            case $h in ''|'#'*) continue ;; esac
            if ! (exec 3<>"/dev/tcp/$h/22") 2>/dev/null; then echo "$h" >> "$out"; rc=1; fi
          done < "$1"
          exit $rc
          S
          chmod +x ~/bin/check-depots
    - id: appends-results
      description: Appends to the result file without clearing it first.
      feedback: ">> keeps lines from earlier runs. Truncate the file once at the start of each run."
      expectFail: [stale-results-replaced]
      mutation:
        on: tr-depot-ops-01
        as: learner
        run: |
          cat > ~/bin/check-depots <<'S'
          #!/bin/bash
          rc=0
          while read -r h; do
            case $h in ''|'#'*) continue ;; esac
            nc -z -w 3 "$h" 22 </dev/null 2>/dev/null || { echo "$h" >> /var/tmp/unreachable.txt; rc=1; }
          done < "$1"
          exit $rc
          S
          chmod +x ~/bin/check-depots
    - id: always-zero
      description: Lists the failures but always exits 0.
      feedback: "The night-shift tooling only looks at the exit status. Exit 1 when anything failed."
      expectFail: [refused-and-unknown, silent-host-timeout]
      mutation:
        on: tr-depot-ops-01
        as: learner
        run: |
          cat > ~/bin/check-depots <<'S'
          #!/bin/bash
          : > /var/tmp/unreachable.txt
          while read -r h; do
            case $h in ''|'#'*) continue ;; esac
            nc -z -w 3 "$h" 22 </dev/null 2>/dev/null || echo "$h" >> /var/tmp/unreachable.txt
          done < "$1"
          S
          chmod +x ~/bin/check-depots
    - id: comments-as-hosts
      description: Treats every line as a host, including comments and blank lines.
      feedback: "Comment and blank lines end up as failed 'hosts'. Skip them before probing."
      expectFail: [comments-blank-lines]
      mutation:
        on: tr-depot-ops-01
        as: learner
        run: |
          cat > ~/bin/check-depots <<'S'
          #!/bin/bash
          : > /var/tmp/unreachable.txt; rc=0
          while read -r h; do
            nc -z -w 3 "$h" 22 </dev/null 2>/dev/null || { echo "${h:-<blank>}" >> /var/tmp/unreachable.txt; rc=1; }
          done < "$1"
          exit $rc
          S
          chmod +x ~/bin/check-depots
  solution:
    explanation: |
      The loop reads one host per line, skips blanks and comments, probes port 22
      through bash's /dev/tcp under `timeout 3`, appends failures to a result file
      that was truncated once at the start, and remembers any failure for the exit
      status.
    steps:
      - on: tr-depot-ops-01
        as: learner
        run: |
          mkdir -p ~/bin
          cat > ~/bin/check-depots <<'S'
          #!/bin/bash
          # check-depots FILE: list depot hosts whose port 22 does not answer.
          list=${1:?usage: check-depots FILE}
          out=/var/tmp/unreachable.txt
          : > "$out"
          rc=0
          while read -r host; do
            case $host in ''|'#'*) continue ;; esac
            if ! timeout 3 bash -c 'exec 3<>"/dev/tcp/$1/22"' _ "$host" 2>/dev/null; then
              echo "$host" >> "$out"
              rc=1
            fi
          done < "$list"
          exit $rc
          S
          chmod +x ~/bin/check-depots
          ~/bin/check-depots ~/depots.txt; echo "exit $?"; cat /var/tmp/unreachable.txt
    alternatives:
      - id: nc-and-grep
        description: Filter the list with grep first, probe with nc -z -w, and build the file in one redirection.
        steps:
          - on: tr-depot-ops-01
            as: learner
            run: |
              cat > ~/bin/check-depots <<'S'
              #!/bin/sh
              failed=0
              for h in $(grep -v -e '^#' -e '^[[:space:]]*$' "$1"); do
                if ! nc -z -w 3 "$h" 22 </dev/null 2>/dev/null; then echo "$h"; failed=1; fi
              done > /var/tmp/unreachable.txt
              exit $failed
              S
              chmod 755 ~/bin/check-depots
