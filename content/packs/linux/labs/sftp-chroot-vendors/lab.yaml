apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: sftp-chroot-vendors
  title: Give a vendor SFTP-only access in a chroot
  domain: linux
  frameworks: [lpic2:system-security, lfcs:networking]
  difficulty: medium
  estimatedMinutes: 20
  tags: [sftp, sshd, chroot, internal-sftp, sudo]
  version: 1
spec:
  description: |
    Tallowmere Rail's seat-reservation vendor delivers nightly manifest files to the
    ticketing file host `tkt-files-01`. They log in as **`vendor-upload`** with an SSH
    key that is already installed. Today that account gets a full shell and can read
    the whole host. You have full sudo rights here; sshd listens on `localhost`
    port 22 (no systemd: `sudo service ssh reload|restart`).

    Change it so that `vendor-upload`:

    1. can **only use SFTP**: no shell, no remote commands;
    2. is **jailed in `/srv/vendor`**: after logging in, `/` is `/srv/vendor` and
       nothing else of the host is visible;
    3. uploads into **`/srv/vendor/inbox`** (`/inbox` as the vendor sees it), which
       the vendor can write to.

    Every other account (including yours: `ssh localhost` must keep working) keeps
    normal SSH access.
  objectives:
    - Confine one account to SFTP with ForceCommand internal-sftp in a Match block
    - Prepare a chroot directory that sshd accepts (root-owned, not writable by others)
    - Give the jailed account a writable directory inside the chroot
  params:
    manifest:
      type: choice
      values: [seats-north, seats-coast, seats-valley]
    batch:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: tkt-files-01
    nodes:
      - name: tkt-files-01
        driver: container
        image: deb-lab:24.04
        access: [shell]
        learnerSudo: true
  setup:
    - on: tkt-files-01
      run: |
        set -eu
        echo 'learner ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/learner && chmod 0440 /etc/sudoers.d/learner
        id vendor-upload >/dev/null 2>&1 || useradd -m -s /bin/bash -c 'Seat reservation vendor' vendor-upload
        mkdir -p /var/lib/cloudtrain && chmod 0700 /var/lib/cloudtrain
        k=/var/lib/cloudtrain/vendor_key; [ -f $k ] || ssh-keygen -q -t ed25519 -N '' -C vendor@seatco -f $k
        install -d -m 0700 -o vendor-upload -g vendor-upload /home/vendor-upload/.ssh
        install -m 0600 -o vendor-upload -g vendor-upload $k.pub /home/vendor-upload/.ssh/authorized_keys
        cat /home/learner/.ssh/id_ed25519.pub >> /home/learner/.ssh/authorized_keys
        chown learner:learner /home/learner/.ssh/authorized_keys; chmod 0600 /home/learner/.ssh/authorized_keys
        printf 'manifest,{{manifest}},batch,{{batch}}\n' > /var/lib/cloudtrain/{{manifest}}-{{batch}}.csv
        rm -rf /srv/vendor
        ssh-keygen -A >/dev/null
        mkdir -p /run/sshd /etc/ssh/sshd_config.d
        printf '# Tallowmere Rail: listen on the loopback only on lab hosts\nListenAddress 127.0.0.1\n' > /etc/ssh/sshd_config.d/10-listen.conf
        service ssh stop >/dev/null 2>&1 || true
        service ssh start >/dev/null
        touch /home/learner/.ssh/known_hosts
        echo "localhost,127.0.0.1,tkt-files-01 $(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" >> /home/learner/.ssh/known_hosts
        chown learner:learner /home/learner/.ssh/known_hosts
  checks:
    - id: upload
      description: vendor-upload can upload a manifest by SFTP into /inbox, and it lands in /srv/vendor/inbox
      type: shell
      on: tkt-files-01
      skills: [linux.services.sshd]
      weight: 2
      timeoutSec: 30
      command: |
        cd /tmp; f={{manifest}}-{{batch}}.csv; rm -f /srv/vendor/inbox/$f
        printf 'put /var/lib/cloudtrain/%s /inbox/%s\n' $f $f | sftp -i /var/lib/cloudtrain/vendor_key -o BatchMode=yes -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null -b - vendor-upload@127.0.0.1 >/dev/null 2>&1
        [ "$(stat -c %U /srv/vendor/inbox/$f 2>/dev/null)" = vendor-upload ] && cmp -s /srv/vendor/inbox/$f /var/lib/cloudtrain/$f && echo delivered || echo missing
      expect: {match: exact, value: delivered}
    - id: jailed
      description: Over SFTP the vendor sees /srv/vendor as / and nothing else of the host
      type: shell
      on: tkt-files-01
      skills: [linux.services.sshd]
      weight: 2
      timeoutSec: 30
      command: |
        cd /tmp
        out=$(printf 'ls -1 /\n' | sftp -i /var/lib/cloudtrain/vendor_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -b - vendor-upload@127.0.0.1 2>/dev/null) || { echo "no sftp"; exit 0; }
        printf '%s\n' "$out" | grep -Eq '^/?(etc|home|usr)$' && echo "host visible" || { printf '%s\n' "$out" | grep -Eq '^/?inbox$' && echo jailed || echo "no inbox"; }
      expect: {match: exact, value: jailed}
    - id: no-shell
      description: vendor-upload cannot run a shell or remote commands
      type: shell
      on: tkt-files-01
      skills: [linux.services.sshd]
      weight: 2
      timeoutSec: 30
      command: |
        cd /tmp
        ssh -i /var/lib/cloudtrain/vendor_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
          vendor-upload@127.0.0.1 'echo SHELL-$((6*7))' </dev/null 2>/dev/null | grep -q SHELL-42 && echo shell || echo none
      expect: {match: exact, value: none}
    - id: config-scoped
      description: sshd applies ChrootDirectory /srv/vendor and ForceCommand internal-sftp to vendor-upload only
      type: shell
      on: tkt-files-01
      skills: [linux.services.sshd]
      command: |
        v=$(sshd -T -C user=vendor-upload,host=localhost,addr=127.0.0.1 2>/dev/null | awk '$1 == "chrootdirectory" || $1 == "forcecommand" {print $1 "=" $2}' | sort | tr '\n' ' ')
        l=$(sshd -T -C user=learner,host=localhost,addr=127.0.0.1 2>/dev/null | awk '$1 == "chrootdirectory" || $1 == "forcecommand" {print $1 "=" $2}' | sort | tr '\n' ' ')
        echo "vendor: $v| learner: $l"
      expect: {match: regex, value: "^vendor: chrootdirectory=/srv/vendor/? forcecommand=internal-sftp \\| learner: chrootdirectory=none (forcecommand=none )?$"}
    - id: others-normal
      description: Other accounts still get a normal shell over SSH
      type: shell
      on: tkt-files-01
      skills: [linux.services.sshd]
      timeoutSec: 30
      command: runuser -u learner -- sh -c 'cd && ssh -o BatchMode=yes -o ConnectTimeout=5 localhost "echo ok-\$(id -un)"' </dev/null 2>/dev/null
      expect: {match: exact, value: ok-learner}
  hints:
    - title: One account, its own rules
      body: "A `Match User vendor-upload` block at the END of /etc/ssh/sshd_config applies the lines below it to that account only. Inside it: `ChrootDirectory /srv/vendor`, `ForceCommand internal-sftp`, and switch off forwarding."
      cost: 1
    - title: Why internal-sftp
      body: "Inside the chroot there is no /usr/lib/openssh/sftp-server and no shell. internal-sftp is built into sshd, so it works in an empty jail."
      cost: 1
    - title: sshd is picky about the jail
      body: "The chroot directory and every directory above it must be owned by root and not writable by group or others, or sshd drops the login (`bad ownership or modes for chroot directory` in the log). So /srv/vendor is root:root 755 and the vendor writes into a subdirectory it owns."
      cost: 2
    - title: Test it
      body: "`sudo sshd -t`, `sudo service ssh reload`, then log in as the vendor with its key: `sudo sftp -i /var/lib/cloudtrain/vendor_key vendor-upload@localhost`. `sudo sshd -T -C user=vendor-upload,host=localhost,addr=127.0.0.1 | grep -E 'chroot|forcecommand'` shows what sshd applies to that account."
      cost: 2
  misconceptions:
    - id: vendor-owns-jail
      description: Makes the vendor the owner of the chroot directory itself.
      feedback: "sshd refuses a chroot directory that is not owned by root. Keep /srv/vendor root:root 755 and give the vendor a subdirectory (inbox)."
      expectFail: [upload, jailed]
      mutation:
        on: tkt-files-01
        as: learner
        run: |
          sudo install -d -o vendor-upload -g vendor-upload -m 0755 /srv/vendor /srv/vendor/inbox
          printf '\nMatch User vendor-upload\n    ChrootDirectory /srv/vendor\n    ForceCommand internal-sftp\n    AllowTcpForwarding no\n    X11Forwarding no\n' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo sshd -t && sudo service ssh reload
    - id: chroot-without-internal-sftp
      description: Sets the chroot but leaves the external sftp-server, which does not exist inside the jail.
      feedback: "The external sftp-server binary is not in the chroot. Use ForceCommand internal-sftp (or Subsystem sftp internal-sftp)."
      expectFail: [upload, jailed, config-scoped]
      mutation:
        on: tkt-files-01
        as: learner
        run: |
          sudo install -d -o root -g root -m 0755 /srv/vendor
          sudo install -d -o vendor-upload -g vendor-upload -m 0755 /srv/vendor/inbox
          printf '\nMatch User vendor-upload\n    ChrootDirectory /srv/vendor\n' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo sshd -t && sudo service ssh reload
    - id: no-chroot
      description: Forces SFTP but forgets the chroot, so the vendor can browse the whole host.
      feedback: "ForceCommand internal-sftp alone still shows the vendor every readable file. Add ChrootDirectory."
      expectFail: [jailed, config-scoped]
      mutation:
        on: tkt-files-01
        as: learner
        run: |
          sudo install -d -o root -g root -m 0755 /srv/vendor
          sudo install -d -o vendor-upload -g vendor-upload -m 0755 /srv/vendor/inbox
          printf '\nMatch User vendor-upload\n    ForceCommand internal-sftp\n' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo sshd -t && sudo service ssh reload
    - id: global-jail
      description: Puts the jail settings outside a Match block, so they apply to every account.
      feedback: "Without Match User the settings apply to everyone, including you. Scope them to vendor-upload."
      expectFail: [config-scoped, others-normal]
      mutation:
        on: tkt-files-01
        as: learner
        run: |
          sudo install -d -o root -g root -m 0755 /srv/vendor
          sudo install -d -o vendor-upload -g vendor-upload -m 0755 /srv/vendor/inbox
          printf 'ChrootDirectory /srv/vendor\nForceCommand internal-sftp\n' | sudo tee /etc/ssh/sshd_config.d/20-vendor.conf >/dev/null
          sudo sshd -t && sudo service ssh reload
  solution:
    explanation: |
      A root-owned jail with a vendor-owned inbox, and a Match block that chroots the
      account and forces the built-in SFTP server. Everything else keeps the global
      settings because the Match block is last.
    steps:
      - on: tkt-files-01
        as: learner
        run: |
          sudo install -d -o root -g root -m 0755 /srv/vendor
          sudo install -d -o vendor-upload -g vendor-upload -m 0750 /srv/vendor/inbox
          printf '\nMatch User vendor-upload\n    ChrootDirectory /srv/vendor\n    ForceCommand internal-sftp\n    AllowTcpForwarding no\n    X11Forwarding no\n    PermitTTY no\n' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo sshd -t
          sudo service ssh reload
          sleep 1
    alternatives:
      - id: group-match-dropin
        description: A drop-in with a Match Group for a new sftp-vendors group, start directory set with -d.
        steps:
          - on: tkt-files-01
            as: learner
            run: |
              sudo groupadd -f sftp-vendors && sudo usermod -aG sftp-vendors vendor-upload
              sudo mkdir -p /srv/vendor/inbox && sudo chown root:root /srv/vendor && sudo chmod 755 /srv/vendor
              sudo chown vendor-upload:sftp-vendors /srv/vendor/inbox && sudo chmod 770 /srv/vendor/inbox
              printf 'Match Group sftp-vendors\n    ChrootDirectory /srv/vendor\n    ForceCommand internal-sftp -d /inbox\n    DisableForwarding yes\n' | sudo tee /etc/ssh/sshd_config.d/60-vendor-sftp.conf >/dev/null
              sudo sshd -t && sudo service ssh restart
              sleep 1
