# /etc/tr-signal/interlock.conf
# Tallowmere Rail signalling centre - interlocking controller settings.
# Owner: signalling engineering. Changes need a ticket number in the change log.
#
# Format: key = value, one per line. Lines starting with # are comments.
# Sections in [brackets] apply to one route only.
#
# Example (do not uncomment):
#   approach_lock_timeout = 30
#   max_route_locks = 6

[global]
controller_id = TR-IXL-04
# Number of routes that may be locked at the same time.
max_route_locks = 6
# Seconds an approach lock is held after a signal is replaced to danger.
approach_lock_timeout = 30
log_level = info
heartbeat_interval = 5

[route-A]
# Up main, platform 1 to Ashby junction.
entry_signal = AS101
exit_signal = AS117
overlap_ms = 150
flank_protection = yes

[route-B]
# Down main, platform 2 to Bramwell loop.
entry_signal = BR204
exit_signal = BR230
overlap_ms = 150
flank_protection = yes

[route-C]
# Siding access, shunting moves only.
entry_signal = SH301
exit_signal = SH305
overlap_ms = 90
flank_protection = no

# End of file. Keep a newline after this line.
