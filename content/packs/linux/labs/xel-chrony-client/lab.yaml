apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xel-chrony-client
  title: Synchronise time with the classroom server
  domain: linux
  frameworks: [rhcsa-aligned:deploy-maintain]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, chrony, ntp]
  version: 1
spec:
  description: |
    **Hosts:** node 1 `tr-el-01` (configure here), node 2 `tr-el-02` (time server)

    Node 2 serves the depot's reference time over NTP. Configure node 1 as an NTP
    client of **`tr-el-02` only**: no other time source may remain configured. Time
    synchronisation must be **active now and at boot**.
  objectives:
    - Configure chrony as a client of one server
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-el-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
      - name: tr-el-02
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536}
        access: [ssh, console]
  setup:
    - on: tr-el-02
      timeoutSec: 120
      run: |
        set -eu
        printf '%s\n' '# Tallowmere depot reference clock' 'allow all' 'local stratum 8' > /etc/chrony.d/tr-server.conf 2>/dev/null || {
          mkdir -p /etc/chrony.d; printf '%s\n' 'allow all' 'local stratum 8' > /etc/chrony.d/tr-server.conf; }
        grep -q '^confdir /etc/chrony.d\|^sourcedir /etc/chrony.d\|^include /etc/chrony.d' /etc/chrony.conf || echo 'include /etc/chrony.d/*.conf' >> /etc/chrony.conf
        systemctl enable chronyd; systemctl restart chronyd
        firewall-cmd -q --permanent --add-service=ntp; firewall-cmd -q --reload
    - on: tr-el-01
      run: |
        set -eu
        grep -qE '^(pool|server)' /etc/chrony.conf || echo 'pool 2.almalinux.pool.ntp.org iburst' >> /etc/chrony.conf
        systemctl enable chronyd; systemctl restart chronyd
  checks:
    - id: only-source
      description: The only configured time source is tr-el-02
      type: shell
      on: tr-el-01
      skills: [linux.systemd.time-locale]
      weight: 2
      command: |
        cat /etc/chrony.conf /etc/chrony.d/*.conf /etc/chrony.d/*.sources 2>/dev/null | awk '$1 == "server" || $1 == "pool" || $1 == "peer" {print $2}' | sort -u | paste -sd,
      expect: {match: exact, value: tr-el-02}
    - id: live-source
      description: The running chronyd uses tr-el-02
      type: shell
      on: tr-el-01
      skills: [linux.systemd.time-locale]
      weight: 1
      timeoutSec: 90
      command: |
        ip=$(getent ahostsv4 tr-el-02 | awk '{print $1; exit}')
        for i in $(seq 30); do
          s=$(chronyc -n sources 2>/dev/null | awk 'NR > 2 && /^\^/ {print $2}' | paste -sd,)
          [ "$s" = "$ip" ] && { echo using-server; exit 0; }
          sleep 2
        done; echo "sources=$s"
      expect: {match: exact, value: using-server}
    - id: enabled
      description: chronyd is enabled and running
      type: shell
      on: tr-el-01
      skills: [linux.systemd.time-locale]
      weight: 0.5
      command: echo "$(systemctl is-enabled chronyd 2>/dev/null) $(systemctl is-active chronyd 2>/dev/null)"
      expect: {match: exact, value: "enabled active"}
  misconceptions:
    - id: pool-kept
      description: Adds the server but leaves the default pool line in place.
      feedback: "The task allows tr-el-02 only: remove or comment out the pool line."
      expectFail: [only-source]
      mutation:
        on: tr-el-01
        as: learner
        run: sudo sh -c 'echo "server tr-el-02 iburst" >> /etc/chrony.conf && systemctl restart chronyd'
  solution:
    explanation: Replace the pool line with a server line for tr-el-02, then restart chronyd so it uses only that source.
    steps:
      - on: tr-el-01
        as: learner
        run: |
          sudo sed -i 's/^\(pool\|server\) /#&/' /etc/chrony.conf
          echo 'server tr-el-02 iburst' | sudo tee -a /etc/chrony.conf >/dev/null
          sudo systemctl enable chronyd
          sudo systemctl restart chronyd
