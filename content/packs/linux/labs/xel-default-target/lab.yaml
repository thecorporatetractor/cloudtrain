apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xel-default-target
  title: Set the default boot target
  domain: linux
  frameworks: [rhcsa-aligned:deploy-maintain]
  difficulty: easy
  estimatedMinutes: 4
  tags: [exam, systemd, targets]
  version: 1
spec:
  description: |
    **Host:** node 2, `tr-el-02` (`ssh tr-el-02`, then `sudo -i`)

    Node 2 is a headless server, but someone set it to start a graphical session.
    Make node 2 **boot into `multi-user.target` by default**. Do not reboot it.
  objectives:
    - Set the default systemd target
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-el-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
      - name: tr-el-02
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536}
        access: [ssh, console]
  setup:
    - on: tr-el-02
      run: systemctl set-default graphical.target
  checks:
    - id: default
      description: The default target is multi-user.target
      type: shell
      on: tr-el-02
      skills: [linux.systemd.targets]
      weight: 2
      command: systemctl get-default
      expect: {match: exact, value: multi-user.target}
  misconceptions:
    - id: isolate-only
      description: Switches the running system with isolate but leaves the default unchanged.
      feedback: "systemctl isolate changes the current state only; systemctl set-default changes what boots."
      expectFail: [default]
      mutation:
        on: tr-el-02
        as: learner
        run: sudo systemctl isolate multi-user.target
  solution:
    explanation: systemctl set-default points default.target at multi-user.target.
    steps:
      - on: tr-el-02
        as: learner
        run: sudo systemctl set-default multi-user.target
