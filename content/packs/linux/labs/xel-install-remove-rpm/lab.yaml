apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xel-install-remove-rpm
  title: Install and remove packages to a target state
  domain: linux
  frameworks: [rhcsa-aligned:software]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, dnf, rpm]
  version: 1
spec:
  description: |
    **Host:** node 1, `tr-el-01` (`ssh tr-el-01`, then `sudo -i`)

    Bring node 1's software to the state the depot standard asks for, using the
    configured repository:

    - the packages **`{{a}}`** and **`{{b}}`** are **installed**;
    - the package **`{{c}}`** is **not installed**;
    - nothing else is removed.
  objectives:
    - Install and remove packages with dnf
  params:
    a:
      type: choice
      values: [tree, zsh, words]
    b:
      type: choice
      values: [mtr, bc, time]
    c:
      type: choice
      values: [telnet, nmap, traceroute]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-el-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
  setup:
    - on: tr-el-01
      timeoutSec: 240
      run: |
        set -eu
        for p in {{a}} {{b}}; do ! rpm -q $p >/dev/null 2>&1 || rpm -e --nodeps $p; done
        rpm -q {{c}} >/dev/null 2>&1 || dnf -y -q install {{c}}
        rpm -q tmux rsync >/dev/null
  checks:
    - id: installed
      description: Both requested packages are installed
      type: shell
      on: tr-el-01
      skills: [linux.packages.dnf]
      weight: 1.5
      command: rpm -q {{a}} {{b}} >/dev/null 2>&1 && echo installed || echo missing
      expect: {match: exact, value: installed}
    - id: removed
      description: The unwanted package is gone
      type: shell
      on: tr-el-01
      skills: [linux.packages.dnf]
      weight: 1
      command: rpm -q {{c}} >/dev/null 2>&1 && echo present || echo removed
      expect: {match: exact, value: removed}
    - id: others-kept
      description: Unrelated packages are still installed
      type: shell
      on: tr-el-01
      skills: [linux.packages.dnf]
      weight: 0.5
      command: rpm -q tmux rsync openssh-server >/dev/null 2>&1 && echo kept || echo lost
      expect: {match: exact, value: kept}
  misconceptions:
    - id: forgot-removal
      description: Installs the packages but leaves the unwanted one.
      feedback: "dnf remove {{c}} takes it out; check the result with rpm -q."
      expectFail: [removed]
      mutation:
        on: tr-el-01
        as: learner
        timeoutSec: 180
        run: sudo dnf -y -q install {{a}} {{b}}
  solution:
    explanation: dnf install pulls the packages from the local repository, dnf remove takes the unwanted one out.
    steps:
      - on: tr-el-01
        as: learner
        timeoutSec: 240
        run: sudo sh -c 'dnf -y -q install {{a}} {{b}} && dnf -y -q remove {{c}}'
