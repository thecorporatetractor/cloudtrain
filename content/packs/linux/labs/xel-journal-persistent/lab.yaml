apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xel-journal-persistent
  title: Make the journal persistent
  domain: linux
  frameworks: [rhcsa-aligned:running-systems]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, journald, logging]
  version: 1
spec:
  description: |
    **Host:** node 1, `tr-el-01` (`ssh tr-el-01`, then `sudo -i`)

    The signalling team lost the logs of last night's fault when node 1 was
    restarted. Configure the **systemd journal** on node 1 so that it is **stored
    on disk and survives reboots**, and make the running journal service write to
    the persistent store **now**, without rebooting.
  objectives:
    - Configure persistent journal storage
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-el-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
  setup:
    - on: tr-el-01
      run: |
        set -eu
        mkdir -p /etc/systemd/journald.conf.d
        printf '[Journal]\nStorage=volatile\n' > /etc/systemd/journald.conf.d/50-tr-volatile.conf
        rm -rf /var/log/journal
        systemctl restart systemd-journald
  checks:
    - id: config
      description: The effective journald configuration keeps the journal on disk
      type: shell
      on: tr-el-01
      skills: [linux.observability.journal-persistence]
      weight: 1.5
      command: |
        s=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | sed -n 's/^[[:space:]]*Storage=//p' | tail -1)
        case "${s:-auto}" in persistent) echo persistent ;; auto) [ -d /var/log/journal ] && echo persistent || echo volatile ;; *) echo "$s" ;; esac
      expect: {match: exact, value: persistent}
    - id: writing
      description: journald is writing to /var/log/journal now
      type: shell
      on: tr-el-01
      skills: [linux.observability.journal-persistence]
      weight: 1.5
      command: |
        logger -t tr-check "persist-probe-$$"; journalctl --sync 2>/dev/null
        ls /var/log/journal/*/system.journal >/dev/null 2>&1 && journalctl -D /var/log/journal -t tr-check 2>/dev/null | grep -q "persist-probe-$$" && echo on-disk || echo memory-only
      expect: {match: exact, value: on-disk}
  misconceptions:
    - id: no-restart
      description: Changes the configuration but leaves journald running with the old setting.
      feedback: "journald reads its configuration at start, and only moves its runtime journal to disk when asked: restart systemd-journald, then journalctl --flush."
      expectFail: [writing]
      mutation:
        on: tr-el-01
        as: learner
        run: |
          sudo rm -f /etc/systemd/journald.conf.d/50-tr-volatile.conf
          printf '[Journal]\nStorage=persistent\n' | sudo tee /etc/systemd/journald.conf.d/60-persistent.conf >/dev/null
  solution:
    explanation: The drop-in forced Storage=volatile; remove it, set Storage=persistent and restart systemd-journald, which creates /var/log/journal and writes there.
    steps:
      - on: tr-el-01
        as: learner
        run: |
          sudo rm -f /etc/systemd/journald.conf.d/50-tr-volatile.conf
          printf '[Journal]\nStorage=persistent\n' | sudo tee /etc/systemd/journald.conf.d/60-persistent.conf >/dev/null
          sudo systemctl restart systemd-journald
          sudo journalctl --flush
    alternatives:
      - id: auto-with-dir
        description: Keep Storage=auto (the default) and create /var/log/journal.
        steps:
          - on: tr-el-01
            as: learner
            run: |
              sudo rm -f /etc/systemd/journald.conf.d/50-tr-volatile.conf
              sudo mkdir -p /var/log/journal
              sudo systemd-tmpfiles --create --prefix /var/log/journal
              sudo systemctl restart systemd-journald
              sudo journalctl --flush
