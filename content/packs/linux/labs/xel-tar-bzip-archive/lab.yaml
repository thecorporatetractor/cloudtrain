apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xel-tar-bzip-archive
  title: Create a compressed archive of a directory
  domain: linux
  frameworks: [rhcsa-aligned:essential-tools]
  difficulty: easy
  estimatedMinutes: 5
  tags: [exam, tar, bzip2]
  version: 1
spec:
  description: |
    **Host:** node 1, `tr-el-01` (`ssh tr-el-01`, then `sudo -i`)

    Archive the timetable office's **{{year}}** folder before it is purged: create a
    **bzip2-compressed tar archive** of the directory **`/srv/timetables/{{year}}`**
    (with everything below it) at **`/root/backups/timetables-{{year}}.tar.bz2`**.
  objectives:
    - Create a bzip2-compressed tar archive of a directory tree
  params:
    year:
      type: int
      min: 2016
      max: 2024
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-el-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
  setup:
    - on: tr-el-01
      run: |
        set -eu
        rm -rf /srv/timetables /root/backups/timetables-{{year}}.tar.bz2
        for y in {{year}} 2025; do
          for s in winter summer; do
            mkdir -p /srv/timetables/$y/$s/lines
            for l in north coast valley; do
              seq 1 40 | awk -v l=$l -v y=$y '{printf "%s %s %02d:%02d\n", y, l, ($1 * 7) % 24, ($1 * 13) % 60}' > /srv/timetables/$y/$s/lines/$l.txt
            done
            echo "$s $y notes" > /srv/timetables/$y/$s/README
          done
        done
        install -d -m 0700 /root/backups
  checks:
    - id: bzip2
      description: The archive exists and is bzip2-compressed
      type: shell
      on: tr-el-01
      skills: [linux.files.links-archives]
      weight: 1
      command: f=/root/backups/timetables-{{year}}.tar.bz2; [ -f $f ] && bzip2 -t $f 2>/dev/null && echo bzip2 || echo no
      expect: {match: exact, value: bzip2}
    - id: content
      description: It holds every file of the directory and nothing from other years
      type: shell
      on: tr-el-01
      skills: [linux.files.links-archives]
      weight: 2
      command: |
        f=/root/backups/timetables-{{year}}.tar.bz2
        got=$(tar -tjf $f 2>/dev/null | grep -v '/$' | sed -n 's#^\(.*/\)\{0,1\}{{year}}/##p' | sort | tr '\n' ' ')
        want=$(cd /srv/timetables/{{year}} && find . -type f | sed 's#^\./##' | sort | tr '\n' ' ')
        other=$(tar -tjf $f 2>/dev/null | grep -c '2025/' || true)
        [ -n "$want" ] && [ "$got" = "$want" ] && [ "$other" = 0 ] && echo complete || echo incomplete
      expect: {match: exact, value: complete}
  misconceptions:
    - id: gzip-instead
      description: Compresses with gzip although the name says bzip2.
      feedback: "tar -z writes gzip; bzip2 is tar -j (or --bzip2)."
      expectFail: [bzip2]
      mutation:
        on: tr-el-01
        as: learner
        run: sudo tar -czf /root/backups/timetables-{{year}}.tar.bz2 -C /srv/timetables {{year}}
  solution:
    explanation: tar -c creates the archive, -j compresses it with bzip2, -f names the file.
    steps:
      - on: tr-el-01
        as: learner
        run: sudo tar -cjf /root/backups/timetables-{{year}}.tar.bz2 /srv/timetables/{{year}}
    alternatives:
      - id: relative
        description: Archive relative to the parent directory with -C.
        steps:
          - on: tr-el-01
            as: learner
            run: sudo tar --bzip2 -cf /root/backups/timetables-{{year}}.tar.bz2 -C /srv/timetables {{year}}
