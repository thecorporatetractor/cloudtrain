apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xlf-firewall-subnet-only
  title: Allow a service from one subnet only
  domain: linux
  frameworks: [lfcs:networking]
  difficulty: medium
  estimatedMinutes: 8
  tags: [exam, firewall, ufw, nftables]
  version: 1
spec:
  description: |
    **Hosts:** `tr-ops-01` (configure here); `tr-sec-01` is a client outside the
    allowed subnet

    The ticket API on `tr-ops-01` listens on **TCP port {{port}}**. Only the ticket
    office subnet **`{{net}}`** may connect to it:

    - TCP {{port}} is **accepted from `{{net}}`** and **dropped or rejected from every
      other address**;
    - **SSH stays reachable** from everywhere, and so do the host's **other services**
      (do not block other incoming traffic);
    - the rules **survive a reboot**.
  objectives:
    - Restrict a port to a source subnet with a host firewall, persistently
  params:
    port:
      type: int
      min: 7600
      max: 7699
    net:
      type: choice
      values: ["198.51.100.0/24", "203.0.113.0/24", "192.0.2.0/24"]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-ops-01
        driver: vm
        image: ubuntu-vm:24.04
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
      - name: tr-sec-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536}
        access: [ssh, console]
  setup:
    - on: tr-ops-01
      timeoutSec: 90
      run: |
        set -eu
        for s in api:{{port}} canary:7599; do
          n=${s%%:*}; p=${s##*:}; mkdir -p /srv/tr-$n; echo "tr-$n" > /srv/tr-$n/index.html
          printf '[Unit]\nDescription=Tallowmere %s\n[Service]\nExecStart=/usr/bin/python3 -m http.server %s --directory /srv/tr-%s\nRestart=always\n[Install]\nWantedBy=multi-user.target\n' $n $p $n > /etc/systemd/system/tr-$n.service
        done
        systemctl daemon-reload; systemctl enable --now tr-api.service tr-canary.service
  checks:
    - id: blocked-elsewhere
      description: Port {{port}} is not reachable from tr-sec-01, outside the subnet
      type: shell
      on: tr-sec-01
      skills: [linux.net.firewall]
      weight: 1.5
      timeoutSec: 30
      command: curl -4 -s -m 6 http://tr-ops-01:{{port}}/ | grep -q tr-api && echo open || echo blocked
      expect: {match: exact, value: blocked}
    - id: subnet-allowed
      description: The firewall accepts port {{port}} from the subnet
      type: shell
      on: tr-ops-01
      skills: [linux.net.firewall]
      weight: 1.5
      command: |
        n=$(echo {{net}} | sed 's#\.#\\.#g')
        nft list ruleset 2>/dev/null | grep -E "ip saddr $n" | grep -E "dport {{port}}( |$)" | grep -qE 'accept' && echo allowed || echo missing
      expect: {match: exact, value: allowed}
    - id: others-open
      description: SSH and the other services stay reachable from tr-sec-01
      type: shell
      on: tr-sec-01
      skills: [linux.net.firewall]
      weight: 1
      timeoutSec: 30
      command: |
        s=$(timeout 6 bash -c 'exec 3<>/dev/tcp/tr-ops-01/22; head -c 4 <&3' 2>/dev/null)
        c=$(curl -4 -s -m 6 http://tr-ops-01:7599/)
        [ "$s" = SSH- ] && [ "$c" = tr-canary ] && echo open || echo "ssh=$s canary=$c"
      expect: {match: exact, value: open}
    - id: persistent
      description: The rules are loaded at boot
      type: shell
      on: tr-ops-01
      skills: [linux.net.firewall]
      weight: 1
      command: |
        if [ "$(systemctl is-enabled ufw 2>/dev/null)" = enabled ] && grep -q '^ENABLED=yes' /etc/ufw/ufw.conf && grep -sq "{{port}}" /etc/ufw/user.rules; then echo persistent
        elif [ "$(systemctl is-enabled nftables 2>/dev/null)" = enabled ] && grep -sq "{{port}}" /etc/nftables.conf /etc/nftables.d/*.nft 2>/dev/null; then echo persistent
        else echo runtime-only; fi
      expect: {match: exact, value: persistent}
  misconceptions:
    - id: default-deny
      description: Enables ufw with its default deny-incoming policy and allows only SSH and the subnet.
      feedback: "The task keeps other services reachable: set the default incoming policy to allow and add an explicit deny for port {{port}} after the subnet rule."
      expectFail: [others-open]
      mutation:
        on: tr-ops-01
        as: learner
        run: |
          sudo ufw allow OpenSSH >/dev/null
          sudo ufw allow from {{net}} to any port {{port}} proto tcp >/dev/null
          sudo ufw --force enable >/dev/null
    - id: allow-all
      description: Adds the subnet rule but nothing that stops other sources.
      feedback: "With an accepting default, an allow rule alone changes nothing; deny the port for everyone else after it."
      expectFail: [blocked-elsewhere]
      mutation:
        on: tr-ops-01
        as: learner
        run: |
          sudo ufw default allow incoming >/dev/null
          sudo ufw allow from {{net}} to any port {{port}} proto tcp >/dev/null
          sudo ufw --force enable >/dev/null
  solution:
    explanation: ufw evaluates rules in order; allow from the subnet first, then deny the port, with the default incoming policy left at allow so other services keep working. ufw enable persists it.
    steps:
      - on: tr-ops-01
        as: learner
        run: |
          set -e
          sudo ufw default allow incoming >/dev/null
          sudo ufw allow OpenSSH >/dev/null
          sudo ufw allow from {{net}} to any port {{port}} proto tcp >/dev/null
          sudo ufw deny {{port}}/tcp >/dev/null
          sudo ufw --force enable >/dev/null
    alternatives:
      - id: nftables
        description: A dedicated nftables table saved in /etc/nftables.conf.
        steps:
          - on: tr-ops-01
            as: learner
            run: |
              set -e
              t=$(printf '%s\n' 'table inet trapi {' '  chain input {' '    type filter hook input priority 0; policy accept;' '    tcp dport {{port}} ip saddr {{net}} accept' '    tcp dport {{port}} drop' '  }' '}')
              printf '\n%s\n' "$t" | sudo tee -a /etc/nftables.conf >/dev/null
              sudo systemctl enable nftables
              sudo nft list table inet trapi >/dev/null 2>&1 && sudo nft delete table inet trapi || true
              # only this table: nft -f /etc/nftables.conf would flush every other live rule (podman's port forwards)
              printf '%s\n' "$t" | sudo nft -f -
