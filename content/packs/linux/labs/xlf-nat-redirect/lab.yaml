apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xlf-nat-redirect
  title: Redirect a public port to a backend
  domain: linux
  frameworks: [lfcs:networking]
  difficulty: hard
  estimatedMinutes: 10
  tags: [exam, nat, nftables, forwarding]
  version: 1
spec:
  description: |
    **Hosts:** gateway `tr-ops-01` (configure here); test client `tr-sec-01`

    The ticket gateway `tr-ops-01` runs the fare backend on **TCP port {{bport}}**.
    Clients must reach it on the public port **TCP {{pport}}** instead:

    - TCP connections that **arrive at `tr-ops-01` on port {{pport}}** are redirected
      (destination NAT) to the backend on port **{{bport}}** of the same host;
    - **IPv4 forwarding** is enabled on `tr-ops-01`;
    - both survive a **reboot**. Do not stop the backend or block other traffic.
  objectives:
    - Redirect a port with destination NAT
    - Make NAT rules and forwarding persistent
  params:
    pport:
      type: choice
      values: ["8080", "8088", "8443"]
    bport:
      type: int
      min: 9100
      max: 9199
    token:
      type: int
      min: 1000
      max: 9999
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-ops-01
        driver: vm
        image: ubuntu-vm:24.04
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
      - name: tr-sec-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536}
        access: [ssh, console]
  setup:
    - on: tr-ops-01
      timeoutSec: 90
      run: |
        set -eu
        mkdir -p /srv/fare-backend; echo "fare backend {{token}}" > /srv/fare-backend/index.html
        printf '[Unit]\nDescription=Tallowmere fare backend\n[Service]\nExecStart=/usr/bin/python3 -m http.server {{bport}} --directory /srv/fare-backend\nRestart=always\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/tr-fare-backend.service
        systemctl daemon-reload; systemctl enable --now tr-fare-backend.service
        sysctl -q -w net.ipv4.ip_forward=0
  checks:
    - id: redirected
      description: A client reaches the backend through port {{pport}}
      type: shell
      on: tr-sec-01
      skills: [linux.net.nat-forwarding]
      weight: 2
      timeoutSec: 30
      command: curl -4 -s -m 8 http://tr-ops-01:{{pport}}/ | grep -o 'fare backend {{token}}' || echo unreachable
      expect: {match: exact, value: "fare backend {{token}}"}
    - id: forwarding
      description: IPv4 forwarding is on now and in the boot configuration
      type: shell
      on: tr-ops-01
      skills: [linux.net.nat-forwarding]
      weight: 1
      command: |
        b=$(systemd-analyze cat-config sysctl.d 2>/dev/null | tr -d ' \t' | awk -F= '$1 == "net.ipv4.ip_forward" || $1 == "net/ipv4/ip_forward" {v = $2} END {print v}')
        echo "now=$(sysctl -n net.ipv4.ip_forward) boot=${b:-0}"
      expect: {match: exact, value: "now=1 boot=1"}
    - id: rule-persistent
      description: The redirect is in a firewall configuration loaded at boot
      type: shell
      on: tr-ops-01
      skills: [linux.net.nat-forwarding]
      weight: 1.5
      command: |
        if [ "$(systemctl is-enabled nftables 2>/dev/null)" = enabled ] && grep -sqE 'dport[[:space:]]+{{pport}}.*(redirect|dnat)' /etc/nftables.conf /etc/nftables.d/*.nft 2>/dev/null; then echo persistent
        elif [ "$(systemctl is-enabled ufw 2>/dev/null)" = enabled ] && grep -q '^ENABLED=yes' /etc/ufw/ufw.conf && grep -sqE -- '--dport {{pport}}.*(REDIRECT|DNAT)' /etc/ufw/before.rules; then echo persistent
        elif [ "$(systemctl is-enabled netfilter-persistent 2>/dev/null)" = enabled ] && grep -sqE -- '--dport {{pport}}.*(REDIRECT|DNAT)' /etc/iptables/rules.v4; then echo persistent
        else echo runtime-only; fi
      expect: {match: exact, value: persistent}
    - id: backend-direct
      description: The backend still answers on its own port
      type: shell
      on: tr-ops-01
      skills: [linux.net.nat-forwarding]
      weight: 0.5
      command: curl -4 -s -m 5 http://localhost:{{bport}}/ | grep -q 'fare backend {{token}}' && echo up || echo down
      expect: {match: exact, value: up}
  misconceptions:
    - id: runtime-rule
      description: Adds the rule and forwarding at runtime only.
      feedback: "nft add rule and sysctl -w are lost at boot; save the ruleset to /etc/nftables.conf with the nftables service enabled and set ip_forward in /etc/sysctl.d."
      expectFail: [forwarding, rule-persistent]
      mutation:
        on: tr-ops-01
        as: learner
        run: |
          sudo nft add table ip trnat
          sudo nft 'add chain ip trnat prerouting { type nat hook prerouting priority dstnat; }'
          sudo nft add rule ip trnat prerouting tcp dport {{pport}} redirect to :{{bport}}
          sudo sysctl -q -w net.ipv4.ip_forward=1
  solution:
    explanation: An nftables nat table with a prerouting redirect, saved in /etc/nftables.conf with nftables.service enabled, plus ip_forward=1 in a sysctl.d file. Load only the new table now; `nft -f /etc/nftables.conf` starts with `flush ruleset` and would drop every other live rule, such as podman's port forwards.
    steps:
      - on: tr-ops-01
        as: learner
        run: |
          set -e
          t=$(printf '%s\n' 'table ip trnat {' '  chain prerouting {' '    type nat hook prerouting priority dstnat; policy accept;' '    tcp dport {{pport}} redirect to :{{bport}}' '  }' '}')
          printf '\n%s\n' "$t" | sudo tee -a /etc/nftables.conf >/dev/null
          sudo nft -c -f /etc/nftables.conf
          sudo systemctl enable nftables
          sudo nft list table ip trnat >/dev/null 2>&1 && sudo nft delete table ip trnat || true
          printf '%s\n' "$t" | sudo nft -f -
          echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/60-forwarding.conf >/dev/null
          sudo sysctl -q -p /etc/sysctl.d/60-forwarding.conf
