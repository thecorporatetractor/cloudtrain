apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xlf-time-sync-server
  title: Point the host at the lab time server
  domain: linux
  frameworks: [lfcs:networking]
  difficulty: easy
  estimatedMinutes: 6
  tags: [exam, chrony, ntp, timezone]
  version: 1
spec:
  description: |
    **Hosts:** `tr-ops-01` (configure here); `tr-sec-01` is the depot time server

    On `tr-ops-01`:

    - synchronise the clock **only from `tr-sec-01`**: no other time source (pools,
      servers) may stay configured;
    - set the time zone to **`{{tz}}`**.

    Both must hold now and after a reboot.
  objectives:
    - Configure chrony with a single in-lab server
    - Set the system time zone
  params:
    tz:
      type: choice
      values: [Europe/London, Europe/Dublin, Atlantic/Reykjavik, Europe/Lisbon]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-ops-01
        driver: vm
        image: ubuntu-vm:24.04
        resources: {cpu: 2, memoryMiB: 1536, disks: ["2Gi", "1Gi", "2Gi"]}
        access: [ssh, console]
      - name: tr-sec-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536}
        access: [ssh, console]
  setup:
    - on: tr-sec-01
      timeoutSec: 120
      run: |
        set -eu
        mkdir -p /etc/chrony.d
        printf '%s\n' 'allow all' 'local stratum 8' > /etc/chrony.d/tr-server.conf
        grep -qE '^(confdir|sourcedir|include) /etc/chrony.d' /etc/chrony.conf || echo 'include /etc/chrony.d/*.conf' >> /etc/chrony.conf
        systemctl enable chronyd; systemctl restart chronyd
        firewall-cmd -q --permanent --add-service=ntp; firewall-cmd -q --reload
    - on: tr-ops-01
      run: |
        set -eu
        timedatectl set-timezone Etc/UTC
        systemctl enable --now chrony
  checks:
    - id: only-source
      description: tr-sec-01 is the only configured time source
      type: shell
      on: tr-ops-01
      skills: [linux.net.time-sync]
      weight: 2
      command: |
        cat /etc/chrony/chrony.conf /etc/chrony/conf.d/*.conf /etc/chrony/sources.d/*.sources 2>/dev/null | awk '$1 == "server" || $1 == "pool" || $1 == "peer" {print $2}' | sort -u | paste -sd,
      expect: {match: exact, value: tr-sec-01}
    - id: live-source
      description: The running chrony uses tr-sec-01
      type: shell
      on: tr-ops-01
      skills: [linux.net.time-sync]
      weight: 1
      timeoutSec: 90
      command: |
        ip=$(getent ahostsv4 tr-sec-01 | awk '{print $1; exit}')
        for i in $(seq 30); do
          s=$(chronyc -n sources 2>/dev/null | awk 'NR > 2 && /^\^/ {print $2}' | paste -sd,)
          [ "$s" = "$ip" ] && { echo using-server; exit 0; }
          sleep 2
        done; echo "sources=$s"
      expect: {match: exact, value: using-server}
    - id: timezone
      description: The time zone is {{tz}}
      type: shell
      on: tr-ops-01
      skills: [linux.net.time-sync]
      weight: 1
      command: echo "$(timedatectl show -p Timezone --value) $(readlink /etc/localtime | sed 's#.*zoneinfo/##')"
      expect: {match: exact, value: "{{tz}} {{tz}}"}
  misconceptions:
    - id: pool-kept
      description: Adds the server but keeps the Ubuntu pools.
      feedback: "The task allows tr-sec-01 only: comment out the pool lines in /etc/chrony/chrony.conf."
      expectFail: [only-source]
      mutation:
        on: tr-ops-01
        as: learner
        run: |
          echo 'server tr-sec-01 iburst' | sudo tee /etc/chrony/sources.d/tr-sec.sources >/dev/null
          sudo systemctl restart chrony
          sudo timedatectl set-timezone {{tz}}
  solution:
    explanation: Comment out the pool lines, add a server line for tr-sec-01 and restart chrony; timedatectl set-timezone writes /etc/localtime.
    steps:
      - on: tr-ops-01
        as: learner
        run: |
          sudo sed -i 's/^\(pool\|server\) /#&/' /etc/chrony/chrony.conf
          echo 'server tr-sec-01 iburst' | sudo tee /etc/chrony/sources.d/tr-sec.sources >/dev/null
          sudo systemctl restart chrony
          sudo timedatectl set-timezone {{tz}}
