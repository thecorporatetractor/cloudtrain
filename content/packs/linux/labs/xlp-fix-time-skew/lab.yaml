apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xlp-fix-time-skew
  title: Fix certificate errors caused by clock skew
  domain: linux
  frameworks: [linuxplus:troubleshooting]
  difficulty: medium
  estimatedMinutes: 5
  tags: [exam, time, chrony, ntp, tls, troubleshooting]
  version: 1
spec:
  description: |
    **Host:** `tr-lp-01` (`ssh tr-lp-01`, then `sudo -i`)

    TLS clients on `tr-lp-01` fail with "certificate is not yet valid". The clock of the
    host is wrong, and the time service (`chrony`) does not correct it. The Tallowmere lab
    time server is **10.65.30.2** (NTP, UDP 123). Make the host take its time from that
    server **and only that server**: correct the clock now, keep the configuration so
    that it works after a reboot, and keep `chrony` enabled.
  objectives:
    - Recognise clock skew as the cause of TLS failures
    - Point chrony at the right source and step the clock
  params:
    hours:
      type: choice
      values: ["3", "5", "9"]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-lp-01
        driver: vm
        image: ubuntu-vm:24.04
        resources: {cpu: 2, memoryMiB: 1536}
        access: [ssh, console]
  setup:
    - on: tr-lp-01
      timeoutSec: 120
      run: |
        set -eu
        V=/var/lib/cloudtrain; install -d -m 0700 $V
        command -v chronyd >/dev/null 2>&1 || command -v /usr/sbin/chronyd >/dev/null 2>&1
        systemctl stop chrony.service 2>/dev/null || true
        systemctl stop tr-ntp-server.service 2>/dev/null || true; systemctl reset-failed tr-ntp-server.service 2>/dev/null || true
        # a reference time server in a network namespace (eth0 and the default route are untouched).
        # It answers with the true time, taken from a record made before the clock is skewed.
        ROLE=ntp; NET=10.65.30
        ip netns del tr-$ROLE 2>/dev/null || true
        ip link del v-$ROLE 2>/dev/null || true
        ip netns add tr-$ROLE
        ip link add v-$ROLE type veth peer name v-$ROLE-p
        ip link set v-$ROLE-p netns tr-$ROLE
        ip addr add $NET.1/24 dev v-$ROLE
        ip link set v-$ROLE up
        ip -n tr-$ROLE addr add $NET.2/24 dev v-$ROLE-p
        ip -n tr-$ROLE link set v-$ROLE-p up
        ip -n tr-$ROLE link set lo up
        [ -f $V/ntp-ref ] || python3 -c 'import time; print(time.time(), time.monotonic())' > $V/ntp-ref
        install -d -m 0755 /usr/local/libexec
        cat > /usr/local/libexec/tr-ntpd.py <<'EOPY'
        import socket, struct, time
        t0, m0 = [float(x) for x in open("/var/lib/cloudtrain/ntp-ref").read().split()]
        def now():
            return t0 + (time.monotonic() - m0)
        def ts(t):
            return struct.pack("!II", int(t) + 2208988800, int((t % 1) * 2**32))
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.bind(("10.65.30.2", 123))
        while True:
            d, a = s.recvfrom(512)
            if len(d) < 48:
                continue
            rx = now()
            pkt = bytes([0x24, 2, d[2], 0xEC]) + struct.pack("!II", 0, 65) + socket.inet_aton("10.65.30.2") + ts(rx) + d[40:48] + ts(rx) + ts(now())
            s.sendto(pkt, a)
        EOPY
        systemd-run -q --unit tr-ntp-server --property=NetworkNamespacePath=/run/netns/tr-$ROLE --property=Restart=always /usr/bin/python3 /usr/local/libexec/tr-ntpd.py
        # the broken client: a dead pool name; the clock is skewed into the past
        mkdir -p /etc/chrony/conf.d /etc/chrony/sources.d
        rm -f /etc/chrony/conf.d/*.conf /etc/chrony/sources.d/*.sources
        printf '%s\n' 'confdir /etc/chrony/conf.d' 'sourcedir /etc/chrony/sources.d' 'pool ntp.tallowmere.test iburst maxsources 2' 'keyfile /etc/chrony/chrony.keys' 'driftfile /var/lib/chrony/chrony.drift' 'ntsdumpdir /var/lib/chrony' 'logdir /var/log/chrony' 'rtcsync' 'makestep 1 3' > /etc/chrony/chrony.conf
        systemctl enable chrony.service >/dev/null 2>&1 || true
        date -s "@$(( $(date +%s) - {{hours}} * 3600 ))" >/dev/null
        systemctl start chrony.service
        sleep 2
  checks:
    - id: clock-correct
      description: The system clock shows the true time
      type: shell
      on: tr-lp-01
      skills: [linux.net.time-sync]
      weight: 3
      command: |
        python3 - <<'EOS'
        import time
        t0, m0 = [float(x) for x in open("/var/lib/cloudtrain/ntp-ref").read().split()]
        off = time.time() - (t0 + time.monotonic() - m0)
        print("ok" if abs(off) < 5 else "off=%d" % off)
        EOS
      expect: {match: exact, value: ok}
    - id: only-source
      description: The lab server is the only configured time source
      type: shell
      on: tr-lp-01
      skills: [linux.net.time-sync]
      weight: 2
      command: |
        cat /etc/chrony/chrony.conf /etc/chrony/conf.d/*.conf /etc/chrony/sources.d/*.sources 2>/dev/null | sed 's/#.*//' | awk '$1 == "server" || $1 == "pool" || $1 == "peer" {print $2}' | sort -u | paste -sd,
      expect: {match: exact, value: 10.65.30.2}
    - id: live-source
      description: The running chrony is synchronised to the lab server
      type: shell
      on: tr-lp-01
      skills: [linux.net.time-sync]
      weight: 2
      timeoutSec: 90
      command: |
        for i in $(seq 30); do
          s=$(chronyc -n sources 2>/dev/null | awk 'NR > 2 && $1 ~ /^\^[*+]/ {print $2}' | paste -sd,)
          [ "$s" = 10.65.30.2 ] && { echo "$s"; exit 0; }
          sleep 2
        done; echo "sources=${s:-none}"
      expect: {match: exact, value: 10.65.30.2}
    - id: enabled
      description: chrony is enabled at boot
      type: shell
      on: tr-lp-01
      skills: [linux.net.time-sync]
      weight: 1
      command: systemctl is-enabled chrony.service 2>/dev/null || true
      expect: {match: exact, value: enabled}
  misconceptions:
    - id: one-shot
      description: Steps the clock once with chronyd -q and leaves the configuration alone.
      feedback: "A one-shot sync fixes the clock until it drifts again. The source belongs in the chrony configuration and the running service must use it."
      expectFail: [only-source, live-source]
      mutation:
        on: tr-lp-01
        as: learner
        run: |
          sudo systemctl stop chrony.service
          sudo chronyd -q 'server 10.65.30.2 iburst'
          sudo systemctl start chrony.service
    - id: not-restarted
      description: Edits the configuration but never restarts chrony.
      feedback: "chronyd reads its configuration at start. Restart the service (and step the clock with chronyc makestep if the offset is large)."
      expectFail: [clock-correct, live-source]
      mutation:
        on: tr-lp-01
        as: learner
        run: sudo sed -i 's/^pool .*/server 10.65.30.2 iburst/' /etc/chrony/chrony.conf
  solution:
    explanation: timedatectl and chronyc tracking show an unsynchronised clock; chronyc sources shows the pool name cannot be resolved. Replace it with the lab server, restart chrony and step the clock (makestep).
    steps:
      - on: tr-lp-01
        as: learner
        run: |
          set -e
          date
          sudo sed -i 's/^pool .*/server 10.65.30.2 iburst/' /etc/chrony/chrony.conf
          sudo systemctl restart chrony.service
          sleep 8
          sudo chronyc makestep
          chronyc tracking
    alternatives:
      - id: sources-dir
        description: Put the source in a file under sources.d and remove the pool line.
        steps:
          - on: tr-lp-01
            as: learner
            run: |
              set -e
              sudo sed -i '/^pool /d' /etc/chrony/chrony.conf
              echo 'server 10.65.30.2 iburst' | sudo tee /etc/chrony/sources.d/tr-lab.sources >/dev/null
              sudo systemctl restart chrony.service
              sleep 8
              sudo chronyc makestep
