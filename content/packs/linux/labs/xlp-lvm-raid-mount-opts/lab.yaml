apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xlp-lvm-raid-mount-opts
  title: Mount a volume with restrictive options
  domain: linux
  frameworks: [linuxplus:system-management]
  difficulty: easy
  estimatedMinutes: 4
  tags: [exam, lvm, mount, fstab]
  version: 1
spec:
  description: |
    **Host:** `tr-lp-01` (`ssh tr-lp-01`, then `sudo -i`)

    The logical volume **`/dev/vgdrop/lvdrop`** (XFS) receives files uploaded by an outside
    vendor. Mount it at **`{{mp}}`** (the directory exists) with the options
    **`noexec`** and **`nosuid`**, and make the mount survive a reboot. Do not
    format or resize the volume.
  objectives:
    - Mount a logical volume with restrictive options
    - Persist a mount in /etc/fstab and validate it
  params:
    mp:
      type: choice
      values: [/srv/vendor-drop, /srv/inbound, /data/uploads]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: tr-lp-01
        driver: vm
        image: el-vm:10
        resources: {cpu: 2, memoryMiB: 1536, disks: ["1Gi"]}
        access: [ssh, console]
  setup:
    - on: tr-lp-01
      timeoutSec: 180
      run: |
        set -eu
        [ "$(readlink -f /dev/disk/by-id/virtio-ct-data1)" = /dev/vdc ]
        if ! vgs vgdrop >/dev/null 2>&1; then
          wipefs -a /dev/vdc >/dev/null
          pvcreate -q -y /dev/vdc; vgcreate -q vgdrop /dev/vdc
          lvcreate -q -y -n lvdrop -L 400M vgdrop
          mkfs.xfs -q /dev/vgdrop/lvdrop
          t=$(mktemp -d); mount /dev/vgdrop/lvdrop $t
          echo "vendor drop volume" > $t/marker.txt
          umount $t; rmdir $t
        fi
        mkdir -p {{mp}}
        sed -i '\#vgdrop#d' /etc/fstab
        umount {{mp}} 2>/dev/null || true
        systemctl daemon-reload
  checks:
    - id: right-volume
      description: "{{mp}} is the vgdrop/lvdrop volume"
      type: shell
      on: tr-lp-01
      skills: [linux.storage.mounts]
      weight: 1
      command: |
        s=$(findmnt -n -o SOURCE {{mp}} 2>/dev/null); [ -n "$s" ] || { echo not-mounted; exit 0; }
        [ "$(readlink -f "$s")" = "$(readlink -f /dev/vgdrop/lvdrop)" ] && [ "$(cat {{mp}}/marker.txt 2>/dev/null)" = "vendor drop volume" ] && echo volume || echo other
      expect: {match: exact, value: volume}
    - id: live-options
      description: The live mount has noexec and nosuid
      type: shell
      on: tr-lp-01
      skills: [linux.storage.mounts]
      weight: 1.5
      command: findmnt -n -o OPTIONS {{mp}} 2>/dev/null | tr ',' '\n' | grep -xE 'noexec|nosuid' | sort | paste -sd, || true
      expect: {match: exact, value: "noexec,nosuid"}
    - id: persistent
      description: /etc/fstab mounts it with noexec and nosuid and passes findmnt --verify
      type: shell
      on: tr-lp-01
      skills: [linux.storage.mounts]
      weight: 2
      command: |
        o=$(findmnt --fstab -n -o OPTIONS --mountpoint {{mp}} 2>/dev/null | head -1 | tr ',' '\n' | grep -xE 'noexec|nosuid' | sort | paste -sd,)
        s=$(findmnt --fstab -n -o SOURCE --mountpoint {{mp}} 2>/dev/null | head -1)
        [ "$o" = "noexec,nosuid" ] || { echo "fstab-options=${o:-none}"; exit 0; }
        [ "$(readlink -f "$s" 2>/dev/null)" = "$(readlink -f /dev/vgdrop/lvdrop)" ] || { echo "fstab-source=${s:-none}"; exit 0; }
        if findmnt --verify --tab-file /etc/fstab 2>&1 | grep -Eq '[1-9][0-9]* (parse )?errors?'; then echo verify-errors; else echo persisted; fi
      expect: {match: exact, value: persisted}
  misconceptions:
    - id: mount-only
      description: Mounts with the options by hand and never edits /etc/fstab.
      feedback: "mount -o only lasts until reboot; add the line to /etc/fstab and run findmnt --verify."
      expectFail: [persistent]
      mutation:
        on: tr-lp-01
        as: learner
        run: sudo mount -o noexec,nosuid /dev/vgdrop/lvdrop {{mp}}
    - id: forgot-nosuid
      description: Persists only noexec.
      feedback: "Both options were asked for: noexec,nosuid. Check the live options with findmnt and the file with findmnt --fstab."
      expectFail: [live-options, persistent]
      mutation:
        on: tr-lp-01
        as: learner
        run: |
          echo '/dev/vgdrop/lvdrop {{mp}} xfs defaults,noexec 0 0' | sudo tee -a /etc/fstab >/dev/null
          sudo systemctl daemon-reload
          sudo mount {{mp}}
  solution:
    explanation: An fstab line with defaults,noexec,nosuid makes the mount permanent; mount reads the line, so the live mount gets the same options, and findmnt --verify validates the file.
    steps:
      - on: tr-lp-01
        as: learner
        run: |
          set -e
          echo '/dev/vgdrop/lvdrop {{mp}} xfs defaults,noexec,nosuid 0 0' | sudo tee -a /etc/fstab >/dev/null
          sudo systemctl daemon-reload
          sudo mount {{mp}}
          sudo findmnt --verify
    alternatives:
      - id: by-uuid
        description: Mount by UUID with an explicit option list.
        steps:
          - on: tr-lp-01
            as: learner
            run: |
              set -e
              u=$(sudo blkid -s UUID -o value /dev/vgdrop/lvdrop)
              echo "UUID=$u {{mp}} xfs rw,noexec,nosuid,relatime 0 0" | sudo tee -a /etc/fstab >/dev/null
              sudo systemctl daemon-reload
              sudo mount {{mp}}
      - id: mapper-path
        description: Use the device-mapper name.
        steps:
          - on: tr-lp-01
            as: learner
            run: |
              set -e
              echo '/dev/mapper/vgdrop-lvdrop {{mp}} xfs defaults,nosuid,noexec 0 0' | sudo tee -a /etc/fstab >/dev/null
              sudo systemctl daemon-reload
              sudo mount {{mp}}
