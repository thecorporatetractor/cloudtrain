# Linux content pack: hands-on Linux labs set in one fictional rail operator.
apiVersion: cloudtrain.dev/v1
kind: Pack
metadata:
  id: linux
  title: Linux administration
  domain: linux
  version: 1
  owners: [linux-content]
  description: |
    Hands-on Linux labs from the first shell prompt to scripting, services and
    troubleshooting. Every lab is graded automatically on end state and every check
    is tagged with skills from content/skills.yaml or the curriculum's newSkills.

# The fictional organisation every lab in this pack is set in.
universe:
  organisation: Tallowmere Rail
  summary: A fictional regional rail operator with a signalling centre, ticketing systems, rolling-stock depots and a timetable office.
  namingRules:
    hosts: "tr-<function>-NN (tr-timetable-01), tkt-<function>-NN for ticketing, depot-<n> for depots"
    users: "short lower-case first names for people (ada, bram), <system>-bot for service accounts"
    paths: "/srv/<area> for shared data, /etc/tr-<system> for configuration"
    domain: tallowmere.example

# Tier A labs (envTier A in content/curriculum.yaml) run in one unprivileged learner
# pod (catalog refs linux-pod-deb:24.04, linux-pod-el:10). The learner works as
# `learner`; setup, checks and teardown run as root in the same container.
# Checks read end state only (files, modes, process table, script output on hidden
# inputs), never shell history.
conventions:
  entryImage: linux-pod-deb:24.04

courses:
  - id: lf-shell-basics
    title: First steps in the shell
    description: Navigation, help, files, links and redirection on the timetable office workstations.
    level: beginner
    labs:
      - shell-first-steps-timetable
