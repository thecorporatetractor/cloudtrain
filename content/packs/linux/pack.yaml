# Linux content pack: hands-on Linux labs set in one fictional rail operator.
apiVersion: cloudtrain.dev/v1
kind: Pack
metadata:
  id: linux
  title: Linux administration
  domain: linux
  version: 1
  owners: [linux-content]
  description: |
    Hands-on Linux labs from the first shell prompt to scripting, services and
    troubleshooting. Every lab is graded automatically on end state and every check
    is tagged with skills from content/skills.yaml or the curriculum's newSkills.

# The fictional organisation every lab in this pack is set in.
universe:
  organisation: Tallowmere Rail
  summary: A fictional regional rail operator with a signalling centre, ticketing systems, rolling-stock depots and a timetable office.
  namingRules:
    hosts: "tr-<function>-NN (tr-timetable-01), tkt-<function>-NN for ticketing, depot-<n> for depots"
    users: "short lower-case first names for people (ada, bram), <system>-bot for service accounts"
    paths: "/srv/<area> for shared data, /etc/tr-<system> for configuration"
    domain: tallowmere.example

# Tier A labs (envTier A in content/curriculum.yaml) run in one unprivileged learner
# pod (catalog refs deb-lab:24.04, el-lab:10: user-namespaced, tini as PID 1). The
# learner works as `learner`; setup, checks and teardown run as root in the same
# container. Root labs set `learnerSudo: true` on the entry node and grant the sudo
# rule in setup (security trade-off: see docs/dev-environment.md, "learnerSudo").
# Tier B/C labs (envTier B or C) are a workstation pod (jumphost:1, entry) plus KubeVirt
# VMs from el-vm:10 / ubuntu-vm:24.04 (learner has passwordless sudo there; checks run as
# root over ssh). Tier-B labs run as such VMs until the Kata tier exists.
# Exam tasks of one simulation share byte-identical node definitions (sim-el-sysadmin:
# tr-el-01, tr-el-02; sim-linux-sysadmin: tr-ops-01, tr-sec-01).
# Checks read end state only (files, modes, process table, script output on hidden
# inputs), never shell history.
conventions:
  entryImage: deb-lab:24.04
  vmEntryImage: jumphost:1
  vmImages: [el-vm:10, ubuntu-vm:24.04]

courses:
  - id: lf-shell-basics
    title: First steps in the shell
    description: Navigation, files, links and redirection on the timetable office workstations.
    level: beginner
    labs: [shell-first-steps-timetable, file-ops-roster-cleanup, links-shared-timetable, streams-delay-report]
  - id: lf-text
    title: Editing and text processing
    description: vim, text filters, regular expressions and find.
    level: beginner
    labs: [vim-fix-signal-config, text-filters-ticket-sales, regex-extract-train-ids, find-stale-depot-files]
  - id: lf-processes
    title: Processes and jobs
    description: Process trees, priorities, signals and background jobs.
    level: beginner
    labs: [processes-runaway-sim, jobs-signals-long-export]
  - id: lf-everyday-admin
    title: Archives, networking and SSH
    description: tar archives, host network inspection and SSH client configuration.
    level: beginner
    labs: [archive-timetable-history, net-inspect-ticket-gate, ssh-config-depot-hosts]
  - id: lf-capstone
    title: "Capstone: signal box challenge"
    description: Chained puzzle levels.
    level: beginner
    labs: [signal-box-levels-1, signal-box-levels-2, signal-box-levels-3]
  - id: ls-scripts
    title: Writing scripts
    description: Scripts graded on hidden inputs, including edge cases.
    level: beginner
    labs: [script-first-delay-summary, script-loops-depot-checks, script-positional-user-tool, awk-fare-report]
  - id: ls-robust
    title: Robust scripts and Git
    description: Line endings, strict mode, traps, getopts and a Git branch workflow.
    level: intermediate
    labs: [fix-crlf-script, robust-script-rotation-tool, git-timetable-repo]
  - id: ls-investigate
    title: "Investigation challenge (CTF)"
    description: Answer questions about a seeded incident with grep, awk, sort and uniq; points for every answer, hints cost points.
    level: beginner
    labs: [ctf-ticket-gate-breach]
  - id: lsa-users-root
    title: Users, privilege and the environment
    description: Accounts, password aging, sudo rules, shared permissions, profiles and limits, worked as root through sudo.
    level: intermediate
    labs: [users-new-signallers, password-aging-contractors, sudo-depot-operators, permissions-ticketing-share, env-profile-signal-tools, ulimits-batch-user]
  - id: lsa-host-services
    title: Scheduling, SSH and name resolution
    description: cron jobs, sshd hardening, an SFTP jail and the resolver on a single host.
    level: intermediate
    labs: [cron-nightly-fares-export, sshd-keys-only, sftp-chroot-vendors, dns-client-resolution, fix-dns-resolution-outage]
  - id: lsa-fix-and-hunt
    title: Repair and hunt on a host
    description: Missing shared libraries, tampered packages and privilege-escalation paths.
    level: intermediate
    labs: [fix-missing-shared-lib, rpm-verify-tampered, hunt-escalation-paths]
  - id: lsa-systemd
    title: Services with systemd
    description: Service lifecycle, unit authoring, drop-ins, the journal, broken units and timers on real VMs.
    level: intermediate
    labs: [systemd-service-lifecycle, unit-author-delay-feed, dropin-override-memory, journal-trace-crash, fix-failing-service-unit, timer-replaces-cron]
  - id: lsa-storage
    title: Disks, LVM and swap
    description: Partitions, logical volumes grown online, mounts by UUID and swap planning on VMs with spare disks.
    level: intermediate
    labs: [partition-new-data-disk, lvm-create-ledger-volume, lvm-extend-online, fstab-mount-by-uuid, swap-file-planning-host]
  - id: lsa-mac
    title: SELinux and AppArmor
    description: Modes, file contexts, port labels and booleans on Enterprise Linux; confining an agent with AppArmor on Ubuntu.
    level: intermediate
    labs: [selinux-modes-contexts, selinux-port-boolean, apparmor-confine-agent]
  - id: lsv-packages-docs
    title: Manuals, packages and Python environments
    description: Offline manuals, installing from the local mirror, signed third-party repositories, version pinning, dnf repositories and a virtual environment.
    level: beginner
    labs: [help-pages-offline, packages-install-from-mirror, package-repo-pinning, dnf-local-repo, python-venv-fleet-report]
  - id: lsv-access-integrity
    title: Access, keys, integrity and logs
    description: ACLs, setgid directories, ssh key permissions, GPG signatures, file-integrity baselines, log rotation and filesystems on image files.
    level: intermediate
    labs: [acl-timetable-review, setgid-shared-planning, fix-ssh-key-perms, gpg-sign-timetable, aide-integrity-baseline, logrotate-ticket-logs, fs-on-image-files]
  - id: lsv-troubleshooting
    title: Troubleshooting silent failures
    description: A cron job that fails without a word, a tool traced with strace, and full disks that df and du explain differently - deleted-but-open files, exhausted inodes - plus a port taken by a stray service.
    level: intermediate
    labs: [fix-cron-silent-failure, strace-config-not-found, disk-full-deleted-open, inode-exhaustion-spool, fix-port-conflict]
  - id: lsv-tls-servers
    title: Certificates and network services
    description: Issuing and renewing certificates, Apache virtual hosts, nginx and HAProxy in front of apps, BIND, Unbound, Postfix and PostgreSQL backups.
    level: intermediate
    labs: [tls-cert-ticket-portal, fix-expired-cert, apache-vhosts-tls, nginx-reverse-proxy-pis, haproxy-ticket-backends, bind-authoritative-zone, unbound-caching-forwarder, postfix-relay-alerts, postgres-backup-restore]
  - id: lsn-netns-routing
    title: Namespaces, routes and captures
    description: Build network namespaces with veth pairs and NAT, plan subnets, route between two depot networks, capture lost heartbeats, fix asymmetric replies with policy routing, switch VLANs on a Linux bridge, find a tunnel MTU mismatch and shape a link with netem.
    level: intermediate
    labs: [veth-netns-plumbing, subnet-plan-depots, runtime-routes-two-sites, tcpdump-lost-heartbeats, fix-routing-asymmetric, bridge-vlan-namespaces, mtu-mismatch-tunnel, netem-impaired-link, iperf-throughput-baseline]
  - id: lsn-firewalls
    title: Firewalls and NAT on gateways
    description: Write an nftables ruleset from scratch, NAT and redirect with nftables, restrict a service to a subnet with firewalld, repair a hardening rule that blocks an app and separate networks with firewalld zones.
    level: intermediate
    labs: [nftables-from-scratch, nat-port-redirect-gateway, firewall-ticket-api, fix-firewall-blocks-app, firewalld-zones-el]
  - id: lsn-persistent-net
    title: Persistent interfaces, bonds and time
    description: Persist addresses and bonds with Netplan and NetworkManager, bond two links with failover, set the clock source and zone, serve time to an isolated network, join two depots with WireGuard in systemd-networkd and serve DHCP with dnsmasq.
    level: intermediate
    labs: [static-ip-persistent, nmcli-bond-el, bond-active-backup, chrony-timezone-depot, chrony-server-isolated, wireguard-depot-tunnel, dhcp-server-depot]
  - id: lsa-running-system
    title: "Running systems: processes, tuning and devices"
    description: Inventory hardware, name devices with udev, persist kernel parameters, tame runaway processes, tune a host, keep the journal and schedule jobs on VMs.
    level: intermediate
    labs: [hardware-inventory-report, udev-stable-device-name, sysctl-persistent-forwarding, kill-heavy-process-el, tuned-profile-batch, journal-persistent-el, at-and-cron-el]
  - id: lsa-storage-advanced
    title: Filesystems, LVM, RAID and encryption
    description: Mixed partition tables, several filesystem types, repair, snapshots, moving data between disks, mirrors, LUKS, quotas and I/O contention on VMs with spare disks.
    level: advanced
    labs: [lvm-mbr-gpt-mixed, vfat-xfs-ext4-mounts, fsck-repair-ext4, quotas-crew-homes, lvm-snapshot-backup, pvmove-replace-disk, raid1-degrade-rebuild, luks-encrypt-archive, io-latency-hunt]
  - id: lsa-network-storage
    title: Network storage and file services
    description: Export and mount NFS, mount homes on demand, keep boots fast when a share is slow, back up with rsync and a timer, attach iSCSI volumes and share a folder over SMB.
    level: advanced
    labs: [nfs-server-exports, nfs-mount-el, nfs-autofs-home, fix-boot-mount-network, rsync-backup-timer, iscsi-attach-volume, samba-share-office]
  - id: lsb-boot-recovery
    title: Boot, kernel and recovery
    description: Default targets and kernel arguments with grubby, modules with options, a boot that waits on a missing device, and the end state of console recovery - root password, fstab in emergency mode and an initramfs without the storage driver.
    level: intermediate
    labs: [boot-target-default, grub-kernel-args, kernel-module-blacklist, boot-slow-analysis, recover-root-password, recover-broken-fstab, kernel-panic-initramfs]
  - id: lsb-provision-identity
    title: Provisioning, SSH hardening and directory login
    description: Apply cloud-init user-data from a NoCloud seed, harden sshd and ban repeated failures, and sign crew members in from an LDAP directory with SSSD.
    level: intermediate
    labs: [cloud-init-new-depot-host, ssh-hardening-fail2ban, ldap-login-crew]
  - id: lsb-virt-software
    title: Virtual machines and desktop software
    description: Define and snapshot a libvirt guest, prepare a VM as a golden template and install a desktop application from a local Flatpak remote.
    level: intermediate
    labs: [libvirt-test-vm, libvirt-golden-template, flatpak-remote-install]
  - id: lsb-capstones
    title: Mixed review and incident capstones
    description: Stand up a depot server end to end with repositories, users, LVM, a web service, firewalld and SELinux, then restore ticket sales after three unrelated overnight faults.
    level: advanced
    labs: [el-mock-scenario-depot, incident-capstone-ticketing]
  - id: lsi-internals
    title: Containers from the inside
    description: Namespaces, cgroup v2 limits, systemd slices, overlay layers, capabilities and seccomp, and telling a container from a VM, built by hand on VMs.
    level: intermediate
    labs: [linux-namespaces-unshare, linux-cgroup-v2-limits, systemd-run-slices, linux-overlayfs-by-hand, capabilities-drop-service, am-i-in-a-container]
  - id: lsi-containers
    title: Containers as host services
    description: Run a container with Podman and persistent data, then as a rootless Quadlet service that starts at boot.
    level: intermediate
    labs: [podman-run-timetable-api, quadlet-container-service]
  - id: lsp-performance
    title: Performance and capacity
    description: The USE method, OOM investigations, pressure stall information, CPU profiling and syscall tracing on slow hosts.
    level: advanced
    labs: [use-method-slow-host, oom-kill-investigation, psi-pressure-alert, perf-cpu-flamegraph, bpftrace-who-opens]
  - id: lso-observability
    title: Host metrics and central logs
    description: Export host and custom metrics for Prometheus with an alert rule, and forward authentication logs to a central rsyslog server.
    level: intermediate
    labs: [node-exporter-alert, rsyslog-forward-central]
  - id: lss-hardening
    title: Host hardening and compliance
    description: SELinux denials, PAM password policy and lockout, audit rules, kernel hardening, attack-surface cleanup, unit sandboxing, an intrusion sweep and an OpenSCAP scan.
    level: advanced
    labs: [selinux-denial-diagnose, pam-pwquality-faillock, auditd-watch-identity, kernel-hardening-sysctls, attack-surface-cleanup, unit-sandboxing-score, intrusion-persistence-sweep, openscap-scan-remediate]
