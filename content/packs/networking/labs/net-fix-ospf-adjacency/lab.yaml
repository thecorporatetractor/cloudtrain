apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-fix-ospf-adjacency
  title: Bring two stuck OSPF neighbours to Full
  domain: networking
  frameworks: [ccna:ip-connectivity]
  difficulty: medium
  estimatedMinutes: 20
  tags: [ospf, troubleshooting, mtu, hello-interval]
  version: 1
spec:
  description: |
    `mv-campus-east` never reaches Full with `mv-core-1` on their link
    (`mv-campus-east:eth1` - `mv-core-1:eth1`, 10.{{octet}}.0.0/30), so the east
    campus LAN `10.{{octet}}.{{east}}.0/24` is missing from the core's routing
    table. Both routers run OSPF area 0 (FRR consoles).

    There are two problems on `mv-campus-east`:

    - an OSPF timer differs from the core and from the district standard
      (FRR defaults: hello 10 s, dead 40 s);
    - the carrier configured the east end of the link with a smaller MTU
      (1300 bytes), which you cannot change from the router CLI.

    Fix both on `mv-campus-east` only (do not change `mv-core-1`), so the
    adjacency reaches Full and `mv-core-1` learns the east campus LAN through OSPF.
  objectives:
    - Read OSPF neighbour states and interface parameters
    - Recognise hello/dead mismatches and MTU mismatches (stuck in ExStart/Exchange)
    - Fix the mismatches and verify the learned route
  params:
    octet:
      type: int
      min: 20
      max: 90
    east:
      type: int
      min: 50
      max: 59
    hello:
      type: choice
      values: [5, 15, 30]
  topology:
    entry: workstation
    nodes:
      - { name: workstation, driver: container, image: jumphost:1, access: [shell] }
      - { name: mv-core-1, driver: netdev, image: frr:10, access: [console] }
      - { name: mv-campus-east, driver: netdev, image: frr:10, access: [console] }
      - { name: east-host, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: core-host, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
    links:
      - { a: "mv-campus-east:eth1", b: "mv-core-1:eth1" }
      - { a: "mv-campus-east:eth2", b: "east-host:eth1" }
      - { a: "mv-core-1:eth2", b: "core-host:eth1" }
  setup:
    - on: mv-campus-east
      run: ip link set eth1 mtu 1300
    - on: mv-core-1
      config: |
        interface lo
         ip address 10.255.{{octet}}.1/32
         ip ospf area 0
        interface eth1
         ip address 10.{{octet}}.0.1/30
         ip ospf area 0
        interface eth2
         ip address 10.{{octet}}.1.1/24
         ip ospf area 0
         ip ospf passive
        router ospf
         ospf router-id 10.255.{{octet}}.1
    - on: mv-campus-east
      config: |
        interface lo
         ip address 10.255.{{octet}}.5/32
         ip ospf area 0
        interface eth1
         ip address 10.{{octet}}.0.2/30
         ip ospf area 0
         ip ospf hello-interval {{hello}}
        interface eth2
         ip address 10.{{octet}}.{{east}}.1/24
         ip ospf area 0
         ip ospf passive
        router ospf
         ospf router-id 10.255.{{octet}}.5
    - { on: east-host, run: "ip addr replace 10.{{octet}}.{{east}}.10/24 dev eth1 && ip route replace default via 10.{{octet}}.{{east}}.1" }
    - { on: core-host, run: "ip addr replace 10.{{octet}}.1.10/24 dev eth1 && ip route replace default via 10.{{octet}}.1.1" }
  checks:
    - id: adjacency-full
      description: mv-core-1 has a Full adjacency with mv-campus-east
      type: shell
      on: mv-core-1
      command: |
        for i in $(seq 90); do vtysh -c 'show ip ospf neighbor' | grep -q '^10.255.{{octet}}.5 .*Full' && exit 0; sleep 1; done; exit 1
      timeoutSec: 100
      skills: [net.routing.ospf]
      weight: 2
    - id: timers-standard
      description: mv-campus-east uses the standard hello and dead intervals on eth1
      type: shell
      on: mv-campus-east
      command: vtysh -c 'show ip ospf interface eth1' | grep -c 'Hello 10s, Dead 40s'
      expect: { match: exact, value: "1" }
      skills: [net.routing.ospf]
    - id: mtu-resolved
      description: The MTU mismatch no longer blocks the database exchange (matching MTU or MTU check disabled on east)
      type: shell
      on: mv-campus-east
      command: |
        [ "$(cat /sys/class/net/eth1/mtu)" -ge 1400 ] && exit 0
        vtysh -c 'show running-config' | grep -q 'ip ospf mtu-ignore'
      skills: [net.troubleshooting.mtu]
    - id: east-lan-learned
      description: mv-core-1 learns the east campus LAN through OSPF and core-host reaches east-host
      type: shell
      on: core-host
      command: |
        for i in $(seq 90); do ping -c1 -W1 10.{{octet}}.{{east}}.10 >/dev/null 2>&1 && { echo ok; exit 0; }; sleep 1; done; echo lost
      expect: { match: exact, value: ok }
      timeoutSec: 110
      skills: [net.routing.ospf]
    - id: core-unchanged
      description: mv-core-1's OSPF interface settings were not changed
      type: shell
      on: mv-core-1
      command: vtysh -c 'show running-config' | grep -cE 'hello-interval|dead-interval|mtu-ignore'
      expect: { match: exact, value: "0" }
      skills: [net.troubleshooting.methodology]
      weight: 0.5
  hints:
    - title: No neighbour at all?
      body: Routers only become neighbours when hello and dead intervals match. Compare `show ip ospf interface eth1` on both routers.
      cost: 1
    - title: Stuck in ExStart
      body: If the neighbour appears but never leaves ExStart/Exchange, the database description packets are rejected because the interface MTUs differ.
      command: "show ip ospf neighbor"
      cost: 1
    - title: The FRR knobs
      body: "Under `interface eth1`: `no ip ospf hello-interval` restores the default; `ip ospf mtu-ignore` makes OSPF ignore the MTU in database descriptions when the MTU itself cannot be changed."
      cost: 2
  misconceptions:
    - id: timers-only
      description: Fixes the hello interval but not the MTU mismatch
      mutation:
        on: mv-campus-east
        config: |
          interface eth1
           no ip ospf hello-interval
      expectFail: [adjacency-full, mtu-resolved, east-lan-learned]
      feedback: The routers now see each other but stay stuck in ExStart because the MTUs differ.
    - id: fix-on-core
      description: Changes the hello interval on the core to match the east router
      mutation:
        on: mv-core-1
        config: |
          interface eth1
           ip ospf hello-interval {{hello}}
           ip ospf mtu-ignore
      expectFail: [core-unchanged, timers-standard]
      feedback: The fault is on mv-campus-east; changing the core breaks the district standard and every other neighbour on that interface.
  solution:
    explanation: |
      The east router's hello interval differs, so no neighbour forms. With the
      timer restored, the routers get stuck in ExStart because east's eth1 MTU is
      1300; `ip ospf mtu-ignore` on east lets the database exchange complete.
    steps:
      - on: mv-campus-east
        config: |
          interface eth1
           no ip ospf hello-interval
           ip ospf mtu-ignore
      - on: mv-core-1
        run: |
          for i in $(seq 100); do vtysh -c 'show ip route ospf' | grep -q '10.{{octet}}.{{east}}.0/24' && exit 0; sleep 1; done; exit 1
        timeoutSec: 120
