apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-fix-unreachable-campus
  title: Find where traffic to the east campus stops
  domain: networking
  frameworks: [ccna:ip-connectivity]
  difficulty: medium
  estimatedMinutes: 20
  tags: [troubleshooting, traceroute, static-routing]
  version: 1
spec:
  description: |
    Staff on the district office LAN (`10.{{octet}}.1.0/24`) cannot reach the east
    campus LAN (`10.{{octet}}.{{east}}.0/24`). The path is
    `office-host` -> `mv-core-1` -> `mv-dist-1` -> `mv-campus-east` -> `east-host`,
    all routed statically (FRR consoles on the routers).

    1. Use ping, traceroute and the routing tables to find the router whose
       routing is wrong.
    2. Fix it on that router only, with static routing, so `office-host` and
       `east-host` reach each other.
    3. Write the name of the router you fixed to `/home/learner/fault.txt` on your
       workstation, as a single line such as `faulty_router: mv-example-1`.
  objectives:
    - Work through the path hop by hop with traceroute and ping
    - Check both the forward and the return route
    - Fix the fault at its source and record it
  params:
    octet:
      type: int
      min: 20
      max: 90
    east:
      type: int
      min: 50
      max: 59
    typo:
      type: choice
      values: [2, 11, 101]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: office-host
        driver: container
        image: nettools:1
        resources: { cpu: 0.25, memoryMiB: 96 }
        access: [shell]
      - name: mv-core-1
        driver: netdev
        image: frr:10
        access: [console]
      - name: mv-dist-1
        driver: netdev
        image: frr:10
        access: [console]
      - name: mv-campus-east
        driver: netdev
        image: frr:10
        access: [console]
      - name: east-host
        driver: container
        image: nettools:1
        resources: { cpu: 0.25, memoryMiB: 96 }
        access: [shell]
    links:
      - { a: "office-host:eth1", b: "mv-core-1:eth1" }
      - { a: "mv-core-1:eth2", b: "mv-dist-1:eth1" }
      - { a: "mv-dist-1:eth2", b: "mv-campus-east:eth1" }
      - { a: "mv-campus-east:eth2", b: "east-host:eth1" }
  setup:
    - on: mv-core-1
      config: |
        interface eth1
         ip address 10.{{octet}}.1.1/24
        interface eth2
         ip address 10.{{octet}}.0.1/30
        ip route 10.{{octet}}.{{east}}.0/24 10.{{octet}}.0.2
        ip route 10.{{octet}}.0.4/30 10.{{octet}}.0.2
    - on: mv-dist-1
      config: |
        interface eth1
         ip address 10.{{octet}}.0.2/30
        interface eth2
         ip address 10.{{octet}}.0.5/30
        ip route 10.{{octet}}.1.0/24 10.{{octet}}.0.1
        ip route 10.{{octet}}.{{east}}.0/24 10.{{octet}}.0.6
    - on: mv-campus-east
      config: |
        interface eth1
         ip address 10.{{octet}}.0.6/30
        interface eth2
         ip address 10.{{octet}}.{{east}}.1/24
        ip route 10.{{octet}}.0.0/30 10.{{octet}}.0.5
        ip route 10.{{octet}}.{{typo}}.0/24 10.{{octet}}.0.5
    - on: office-host
      run: ip addr replace 10.{{octet}}.1.10/24 dev eth1 && ip route replace default via 10.{{octet}}.1.1
    - on: east-host
      run: ip addr replace 10.{{octet}}.{{east}}.10/24 dev eth1 && ip route replace default via 10.{{octet}}.{{east}}.1
  checks:
    - id: office-to-east
      description: office-host reaches east-host
      type: reachability
      on: office-host
      target: 10.{{octet}}.{{east}}.10
      skills: [net.routing.static]
      weight: 2
    - id: east-to-office
      description: east-host reaches office-host
      type: reachability
      on: east-host
      target: 10.{{octet}}.1.10
      skills: [net.routing.static]
    - id: fault-recorded
      description: The fault file names the router whose routing was wrong
      type: shell
      on: workstation
      command: tr -d ' \r' < /home/learner/fault.txt | tr A-Z a-z
      expect: { match: exact, value: "faulty_router:mv-campus-east" }
      skills: [net.troubleshooting.methodology]
      weight: 2
    - id: others-unchanged
      description: The fix was made on the faulty router only (mv-dist-1 routes unchanged)
      type: shell
      on: mv-dist-1
      command: vtysh -c 'show running-config' | grep -E '^ip route' | sort | tr '\n' ';'
      expect: { match: exact, value: "ip route 10.{{octet}}.1.0/24 10.{{octet}}.0.1;ip route 10.{{octet}}.{{east}}.0/24 10.{{octet}}.0.6;" }
      skills: [net.troubleshooting.methodology]
      weight: 0.5
  hints:
    - title: Forward or return?
      body: Traceroute from office-host shows how far the forward path goes. A trace that dies right after a router can mean the next router never got the packet, or that its reply has no way back.
      command: "traceroute -n 10.{{octet}}.{{east}}.10"
      cost: 1
    - title: Ask each router about the office LAN
      body: On every router on the path run `show ip route 10.{{octet}}.1.10`. The router that has no route back to the office LAN cannot answer, even though the forward path works.
      cost: 2
    - title: Look closely at existing routes
      body: A route can exist and still be wrong; compare its prefix with the office LAN character by character.
      cost: 2
  misconceptions:
    - id: blame-last-responder
      description: Records the last router that answered traceroute instead of the one whose return route is wrong
      mutation:
        on: workstation
        run: |
          echo 'faulty_router: mv-dist-1' > /home/learner/fault.txt
      expectFail: [fault-recorded]
      feedback: The last router that answered traceroute is not the faulty one; the router after it received the packets but had no route back, so it could not reply.
    - id: patch-the-core
      description: Adds more routes on mv-dist-1 instead of fixing the far router
      mutation:
        on: mv-dist-1
        config: |
          ip route 10.{{octet}}.{{typo}}.0/24 10.{{octet}}.0.1
      expectFail: [office-to-east, east-to-office, others-unchanged]
      feedback: The forward path already worked; the replies from the east campus have no route back, and only mv-campus-east can fix that.
  solution:
    explanation: |
      Traceroute from the office shows replies up to mv-dist-1 and then silence.
      mv-campus-east receives the packets, but its route back points at the
      wrong prefix (10.{{octet}}.{{typo}}.0/24 instead of 10.{{octet}}.1.0/24), so it
      cannot answer the office. Add the correct return route on mv-campus-east.
    steps:
      - on: mv-campus-east
        config: |
          no ip route 10.{{octet}}.{{typo}}.0/24 10.{{octet}}.0.5
          ip route 10.{{octet}}.1.0/24 10.{{octet}}.0.5
      - on: workstation
        run: |
          echo 'faulty_router: mv-campus-east' > /home/learner/fault.txt
    alternatives:
      - id: east-default-route
        description: Give mv-campus-east a default route to mv-dist-1
        steps:
          - on: mv-campus-east
            config: |
              ip route 0.0.0.0/0 10.{{octet}}.0.5
          - on: workstation
            run: |
              echo 'faulty_router:  mv-campus-east' > /home/learner/fault.txt
