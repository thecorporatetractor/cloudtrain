apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-snmpv3-polling
  title: Poll interface counters with SNMPv3 only
  domain: networking
  frameworks: [ccna:ip-services, ccna:security-fundamentals]
  difficulty: medium
  estimatedMinutes: 20
  tags: [snmp, snmpv3, monitoring, net-snmp]
  version: 1
spec:
  description: |
    The edge router `mv-edge-1` (Linux, shell) runs net-snmp's `snmpd`
    (`/etc/snmp/snmpd.conf`, restart with `snmpd-restart`) and still answers
    SNMPv1/v2c with the community `public`. The monitoring host `mon-dc`
    (10.{{octet}}.99.20, shell) polls it at 10.{{octet}}.99.1.

    1. On `mv-edge-1`, add an SNMPv3 user **`nms{{octet}}`** with authentication
       (SHA, passphrase in `/root/snmp-auth.txt`) and privacy (AES, passphrase in
       `/root/snmp-priv.txt`), read-only, required to use authPriv. Both files
       exist on `mv-edge-1` and `mon-dc`.
    2. Remove all SNMPv1/v2c access.
    3. From `mon-dc`, poll the 64-bit inbound octet counter (IF-MIB
       `ifHCInOctets`) of the edge's uplink interface `eth2` with that user and
       write the number alone to `/root/uplink-in-octets.txt`.
  objectives:
    - Create an SNMPv3 user with authentication and privacy
    - Disable community-based SNMP
    - Poll an interface counter by name and index
  params:
    octet:
      type: int
      min: 20
      max: 90
    secret:
      type: choice
      values: [heron, alder, quarry, lantern]
  topology:
    entry: workstation
    nodes:
      - { name: workstation, driver: container, image: jumphost:1, access: [shell] }
      - { name: mv-edge-1, driver: container, image: netsvc:1, resources: { cpu: 0.25, memoryMiB: 128 }, access: [shell] }
      - { name: mon-dc, driver: container, image: netsvc:1, resources: { cpu: 0.2, memoryMiB: 96 }, access: [shell] }
      - { name: regional-gw, driver: netdev, image: frr:10 }
    links:
      - { a: "mv-edge-1:eth1", b: "mon-dc:eth1" }
      - { a: "mv-edge-1:eth2", b: "regional-gw:eth1" }
  setup:
    - on: regional-gw
      config: |
        interface eth1
         ip address 203.0.113.1/24
    - on: mv-edge-1
      run: |
        printf 'auth-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-auth.txt
        printf 'priv-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-priv.txt
        chmod 600 /root/snmp-auth.txt /root/snmp-priv.txt
        ip addr replace 10.{{octet}}.99.1/24 dev eth1
        ip addr replace 203.0.113.{{octet}}/24 dev eth2
        mkdir -p /var/lib/net-snmp
        cat > /etc/snmp/snmpd.conf <<'EOC'
        sysName mv-edge-1
        sysLocation Marlow Valley data centre
        rocommunity public default
        EOC
        cat > /usr/local/bin/snmpd-restart <<'EOS'
        #!/bin/sh
        pkill -x snmpd; sleep 1
        snmpd -Lsd -p /run/snmpd.pid -c /etc/snmp/snmpd.conf </dev/null >/dev/null 2>&1
        EOS
        chmod +x /usr/local/bin/snmpd-restart; snmpd-restart
        setsid sh -c 'while :; do ping -c 5 -i 0.2 -s 1000 203.0.113.1 >/dev/null 2>&1; sleep 2; done' </dev/null >/dev/null 2>&1 &
    - on: mon-dc
      run: |
        ip addr replace 10.{{octet}}.99.20/24 dev eth1
        printf 'auth-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-auth.txt
        printf 'priv-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-priv.txt
        chmod 600 /root/snmp-auth.txt /root/snmp-priv.txt
  checks:
    - id: v3-authpriv
      description: mon-dc reads sysName with the SNMPv3 user at authPriv
      type: shell
      on: mon-dc
      command: snmpget -v3 -l authPriv -u nms{{octet}} -a SHA -A "$(cat /root/snmp-auth.txt)" -x AES -X "$(cat /root/snmp-priv.txt)" -On -Oqv -t 2 -r 1 10.{{octet}}.99.1 .1.3.6.1.2.1.1.5.0
      expect: { match: exact, value: "mv-edge-1" }
      timeoutSec: 10
      skills: [net.services.snmp]
      weight: 2
    - id: v3-requires-priv
      description: The same user is refused without privacy (authNoPriv)
      type: shell
      on: mon-dc
      command: snmpget -v3 -l authNoPriv -u nms{{octet}} -a SHA -A "$(cat /root/snmp-auth.txt)" -On -Oqv -t 2 -r 0 10.{{octet}}.99.1 .1.3.6.1.2.1.1.5.0 >/dev/null 2>&1 && echo answered || echo refused
      expect: { match: exact, value: refused }
      timeoutSec: 10
      skills: [net.services.snmp]
    - id: no-community
      description: SNMPv1 and v2c with the old community get no answer
      type: shell
      on: mon-dc
      command: |
        for v in 1 2c; do snmpget -v$v -c public -t 1 -r 0 10.{{octet}}.99.1 .1.3.6.1.2.1.1.5.0 >/dev/null 2>&1 && { echo answered; exit 0; }; done; echo silent
      expect: { match: exact, value: silent }
      timeoutSec: 10
      skills: [net.services.snmp, net.security.device-hardening]
      weight: 2
    - id: counter-recorded
      description: The recorded value is eth2's ifHCInOctets at poll time
      type: shell
      on: mon-dc
      command: |
        a="-v3 -l authPriv -u nms{{octet}} -a SHA -A $(cat /root/snmp-auth.txt) -x AES -X $(cat /root/snmp-priv.txt) -t 2 -r 1 10.{{octet}}.99.1"
        idx=$(snmpwalk -On $a .1.3.6.1.2.1.2.2.1.2 2>/dev/null | grep -w eth2 | sed 's/^.*\.\([0-9]*\) = .*$/\1/' | head -1)
        now=$(snmpget -Oqv $a .1.3.6.1.2.1.31.1.1.1.6.$idx 2>/dev/null)
        got=$(tr -d ' \n' < /root/uplink-in-octets.txt)
        case "$got" in ''|*[!0-9]*) echo bad; exit 0;; esac
        [ "$got" -gt 0 ] && [ "$got" -le "$now" ] && [ $((now - got)) -lt 50000000 ] && echo ok || echo "bad $got $now"
      expect: { match: exact, value: ok }
      timeoutSec: 20
      skills: [net.services.snmp]
  hints:
    - title: Creating the user
      body: "Stop snmpd, then add the user with `net-snmp-create-v3-user -ro -a SHA -A <auth> -x AES -X <priv> <name>`; it writes a createUser line that snmpd turns into a localised key on start, and adds an `rouser` line without `priv` (in /usr/share/snmp/snmpd.conf, which snmpd also reads): remove or fix that line, and add `rouser <name> priv` yourself. The passphrases are in /root/snmp-auth.txt and /root/snmp-priv.txt."
      cost: 2
    - title: Enforcing privacy
      body: "`rouser <name> priv` makes the user readable only at authPriv."
      cost: 1
    - title: Finding the counter
      body: Walk ifDescr (.1.3.6.1.2.1.2.2.1.2) to find eth2's ifIndex, then get ifHCInOctets (.1.3.6.1.2.1.31.1.1.1.6.<index>).
      cost: 1
  misconceptions:
    - id: keep-community
      description: Adds the v3 user but leaves the public community in place
      mutation:
        on: mv-edge-1
        run: |
          pkill -x snmpd; sleep 1
          mkdir -p /var/lib/net-snmp
          echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
          echo 'rouser nms{{octet}} priv' >> /etc/snmp/snmpd.conf
          snmpd-restart
      expectFail: [no-community]
      feedback: SNMPv1/v2c sends the community in clear text; it must be removed, not just supplemented.
    - id: auth-only
      description: Creates the user without requiring privacy
      mutation:
        on: mv-edge-1
        run: |
          pkill -x snmpd; sleep 1
          sed -i '/^rocommunity/d' /etc/snmp/snmpd.conf
          mkdir -p /var/lib/net-snmp
          echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
          echo 'rouser nms{{octet}} auth' >> /etc/snmp/snmpd.conf
          snmpd-restart
      expectFail: [v3-requires-priv]
      feedback: Without `priv` the user also works with authNoPriv, so counters cross the network unencrypted.
  solution:
    explanation: |
      Stop snmpd, remove the rocommunity line, create the user with SHA/AES and
      restrict it with `rouser <name> priv`, restart, then walk ifDescr for eth2's
      index and get ifHCInOctets from mon-dc.
    steps:
      - on: mv-edge-1
        run: |
          pkill -x snmpd; sleep 1
          sed -i '/^rocommunity/d' /etc/snmp/snmpd.conf
          mkdir -p /var/lib/net-snmp
          echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
          echo 'rouser nms{{octet}} priv' >> /etc/snmp/snmpd.conf
          snmpd-restart; sleep 2
      - on: mon-dc
        run: |
          a="-v3 -l authPriv -u nms{{octet}} -a SHA -A $(cat /root/snmp-auth.txt) -x AES -X $(cat /root/snmp-priv.txt) 10.{{octet}}.99.1"
          idx=$(snmpwalk -On $a .1.3.6.1.2.1.2.2.1.2 | grep -w eth2 | sed 's/^.*\.\([0-9]*\) = .*$/\1/' | head -1)
          snmpget -Oqv $a .1.3.6.1.2.1.31.1.1.1.6.$idx > /root/uplink-in-octets.txt
          cat /root/uplink-in-octets.txt
    alternatives:
      - id: create-user-script
        description: Create the user with net-snmp-create-v3-user
        steps:
          - on: mv-edge-1
            run: |
              pkill -x snmpd; sleep 1
              sed -i '/^rocommunity/d' /etc/snmp/snmpd.conf
              net-snmp-create-v3-user -ro -a SHA -A "$(cat /root/snmp-auth.txt)" -x AES -X "$(cat /root/snmp-priv.txt)" nms{{octet}} >/dev/null
              sed -i 's/^rouser nms{{octet}}.*/rouser nms{{octet}} priv/' /etc/snmp/snmpd.conf /var/lib/net-snmp/snmpd.conf 2>/dev/null
              sed -i '/^rouser nms{{octet}}/d' /usr/share/snmp/snmpd.conf 2>/dev/null
              grep -q '^rouser nms{{octet}} priv' /etc/snmp/snmpd.conf || echo 'rouser nms{{octet}} priv' >> /etc/snmp/snmpd.conf
              snmpd-restart; sleep 1
          - on: mon-dc
            run: |
              a="-v3 -l authPriv -u nms{{octet}} -a SHA -A $(cat /root/snmp-auth.txt) -x AES -X $(cat /root/snmp-priv.txt) 10.{{octet}}.99.1"
              idx=$(snmpwalk -On $a .1.3.6.1.2.1.2.2.1.2 | grep -w eth2 | sed 's/^.*\.\([0-9]*\) = .*$/\1/' | head -1)
              snmpget -Oqv $a .1.3.6.1.2.1.31.1.1.1.6.$idx > /root/uplink-in-octets.txt
              cat /root/uplink-in-octets.txt
