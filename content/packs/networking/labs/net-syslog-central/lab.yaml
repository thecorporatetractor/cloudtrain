apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-syslog-central
  title: Send router logs to the district syslog server
  domain: networking
  frameworks: [ccna:ip-services]
  difficulty: easy
  estimatedMinutes: 15
  tags: [syslog, rsyslog, logging, severity]
  version: 1
spec:
  description: |
    The campus routers `mv-campus-north`, `mv-campus-south` and `mv-campus-east`
    are Linux routers (shell) running rsyslog; their link monitor logs interface
    changes at severity `warning`. The central syslog server `syslog-dc`
    (10.{{octet}}.200.14, Linux, shell, rsyslog) is reachable through
    `mv-core-1`.

    1. On `syslog-dc`, receive syslog over UDP and TCP port 514 and write each
       sender's messages to its own file, `/var/log/remote/<hostname>.log`
       (the routers send their names, e.g. `mv-campus-east`).
    2. On each campus router, forward messages of severity **warning and above**
       (and only those) to `syslog-dc`.

    Each rsyslog reads `/etc/rsyslog.d/*.conf`; restart it with
    `rsyslog-restart`. The grader flaps an interface on `mv-campus-east` and sends
    test messages at several severities from the routers.
  objectives:
    - Configure a central syslog receiver with one file per sender
    - Forward logs with a severity filter
    - Prove an event on a router arrives centrally
  params:
    octet:
      type: int
      min: 20
      max: 90
    tag:
      type: choice
      values: [bell, lamp, reed, tarn]
  topology:
    entry: workstation
    nodes:
      - { name: workstation, driver: container, image: jumphost:1, access: [shell] }
      - { name: mv-core-1, driver: netdev, image: frr:10, access: [console] }
      - { name: syslog-dc, driver: container, image: netsvc:1, resources: { cpu: 0.2, memoryMiB: 96 }, access: [shell] }
      - { name: mv-campus-north, driver: container, image: netsvc:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: mv-campus-south, driver: container, image: netsvc:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: mv-campus-east, driver: container, image: netsvc:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
    links:
      - { a: "mv-core-1:eth1", b: "syslog-dc:eth1" }
      - { a: "mv-core-1:eth2", b: "mv-campus-north:eth1" }
      - { a: "mv-core-1:eth3", b: "mv-campus-south:eth1" }
      - { a: "mv-core-1:eth4", b: "mv-campus-east:eth1" }
  setup:
    - on: mv-core-1
      config: |
        interface eth1
         ip address 10.{{octet}}.200.1/24
        interface eth2
         ip address 10.{{octet}}.0.1/30
        interface eth3
         ip address 10.{{octet}}.0.5/30
        interface eth4
         ip address 10.{{octet}}.0.9/30
    - on: syslog-dc
      run: &rs |
        case $(hostname) in
          *syslog-dc*) N=syslog-dc; ip addr replace 10.{{octet}}.200.14/24 dev eth1; ip route replace default via 10.{{octet}}.200.1 ;;
          *north*) N=mv-campus-north; ip addr replace 10.{{octet}}.0.2/30 dev eth1; ip route replace default via 10.{{octet}}.0.1 ;;
          *south*) N=mv-campus-south; ip addr replace 10.{{octet}}.0.6/30 dev eth1; ip route replace default via 10.{{octet}}.0.5 ;;
          *east*)  N=mv-campus-east;  ip addr replace 10.{{octet}}.0.10/30 dev eth1; ip route replace default via 10.{{octet}}.0.9 ;;
        esac
        mkdir -p /etc/rsyslog.d /var/lib/rsyslog
        cat > /etc/rsyslog.conf <<EOC
        global(localHostname="$N" workDirectory="/var/lib/rsyslog")
        module(load="imuxsock")
        include(file="/etc/rsyslog.d/*.conf" mode="optional")
        *.* /var/log/messages
        EOC
        cat > /usr/local/bin/rsyslog-restart <<'EOS'
        #!/bin/sh
        pkill -x rsyslogd; sleep 1; rm -f /var/run/rsyslogd.pid
        rsyslogd -f /etc/rsyslog.conf
        EOS
        chmod +x /usr/local/bin/rsyslog-restart
        rsyslog-restart
        case $N in mv-campus-*)
          ip link add lan0 type dummy 2>/dev/null; ip link set lan0 up
          setsid sh -c 'ip monitor link | while read -r l; do logger -p daemon.warning -t linkmon "$l"; done' </dev/null >/dev/null 2>&1 & ;;
        esac
    - { on: mv-campus-north, run: *rs }
    - { on: mv-campus-south, run: *rs }
    - { on: mv-campus-east, run: *rs }
  checks:
    - id: flap-east
      description: (event) the grader flaps lan0 on mv-campus-east
      type: shell
      on: mv-campus-east
      command: ip link set lan0 down; sleep 1; ip link set lan0 up; sleep 2; echo flapped
      expect: { match: exact, value: flapped }
      skills: [net.services.syslog]
      weight: 0
    - id: test-messages
      description: (event) each campus router logs one info and one error test message
      type: shell
      on: mv-campus-north
      command: logger -p user.info -t gradertest "info-{{tag}}{{octet}}-north"; logger -p user.err -t gradertest "err-{{tag}}{{octet}}-north"; sleep 2; echo sent
      expect: { match: exact, value: sent }
      skills: [net.services.syslog]
      weight: 0
    - id: test-messages-south
      description: (event) mv-campus-south logs an error test message
      type: shell
      on: mv-campus-south
      command: logger -p user.err -t gradertest "err-{{tag}}{{octet}}-south"; sleep 2; echo sent
      expect: { match: exact, value: sent }
      skills: [net.services.syslog]
      weight: 0
    - id: flap-logged
      description: The east interface flap is in syslog-dc's file for mv-campus-east
      type: shell
      on: syslog-dc
      command: |
        for i in $(seq 20); do n=$(grep -c 'linkmon.*lan0' /var/log/remote/mv-campus-east.log 2>/dev/null); [ "${n:-0}" -ge 1 ] && break; sleep 1; done
        echo "${n:-0}"
      expect: { match: regex, value: "^[1-9][0-9]*$" }
      timeoutSec: 40
      skills: [net.services.syslog]
      weight: 2
    - id: per-router-files
      description: The north and south error messages land in their own files only
      type: shell
      on: syslog-dc
      command: |
        for i in $(seq 20); do grep -q 'err-{{tag}}{{octet}}-north' /var/log/remote/mv-campus-north.log 2>/dev/null && grep -q 'err-{{tag}}{{octet}}-south' /var/log/remote/mv-campus-south.log 2>/dev/null && break; sleep 1; done
        grep -q 'err-{{tag}}{{octet}}-north' /var/log/remote/mv-campus-north.log && grep -q 'err-{{tag}}{{octet}}-south' /var/log/remote/mv-campus-south.log || exit 1
        ! grep -q 'err-{{tag}}{{octet}}-north' /var/log/remote/mv-campus-south.log
      timeoutSec: 40
      skills: [net.services.syslog]
      weight: 2
    - id: severity-filter
      description: Messages below warning are not forwarded
      type: shell
      on: syslog-dc
      command: |
        for i in $(seq 20); do grep -rq 'err-{{tag}}{{octet}}-north' /var/log/remote/ 2>/dev/null && break; sleep 1; done
        grep -rq 'err-{{tag}}{{octet}}-north' /var/log/remote/ 2>/dev/null || { echo "no forwarded messages at all"; exit 0; }
        grep -rc 'info-{{tag}}{{octet}}-north' /var/log/remote/ | awk -F: '{s+=$2} END{print s+0}'
      expect: { match: exact, value: "0" }
      timeoutSec: 40
      skills: [net.services.syslog]
  hints:
    - title: Receiving
      body: "On syslog-dc load `imudp` and `imtcp` with port 514 and write with a dynamic file template, e.g. `template(name=\"perhost\" type=\"string\" string=\"/var/log/remote/%HOSTNAME%.log\")` and `*.* action(type=\"omfile\" dynaFile=\"perhost\")`."
      cost: 2
    - title: Forwarding with a filter
      body: "On a router, `*.warning @@10.{{octet}}.200.14:514` forwards warning and more severe messages over TCP (`@` for UDP)."
      cost: 1
  misconceptions:
    - id: server-only
      description: Configures the receiving server but no forwarding on the routers
      mutation:
        on: syslog-dc
        run: |
          printf 'module(load="imudp")\ninput(type="imudp" port="514")\nmodule(load="imtcp")\ninput(type="imtcp" port="514")\ntemplate(name="perhost" type="string" string="/var/log/remote/%%HOSTNAME%%.log")\nif $fromhost-ip != "127.0.0.1" then { action(type="omfile" dynaFile="perhost") stop }\n' > /etc/rsyslog.d/50-remote.conf
          rsyslog-restart
      expectFail: [flap-logged, per-router-files]
      feedback: The server is ready but the routers forward nothing yet; each router needs its own forwarding rule.
    - id: single-file
      description: Writes all remote messages into one shared file
      mutation:
        on: syslog-dc
        run: |
          printf 'module(load="imudp")\ninput(type="imudp" port="514")\nmodule(load="imtcp")\ninput(type="imtcp" port="514")\nif $fromhost-ip != "127.0.0.1" then { action(type="omfile" file="/var/log/remote/all.log") stop }\n' > /etc/rsyslog.d/50-remote.conf
          rsyslog-restart
      expectFail: [flap-logged, per-router-files]
      feedback: The district wants one file per router.
  solution:
    explanation: |
      syslog-dc listens on UDP and TCP 514 and writes remote messages through a
      per-host dynamic file template; each campus router forwards `*.warning`
      to it over TCP.
    steps:
      - on: syslog-dc
        run: |
          printf 'module(load="imudp")\ninput(type="imudp" port="514")\nmodule(load="imtcp")\ninput(type="imtcp" port="514")\ntemplate(name="perhost" type="string" string="/var/log/remote/%%HOSTNAME%%.log")\nif $fromhost-ip != "127.0.0.1" then { action(type="omfile" dynaFile="perhost") stop }\n' > /etc/rsyslog.d/50-remote.conf
          mkdir -p /var/log/remote; rsyslog-restart
      - { on: mv-campus-north, run: "echo '*.warning @@10.{{octet}}.200.14:514' > /etc/rsyslog.d/50-forward.conf && rsyslog-restart" }
      - { on: mv-campus-south, run: "echo '*.warning @@10.{{octet}}.200.14:514' > /etc/rsyslog.d/50-forward.conf && rsyslog-restart" }
      - { on: mv-campus-east, run: "echo '*.warning @@10.{{octet}}.200.14:514' > /etc/rsyslog.d/50-forward.conf && rsyslog-restart && sleep 2" }
