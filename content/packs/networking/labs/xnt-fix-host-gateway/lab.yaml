apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xnt-fix-host-gateway
  title: Fix a host's prefix and gateway
  domain: networking
  frameworks: [ccna:network-fundamentals]
  difficulty: easy
  estimatedMinutes: 6
  tags: [exam, ipv4, default-gateway, troubleshooting]
  version: 1
spec:
  description: |
    **Devices:** `staff-north-7` (shell), `mv-campus-north-7` (FRR console, read only for this task)

    `staff-north-7` keeps its address `10.{{octet}}.40.{{host}}` but cannot reach
    anything outside its own subnet, including the district office server
    `10.{{octet}}.200.10`. The staff LAN is a `/24` and its router is
    `mv-campus-north-7` (look up its LAN address on the router).

    Correct the host's prefix length and default gateway on `eth1` so it reaches
    the district office server. Do not change the router.
  objectives:
    - Correct a host's subnet mask and default gateway
  params:
    octet: { type: int, min: 20, max: 90 }
    host: { type: int, min: 130, max: 220 }
    gw: { type: choice, values: ["1", "62", "126", "254"] }
  topology:
    entry: workstation
    nodes:
      - { name: workstation, driver: container, image: jumphost:1, access: [shell] }
      - { name: staff-north-7, driver: container, image: nettools:1, resources: { cpu: 0.1, memoryMiB: 48 }, access: [shell] }
      - { name: mv-campus-north-7, driver: netdev, image: frr:10, access: [console] }
      - { name: office-server-7, driver: container, image: nettools:1, resources: { cpu: 0.1, memoryMiB: 48 } }
    links:
      - { a: "staff-north-7:eth1", b: "mv-campus-north-7:eth1" }
      - { a: "mv-campus-north-7:eth2", b: "office-server-7:eth1" }
  setup:
    - on: mv-campus-north-7
      config: |
        interface eth1
         ip address 10.{{octet}}.40.{{gw}}/24
        interface eth2
         ip address 10.{{octet}}.200.1/24
    - { on: office-server-7, run: "ip addr replace 10.{{octet}}.200.10/24 dev eth1 && ip route replace default via 10.{{octet}}.200.1" }
    - on: staff-north-7
      run: |
        ip addr flush dev eth1
        ip addr add 10.{{octet}}.40.{{host}}/25 dev eth1
        ip route replace default via 10.{{octet}}.40.129 dev eth1 onlink 2>/dev/null || true
  checks:
    - id: host-prefix
      description: staff-north-7 has its address with a /24 prefix and no other IPv4 address
      type: shell
      on: staff-north-7
      command: ip -4 -o addr show dev eth1 | awk '{print $4}' | tr '\n' ' '
      expect: { match: exact, value: "10.{{octet}}.40.{{host}}/24 " }
      skills: [net.addressing.ipv4-subnetting]
      weight: 2
    - id: host-gateway
      description: staff-north-7's default route points at the router's LAN address
      type: shell
      on: staff-north-7
      command: ip -4 route show default | awk '{print $3}' | tr '\n' ' '
      expect: { match: exact, value: "10.{{octet}}.40.{{gw}} " }
      skills: [net.addressing.ipv4-subnetting]
      weight: 2
    - { id: reaches-server, description: staff-north-7 reaches the district office server, type: reachability, on: staff-north-7, target: "10.{{octet}}.200.10", skills: [net.addressing.ipv4-subnetting] }
  misconceptions:
    - id: gateway-only
      description: Fixes the gateway but keeps the /25 prefix
      mutation:
        on: staff-north-7
        run: ip route replace default via 10.{{octet}}.40.{{gw}} dev eth1 onlink
      expectFail: [host-prefix]
  solution:
    explanation: |
      The LAN is a /24, so the host needs /24 (the /25 put it in a different half
      from the router), and its default gateway is the router's eth1 address
      (`show interface brief` on the router).
    steps:
      - on: staff-north-7
        run: |
          ip addr flush dev eth1
          ip addr add 10.{{octet}}.40.{{host}}/24 dev eth1
          ip route replace default via 10.{{octet}}.40.{{gw}}
