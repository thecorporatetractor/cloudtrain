apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: xnt-snmpv3-only
  title: Replace community-based SNMP with SNMPv3
  domain: networking
  frameworks: [ccna:security-fundamentals]
  difficulty: medium
  estimatedMinutes: 8
  tags: [exam, snmp, snmpv3, hardening]
  version: 1
spec:
  description: |
    **Device:** `mv-edge-25` (Linux router, shell; net-snmp `snmpd`, config `/etc/snmp/snmpd.conf`, restart with `snmpd-restart`)

    | Device | Address |
    |---|---|
    | `mv-edge-25` `eth1` (monitoring segment) | `10.{{octet}}.25.1/24` |
    | `mv-edge-25` `eth2` (other segment) | `10.{{octet}}.26.1/24` |
    | `monitor-25` `eth1` | `10.{{octet}}.25.20` |
    | `other-25` `eth1` | `10.{{octet}}.26.20` |

    `mv-edge-25` still answers SNMPv1/v2c with the community `public`. Replace that
    with SNMPv3:

    - remove all community-based (v1/v2c) access;
    - add the read-only user **`nms{{octet}}`** with authentication (SHA, passphrase
      in `/root/snmp-auth.txt`) and privacy (AES, passphrase in `/root/snmp-priv.txt`),
      required to use authPriv (both files exist on `mv-edge-25`, `monitor-25` and `other-25`);
    - SNMP must be answered **only for `monitor-25`**: `other-25` must get no answer
      from the router, even with the right user and passphrases.
  objectives:
    - Create an authPriv SNMPv3 user and remove community strings
    - Restrict SNMP to the monitoring host
  params:
    octet: { type: int, min: 20, max: 90 }
    secret: { type: choice, values: [heron, alder, quarry, lantern] }
  topology:
    entry: workstation
    nodes:
      - { name: workstation, driver: container, image: jumphost:1, access: [shell] }
      - { name: mv-edge-25, driver: container, image: netsvc:1, resources: { cpu: 0.2, memoryMiB: 96 }, access: [shell] }
      - { name: monitor-25, driver: container, image: netsvc:1, resources: { cpu: 0.1, memoryMiB: 64 } }
      - { name: other-25, driver: container, image: netsvc:1, resources: { cpu: 0.1, memoryMiB: 64 } }
    links:
      - { a: "mv-edge-25:eth1", b: "monitor-25:eth1" }
      - { a: "mv-edge-25:eth2", b: "other-25:eth1" }
  setup:
    - on: mv-edge-25
      run: |
        printf 'auth-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-auth.txt
        printf 'priv-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-priv.txt
        chmod 600 /root/snmp-auth.txt /root/snmp-priv.txt
        ip addr replace 10.{{octet}}.25.1/24 dev eth1
        ip addr replace 10.{{octet}}.26.1/24 dev eth2
        mkdir -p /var/lib/net-snmp
        cat > /etc/snmp/snmpd.conf <<'EOC'
        sysName mv-edge-25
        sysLocation Marlow Valley data centre
        rocommunity public default
        EOC
        cat > /usr/local/bin/snmpd-restart <<'EOS'
        #!/bin/sh
        pkill -x snmpd; sleep 1
        snmpd -Lsd -p /run/snmpd.pid -c /etc/snmp/snmpd.conf </dev/null >/dev/null 2>&1
        EOS
        chmod +x /usr/local/bin/snmpd-restart; snmpd-restart
    - on: monitor-25
      run: |
        ip addr replace 10.{{octet}}.25.20/24 dev eth1
        printf 'auth-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-auth.txt
        printf 'priv-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-priv.txt
        chmod 600 /root/snmp-auth.txt /root/snmp-priv.txt
    - on: other-25
      run: |
        ip addr replace 10.{{octet}}.26.20/24 dev eth1
        printf 'auth-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-auth.txt
        printf 'priv-{{secret}}-{{octet}}' | sha256sum | cut -c1-20 > /root/snmp-priv.txt
        chmod 600 /root/snmp-auth.txt /root/snmp-priv.txt
  checks:
    - id: v3-authpriv
      description: monitor-25 reads sysName with the SNMPv3 user at authPriv
      type: shell
      on: monitor-25
      command: snmpget -v3 -l authPriv -u nms{{octet}} -a SHA -A "$(cat /root/snmp-auth.txt)" -x AES -X "$(cat /root/snmp-priv.txt)" -On -Oqv -t 2 -r 1 10.{{octet}}.25.1 .1.3.6.1.2.1.1.5.0
      expect: { match: exact, value: "mv-edge-25" }
      timeoutSec: 15
      skills: [net.services.snmp]
      weight: 2
    - id: v3-requires-priv
      description: The same user is refused without privacy (authNoPriv)
      type: shell
      on: monitor-25
      command: snmpget -v3 -l authNoPriv -u nms{{octet}} -a SHA -A "$(cat /root/snmp-auth.txt)" -On -Oqv -t 2 -r 0 10.{{octet}}.25.1 .1.3.6.1.2.1.1.5.0 >/dev/null 2>&1 && echo answered || echo refused
      expect: { match: exact, value: refused }
      timeoutSec: 10
      skills: [net.services.snmp]
    - id: no-community
      description: SNMPv1 and v2c with the old community get no answer
      type: shell
      on: monitor-25
      command: |
        for v in 1 2c; do snmpget -v$v -c public -t 1 -r 0 10.{{octet}}.25.1 .1.3.6.1.2.1.1.5.0 >/dev/null 2>&1 && { echo answered; exit 0; }; done; echo silent
      expect: { match: exact, value: silent }
      timeoutSec: 10
      skills: [net.services.snmp, net.security.device-hardening]
      weight: 2
    - id: other-host-refused
      description: other-25 gets no answer, even with the correct SNMPv3 credentials
      type: shell
      on: other-25
      command: snmpget -v3 -l authPriv -u nms{{octet}} -a SHA -A "$(cat /root/snmp-auth.txt)" -x AES -X "$(cat /root/snmp-priv.txt)" -On -Oqv -t 2 -r 0 10.{{octet}}.26.1 .1.3.6.1.2.1.1.5.0 >/dev/null 2>&1 && echo answered || echo silent
      expect: { match: exact, value: silent }
      timeoutSec: 10
      skills: [net.services.snmp, net.security.device-hardening]
      weight: 2
  misconceptions:
    - id: keep-community
      description: Adds the v3 user but leaves the public community in place
      mutation:
        on: mv-edge-25
        run: |
          pkill -x snmpd; sleep 1
          mkdir -p /var/lib/net-snmp
          echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
          echo 'rouser nms{{octet}} priv' >> /etc/snmp/snmpd.conf
          snmpd-restart
      expectFail: [no-community]
    - id: auth-only
      description: Creates the user without requiring privacy
      mutation:
        on: mv-edge-25
        run: |
          pkill -x snmpd; sleep 1
          sed -i '/^rocommunity/d' /etc/snmp/snmpd.conf
          mkdir -p /var/lib/net-snmp
          echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
          echo 'rouser nms{{octet}} auth' >> /etc/snmp/snmpd.conf
          snmpd-restart
      expectFail: [v3-requires-priv]
    - id: no-source-limit
      description: Creates the authPriv user and removes the community, but answers every source
      mutation:
        on: mv-edge-25
        run: |
          pkill -x snmpd; sleep 1
          sed -i '/^rocommunity/d' /etc/snmp/snmpd.conf
          mkdir -p /var/lib/net-snmp
          echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
          echo 'rouser nms{{octet}} priv' >> /etc/snmp/snmpd.conf
          snmpd-restart
      expectFail: [other-host-refused]
  solution:
    explanation: |
      Stop snmpd, remove the rocommunity line, create the SHA/AES user and restrict it
      with `rouser <name> priv`, restart, and drop UDP 161 from every source except the
      monitoring host (SNMPv3 users are not bound to a source address).
    steps:
      - on: mv-edge-25
        run: |
          pkill -x snmpd; sleep 1
          sed -i '/^rocommunity/d' /etc/snmp/snmpd.conf
          mkdir -p /var/lib/net-snmp
          echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
          echo 'rouser nms{{octet}} priv' >> /etc/snmp/snmpd.conf
          nft add table inet snmpacl
          nft 'add chain inet snmpacl input { type filter hook input priority 0; policy accept; }'
          nft add rule inet snmpacl input ip saddr 10.{{octet}}.25.20 udp dport 161 accept
          nft add rule inet snmpacl input udp dport 161 drop
          snmpd-restart; sleep 2
    alternatives:
      - id: iptables
        description: Restrict the source with iptables instead of nftables
        steps:
          - on: mv-edge-25
            run: |
              pkill -x snmpd; sleep 1
              sed -i '/^rocommunity/d' /etc/snmp/snmpd.conf
              mkdir -p /var/lib/net-snmp
              echo "createUser nms{{octet}} SHA $(cat /root/snmp-auth.txt) AES $(cat /root/snmp-priv.txt)" >> /var/lib/net-snmp/snmpd.conf
              echo 'rouser nms{{octet}} priv' >> /etc/snmp/snmpd.conf
              iptables -A INPUT -p udp --dport 161 -s 10.{{octet}}.25.20 -j ACCEPT
              iptables -A INPUT -p udp --dport 161 -j DROP
              snmpd-restart; sleep 2
