# Networking content pack: hands-on routing, switching, IP services, security and
# automation labs set in one fictional school district.
apiVersion: cloudtrain.dev/v1
kind: Pack
metadata:
  id: networking
  title: Network administration
  domain: networking
  version: 1
  owners: [networking-content]
  description: |
    Hands-on network labs on open network stacks: FRRouting routers, Linux
    bridges, Linux routers and services hosts. Every lab is graded on end state
    (device show commands, reachability and files), never on typed commands, and
    every check is tagged with skills from content/skills.yaml.

# The fictional organisation every lab in this pack is set in.
universe:
  organisation: Marlow Valley Schools
  summary: A fictional school district with a district office, four campuses (north, south, east and a vocational annex), a small data centre and an upstream link to a regional education network.
  namingRules:
    routers: "mv-core-N, mv-edge-N, mv-campus-<site>[-a|-b], mv-annex-N"
    switches: "mv-sw-<site>-N (Linux bridges)"
    hosts: "<function>-<site>[-N], e.g. staff-north-1, kiosk-north, printer-south-1"
    addressing: "10.<octet>.<segment>.0/24 per LAN, /30 or /31 transit links, loopbacks 10.255.<octet>.N/32"

# Conventions every lab in this pack follows:
#  - The learner's terminal is the `workstation` jumphost (no lab links). Routers are
#    reached through their console (vtysh), hosts and Linux routers through a shell.
#  - FRR routers (frr:10) take `config` actions and `device-cmd` checks (vtysh);
#    OSPF router IDs are always set explicitly.
#  - Linux hosts are nettools:1 (clients) or netsvc:1 (services hosts, Linux routers,
#    firewalls and bridges). Daemons are started by setup actions, never by the image.
#  - Grader-owned evidence (captures, logs) lives under /var/lib/cloudtrain on the node.
conventions:
  entryNode: workstation
  entryImage: jumphost:1

courses:
- id: net-fund-models
  title: Packets, frames and ports
  description: 'Networking fundamentals: packets, frames and ports.'
  level: beginner
  labs:
  - net-osi-capture-walkthrough
  - net-arp-neighbour-tables
- id: net-fund-addressing
  title: IPv4 and IPv6 addressing
  description: 'Networking fundamentals: ipv4 and ipv6 addressing.'
  level: beginner
  labs:
  - net-subnet-east-campus
  - net-fix-library-mask
  - net-ipv6-dual-stack-office
- id: net-fund-first-routes
  title: First routes and fault finding
  description: 'Networking fundamentals: first routes and fault finding.'
  level: beginner
  labs:
  - net-read-routing-table
  - net-static-routes-campuses
  - net-fix-unreachable-campus
- id: net-rs-vlans
  title: VLANs and trunks
  description: 'Routing and switching on open network stacks: vlans and trunks.'
  level: intermediate
  labs:
  - net-vlan-access-ports
  - net-trunk-two-switches
  - net-fix-native-vlan-mismatch
  - net-inter-vlan-subinterfaces
- id: net-rs-l2-resilience
  title: Spanning tree and link aggregation
  description: 'Routing and switching on open network stacks: spanning tree and link aggregation.'
  level: intermediate
  labs:
  - net-rstp-root-bridge
  - net-fix-broadcast-storm
  - net-lacp-server-uplink
- id: net-rs-static
  title: Static routing
  description: 'Routing and switching on open network stacks: static routing.'
  level: intermediate
  labs:
  - net-default-route-edge
  - net-floating-static-backup
  - net-ipv6-static-routes
- id: net-rs-ospf
  title: Single-area OSPF
  description: 'Routing and switching on open network stacks: single-area ospf.'
  level: intermediate
  labs:
  - net-ospf-single-area
  - net-ospf-cost-dr-passive
  - net-fix-ospf-adjacency
- id: net-rs-fhrp
  title: First-hop redundancy
  description: 'Routing and switching on open network stacks: first-hop redundancy.'
  level: intermediate
  labs:
  - net-vrrp-gateway-pair
- id: net-svc-addressing-services
  title: DHCP and DNS
  description: 'Network services and security: dhcp and dns.'
  level: intermediate
  labs:
  - net-dhcp-pools-reservations
  - net-dhcp-relay-campus
  - net-dns-district-zone
- id: net-svc-nat
  title: Address translation
  description: 'Network services and security: address translation.'
  level: intermediate
  labs:
  - net-pat-internet-edge
  - net-static-nat-timetable
  - net-fix-nat-inside-outside
- id: net-svc-operations
  title: Time, logging, monitoring and QoS
  description: 'Network services and security: time, logging, monitoring and qos.'
  level: intermediate
  labs:
  - net-ntp-hierarchy
  - net-syslog-central
  - net-snmpv3-polling
  - net-qos-voice-priority
- id: net-svc-filtering
  title: Filtering and device hardening
  description: 'Network services and security: filtering and device hardening.'
  level: intermediate
  labs:
  - net-acl-grades-server
  - net-zone-firewall-edge
  - net-mgmt-plane-hardening
  - net-hack-open-management
- id: net-svc-vpn
  title: Site-to-site VPNs
  description: 'Network services and security: site-to-site vpns.'
  level: intermediate
  labs:
  - net-wireguard-annex-tunnel
  - net-ipsec-partner-tunnel
  - net-fix-mtu-blackhole

paths:
- id: net-fundamentals
  title: Networking fundamentals
  framework: ccna
  courses:
  - net-fund-models
  - net-fund-addressing
  - net-fund-first-routes
- id: net-routing-switching
  title: Routing and switching on open network stacks
  framework: ccna
  courses:
  - net-rs-vlans
  - net-rs-l2-resilience
  - net-rs-static
  - net-rs-ospf
  - net-rs-fhrp
- id: net-services-security
  title: Network services and security
  framework: ccna
  courses:
  - net-svc-addressing-services
  - net-svc-nat
  - net-svc-operations
  - net-svc-filtering
  - net-svc-vpn
