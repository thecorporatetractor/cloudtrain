legal:
  alignmentNotice: CloudTrain is not affiliated with or endorsed by the Cloud Native Computing Foundation, The Linux Foundation, Red Hat, CompTIA, the Linux Professional Institute, Cisco, HashiCorp, Docker or any other certifying body. Exam and product names are trademarks of their owners. Paths and simulations cover objectives aligned to public exam blueprints; completing them confers no certification.
  terms:
    title: Terms of service
    updated: 2026-10-18
    placeholder: true
    sections:
      - title: Draft notice
        paragraphs:
          - These terms are a placeholder pending legal review. They describe the intended agreement and will be replaced before paid plans open.
      - title: The service
        paragraphs:
          - CloudTrain provides hands-on training environments, graded labs, exam simulations and related reporting ("the service") to individuals and organisations.
          - Environments are provisioned for the duration of a session and destroyed afterwards. Work left in an environment is not preserved beyond the session unless the lab says so.
      - title: Acceptable use
        paragraphs:
          - Environments are for the training exercises offered. Using them to attack systems outside the platform, to mine, to host services for third parties or to circumvent isolation is prohibited and ends the account.
      - title: Content and intellectual property
        paragraphs:
          - Lab content is licensed under CC BY-NC 4.0; platform code under the Business Source License 1.1. Exam simulations are original work aligned to public blueprints and are not affiliated with any certifying body.
      - title: Accounts, plans and payment
        paragraphs:
          - Paid plans, seat counts, renewals, cancellation and refunds will be described here once pricing is final. Payments are processed by a third-party payment provider; the service never stores card details.
      - title: Liability
        paragraphs:
          - The service is provided as is for training purposes. To the extent permitted by law, liability is limited to the fees paid in the twelve months before a claim.
  privacy:
    title: Privacy notice
    updated: 2026-10-18
    placeholder: true
    sections:
      - title: Draft notice
        paragraphs:
          - This notice is a placeholder pending legal review and a data-protection assessment. It lists the processing the platform performs today.
      - title: What we process
        paragraphs:
          - Account data from your identity provider (name, email, groups mapped to roles), lab and exam activity (attempts, check results, skill evidence), terminal session metadata and an audit log of administrative actions.
          - Terminal contents are streamed to your browser and are not recorded unless an instructor observes a session, in which case the learner sees a banner and the observation is logged.
      - title: Why we process it
        paragraphs:
          - To run your labs and exams, to compute your mastery and recommendations, to let your organisation's managers and instructors see progress they are entitled to, and to keep the service secure.
      - title: Where it lives
        paragraphs:
          - In the deployment that serves you. Self-hosted deployments keep every record on the operator's infrastructure. Payment data, when plans open, stays with the payment provider.
      - title: Your rights
        paragraphs:
          - You can ask for a copy or the deletion of your data through your organisation's administrator or the contact address on this site.

