# CloudTrain public website configuration (apps/web public routes, served by the
# gateway at GET /api/public/site). Schema: packages/lab-schema/schema/site.schema.json;
# reference: docs/website.md. A deployment replaces this file without a code change
# (CT_SITE_CONFIG=/path/to/site.yaml, e.g. a ConfigMap mount). Checked by
# tools/lab-verify (schema + highlighted domains).
apiVersion: cloudtrain.dev/v1
kind: Site

brand:
  name: CloudTrain
  legalName: AzarGuard
  tagline: Hands-on labs on real infrastructure
  # logo: /site/logo.svg        # optional: replaces the built-in mark
  # favicon: /site/favicon.svg  # optional

hero:
  eyebrow: Hands-on training platform
  title: Learn infrastructure by operating it
  subtitle: Real clusters, virtual machines and network topologies, provisioned in seconds and graded on the end state you leave behind. Kubernetes, Linux, containers, infrastructure as code, automation and networking, from first contact to exam-day pressure.
  primaryCta: { label: Browse the catalog, to: /catalog }
  secondaryCta: { label: Sign in, to: /sign-in }
  note: Organisations sign in with their own identity provider. No card needed to look around.

highlightDomains: [kubernetes, linux, networking, containers, iac, automation]

features:
  - icon: server
    title: Real environments, not simulations
    body: Every lab runs on a live topology, from kubeadm clusters and full VMs to routers wired on real layer-2 links. What you type is what runs.
  - icon: check
    title: Graded on the end state
    body: Checks read the system you leave behind, never the commands you used. Partial credit per check, learner-safe messages, no trick questions.
  - icon: graduation
    title: Exam-style simulations
    body: Timed practical simulations draw fresh tasks from large pools, run on one shared environment and report per objective against a pass mark.
  - icon: sparkles
    title: An adaptive learner model
    body: Each check feeds skill evidence into a mastery model, so the next best lab is the biggest step toward your goal at a level you are likely to pass.
  - icon: flag
    title: Capture-the-flag events
    body: Seeded incidents to investigate solo or as a team, with points, penalties, hints that cost and a live scoreboard with first bloods.
  - icon: users
    title: Built for organisations
    body: Single sign-on, roles for learners, managers, instructors and admins, cohorts, assignments with due dates and an append-only audit log.

howItWorks:
  - title: Pick a lab or a path
    body: Browse by domain, framework alignment, difficulty or duration. Paths order labs from first contact to exam readiness.
  - title: Start a real environment
    body: Clusters, machines and network devices come from warm pools and are ready in seconds, isolated per learner and reset on request.
  - title: Do the work in your terminal
    body: Work in the browser terminal or over SSH. Hints are there when you want them and cost nothing in learning labs.
  - title: Validate and learn from the result
    body: Validate as often as you like. Every check names the skill it exercises and feeds your mastery, your plan and your team's heatmap.

