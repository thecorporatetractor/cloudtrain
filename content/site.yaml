# Launch mode (src/site/launch.ts in apps/web). `coming-soon`: every website page but
# the legal ones shows one standalone landing (what CloudTrain is, how pricing works,
# the waitlist, questions) with no sign-in, checkout or link into the platform; signed-in
# users still reach the app. `live`: the full website. A static build can override it
# (pnpm --filter web build:site -- --launch live), so can a dev server (VITE_LAUNCH_MODE).
launch:
  mode: coming-soon
  eyebrow: What CloudTrain is
  status: Private beta. Opening to the public in 2027
  title: Learn infrastructure by operating it.
  subtitle: Real Linux machines, Kubernetes clusters and network devices in your browser, graded on the state you leave them in. Self-host it for free, or let us run it and pay only for the minutes your labs use. Join the waitlist for early access.
  ctaLabel: Join the waitlist
  points:
    - icon: server
      title: Real VMs, not simulations
      body: Every lab is a live environment of its own, from a single pod to virtual machines, kubeadm clusters and routers on isolated links. What you type runs; what breaks stays broken until you fix it.
    - icon: check
      title: Graded on the end state
      body: Checks read the cluster, the files, the services and the devices you leave behind, never the commands you typed. Timed exam simulations report per objective against a pass mark.
    - icon: cloud
      title: Free to self-host
      body: Run it on your own infrastructure for free, with every lab, including for your organisation's internal training. Or use the hosted service and pay per minute of compute.
    - icon: building
      title: Ready for enterprises
      body: Single sign-on with your identity provider, SCIM, audit export and analytics come with a subscription on the hosted service or a license key when you self-host.
  faqGroups: [Labs, Pricing, Organisations]

pricing:
  headline: Free to self-host. Pay per minute when we host it.
  intro: Run CloudTrain yourself for free, with every lab. On the hosted service, try a lab free and then pay only for the compute you use, by the minute. Enterprise features come with a subscription or a license key.
  placeholderNote: Pricing to be announced. Every amount shown is a placeholder while plans are finalised, not an offer, and nothing is charged before launch.
  contactCta: { label: Talk to us, to: /contact }
  faqGroup: Pricing
  # How pricing works: copy only. Rates come from plans.compute, prices from plans.items.
  model:
    eyebrow: Pricing
    title: Three ways to run CloudTrain
    intro: Every path gets every public lab. Self-host it for free, let us host it and pay for the compute your labs use, and add enterprise features only if you need them.
    # The three paths. `hosted` shows the compute rates (plans.compute) under its price line.
    paths:
      - id: self-host
        icon: server
        eyebrow: Self-host
        title: Self-host, free
        price: Free
        body: Run CloudTrain on your own Kubernetes cluster, with every lab. Free for any purpose, including training the people of your own organisation.
        points:
          - Every lab, path and exam simulation
          - Internal corporate training included
          - Your infrastructure, your data
          - Not for resale or hosting for third parties
        cta: { label: How licensing works, to: 'https://github.com/thecorporatetractor/cloudtrain/blob/main/docs/licensing.md' }
      - id: hosted
        icon: cloud
        eyebrow: Hosted
        title: Hosted, pay for compute
        price: Per minute of compute
        body: We run the platform. Try a lab free, then pay only for the minutes your labs run, by environment tier. No lab is locked behind a tier.
        points:
          - A free trial lab, no card needed
          - Pod labs cost least, multi-VM labs most
          - Spend caps you control
          - Tiers can add early-access labs and features
      - id: enterprise
        icon: building
        eyebrow: Enterprise
        title: Enterprise features
        price: Subscription or license key
        body: The features organisations ask for, on the hosted service with a subscription, or on your own installation with a license key.
        points:
          - Single sign-on with your IdP, SCIM
          - Audit log export, advanced analytics
          - Exam certificates, custom branding
          - Several organisations on one installation
        cta: { label: Talk to us, to: /contact }
    steps:
      - icon: sparkles
        title: Try a lab free
        body: A free account gets a simple lab to try, start to finish, with real grading. No card needed.
      - icon: timer
        title: Pay per minute of compute
        body: On the hosted service the meter runs only while your lab does. Pod labs cost least, single-VM labs more, multi-VM topologies the most.
      - icon: layers
        title: Add features when you need them
        body: Every public lab is open on every plan. A subscription adds enterprise features and early-access labs; compute is billed on top, at the same rates.
      - icon: building
        title: Organisations buy seats
        body: Buy seats for your team and assign them from the admin console, with one compute bill. Reassign a seat when people change roles.
    tiers:
      pod:
        name: Pod labs
        body: Containers and virtual clusters. Quick to start, light to run.
        examples: [Linux basics, Container builds, kubectl on a virtual cluster]
      vm:
        name: VM labs
        body: A full virtual machine of your own, with its own kernel, systemd and disks.
        examples: [Storage and LVM, Firewalls with nftables, Boot and recovery]
      heavy:
        name: Multi-VM labs
        body: Several machines at once, kubeadm clusters and network topologies.
        examples: [Cluster upgrades, etcd restore, Routing between sites]
    examples:
      - title: A quick Linux fix
        body: Repair a broken service on a container, start to finish.
        tier: pod
        minutes: 30
      - title: Recover a machine that will not boot
        body: A single VM, rescue mode and a broken fstab.
        tier: vm
        minutes: 60
      - title: Upgrade a kubeadm cluster
        body: Three machines, one control plane, no downtime.
        tier: heavy
        minutes: 90
      - title: A month of steady practice
        body: Twelve VM labs of about 45 minutes each.
        tier: vm
        minutes: 45
        sessions: 12
    estimator:
      title: Estimate your month
      note: Hosted service only. Billed per started minute while a lab runs; finished labs cost nothing. A subscription, if you have one, is billed separately. Self-hosting costs nothing.
      defaultTier: vm
      defaultMinutes: 45
      defaultSessions: 12
    pendingNote: Rates to be announced

# Plans: configurable data, not code. Amounts are in minor units (cents) of `currency`;
# lookup keys name the Stripe Prices that `pnpm --filter @cloudtrain/gateway stripe:sync`
# creates from this file (plus the compute meter and its metered price). Model (docs/billing.md):
# learners pay for the compute their lab sessions use, on top of any plan; plans unlock premium
# labs; a free account gets the trial lab only. EVERY AMOUNT BELOW IS A PLACEHOLDER.
plans:
  currency: EUR
  placeholder: true
  taxNote: Prices exclude VAT where applicable.
  billingNote: Compute is billed monthly in arrears from metered lab minutes, on top of any plan.
  # Free accounts (no payment method, no subscription) may start these labs, uncharged, up to the caps.
  free:
    trialLabs: [shell-first-steps-timetable]
    maxSessions: 3
    maxMinutes: 60
  # Pay for compute: billed minutes (rounded up, at least minimumMinutes) x the tier's units per minute.
  # unitPrice is minor units per compute unit (0.5 = half a cent): pod 0.30, VM 1.20, heavy 3.00 EUR/hour.
  compute:
    placeholder: true
    unitPrice: '0.5'
    lookupKey: ct_compute_unit
    meterEventName: ct_compute_units
    minimumMinutes: 1
    tiers:
      pod: { label: Pod or virtual cluster, unitsPerMinute: 1 }
      vm: { label: Single virtual machine, unitsPerMinute: 4 }
      heavy: { label: 'Multi-VM, kubeadm or network topology', unitsPerMinute: 10 }
  # Default monthly compute spend caps (minor units, 0 = none); accounts and org admins may change theirs.
  limits:
    user: { monthlyCap: 5000, hardStop: true }
    org: { monthlyCap: 50000, hardStop: false }
  # Days after a failed payment before new paid lab starts are refused (running labs continue).
  dunning:
    graceDays: 7
  # Premium labs: the plan whose level unlocks the labs a rule matches (highest wins).
  premium:
    - plan: pro
      difficulties: [hard]
    - plan: premium
      difficulties: [hard]
      computeTiers: [heavy]
  items:
    - id: free
      name: Free
      kind: free
      level: 0
      description: Try one guided lab free of charge; add a card to run any standard lab and pay only for the compute you use.
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 1
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: 0
        ctfEvents: false
      includes:
        - One trial lab free of charge, no card needed
        - With a card on file, every standard lab, paying per compute minute
        - Skill tracking and the next-best-lab recommendation
        - Community support
      cta: { label: Get started, action: signin }
    - id: pro
      name: Pro
      kind: individual
      level: 1
      description: Unlocks the hard labs, timed exam simulations and CTF events, for one person. Compute billed on top.
      badge: Placeholder price
      highlight: true
      prices:
        monthly: { amount: 900, lookupKey: ct_pro_monthly }
        yearly: { amount: 9000, lookupKey: ct_pro_yearly }
      placeholderPrices: true
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 2
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: 4
        ctfEvents: true
      includes:
        - Hard labs on pod and VM tiers
        - Exam simulations with per-objective reports
        - Solo CTF investigations and public events
        - Email support
      cta: { label: Start Pro, action: checkout }
    - id: premium
      name: Premium
      kind: individual
      level: 2
      description: Everything in Pro plus the hard multi-VM, kubeadm and network-topology labs. Compute billed on top.
      badge: Placeholder price
      prices:
        monthly: { amount: 1900, lookupKey: ct_premium_monthly }
        yearly: { amount: 19000, lookupKey: ct_premium_yearly }
      placeholderPrices: true
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 3
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: unlimited
        ctfEvents: true
      includes:
        - Every lab, including hard multi-VM, kubeadm and network labs
        - Unlimited exam simulations
        - Priority email support
      cta: { label: Start Premium, action: checkout }
    - id: team
      name: Team
      kind: organisation
      level: 2
      description: Per seat, for organisations that train together, with SSO, cohorts and dashboards. Seated members get Premium; compute is billed to the organisation.
      badge: Placeholder price
      prices:
        monthly: { amount: 1500, lookupKey: ct_team_seat_monthly }
        yearly: { amount: 15000, lookupKey: ct_team_seat_yearly }
      perSeat: true
      minSeats: 3
      placeholderPrices: true
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 2
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: unlimited
        ctfEvents: true
      includes:
        - Premium labs for every seated member
        - Single sign-on with group-to-role mapping
        - Manager and instructor dashboards, cohorts, assignments
        - One compute bill for the organisation, with a spend cap
        - Priority support and onboarding
      cta: { label: Talk to sales, action: contact }
