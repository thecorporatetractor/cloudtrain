# CloudTrain public website configuration (apps/web public routes, served by the
# gateway at GET /api/public/site). Schema: packages/lab-schema/schema/site.schema.json;
# reference: docs/website.md. A deployment replaces this file without a code change
# (CT_SITE_CONFIG=/path/to/site.yaml, e.g. a ConfigMap mount). Checked by
# tools/lab-verify (schema, highlighted domains, links, screenshots).
#
# Screenshots under /site/ are real mock-mode captures made by
# apps/web/scripts/site-shots.mjs (dark and light variants, WebP). The landing
# page adds the live catalog figures (labs, domains, exam simulations) from
# GET /api/public/catalog; nothing numeric is written here.
apiVersion: cloudtrain.dev/v1
kind: Site

brand:
  name: CloudTrain
  legalName: CloudTrain
  tagline: Hands-on labs on real infrastructure
  # The built-in logo is the CloudTrain mark and wordmark (apps/web/public/brand, drawn inline
  # per theme). Another brand sets its own images; the files below are the served defaults.
  # logo: /brand/cloudtrain-horizontal.svg
  # logoDark: /brand/cloudtrain-horizontal-white.svg
  favicon: /brand/favicon.svg

hero:
  eyebrow: Hands-on infrastructure training
  title: Learn infrastructure by operating it.
  subtitle: Practise Kubernetes, Linux, networking, containers, infrastructure as code and automation on real clusters, virtual machines and network devices. Solve a realistic problem, then validate the system you leave behind.
  primaryCta: { label: Explore the catalog, to: /catalog }
  secondaryCta: { label: See how it works, to: /#how-it-works }
  note: Browse the catalog without an account. Organisations sign in with their own identity provider.
  proof: [Graded on the end state, Isolated per learner, Reset and retry]
  preview:
    image: /site/workspace-dark.webp
    imageLight: /site/workspace-light.webp
    alt: A lab workspace. Left, the task, its objectives and five checks, one passing. Right, the topology of a workstation, a three-node kubeadm cluster and a registry, with a terminal into the cluster and a packet capture.
    width: 1440
    height: 900

highlightDomains: [kubernetes, linux, networking, containers, iac, automation]

howItWorks:
  - icon: route
    title: Choose a lab or a learning path
    body: Browse by domain, difficulty, duration or alignment to a public exam blueprint. Paths order labs from first contact to exam readiness.
  - icon: server
    title: Start a real environment
    body: The lab decides what you get, a pod, a virtual machine, a kubeadm or virtual cluster or a network topology, provisioned for you alone. Warm pools make most of them ready in seconds.
  - icon: terminal
    title: Solve the problem with the tools you would use at work
    body: Work in the browser terminal or over SSH with the real kubectl, systemd, nftables, Terraform, Ansible or router CLI. Hints are there when you want them.
  - icon: check
    title: Validate the resulting system state
    body: Validate as often as you like. Checks read the cluster, the files, the services and the devices you leave behind, never the commands you typed, and name the objective that is still open.

differentiators:
  - icon: server
    title: Real VMs and clusters, not simulations
    body: Every lab runs on a live topology, from kubeadm and virtual clusters to full virtual machines, container engines, and routers and switches wired on isolated layer-2 links. What you type is what runs, and what breaks stays broken until you fix it.
    figure:
      image: /site/topology-dark.webp
      imageLight: /site/topology-light.webp
      alt: The topology panel of a lab, a workstation, a three-node kubeadm cluster and a registry on two subnets, above a terminal listing the cluster's nodes.
      width: 1990
      height: 1494
  - icon: check
    title: Prove the outcome, not the commands
    body: Validation inspects the end state. Any correct approach passes, each check carries its own share of the score, and a failing check tells you what was expected and what was found, so you know which objective is still open.
    figure:
      image: /site/checks-dark.webp
      imageLight: /site/checks-light.webp
      alt: The checks panel of a lab after a validation run, one check passing and four failing, each with its weight.
      width: 702
      height: 526
  - icon: chart
    title: Turn practice into measurable progress
    body: Every graded check is evidence for the skills it exercises. Mastery per objective, readiness per exam blueprint and a recommended next lab show what you can do, and managers see the same for their team.
    figure:
      image: /site/skills-summary-dark.webp
      imageLight: /site/skills-summary-light.webp
      alt: The summary of the skills view for a Kubernetes security blueprint, readiness at 48 percent, skills practised 15 of 16, the skill with least evidence, and the first rows of the objective matrix.
      width: 1888
      height: 1416

features:
  - icon: graduation
    title: Exam-style simulations
    body: Timed practical simulations draw fresh tasks from large pools, run on one shared environment and report per objective against a pass mark.
  - icon: flag
    title: Capture-the-flag events
    body: Seeded incidents to investigate solo or as a team, with points, penalties, hints that cost and a live scoreboard.
  - icon: sparkles
    title: An adaptive learner model
    body: Each check feeds skill evidence into a mastery model, so the next recommended lab is the biggest step toward your goal at a level you are likely to pass.
  - icon: users
    title: Built for organisations
    body: Single sign-on, roles for learners, managers, instructors and admins, cohorts, assignments with due dates and an append-only audit log.

showcase:
  - title: Practise in a real workspace
    body: The task and its objectives on the left, the live topology and terminals on the right. Open a console on any node, capture packets on a link, split the terminal, and validate whenever you want.
    why: You learn in the layout you will work in, with nothing simulated between you and the system.
    figure:
      image: /site/workspace-dark.webp
      imageLight: /site/workspace-light.webp
      alt: A lab workspace with the task panel, a topology of three nodes and two terminals, one running a packet capture.
      width: 1440
      height: 900
  - title: Understand your results
    body: An exam simulation report scores every task against its objective weight and lists each check with what passed and what was not satisfied, next to the per-objective totals.
    why: You see exactly which objectives need work before the real exam, not just a percentage.
    figure:
      image: /site/exam-results-dark.webp
      imageLight: /site/exam-results-light.webp
      alt: An exam simulation report, tasks with their objective, weight, outcome and score, and totals per objective.
      width: 1440
      height: 900
  - title: Track practical readiness
    body: Mastery is estimated per skill from graded results, grouped by the objectives of a public exam blueprint, with the uncertainty shown where there is little evidence yet.
    why: Progress is measured on what you have demonstrated, so the readiness figure means something.
    figure:
      image: /site/skills-dark.webp
      imageLight: /site/skills-light.webp
      alt: The skills view, a readiness figure, skills practised and a matrix of objectives with a mastery estimate per skill.
      width: 1440
      height: 900
  - title: Build team capability
    body: Managers see members against competencies, framework readiness, time practised, overdue and at-risk work, and can assign labs, paths or a whole blueprint with a due date.
    why: Training becomes something you can plan and report on, not a licence count.
    figure:
      image: /site/team-dark.webp
      imageLight: /site/team-light.webp
      alt: A team dashboard, seven members against eleven competencies as a heatmap, with framework readiness and at-risk work below.
      width: 1440
      height: 900

# The features page (/features) and the homepage callout that leads to it. Screens under
# /site/features/ are captured by apps/web/scripts/feature-shots.mjs (dark and light, 1x and
# 2x WebP; the light ones serve the light and cream themes). An item is shown under the group
# of `groups` it names: delete a group's line to drop the group and its items from the page.
# The three `featured` items are the homepage callout. Every description is of what the
# product does today; `access` says which plans include a feature when not every plan does.
featurePage:
  eyebrow: Features
  title: The product, screen by screen
  intro: What is in CloudTrain today, as learners, exam candidates, managers, instructors and admins see it. The platform is in private beta and opens to the public in 2027.
  callout:
    eyebrow: Features
    title: See it as learners and managers do
    body: Three screens from the product. The features page shows every one, with what it does and which plans include it.
    linkLabel: All features
  groups:
    - { id: learn, title: Learn, lead: 'Real environments, graded on the state you leave them in.' }
    - { id: exams, title: Exams, lead: 'Timed simulations of practical exams, reported per objective.' }
    - { id: teach, title: Teach and manage, lead: 'Dashboards, assignments and a live board for managers and instructors.' }
    - { id: admin, title: Admin, lead: 'People, sign-in, quotas and the audit log of an organisation.' }
  items:
    - group: learn
      featured: true
      title: The lab workspace
      body: The task, its objectives and the checks on the left; the live topology and the terminals on the right. Open a console on any node, capture packets on a link, and validate as often as you like. The checks read the state of the environment, never the commands you typed.
      access: Standard labs on every plan. Hard labs from Pro (Pod, VM) or Premium and Team (all). Self-hosted, every lab.
      figures:
        - image: /site/features/workspace-dark.webp
          imageLight: /site/features/workspace-light.webp
          image2x: /site/features/workspace-dark@2x.webp
          imageLight2x: /site/features/workspace-light@2x.webp
          alt: A lab workspace. Left, the task, four objectives and five checks after a validation run, one passing. Right, the topology of a workstation, a three-node kubeadm cluster and a registry, a terminal into the cluster and a packet capture on the link between them.
          width: 1440
          height: 900
    - group: learn
      title: The lab before you start
      body: The scenario, the objectives, the nodes of the topology and the skills the lab trains, so you know what you are getting into. Each environment is provisioned for you alone and ends with its session. Hints are there when you want them.
      figures:
        - image: /site/features/lab-overview-dark.webp
          imageLight: /site/features/lab-overview-light.webp
          image2x: /site/features/lab-overview-dark@2x.webp
          imageLight2x: /site/features/lab-overview-light@2x.webp
          alt: The overview of a Kubernetes lab. The scenario and four objectives, a panel of the three nodes, the hints and the three skills it trains, and the topology drawn below.
          width: 1440
          height: 900
    - group: learn
      title: The catalog
      body: Domains, learning paths and labs, each with its difficulty, duration, tags and the skills it trains. Filter by difficulty and length or search by title, tag or skill. Signed in, every path shows how far you are.
      figures:
        - image: /site/features/catalog-dark.webp
          imageLight: /site/features/catalog-light.webp
          image2x: /site/features/catalog-dark@2x.webp
          imageLight2x: /site/features/catalog-light@2x.webp
          alt: The catalog. Three domain cards with their lab and path counts, four learning paths with progress bars, and the list of labs with a search box and difficulty and duration filters.
          width: 1440
          height: 900
    - group: learn
      title: Your next best lab
      body: Pick up where you left off, see the next best lab with the reasons it was chosen, your assignments with their due dates, and your goal. Readiness for the exam blueprint you chose, and the weekly pace that gets you there by your date.
      figures:
        - image: /site/features/home-dark.webp
          imageLight: /site/features/home-light.webp
          image2x: /site/features/home-dark@2x.webp
          imageLight2x: /site/features/home-light@2x.webp
          alt: A learner's home. A lab to resume, the recommended next lab with three reasons, its chance to pass and the domains it covers, assignments due with two overdue, and the goal panel with readiness at 48 percent and the pace to the chosen date.
          width: 1440
          height: 900
    - group: learn
      title: Skills and readiness
      body: Mastery per skill, estimated from your graded checks with its uncertainty, grouped by the objectives of an exam blueprint and weighted into one readiness figure. A dashed ring marks an estimate that still rests on little evidence.
      figures:
        - image: /site/features/skills-dark.webp
          imageLight: /site/features/skills-light.webp
          image2x: /site/features/skills-dark@2x.webp
          imageLight2x: /site/features/skills-light@2x.webp
          alt: The skills view for a Kubernetes security blueprint. Weighted readiness at 48 percent, 15 of 16 skills practised, the most uncertain skill, and a matrix of objectives with a mastery estimate per skill.
          width: 1440
          height: 900
    - group: learn
      title: Capture-the-flag events
      body: A timed competition over one or more CTF labs, solo or in teams. Points per question, values that can drop as more entrants solve them, penalties for wrong answers, hints that cost points, and a live scoreboard with a solve timeline.
      access: Pro, Premium and Team. Included when you self-host.
      figures:
        - image: /site/features/event-scoreboard-dark.webp
          imageLight: /site/features/event-scoreboard-light.webp
          image2x: /site/features/event-scoreboard-dark@2x.webp
          imageLight2x: /site/features/event-scoreboard-light@2x.webp
          alt: The live scoreboard of a team CTF event. Four teams ranked by points, a solve timeline, the recent solves with first-blood marks, and the current value of each question.
          width: 1440
          height: 900
    - group: exams
      title: The exam, explained before you start
      body: The format up front. Tasks drawn from pools larger than the exam, one timer, no hints and no validation during the exam, flags for review, and a pass mark weighted by objective. A checklist to confirm you have read the rules, and your previous attempts beside it.
      access: Pro, Premium and Team. Included when you self-host.
      figures:
        - image: /site/features/exam-detail-dark.webp
          imageLight: /site/features/exam-detail-light.webp
          image2x: /site/features/exam-detail-dark@2x.webp
          imageLight2x: /site/features/exam-detail-light@2x.webp
          alt: An exam simulation before it starts. 16 tasks drawn from 32, two hours, a pass mark of 66 percent, the blueprint with the share of the score per objective, the rules, a ticked checklist and the start button.
          width: 1440
          height: 900
    - group: exams
      title: The exam workspace
      body: One timer, a task navigator with flags, the statement of the task with its share of the score, and a terminal into the shared environment. Do the tasks in any order. When time is up the environment closes and your work is submitted and graded.
      access: Pro, Premium and Team. Included when you self-host.
      figures:
        - image: /site/features/exam-workspace-dark.webp
          imageLight: /site/features/exam-workspace-light.webp
          image2x: /site/features/exam-workspace-dark@2x.webp
          imageLight2x: /site/features/exam-workspace-light@2x.webp
          alt: An exam in progress. The timer and the submit button, a row of 16 task buttons with one flagged, task 5 of 16 with its instructions, and a terminal into the workstation listing the two cluster contexts.
          width: 1440
          height: 900
    - group: exams
      featured: true
      title: The score report
      body: The score against the pass mark, the result per objective and per task with each check's outcome, the labs to practise next for the weakest objectives, and the skill evidence the attempt added. A retake draws different tasks; after the free retakes, a cooldown applies.
      access: Pro, Premium and Team. Included when you self-host.
      figures:
        - image: /site/features/exam-results-dark.webp
          imageLight: /site/features/exam-results-light.webp
          image2x: /site/features/exam-results-dark@2x.webp
          imageLight2x: /site/features/exam-results-light@2x.webp
          alt: The score report of a failed exam simulation. 59.5 percent against a pass mark of 66, the score per objective with the pass line, the first tasks with their weight, outcome and score, labs to practise next and the skill evidence.
          width: 1440
          height: 900
    - group: teach
      featured: true
      title: The team dashboard
      body: Members against competencies as a heatmap of mean mastery, practice time, completion, overdue and at-risk work, and readiness per blueprint for the whole team. Assign a lab, a path or a whole blueprint with a due date, and export the progress as CSV.
      access: Team plan on the hosted service. Included when you self-host.
      figures:
        - image: /site/features/team-dark.webp
          imageLight: /site/features/team-light.webp
          image2x: /site/features/team-dark@2x.webp
          imageLight2x: /site/features/team-light@2x.webp
          alt: A team dashboard. Practice time, completion, overdue and at-risk figures, seven members against eleven competencies as a heatmap with the team mean, and framework readiness and at-risk work below.
          width: 1440
          height: 900
    - group: teach
      title: Exam readiness per team
      body: Who has taken which simulation, the pass rate and the average score against the pass mark, and for each person the best and last score, the attempts and the weakest objective. A manager can grant a retake, which lifts the cooldown for one attempt.
      access: Team plan on the hosted service. Included when you self-host.
      figures:
        - image: /site/features/team-exams-dark.webp
          imageLight: /site/features/team-exams-light.webp
          image2x: /site/features/team-exams-dark@2x.webp
          imageLight2x: /site/features/team-exams-light@2x.webp
          alt: The exam readiness of a team for a Kubernetes administrator simulation. Pass rate 43 percent, average last score 62.7 against a pass mark of 66, and a table of seven members with readiness, best score, attempts, weakest objective and a retake button.
          width: 1440
          height: 900
    - group: teach
      title: The live board of a cohort
      body: Every learner of a cohort with their current session, its phase, the checks passed, how long it has been open, the hints used and a stuck signal. Observe a session in a shadow terminal, which the learner sees, broadcast a message or a hint to the cohort, and extend or terminate a session.
      access: Team plan on the hosted service. Included when you self-host.
      figures:
        - image: /site/features/cohort-board-dark.webp
          imageLight: /site/features/cohort-board-light.webp
          image2x: /site/features/cohort-board-dark@2x.webp
          imageLight2x: /site/features/cohort-board-light@2x.webp
          alt: The live board of a bootcamp cohort. Six learners, five in a lab and two marked stuck, each with the session's phase, checks, time open, hints and path progress, an observe button and a broadcast button.
          width: 1440
          height: 900
    - group: admin
      title: People and roles
      body: Everyone in the organisation with their roles, teams, status, last sign-in and where the account came from. Invite by email, change roles and teams, and deactivate someone, which revokes their sessions and terminates their running labs.
      access: Organisations on the Team plan. Included when you self-host.
      figures:
        - image: /site/features/admin-users-dark.webp
          imageLight: /site/features/admin-users-light.webp
          image2x: /site/features/admin-users-dark@2x.webp
          imageLight2x: /site/features/admin-users-light@2x.webp
          alt: The users page of an organisation. A search box and role, team and status filters, an invite button, and a table of people with their roles, teams, status, last sign-in and the identity provider they came from.
          width: 1440
          height: 900
    - group: admin
      title: Single sign-on
      body: Connect your identity provider over OpenID Connect or SAML, map its groups to roles, test the connection, and verify your email domains so sign-ins route to it. Enforce it to disable local passwords for the verified domains.
      access: Team plan on the hosted service; a license key when you self-host.
      figures:
        - image: /site/features/admin-sso-dark.webp
          imageLight: /site/features/admin-sso-light.webp
          image2x: /site/features/admin-sso-dark@2x.webp
          imageLight2x: /site/features/admin-sso-light@2x.webp
          alt: The single sign-on page of an organisation. Two identity providers, one active and enforced over OIDC and one SAML draft, each with a test button; two email domains, one verified and one with the DNS record to add; and a note that local passwords are disabled.
          width: 1440
          height: 900
    - group: admin
      title: Usage and quotas
      body: Lab hours per day and by team, the most run labs and the sessions running now. The quotas the gateway enforces, lab hours a month, concurrent sessions and the longest session. Once a quota is used up new sessions are refused; running ones finish.
      access: Organisations on the Team plan. Included when you self-host.
      figures:
        - image: /site/features/admin-usage-dark.webp
          imageLight: /site/features/admin-usage-light.webp
          image2x: /site/features/admin-usage-dark@2x.webp
          imageLight2x: /site/features/admin-usage-light@2x.webp
          alt: The usage page of an organisation. Lab hours, sessions and running sessions for the last 30 days, a bar chart of lab hours per day, hours by team, the most run labs, and the quota form for monthly lab hours, concurrent sessions and session length.
          width: 1440
          height: 900
    - group: admin
      title: The audit log
      body: Every administrative action with its actor, target and client address, from invitations and role changes to SSO changes, session actions, exports and sign-ins. Filter by actor, action, target and date, open an entry for its details, and download the log as CSV.
      access: Organisations on the Team plan. Self-hosted, included; streaming it to an external system needs a license key.
      figures:
        - image: /site/features/admin-audit-dark.webp
          imageLight: /site/features/admin-audit-light.webp
          image2x: /site/features/admin-audit-dark@2x.webp
          imageLight2x: /site/features/admin-audit-light@2x.webp
          alt: The audit log of an organisation. Filters for actor, action, target and dates, an export button, and a table of events with when, actor, action, target and client address.
          width: 1440
          height: 900

audiences:
  - icon: user
    title: Individual learners
    body: Get practical experience with the technologies you want to work with, in environments you can break and reset.
    points:
      - Browse every lab, path and course without an account
      - Hints that cost nothing in learning labs
      - A recommended next lab based on your results
    cta: { label: Explore labs and paths, to: /catalog }
  - icon: graduation
    title: Certification candidates
    body: Practise the objectives of a public exam blueprint on realistic tasks and see which ones still need work.
    points:
      - Timed simulations with tasks drawn from large pools
      - A report per task and per objective against a pass mark
      - Retakes draw different tasks with different parameters
    cta: { label: Explore exam simulations, to: /catalog#exams }
  - icon: building
    title: Organisations and teams
    body: Repeatable exercises and practical assessments for a whole team, with the visibility to plan training and report on it.
    points:
      - Single sign-on with group-to-role mapping
      - Assignments, cohorts and live instructor boards
      - Competency heatmaps and framework readiness per team
    cta: { label: Talk to us about team training, to: /contact }

faq:
  - group: Labs
    featured: true
    q: Are the environments real?
    a: Yes. A lab topology is provisioned on the platform's Kubernetes cluster as containers, virtual machines, kubeadm or virtual clusters and network devices wired on isolated layer-2 links. Nothing is a mock-up of a shell.
  - group: Labs
    featured: true
    q: How is a lab graded?
    a: On the end state. Checks query the cluster, read files, inspect services or ask network devices after you validate. The commands you used are never part of the grade, so any correct approach passes.
  - group: Labs
    q: Can I break things?
    a: Please do. Each environment is yours alone, can be reset, and ends when the session expires. Nothing you do reaches other learners or the platform.
  - group: Exam simulations
    featured: true
    q: Do the simulations grant a certification?
    a: No. Simulations cover objectives aligned to public exam blueprints and report how ready you are. They are not affiliated with any certifying body and confer no certification.
  - group: Exam simulations
    q: Do retakes draw the same tasks?
    a: No. Each attempt draws from pools at least twice the size of the exam, and every task randomises its parameters, so two attempts can be fully disjoint.
  - group: Organisations
    featured: true
    q: How do my people sign in?
    a: Through your identity provider over OpenID Connect, with group-to-role mapping. A verified email domain routes your people to your provider automatically.
  - group: Organisations
    featured: true
    q: Where does our data live?
    a: On the hosted service, in the EU. It is encrypted in transit and at rest, each organisation's data is kept separate, and access is logged. We are working towards SOC 2 Type 2; the independent audit has not happened yet. If you self-host, everything stays on your own infrastructure.
  - group: Pricing
    featured: true
    q: Can we self-host CloudTrain for free?
    a: Yes. Anyone can run CloudTrain on their own infrastructure for free, with every lab, including for training the people of their own organisation. What it may not be used for is selling it, or hosting it as a service for third parties. The licensing page in the repository (docs/licensing.md) has the details.
  - group: Pricing
    q: What needs a subscription or a license key?
    a: The premium enterprise features, such as single sign-on with your own identity provider, SCIM provisioning, audit log export, advanced analytics, exam certificates, custom branding and several organisations on one installation. On the hosted service they come with a subscription; on your own installation with a license key.
  - group: Pricing
    q: Which labs does a plan include?
    a: "On the hosted service every plan runs every standard lab (Free: the trial lab free, then per minute). The labs marked hard need a plan: Pro opens the hard Pod and VM labs; Premium and Team open every hard lab, the Multi-VM ones with kubeadm clusters and network topologies too. Self-hosted, every lab is yours to run."
  - group: Pricing
    q: Is there a free trial?
    a: Yes. A free account on the hosted service can run a guided trial lab free of charge, no card needed, to see how the environments, grading and the skill model work. When paid plans open, you add a payment method after that and pay only for the compute your lab sessions use.
  - group: Pricing
    q: How is compute billed on the hosted service?
    a: When paid plans open, every lab session is metered from start to stop in wall-clock minutes. Pod and virtual-cluster labs cost the least, single-VM labs more, and multi-VM, kubeadm and network-topology labs the most. Usage will be invoiced monthly; a monthly spend cap stops new paid labs when you reach it, and a running lab is never cut off. Nothing is charged today.
  - group: Pricing
    q: How do organisations pay?
    a: When paid plans open on the hosted service, organisations buy seats and admins assign them, and the lab compute of their members is billed to the organisation with a spending limit an admin controls. Self-hosted, an organisation pays nothing unless it wants the premium enterprise features, which need a license key.
  - group: Pricing
    q: Are the prices final?
    a: The prices shown are the launch prices, in EUR and excluding VAT. They may change before paid plans open, and nothing is charged until then.
  - group: Pricing
    q: Can I prepay for compute?
    a: Yes, with a prepaid pack. You buy compute credit up front and the larger packs add bonus credit, up to 20% more. The credit is valid for twelve months, is spent at the normal per-minute compute rates and works on every paid plan. The pack amounts are a proposal until paid plans open.
  - group: Pricing
    q: How do you handle payment details?
    a: We take no payments yet. When paid plans open, payments will be processed by Stripe. Card details will never reach the platform; we will store only what is needed to bill compute and grant subscriptions.
  - group: Content
    q: Who writes the labs?
    a: Every lab is original, set in fictional organisations and verified end to end by an automated solver before it is published. Nothing is taken from exam material.

about:
  title: Why CloudTrain exists
  paragraphs:
    - Most infrastructure training stops at videos and quizzes. The skills that matter, debugging a node that will not join, recovering an etcd member, isolating a workload with a network policy, are only learned by doing them on systems that behave like production.
    - CloudTrain gives every learner a real, disposable environment and grades the result, not the path. The same platform serves individuals preparing for a practical exam and organisations upskilling whole teams, with single sign-on, cohorts, assignments and an adaptive model that points each person to the next lab worth their time.
    - The platform is source-available. Code is published under the Business Source License, the content under a Creative Commons licence, so you can read how every lab is built and graded.
  facts:
    - label: Domains
      value: Kubernetes, Linux, containers, IaC, automation, networking
    - label: Runtime
      value: Any conformant Kubernetes cluster, with KubeVirt for VMs
    - label: Identity
      value: OpenID Connect, group-to-role mapping, row-level security
    - label: Licence
      value: BUSL-1.1 code, CC BY-NC 4.0 content

