        name: VM labs
        body: One full virtual machine of your own.
        examples: [Storage and LVM, Firewalls with nftables, Boot and recovery]
      heavy:
        name: Multi-VM labs
        body: Real multi-machine clusters and topologies.
        examples: [Cluster upgrades, etcd restore, Routing between sites]
    examples:
      - title: A quick Linux fix
        body: Repair a broken service on a container, start to finish.
        tier: pod
        minutes: 30
      - title: Recover a machine that will not boot
        body: A single VM, rescue mode and a broken fstab.
        tier: vm
        minutes: 60
      - title: A month of exam practice
        body: Eight multi-VM labs of an hour, ahead of a certification.
        tier: heavy
        minutes: 60
        sessions: 8
    estimator:
      title: Estimate your month
      note: "Hosted service only. Billed per started minute. Launch prices in EUR excluding VAT; they may change."
      defaultTier: vm
      defaultMinutes: 45
      defaultSessions: 12
    # What ends a forgotten lab and what the spend cap does: the gateway's session length (an hour by
    # default, two at most per organisation quota; no idle detection) and billing's spend-cap check
    # (new labs refused at a hard cap, running labs continue).
    sessionNote: "Labs end with their session: an hour by default, two at most. At your spend cap, new labs wait."
    pendingNote: Rates to be announced

# Plans: configurable data, not code. Amounts are in minor units (cents) of `currency`;
# lookup keys name the Stripe Prices that `pnpm --filter @cloudtrain/gateway stripe:sync`
# creates from this file (plus the compute meter and its metered price). Model (docs/billing.md):
# learners pay for the compute their lab sessions use, on top of any plan; plans unlock premium
# labs; a free account gets the trial lab only. The amounts are the launch prices.
plans:
  currency: EUR
  taxNote: Launch prices in EUR, excluding VAT. They may change before paid plans open.
  billingNote: Compute is billed per minute, monthly or from a prepaid pack, on top of any plan.
  # Free accounts (no payment method, no subscription) may start these labs, uncharged, up to the caps.
  free:
    trialLabs: [shell-first-steps-timetable]
    maxSessions: 3
    maxMinutes: 60
  # Pay for compute: billed minutes (rounded up, at least minimumMinutes) x the tier's units per minute.
  # unitPrice is minor units per compute unit: a sixth of a cent, so that pod 2, VM 5 and heavy 15
  # units a minute give EUR 0.20, 0.50 and 1.50 an hour. Priced at roughly 2.5 to 3 times the cloud
  # cost (about EUR 0.08, 0.18 and 0.55 an hour on 4 vCPU / 16 GiB nodes in EU regions at about 65%
  # utilisation, plus the control plane, storage and payment fees).
  compute:
    unitPrice: '0.166667'
    lookupKey: ct_compute_unit
    meterEventName: ct_compute_units
    minimumMinutes: 1
    tiers:
      pod: { label: Pod or virtual cluster, unitsPerMinute: 2 }
      vm: { label: Single virtual machine, unitsPerMinute: 5 }
      heavy: { label: 'Multi-VM, kubeadm or network topology', unitsPerMinute: 15 }
    # Prepaid compute packs: credit bought up front, with bonus credit on the larger packs, valid
    # `validMonths` months and spent at the tier rates above on every paid plan. PROPOSAL (`proposal:
    # true`): the amounts and bonuses are to be confirmed before paid plans open; the website says so.
    # Shown on the pricing pages only: billing does not sell packs yet (docs/billing.md).
    packs:
      proposal: true
      validMonths: 12
      items:
        - { price: 2500, bonusPercent: 0 }
        - { price: 5000, bonusPercent: 10 }
        - { price: 10000, bonusPercent: 15 }
        - { price: 25000, bonusPercent: 20 }
  # Default monthly compute spend caps (minor units, 0 = none); accounts and org admins may change theirs.
  limits:
    user: { monthlyCap: 5000, hardStop: true }
    org: { monthlyCap: 50000, hardStop: false }
  # Days after a failed payment before new paid lab starts are refused (running labs continue).
  dunning:
    graceDays: 7
  # Premium labs: the plan whose level unlocks the labs a rule matches (highest wins).
  premium:
    - plan: pro
      difficulties: [hard]
    - plan: premium
      difficulties: [hard]
      computeTiers: [heavy]
  items:
    - id: free
      name: Free
      audience: Try a lab before you decide
      kind: free
      level: 0
      description: Try one guided lab free of charge; add a card to run any Pod or VM lab and pay only for the compute you use.
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 1
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: 0
        ctfEvents: false
      includes:
        - One trial lab free of charge, no card needed
        - With a card on file, the Pod and VM labs, paying per compute minute
        - Skill tracking and the next-best-lab recommendation
        - Community support
      cta: { label: Get started, action: signin }
    - id: pro
      name: Pro
      audience: One person going for a certification
      kind: individual
      level: 1
      description: Unlocks the hard labs, timed exam simulations and CTF events, for one person. Compute billed on top.
      highlight: true
      prices:
        monthly: { amount: 900, lookupKey: ct_pro_monthly }
        yearly: { amount: 9000, lookupKey: ct_pro_yearly }
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 2
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: 4
        ctfEvents: true
      includes:
        - Hard labs on the Pod and VM lab types
        - Exam simulations with per-objective reports
        - Solo CTF investigations and public events
        - Email support
      cta: { label: Start Pro, action: checkout }
    - id: premium
      name: Premium
      audience: One person who wants every lab, hard Multi-VM included
      kind: individual
      level: 2
      description: Everything in Pro plus the hard multi-VM, kubeadm and network-topology labs. Compute billed on top.
      prices:
        monthly: { amount: 1900, lookupKey: ct_premium_monthly }
        yearly: { amount: 19000, lookupKey: ct_premium_yearly }
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 3
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: unlimited
        ctfEvents: true
      includes:
        - Every lab, including hard multi-VM, kubeadm and network labs
        - Unlimited exam simulations
        - Priority email support
      cta: { label: Start Premium, action: checkout }
    - id: team
      name: Team
      audience: Teams and organisations that train together
      kind: organisation
      level: 2
      description: Per seat, for organisations that train together, with SSO, cohorts and dashboards. Seated members get Premium; compute is billed to the organisation.
      prices:
        monthly: { amount: 1500, lookupKey: ct_team_seat_monthly }
        yearly: { amount: 15000, lookupKey: ct_team_seat_yearly }
      perSeat: true
      minSeats: 3
      entitlements:
        labHoursPerMonth: unlimited
        concurrentLabs: 2
        envTiers: [A, B, C, K, V, N]
        examSimulationsPerMonth: unlimited
        ctfEvents: true
      includes:
        - Premium labs for every seated member
        - Single sign-on with group-to-role mapping
        - Manager and instructor dashboards, cohorts, assignments
        - One compute bill for the organisation, with a spend cap
        - Priority support and onboarding
      cta: { label: Talk to sales, action: contact }
