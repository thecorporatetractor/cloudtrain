# Early-access waitlist: a section on the landing page (#waitlist) that posts to
# POST /api/public/waitlist. The gateway stores the entry (no email is sent) and
# an admin exports the list as CSV. The consent checkbox links to /legal/privacy
# (legal.privacy below, which describes the waitlist processing). `enabled: false`
# hides the section and the gateway refuses submissions. Every field but the email
# is optional here; set `required: true` to insist, `enabled: false` to drop one.
waitlist:
  enabled: true
  eyebrow: Early access
  title: Join the early-access waitlist
  body: Tell us where you are and we will reach out when your place opens. We use your answers to plan access for individuals and for teams, nothing else.
  submitLabel: Join the waitlist
  emailLabel: Work or personal email
  consentLabel: I agree that CloudTrain may store these details to contact me about early access. See the
  privacyLinkLabel: privacy notice
  note: One message when your place opens. You can ask us to delete your entry at any time.
  successTitle: You are on the list
  successBody: Thank you. We will email you once when early access opens for you.
  duplicateTitle: You are already on the list
  duplicateBody: This address is already registered, so there is nothing more to do. We will be in touch when your place opens.
  errorMessage: We could not save your details just now. Please try again in a few minutes, or write to us from the contact page.
  fields:
    organisation:
      label: Organisation
      placeholder: Company or school (optional)
    role:
      label: Role
      options: [Engineer or developer, Student or career changer, Team lead or manager, Instructor or trainer, Other]
    interest:
      label: I am interested as
      enterpriseLabel: An organisation or team
      individualLabel: An individual learner

