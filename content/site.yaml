# CloudTrain public website configuration (apps/web public routes, served by the
# gateway at GET /api/public/site). Schema: packages/lab-schema/schema/site.schema.json;
# reference: docs/website.md. A deployment replaces this file without a code change
# (CT_SITE_CONFIG=/path/to/site.yaml, e.g. a ConfigMap mount). Checked by
# tools/lab-verify (schema, highlighted domains, links, screenshots).
#
# Screenshots under /site/ are real mock-mode captures made by
# apps/web/scripts/site-shots.mjs (dark and light variants, WebP). The landing
# page adds the live catalog figures (labs, domains, exam simulations) from
# GET /api/public/catalog; nothing numeric is written here.
apiVersion: cloudtrain.dev/v1
kind: Site

brand:
  name: CloudTrain
  legalName: AzarGuard
  tagline: Hands-on labs on real infrastructure
  # The built-in logo is the CloudTrain mark and wordmark (apps/web/public/brand, drawn inline
  # per theme). Another brand sets its own images; the files below are the served defaults.
  # logo: /brand/cloudtrain-horizontal.svg
  # logoDark: /brand/cloudtrain-horizontal-white.svg
  favicon: /brand/favicon.svg

hero:
  eyebrow: Hands-on infrastructure training
  title: Learn infrastructure by operating it.
  subtitle: Practise Kubernetes, Linux, networking, containers, infrastructure as code and automation on real clusters, virtual machines and network devices. Solve a realistic problem, then validate the system you leave behind.
  primaryCta: { label: Explore the catalog, to: /catalog }
  secondaryCta: { label: See how it works, to: /#how-it-works }
  note: Browse the catalog without an account. Organisations sign in with their own identity provider.
  proof: [Graded on the end state, Isolated per learner, Reset and retry]
  preview:
    image: /site/workspace-dark.webp
    imageLight: /site/workspace-light.webp
    alt: A lab workspace. Left, the task, its objectives and five checks, one passing. Right, the topology of a workstation, a three-node kubeadm cluster and a registry, with a terminal into the cluster and a packet capture.
    width: 1440
    height: 900

highlightDomains: [kubernetes, linux, networking, containers, iac, automation]

howItWorks:
  - icon: route
    title: Choose a lab or a learning path
    body: Browse by domain, difficulty, duration or alignment to a public exam blueprint. Paths order labs from first contact to exam readiness.
  - icon: server
    title: Start a real environment
    body: The lab decides what you get, a pod, a virtual machine, a kubeadm or virtual cluster or a network topology, provisioned for you alone. Warm pools make most of them ready in seconds.
  - icon: terminal
    title: Solve the problem with the tools you would use at work
    body: Work in the browser terminal or over SSH with the real kubectl, systemd, nftables, Terraform, Ansible or router CLI. Hints are there when you want them.
  - icon: check
    title: Validate the resulting system state
    body: Validate as often as you like. Checks read the cluster, the files, the services and the devices you leave behind, never the commands you typed, and name the objective that is still open.

differentiators:
  - icon: server
    title: Real infrastructure, not pretend environments
    body: Every lab runs on a live topology, from kubeadm and virtual clusters to full virtual machines, container engines, and routers and switches wired on isolated layer-2 links. What you type is what runs, and what breaks stays broken until you fix it.
    figure:
      image: /site/topology-dark.webp
      imageLight: /site/topology-light.webp
      alt: The topology panel of a lab, a workstation, a three-node kubeadm cluster and a registry on two subnets, above a terminal listing the cluster's nodes.
      width: 1990
      height: 1494
  - icon: check
    title: Prove the outcome, not the commands
    body: Validation inspects the end state. Any correct approach passes, each check carries its own share of the score, and a failing check tells you what was expected and what was found, so you know which objective is still open.
    figure:
      image: /site/checks-dark.webp
      imageLight: /site/checks-light.webp
      alt: The checks panel of a lab after a validation run, one check passing and four failing, each with its weight.
      width: 702
      height: 526
  - icon: chart
    title: Turn practice into measurable progress
    body: Every graded check is evidence for the skills it exercises. Mastery per objective, readiness per exam blueprint and a recommended next lab show what you can do, and managers see the same for their team.
    figure:
      image: /site/skills-summary-dark.webp
      imageLight: /site/skills-summary-light.webp
      alt: The summary of the skills view for a Kubernetes security blueprint, readiness at 48 percent, skills practised 15 of 16, the skill with least evidence, and the first rows of the objective matrix.
      width: 1888
      height: 1416

features:
  - icon: graduation
    title: Exam-style simulations
    body: Timed practical simulations draw fresh tasks from large pools, run on one shared environment and report per objective against a pass mark.
  - icon: flag
    title: Capture-the-flag events
    body: Seeded incidents to investigate solo or as a team, with points, penalties, hints that cost and a live scoreboard.
  - icon: sparkles
    title: An adaptive learner model
    body: Each check feeds skill evidence into a mastery model, so the next recommended lab is the biggest step toward your goal at a level you are likely to pass.
  - icon: users
    title: Built for organisations
    body: Single sign-on, roles for learners, managers, instructors and admins, cohorts, assignments with due dates and an append-only audit log.

showcase:
  - title: Practise in a real workspace
    body: The task and its objectives on the left, the live topology and terminals on the right. Open a console on any node, capture packets on a link, split the terminal, and validate whenever you want.
    why: You learn in the layout you will work in, with nothing simulated between you and the system.
    figure:
      image: /site/workspace-dark.webp
      imageLight: /site/workspace-light.webp
      alt: A lab workspace with the task panel, a topology of three nodes and two terminals, one running a packet capture.
      width: 1440
      height: 900
  - title: Understand your results
    body: An exam simulation report scores every task against its objective weight and lists each check with what passed and what was not satisfied, next to the per-objective totals.
    why: You see exactly which objectives need work before the real exam, not just a percentage.
    figure:
      image: /site/exam-results-dark.webp
      imageLight: /site/exam-results-light.webp
      alt: An exam simulation report, tasks with their objective, weight, outcome and score, and totals per objective.
      width: 1440
      height: 900
  - title: Track practical readiness
    body: Mastery is estimated per skill from graded results, grouped by the objectives of a public exam blueprint, with the uncertainty shown where there is little evidence yet.
    why: Progress is measured on what you have demonstrated, so the readiness figure means something.
    figure:
      image: /site/skills-dark.webp
      imageLight: /site/skills-light.webp
      alt: The skills view, a readiness figure, skills practised and a matrix of objectives with a mastery estimate per skill.
      width: 1440
      height: 900
  - title: Build team capability
    body: Managers see members against competencies, framework readiness, time practised, overdue and at-risk work, and can assign labs, paths or a whole blueprint with a due date.
    why: Training becomes something you can plan and report on, not a licence count.
    figure:
      image: /site/team-dark.webp
      imageLight: /site/team-light.webp
      alt: A team dashboard, seven members against eleven competencies as a heatmap, with framework readiness and at-risk work below.
      width: 1440
      height: 900

audiences:
  - icon: user
    title: Individual learners
    body: Get practical experience with the technologies you want to work with, in environments you can break and reset.
    points:
      - Browse every lab, path and course without an account
      - Hints that cost nothing in learning labs
      - A recommended next lab based on your results
    cta: { label: Explore labs and paths, to: /catalog }
  - icon: graduation
    title: Certification candidates
    body: Practise the objectives of a public exam blueprint on realistic tasks and see which ones still need work.
    points:
      - Timed simulations with tasks drawn from large pools
      - A report per task and per objective against a pass mark
      - Retakes draw different tasks with different parameters
    cta: { label: Explore exam simulations, to: /catalog#exams }
  - icon: building
    title: Organisations and teams
    body: Repeatable exercises and practical assessments for a whole team, with the visibility to plan training and report on it.
    points:
      - Single sign-on with group-to-role mapping
      - Assignments, cohorts and live instructor boards
      - Competency heatmaps and framework readiness per team
    cta: { label: Talk to us about team training, to: /contact }

faq:
  - group: Labs
    featured: true
    q: Are the environments real?
    a: Yes. A lab topology is provisioned on the platform's Kubernetes cluster as containers, virtual machines, kubeadm or virtual clusters and network devices wired on isolated layer-2 links. Nothing is a mock-up of a shell.
  - group: Labs
    featured: true
    q: How is a lab graded?
    a: On the end state. Checks query the cluster, read files, inspect services or ask network devices after you validate. The commands you used are never part of the grade, so any correct approach passes.
  - group: Labs
    featured: true
    q: Can I break things?
    a: Please do. Each environment is yours alone, can be reset, and ends when the session expires. Nothing you do reaches other learners or the platform.
  - group: Exam simulations
    featured: true
    q: Do the simulations grant a certification?
    a: No. Simulations cover objectives aligned to public exam blueprints and report how ready you are. They are not affiliated with any certifying body and confer no certification.
  - group: Exam simulations
    q: Do retakes draw the same tasks?
    a: No. Each attempt draws from pools at least twice the size of the exam, and every task randomises its parameters, so two attempts can be fully disjoint.
  - group: Organisations
    featured: true
    q: How do my people sign in?
    a: Through your identity provider over OpenID Connect, with group-to-role mapping. A verified email domain routes your people to your provider automatically.
  - group: Organisations
    featured: true
    q: Where does our data live?
    a: In a Postgres database with row-level security on every organisation-scoped row, inside the deployment you choose. Self-hosted deployments keep everything on your infrastructure.
  - group: Plans
    q: Is there a free plan?
    a: Yes. The Free plan gives a few lab hours a month on the unprivileged tiers so you can see how grading and the skill model work. Pro and Team add every tier, exam simulations and events.
  - group: Plans
    q: Individual or organisation?
    a: Pro is for one person and is billed monthly or yearly. Team is per seat for organisations and adds single sign-on, cohorts, manager dashboards and private events. Seats can be reassigned as people change.
  - group: Plans
    q: Are the prices final?
    a: Not yet. The amounts on the pricing page are placeholders while plans are finalised. Nothing is charged until checkout opens; until then every plan starts with a conversation.
  - group: Plans
    q: How do you handle payment details?
    a: Payments will be processed by Stripe. Card details never reach the platform; we store only the subscription state needed to grant entitlements.
  - group: Content
    q: Who writes the labs?
    a: Every lab is original, set in fictional organisations and verified end to end by an automated solver before it is published. Nothing is taken from exam material.

about:
  title: Why CloudTrain exists
  paragraphs:
    - Most infrastructure training stops at videos and quizzes. The skills that matter, debugging a node that will not join, recovering an etcd member, isolating a workload with a network policy, are only learned by doing them on systems that behave like production.
    - CloudTrain gives every learner a real, disposable environment and grades the result, not the path. The same platform serves individuals preparing for a practical exam and organisations upskilling whole teams, with single sign-on, cohorts, assignments and an adaptive model that points each person to the next lab worth their time.
    - The platform is source-available. Code is published under the Business Source License, the content under a Creative Commons licence, so you can read how every lab is built and graded.
  facts:
    - label: Domains
      value: Kubernetes, Linux, containers, IaC, automation, networking
    - label: Runtime
      value: Any conformant Kubernetes cluster, with KubeVirt for VMs
    - label: Identity
      value: OpenID Connect, group-to-role mapping, row-level security
    - label: Licence
      value: BUSL-1.1 code, CC BY-NC 4.0 content

