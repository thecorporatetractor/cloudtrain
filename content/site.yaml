legal:
  alignmentNotice: CloudTrain is not affiliated with or endorsed by the Cloud Native Computing Foundation, The Linux Foundation, Red Hat, CompTIA, the Linux Professional Institute, Cisco, HashiCorp, Docker or any other certifying body. Exam and product names are trademarks of their owners. Paths and simulations cover objectives aligned to public exam blueprints; completing them confers no certification.
  terms:
    title: Terms of service
    updated: 2026-11-02
    placeholder: false
    sections:
      - title: The service
        paragraphs:
          - CloudTrain provides hands-on training environments, graded labs, exam simulations and related reporting ("the service") to individuals and organisations. The service is operated by Marco Azarmaneche, who runs CloudTrain, until a company is registered. Contact gdpr@cloudtrain.app for data protection matters and hello@cloudtrain.app for everything else.
          - Environments are provisioned for the duration of a session and destroyed afterwards. Work left in an environment is not preserved beyond the session unless the lab says so.
      - title: Acceptable use
        paragraphs:
          - Environments are for the training exercises offered. Using them to attack systems outside the platform, to mine, to host services for third parties or to circumvent isolation is prohibited and ends the account.
      - title: Content and intellectual property
        paragraphs:
          - Lab content is licensed under CC BY-NC 4.0; platform code under the Business Source License 1.1. Exam simulations are original work aligned to public blueprints and are not affiliated with any certifying body.
      - title: Accounts, plans and payment
        paragraphs:
          - Paid plans, seat counts, renewals, cancellation and refunds will be described here before paid plans open. Nothing is charged today. How we handle personal data is described in the privacy notice.
      - title: Liability
        paragraphs:
          - The service is provided as is for training purposes. To the extent permitted by law, liability is limited to the fees paid in the twelve months before a claim.
  privacy:
    title: Privacy notice
    updated: 2026-11-02
    placeholder: false
    sections:
      - title: Who is responsible
        paragraphs:
          - 'The controller for the data described here is Marco Azarmaneche, who runs CloudTrain, until a company is registered. For privacy questions and to exercise your rights, write to gdpr@cloudtrain.app. General questions go to hello@cloudtrain.app. We have not appointed a data protection officer.'
          - 'This notice covers this website and its early-access waitlist, which is all that runs here today. There is no sign-in and nothing is charged. We will update this notice before that changes.'
      - title: Early-access waitlist
        paragraphs:
          - 'If you join the waitlist we store your email address, the optional organisation, role and interest you give, and the record of your consent: the time you agreed, which wording you agreed to, the date of this notice and the form you used. We use them only to contact you about early access and to plan access for individuals and teams. The legal basis is your consent (Art. 6(1)(a) GDPR).'
          - 'Waitlist emails are only about early access and your place: a confirmation when you join, a message when your place opens, and occasional updates such as a changed opening date or your entry expiring. They are not marketing. We do not track whether you open them or click anything, and each one has a link to leave.'
          - 'Your IP address is not stored with the entry. It is processed briefly on the way there, as described below under "What else we process and why".'
          - 'You can leave or ask us to delete your entry at any time (see your rights below).'
      - title: What else we process and why
        paragraphs:
          - 'Your connection. Every request to this website passes through Cloudflare and then a small server of ours, which pass your form details on without keeping them. Cloudflare sees your IP address and your traffic in transit, to deliver and protect the website. Our server holds your IP address in memory for up to an hour to limit abuse of the forms. Our application logs keep at most the network part of the address, not the whole of it, and never your email address. The legal basis is our legitimate interest in keeping the website available and secure (Art. 6(1)(f)). You can object to this (see your rights).'
          - 'Privacy requests. When you use the privacy request page we hold your address and what you asked for until the request is finished, or for a day if you do not confirm it, and we email you a confirmation link and the result. The legal basis is our legal obligation to answer you (Art. 6(1)(c)).'
          - 'Security logs. We keep security logs of access to our storage and of deletion events. We use them to keep the website secure and to investigate abuse. The legal basis is our legitimate interest in security (Art. 6(1)(f)). You can object to this (see your rights).'
          - 'Messages to us. If you email hello@cloudtrain.app or gdpr@cloudtrain.app we process your message and address to answer you, on the basis of our legitimate interest in handling your request (Art. 6(1)(f)).'
      - title: Who receives your data
        paragraphs:
          - 'We use these processors and recipients: Cloudflare, which delivers and protects the website and sees IP addresses and traffic in transit; Microsoft Azure, which hosts the server the website runs on, stores the waitlist in encrypted tables, sends waitlist and privacy emails through Azure Communication Services and holds our security logs; and Microsoft 365, which hosts the hello@cloudtrain.app and gdpr@cloudtrain.app mailboxes. To deliver an email, Azure Communication Services receives the address it goes to, and Microsoft temporarily keeps addresses that bounce permanently, to prevent spam and abuse.'
          - 'We do not sell personal data. We disclose it to authorities only where the law requires.'
      - title: Transfers outside the EU
        paragraphs:
          - 'The server and the waitlist are hosted in the European Union. Cloudflare runs a global network: your connection is handled at a data centre near you, which can be outside the EU, and your request can cross it on its way to our server. Cloudflare and Microsoft are or may be based in, or support their services from, the United States, so some data can be transferred there. Where that happens we rely on the European Commission''s adequacy decision for the EU-US Data Privacy Framework, for providers certified under it, or on the standard contractual clauses in the provider''s data processing terms. You can ask us for a copy of the safeguards used.'
      - title: How long we keep it
        paragraphs:
          - 'Waitlist entries: until you withdraw consent or ask us to delete them, and in any case no longer than 24 months after you joined.'
          - 'Privacy requests: until finished, or a day if not confirmed.'
          - 'IP addresses: in our server''s memory for up to an hour. Cloudflare keeps its own traffic logs under its terms.'
          - 'Application logs: 90 days.'
          - 'Security logs: 13 months.'
          - 'Backups: each night the waitlist is copied to a private, encrypted storage container, and each copy is deleted after 14 days. When we delete an entry, it can remain in those copies for up to 14 days and is then removed with them. We do not restore deleted data from backups except to recover from a failure, and then we delete it again, using the deletion record below.'
          - 'Deletion record: when we delete data at your request, we keep a minimal record to show that we did it: the time, the type of request, the categories of data removed and a keyed hash of your email address, not the address itself. A keyed hash can still be personal data, because someone with the key can check whether a given address matches. We keep the record for 3 years on the basis of our legal obligation and legitimate interest in demonstrating compliance (Art. 5(2) and Art. 17 GDPR), and then delete it.'
      - title: Your rights
        paragraphs:
          - 'You have the right to access your data and receive a copy, to have it corrected, to have it erased, to restrict its processing, to receive the data you gave us in a portable format, and to object to processing based on legitimate interest. Where processing rests on your consent, such as the waitlist, you can withdraw consent at any time; this does not affect processing before the withdrawal.'
          - 'To exercise a right, use our privacy request page at /legal/privacy-request or email gdpr@cloudtrain.app. We answer within one month. If a request is complex or we receive many, we may extend that by up to two further months and will tell you why. We may need to verify your identity first, for example by sending a message to the address concerned, so that we do not give your data to someone else.'
          - 'You also have the right to complain to a supervisory authority, in the EU country where you live or work, or to ours, the Romanian data protection authority ANSPDCP (dataprotection.ro, anspdcp@dataprotection.ro). You do not have to give any data you do not want to. Without an email address we cannot run the waitlist.'
      - title: Automated decisions
        paragraphs:
          - 'We make no decisions about you based solely on automated processing.'
      - title: Security
        paragraphs:
          - 'We design our infrastructure against the SOC 2 Trust Services Criteria for security, availability and confidentiality. We have not yet completed an independent SOC 2 audit and do not hold a SOC 2 report.'
          - 'This website is built with these measures: hosting in the European Union; no personal data stored on the server that serves the website; the waitlist in encrypted Azure Tables, with keys that we manage in Azure Key Vault, plus a second layer of infrastructure encryption; managed identities instead of stored credentials between our services; and access and deletion logs kept in a security log in Microsoft Sentinel. Connections to the website are encrypted in transit.'
          - 'If a breach puts your rights at risk we notify the supervisory authority and, where required, you.'
      - title: Changes to this notice
        paragraphs:
          - 'When we change this notice we update the date at the top. We tell you of material changes in advance where we have your email address.'
  cookies:
    title: Cookie notice
    updated: 2026-11-02
    placeholder: false
    sections:
      - title: What this covers
        paragraphs:
          - This notice lists the cookies and similar browser storage (localStorage and sessionStorage) the website and the CloudTrain app use. CloudTrain uses only what the site needs to work. We set no analytics or advertising cookies and load no third-party tracking scripts, so we show no consent banner. The controller is Marco Azarmaneche, who runs CloudTrain; see the privacy notice for contact details.
      - title: Strictly necessary
        paragraphs:
          - "ct_session. Cookie. Keeps you signed in to the app. Set by CloudTrain (first party), only after you sign in. Lasts for the session, at most 12 hours, and ends sooner after 2 hours of inactivity or when you sign out. Strictly necessary."
          - 'Cloudflare, which delivers this website, sets no cookie with the settings we use. We do not use its bot features, which would add one called __cf_bm; if that changes we list it here first.'
      - title: Preferences and layout
        paragraphs:
          - "ct.theme. localStorage. Remembers light or dark mode. Set by CloudTrain. Stays until you clear your browser data. It stores a setting you chose and does not identify you; we treat it as strictly necessary for the function you asked for."
          - "ct.nav.collapsed, ct.workspace.layout and the panel size entries whose names contain ct.ws or ct.exam. localStorage. Remember the layout of the lab workspace and the side navigation. Set by CloudTrain. Stay until you clear your browser data. Strictly necessary for the layout you chose."
          - "ct.exam.visited.<attempt>. sessionStorage. Remembers which exam tasks you opened during an attempt. Set by CloudTrain. Removed when you close the tab. Strictly necessary."
      - title: Questions
        paragraphs:
          - Questions about cookies can go to gdpr@cloudtrain.app. You can delete cookies and site data in your browser settings at any time.

