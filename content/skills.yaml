# CloudTrain skill graph.
#
# domain -> competency -> skill. Skill ids are globally unique and stable
# (`<domain>.<competency>.<skill>`): checks in labs reference them, frameworks map
# onto them and the learner model stores ability per skill id. Rename = migration.
#
# `requires` lists prerequisite skills (edges must point at existing skills and the
# graph must stay acyclic; tools/lab-verify enforces both). The recommender only
# proposes work whose prerequisites are satisfied.
apiVersion: cloudtrain.dev/v1
kind: SkillGraph
domains:
  # ---------------------------------------------------------------- Linux
  - id: linux
    title: Linux administration
    competencies:
      - id: linux.shell
        title: Shell and text processing
        skills:
          - id: linux.shell.navigation
            title: Navigate the filesystem and read files from the shell
          - id: linux.shell.redirection
            title: Redirect and pipe command output into files and other commands
            requires: [linux.shell.navigation]
          - id: linux.shell.text-processing
            title: Filter and count text with grep, awk, sort, wc and cut
            requires: [linux.shell.redirection]
          - id: linux.shell.scripting
            title: Write small bash scripts with variables, loops and exit codes
            requires: [linux.shell.text-processing]
      - id: linux.files
        title: Files and permissions
        skills:
          - id: linux.files.permissions
            title: Read and change ownership, mode bits and umask
            requires: [linux.shell.navigation]
          - id: linux.files.links-archives
            title: Work with links, tar and compressed archives
            requires: [linux.shell.navigation]
      - id: linux.users
        title: Users and privilege
        skills:
          - id: linux.users.accounts
            title: Manage users, groups and password policy
            requires: [linux.files.permissions]
          - id: linux.users.sudo
            title: Use and configure sudo for privilege escalation
            requires: [linux.users.accounts]
      - id: linux.systemd
        title: Services and boot
        skills:
          - id: linux.systemd.units
            title: Start, stop, enable and inspect systemd services
            requires: [linux.users.sudo]
          - id: linux.systemd.unit-editing
            title: Edit unit files and drop-ins, then reload the manager
            requires: [linux.systemd.units]
          - id: linux.systemd.journal
            title: Read service logs with journalctl
            requires: [linux.systemd.units]
      - id: linux.packages
        title: Software management
        skills:
          - id: linux.packages.apt
            title: Install, upgrade and query packages with apt and dpkg
            requires: [linux.users.sudo]
          - id: linux.packages.version-pinning
            title: Install exact package versions and hold/unhold them
            requires: [linux.packages.apt]
          - id: linux.packages.repositories
            title: Add and switch package repositories and signing keys
            requires: [linux.packages.apt]
      - id: linux.remote
        title: Remote access
        skills:
          - id: linux.remote.ssh
            title: Connect to hosts with ssh and ssh config, copy files with scp
            requires: [linux.shell.navigation]
      - id: linux.security
        title: Host security
        skills:
          - id: linux.security.tls-certificates
            title: Identify CA, certificate and key files and inspect them with openssl
            requires: [linux.files.permissions]
          - id: linux.security.mac
            title: Work with AppArmor and SELinux confinement
            requires: [linux.systemd.units]
      - id: linux.storage
        title: Storage
        skills:
          - id: linux.storage.filesystems
            title: Create and check filesystems
            requires: [linux.users.sudo]
          - id: linux.storage.mounts
            title: Mount filesystems persistently with fstab and systemd mounts
            requires: [linux.storage.filesystems]
          - id: linux.storage.lvm
            title: Manage LVM physical volumes, volume groups and logical volumes
            requires: [linux.storage.filesystems]
      - id: linux.processes
        title: Processes and scheduling
        skills:
          - id: linux.processes.management
            title: Inspect and signal processes, manage priorities
            requires: [linux.shell.navigation]
          - id: linux.processes.scheduled-jobs
            title: Schedule jobs with cron and systemd timers
            requires: [linux.systemd.units]
      - id: linux.net
        title: Host networking
        skills:
          - id: linux.net.ip-config
            title: Configure addresses, routes and interfaces with ip and netplan
            requires: [linux.users.sudo]
          - id: linux.net.name-resolution
            title: Configure and debug name resolution
            requires: [linux.net.ip-config]
          - id: linux.net.firewall
            title: Filter traffic with nftables
            requires: [linux.net.ip-config]
          - id: linux.net.troubleshooting
            title: Diagnose connectivity with ss, curl, ping and tcpdump
            requires: [linux.net.ip-config]

  # ---------------------------------------------------------------- Networking
  - id: net
    title: Network administration
    competencies:
      - id: net.fundamentals
        title: Fundamentals
        skills:
          - id: net.fundamentals.models
            title: Explain the OSI and TCP/IP models and encapsulation
          - id: net.fundamentals.tcp-udp-ports
            title: Reason about TCP/UDP ports and connection setup
            requires: [net.fundamentals.models]
      - id: net.addressing
        title: Addressing
        skills:
          - id: net.addressing.ipv4-subnetting
            title: Plan and calculate IPv4 subnets
            requires: [net.fundamentals.models]
          - id: net.addressing.ipv6
            title: Configure and verify IPv6 addressing
            requires: [net.addressing.ipv4-subnetting]
      - id: net.switching
        title: Switching
        skills:
          - id: net.switching.vlans
            title: Configure access ports and VLANs
            requires: [net.fundamentals.models]
          - id: net.switching.trunking
            title: Configure 802.1Q trunks and the native VLAN
            requires: [net.switching.vlans]
          - id: net.switching.stp
            title: Explain and tune rapid spanning tree
            requires: [net.switching.trunking]
          - id: net.switching.etherchannel
            title: Bundle links with LACP
            requires: [net.switching.trunking]
      - id: net.routing
        title: Routing
        skills:
          - id: net.routing.static
            title: Configure static and default routes
            requires: [net.addressing.ipv4-subnetting]
          - id: net.routing.ospf
            title: Configure single-area OSPFv2
            requires: [net.routing.static]
          - id: net.routing.fhrp
            title: Explain first-hop redundancy protocols
            requires: [net.routing.static]
      - id: net.services
        title: IP services
        skills:
          - id: net.services.dhcp
            title: Configure DHCP servers and relays
            requires: [net.addressing.ipv4-subnetting]
          - id: net.services.dns
            title: Explain DNS resolution in the network
            requires: [net.fundamentals.tcp-udp-ports]
          - id: net.services.nat
            title: Configure static NAT and PAT
            requires: [net.routing.static]
          - id: net.services.ntp
            title: Configure NTP clients and servers
            requires: [net.fundamentals.tcp-udp-ports]
          - id: net.services.monitoring
            title: Use syslog and SNMP for monitoring
            requires: [net.fundamentals.tcp-udp-ports]
      - id: net.security
        title: Network security
        skills:
          - id: net.security.acls
            title: Write and apply standard and extended ACLs
            requires: [net.fundamentals.tcp-udp-ports, net.addressing.ipv4-subnetting]
          - id: net.security.port-security
            title: Apply port security and DHCP snooping
            requires: [net.switching.vlans]
          - id: net.security.vpn
            title: Explain site-to-site and remote-access VPNs
            requires: [net.routing.static]
      - id: net.wireless
        title: Wireless
        skills:
          - id: net.wireless.fundamentals
            title: Explain WLAN architecture and security
            requires: [net.fundamentals.models]
      - id: net.automation
        title: Automation
        skills:
          - id: net.automation.apis
            title: Use REST APIs and structured data (JSON/YAML) to manage devices
            requires: [net.fundamentals.tcp-udp-ports]

  # ---------------------------------------------------------------- Kubernetes
  - id: k8s
    title: Kubernetes
    competencies:
      - id: k8s.cli
        title: kubectl and manifests
        skills:
          - id: k8s.cli.contexts
            title: Inspect and switch kubeconfig contexts and namespaces
            requires: [linux.shell.navigation]
          - id: k8s.cli.imperative
            title: Create and change objects with imperative kubectl commands
            requires: [k8s.cli.contexts]
          - id: k8s.cli.manifests
            title: Write, generate (--dry-run) and apply YAML manifests
            requires: [k8s.cli.imperative]
          - id: k8s.cli.edit-patch
            title: Change live objects with kubectl edit, patch and set
            requires: [k8s.cli.manifests]
          - id: k8s.cli.output-formatting
            title: Extract fields with -o jsonpath, custom-columns and selectors
            requires: [k8s.cli.imperative, linux.shell.text-processing]
      - id: k8s.workloads
        title: Workloads
        skills:
          - id: k8s.workloads.pods
            title: Create and inspect Pods
            requires: [k8s.cli.imperative]
          - id: k8s.workloads.multi-container-pods
            title: Design Pods with several app containers sharing a lifecycle
            requires: [k8s.workloads.pods, k8s.cli.manifests]
          - id: k8s.workloads.native-sidecars
            title: Use init containers and native sidecars correctly
            requires: [k8s.workloads.multi-container-pods]
          - id: k8s.workloads.deployments
            title: Create Deployments and reason about their Pod template
            requires: [k8s.workloads.pods]
          - id: k8s.workloads.scaling
            title: Scale workloads manually and verify readiness
            requires: [k8s.workloads.deployments]
          - id: k8s.workloads.rollouts
            title: Trigger, watch and roll back Deployment rollouts
            requires: [k8s.workloads.deployments]
          - id: k8s.workloads.daemonsets
            title: Run per-node agents with DaemonSets
            requires: [k8s.workloads.deployments]
          - id: k8s.workloads.statefulsets
            title: Run ordered, stable-identity workloads with StatefulSets
            requires: [k8s.workloads.deployments, k8s.storage.claims]
          - id: k8s.workloads.config
            title: Inject configuration with ConfigMaps and Secrets
            requires: [k8s.workloads.pods]
          - id: k8s.workloads.resources
            title: Set requests, limits and understand QoS classes
            requires: [k8s.workloads.pods]
          - id: k8s.workloads.probes
            title: Configure liveness, readiness and startup probes
            requires: [k8s.workloads.pods]
          - id: k8s.workloads.autoscaling
            title: Configure HorizontalPodAutoscalers
            requires: [k8s.workloads.scaling, k8s.workloads.resources]
      - id: k8s.scheduling
        title: Scheduling and nodes
        skills:
          - id: k8s.scheduling.node-status
            title: Read node conditions, readiness and capacity
            requires: [k8s.cli.imperative]
          - id: k8s.scheduling.node-labels
            title: Discover and manage node labels
            requires: [k8s.scheduling.node-status]
          - id: k8s.scheduling.node-selector
            title: Pin Pods to nodes with nodeSelector
            requires: [k8s.scheduling.node-labels, k8s.workloads.pods]
          - id: k8s.scheduling.node-affinity
            title: Express placement with node and pod (anti-)affinity
            requires: [k8s.scheduling.node-selector]
          - id: k8s.scheduling.taints-tolerations
            title: Interpret taint effects and add tolerations
            requires: [k8s.scheduling.node-status]
          - id: k8s.scheduling.cordon-drain
            title: Cordon, drain and uncordon nodes for maintenance
            requires: [k8s.scheduling.taints-tolerations, k8s.workloads.daemonsets]
          - id: k8s.scheduling.priority-preemption
            title: Use PriorityClasses and understand preemption
            requires: [k8s.scheduling.node-status]
      - id: k8s.networking
        title: Services and networking
        skills:
          - id: k8s.networking.services
            title: Expose Pods with ClusterIP Services and label selectors
            requires: [k8s.workloads.deployments]
          - id: k8s.networking.named-ports
            title: Declare named container ports and target them from Services
            requires: [k8s.networking.services]
          - id: k8s.networking.nodeport
            title: Expose Services on node ports and reach them from outside
            requires: [k8s.networking.services]
          - id: k8s.networking.endpoints
            title: Verify Service backends with EndpointSlices
            requires: [k8s.networking.services]
          - id: k8s.networking.dns
            title: Resolve Services and Pods through cluster DNS
            requires: [k8s.networking.services]
          - id: k8s.networking.ingress-gateway
            title: Route HTTP traffic with Ingress and Gateway API
            requires: [k8s.networking.services]
          - id: k8s.networking.netpol-basics
            title: Explain NetworkPolicy isolation and policy types
            requires: [k8s.networking.services]
          - id: k8s.networking.netpol-selectors
            title: Select peers by namespace and pod labels in NetworkPolicy
            requires: [k8s.networking.netpol-basics]
          - id: k8s.networking.netpol-ports
            title: Restrict NetworkPolicy rules to specific ports and protocols
            requires: [k8s.networking.netpol-basics, net.fundamentals.tcp-udp-ports]
          - id: k8s.networking.connectivity-testing
            title: Prove allowed and denied paths with in-cluster probes
            requires: [k8s.networking.netpol-basics, linux.net.troubleshooting]
          - id: k8s.networking.cni
            title: Explain CNI plugins and pod networking
            requires: [k8s.networking.services]
      - id: k8s.storage
        title: Storage
        skills:
          - id: k8s.storage.persistent-volumes
            title: Create PersistentVolumes with a given volume source
            requires: [k8s.cli.manifests]
          - id: k8s.storage.access-modes
            title: Choose access modes and reclaim policies
            requires: [k8s.storage.persistent-volumes]
          - id: k8s.storage.capacity-units
            title: Write resource quantities with the correct binary/decimal suffix
            requires: [k8s.cli.manifests]
          - id: k8s.storage.claims
            title: Bind PersistentVolumeClaims and mount them in Pods
            requires: [k8s.storage.access-modes]
          - id: k8s.storage.storage-classes
            title: Use StorageClasses and dynamic provisioning
            requires: [k8s.storage.claims]
      - id: k8s.rbac
        title: Access control
        skills:
          - id: k8s.rbac.service-accounts
            title: Create ServiceAccounts and reference them as subjects
            requires: [k8s.cli.imperative]
          - id: k8s.rbac.roles
            title: Write namespaced Roles with least-privilege verbs and resources
            requires: [k8s.cli.manifests]
          - id: k8s.rbac.clusterroles
            title: Write ClusterRoles and know their API groups
            requires: [k8s.rbac.roles]
          - id: k8s.rbac.binding-scope
            title: Choose RoleBinding vs ClusterRoleBinding to scope a grant
            requires: [k8s.rbac.clusterroles, k8s.rbac.service-accounts]
          - id: k8s.rbac.auth-can-i
            title: Verify effective permissions with kubectl auth can-i --as
            requires: [k8s.rbac.binding-scope]
      - id: k8s.cluster
        title: Cluster lifecycle
        skills:
          - id: k8s.cluster.components
            title: Explain control-plane and node components and where they run
            requires: [k8s.scheduling.node-status]
          - id: k8s.cluster.kubeadm-install
            title: Bootstrap clusters and join nodes with kubeadm
            requires: [k8s.cluster.components, linux.packages.apt]
          - id: k8s.cluster.version-skew
            title: Apply the version-skew policy to plan upgrades
            requires: [k8s.cluster.components]
          - id: k8s.cluster.kubeadm-upgrade
            title: Upgrade a control plane with kubeadm plan/apply
            requires: [k8s.cluster.version-skew, k8s.scheduling.cordon-drain, linux.packages.version-pinning, linux.remote.ssh]
          - id: k8s.cluster.kubelet
            title: Upgrade, configure and restart the kubelet
            requires: [k8s.cluster.components, linux.systemd.units]
          - id: k8s.cluster.etcd-tls
            title: Authenticate to etcd with its CA, client certificate and key
            requires: [k8s.cluster.components, linux.security.tls-certificates]
          - id: k8s.cluster.etcd-snapshot
            title: Take and verify etcd snapshots
            requires: [k8s.cluster.etcd-tls]
          - id: k8s.cluster.etcd-restore
            title: Restore etcd from a snapshot and repoint the service
            requires: [k8s.cluster.etcd-snapshot, linux.systemd.unit-editing]
          - id: k8s.cluster.ha-control-plane
            title: Explain stacked vs external etcd HA control planes
            requires: [k8s.cluster.kubeadm-install]
          - id: k8s.cluster.packaging
            title: Install workloads with Helm and Kustomize
            requires: [k8s.cli.manifests]
          - id: k8s.cluster.extensions
            title: Work with CRDs, operators and the CNI/CSI/CRI interfaces
            requires: [k8s.cluster.components]
      - id: k8s.troubleshooting
        title: Troubleshooting
        skills:
          - id: k8s.troubleshooting.events
            title: Diagnose failures from describe output and events
            requires: [k8s.workloads.pods]
          - id: k8s.troubleshooting.logs
            title: Read container and component logs
            requires: [k8s.workloads.pods]
          - id: k8s.troubleshooting.nodes
            title: Diagnose NotReady nodes and kubelet failures
            requires: [k8s.scheduling.node-status, k8s.cluster.kubelet]
          - id: k8s.troubleshooting.control-plane
            title: Repair broken control-plane static Pods
            requires: [k8s.cluster.components, k8s.troubleshooting.logs]
          - id: k8s.troubleshooting.networking
            title: Debug Service, DNS and policy connectivity failures
            requires: [k8s.networking.endpoints, k8s.networking.dns]
      - id: k8s.security
        title: Security hardening
        skills:
          - id: k8s.security.pod-security-admission
            title: Enforce Pod Security Standards on namespaces
            requires: [k8s.workloads.pods]
          - id: k8s.security.security-context
            title: Harden Pods with securityContext (non-root, capabilities, read-only fs)
            requires: [k8s.workloads.pods]
          - id: k8s.security.seccomp-apparmor
            title: Confine containers with seccomp and AppArmor profiles
            requires: [k8s.security.security-context, linux.security.mac]
          - id: k8s.security.secrets
            title: Protect Secrets (encryption at rest, immutability, mounting)
            requires: [k8s.workloads.config]
          - id: k8s.security.sa-token-hygiene
            title: Limit ServiceAccount token automounting and scope
            requires: [k8s.rbac.service-accounts]
          - id: k8s.security.rbac-least-privilege
            title: Audit and reduce RBAC grants to least privilege
            requires: [k8s.rbac.auth-can-i]
          - id: k8s.security.netpol-default-deny
            title: Build default-deny ingress/egress baselines
            requires: [k8s.networking.netpol-selectors]
          - id: k8s.security.api-server-hardening
            title: Harden kube-apiserver flags and admission plugins
            requires: [k8s.troubleshooting.control-plane]
          - id: k8s.security.kubelet-hardening
            title: Restrict kubelet authentication and authorization
            requires: [k8s.cluster.kubelet]
          - id: k8s.security.audit-logging
            title: Write audit policies and read audit logs
            requires: [k8s.security.api-server-hardening]
          - id: k8s.security.cis-benchmark
            title: Assess clusters against the CIS benchmark
            requires: [k8s.security.api-server-hardening, k8s.security.kubelet-hardening]
          - id: k8s.security.supply-chain
            title: Scan, sign and admit images; minimise image footprint
            requires: [k8s.workloads.deployments]
          - id: k8s.security.runtime-detection
            title: Detect suspicious runtime behaviour with Falco-style rules
            requires: [k8s.troubleshooting.logs, linux.processes.management]
          - id: k8s.security.sandboxing
            title: Isolate workloads with RuntimeClasses and sandboxed runtimes
            requires: [k8s.cluster.extensions]
          - id: k8s.security.mtls
            title: Explain pod-to-pod encryption with mTLS meshes
            requires: [k8s.networking.services, linux.security.tls-certificates]
