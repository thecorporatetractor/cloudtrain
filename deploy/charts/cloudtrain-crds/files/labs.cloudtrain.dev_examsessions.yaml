---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: examsessions.labs.cloudtrain.dev
spec:
  group: labs.cloudtrain.dev
  names:
    categories:
    - cloudtrain
    kind: ExamSession
    listKind: ExamSessionList
    plural: examsessions
    shortNames:
    - es
    singular: examsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.examID
      name: Exam
      type: string
    - jsonPath: .spec.candidate.id
      name: Candidate
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.deadline
      name: Deadline
      type: date
    - jsonPath: .status.report.score
      name: Score
      type: string
    - jsonPath: .status.report.passed
      name: Passed
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ExamSession is one candidate attempt at an exam simulation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExamSessionSpec is one candidate attempt at an exam.
            properties:
              avoidTasks:
                description: |-
                  AvoidTasks are task ids from the candidate's earlier attempts. With
                  the template's retakePolicy.freshDraw, the draw takes them only when
                  an objective's pool has too few other tasks.
                items:
                  type: string
                type: array
                x-kubernetes-validations:
                - message: avoidTasks is immutable
                  rule: self == oldSelf
              candidate:
                description: LearnerRef identifies the learner owning a session.
                properties:
                  id:
                    description: ID is the stable learner id from the identity service.
                    minLength: 1
                    type: string
                  org:
                    type: string
                required:
                - id
                type: object
              duration:
                description: |-
                  Duration overrides the exam's durationMinutes (accommodations,
                  verification runs).
                type: string
              examTemplateRef:
                description: TemplateReference points at a LabTemplate in the session's
                  namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: examTemplateRef is immutable
                  rule: self == oldSelf
              retainEnvironment:
                description: |-
                  RetainEnvironment keeps the environment after grading (debugging);
                  by default it is torn down as soon as the report is written.
                type: boolean
              seed:
                description: Seed drives the draw and every task's params.
                format: int64
                type: integer
                x-kubernetes-validations:
                - message: seed is immutable
                  rule: self == oldSelf
              submit:
                description: |-
                  Submit ends the attempt before the deadline: the environment is frozen
                  and graded. It cannot be withdrawn.
                type: boolean
            required:
            - candidate
            - examTemplateRef
            - seed
            type: object
          status:
            description: ExamSessionStatus is the observed state of an attempt.
            properties:
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deadline:
                description: |-
                  Deadline is StartedAt + duration; at the deadline the environment is
                  frozen and graded.
                format: date-time
                type: string
              environmentReleased:
                description: EnvironmentReleased is true once every environment was
                  torn down.
                type: boolean
              environments:
                items:
                  description: ExamEnvironmentStatus mirrors one environment LabSession.
                  properties:
                    endpoints:
                      description: Endpoints are withdrawn once the environment is
                        frozen.
                      items:
                        description: Endpoint is how the access gateway reaches one
                          access point of a node.
                        properties:
                          access:
                            description: AccessType is a way a learner reaches a node.
                            enum:
                            - shell
                            - ssh
                            - console
                            - web
                            - rdp
                            type: string
                          command:
                            description: |-
                              Command is the program the access gateway starts for a k8s-exec
                              endpoint instead of a login shell, e.g. "vtysh" for a router console
                              (whitespace-separated argv; empty = login shell).
                            type: string
                          host:
                            description: Host is a DNS name or IP reachable from the
                              access gateway.
                            type: string
                          node:
                            type: string
                          port:
                            format: int32
                            type: integer
                          protocol:
                            description: Protocol is e.g. "k8s-exec", "ssh", "http".
                            type: string
                          secretRef:
                            description: |-
                              SecretRef points at the credential for this endpoint (kubeconfig,
                              password, private key) in the session's namespace.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          target:
                            description: Target is protocol-specific, e.g. "namespace/pod/container"
                              for k8s-exec.
                            type: string
                          url:
                            type: string
                        required:
                        - access
                        - node
                        - protocol
                        type: object
                      type: array
                    entryNode:
                      type: string
                    message:
                      type: string
                    name:
                      description: Name of the LabSession.
                      type: string
                    nodes:
                      items:
                        type: string
                      type: array
                    phase:
                      description: LabSessionPhase is the coarse lifecycle phase of
                        a LabSession.
                      enum:
                      - Pending
                      - Provisioning
                      - Ready
                      - Grading
                      - Hibernated
                      - Expired
                      - Failed
                      type: string
                    tasks:
                      description: Tasks are the indexes of the tasks it serves.
                      items:
                        format: int32
                        type: integer
                      type: array
                  required:
                  - name
                  - tasks
                  type: object
                type: array
              examID:
                type: string
              frozenAt:
                description: FrozenAt is when candidate access was revoked.
                format: date-time
                type: string
              grading:
                description: ExamGradingStatus tracks the post-exam grading.
                properties:
                  bootIDs:
                    additionalProperties:
                      type: string
                    description: BootIDs are the pre-reboot boot ids ("<env>/<node>"
                      -> id).
                    type: object
                  message:
                    type: string
                  passes:
                    items:
                      description: ExamGradingPass is one grading round over every
                        environment.
                      properties:
                        checks:
                          description: |-
                            Checks are per-task check results; IDs are "t<index>/<check id>".
                            Output is never kept.
                          items:
                            description: CheckResult is the outcome of one check.
                            properties:
                              durationMs:
                                format: int64
                                type: integer
                              id:
                                type: string
                              message:
                                description: Message is a short learner-safe explanation
                                  (never the expected value).
                                type: string
                              output:
                                description: Output is the check's raw output, truncated
                                  to 2 KiB, for authors.
                                type: string
                              passed:
                                type: boolean
                              skills:
                                items:
                                  type: string
                                type: array
                              weight:
                                description: Weight is a decimal, as in the template.
                                type: string
                            required:
                            - id
                            - passed
                            type: object
                          type: array
                        completedAt:
                          format: date-time
                          type: string
                        name:
                          description: |-
                            Name: initial, rerun (after the idempotency re-run) or reboot (after
                            rebooting the VMs).
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  rebootStartedAt:
                    format: date-time
                    type: string
                  requests:
                    additionalProperties:
                      format: int64
                      type: integer
                    description: Requests maps environment name to the validateRequest
                      in flight.
                    type: object
                  reruns:
                    items:
                      description: ExamRerunResult is the outcome of one task's idempotency
                        re-run.
                      properties:
                        message:
                          description: Message is learner-safe.
                          type: string
                        ok:
                          type: boolean
                        task:
                          format: int32
                          type: integer
                      required:
                      - ok
                      - task
                      type: object
                    type: array
                  stage:
                    description: |-
                      ExamGradingStage is the step of the post-exam grading:
                      Freeze -> Initial -> [Rerun -> RerunGrade] -> [Reboot -> RebootWait ->
                      RebootGrade] -> Done.
                    enum:
                    - Freeze
                    - Initial
                    - Rerun
                    - RerunGrade
                    - Reboot
                    - RebootWait
                    - RebootGrade
                    - Done
                    type: string
                  stageStartedAt:
                    description: StageStartedAt is when the current stage began (stage
                      timeouts).
                    format: date-time
                    type: string
                required:
                - stage
                type: object
              message:
                description: Message is learner-safe.
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ExamSessionPhase is the lifecycle phase of an attempt.
                enum:
                - Pending
                - Provisioning
                - InProgress
                - Grading
                - Completed
                - Failed
                type: string
              report:
                description: ExamScoreReport is the final result of an attempt.
                properties:
                  gradedAt:
                    format: date-time
                    type: string
                  objectives:
                    items:
                      description: ExamObjectiveReport is one objective in the score
                        report.
                      properties:
                        id:
                          type: string
                        score:
                          description: Score is the objective score in percent (mean
                            of its task scores).
                          type: string
                        tasks:
                          format: int32
                          type: integer
                        weight:
                          description: Weight is the objective's normalised share
                            of the total in percent.
                          type: string
                      required:
                      - id
                      - score
                      - tasks
                      - weight
                      type: object
                    type: array
                  partialCredit:
                    description: PartialCredit is how a task's checks turn into its
                      score.
                    enum:
                    - per-check
                    - per-task
                    - none
                    type: string
                  passMark:
                    type: string
                  passed:
                    type: boolean
                  passes:
                    description: Passes lists the grading passes that ran (initial,
                      rerun, reboot).
                    items:
                      type: string
                    type: array
                  score:
                    description: Score is the weighted total in percent (decimal,
                      one place).
                    type: string
                  tasks:
                    items:
                      description: ExamTaskReport is one task in the score report.
                      properties:
                        checks:
                          items:
                            description: |-
                              ExamCheckReport is one check in the score report (learner-safe: no
                              expected values, no raw output).
                            properties:
                              description:
                                description: Description is the author's learner-facing
                                  check summary.
                                type: string
                              failedAfterReboot:
                                description: 'FailedAfterReboot: passed before the
                                  reboot, failed after it.'
                                type: boolean
                              failedOnRerun:
                                description: |-
                                  FailedOnRerun: passed before the idempotency re-run, failed after it
                                  (or the re-run itself failed).
                                type: boolean
                              id:
                                type: string
                              message:
                                type: string
                              passed:
                                type: boolean
                              skills:
                                items:
                                  type: string
                                type: array
                              weight:
                                type: string
                            required:
                            - id
                            - passed
                            type: object
                          type: array
                        id:
                          type: string
                        index:
                          format: int32
                          type: integer
                        objective:
                          type: string
                        outcome:
                          description: TaskOutcome of a scored task.
                          enum:
                          - pass
                          - partial
                          - fail
                          type: string
                        score:
                          description: Score is the task score in percent (decimal,
                            one place).
                          type: string
                        title:
                          type: string
                        weight:
                          description: Weight is the task's share of the total in
                            percent (decimal).
                          type: string
                      required:
                      - checks
                      - id
                      - index
                      - objective
                      - outcome
                      - score
                      - title
                      - weight
                      type: object
                    type: array
                required:
                - gradedAt
                - objectives
                - passMark
                - passed
                - score
                - tasks
                type: object
              startedAt:
                description: StartedAt is when every environment became ready (the
                  timer starts).
                format: date-time
                type: string
              submittedAt:
                format: date-time
                type: string
              tasks:
                items:
                  description: |-
                    ExamTaskStatus is one drawn task. It never carries hints, solutions or
                    expected values: only what the candidate is meant to read.
                  properties:
                    contexts:
                      description: Contexts are the kubeconfig contexts of the task's
                        clusters.
                      items:
                        type: string
                      type: array
                    environment:
                      description: Environment is the LabSession holding the task.
                      type: string
                    estimatedMinutes:
                      format: int32
                      type: integer
                    id:
                      description: ID is the exam-task lab id.
                      type: string
                    index:
                      description: Index is the 1-based task number shown to the candidate.
                      format: int32
                      type: integer
                    nodes:
                      description: Nodes are the topology nodes the task uses (for
                        the terminal picker).
                      items:
                        type: string
                      type: array
                    objective:
                      description: Objective is the blueprint objective the task was
                        drawn for.
                      type: string
                    seed:
                      description: Seed resolved the task's params.
                      format: int64
                      type: integer
                    statement:
                      description: Statement is the task description with params resolved
                        (Markdown).
                      type: string
                    templateRef:
                      type: string
                    title:
                      type: string
                    weight:
                      description: Weight is the task's share of the total score in
                        percent (decimal).
                      type: string
                  required:
                  - environment
                  - id
                  - index
                  - objective
                  - seed
                  - statement
                  - templateRef
                  - title
                  - weight
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
