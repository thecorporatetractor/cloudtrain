---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: warmpools.labs.cloudtrain.dev
spec:
  group: labs.cloudtrain.dev
  names:
    categories:
    - cloudtrain
    kind: WarmPool
    listKind: WarmPoolList
    plural: warmpools
    shortNames:
    - wp
    singular: warmpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateRef.name
      name: Template
      type: string
    - jsonPath: .spec.size
      name: Size
      type: integer
    - jsonPath: .status.ready
      name: Ready
      type: integer
    - jsonPath: .status.provisioning
      name: Provisioning
      type: integer
    - jsonPath: .status.claimed
      name: Claimed
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WarmPool pre-provisions LabSessions of a template.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WarmPoolSpec keeps a number of pre-provisioned, unclaimed sessions of a
              template ready for instant hand-out.

              Pooled sessions are LabSessions named <pool>-<random>, labelled
              labs.cloudtrain.dev/warm-pool=<pool> plus every label of the WarmPool
              itself (so a manager restricted by --session-selector reconciles them),
              owned by the pool, each with its own random seed (params are fixed per
              pooled session). Unclaimed pooled sessions never expire. A LabSession
              with spec.warmPoolRef claims one (see LabSessionSpec.WarmPoolRef).
            properties:
              maxIdle:
                description: |-
                  MaxIdle recycles (deletes and replaces) an unclaimed pooled session
                  once it has existed this long. Empty: pooled sessions are kept until
                  claimed or the pool shrinks.
                type: string
              maxSurge:
                description: |-
                  MaxSurge caps how many pooled sessions provision at the same time
                  (VM-heavy labs: keep it at 1). Default 1.
                format: int32
                minimum: 1
                type: integer
              size:
                description: Size is the desired number of ready, unclaimed sessions.
                format: int32
                minimum: 0
                type: integer
              templateRef:
                description: TemplateReference points at a LabTemplate in the session's
                  namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - size
            - templateRef
            type: object
          status:
            description: WarmPoolStatus is the observed state of a WarmPool.
            properties:
              claimed:
                description: |-
                  Claimed is the number of sessions of this pool that were claimed and
                  still exist.
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              provisioning:
                description: Provisioning is the number of unclaimed sessions not
                  ready yet.
                format: int32
                type: integer
              ready:
                description: Ready is the number of ready, unclaimed sessions.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
