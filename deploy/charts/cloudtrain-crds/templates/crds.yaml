{{- /*
The CRDs are copies of services/lab-orchestrator/config/crd (tools/charts/sync.sh).
They are read with .Files.Get, not templated, because their descriptions contain
lab template syntax such as {{octet}}.
*/ -}}
{{- range $path, $_ := .Files.Glob "files/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $meta := $crd.metadata }}
{{- $annotations := default (dict) $meta.annotations }}
{{- if $.Values.keep }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
{{- $_ := set $meta "annotations" $annotations }}
{{- $labels := default (dict) $meta.labels }}
{{- $_ := set $labels "app.kubernetes.io/part-of" "cloudtrain" }}
{{- $_ := set $labels "app.kubernetes.io/managed-by" $.Release.Service }}
{{- $_ := set $labels "helm.sh/chart" (printf "%s-%s" $.Chart.Name $.Chart.Version) }}
{{- $_ := set $meta "labels" $labels }}
---
{{ toYaml $crd }}
{{- end }}
