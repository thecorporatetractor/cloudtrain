apiVersion: v2
name: cloudtrain
description: CloudTrain platform on any Kubernetes - gateway (BFF), web app, lab-orchestrator, exposure through Ingress or Gateway API. Install cloudtrain-crds first; cluster add-ons (KubeVirt, CDI, Multus, Kube-OVN) come from cloudtrain-prereqs or the platform team.
type: application
version: 0.1.0
# The image tag of gateway, web and lab-orchestrator unless image.tag is set
# (CI publishes main, sha-<commit> and semver tags to GHCR).
appVersion: "main"
kubeVersion: ">=1.30.0-0"
home: https://github.com/thecorporatetractor/cloudtrain
sources:
  - https://github.com/thecorporatetractor/cloudtrain
keywords: [training, labs, kubevirt]
