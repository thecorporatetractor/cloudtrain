# AKS with the application routing add-on (managed NGINX):
#   az aks approuting enable -g <rg> -n <cluster>
# TLS: cert-manager here; app routing can also take a Key Vault certificate
# (annotation kubernetes.azure.com/tls-cert-keyvault-uri, then tls.mode: external
# is not needed - the add-on writes the Secret named in tls.secretName).
# Managed NGINX gets security patches only until November 2026: the Gateway API
# (Istio-based app routing, or Application Gateway for Containers) is the long-term
# path - see values-envoy-gateway.yaml for the Gateway API shape.
host: labs.example.com
global:
  imageRegistry: myacr.azurecr.io/cloudtrain        # ACR import of GHCR (docs/deploy.md)
exposure:
  type: ingress
  ingress:
    className: webapprouting.kubernetes.azure.com
    annotations:
      # Terminal WebSockets stay open while a learner works.
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "1m"
tls:
  enabled: true
  mode: certManager
  secretName: cloudtrain-tls
  certManager:
    issuerRef: {name: letsencrypt, kind: ClusterIssuer}
gateway:
  existingSecret: cloudtrain-gateway
  oidc:
    issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
    clientId: <app-registration-client-id>
  # Azure CNI overlay pod CIDR (default 10.244.0.0/16) holds the NGINX pods.
  trustProxy: "10.244.0.0/16"
  nodeSelector: {kubernetes.azure.com/mode: system}
  tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
  # 2 environments per learner; 200 live sessions, 20 of them kept for exams.
  capacity: {maxSessionsPerLearner: 2, maxActiveSessions: 200, examReserve: 20}
web:
  nodeSelector: {kubernetes.azure.com/mode: system}
  tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
orchestrator:
  storageClass: managed-csi-premium
  # Azure CNI overlay pod CIDR: vcluster Endpoints may point only there.
  vclusterPodCIDRs: [10.244.0.0/16]
  # Cilium owns eth0; Kube-OVN runs behind Multus for the session networks.
  networkMode: secondary
  # Fail closed (values.yaml orchestrator.isolation): every lab pod runs in AKS Pod
  # Sandboxing (a Kata VM per pod) or a user namespace, never with host users.
  #   az aks nodepool add ... --workload-runtime KataVmIsolation --os-sku AzureLinux
  isolation:
    profile: production
    # The manager needs labctl preflight's kubelet verdict (lab pool PID limit and
    # seccompDefault): run it with lab nodes up and apply the ConfigMap it writes
    #   labctl preflight --lab-node-selector cloudtrain.dev/pool=labs \
    #     --lab-tolerations cloudtrain.dev/labs=true:NoSchedule \
    #     --node-configmap out.yaml --node-configmap-name cloudtrain/lab-node-preflight
    # (kubeletLimitsAttested is the escape hatch for a pool at zero; not used here.)
  sandboxes:
    A: {runtimeClass: kata-vm-isolation, fallback: fail}
    B: {runtimeClass: kata-vm-isolation, fallback: fail}
    C: {runtimeClass: kata-vm-isolation, fallback: fail}
    "N": {runtimeClass: kata-vm-isolation, fallback: fail}   # quoted: bare N is YAML 1.1 false
    V: {runtimeClass: kata-vm-isolation, fallback: fail}     # pods learners create inside vclusters
  # Lab pods and VMs on their own tainted, autoscaled pool (can scale to zero):
  #   az aks nodepool add -g <rg> --cluster-name <cluster> -n labs --min-count 0 --max-count 20 \
  #     --enable-cluster-autoscaler --labels cloudtrain.dev/pool=labs \
  #     --node-taints cloudtrain.dev/labs=true:NoSchedule
  # The platform stays on the system pool (gateway/web/orchestrator nodeSelector).
  # Taint that pool so only the platform (and AKS add-ons) run there:
  #   az aks nodepool update ... -n system --node-taints CriticalAddonsOnly=true:NoSchedule
  labNodes:
    nodeSelector: {cloudtrain.dev/pool: labs}
    tolerations: ["cloudtrain.dev/labs=true:NoSchedule"]
  nodeSelector: {kubernetes.azure.com/mode: system}
  tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
  images:
    mirrors:
      - ghcr.io/thecorporatetractor/cloudtrain=myacr.azurecr.io/cloudtrain
# A global session cap and compute ceiling, so the autoscaler cannot be driven
# past a budget. count/labsessions counts every session (vcluster labs too: their
# LabSessions live here); the compute ceiling covers this namespace only, and each
# vcluster host namespace (ct-vc-*) has its own quota (4 CPU, 8Gi), so vcluster
# compute is at most sessions x that. Per learner and the exam reserve: gateway.capacity.
# The lab pool's kubelet must cap PIDs and default seccomp (labctl preflight checks):
#   az aks nodepool add ... --kubelet-config kubelet.json
#   # kubelet.json: {"podMaxPids": 4096, "seccompDefault": "RuntimeDefault"}
sessions:
  quota:
    count/labsessions.labs.cloudtrain.dev: "200"
    requests.cpu: "200"
    requests.memory: 800Gi
    pods: "1500"
    requests.ephemeral-storage: 400Gi
    limits.ephemeral-storage: 4Ti
# Azure CNI powered by Cilium enforces NetworkPolicy (labctl preflight fails
# without an engine). Pin it at cluster creation:
#   az aks create ... --network-plugin azure --network-plugin-mode overlay \
#     --network-dataplane cilium --network-policy cilium
networkPolicy:
  enabled: true
  labs:
    defaultDeny: true
    denyCloudMetadata: true
  ingressNamespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: app-routing-system}
