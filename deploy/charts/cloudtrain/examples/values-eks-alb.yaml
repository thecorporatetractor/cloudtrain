# EKS with the AWS Load Balancer Controller: an internet-facing ALB, TLS from ACM
# (tls.mode: external - the ALB terminates TLS, no Secret in the cluster).
host: labs.example.com
global:
  imageRegistry: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/ghcr/thecorporatetractor/cloudtrain
exposure:
  type: ingress
  ingress:
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:123456789012:certificate/<id>
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      # Terminal WebSockets: the ALB's idle timeout (default 60 s).
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
tls:
  enabled: true
  mode: external
gateway:
  existingSecret: cloudtrain-gateway
  oidc:
    issuer: https://keycloak.example.com/realms/cloudtrain
  # target-type ip: the ALB connects from the VPC CIDR.
  trustProxy: "10.0.0.0/16"
orchestrator:
  storageClass: gp3
  images:
    mirrors:
      - ghcr.io=123456789012.dkr.ecr.eu-west-1.amazonaws.com/ghcr
      - docker.io=123456789012.dkr.ecr.eu-west-1.amazonaws.com/docker-hub
