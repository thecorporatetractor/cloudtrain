# EKS with an NLB in front of an in-cluster ingress controller (ingress-nginx,
# NGINX Inc., Traefik or Envoy). The NLB comes from the controller's Service:
#   service.beta.kubernetes.io/aws-load-balancer-type: external
#   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
#   service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
#   service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"   (+ use-proxy-protocol in the controller)
# TLS ends at the controller (cert-manager) so the gateway sees real client IPs
# through proxy protocol and X-Forwarded-For.
host: labs.example.com
global:
  imageRegistry: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/ghcr/thecorporatetractor/cloudtrain
exposure:
  type: ingress
  ingress:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
tls:
  enabled: true
  mode: certManager
  certManager:
    issuerRef: {name: letsencrypt, kind: ClusterIssuer}
gateway:
  existingSecret: cloudtrain-gateway
  oidc:
    issuer: https://keycloak.example.com/realms/cloudtrain
  trustProxy: "10.0.0.0/16"
orchestrator:
  storageClass: gp3
  images:
    mirrors:
      - ghcr.io=123456789012.dkr.ecr.eu-west-1.amazonaws.com/ghcr
      - docker.io=123456789012.dkr.ecr.eu-west-1.amazonaws.com/docker-hub
