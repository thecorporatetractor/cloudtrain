# Envoy Gateway (or any Gateway API implementation: Istio, Cilium, Traefik, Kong,
# NSX/Avi on vCenter). Either attach to a shared Gateway the platform team owns
# (parentRefs; TLS is configured on its listener), or let the chart create one.
host: labs.example.com
exposure:
  type: gatewayAPI
  gatewayAPI:
    parentRefs:
      - name: eg
        namespace: envoy-gateway-system
        sectionName: https
    # The terminal WebSocket must not hit a request timeout.
    timeouts:
      request: 0s
tls:
  enabled: true
  mode: external          # the shared Gateway's listener holds the certificate
gateway:
  existingSecret: cloudtrain-gateway
  oidc:
    issuer: https://keycloak.example.com/realms/cloudtrain
# Envoy's default stream idle timeout (5 min) would also close idle terminals.
extraObjects:
  - apiVersion: gateway.envoyproxy.io/v1alpha1
    kind: BackendTrafficPolicy
    metadata:
      name: '{{ include "ct.fullname" . }}'
    spec:
      targetRefs:
        - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: '{{ include "ct.fullname" . }}'}
      timeout:
        http:
          requestTimeout: 0s
          connectionIdleTimeout: 3600s
