# kind (dev) or the verify VM, alongside the dev setup: images loaded with
# `kind load`, the demo Postgres, plain HTTP, an ingress controller of your choice
# (e.g. Traefik or ingress-nginx installed for the test). The orchestrator is
# limited to this release's sessions namespace so it never reconciles the dev
# manager's or the batch runner's sessions.
host: cloudtrain.deploy.test
global:
  imageRegistry: ct-deploy
  imageTag: dev
  imagePullPolicy: Never
exposure:
  type: ingress
  ingress:
    className: traefik
tls:
  enabled: false
gateway:
  replicas: 1
  sessionsNamespace: ct-deploy-sessions
  oidc:
    issuer: http://keycloak.invalid/realms/cloudtrain
  secrets:
    create: true
    oidcClientSecret: not-a-real-secret
web:
  replicas: 1
  runtimeConfig:
    environment: kind
orchestrator:
  watchNamespace: ct-deploy-sessions
  vmDisks: ephemeral
postgres:
  demo:
    enabled: true
