# Generic NGINX ingress controller (ingress-nginx is retired upstream since March
# 2026; F5 NGINX Ingress Controller takes the same Ingress with its own annotations:
# nginx.org/proxy-read-timeout, nginx.org/websocket-services).
host: labs.example.com
exposure:
  type: ingress
  ingress:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
tls:
  enabled: true
  mode: secret            # an existing kubernetes.io/tls Secret
  secretName: cloudtrain-tls
gateway:
  existingSecret: cloudtrain-gateway
  oidc:
    issuer: https://keycloak.example.com/realms/cloudtrain
  # Org self-service SSO through Keycloak's admin API (CT_KEYCLOAK_ADMIN_CLIENT_SECRET
  # in the Secret).
  keycloak:
    url: https://keycloak.example.com
networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  # Keycloak calls the endpoints of IdPs org admins add: public addresses only.
  keycloakEgress:
    enabled: true
    namespace: keycloak
    podSelector:
      matchLabels: {app.kubernetes.io/name: keycloak}
    allowTo:
      # Keycloak's database (adjust to how Keycloak is deployed).
      - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: keycloak-postgresql}}}]
        ports: [{port: 5432}]
