# Generic NGINX ingress controller (ingress-nginx is retired upstream since March
# 2026; F5 NGINX Ingress Controller takes the same Ingress with its own annotations:
# nginx.org/proxy-read-timeout, nginx.org/websocket-services).
host: labs.example.com
exposure:
  type: ingress
  ingress:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
tls:
  enabled: true
  mode: secret            # an existing kubernetes.io/tls Secret
  secretName: cloudtrain-tls
gateway:
  existingSecret: cloudtrain-gateway
  oidc:
    issuer: https://keycloak.example.com/realms/cloudtrain
networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
