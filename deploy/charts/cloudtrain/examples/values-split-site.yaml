# The app on a subdomain, the public website on the apex (docs/deploy-website.md,
# "Website and app on separate origins"). This release serves only the app at
# https://app.cloudtrain.example (OIDC redirect URI https://app.cloudtrain.example/api/auth/callback,
# Stripe success/cancel and post-logout back to the app). The website at
# https://cloudtrain.example is the static build (pnpm --filter web build:site --
# --app-url https://app.cloudtrain.example --api-base https://app.cloudtrain.example)
# on any static host; website pages requested here redirect to it, and the gateway
# allows it in CT_CORS_ORIGINS for the public catalog and the waitlist.
host: app.cloudtrain.example
exposure:
  type: ingress
  ingress:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
tls:
  enabled: true
  mode: certManager
  secretName: cloudtrain-app-tls
gateway:
  existingSecret: cloudtrain-gateway
  oidc:
    issuer: https://keycloak.cloudtrain.example/realms/cloudtrain
web:
  runtimeConfig:
    siteUrl: https://cloudtrain.example
