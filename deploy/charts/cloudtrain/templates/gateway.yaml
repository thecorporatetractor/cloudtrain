{{- include "ct.validate" . }}
{{- if .Values.gateway.enabled }}
{{- $fullname := include "ct.fullname" . }}
{{- $g := .Values.gateway }}
{{- $name := printf "%s-gateway" $fullname }}
{{- $public := include "ct.publicUrl" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
# LabTemplates/LabSessions/ExamTemplates/ExamSessions in the sessions namespace and
# terminal exec into lab pods there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $g.sessionsNamespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [labs.cloudtrain.dev]
    resources: [labtemplates, labsessions, examtemplates, examsessions]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $g.sessionsNamespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $g.clusterCapacity }}
---
# Read-only, for the admin capacity view (nodes, pods, VMIs, pools, sessions).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-capacity-{{ .Release.Namespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [list]
  - apiGroups: [labs.cloudtrain.dev]
    resources: [labsessions, warmpools]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-capacity-{{ .Release.Namespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-capacity-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and $g.secrets.create (not $g.existingSecret) }}
---
{{- /*
  Keys left empty are read back from the existing Secret (lookup) or, only with
  secrets.generate, generated. helm template and Argo CD cannot look up, so
  generating there would rotate the session secret and the GDPR HMAC key on
  every render (signing everyone out and breaking the erasure ledger's hashes):
  without generate, an empty key that cannot be read back fails the render.
*/}}
{{- $prev := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := $g.secrets.sessionSecret }}
{{- if and (not $session) $prev }}{{ $session = index $prev.data "CT_SESSION_SECRET" | b64dec }}{{ end }}
{{- if and (not $session) $g.secrets.generate }}{{ $session = randAlphaNum 48 }}{{ end }}
{{- if not $session }}{{ fail "gateway.secrets.sessionSecret is empty and no existing Secret holds one: set it, use gateway.existingSecret, or set gateway.secrets.generate=true (helm install/upgrade only; never with helm template or Argo CD, which would rotate it on every render)" }}{{ end }}
{{- $gdprKey := $g.secrets.gdprHmacKey }}
{{- if and (not $gdprKey) $prev }}{{ $gdprKey = index $prev.data "CT_GDPR_HMAC_KEY" | default "" | b64dec }}{{ end }}
{{- if and (not $gdprKey) $g.secrets.generate }}{{ $gdprKey = randAlphaNum 64 }}{{ end }}
{{- if not $gdprKey }}{{ fail "gateway.secrets.gdprHmacKey is empty and no existing Secret holds one: set it (>= 32 chars, docs/gdpr.md), use gateway.existingSecret, or set gateway.secrets.generate=true (helm install/upgrade only; never with helm template or Argo CD, which would rotate it on every render)" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  CT_SESSION_SECRET: {{ $session | quote }}
  CT_GDPR_HMAC_KEY: {{ $gdprKey | quote }}
  CT_OIDC_CLIENT_SECRET: {{ required "gateway.secrets.oidcClientSecret is required with gateway.secrets.create" $g.secrets.oidcClientSecret | quote }}
  {{- with $g.secrets.keycloakAdminClientSecret }}
  CT_KEYCLOAK_ADMIN_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- if not .Values.postgres.demo.enabled }}
  CT_DATABASE_URL: {{ required "gateway.secrets.databaseUrl is required (or postgres.demo.enabled)" $g.secrets.databaseUrl | quote }}
  {{- if $g.migrate }}
  CT_DATABASE_OWNER_URL: {{ required "gateway.secrets.databaseOwnerUrl is required with gateway.migrate (the migrate Job runs as the schema owner)" $g.secrets.databaseOwnerUrl | quote }}
  {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with $g.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "ct.selector" (list . "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ $g.port }}
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $g.replicas }}
  selector:
    matchLabels:
      {{- include "ct.selector" (list . "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ct.labels" . | nindent 8 }}
        app.kubernetes.io/name: cloudtrain-gateway
        app.kubernetes.io/component: gateway
      {{- with $g.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "ct.pullSecrets" . | nindent 6 }}
      {{- include "ct.podSecurity" . | nindent 6 }}
      {{- if $g.migrate }}
      initContainers:
        # Waits, as the app role, until the migrate Job has applied this build's migrations.
        - name: wait-for-schema
          image: {{ include "ct.image" (list . $g) }}
          imagePullPolicy: {{ include "ct.pullPolicy" (list . $g) }}
          args: [dist/db/cli.js, wait]
          env:
            {{- include "ct.gatewayDbEnv" . | nindent 12 }}
          {{- include "ct.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "ct.image" (list . $g) }}
          imagePullPolicy: {{ include "ct.pullPolicy" (list . $g) }}
          ports:
            - {name: http, containerPort: {{ $g.port }}}
          env:
            - {name: CT_HOST, value: "0.0.0.0"}
            - {name: CT_PORT, value: {{ $g.port | quote }}}
            - {name: CT_KUBE_CONTEXT, value: in-cluster}
            - {name: CT_NAMESPACE, value: {{ $g.sessionsNamespace | quote }}}
            - {name: CT_FAILED_SESSION_RELEASE_MINUTES, value: {{ .Values.orchestrator.failedSessionReleaseMinutes | default 0 | quote }}}
            {{- with $g.capacity }}
            - {name: CT_MAX_SESSIONS_PER_LEARNER, value: {{ .maxSessionsPerLearner | default 3 | quote }}}
            - {name: CT_MAX_ACTIVE_SESSIONS, value: {{ .maxActiveSessions | default 0 | quote }}}
            - {name: CT_EXAM_SESSION_RESERVE, value: {{ .examReserve | default 0 | quote }}}
            {{- end }}
            - {name: CT_PUBLIC_URL, value: {{ $public | quote }}}
            - {name: CT_WEB_URL, value: {{ $public | quote }}}
            - {name: CT_TRUST_PROXY, value: {{ $g.trustProxy | quote }}}
            {{- $cors := $g.corsOrigins | default list }}
            {{- with .Values.web.runtimeConfig.siteUrl }}{{- if not (has (trimSuffix "/" .) $cors) }}{{- $cors = append $cors (trimSuffix "/" .) }}{{- end }}{{- end }}
            {{- with $cors }}
            - {name: CT_CORS_ORIGINS, value: {{ join "," . | quote }}}
            {{- end }}
            - {name: CT_LOG_LEVEL, value: {{ $g.logLevel | quote }}}
            - {name: CT_OIDC_ISSUER, value: {{ $g.oidc.issuer | quote }}}
            - {name: CT_OIDC_CLIENT_ID, value: {{ $g.oidc.clientId | quote }}}
            {{- with $g.keycloak.url }}
            - {name: CT_KEYCLOAK_URL, value: {{ . | quote }}}
            - {name: CT_KEYCLOAK_REALM, value: {{ $g.keycloak.realm | quote }}}
            - {name: CT_KEYCLOAK_ADMIN_CLIENT_ID, value: {{ $g.keycloak.adminClientId | quote }}}
            {{- end }}
            {{- with $g.platformIdps }}
            - {name: CT_PLATFORM_IDPS, value: {{ . | quote }}}
            {{- end }}
            {{- with $g.smtp.host }}
            - {name: CT_SMTP_HOST, value: {{ . | quote }}}
            - {name: CT_SMTP_PORT, value: {{ $g.smtp.port | quote }}}
            - {name: CT_SMTP_FROM, value: {{ $g.smtp.from | quote }}}
            {{- end }}
            - name: CT_SESSION_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "ct.gatewaySecret" . }}, key: CT_SESSION_SECRET}}
            - name: CT_GDPR_HMAC_KEY
              valueFrom: {secretKeyRef: {name: {{ include "ct.gatewaySecret" . }}, key: CT_GDPR_HMAC_KEY}}
            - name: CT_OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "ct.gatewaySecret" . }}, key: CT_OIDC_CLIENT_SECRET}}
            - name: CT_KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "ct.gatewaySecret" . }}, key: CT_KEYCLOAK_ADMIN_CLIENT_SECRET, optional: true}}
            {{- include "ct.gatewayDbEnv" . | nindent 12 }}
            {{- with $g.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 40
          {{- include "ct.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if $g.affinity }}
        {{- toYaml $g.affinity | nindent 8 }}
        {{- else }}
        # Spread replicas over nodes when possible.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ct.selector" (list . "gateway") | nindent 20 }}
        {{- end }}
{{- if $g.migrate }}
---
{{- /*
  Schema migrations as the owner role, in a Job of their own: the gateway pods
  never see owner credentials. The name carries a hash of the whole pod
  template (labels included), so a new image (or new settings) runs a new Job
  and an unchanged release keeps the finished one; a Job's template is
  immutable, so nothing in it may change under the same name. The pod template
  carries fixed labels only (no chart version): a chart bump alone neither
  renames the Job nor changes its template. The gateway's wait-for-schema init
  container holds the rollout until it is done. A Job that failed for good
  keeps its name too, so it is never retried by itself: bump
  gateway.migrateRetry (hashed into the name) or delete the Job (docs/deploy.md).
*/}}
{{- $tag := $g.image.tag | default .Values.global.imageTag | default .Chart.AppVersion }}
{{- if and (has $tag (list "main" "latest")) (not $g.image.digest) (not $g.migrateMutableTag) }}
{{- fail (printf "gateway.migrate needs an immutable image (a release version, sha-<commit> tag or gateway.image.digest), not %q: the migrate Job is named by the image reference, so a new build under the same tag would never be migrated. Set global.imageTag (or gateway.image.tag), or gateway.migrateMutableTag=true for development and bump gateway.migrateRetry after each new build (docs/deploy.md)." $tag) }}
{{- end }}
{{- $podTemplate := printf "metadata:\n  labels:\n    app.kubernetes.io/part-of: cloudtrain\n    app.kubernetes.io/instance: %s\n    app.kubernetes.io/managed-by: %s\n    app.kubernetes.io/component: gateway-migrate\nspec:\n%s" .Release.Name .Release.Service (include "ct.gatewayMigrateSpec" (dict "ctx" . "name" $name) | indent 2) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-%s" $name (printf "%s\nretry=%v" $podTemplate ($g.migrateRetry | default 0) | sha256sum | trunc 8) }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-migrate
  annotations:
    # The finished Job is kept on purpose: it is what keeps an unchanged release
    # from running the migrations again. With a TTL, every upgrade after it
    # expired would re-create and re-run the (idempotent) Job.
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "kept so an unchanged release does not re-run the migrations"
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1800
  template:
    {{- $podTemplate | nindent 4 }}
{{- end }}
{{- end }}
