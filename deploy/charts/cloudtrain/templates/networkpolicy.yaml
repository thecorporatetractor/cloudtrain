{{- if .Values.networkPolicy.enabled }}
{{- range $c := list "gateway" "web" }}
{{- if (index $.Values $c).enabled }}
---
# {{ $c }}: ingress only from the Ingress/Gateway data plane (and the helm test pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ct.fullname" $ }}-{{ $c }}
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ct.selector" (list $ $c) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml (required "networkPolicy.ingressNamespaceSelector is required" $.Values.networkPolicy.ingressNamespaceSelector) | nindent 12 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - port: http
{{- end }}
{{- end }}
{{- if .Values.orchestrator.enabled }}
---
# orchestrator: no ingress (it serves only kubelet probes; metrics are off by default).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ct.fullname" $ }}-orchestrator
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ct.selector" (list $ "orchestrator") | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
{{- end }}
{{- if .Values.postgres.demo.enabled }}
---
# demo Postgres: ingress only from this release's gateway (and its jobs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ct.fullname" $ }}-postgres
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ct.selector" (list $ "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - port: 5432
{{- end }}
{{- end }}
{{- $ns := .Values.gateway.sessionsNamespace }}
{{- with .Values.networkPolicy.labs }}
{{- if and .defaultDeny (ne ($.Values.orchestrator.networkMode | default "primary") "secondary") }}
{{- fail "networkPolicy.labs.defaultDeny needs orchestrator.networkMode secondary: with Kube-OVN as the primary CNI it would also cut the session segments" }}
{{- end }}
{{- if .defaultDeny }}
---
# Lab pods (every pod carrying a session label) in the sessions namespace: deny all
# ingress and egress that no per-session policy (entry, lab peers) allows, so a lab
# pod without its own policy is isolated, not open. Network mode secondary only:
# network_policy_for "ovn" keeps Kube-OVN from applying it to the session
# segments (wired nodes, VMs), which the cloud CNI never sees.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ct.fullname" $ }}-lab-default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
  annotations:
    ovn.kubernetes.io/network_policy_for: ovn
spec:
  podSelector:
    matchExpressions:
      - {key: labs.cloudtrain.dev/session, operator: Exists}
  policyTypes: [Ingress, Egress]
{{- end }}
{{- if .denyCloudMetadata }}
---
# Cilium (AKS: Azure CNI powered by Cilium): explicit egress deny from every lab pod
# (sessions namespace, lab VMs, vcluster workloads) to all of link-local
# 169.254.0.0/16 (IMDS and any other metadata endpoint) and the Azure wireserver,
# whatever allow policy is added later. Deny rules win
# over allows; enableDefaultDeny false keeps this policy from isolating anything else.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: {{ include "ct.fullname" $ }}-{{ $.Release.Namespace }}-lab-deny-metadata
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
# Selected: lab node pods and VMs (session label) and vcluster workloads (synced
# pods), all of which already have restrictive allow policies of their own.
specs:
  {{- range $key := list "labs.cloudtrain.dev/session" "vcluster.loft.sh/managed-by" }}
  - description: lab pods never reach IMDS or the Azure wireserver
    endpointSelector:
      matchExpressions:
        - {key: {{ $key }}, operator: Exists}
    enableDefaultDeny:
      egress: false
      ingress: false
    egressDeny:
      - toCIDR:
          - 169.254.0.0/16
          - 168.63.129.16/32
  {{- end }}
{{- end }}
{{- end }}
