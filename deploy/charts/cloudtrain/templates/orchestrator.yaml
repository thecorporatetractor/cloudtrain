{{- if .Values.orchestrator.enabled }}
{{- $o := .Values.orchestrator }}
{{- $fullname := include "ct.fullname" . }}
{{- $name := printf "%s-orchestrator" $fullname }}
{{- /* Cluster-scoped names carry the release namespace, so two releases never share them. */}}
{{- $cluster := printf "%s-%s" $name .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
---
# The manager's ClusterRole (copy of services/lab-orchestrator/config/rbac/role.yaml,
# generated by controller-gen; tools/charts/sync.sh). See docs/any-kubernetes.md 1.9
# and decision 7 for scoping it down.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  {{- (.Files.Get "files/orchestrator-role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cluster }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-catalog
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
data:
  # Merge order (lab-orchestrator LoadCatalog): catalog.yaml, then the other files
  # in lexical order; later files win.
  catalog.yaml: |
    {{- .Files.Get "files/catalog.yaml" | nindent 4 }}
  {{- if $o.catalog.opentofu }}
  10-iac-opentofu.yaml: |
    {{- .Files.Get "files/catalog-iac-opentofu.yaml" | nindent 4 }}
  {{- end }}
  {{- with $o.catalog.releaseOverlay }}
  20-release.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- range $file, $body := $o.catalog.overlays }}
  {{ printf "30-%s" $file }}: |
    {{- $body | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ct.selector" (list . "orchestrator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ct.labels" . | nindent 8 }}
        app.kubernetes.io/name: lab-orchestrator
        app.kubernetes.io/component: orchestrator
      annotations:
        checksum/catalog: {{ toJson $o.catalog | cat (.Files.Get "files/catalog.yaml") | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "ct.pullSecrets" . | nindent 6 }}
      {{- include "ct.podSecurity" . | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "ct.image" (list . $o) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --leader-elect
            - --leader-election-id={{ $cluster }}
            - --image-catalog=/etc/cloudtrain/catalog
            - --max-concurrent-reconciles={{ $o.maxConcurrentReconciles }}
            - --vm-disks={{ $o.vmDisks }}
            - --vcluster-pod-security={{ $o.vclusterPodSecurity }}
            {{- with $o.watchNamespace }}
            - --watch-namespace={{ . }}
            {{- end }}
            {{- with $o.sessionSelector }}
            - --session-selector={{ . }}
            {{- end }}
            {{- with $o.provisionTimeout }}
            - --provision-timeout={{ . }}
            {{- end }}
            {{- with $o.storageClass }}
            - --storage-class={{ . }}
            {{- end }}
            {{- with $o.runtimeClass }}
            - --runtime-class={{ . }}
            {{- end }}
            {{- with $o.images.registry }}
            - --image-registry={{ . }}
            {{- end }}
            {{- with $o.images.mirrors }}
            - --image-mirror={{ join "," . }}
            {{- end }}
            {{- with $o.images.pullSecrets }}
            - --image-pull-secrets={{ join "," . }}
            {{- end }}
            {{- range $o.extraArgs }}
            - {{ . }}
            {{- end }}
          ports:
            - {name: probes, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
          {{- include "ct.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - {name: catalog, mountPath: /etc/cloudtrain/catalog, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: catalog
          configMap: {name: {{ $name }}-catalog}
        - name: tmp
          emptyDir: {}
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
