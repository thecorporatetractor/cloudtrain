{{- if .Values.orchestrator.enabled }}
{{- $o := .Values.orchestrator }}
{{- $fullname := include "ct.fullname" . }}
{{- $name := printf "%s-orchestrator" $fullname }}
{{- /* Cluster-scoped names carry the release namespace, so two releases never share them. */}}
{{- $cluster := printf "%s-%s" $name .Release.Namespace }}
{{- $session := printf "%s-session-%s" $name .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
---
# The manager's cluster-wide ClusterRole (services/lab-orchestrator/config/rbac/role.yaml,
# generated by controller-gen; linked by tools/charts/sync.sh), its bind limited to
# this release's session ClusterRole. docs/deploy.md, Orchestrator RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  {{- range (.Files.Get "files/orchestrator-role.txt" | fromYaml).rules }}
  {{- if .resourceNames }}{{- $_ := set . "resourceNames" (list $session) }}{{- end }}
  - {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cluster }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Everything the manager does inside a lab namespace (config/rbac/session_role.yaml).
# Not bound here: the manager binds it to itself in each namespace labelled
# labs.cloudtrain.dev/lab-namespace=true (the sessions namespace, its vcluster host
# namespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $session }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  {{- (.Files.Get "files/orchestrator-session-role.txt" | fromYaml).rules | toYaml | nindent 2 }}
---
# Leader election (config/rbac/leader_election_role.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-election
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $o.rbac.ovnCentral.enabled }}
---
# vlan-passthru: ovn-nbctl in Kube-OVN's ovn-central pods (config/rbac/ovn_central_role.yaml).
# Exec into every pod of that namespace: RBAC cannot name generated pod names.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cluster }}-ovn-central
  namespace: {{ $o.rbac.ovnCentral.namespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cluster }}-ovn-central
  namespace: {{ $o.rbac.ovnCentral.namespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cluster }}-ovn-central
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if $o.rbac.admissionPolicy }}
---
# What RBAC cannot express (config/rbac/admission_policy.yaml): RoleBinding writes only
# in lab namespaces and only this release's session role bound to the manager itself;
# namespaces only its own ct-vc-*; Kube-OVN objects only its own. Kubernetes 1.30+.
{{- $vap := index (splitList "\n---\n" (.Files.Get "files/orchestrator-admission-policy.txt")) 0 | fromYaml }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  {{- $vap.spec | toYaml | replace "system:serviceaccount:cloudtrain-system:lab-orchestrator" (printf "system:serviceaccount:%s:%s" .Release.Namespace $name) | replace "'lab-orchestrator-session'" (printf "'%s'" $session) | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  policyName: {{ $cluster }}
  validationActions: [Deny]
{{- end }}
{{- /* The chart needs Kubernetes 1.30+ (Chart.yaml kubeVersion), where ValidatingAdmissionPolicy is GA. */}}
{{- if $o.rbac.podPolicy.enabled }}
{{- $classes := list }}
{{- range $t, $v := $o.sandboxes }}{{- $classes = append $classes $v.runtimeClass }}{{- end }}
{{- range $t, $rc := $o.tierRuntimeClasses }}{{- $classes = append $classes $rc }}{{- end }}
{{- $quoted := list }}
{{- range ($classes | uniq | sortAlpha) }}{{- $quoted = append $quoted (printf "'%s'" .) }}{{- end }}
{{- $pp := index (splitList "\n---\n" (.Files.Get "files/orchestrator-pod-admission-policy.txt")) 0 | fromYaml }}
{{- $vars := list }}
{{- range $pp.spec.variables }}
{{- if eq .name "sandboxes" }}{{- $_ := set . "expression" (printf "[%s]" (join ", " $quoted)) }}{{- end }}
{{- $vars = append $vars . }}
{{- end }}
{{- $_ := set $pp.spec "variables" $vars }}
{{- if eq $o.rbac.podPolicy.scope "own" }}
{{- $_ := set $pp.spec "matchConditions" (list (dict "name" "own-requests" "expression" (printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace $name))) }}
{{- end }}
---
# The lab pod admission policy (config/rbac/pod_admission_policy.yaml): no privileged
# container in lab namespaces unless the pod runs in a sandbox RuntimeClass of
# orchestrator.sandboxes; capabilities only the platform's own sets.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $cluster }}-pods
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  {{- $pp.spec | toYaml | replace "system:serviceaccount:cloudtrain-system:lab-orchestrator" (printf "system:serviceaccount:%s:%s" .Release.Namespace $name) | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $cluster }}-pods
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  policyName: {{ $cluster }}-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        labs.cloudtrain.dev/lab-namespace: "true"
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-catalog
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
data:
  # Merge order (lab-orchestrator LoadCatalog): catalog.yaml, then the other files
  # in lexical order; later files win.
  catalog.yaml: |
    {{- .Files.Get "files/catalog.yaml" | nindent 4 }}
  {{- if $o.catalog.opentofu }}
  10-iac-opentofu.yaml: |
    {{- .Files.Get "files/catalog-iac-opentofu.yaml" | nindent 4 }}
  {{- end }}
  {{- with $o.catalog.releaseOverlay }}
  20-release.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- range $file, $body := $o.catalog.overlays }}
  {{ printf "30-%s" $file }}: |
    {{- $body | nindent 4 }}
  {{- end }}
{{- if and $o.sandboxes $o.tierRuntimeClasses }}
{{- fail "orchestrator.sandboxes and the deprecated orchestrator.tierRuntimeClasses are exclusive" }}
{{- end }}
{{- with $o.sandboxes }}
---
# Tier sandboxes (--sandboxes-config): docs/kata-spike.md, values.yaml orchestrator.sandboxes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-sandboxes
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
    app.kubernetes.io/component: orchestrator
data:
  sandboxes.yaml: |
    apiVersion: labs.cloudtrain.dev/v1alpha1
    kind: SandboxConfig
    tiers:
      {{- toYaml . | nindent 6 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ct.selector" (list . "orchestrator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ct.labels" . | nindent 8 }}
        app.kubernetes.io/name: lab-orchestrator
        app.kubernetes.io/component: orchestrator
      annotations:
        checksum/catalog: {{ toJson $o.catalog | cat (.Files.Get "files/catalog.yaml") | sha256sum | trunc 16 }}
        {{- with $o.sandboxes }}
        checksum/sandboxes: {{ toJson . | sha256sum | trunc 16 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "ct.pullSecrets" . | nindent 6 }}
      {{- include "ct.podSecurity" . | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "ct.image" (list . $o) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --leader-elect
            - --leader-election-id={{ $cluster }}
            - --image-catalog=/etc/cloudtrain/catalog
            - --max-concurrent-reconciles={{ $o.maxConcurrentReconciles }}
            - --vm-disks={{ $o.vmDisks }}
            - --vcluster-pod-security={{ $o.vclusterPodSecurity }}
            - --session-cluster-role={{ $session }}
            - --service-account={{ .Release.Namespace }}/{{ $name }}
            {{- if $o.rbac.podPolicy.enabled }}
            - --pod-admission-policy={{ $cluster }}-pods
            {{- end }}
            {{- if $o.rbac.ovnCentral.enabled }}
            - --ovn-central={{ $o.rbac.ovnCentral.namespace }}/{{ $o.rbac.ovnCentral.selector }}
            {{- else }}
            - --ovn-central=
            {{- end }}
            {{- with $o.watchNamespace }}
            - --watch-namespace={{ . }}
            {{- end }}
            {{- with $o.sessionSelector }}
            - --session-selector={{ . }}
            {{- end }}
            {{- with $o.provisionTimeout }}
            - --provision-timeout={{ . }}
            {{- end }}
            {{- with $o.storageClass }}
            - --storage-class={{ . }}
            {{- end }}
            {{- with $o.runtimeClass }}
            - --runtime-class={{ . }}
            {{- end }}
            {{- if $o.sandboxes }}
            - --sandboxes-config=/etc/cloudtrain/sandboxes/sandboxes.yaml
            - --sandbox-preflight=/etc/cloudtrain/sandbox-preflight/preflight.yaml
            {{- end }}
            {{- with $o.tierRuntimeClasses }}
            - --tier-runtime-classes={{ range $i, $t := keys . | sortAlpha }}{{ if $i }},{{ end }}{{ $t }}={{ get $o.tierRuntimeClasses $t }}{{ end }}
            {{- end }}
            {{- with $o.images.registry }}
            - --image-registry={{ . }}
            {{- end }}
            {{- with $o.images.mirrors }}
            - --image-mirror={{ join "," . }}
            {{- end }}
            {{- with $o.images.pullSecrets }}
            - --image-pull-secrets={{ join "," . }}
            {{- end }}
            {{- range $o.extraArgs }}
            - {{ . }}
            {{- end }}
          ports:
            - {name: probes, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
          {{- include "ct.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - {name: catalog, mountPath: /etc/cloudtrain/catalog, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $o.sandboxes }}
            - {name: sandboxes, mountPath: /etc/cloudtrain/sandboxes, readOnly: true}
            - {name: sandbox-preflight, mountPath: /etc/cloudtrain/sandbox-preflight, readOnly: true}
            {{- end }}
      volumes:
        - name: catalog
          configMap: {name: {{ $name }}-catalog}
        {{- if $o.sandboxes }}
        - name: sandboxes
          configMap: {name: {{ $name }}-sandboxes}
        # Written by labctl preflight --sandbox-configmap; optional.
        - name: sandbox-preflight
          configMap: {name: {{ $o.sandboxPreflightConfigMap }}, optional: true}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
