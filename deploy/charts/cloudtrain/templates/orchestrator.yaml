{{- if .Values.orchestrator.enabled }}
{{- $o := .Values.orchestrator }}
{{- $fullname := include "ct.fullname" . }}
{{- $name := printf "%s-orchestrator" $fullname }}
{{- /* Cluster-scoped names carry the release namespace, so two releases never share them. */}}
{{- $cluster := printf "%s-%s" $name .Release.Namespace }}
{{- $session := printf "%s-session-%s" $name .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
---
# The manager's cluster-wide ClusterRole (services/lab-orchestrator/config/rbac/role.yaml,
# generated by controller-gen; linked by tools/charts/sync.sh), its bind limited to
# this release's session ClusterRole. docs/deploy.md, Orchestrator RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  {{- range (.Files.Get "files/orchestrator-role.txt" | fromYaml).rules }}
  {{- if .resourceNames }}{{- $_ := set . "resourceNames" (list $session) }}{{- end }}
  - {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cluster }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Everything the manager does inside a lab namespace (config/rbac/session_role.yaml).
# Not bound here: the manager binds it to itself in each namespace labelled
# labs.cloudtrain.dev/lab-namespace=true (the sessions namespace, its vcluster host
# namespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $session }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  {{- (.Files.Get "files/orchestrator-session-role.txt" | fromYaml).rules | toYaml | nindent 2 }}
---
# Leader election (config/rbac/leader_election_role.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader-election
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader-election
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $o.rbac.ovnCentral.enabled }}
---
# vlan-passthru: ovn-nbctl in Kube-OVN's ovn-central pods (config/rbac/ovn_central_role.yaml).
# Exec into every pod of that namespace: RBAC cannot name generated pod names.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cluster }}-ovn-central
  namespace: {{ $o.rbac.ovnCentral.namespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cluster }}-ovn-central
  namespace: {{ $o.rbac.ovnCentral.namespace }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cluster }}-ovn-central
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# The API server's addresses for vcluster control plane NetworkPolicies
# (config/rbac/apiserver_endpoints_role.yaml; --apiserver-cidrs auto). Only that object.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cluster }}-apiserver-endpoints
  namespace: default
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  - apiGroups: [""]
    resources: [endpoints]
    resourceNames: [kubernetes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cluster }}-apiserver-endpoints
  namespace: default
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cluster }}-apiserver-endpoints
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $o.rbac.admissionPolicy }}
---
# What RBAC cannot express (config/rbac/admission_policy.yaml): RoleBinding writes only
# in lab namespaces and only this release's session role bound to the manager itself;
# namespaces only its own ct-vc-*; Kube-OVN objects only its own. Kubernetes 1.30+.
{{- $vap := index (splitList "\n---\n" (.Files.Get "files/orchestrator-admission-policy.txt")) 0 | fromYaml }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  {{- $vap.spec | toYaml | replace "system:serviceaccount:cloudtrain-system:lab-orchestrator" (printf "system:serviceaccount:%s:%s" .Release.Namespace $name) | replace "'lab-orchestrator-session'" (printf "'%s'" $session) | replace "'kube-system'" (printf "'%s'" $o.rbac.ovnCentral.namespace) | replace "'ovn-central-'" (printf "'%s-'" (splitList "=" $o.rbac.ovnCentral.selector | last)) | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  policyName: {{ $cluster }}
  validationActions: [Deny]
{{- $vh := index (splitList "\n---\n" (.Files.Get "files/vcluster-host-policy.txt")) 0 | fromYaml }}
---
# What learners may publish from vcluster host namespaces (config/rbac/vcluster_host_policy.yaml):
# no externalIPs, LoadBalancer or NodePort Services, no Ingresses. For every user.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $cluster }}-vcluster-host
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  {{- with $o.vclusterPodCIDRs }}
  {{- $q := list }}{{- range (. | toStrings | uniq | sortAlpha) }}{{- $q = append $q (squote .) }}{{- end }}
  {{- $_ := set (index $vh.spec.variables 0) "expression" (printf "[%s]" (join ", " $q)) }}
  {{- end }}
  {{- $vh.spec | toYaml | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $cluster }}-vcluster-host
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  policyName: {{ $cluster }}-vcluster-host
  validationActions: [Deny]
{{- if .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/MutatingAdmissionPolicy" }}
{{- $vm := index (splitList "\n---\n" (.Files.Get "files/vcluster-host-services-mutation.txt")) 0 | fromYaml }}
---
# The host copy of a learner's NodePort or LoadBalancer Service is a plain ClusterIP
# Service (config/rbac/vcluster_host_services_mutation.yaml), so labs can create them
# inside their vcluster; the policy above still refuses anything else. Kubernetes 1.36+
# (helm template: --api-versions admissionregistration.k8s.io/v1/MutatingAdmissionPolicy).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ $cluster }}-vcluster-host-services
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  {{- $vm.spec | toYaml | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $cluster }}-vcluster-host-services
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  policyName: {{ $cluster }}-vcluster-host-services
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-catalog
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
data:
  # Merge order (lab-orchestrator LoadCatalog): catalog.yaml, then the other files
  # in lexical order; later files win.
  catalog.yaml: |
    {{- .Files.Get "files/catalog.yaml" | nindent 4 }}
  {{- if $o.catalog.opentofu }}
  10-iac-opentofu.yaml: |
    {{- .Files.Get "files/catalog-iac-opentofu.yaml" | nindent 4 }}
  {{- end }}
  {{- with $o.catalog.releaseOverlay }}
  20-release.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- range $file, $body := $o.catalog.overlays }}
  {{ printf "30-%s" $file }}: |
    {{- $body | nindent 4 }}
  {{- end }}
{{- if and $o.sandboxes $o.tierRuntimeClasses }}
{{- fail "orchestrator.sandboxes and the deprecated orchestrator.tierRuntimeClasses are exclusive" }}
{{- end }}
{{- if and (eq (($o.isolation).profile | default "dev") "production") (not $o.sandboxes) }}
{{- fail "orchestrator.isolation.profile production needs orchestrator.sandboxes (a VM sandbox RuntimeClass per tier, e.g. AKS kata-vm-isolation): without one, lab pods would run with host users on the host kernel" }}
{{- end }}
{{- if and (eq (($o.isolation).profile | default "dev") "production") $o.sandboxes (not (hasKey $o.sandboxes "V")) }}
{{- fail "orchestrator.isolation.profile production needs orchestrator.sandboxes.V: pods learners create inside virtual clusters would otherwise run as root on the host kernel" }}
{{- end }}
{{- with $o.sandboxes }}
---
# Tier sandboxes (--sandboxes-config): docs/kata-spike.md, values.yaml orchestrator.sandboxes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-sandboxes
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
    app.kubernetes.io/component: orchestrator
data:
  sandboxes.yaml: |
    apiVersion: labs.cloudtrain.dev/v1alpha1
    kind: SandboxConfig
    tiers:
      {{- toYaml . | nindent 6 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ct.selector" (list . "orchestrator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ct.labels" . | nindent 8 }}
        app.kubernetes.io/name: lab-orchestrator
        app.kubernetes.io/component: orchestrator
      annotations:
        checksum/catalog: {{ toJson $o.catalog | cat (.Files.Get "files/catalog.yaml") | sha256sum | trunc 16 }}
        {{- with $o.sandboxes }}
        checksum/sandboxes: {{ toJson . | sha256sum | trunc 16 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "ct.pullSecrets" . | nindent 6 }}
      {{- include "ct.podSecurity" . | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "ct.image" (list . $o) }}
          imagePullPolicy: {{ include "ct.pullPolicy" (list . $o) }}
          args:
            - --leader-elect
            - --leader-election-id={{ $cluster }}
            - --image-catalog=/etc/cloudtrain/catalog
            - --max-concurrent-reconciles={{ $o.maxConcurrentReconciles }}
            - --vm-disks={{ $o.vmDisks }}
            - --vcluster-pod-security={{ $o.vclusterPodSecurity }}
            - --session-cluster-role={{ $session }}
            - --service-account={{ .Release.Namespace }}/{{ $name }}
            - --isolation-profile={{ ($o.isolation).profile | default "dev" }}
            {{- $failedRelease := int ($o.failedSessionReleaseMinutes | default 0) }}
            - --failed-session-release={{ if eq $failedRelease 0 }}-1{{ else }}{{ $failedRelease }}{{ end }}m
            {{- with $o.vclusterPodCIDRs }}
            - --vcluster-pod-cidrs={{ join "," . }}
            {{- end }}
            - --node-preflight=/etc/cloudtrain/node-preflight/kubelet.yaml
            {{- if ($o.isolation).kubeletLimitsAttested }}
            - --kubelet-limits-attested
            {{- end }}
            {{- if $o.rbac.ovnCentral.enabled }}
            - --ovn-central={{ $o.rbac.ovnCentral.namespace }}/{{ $o.rbac.ovnCentral.selector }}
            {{- else }}
            - --ovn-central=
            {{- end }}
            {{- with $o.watchNamespace }}
            - --watch-namespace={{ . }}
            {{- end }}
            {{- with $o.sessionSelector }}
            - --session-selector={{ . }}
            {{- end }}
            {{- with $o.provisionTimeout }}
            - --provision-timeout={{ . }}
            {{- end }}
            {{- with $o.storageClass }}
            - --storage-class={{ . }}
            {{- end }}
            {{- with $o.runtimeClass }}
            - --runtime-class={{ . }}
            {{- end }}
            {{- with ($o.labNodes).nodeSelector }}
            - --lab-node-selector={{ range $i, $k := keys . | sortAlpha }}{{ if $i }},{{ end }}{{ $k }}={{ get $o.labNodes.nodeSelector $k }}{{ end }}
            {{- end }}
            {{- with ($o.labNodes).tolerations }}
            - --lab-tolerations={{ join "," . }}
            {{- end }}
            {{- if $o.sandboxes }}
            - --sandboxes-config=/etc/cloudtrain/sandboxes/sandboxes.yaml
            - --sandbox-preflight=/etc/cloudtrain/sandbox-preflight/preflight.yaml
            {{- end }}
            {{- with $o.tierRuntimeClasses }}
            - --tier-runtime-classes={{ range $i, $t := keys . | sortAlpha }}{{ if $i }},{{ end }}{{ $t }}={{ get $o.tierRuntimeClasses $t }}{{ end }}
            {{- end }}
            {{- with $o.images.registry }}
            - --image-registry={{ . }}
            {{- end }}
            {{- with $o.images.mirrors }}
            - --image-mirror={{ join "," . }}
            {{- end }}
            {{- with $o.images.pullSecrets }}
            - --image-pull-secrets={{ join "," . }}
            {{- end }}
            {{- range $o.extraArgs }}
            - {{ . }}
            {{- end }}
          ports:
            - {name: probes, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
          {{- include "ct.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          volumeMounts:
            - {name: catalog, mountPath: /etc/cloudtrain/catalog, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: node-preflight, mountPath: /etc/cloudtrain/node-preflight, readOnly: true}
            {{- if $o.sandboxes }}
            - {name: sandboxes, mountPath: /etc/cloudtrain/sandboxes, readOnly: true}
            - {name: sandbox-preflight, mountPath: /etc/cloudtrain/sandbox-preflight, readOnly: true}
            {{- end }}
      volumes:
        - name: catalog
          configMap: {name: {{ $name }}-catalog}
        {{- if $o.sandboxes }}
        - name: sandboxes
          configMap: {name: {{ $name }}-sandboxes}
        # Written by labctl preflight --sandbox-configmap; optional.
        - name: sandbox-preflight
          configMap: {name: {{ $o.sandboxPreflightConfigMap }}, optional: true}
        {{- end }}
        - name: tmp
          emptyDir: {}
        # labctl preflight --node-configmap (lab nodes' kubelet PID limit and seccompDefault); optional.
        - name: node-preflight
          configMap: {name: {{ $o.nodePreflightConfigMap | default "lab-node-preflight" }}, optional: true}
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
