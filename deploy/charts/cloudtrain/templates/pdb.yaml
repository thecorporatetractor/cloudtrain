{{- if .Values.podDisruptionBudget.enabled }}
{{- range $c := list "gateway" "web" }}
{{- $v := index $.Values $c }}
{{- if and $v.enabled (gt (int $v.replicas) 1) }}
---
# A node drain evicts one {{ $c }} replica at a time (prod-10).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ct.fullname" $ }}-{{ $c }}
  labels:
    {{- include "ct.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  # A replica that is not Ready (crash-looping, a bad build) never blocks a drain.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "ct.selector" (list $ $c) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
