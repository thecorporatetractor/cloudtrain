{{- $o := .Values.orchestrator }}
{{- if and $o.enabled $o.rbac.admissionPolicy }}
{{- $policy := printf "%s-orchestrator-%s-vcluster-pod-network" (include "ct.fullname" .) .Release.Namespace }}
{{- $vap := index (splitList "\n---\n" (.Files.Get "files/vcluster-pod-network-policy.txt")) 0 | fromYaml }}
---
# Pods synced from a virtual cluster (ct-vc-*) may not set Multus or Kube-OVN
# network annotations (config/rbac/vcluster_pod_network_policy.yaml).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $policy }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  {{- $vap.spec | toYaml | nindent 2 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $policy }}
  labels:
    {{- include "ct.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  policyName: {{ $policy }}
  validationActions: [Deny]
{{- end }}
