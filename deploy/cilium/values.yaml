# Cilium as the primary CNI for KIND_PROFILE=managed-cni (chart cilium/cilium,
# version CILIUM_CHART_VERSION in deploy/versions.env). It stands in for the
# managed CNIs built on Cilium (AKS Azure CNI powered by Cilium, GKE Dataplane
# V2) and enforces NetworkPolicy on eth0, as those do.
# - cni.exclusive false: Cilium must not rename other CNI configs, or Multus
#   (00-multus.conf) and Kube-OVN (90-kube-ovn.conflist) disappear.
# - kube-proxy stays (kind installs it); no kube-proxy replacement.
# - IPAM from the node podCIDRs that kind/kubeadm assign (podSubnet 10.32.0.0/16).
cni:
  exclusive: false
kubeProxyReplacement: false
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan
operator:
  replicas: 1
hubble:
  enabled: false
resources:
  requests: { cpu: 100m, memory: 256Mi }
