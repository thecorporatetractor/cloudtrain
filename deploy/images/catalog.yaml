# Lab image catalog: maps the image refs used in lab.yaml (`topology.nodes[].image`)
# to concrete runtime artifacts. Owned by tools/images; read by lab-orchestrator
# (drivers) and lab-verify (unknown refs are errors).
#
# kind:
#   container      OCI image run as a pod (Kata in production, runc locally)
#   containerDisk  KubeVirt VM disk shipped as an OCI image
#
# Lab VMs have no internet access, so every image a lab pulls inside a VM must be
# listed in workloadImages and is preloaded into each kubeadm node image. The same
# list is loaded into the host (kind) nodes for `mode: virtual` clusters.
#
# Exact versions and digests live in deploy/versions.env and tools/images/lock/*.lock;
# tools/images/build.sh refuses to build an image whose entry here disagrees with them.
# Optional informational fields (consumers may ignore them): kubernetesVersion,
# stagedUpgrades, etcdVersion, kubectlVersion.
#
# Publishing (docs/deploy.md, "Images and registries"): `publishable: true` lets CI
# push the image to GHCR (.github/workflows/images.yml) under `publishName` (default:
# the image's last path component, cloudtrain/jumphost:1 -> jumphost) and lets the
# release overlay point the ref at ghcr.io/<owner>/<repo>/<name>@<digest>. Omitted or
# false = never published (license-restricted or upstream images); `labctl catalog
# check` fails CI when the workflow publishes such an image. Containers are published
# today; the containerDisks are pushed by .github/workflows/vm-images.yml (KVM runner;
# tools/images/vm-images.yaml) except el-vm and ubuntu-vm (package-mirror content).
# Dev clusters can pull the published images instead of `kind load`: IMAGE_SOURCE=ghcr
# (deploy/scripts/lib.sh, docs/deploy.md "Dev clusters: pull from GHCR").
# Top-level `registry`, `mirrors` and `imagePullSecrets` (all optional) configure
# where the orchestrator pulls from; the manager's --image-registry, --image-mirror
# and --image-pull-secrets flags (Helm values) add to or override them.
apiVersion: cloudtrain.dev/v1
kind: ImageCatalog
images:
  # Learner workstation: kubectl (LAB_K8S_VERSION, works against N-1), helm, etcdctl,
  # ssh, jq/yq, vim/nano; non-root user `learner` (uid 1000), `k` alias with completion.
  # helm is Helm 4 behind a wrapper: install/upgrade default to client-side apply, since
  # vcluster owns every virtual Service's fields (tools/images/jumphost/helm-wrapper.sh).
  jumphost:1:
    kind: container
    image: cloudtrain/jumphost:1
    kubectlVersion: v1.37.1
    publishable: true
  # kubeadm nodes: `/opt/cloudtrain/bin/cni-install <podCIDR>` installs Calico (enforces
  # NetworkPolicy) from the sha256-recorded /opt/cloudtrain/manifests/calico.yaml; all
  # control-plane, Calico and workload images preloaded; curl and buildah installed
  # (root storage /var/lib/containers, RUN on the host network, short names -> docker.io;
  # empty: labs seed it from containerd with `ctr images export` + `buildah pull
  # oci-archive:`). No users or keys baked in (the runtime injects them through cloud-init).
  kubeadm:1.37:
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.37.1
    diskSize: 12Gi                     # persistent root disk: 10 GiB virtual size x 1.15
    kubernetesVersion: v1.37.1
    publishable: true
    publishName: kubeadm-node-v1.37
  # Upgrade labs start one minor behind and have the target release staged
  # offline: signed flat apt repos /opt/k8s-apt/v1.36/ and /opt/k8s-apt/v1.37/;
  # /etc/apt/sources.list.d/kubernetes.list points at v1.36 (the learner switches the
  # minor); no apt source needs the internet. kubeadm/kubelet/kubectl are held at
  # kubernetesVersion; every v1.37.1 control-plane image is preloaded.
  kubeadm:1.36:
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.36-upgrade
    diskSize: 12Gi                     # persistent root disk: 10 GiB virtual size x 1.15
    kubernetesVersion: v1.36.5
    stagedUpgrades: [v1.37.1]
    publishable: true
    publishName: kubeadm-node-v1.36-upgrade
  # etcd/etcdctl/etcdutl in /usr/local/bin, openssl, etcd.service with mutual TLS on
  # 127.0.0.1:2379 (per-VM PKI in /etc/qm-etcd/pki), system user `etcd`. Ubuntu cloud
  # image with cloud-init + sshd; no users or keys baked in.
  etcd-host:3.6:
    kind: containerDisk
    image: cloudtrain/etcd-host:3.6
    etcdVersion: v3.6.15
    publishable: true
  # netdev ---------------------------------------------------------------
  # Network-lab images, built by tools/images/netdev/build.sh (task image:netdev).
  frr:10:
    kind: container
    image: cloudtrain/frr:10       # FRRouting 10.7.1 (quay.io/frrouting/frr by digest); ospfd, ospf6d, bgpd, bfdd
    netdev: frr                    # device family: config via vtysh, show commands via vtysh -c
    # Also openssh-server, sudo, shadow (useradd) and python3 for network-automation labs (Ansible
    # over the ssh connection): their setup creates the account and starts sshd; nothing runs by default.
    publishable: true
  nettools:1:
    kind: container
    image: cloudtrain/nettools:1   # iproute2, ping, traceroute, tcpdump, iperf3; also the link sidecar
    publishable: true
  # Linux services host and Linux router/firewall/switch for network labs: dnsmasq,
  # Kea DHCPv4, BIND + dig, chrony, rsyslog, net-snmp, OpenSSH, nftables/iptables,
  # WireGuard, strongSwan, bridge/bond/VLAN tooling, tc, python3 + Jinja2/PyYAML.
  # No daemon starts on its own; labs start them from setup actions.
  netsvc:1:
    kind: container
    image: cloudtrain/netsvc:1
    publishable: true
  # In-lab OCI registry: CNCF Distribution 3.1.2 (thin layer on registry:3, by digest;
  # tools/images/oci-registry). Plain HTTP on :5000, no auth, anonymous push/pull, deletes
  # enabled, data in /var/lib/registry (runs as uid 65532; volumes need fsGroup 65532). Labs switch on TLS or htpasswd through the upstream
  # REGISTRY_HTTP_TLS_* / REGISTRY_AUTH_* environment variables.
  oci-registry:3:
    kind: container
    image: cloudtrain/oci-registry:3
    publishable: true
  # kubeadm:1.37 plus add-ons for the K8s curriculum, layered on that image (build.sh
  # kubeadm-full). Post-init hook: `/opt/cloudtrain/bin/addons-install <list> [--wait]
  # [--pool a-b]` with metrics-server, gateway-api, traefik (IngressClass + GatewayClass
  # "traefik", :80/:443, NodePorts 30080/30443), metallb (L2, pool default
  # 192.168.100.200-220), local-path (default StorageClass), falco; aliases ingress,
  # gateway, lb, storage, all (all = everything but falco and csi-hostpath); csi-hostpath =
  # CSI hostpath driver hostpath.csi.k8s.io with volume expansion, StorageClass
  # csi-hostpath. Images preloaded (lock/addons.lock). CKS material always
  # present: gVisor runsc registered with containerd as handler `runsc` (labs create the
  # RuntimeClass), kube-bench + cfg, AppArmor sample profiles and audit policies in
  # /opt/cloudtrain/security. Supply chain: Trivy with a dated offline DB (TRIVY_DB_DATE;
  # `trivy image --image-src containerd` reads namespace k8s.io, buildah images come in
  # through podman.socket), cosign, buildah base images registry.quillmoor.example/mirror/
  # golang:1.25 and .../base/static-nonroot:2026.10, signed fixture /opt/qm-signing
  # (parcel-api-{blue,green,amber} layouts, release.pub; only green verifies) with
  # registry.quillmoor.example/parcel/api:{blue,green,amber} in containerd.
  kubeadm:1.37-full:
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.37.1-full
    diskSize: 19Gi                     # persistent root disk: 16 GiB virtual size x 1.15
    kubernetesVersion: v1.37.1
    tier: K
    addons: [metrics-server, gateway-api, traefik, metallb, local-path, falco, csi-hostpath]
    publishable: true
    publishName: kubeadm-node-v1.37-full
  kubeadm:1.37-sec:                    # same image, the curriculum's CKS ref
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.37.1-full
    diskSize: 19Gi                     # persistent root disk: 16 GiB virtual size x 1.15
    kubernetesVersion: v1.37.1
    tier: K
    addons: [metrics-server, gateway-api, traefik, metallb, local-path, falco, csi-hostpath]
    publishable: true
    publishName: kubeadm-node-v1.37-full
  # linux (foundations stream) ------------------------------------------------
  # Tier A: unprivileged learner pods (tools/images/build-linux-pod.sh, task image:build:linux-pod).
  # userNamespace: the container driver runs them with pod hostUsers: false when every
  # node's runtime handler reports user namespace support (else host users, see
  # docs/dev-environment.md "Lab runtime tiers"). PID 1 is tini -> cloudtrain-init (hooks in
  # /etc/cloudtrain/init.d/, then sleep); no systemd. User `learner` (uid 1000) has NO sudo
  # rights (sudo is installed for sudo labs). Man pages, editors (vim, nano), admin tools,
  # git, python3/pip, gcc/make, cron/at, openssh client+server, sample data in /srv/samples.
  # Package sources point ONLY at the in-cluster mirror (dnf/apt/pip, see deploy/mirrors).
  el-lab:10:
    kind: container
    image: cloudtrain/el-lab:10        # AlmaLinux 10.2 userland
    tier: A
    userNamespace: true
    mirrors: [dnf, pypi]
    publishable: true
  deb-lab:24.04:
    kind: container
    image: cloudtrain/deb-lab:24.04    # Ubuntu 24.04 userland, unminimized
    tier: A
    userNamespace: true
    mirrors: [apt, pypi]
    publishable: true
  # Tier B: systemd as PID 1 in a Kata sandbox (tools/images/build-linux-pod.sh el-sys|deb-sys,
  # docs/kata-spike.md). The tier-A image plus systemd, sshd (enabled), chrony, nftables,
  # LVM/mdadm and kmod; learner has passwordless sudo, as on the lab VMs. `systemd: true`:
  # the container driver runs the node privileged ONLY when the manager maps the tier to a
  # sandbox RuntimeClass (--tier-runtime-classes B=kata-clh-runtime-rs), with a readiness
  # probe on systemd's boot; otherwise the session fails (never privileged on the host
  # kernel). With the lab guest kernel (tools/images/kata-kernel) bonds, VLANs, GRE,
  # WireGuard, netem and md are built in and `modprobe` of them succeeds. No reboot, kernel
  # modules or SELinux enforcing: those labs stay on the tier-C VMs below.
  el-sys:10:
    kind: container
    image: cloudtrain/el-sys:10        # el-lab:10 + systemd (AlmaLinux 10.2)
    tier: B
    systemd: true
    mirrors: [dnf, pypi]
  deb-sys:24.04:
    kind: container
    image: cloudtrain/deb-sys:24.04    # deb-lab:24.04 + systemd (Ubuntu 24.04)
    tier: B
    systemd: true
    mirrors: [apt, pypi]
  # Tier C: KubeVirt VMs for Linux labs (tools/images/build.sh el-vm|ubuntu-vm). Each carries
  # the mirror snapshot as a LOCAL repo (/opt/cloudtrain/repo/<el10|noble>), the only enabled
  # package source, so dnf/apt work offline in an isolated lab VPC. Extra blank disks come
  # from topology resources.disks (sizes, e.g. ["2Gi", "2Gi"]): /dev/vdb.. with serials
  # ct-data1.. (/dev/disk/by-id/virtio-ct-dataN). No users or keys baked in (cloud-init
  # injects learner with passwordless sudo, root key, host key), like etcd-host.
  el-vm:10:
    kind: containerDisk
    image: cloudtrain/el-vm:10         # AlmaLinux 10.2 GenericCloud; SELinux enforcing, firewalld, auditd
    tier: C
    mirrors: [dnf-local]
    publishable: true
  ubuntu-vm:24.04:
    kind: containerDisk
    image: cloudtrain/ubuntu-vm:24.04  # Ubuntu 24.04 cloud image; AppArmor, nftables/ufw, auditd
    tier: C
    mirrors: [apt-local]
    publishable: true
  # iac (wave 2) --------------------------------------------------------------
  # IaC learner workstation (tools/images/iac, build-iac-ws.sh): Terraform 1.15 as the
  # primary CLI with OpenTofu 1.11 alongside, kubectl, helm, jq/yq, git; user `learner`
  # (uid 1000, no sudo). Providers only from the offline filesystem mirror
  # /opt/cloudtrain/providers (~/.terraformrc; hashicorp kubernetes, helm, random, local,
  # null, tls, time, http; see tools/images/iac/providers.txt). Labs call `iac` (the
  # primary CLI) and the grading helper `ct-iac`, never a hard-coded binary, so
  # deploy/images/overlays/iac-opentofu.yaml can swap this ref to the OpenTofu-only
  # flavour. Ships a BUSL-1.1 binary: internal tenants only until IBM confirms external
  # use (curriculum iac licensingNote).
  terraform-ws:1.15:
    kind: container
    image: cloudtrain/iac-ws:1.15-terraform
    tier: A
    publishable: false   # Terraform is BUSL-1.1: never published; only the OpenTofu flavour is (overlays/iac-opentofu.yaml)
  # AWS-shaped API for IaC labs (Moto server, Apache-2.0, upstream image; digest below):
  # a lab peer node named `moto`, reached from the workstation as http://moto:5000.
  # Emulates the API shape, not AWS behaviour; state lives in memory (a restarted pod
  # starts empty). Runs its image's own entrypoint (moto_server -H 0.0.0.0, port 5000).
  moto:5:
    kind: container
    image: motoserver/moto:5.2.3   # sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
    tier: A
    publishable: false   # upstream image from docker.io (clusters mirror it with --image-mirror docker.io=...)
  # containers (containers-content stream) ------------------------------------
  # Tier C Docker host (tools/images/build.sh docker-vm): Ubuntu 24.04 cloud image with
  # Docker Engine 29 (containerd image store), buildx, compose, rootless extras (uidmap,
  # slirp4netns, dbus-user-session), skopeo, iptables/nftables, tcpdump, apache2-utils
  # (htpasswd). Docker and containerd run at boot; no apt source needs the internet. The
  # images in tools/images/docker-vm/preload-images.txt (busybox, alpine, python, nginx,
  # registry, redis; BuildKit moby/buildkit:v0.23.2, :buildx-stable-1 and :rootless;
  # docker/buildkit-syft-scanner:stable-1; golang:1.25-alpine) are preloaded into the engine (digests:
  # tools/images/lock/docker-vm.lock), so labs build and run offline. Supply-chain CLIs in
  # /usr/local/bin: cosign v2, notation 1.x, trivy with an offline vulnerability DB in
  # /var/lib/trivy (root-owned: labs copy it to a learner-owned dir and run trivy --cache-dir
  # <dir> --skip-db-update; versions and sha256 in deploy/versions.env). Learners get no docker group by default: a lab grants it
  # in setup (`usermod -aG docker learner`). The VM is the isolation boundary: the learner
  # has passwordless sudo, so docker access adds nothing (see docs/handoffs/containers.md).
  docker-vm:29:
    kind: containerDisk
    image: cloudtrain/docker-vm:29
    diskSize: 14Gi                     # persistent root disk: 12 GiB virtual size x 1.15
    tier: C
    publishable: true
  # automation (automation-content stream) -------------------------------------
  # Ansible control node (tools/images/ansible, build-ansible-ctl.sh): ansible-core 2.21,
  # ansible-navigator (labs run it with execution environments disabled: no container
  # engine in the pod), ansible-lint, Molecule, ansible-builder, yamllint, ansible-rulebook
  # (Event-Driven Ansible) with OpenJDK 17 (JRE), the mirrored collections (ansible.posix,
  # community.general, community.crypto, ansible.utils, ansible.eda, containers.podman,
  # fedora.linux_system_roles) in /usr/share/ansible/collections, sshpass, git, vim, nano; user `learner` (uid 1000, no
  # sudo). Managed nodes are el-lab:10 / deb-lab:24.04 pods (or el-vm:10 VMs where systemd,
  # services or reboots are graded) wired to the control node by topology links; setup runs
  # `ct-fleet-net` (bridge br0 over the links, /etc/hosts, known host keys) and checks use
  # `ct-ansible recap` (idempotency re-run). See docs/handoffs/automation.md.
  ansible-ctl:2.21:
    kind: container
    image: cloudtrain/ansible-ctl:2.21
    tier: A
    publishable: true
  # security operations (soc stream) ------------------------------------------
  # KQL workstation (tools/images/kql-ws, build-kql-ws.sh): KustoLoco lokql (MIT; patched,
  # Kusto.Language built from Apache-2.0 source) as `kql` with the lab's tables loaded from
  # /srv/kql/lab, `ct-kql` for checks (queries run as the learner; JSON/CSV/scalar/count/
  # compare), `ct-loggen` (seeded Sentinel-shaped synthetic logs: lab setup writes the data
  # to /srv/kql/lab and the answers to /var/lib/cloudtrain/kql, root only), the Azure
  # Sentinel sample tables (`kql --sample`), python3, jq, vim, nano; user `learner` (uid
  # 1000, no sudo). Offline. See docs/handoffs/soc.md.
  kql-ws:1:
    kind: container
    image: cloudtrain/kql-ws:1
    tier: A
    publishable: true
workloadImages:
  - busybox:1.37
  - httpd:2.4-alpine
  - redis:7.4-alpine
  - caddy:2-alpine
  - httpd:2.4   # named-port-nodeport misconception (JSON merge patch drifts the image)
