# Lab image catalog: maps the image refs used in lab.yaml (`topology.nodes[].image`)
# to concrete runtime artifacts. Owned by tools/images; read by lab-orchestrator
# (drivers) and lab-verify (unknown refs are errors).
#
# kind:
#   container      OCI image run as a pod (Kata in production, runc locally)
#   containerDisk  KubeVirt VM disk shipped as an OCI image
#
# Lab VMs have no internet access, so every image a lab pulls inside a VM must be
# listed in workloadImages and is preloaded into each kubeadm node image. The same
# list is loaded into the host (kind) nodes for `mode: virtual` clusters.
#
# Exact versions and digests live in deploy/versions.env and tools/images/lock/*.lock;
# tools/images/build.sh refuses to build an image whose entry here disagrees with them.
# Optional informational fields (consumers may ignore them): kubernetesVersion,
# stagedUpgrades, etcdVersion, kubectlVersion.
apiVersion: cloudtrain.dev/v1
kind: ImageCatalog
images:
  # Learner workstation: kubectl (LAB_K8S_VERSION, works against N-1), helm, etcdctl,
  # ssh, jq/yq, vim/nano; non-root user `learner` (uid 1000), `k` alias with completion.
  jumphost:1:
    kind: container
    image: cloudtrain/jumphost:1
    kubectlVersion: v1.37.1
  # kubeadm nodes: `/opt/cloudtrain/bin/cni-install <podCIDR>` installs Calico (enforces
  # NetworkPolicy) from the sha256-recorded /opt/cloudtrain/manifests/calico.yaml; all
  # control-plane, Calico and workload images preloaded; curl installed. No users or
  # keys baked in (the runtime injects them through cloud-init).
  kubeadm:1.37:
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.37.1
    kubernetesVersion: v1.37.1
  # Upgrade labs start one minor behind and have the target release staged
  # offline: signed flat apt repos /opt/k8s-apt/v1.36/ and /opt/k8s-apt/v1.37/;
  # /etc/apt/sources.list.d/kubernetes.list points at v1.36 (the learner switches the
  # minor); no apt source needs the internet. kubeadm/kubelet/kubectl are held at
  # kubernetesVersion; every v1.37.1 control-plane image is preloaded.
  kubeadm:1.36:
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.36-upgrade
    kubernetesVersion: v1.36.5
    stagedUpgrades: [v1.37.1]
  # etcd/etcdctl/etcdutl in /usr/local/bin, openssl, etcd.service with mutual TLS on
  # 127.0.0.1:2379 (per-VM PKI in /etc/qm-etcd/pki), system user `etcd`. Ubuntu cloud
  # image with cloud-init + sshd; no users or keys baked in.
  etcd-host:3.6:
    kind: containerDisk
    image: cloudtrain/etcd-host:3.6
    etcdVersion: v3.6.15
  # Tier A Linux learner pods (interim build: tools/images/linux-pod, until the
  # foundations user-namespace images land). User `learner` (uid 1000, no sudo rule),
  # man pages and docs, sshd installed but not running, PID 1 sleep.
  linux-pod-deb:24.04:
    kind: container
    image: cloudtrain/linux-pod-deb:24.04
  linux-pod-el:10:
    kind: container
    image: cloudtrain/linux-pod-el:10
  # netdev ---------------------------------------------------------------
  # Network-lab images, built by tools/images/netdev/build.sh (task image:netdev).
  frr:10:
    kind: container
    image: cloudtrain/frr:10       # FRRouting 10.7.1 (quay.io/frrouting/frr by digest); ospfd, ospf6d, bgpd, bfdd
    netdev: frr                    # device family: config via vtysh, show commands via vtysh -c
  nettools:1:
    kind: container
    image: cloudtrain/nettools:1   # iproute2, ping, traceroute, tcpdump, iperf3; also the link sidecar
  # Linux services host and Linux router/firewall/switch for network labs: dnsmasq,
  # Kea DHCPv4, BIND + dig, chrony, rsyslog, net-snmp, OpenSSH, nftables/iptables,
  # WireGuard, strongSwan, bridge/bond/VLAN tooling, tc, python3 + Jinja2/PyYAML.
  # No daemon starts on its own; labs start them from setup actions.
  netsvc:1:
    kind: container
    image: cloudtrain/netsvc:1
  # kubeadm:1.37 plus add-ons for the K8s curriculum, layered on that image (build.sh
  # kubeadm-full). Post-init hook: `/opt/cloudtrain/bin/addons-install <list> [--wait]
  # [--pool a-b]` with metrics-server, gateway-api, traefik (IngressClass + GatewayClass
  # "traefik", :80/:443, NodePorts 30080/30443), metallb (L2, pool default
  # 192.168.100.200-220), local-path (default StorageClass), falco; aliases ingress,
  # gateway, lb, storage, all. Images preloaded (lock/addons.lock). CKS material always
  # present: gVisor runsc registered with containerd as handler `runsc` (labs create the
  # RuntimeClass), kube-bench + cfg, AppArmor sample profiles and audit policies in
  # /opt/cloudtrain/security. No Trivy DB (size; see docs/dev-environment.md).
  kubeadm:1.37-full:
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.37.1-full
    kubernetesVersion: v1.37.1
    tier: K
    addons: [metrics-server, gateway-api, traefik, metallb, local-path, falco]
  kubeadm:1.37-sec:                    # same image, the curriculum's CKS ref
    kind: containerDisk
    image: cloudtrain/kubeadm-node:v1.37.1-full
    kubernetesVersion: v1.37.1
    tier: K
    addons: [metrics-server, gateway-api, traefik, metallb, local-path, falco]
  # linux (foundations stream) ------------------------------------------------
  # Tier A: unprivileged learner pods (tools/images/build-linux-pod.sh, task image:build:linux-pod).
  # userNamespace: the container driver runs them with pod hostUsers: false when every
  # node's runtime handler reports user namespace support (else host users, see
  # docs/dev-environment.md "Lab runtime tiers"). PID 1 is tini -> cloudtrain-init (hooks in
  # /etc/cloudtrain/init.d/, then sleep); no systemd. User `learner` (uid 1000) has NO sudo
  # rights (sudo is installed for sudo labs). Man pages, editors (vim, nano), admin tools,
  # git, python3/pip, gcc/make, cron/at, openssh client+server, sample data in /srv/samples.
  # Package sources point ONLY at the in-cluster mirror (dnf/apt/pip, see deploy/mirrors).
  el-lab:10:
    kind: container
    image: cloudtrain/el-lab:10        # AlmaLinux 10.2 userland
    tier: A
    userNamespace: true
    mirrors: [dnf, pypi]
  deb-lab:24.04:
    kind: container
    image: cloudtrain/deb-lab:24.04    # Ubuntu 24.04 userland, unminimized
    tier: A
    userNamespace: true
    mirrors: [apt, pypi]
  # Tier C: KubeVirt VMs for Linux labs (tools/images/build.sh el-vm|ubuntu-vm). Each carries
  # the mirror snapshot as a LOCAL repo (/opt/cloudtrain/repo/<el10|noble>), the only enabled
  # package source, so dnf/apt work offline in an isolated lab VPC. Extra blank disks come
  # from topology resources.disks (sizes, e.g. ["2Gi", "2Gi"]): /dev/vdb.. with serials
  # ct-data1.. (/dev/disk/by-id/virtio-ct-dataN). No users or keys baked in (cloud-init
  # injects learner with passwordless sudo, root key, host key), like etcd-host.
  el-vm:10:
    kind: containerDisk
    image: cloudtrain/el-vm:10         # AlmaLinux 10.2 GenericCloud; SELinux enforcing, firewalld, auditd
    tier: C
    mirrors: [dnf-local]
  ubuntu-vm:24.04:
    kind: containerDisk
    image: cloudtrain/ubuntu-vm:24.04  # Ubuntu 24.04 cloud image; AppArmor, nftables/ufw, auditd
    tier: C
    mirrors: [apt-local]
  # iac (wave 2) --------------------------------------------------------------
  # IaC learner workstation (tools/images/iac, build-iac-ws.sh): Terraform 1.15 as the
  # primary CLI with OpenTofu 1.11 alongside, kubectl, helm, jq/yq, git; user `learner`
  # (uid 1000, no sudo). Providers only from the offline filesystem mirror
  # /opt/cloudtrain/providers (~/.terraformrc; hashicorp kubernetes, helm, random, local,
  # null, tls, time, http; see tools/images/iac/providers.txt). Labs call `iac` (the
  # primary CLI) and the grading helper `ct-iac`, never a hard-coded binary, so
  # deploy/images/overlays/iac-opentofu.yaml can swap this ref to the OpenTofu-only
  # flavour. Ships a BUSL-1.1 binary: internal tenants only until IBM confirms external
  # use (curriculum iac licensingNote).
  terraform-ws:1.15:
    kind: container
    image: cloudtrain/iac-ws:1.15-terraform
    tier: A
workloadImages:
  - busybox:1.37
  - httpd:2.4-alpine
  - redis:7.4-alpine
  - caddy:2-alpine
  - httpd:2.4   # named-port-nodeport misconception (JSON merge patch drifts the image)
