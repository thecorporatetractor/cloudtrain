# Catalog overlay for tenants that must not receive Terraform (BUSL-1.1) binaries,
# e.g. external customers until IBM confirms hosted use in writing (see the iac domain's
# licensingNote in content/curriculum.yaml). Merged over catalog.yaml:
#   CATALOG_OVERLAY=deploy/images/overlays/iac-opentofu.yaml task orchestrator:deploy
# The lab ref stays terraform-ws:1.15; the pod runs the OpenTofu-only flavour, where
# `iac` and the `terraform` shim both run tofu. Labs marked Terraform-only in the
# curriculum (terraform query, actions, Stacks) do not work on it.
apiVersion: cloudtrain.dev/v1
kind: ImageCatalog
images:
  terraform-ws:1.15:
    kind: container
    image: cloudtrain/iac-ws:1.15-tofu
    tier: A
