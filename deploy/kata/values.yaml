# kata-deploy (KATA_DEPLOY_VERSION) for KIND_PROFILE=kata, installed by deploy/scripts/kata-up.sh
# (docs/kata-spike.md). Only Cloud Hypervisor on runtime-rs: the fastest and smallest sandbox
# measured, the VM is sized to the pod limit and charged to the pod cgroup, and it is what AKS
# Pod Sandboxing and GKE microvm use. The image is set by kata-up.sh (KATA_DEPLOY_IMAGE, by
# digest).
deploymentMode: daemonset
imagePullPolicy: IfNotPresent
k8sDistribution: k8s
# No nydus/erofs snapshotter: the default overlayfs + virtio-fs rootfs.
snapshotter:
  setup: []
# The default shim must be an enabled one (the chart's is qemu-runtime-rs).
defaultShim:
  amd64: clh-runtime-rs
runtimeClasses:
  enabled: true        # one RuntimeClass per enabled shim: kata-clh-runtime-rs
  createDefault: false
shims:
  disableAll: true
  clh-runtime-rs:
    enabled: true
node-feature-discovery:
  enabled: false
