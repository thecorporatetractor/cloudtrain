# kind cluster for KIND_PROFILE=managed-cni (docs/any-kubernetes.md, option (b)):
# Cilium is the primary CNI, standing in for a managed cloud's CNI (AKS Azure
# CNI powered by Cilium, GKE Dataplane V2); Kube-OVN runs in non-primary mode
# behind Multus and only serves the lab networks. Two workers, so lab links
# cross nodes (geneve between workers).
# - No default CNI: deploy/scripts/dev-up.sh installs Cilium.
# - Pod subnet 10.32.0.0/16 (Cilium IPAM "kubernetes"), distinct from Kube-OVN's
#   own default subnet (10.16.0.0/16, unused by pods here) and the lab ranges.
# - /dev/kvm on every node, as deploy/kind/cluster.yaml (see the notes there).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.32.0.0/16
  serviceSubnet: 10.96.0.0/12
nodes:
  - role: control-plane
    labels:
      kube-ovn/role: master
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
  - role: worker
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
  - role: worker
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
