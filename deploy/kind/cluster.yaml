# kind cluster for the CloudTrain local runtime.
# - No default CNI: Kube-OVN is installed by deploy/scripts/dev-up.sh.
# - /dev/kvm is bind-mounted explicitly so KubeVirt's device plugin sees it on
#   every node and the dependency is documented here.
# - /dev/vhost-net and /dev/net/tun are deliberately NOT bind-mounted: kind
#   nodes are privileged, so Docker copies every host device node that exists
#   when the node container STARTS. A bind mount of a missing device makes
#   Docker create an empty *directory* at /dev/vhost-net on the host, which then
#   blocks `modprobe vhost_net` after a WSL restart (seen 2026-10-13).
#   deploy/scripts/host-prep.sh loads the modules before the cluster starts.
# The node image is injected from deploy/versions.env (KIND_NODE_IMAGE).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.16.0.0/16
  serviceSubnet: 10.96.0.0/12
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    # Second line of defence behind pin_image (deploy/scripts/lib.sh): start image GC late.
    # Existing clusters only pick this up when recreated.
    imageGCHighThresholdPercent: 90
    imageGCLowThresholdPercent: 85
nodes:
  - role: control-plane
    labels:
      kube-ovn/role: master
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
  - role: worker
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
