# Kube-OVN as a NON-primary CNI (KIND_PROFILE=managed-cni; merged over
# values.yaml). Another CNI (Cilium here, the cloud's CNI on AKS/EKS/GKE)
# owns eth0 of ordinary pods; Kube-OVN only serves NetworkAttachmentDefinitions
# of type kube-ovn (lab segments, the access network, and the session
# management/lab segments that wired lab pods and VMs take as their Multus
# default network). docs/any-kubernetes.md, section 2 (b).
cni_conf:
  NON_PRIMARY_CNI: true
  # install-cni still writes <priority>-kube-ovn.conflist. Multus
  # (multusConfigFile: auto) delegates to the FIRST conflist in /etc/cni/net.d,
  # which must stay the primary CNI's (Cilium: 05-cilium.conflist).
  CNI_CONFIG_PRIORITY: "90"
