# Kube-OVN values for the local kind runtime (chart kubeovn/kube-ovn).
# MASTER_NODES is set at install time to the kind control-plane IP.
# Chart defaults already give: geneve overlay, POD_CIDR 10.16.0.0/16 (matches
# deploy/kind/cluster.yaml podSubnet), JOIN_CIDR 100.64.0.0/16, ENABLE_LB/NP,
# ENABLE_KEEP_VM_IP (KubeVirt VMs keep their IP), ENABLE_NAT_GW (VPC NAT gateways).
OVN_CENTRAL_MODE: cluster
networking:
  NET_STACK: ipv4
  NETWORK_TYPE: geneve
  # OVN NB/SB (6641/6642) and raft (6643/6644) over mutual TLS: the chart
  # generates the kube-ovn-tls CA/cert once and keeps it across upgrades. Without
  # it the NB DB answers any pod on the network (seen from a lab workstation).
  ENABLE_SSL: true
func:
  ENABLE_KEEP_VM_IP: true
  ENABLE_NAT_GW: true
# Smaller requests so the stack fits next to other workloads on a laptop.
kube-ovn-monitor:
  requests: { cpu: 50m, memory: 100Mi }
kube-ovn-pinger:
  requests: { cpu: 20m, memory: 50Mi }
ovn-central:
  requests: { cpu: 100m, memory: 200Mi }
ovs-ovn:
  requests: { cpu: 100m, memory: 200Mi }
kube-ovn-controller:
  requests: { cpu: 100m, memory: 200Mi }
kube-ovn-cni:
  requests: { cpu: 50m, memory: 100Mi }
