apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
  # Importer, uploader and cloner pods (lab VM disks) run where these say. kind has
  # one pool; with a tainted lab pool (orchestrator.labNodes) set them to it, e.g.
  #   workload:
  #     nodeSelector: {cloudtrain.dev/pool: labs}
  #     tolerations: [{key: cloudtrain.dev/labs, operator: Equal, value: "true", effect: NoSchedule}]
  # (pullMethod node imports pull the lab image on that node; with
  # HonorWaitForFirstConsumer the disk follows the VM's node anyway).
  workload:
    nodeSelector:
      kubernetes.io/os: linux
  config:
    # No storage class is named here: CDI scratch space and imports follow the
    # cluster default class (and each class's CDI StorageProfile). `task
    # dev:up` sets scratchSpaceStorageClass for kind (DEV_STORAGE_CLASS, default
    # "standard"): kind's local-path provisioner reports no fsGroup support.
    featureGates:
      - HonorWaitForFirstConsumer
