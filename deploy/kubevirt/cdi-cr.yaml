apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
  config:
    # kind's local-path provisioner reports no fsGroup support; scratch space
    # comes from the same class.
    scratchSpaceStorageClass: standard
    featureGates:
      - HonorWaitForFirstConsumer
