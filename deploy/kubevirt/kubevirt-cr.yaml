# KubeVirt CR for the local runtime: hardware KVM only.
# useEmulation is explicitly false: if /dev/kvm is unusable, VMIs fail to
# schedule (devices.kubevirt.io/kvm = 0) instead of silently running under TCG.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
  configuration:
    developerConfiguration:
      useEmulation: false
      featureGates: []
    network:
      # Lab VMs must see their real lab IP (kubeadm advertise address), so they
      # use bridge binding on the (Kube-OVN) pod network instead of masquerade.
      permitBridgeInterfaceOnPodNetwork: true
