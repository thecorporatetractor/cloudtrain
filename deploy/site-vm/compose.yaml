# CloudTrain public website on one Standard_B1s VM (1 GiB): Caddy (the static site, Cloudflare
# origin certificate) and the sidecar (rate limit, managed identity, proxy to the public Function
# app). No personal data and no database here. docs/deploy-site-vm.md explains it.
#
#   cp .env.example .env    # fill in, chmod 600
#   ./imds-firewall.sh      # adds Caddy's outbound block to what the host's firewall unit sets up
#   docker compose up -d
#
# The daemon runs with userns-remap: the files in ./certs must belong to the mapped user (install
# step 5). 96m of container limits leaves the rest to the OS and Docker. Measured figures are in the docs. Images are pinned by tag and digest; bump the sidecar with SITE_PROXY_IMAGE in .env.
name: cloudtrain-site

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 64
  logging:
    driver: json-file
    options: { max-size: 5m, max-file: '2' }

services:
  site-proxy:
    <<: *hardening
    image: ${SITE_PROXY_IMAGE:?set in .env}
    environment:
      # A soft limit under mem_limit: the runtime collects harder before the kernel would kill it.
      GOMEMLIMIT: 24MiB
      SITE_PROXY_FUNCTION_URL: ${SITE_PROXY_FUNCTION_URL:?set in .env}
      SITE_PROXY_FUNCTION_AUDIENCE: ${SITE_PROXY_FUNCTION_AUDIENCE:-}
      SITE_PROXY_CLIENT_ID: ${SITE_PROXY_CLIENT_ID:-}
      SITE_PROXY_AUTH: ${SITE_PROXY_AUTH:-imds}
      SITE_PROXY_CLIENT_IP_HEADER: ${SITE_PROXY_CLIENT_IP_HEADER:-CF-Connecting-IP}
      SITE_PROXY_PER_IP_PER_HOUR: ${SITE_PROXY_PER_IP_PER_HOUR:-60}
      SITE_PROXY_GLOBAL_RPS: ${SITE_PROXY_GLOBAL_RPS:-5}
      SITE_PROXY_IMDS_URL: ${SITE_PROXY_IMDS_URL:-http://169.254.169.254/metadata/identity/oauth2/token}
    networks:
      # Fixed: imds-firewall.sh lets this address, and no other container, reach IMDS.
      site: { ipv4_address: 10.250.50.20 }
    mem_limit: 32m
    memswap_limit: 64m
    healthcheck:
      test: ['CMD', '/site-proxy', '-healthcheck']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    <<: *hardening
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # The image's binary carries a file capability, which a non-root user cannot use under
    # no-new-privileges: root in the container, with nothing but the one capability it needs.
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_HOST: ${SITE_HOST:?set in .env}
      GOMEMLIMIT: 48MiB
      # Authenticated Origin Pulls. The default refuses anyone without Cloudflare's client certificate.
      SITE_CLIENT_AUTH_MODE: ${SITE_CLIENT_AUTH_MODE:-require_and_verify}
    # 443 only: Cloudflare in Full (strict) talks to nothing else. The NSG admits only its ranges.
    ports: ['${HTTPS_PORT:-443}:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./certs:/certs:ro
    tmpfs: [/data, /config]
    networks:
      site: { ipv4_address: 10.250.50.10 }
    mem_limit: 64m
    memswap_limit: 128m
    depends_on: [site-proxy]

networks:
  site:
    ipam:
      config: [{ subnet: 10.250.50.0/24 }]
