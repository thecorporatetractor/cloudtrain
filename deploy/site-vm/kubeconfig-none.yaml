# Site-only use: the gateway needs a kubeconfig context to start, but the website never
# reaches a cluster (Caddy forwards /api/public/* only, and CT_SWEEP_INTERVAL_MS=0).
# The server address is unroutable on purpose.
apiVersion: v1
kind: Config
clusters:
  - name: none
    cluster: { server: 'https://127.0.0.1:1' }
users:
  - name: none
    user: {}
contexts:
  - name: none
    context: { cluster: none, user: none }
current-context: none
