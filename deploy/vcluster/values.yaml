# vcluster values for `k8s-cluster: virtual` lab nodes (vcluster chart, see VCLUSTER_VERSION).
# Small footprint: one replica, embedded database, modest requests.
controlPlane:
  statefulSet:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
# No cluster-scoped RBAC: the lab-orchestrator installs the chart with its namespaced
# session permissions only (docs/deploy.md, RBAC). With the defaults ("auto") the
# chart adds a ClusterRole for volume snapshots (persistentvolumes,
# volumesnapshotclasses, volumesnapshotcontents), which labs do not use.
rbac:
  clusterRole:
    enabled: false
  enableVolumeSnapshotRules:
    enabled: false
