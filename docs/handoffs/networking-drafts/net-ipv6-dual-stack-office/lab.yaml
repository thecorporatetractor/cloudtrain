apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-ipv6-dual-stack-office
  title: Add IPv6 to the district office LAN
  domain: networking
  frameworks: [ccna:network-fundamentals]
  difficulty: medium
  estimatedMinutes: 20
  tags: [ipv6, slaac, router-advertisement, dual-stack]
  version: 1
spec:
  description: |
    The district office LAN already runs IPv4 (`10.{{octet}}.5.0/24`). Its
    router `mv-office-1` (FRR console, `eth1`) and the staff hosts `staff-office-1`
    and `staff-office-2` hang off the switch `mv-sw-office-1`.

    The regional network has delegated **2001:db8:{{site}}:5::/64** to the office.

    1. On `mv-office-1`, give `eth1` the address `2001:db8:{{site}}:5::1/64` and
       send router advertisements for the prefix so hosts configure themselves
       (SLAAC). Do not configure global IPv6 addresses on the hosts by hand.
    The staff hosts run `dhcpcd`, which builds SLAAC addresses from router
    advertisements.

    2. Prove that both staff hosts have a SLAAC address in the prefix, use the
       router's link-local address as their IPv6 default gateway, reach each other
       over IPv6 and reach `2001:db8:{{site}}:5::1`.
  objectives:
    - Assign a global IPv6 address on a router interface
    - Enable router advertisements so hosts autoconfigure with SLAAC
    - Verify IPv6 addresses, default routes and reachability on the hosts
  params:
    octet:
      type: int
      min: 20
      max: 90
    site:
      type: choice
      values: [a10, b20, c30, d40]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: mv-office-1
        driver: netdev
        image: frr:10
        access: [console]
      - name: mv-sw-office-1
        driver: container
        image: netsvc:1
        resources: { cpu: 0.25, memoryMiB: 96 }
      - name: staff-office-1
        driver: container
        image: netsvc:1
        resources: { cpu: 0.25, memoryMiB: 96 }
        access: [shell]
      - name: staff-office-2
        driver: container
        image: netsvc:1
        resources: { cpu: 0.25, memoryMiB: 96 }
        access: [shell]
    links:
      - { a: "mv-office-1:eth1", b: "mv-sw-office-1:eth1" }
      - { a: "mv-sw-office-1:eth2", b: "staff-office-1:eth1" }
      - { a: "mv-sw-office-1:eth3", b: "staff-office-2:eth1" }
  setup:
    - on: mv-sw-office-1
      run: |
        ip link add br0 type bridge
        for p in eth1 eth2 eth3; do ip link set $p master br0; done
        ip link set br0 up
    - on: mv-office-1
      config: |
        interface eth1
         description office LAN
         ip address 10.{{octet}}.5.1/24
    - on: staff-office-1
      run: &client |
        ip addr replace 10.{{octet}}.5.1$(hostname | grep -q 'office-2' && echo 2 || echo 1)/24 dev eth1
        setsid dhcpcd -6 -b --nohook resolv.conf eth1 </dev/null >/dev/null 2>&1 &
        sleep 1
    - on: staff-office-2
      run: *client
  checks:
    - id: router-address
      description: mv-office-1 has the office /64 address on eth1
      type: device-cmd
      on: mv-office-1
      command: show interface eth1
      expect: { match: contains, value: "inet6 2001:db8:{{site}}:5::1/64" }
      skills: [net.addressing.ipv6]
    - id: host1-slaac
      description: staff-office-1 autoconfigured an address in the office prefix
      type: shell
      on: staff-office-1
      command: &slaac ip -6 addr show dev eth1 scope global | grep -E 'inet6 2001:db8:{{site}}:5:[0-9a-f:]+/64 .*dynamic' | grep -vc 'inet6 2001:db8:{{site}}:5::1/'
      expect: { match: regex, value: "^[1-9]$" }
      skills: [net.addressing.ipv6-slaac]
      weight: 2
    - id: host2-slaac
      description: staff-office-2 autoconfigured an address in the office prefix
      type: shell
      on: staff-office-2
      command: *slaac
      expect: { match: regex, value: "^[1-9]$" }
      skills: [net.addressing.ipv6-slaac]
      weight: 2
    - id: host-default-route
      description: staff-office-1 learned an IPv6 default route via the router's link-local address
      type: shell
      on: staff-office-1
      command: ip -6 route show default dev eth1
      expect: { match: regex, value: "^default via fe80::[0-9a-f:]+ " }
      skills: [net.addressing.ipv6-slaac]
    - id: host-to-host
      description: staff-office-1 reaches staff-office-2's SLAAC address
      type: shell
      on: staff-office-1
      command: |
        me=$(ip -6 addr show dev eth1 scope global | awk '/dynamic/{print $2}' | cut -d/ -f1 | head -1); [ -n "$me" ] || exit 1
        peer=$(ping -6 -c2 -W2 -I "$me" ff02::1 2>/dev/null | sed -n 's/.* from \(2001:db8:{{site}}:5:[0-9a-f:]*\): .*/\1/p' | grep -v -e "^$me\$" -e '::1$' | head -1)
        [ -n "$peer" ] && ping -6 -c1 -W2 "$peer" >/dev/null
      timeoutSec: 20
      skills: [net.addressing.ipv6]
    - id: host-to-router
      description: staff-office-2 reaches the router's global address
      type: shell
      on: staff-office-2
      command: ping -6 -c1 -W2 2001:db8:{{site}}:5::1 >/dev/null
      skills: [net.addressing.ipv6]
  hints:
    - title: Router advertisements are off by default
      body: FRR suppresses router advertisements until you turn them on for the interface. Advertise the prefix and, while you test, use a short RA interval.
      command: "show ipv6 nd ra-interfaces"
      cost: 1
    - title: The FRR commands
      body: "Under `interface eth1`: `ipv6 address <addr>/64`, `ipv6 nd prefix <prefix>/64`, `no ipv6 nd suppress-ra`, and optionally `ipv6 nd ra-interval 10`."
      cost: 2
    - title: Checking a host
      body: A SLAAC address is listed with `dynamic` and a lifetime; the default route shows `proto ra` and a `fe80::` next hop.
      command: "ip -6 addr show dev eth1; ip -6 route"
      cost: 1
  misconceptions:
    - id: static-host-addresses
      description: Configures the hosts' global addresses by hand instead of using SLAAC
      mutation:
        on: staff-office-1
        run: |
          dhcpcd -x eth1 >/dev/null 2>&1; pkill dhcpcd; sleep 1
          ip -6 addr add 2001:db8:{{site}}:5::11/64 dev eth1
          ip -6 route replace default via 2001:db8:{{site}}:5::1
      expectFail: [host1-slaac, host-default-route]
      feedback: Hand-set addresses work but are not SLAAC; the office hosts must learn the prefix and gateway from router advertisements.
    - id: address-without-ra
      description: Gives the router its address but leaves router advertisements suppressed
      mutation:
        on: mv-office-1
        config: |
          interface eth1
           ipv6 address 2001:db8:{{site}}:5::1/64
      expectFail: [host1-slaac, host2-slaac, host-default-route]
      feedback: Without router advertisements the hosts never hear about the prefix or the gateway.
  solution:
    explanation: |
      Address the router interface and advertise the /64 with router
      advertisements; the hosts build their own addresses (SLAAC) and take the
      advertising router's link-local address as their default gateway.
    steps:
      - on: mv-office-1
        config: |
          interface eth1
           ipv6 address 2001:db8:{{site}}:5::1/64
           ipv6 nd prefix 2001:db8:{{site}}:5::/64
           ipv6 nd ra-interval 5
           no ipv6 nd suppress-ra
      - on: staff-office-2
        run: |
          for i in $(seq 40); do ip -6 addr show dev eth1 scope global | grep -q dynamic && break; sleep 1; done
          ip -6 addr show dev eth1 scope global | grep -q dynamic
      - on: staff-office-1
        run: |
          for i in $(seq 40); do ip -6 addr show dev eth1 scope global | grep -q dynamic && break; sleep 1; done
          ip -6 addr show dev eth1 scope global | grep -q dynamic
