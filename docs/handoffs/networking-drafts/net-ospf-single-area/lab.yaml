apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-ospf-single-area
  title: Replace static routes with single-area OSPF
  domain: networking
  frameworks: [ccna:ip-connectivity]
  difficulty: medium
  estimatedMinutes: 25
  tags: [ospf, frr, router-id, loopback]
  version: 1
spec:
  description: |
    Four Marlow Valley routers (FRR consoles) are routed with hand-written static
    routes that nobody wants to maintain:

    | Router | Loopback (router ID) | Links |
    |---|---|---|
    | mv-core-1 | 10.255.{{octet}}.1/32 | eth1 north, eth2 south, eth3 edge |
    | mv-campus-north | 10.255.{{octet}}.2/32 | eth1 core, eth3 south, eth2 north LAN 10.{{octet}}.10.0/24 |
    | mv-campus-south | 10.255.{{octet}}.3/32 | eth1 core, eth3 north, eth2 south LAN 10.{{octet}}.30.0/24 |
    | mv-edge-1 | 10.255.{{octet}}.4/32 | eth1 core |

    Run OSPFv2 in area 0 on all four routers: enable it on every link, LAN and
    loopback interface, and set each router ID explicitly to the router's
    loopback address. Then remove every static route. `north-host` and
    `south-host` must keep reaching each other and every loopback must be
    reachable from every router.
  objectives:
    - Enable OSPF area 0 on interfaces and loopbacks
    - Set stable router IDs from loopback addresses
    - Verify adjacencies and OSPF routes, then retire static routes
  params:
    octet:
      type: int
      min: 20
      max: 90
  topology:
    entry: workstation
    nodes:
      - { name: workstation, driver: container, image: jumphost:1, access: [shell] }
      - { name: mv-core-1, driver: netdev, image: frr:10, access: [console] }
      - { name: mv-campus-north, driver: netdev, image: frr:10, access: [console] }
      - { name: mv-campus-south, driver: netdev, image: frr:10, access: [console] }
      - { name: mv-edge-1, driver: netdev, image: frr:10, access: [console] }
      - { name: north-host, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: south-host, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
    links:
      - { a: "mv-core-1:eth1", b: "mv-campus-north:eth1", subnet: "10.{{octet}}.0.0/30" }
      - { a: "mv-core-1:eth2", b: "mv-campus-south:eth1", subnet: "10.{{octet}}.0.4/30" }
      - { a: "mv-core-1:eth3", b: "mv-edge-1:eth1", subnet: "10.{{octet}}.0.8/30" }
      - { a: "mv-campus-north:eth3", b: "mv-campus-south:eth3", subnet: "10.{{octet}}.0.12/30" }
      - { a: "mv-campus-north:eth2", b: "north-host:eth1", subnet: "10.{{octet}}.10.0/24" }
      - { a: "mv-campus-south:eth2", b: "south-host:eth1", subnet: "10.{{octet}}.30.0/24" }
  setup:
    - on: mv-core-1
      config: |
        interface lo
         ip address 10.255.{{octet}}.1/32
        interface eth1
         ip address 10.{{octet}}.0.1/30
        interface eth2
         ip address 10.{{octet}}.0.5/30
        interface eth3
         ip address 10.{{octet}}.0.9/30
        ip route 10.{{octet}}.10.0/24 10.{{octet}}.0.2
        ip route 10.{{octet}}.30.0/24 10.{{octet}}.0.6
        ip route 10.255.{{octet}}.2/32 10.{{octet}}.0.2
        ip route 10.255.{{octet}}.3/32 10.{{octet}}.0.6
        ip route 10.255.{{octet}}.4/32 10.{{octet}}.0.10
    - on: mv-campus-north
      config: |
        interface lo
         ip address 10.255.{{octet}}.2/32
        interface eth1
         ip address 10.{{octet}}.0.2/30
        interface eth2
         ip address 10.{{octet}}.10.1/24
        interface eth3
         ip address 10.{{octet}}.0.13/30
        ip route 0.0.0.0/0 10.{{octet}}.0.1
    - on: mv-campus-south
      config: |
        interface lo
         ip address 10.255.{{octet}}.3/32
        interface eth1
         ip address 10.{{octet}}.0.6/30
        interface eth2
         ip address 10.{{octet}}.30.1/24
        interface eth3
         ip address 10.{{octet}}.0.14/30
        ip route 0.0.0.0/0 10.{{octet}}.0.5
    - on: mv-edge-1
      config: |
        interface lo
         ip address 10.255.{{octet}}.4/32
        interface eth1
         ip address 10.{{octet}}.0.10/30
        ip route 10.{{octet}}.0.0/16 10.{{octet}}.0.9
        ip route 10.255.{{octet}}.0/24 10.{{octet}}.0.9
    - { on: north-host, run: "ip addr replace 10.{{octet}}.10.10/24 dev eth1 && ip route replace default via 10.{{octet}}.10.1" }
    - { on: south-host, run: "ip addr replace 10.{{octet}}.30.10/24 dev eth1 && ip route replace default via 10.{{octet}}.30.1" }
  checks:
    - id: core-neighbours
      description: mv-core-1 has three Full OSPF neighbours with the expected router IDs
      type: shell
      on: mv-core-1
      command: vtysh -c 'show ip ospf neighbor' | awk '/Full/{print $1}' | sort | tr '\n' ' '
      expect: { match: exact, value: "10.255.{{octet}}.2 10.255.{{octet}}.3 10.255.{{octet}}.4 " }
      timeoutSec: 10
      skills: [net.routing.ospf]
      weight: 2
    - id: north-south-adjacent
      description: mv-campus-north is Full with both mv-core-1 and mv-campus-south
      type: shell
      on: mv-campus-north
      command: vtysh -c 'show ip ospf neighbor' | awk '/Full/{print $1}' | sort | tr '\n' ' '
      expect: { match: exact, value: "10.255.{{octet}}.1 10.255.{{octet}}.3 " }
      timeoutSec: 10
      skills: [net.routing.ospf]
    - id: edge-learns-everything
      description: mv-edge-1 learns both campus LANs and all loopbacks through OSPF
      type: shell
      on: mv-edge-1
      command: |
        r=$(vtysh -c 'show ip route ospf')
        for p in 10.{{octet}}.10.0/24 10.{{octet}}.30.0/24 10.255.{{octet}}.1/32 10.255.{{octet}}.2/32 10.255.{{octet}}.3/32; do echo "$r" | grep -q "^O>\* $p" || { echo missing $p; exit 1; }; done
      timeoutSec: 10
      skills: [net.routing.ospf]
      weight: 2
    - id: no-static
      description: No router has static routes left
      type: shell
      on: mv-edge-1
      command: "! vtysh -c 'show running-config' | grep -q '^ip route'"
      skills: [net.routing.ospf]
      weight: 0.5
    - id: no-static-core
      description: mv-core-1 has no static routes left
      type: shell
      on: mv-core-1
      command: "! vtysh -c 'show running-config' | grep -q '^ip route'"
      skills: [net.routing.ospf]
      weight: 0.5
    - id: no-static-campus
      description: mv-campus-north and its LAN rely on OSPF only (no static routes)
      type: shell
      on: mv-campus-north
      command: "! vtysh -c 'show running-config' | grep -q '^ip route'"
      skills: [net.routing.ospf]
      weight: 0.5
    - id: lans-reachable
      description: north-host reaches south-host and the edge loopback
      type: shell
      on: north-host
      command: ping -c1 -W2 10.{{octet}}.30.10 >/dev/null && ping -c1 -W2 10.255.{{octet}}.4 >/dev/null
      skills: [net.routing.ospf]
    - id: router-ids
      description: mv-campus-south uses its loopback as OSPF router ID
      type: device-cmd
      on: mv-campus-south
      command: show ip ospf
      expect: { match: contains, value: "OSPF Routing Process, with ID: 10.255.{{octet}}.3" }
      skills: [net.routing.ospf]
  hints:
    - title: FRR interface mode
      body: "Put `ip ospf area 0` under each interface (including `lo`) and add a `router ospf` section with `ospf router-id`. FRR only starts the OSPF instance when the `router ospf` section exists."
      cost: 1
    - title: Check before you delete
      body: Remove static routes only after `show ip ospf neighbor` shows Full and `show ip route ospf` lists the remote networks; otherwise you cut yourself off.
      command: "show ip ospf neighbor"
      cost: 1
    - title: Removing static routes
      body: "Prefix the exact route with `no`, e.g. `no ip route 0.0.0.0/0 10.{{octet}}.0.1`."
      cost: 1
  misconceptions:
    - id: loopbacks-left-out
      description: Runs OSPF on the links and LANs but not on the loopbacks
      mutation:
        on: mv-campus-north
        config: |
          router ospf
           ospf router-id 10.255.{{octet}}.2
          interface eth1
           ip ospf area 0
          interface eth2
           ip ospf area 0
          interface eth3
           ip ospf area 0
          no ip route 0.0.0.0/0 10.{{octet}}.0.1
      expectFail: [edge-learns-everything, core-neighbours]
      feedback: A loopback is only advertised if OSPF runs on it; the edge must learn every router's loopback.
    - id: automatic-router-id
      description: Leaves the router ID to FRR's automatic choice
      mutation:
        on: mv-campus-south
        config: |
          router ospf
          interface eth1
           ip ospf area 0
          interface eth2
           ip ospf area 0
          interface eth3
           ip ospf area 0
          interface lo
           ip ospf area 0
      expectFail: [router-ids]
      feedback: Without `ospf router-id` FRR picks an ID from its addresses, which can change; the district standard is the loopback.
  solution:
    explanation: |
      On every router: `ip ospf area 0` on all links, LANs and lo, a `router ospf`
      section with `ospf router-id <loopback>`, then `no ip route` for each static
      route once OSPF has converged.
    steps:
      - on: mv-core-1
        config: |
          router ospf
           ospf router-id 10.255.{{octet}}.1
          interface lo
           ip ospf area 0
          interface eth1
           ip ospf area 0
          interface eth2
           ip ospf area 0
          interface eth3
           ip ospf area 0
      - on: mv-campus-north
        config: |
          router ospf
           ospf router-id 10.255.{{octet}}.2
          interface lo
           ip ospf area 0
          interface eth1
           ip ospf area 0
          interface eth2
           ip ospf area 0
          interface eth3
           ip ospf area 0
      - on: mv-campus-south
        config: |
          router ospf
           ospf router-id 10.255.{{octet}}.3
          interface lo
           ip ospf area 0
          interface eth1
           ip ospf area 0
          interface eth2
           ip ospf area 0
          interface eth3
           ip ospf area 0
      - on: mv-edge-1
        config: |
          router ospf
           ospf router-id 10.255.{{octet}}.4
          interface lo
           ip ospf area 0
          interface eth1
           ip ospf area 0
      - on: mv-edge-1
        run: |
          for i in $(seq 90); do [ $(vtysh -c 'show ip route ospf' | grep -c '^O>\*') -ge 7 ] && break; sleep 1; done
          printf 'no ip route 10.{{octet}}.0.0/16 10.{{octet}}.0.9\nno ip route 10.255.{{octet}}.0/24 10.{{octet}}.0.9\n' > /tmp/s.conf && vtysh -f /tmp/s.conf
        timeoutSec: 120
      - on: mv-core-1
        config: |
          no ip route 10.{{octet}}.10.0/24 10.{{octet}}.0.2
          no ip route 10.{{octet}}.30.0/24 10.{{octet}}.0.6
          no ip route 10.255.{{octet}}.2/32 10.{{octet}}.0.2
          no ip route 10.255.{{octet}}.3/32 10.{{octet}}.0.6
          no ip route 10.255.{{octet}}.4/32 10.{{octet}}.0.10
      - { on: mv-campus-north, config: "no ip route 0.0.0.0/0 10.{{octet}}.0.1\n" }
      - { on: mv-campus-south, config: "no ip route 0.0.0.0/0 10.{{octet}}.0.5\n" }
