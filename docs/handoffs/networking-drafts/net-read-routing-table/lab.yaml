apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-read-routing-table
  title: Predict next hops from a routing table
  domain: networking
  frameworks: [ccna:ip-connectivity]
  difficulty: easy
  estimatedMinutes: 15
  tags: [routing-table, longest-prefix, administrative-distance]
  version: 1
spec:
  description: |
    The core router `mv-core-1` (FRR console) has connected, static and OSPF
    routes towards the north campus (`mv-campus-north`), the south campus
    (`mv-campus-south`) and the regional edge (`mv-edge-1`). Some of them overlap.

    For each destination below, find the route `mv-core-1` really forwards with
    and write one line per destination to `/home/learner/routes.txt` on your
    workstation, in the form `<destination> <protocol> <next-hop>`, where
    protocol is `connected`, `static` or `ospf`:

    | Destination |
    |---|
    | 10.{{octet}}.20.{{h1}} |
    | 10.{{octet}}.30.{{h2}} |
    | 10.{{octet}}.20.{{h3}} |
    | 10.{{octet}}.40.{{h2}} |
    | 198.51.100.{{h1}} |

    Example line: `10.9.9.9 static 10.9.0.6`. Do not change any router.
  objectives:
    - Read `show ip route` codes, prefixes, distances and next hops
    - Apply longest-prefix match before administrative distance
    - Tell which overlapping route is installed in the forwarding table
  params:
    octet:
      type: int
      min: 20
      max: 90
    h1:
      type: int
      min: 10
      max: 99
    h2:
      type: int
      min: 10
      max: 99
    h3:
      type: int
      min: 130
      max: 250
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: jumphost:1
        access: [shell]
      - name: mv-core-1
        driver: netdev
        image: frr:10
        access: [console]
      - name: mv-campus-north
        driver: netdev
        image: frr:10
        access: [console]
      - name: mv-campus-south
        driver: netdev
        image: frr:10
        access: [console]
      - name: mv-edge-1
        driver: netdev
        image: frr:10
        access: [console]
    links:
      - { a: "mv-core-1:eth1", b: "mv-campus-north:eth1", subnet: "10.{{octet}}.0.0/30" }
      - { a: "mv-core-1:eth2", b: "mv-campus-south:eth1", subnet: "10.{{octet}}.0.4/30" }
      - { a: "mv-core-1:eth3", b: "mv-edge-1:eth1", subnet: "10.{{octet}}.0.8/30" }
  setup:
    - on: mv-campus-north
      run: |
        for n in 20 40; do ip link add lan$n type dummy 2>/dev/null; ip link set lan$n up; done
    - on: mv-campus-north
      config: |
        interface eth1
         ip address 10.{{octet}}.0.2/30
         ip ospf area 0
        interface lan20
         ip address 10.{{octet}}.20.1/24
         ip ospf area 0
        interface lan40
         ip address 10.{{octet}}.40.1/24
         ip ospf area 0
        router ospf
         ospf router-id 10.255.{{octet}}.2
    - on: mv-campus-south
      run: |
        ip link add lan30 type dummy 2>/dev/null; ip link set lan30 up
    - on: mv-campus-south
      config: |
        interface eth1
         ip address 10.{{octet}}.0.6/30
        interface lan30
         ip address 10.{{octet}}.30.1/24
        ip route 0.0.0.0/0 10.{{octet}}.0.5
    - on: mv-edge-1
      config: |
        interface eth1
         ip address 10.{{octet}}.0.10/30
        ip route 10.{{octet}}.0.0/16 10.{{octet}}.0.9
    - on: mv-core-1
      config: |
        interface eth1
         ip address 10.{{octet}}.0.1/30
         ip ospf area 0
        interface eth2
         ip address 10.{{octet}}.0.5/30
        interface eth3
         ip address 10.{{octet}}.0.9/30
        router ospf
         ospf router-id 10.255.{{octet}}.1
        ip route 10.{{octet}}.30.0/24 10.{{octet}}.0.6
        ip route 10.{{octet}}.20.128/25 10.{{octet}}.0.6
        ip route 10.{{octet}}.40.0/24 10.{{octet}}.0.10 200
        ip route 0.0.0.0/0 10.{{octet}}.0.10
    - on: mv-core-1
      run: |
        for i in $(seq 60); do vtysh -c 'show ip route ospf' | grep -q '10.{{octet}}.40.0/24' && exit 0; sleep 1; done; exit 1
      timeoutSec: 90
  checks:
    - id: ospf-route
      description: The OSPF-learned destination has the right protocol and next hop
      type: shell
      on: workstation
      command: &line awk 'NF==3{print $1, tolower($2), $3}' /home/learner/routes.txt
      expect: { match: regex, value: "(?m)^10\\.{{octet}}\\.20\\.{{h1}} ospf 10\\.{{octet}}\\.0\\.2$" }
      skills: [net.routing.route-selection]
    - id: static-route
      description: The statically routed destination has the right protocol and next hop
      type: shell
      on: workstation
      command: *line
      expect: { match: regex, value: "(?m)^10\\.{{octet}}\\.30\\.{{h2}} static 10\\.{{octet}}\\.0\\.6$" }
      skills: [net.routing.route-selection]
    - id: longest-prefix
      description: The destination covered by an OSPF /24 and a static /25 uses the /25
      type: shell
      on: workstation
      command: *line
      expect: { match: regex, value: "(?m)^10\\.{{octet}}\\.20\\.{{h3}} static 10\\.{{octet}}\\.0\\.6$" }
      skills: [net.routing.route-selection]
      weight: 2
    - id: admin-distance
      description: The destination with an OSPF route and a distance-200 static route uses OSPF
      type: shell
      on: workstation
      command: *line
      expect: { match: regex, value: "(?m)^10\\.{{octet}}\\.40\\.{{h2}} ospf 10\\.{{octet}}\\.0\\.2$" }
      skills: [net.routing.route-selection]
      weight: 2
    - id: default-route
      description: The outside destination follows the default route
      type: shell
      on: workstation
      command: *line
      expect: { match: regex, value: "(?m)^198\\.51\\.100\\.{{h1}} static 10\\.{{octet}}\\.0\\.10$" }
      skills: [net.routing.route-selection]
    - id: core-unchanged
      description: mv-core-1 still holds its original static routes
      type: device-cmd
      on: mv-core-1
      command: show running-config
      expect: { match: regex, value: "ip route 10\\.{{octet}}\\.40\\.0/24 10\\.{{octet}}\\.0\\.10 200" }
      skills: [net.routing.route-selection]
      weight: 0.5
  hints:
    - title: Ask the router
      body: "`show ip route <address>` prints the route that matches one address, with its distance and next hop. Compare it with the full `show ip route`."
      command: "show ip route 10.{{octet}}.20.{{h3}}"
      cost: 1
    - title: Order of decisions
      body: The longest matching prefix always wins. Only between routes with the same prefix does the lower administrative distance (static 1, OSPF 110, floating static 200) decide.
      cost: 1
    - title: Installed or not?
      body: In `show ip route`, a `>` and `*` mark the selected route that is in the forwarding table; a route listed without them is a backup.
      cost: 1
  misconceptions:
    - id: distance-before-prefix
      description: Lets the static route's lower distance decide, or picks OSPF because it covers the whole /24
      mutation:
        on: workstation
        run: |
          printf '%s\n' "10.{{octet}}.20.{{h1}} ospf 10.{{octet}}.0.2" "10.{{octet}}.30.{{h2}} static 10.{{octet}}.0.6" "10.{{octet}}.20.{{h3}} ospf 10.{{octet}}.0.2" "10.{{octet}}.40.{{h2}} ospf 10.{{octet}}.0.2" "198.51.100.{{h1}} static 10.{{octet}}.0.10" > /home/learner/routes.txt
      expectFail: [longest-prefix]
      feedback: Longest prefix wins first; the static /25 is more specific than the OSPF /24 for that address.
    - id: static-always-wins
      description: Believes a static route always beats OSPF, even a floating static with distance 200
      mutation:
        on: workstation
        run: |
          printf '%s\n' "10.{{octet}}.20.{{h1}} ospf 10.{{octet}}.0.2" "10.{{octet}}.30.{{h2}} static 10.{{octet}}.0.6" "10.{{octet}}.20.{{h3}} static 10.{{octet}}.0.6" "10.{{octet}}.40.{{h2}} static 10.{{octet}}.0.10" "198.51.100.{{h1}} static 10.{{octet}}.0.10" > /home/learner/routes.txt
      expectFail: [admin-distance]
      feedback: Static routes have distance 1 by default, but this one was given 200, so OSPF (110) is preferred while it exists.
  solution:
    explanation: |
      Check each address with `show ip route <address>`: longest prefix first,
      then administrative distance between equal prefixes. The /25 static beats
      the OSPF /24, OSPF (110) beats the floating static (200), and unknown
      destinations follow the static default route.
    steps:
      - on: workstation
        run: |
          printf '%s\n' "10.{{octet}}.20.{{h1}} ospf 10.{{octet}}.0.2" "10.{{octet}}.30.{{h2}} static 10.{{octet}}.0.6" "10.{{octet}}.20.{{h3}} static 10.{{octet}}.0.6" "10.{{octet}}.40.{{h2}} ospf 10.{{octet}}.0.2" "198.51.100.{{h1}} static 10.{{octet}}.0.10" > /home/learner/routes.txt
          chown learner: /home/learner/routes.txt 2>/dev/null || true
