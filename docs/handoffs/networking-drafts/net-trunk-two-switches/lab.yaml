apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: net-trunk-two-switches
  title: Carry three VLANs over an 802.1Q trunk
  domain: networking
  frameworks: [ccna:network-access]
  difficulty: medium
  estimatedMinutes: 20
  tags: [vlan, trunk, 802.1q, native-vlan, linux-bridge]
  version: 1
spec:
  description: |
    The north campus has two Linux bridge switches, `mv-sw-north-1` and
    `mv-sw-north-2` (shell access, bridge `br0`, VLAN filtering on). Each has one
    host per VLAN on untagged access ports:

    | VLAN | Purpose | Port | Host on sw-north-1 | Host on sw-north-2 |
    |---|---|---|---|---|
    | 20 | staff | `eth1` | `staff-n1` | `staff-n2` |
    | 30 | students | `eth2` | `student-n1` | `student-n2` |
    | 99 | management | `eth3` | `mgmt-n1` | `mgmt-n2` |

    The switches are cabled together on `eth4` (both sides), which still sits in
    the default VLAN 1. Make `eth4` on both switches an 802.1Q trunk that carries
    **only** VLANs 20, 30 and 99, with VLAN 99 as the untagged native VLAN and 20
    and 30 tagged. Hosts in each VLAN must reach their peer on the other switch;
    VLANs must stay separate. All hosts use `10.{{octet}}.0.0/24`.
  objectives:
    - Configure tagged VLAN membership on a trunk port
    - Set the native (untagged) VLAN of a trunk and prune VLAN 1
    - Verify per-VLAN reachability across the trunk
  params:
    octet:
      type: int
      min: 20
      max: 90
  topology:
    entry: workstation
    nodes:
      - { name: workstation, driver: container, image: jumphost:1, access: [shell] }
      - { name: mv-sw-north-1, driver: container, image: netsvc:1, resources: { cpu: 0.25, memoryMiB: 96 }, access: [shell] }
      - { name: mv-sw-north-2, driver: container, image: netsvc:1, resources: { cpu: 0.25, memoryMiB: 96 }, access: [shell] }
      - { name: staff-n1, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: student-n1, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: mgmt-n1, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: staff-n2, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: student-n2, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
      - { name: mgmt-n2, driver: container, image: nettools:1, resources: { cpu: 0.2, memoryMiB: 64 }, access: [shell] }
    links:
      - { a: "mv-sw-north-1:eth1", b: "staff-n1:eth1" }
      - { a: "mv-sw-north-1:eth2", b: "student-n1:eth1" }
      - { a: "mv-sw-north-1:eth3", b: "mgmt-n1:eth1" }
      - { a: "mv-sw-north-2:eth1", b: "staff-n2:eth1" }
      - { a: "mv-sw-north-2:eth2", b: "student-n2:eth1" }
      - { a: "mv-sw-north-2:eth3", b: "mgmt-n2:eth1" }
      - { a: "mv-sw-north-1:eth4", b: "mv-sw-north-2:eth4" }
  setup:
    - on: mv-sw-north-1
      run: &switch |
        ip link add br0 type bridge vlan_filtering 1 2>/dev/null || true
        for p in eth1 eth2 eth3 eth4; do ip link set $p master br0; done
        ip link set br0 up
        bridge vlan add dev eth1 vid 20 pvid untagged; bridge vlan del dev eth1 vid 1
        bridge vlan add dev eth2 vid 30 pvid untagged; bridge vlan del dev eth2 vid 1
        bridge vlan add dev eth3 vid 99 pvid untagged; bridge vlan del dev eth3 vid 1
    - on: mv-sw-north-2
      run: *switch
    - { on: staff-n1, run: "ip addr replace 10.{{octet}}.0.21/24 dev eth1" }
    - { on: student-n1, run: "ip addr replace 10.{{octet}}.0.31/24 dev eth1" }
    - { on: mgmt-n1, run: "ip addr replace 10.{{octet}}.0.91/24 dev eth1" }
    - { on: staff-n2, run: "ip addr replace 10.{{octet}}.0.22/24 dev eth1" }
    - { on: student-n2, run: "ip addr replace 10.{{octet}}.0.32/24 dev eth1" }
    - { on: mgmt-n2, run: "ip addr replace 10.{{octet}}.0.92/24 dev eth1" }
  checks:
    - id: trunk-sw1
      description: eth4 on mv-sw-north-1 carries exactly VLANs 20 and 30 tagged and 99 untagged native
      type: shell
      on: mv-sw-north-1
      command: &trunk |
        bridge -j vlan show dev eth4 | python3 -c '
        import json,sys
        for p in json.load(sys.stdin):
            print(sorted((x["vlan"],"PVID" in x.get("flags",[]),"Egress Untagged" in x.get("flags",[])) for x in p["vlans"]))'
      expect: { match: exact, value: "[(20, False, False), (30, False, False), (99, True, True)]" }
      skills: [net.switching.trunking]
      weight: 2
    - id: trunk-sw2
      description: eth4 on mv-sw-north-2 carries exactly VLANs 20 and 30 tagged and 99 untagged native
      type: shell
      on: mv-sw-north-2
      command: *trunk
      expect: { match: exact, value: "[(20, False, False), (30, False, False), (99, True, True)]" }
      skills: [net.switching.trunking]
      weight: 2
    - { id: staff-across, description: staff-n1 reaches staff-n2, type: reachability, on: staff-n1, target: "10.{{octet}}.0.22", skills: [net.switching.trunking] }
    - { id: students-across, description: student-n1 reaches student-n2, type: reachability, on: student-n1, target: "10.{{octet}}.0.32", skills: [net.switching.trunking] }
    - { id: mgmt-across, description: mgmt-n1 reaches mgmt-n2 over the native VLAN, type: reachability, on: mgmt-n1, target: "10.{{octet}}.0.92", skills: [net.switching.trunking] }
    - id: vlans-separate
      description: staff-n1 cannot reach the student or management hosts on the other switch
      type: shell
      on: staff-n1
      command: |
        ip neigh flush dev eth1
        for t in 32 92; do ping -c1 -W1 10.{{octet}}.0.$t >/dev/null 2>&1 && { echo reachable; exit 0; }; done; echo unreachable
      expect: { match: exact, value: unreachable }
      timeoutSec: 10
      skills: [net.switching.vlans]
  hints:
    - title: Tagged and untagged members
      body: On a trunk, the VLANs that cross tagged are added without flags; the native VLAN is added with `pvid untagged`. Do it on both ends.
      command: "bridge vlan add dev eth4 vid 20; bridge vlan add dev eth4 vid 99 pvid untagged"
      cost: 2
    - title: Prune VLAN 1
      body: The trunk should carry only the three VLANs. VLAN 1 is on every port by default; delete it from eth4.
      command: "bridge vlan del dev eth4 vid 1"
      cost: 1
    - title: Verify
      body: "`bridge vlan show dev eth4` on both switches should list the same VLANs with the same flags. A capture on eth4 with `tcpdump -e` shows the 802.1Q tags."
      command: "tcpdump -eni eth4 -c5"
      cost: 1
  misconceptions:
    - id: vlan1-left
      description: Adds the three VLANs but leaves VLAN 1 on the trunk
      mutation:
        on: mv-sw-north-1
        run: |
          for s in 1; do bridge vlan add dev eth4 vid 20; bridge vlan add dev eth4 vid 30; bridge vlan add dev eth4 vid 99; done
      expectFail: [trunk-sw1]
      feedback: The trunk must carry only VLANs 20, 30 and 99; VLAN 1 is still allowed and still the native VLAN.
    - id: native-tagged
      description: Tags VLAN 99 too instead of sending it untagged
      mutation:
        on: mv-sw-north-2
        run: |
          bridge vlan add dev eth4 vid 20; bridge vlan add dev eth4 vid 30; bridge vlan add dev eth4 vid 99; bridge vlan del dev eth4 vid 1
      expectFail: [trunk-sw2, mgmt-across]
      feedback: The native VLAN crosses the trunk untagged; tagged on one side only, the management hosts lose each other.
  solution:
    explanation: |
      On both switches, add VLANs 20 and 30 as tagged members of eth4, add VLAN 99
      as the untagged PVID (native VLAN) and remove VLAN 1.
    steps:
      - on: mv-sw-north-1
        run: &fix |
          bridge vlan add dev eth4 vid 20
          bridge vlan add dev eth4 vid 30
          bridge vlan add dev eth4 vid 99 pvid untagged
          bridge vlan del dev eth4 vid 1
      - on: mv-sw-north-2
        run: *fix
