# ct-kata spike: kata-deploy 4.2.0, the hypervisors under test only.
imagePullPolicy: IfNotPresent
image:
  tag: "4.2.0"
k8sDistribution: k8s
snapshotter:
  setup: []
runtimeClasses:
  enabled: true
  createDefault: true
  defaultName: kata
shims:
  disableAll: true
  qemu-runtime-rs: {enabled: true}
  qemu: {enabled: true}
  clh-runtime-rs: {enabled: true}
  clh: {enabled: true}
  dragonball: {enabled: true}
  fc: {enabled: true}
