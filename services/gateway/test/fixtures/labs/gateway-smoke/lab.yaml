# Gateway smoke lab: one container node only, so it runs on the orchestrator's
# container driver without the vm / k8s-cluster drivers or a grader. Used by
# services/gateway tests and the real-mode smoke run; not part of the catalog
# content (load it with CT_EXTRA_LAB_DIRS=services/gateway/test/fixtures/labs).
apiVersion: cloudtrain.dev/v3
kind: Lab
metadata:
  id: gateway-smoke
  title: Leave a note for the night shift
  domain: linux
  difficulty: easy
  estimatedMinutes: 5
  tags: [smoke-test, shell]
  version: 1
spec:
  description: |
    The night shift at the Quillmoor depot reads `~/handover/{{note}}` on the
    **workstation** when they come in.

    Write the word `ready` into that file:

    ```bash
    echo ready > ~/handover/{{note}}
    ```

    | Field | Value |
    |---|---|
    | File | `~/handover/{{note}}` |
    | Content | `ready` |
  objectives:
    - Use a shell on the lab workstation
    - Redirect command output into a file
  params:
    note:
      type: choice
      values: [shift-a.txt, shift-b.txt]
  topology:
    entry: workstation
    nodes:
      - name: workstation
        driver: container
        image: docker.io/cloudtrain/jumphost:v1.37.1
        access: [shell]
        resources: {cpu: 0.25, memoryMiB: 128}
  setup:
    - on: workstation
      run: mkdir -p ~/handover
  checks:
    - id: note-written
      description: ~/handover/{{note}} contains ready
      type: file
      on: workstation
      target: /home/learner/handover/{{note}}
      skills: [linux.shell.redirection]
      weight: 2
      expect: {match: exact, value: ready}
    - id: shell-used
      description: The learner opened a shell on the workstation
      type: shell
      on: workstation
      command: test -d /home/learner/handover && echo yes
      skills: [linux.shell.navigation]
      expect: {match: exact, value: "yes"}
  hints:
    - title: Where is home?
      body: "`~` is the learner's home directory, `/home/learner`."
      command: ls -la ~/handover
      cost: 0
    - title: Redirect
      body: "`>` writes a command's output into a file, replacing what was there."
      cost: 1
  solution:
    steps:
      - on: workstation
        as: learner
        run: echo ready > ~/handover/{{note}}
