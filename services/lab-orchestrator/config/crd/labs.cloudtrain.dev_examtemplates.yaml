---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: examtemplates.labs.cloudtrain.dev
spec:
  group: labs.cloudtrain.dev
  names:
    categories:
    - cloudtrain
    kind: ExamTemplate
    listKind: ExamTemplateList
    plural: examtemplates
    shortNames:
    - et
    singular: examtemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.id
      name: Exam
      type: string
    - jsonPath: .spec.taskCount
      name: Tasks
      type: integer
    - jsonPath: .spec.durationMinutes
      name: Minutes
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ExamTemplate is a compiled exam simulation definition.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExamTemplateSpec is a compiled, immutable exam definition.
            properties:
              durationMinutes:
                format: int32
                minimum: 1
                type: integer
              envTier:
                type: string
              environment:
                description: ExamEnvironment is how the drawn tasks share infrastructure.
                enum:
                - shared
                - per-task
                type: string
              objectives:
                items:
                  description: ExamObjective is one blueprint line.
                  properties:
                    id:
                      description: ID is the framework objective ref, e.g. "cka:storage".
                      type: string
                    pool:
                      items:
                        description: ExamPoolTask is one task an objective can draw.
                        properties:
                          id:
                            description: ID is the exam-task lab id.
                            type: string
                          templateRef:
                            description: TemplateRef is the task's LabTemplate in
                              the same namespace.
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - id
                        - templateRef
                        type: object
                      type: array
                    tasks:
                      description: Tasks drawn per attempt.
                      format: int32
                      minimum: 0
                      type: integer
                    weight:
                      description: |-
                        Weight is the objective's share of the exam (decimal; objectives are
                        normalised over those that draw at least one task).
                      pattern: ^[0-9]+(\.[0-9]+)?$
                      type: string
                  required:
                  - id
                  - pool
                  - tasks
                  - weight
                  type: object
                minItems: 1
                type: array
              passMark:
                description: PassMark is the pass threshold in percent (decimal).
                pattern: ^[0-9]+(\.[0-9]+)?$
                type: string
              passMarkNote:
                type: string
              retakePolicy:
                description: |-
                  ExamRetakePolicy is enforced by the gateway (it owns attempt history);
                  the orchestrator only honours FreshDraw through ExamSession.spec.avoidTasks.
                properties:
                  cooldownHours:
                    format: int32
                    type: integer
                  freeRetakes:
                    format: int32
                    type: integer
                  freshDraw:
                    type: boolean
                  maxAttemptsPer30Days:
                    format: int32
                    type: integer
                  notes:
                    type: string
                required:
                - freshDraw
                type: object
              rules:
                description: ExamRules are the exam's rules (curriculum `exams[].rules`).
                properties:
                  anyOrder:
                    type: boolean
                  docsAllowed:
                    type: string
                  flagForReview:
                    type: boolean
                  idempotencyRerun:
                    description: |-
                      IdempotencyRerun re-runs each task's `exam.rerun` actions after the
                      first grading pass and grades again; checks must still pass.
                    type: boolean
                  notes:
                    type: string
                  partialCredit:
                    description: PartialCredit is how a task's checks turn into its
                      score.
                    enum:
                    - per-check
                    - per-task
                    - none
                    type: string
                  rebootBeforeGrade:
                    description: |-
                      RebootBeforeGrade reboots every VM (and kubeadm cluster member) after
                      the first grading pass, waits until they are back, and grades again;
                      only state that survives the reboot scores.
                    type: boolean
                  timer:
                    description: |-
                      Timer is "single" (one timer for the whole exam). "per-task" is
                      accepted and treated as single (the curriculum uses single only).
                    type: string
                type: object
              source:
                description: ExamSource identifies the curriculum exam an ExamTemplate
                  was compiled from.
                properties:
                  alignsTo:
                    items:
                      type: string
                    type: array
                  description:
                    type: string
                  digest:
                    description: |-
                      Digest is the sha256 of the canonical JSON of the exam definition plus
                      the digests of every pool task's template.
                    type: string
                  disclaimer:
                    description: Disclaimer is shown before the exam and on the report.
                    type: string
                  domain:
                    description: Domain is the curriculum domain (or "cross-domain").
                    type: string
                  format:
                    type: string
                  id:
                    type: string
                  title:
                    type: string
                required:
                - disclaimer
                - domain
                - id
                - title
                type: object
              taskCount:
                description: TaskCount is the number of tasks per attempt (sum of
                  objective tasks).
                format: int32
                type: integer
            required:
            - durationMinutes
            - environment
            - objectives
            - passMark
            - rules
            - source
            - taskCount
            type: object
            x-kubernetes-validations:
            - message: ExamTemplate spec is immutable; compile a new one instead
              rule: self == oldSelf
        type: object
    served: true
    storage: true
    subresources: {}
