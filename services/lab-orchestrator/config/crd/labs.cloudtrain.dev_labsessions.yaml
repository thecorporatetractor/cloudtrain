---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: labsessions.labs.cloudtrain.dev
spec:
  group: labs.cloudtrain.dev
  names:
    categories:
    - cloudtrain
    kind: LabSession
    listKind: LabSessionList
    plural: labsessions
    shortNames:
    - ls
    singular: labsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateRef.name
      name: Template
      type: string
    - jsonPath: .spec.learner.id
      name: Learner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'LabSession is one learner attempt: a running instance of a LabTemplate.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LabSessionSpec is one learner attempt at a lab.
            properties:
              expiresAt:
                description: ExpiresAt overrides TTL with an absolute expiry.
                format: date-time
                type: string
              hibernate:
                description: |-
                  Hibernate releases compute while keeping the session (drivers that
                  support it stop their workloads; endpoints are withdrawn).
                type: boolean
              learner:
                description: LearnerRef identifies the learner owning a session.
                properties:
                  id:
                    description: ID is the stable learner id from the identity service.
                    minLength: 1
                    type: string
                  org:
                    type: string
                required:
                - id
                type: object
              seed:
                description: Seed deterministically resolves the template's {{params}}.
                format: int64
                type: integer
                x-kubernetes-validations:
                - message: seed is immutable
                  rule: self == oldSelf
              templateRef:
                description: TemplateReference points at a LabTemplate in the session's
                  namespace.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: templateRef is immutable
                  rule: self == oldSelf
              ttl:
                description: |-
                  TTL from creation after which the session expires. Defaults to twice
                  the lab's estimatedMinutes (minimum 30m).
                type: string
              warmPoolRef:
                description: WarmPoolRef names the WarmPool that pre-provisioned this
                  session, if any.
                type: string
            required:
            - learner
            - seed
            - templateRef
            type: object
          status:
            description: LabSessionStatus is the observed state of a LabSession.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                description: Endpoints for access points of the session's nodes.
                items:
                  description: Endpoint is how the access gateway reaches one access
                    point of a node.
                  properties:
                    access:
                      description: AccessType is a way a learner reaches a node.
                      enum:
                      - shell
                      - ssh
                      - console
                      - web
                      - rdp
                      type: string
                    host:
                      description: Host is a DNS name or IP reachable from the access
                        gateway.
                      type: string
                    node:
                      type: string
                    port:
                      format: int32
                      type: integer
                    protocol:
                      description: Protocol is e.g. "k8s-exec", "ssh", "http".
                      type: string
                    target:
                      description: Target is protocol-specific, e.g. "namespace/pod/container"
                        for k8s-exec.
                      type: string
                    url:
                      type: string
                  required:
                  - access
                  - node
                  - protocol
                  type: object
                type: array
              entryNode:
                description: EntryNode is the node the learner's terminal opens on.
                type: string
              expiresAt:
                format: date-time
                type: string
              hibernated:
                type: boolean
              nodes:
                items:
                  description: NodeStatus is the observed state of one topology node.
                  properties:
                    driver:
                      description: DriverName selects the NodeDriver that runs a topology
                        node.
                      enum:
                      - container
                      - vm
                      - k8s-cluster
                      - netdev
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: NodePhase is the lifecycle phase of a single topology
                        node.
                      type: string
                  required:
                  - driver
                  - name
                  - phase
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: LabSessionPhase is the coarse lifecycle phase of a LabSession.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Grading
                - Expired
                - Failed
                type: string
              readyAt:
                format: date-time
                type: string
              resolvedParams:
                additionalProperties:
                  type: string
                description: ResolvedParams are the param values derived from spec.seed.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
