---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: labtemplates.labs.cloudtrain.dev
spec:
  group: labs.cloudtrain.dev
  names:
    categories:
    - cloudtrain
    kind: LabTemplate
    listKind: LabTemplateList
    plural: labtemplates
    shortNames:
    - lt
    singular: labtemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.id
      name: Lab
      type: string
    - jsonPath: .spec.source.version
      name: Version
      type: integer
    - jsonPath: .spec.source.domain
      name: Domain
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LabTemplate is a compiled, immutable lab definition.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LabTemplateSpec is a compiled, immutable lab definition produced from a
              cloudtrain.dev/v3 lab.yaml. Text fields may still contain {{param}}
              placeholders; they are resolved per LabSession from its seed.
            properties:
              checks:
                items:
                  description: Check is a typed, skill-tagged grading check.
                  properties:
                    command:
                      type: string
                    description:
                      type: string
                    expect:
                      description: Expectation of a check.
                      properties:
                        match:
                          description: MatchType compares check output with an expected
                            value.
                          enum:
                          - exact
                          - not_exact
                          - contains
                          - not_contains
                          - regex
                          type: string
                        value:
                          type: string
                      required:
                      - match
                      - value
                      type: object
                    id:
                      type: string
                    "on":
                      type: string
                    port:
                      format: int32
                      type: integer
                    query:
                      description: CheckQuery parameterises k8s-* checks.
                      properties:
                        as:
                          type: string
                        cluster:
                          type: string
                        jsonpath:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        resource:
                          type: string
                        verb:
                          type: string
                      type: object
                    skills:
                      items:
                        type: string
                      minItems: 1
                      type: array
                    target:
                      type: string
                    timeoutSec:
                      format: int32
                      type: integer
                    type:
                      description: CheckType is the kind of a grading check.
                      enum:
                      - shell
                      - k8s-query
                      - k8s-can-i
                      - k8s-context
                      - file
                      - service-state
                      - reachability
                      - device-cmd
                      - http
                      type: string
                    weight:
                      description: Weight is a decimal, default "1".
                      pattern: ^[0-9]+(\.[0-9]+)?$
                      type: string
                  required:
                  - description
                  - id
                  - skills
                  - type
                  type: object
                minItems: 1
                type: array
              description:
                description: Description is the Markdown task statement shown to the
                  learner.
                type: string
              hints:
                items:
                  description: Hint shown to a learner on request.
                  properties:
                    body:
                      type: string
                    command:
                      type: string
                    cost:
                      format: int32
                      type: integer
                    title:
                      type: string
                  required:
                  - body
                  - title
                  type: object
                type: array
              misconceptions:
                items:
                  description: Misconception is a plausible wrong approach, also used
                    as a mutation test.
                  properties:
                    description:
                      type: string
                    expectFail:
                      description: ExpectFail lists the check ids that must fail after
                        Mutation.
                      items:
                        type: string
                      type: array
                    feedback:
                      type: string
                    id:
                      type: string
                    mutation:
                      description: Action runs on a node. Exactly one of run/apply/file/config
                        is set.
                      properties:
                        apply:
                          type: string
                        as:
                          description: ActionUser is the identity an action runs as.
                          enum:
                          - learner
                          - admin
                          type: string
                        config:
                          type: string
                        file:
                          description: |-
                            FileAction writes a file on a node. A lab's file.source asset is inlined
                            into Content at compile time.
                          properties:
                            content:
                              type: string
                            mode:
                              type: string
                            path:
                              type: string
                          required:
                          - content
                          - path
                          type: object
                        "on":
                          description: On is a node name, or node/cluster-node for
                            kubeadm cluster members.
                          type: string
                        run:
                          type: string
                        timeoutSec:
                          format: int32
                          type: integer
                      required:
                      - "on"
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of run, apply, file, config must be set
                        rule: '(has(self.run) ? 1 : 0) + (has(self.apply) ? 1 : 0)
                          + (has(self.file) ? 1 : 0) + (has(self.config) ? 1 : 0)
                          == 1'
                  required:
                  - description
                  - id
                  type: object
                type: array
              objectives:
                items:
                  type: string
                type: array
              params:
                additionalProperties:
                  description: ParamSpec defines a value randomised per learner attempt.
                  properties:
                    default:
                      description: Default value, rendered as a string.
                      type: string
                    max:
                      format: int64
                      type: integer
                    min:
                      format: int64
                      type: integer
                    prefix:
                      type: string
                    type:
                      description: ParamType is the kind of a randomised parameter.
                      enum:
                      - choice
                      - int
                      - name
                      type: string
                    values:
                      description: Values for type=choice, rendered as strings.
                      items:
                        type: string
                      type: array
                  required:
                  - type
                  type: object
                type: object
              setup:
                items:
                  description: Action runs on a node. Exactly one of run/apply/file/config
                    is set.
                  properties:
                    apply:
                      type: string
                    as:
                      description: ActionUser is the identity an action runs as.
                      enum:
                      - learner
                      - admin
                      type: string
                    config:
                      type: string
                    file:
                      description: |-
                        FileAction writes a file on a node. A lab's file.source asset is inlined
                        into Content at compile time.
                      properties:
                        content:
                          type: string
                        mode:
                          type: string
                        path:
                          type: string
                      required:
                      - content
                      - path
                      type: object
                    "on":
                      description: On is a node name, or node/cluster-node for kubeadm
                        cluster members.
                      type: string
                    run:
                      type: string
                    timeoutSec:
                      format: int32
                      type: integer
                  required:
                  - "on"
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of run, apply, file, config must be set
                    rule: '(has(self.run) ? 1 : 0) + (has(self.apply) ? 1 : 0) + (has(self.file)
                      ? 1 : 0) + (has(self.config) ? 1 : 0) == 1'
                type: array
              solution:
                description: Solution is the reference solution of a lab.
                properties:
                  alternatives:
                    description: Alternatives are other valid solutions; each must
                      pass every check.
                    items:
                      description: SolutionAlternative is another valid way to solve
                        a lab.
                      properties:
                        description:
                          type: string
                        id:
                          type: string
                        steps:
                          items:
                            description: Action runs on a node. Exactly one of run/apply/file/config
                              is set.
                            properties:
                              apply:
                                type: string
                              as:
                                description: ActionUser is the identity an action
                                  runs as.
                                enum:
                                - learner
                                - admin
                                type: string
                              config:
                                type: string
                              file:
                                description: |-
                                  FileAction writes a file on a node. A lab's file.source asset is inlined
                                  into Content at compile time.
                                properties:
                                  content:
                                    type: string
                                  mode:
                                    type: string
                                  path:
                                    type: string
                                required:
                                - content
                                - path
                                type: object
                              "on":
                                description: On is a node name, or node/cluster-node
                                  for kubeadm cluster members.
                                type: string
                              run:
                                type: string
                              timeoutSec:
                                format: int32
                                type: integer
                            required:
                            - "on"
                            type: object
                            x-kubernetes-validations:
                            - message: exactly one of run, apply, file, config must
                                be set
                              rule: '(has(self.run) ? 1 : 0) + (has(self.apply) ?
                                1 : 0) + (has(self.file) ? 1 : 0) + (has(self.config)
                                ? 1 : 0) == 1'
                          minItems: 1
                          type: array
                      required:
                      - description
                      - id
                      - steps
                      type: object
                    type: array
                  explanation:
                    type: string
                  steps:
                    items:
                      description: Action runs on a node. Exactly one of run/apply/file/config
                        is set.
                      properties:
                        apply:
                          type: string
                        as:
                          description: ActionUser is the identity an action runs as.
                          enum:
                          - learner
                          - admin
                          type: string
                        config:
                          type: string
                        file:
                          description: |-
                            FileAction writes a file on a node. A lab's file.source asset is inlined
                            into Content at compile time.
                          properties:
                            content:
                              type: string
                            mode:
                              type: string
                            path:
                              type: string
                          required:
                          - content
                          - path
                          type: object
                        "on":
                          description: On is a node name, or node/cluster-node for
                            kubeadm cluster members.
                          type: string
                        run:
                          type: string
                        timeoutSec:
                          format: int32
                          type: integer
                      required:
                      - "on"
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of run, apply, file, config must be set
                        rule: '(has(self.run) ? 1 : 0) + (has(self.apply) ? 1 : 0)
                          + (has(self.file) ? 1 : 0) + (has(self.config) ? 1 : 0)
                          == 1'
                    minItems: 1
                    type: array
                required:
                - steps
                type: object
              source:
                description: LabSource identifies the lab.yaml a template was compiled
                  from.
                properties:
                  difficulty:
                    description: Difficulty of a lab.
                    enum:
                    - easy
                    - medium
                    - hard
                    type: string
                  digest:
                    description: Digest is the sha256 of the canonical JSON form of
                      the source lab.
                    type: string
                  domain:
                    description: Domain of a lab.
                    enum:
                    - kubernetes
                    - linux
                    - networking
                    type: string
                  estimatedMinutes:
                    format: int32
                    maximum: 240
                    minimum: 1
                    type: integer
                  frameworks:
                    items:
                      type: string
                    type: array
                  id:
                    description: ID is metadata.id of the lab.
                    type: string
                  tags:
                    items:
                      type: string
                    type: array
                  title:
                    type: string
                  version:
                    description: Version is metadata.version of the lab (default 1).
                    format: int32
                    type: integer
                required:
                - difficulty
                - domain
                - estimatedMinutes
                - id
                - title
                - version
                type: object
              teardown:
                items:
                  description: Action runs on a node. Exactly one of run/apply/file/config
                    is set.
                  properties:
                    apply:
                      type: string
                    as:
                      description: ActionUser is the identity an action runs as.
                      enum:
                      - learner
                      - admin
                      type: string
                    config:
                      type: string
                    file:
                      description: |-
                        FileAction writes a file on a node. A lab's file.source asset is inlined
                        into Content at compile time.
                      properties:
                        content:
                          type: string
                        mode:
                          type: string
                        path:
                          type: string
                      required:
                      - content
                      - path
                      type: object
                    "on":
                      description: On is a node name, or node/cluster-node for kubeadm
                        cluster members.
                      type: string
                    run:
                      type: string
                    timeoutSec:
                      format: int32
                      type: integer
                  required:
                  - "on"
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of run, apply, file, config must be set
                    rule: '(has(self.run) ? 1 : 0) + (has(self.apply) ? 1 : 0) + (has(self.file)
                      ? 1 : 0) + (has(self.config) ? 1 : 0) == 1'
                type: array
              topology:
                description: Topology is the graph of nodes and links of a lab.
                properties:
                  entry:
                    description: Entry is the node the learner's terminal opens on.
                    type: string
                  links:
                    items:
                      description: Link is an L2 wire between two node interfaces.
                      properties:
                        a:
                          description: A is "node:interface".
                          type: string
                        b:
                          type: string
                        impair:
                          description: LinkImpairment is applied with tc netem.
                          properties:
                            latencyMs:
                              format: int32
                              type: integer
                            lossPct:
                              description: LossPct is a decimal percentage, e.g. "0.5".
                              pattern: ^[0-9]+(\.[0-9]+)?$
                              type: string
                            mtu:
                              format: int32
                              type: integer
                          type: object
                        subnet:
                          type: string
                      required:
                      - a
                      - b
                      type: object
                    type: array
                  nodes:
                    items:
                      description: Node is a topology node run by a driver.
                      properties:
                        access:
                          items:
                            description: AccessType is a way a learner reaches a node.
                            enum:
                            - shell
                            - ssh
                            - console
                            - web
                            - rdp
                            type: string
                          type: array
                        cluster:
                          description: Cluster is only set for driver=k8s-cluster.
                          properties:
                            context:
                              description: Context is the kubeconfig context name
                                exposed on the entry node.
                              type: string
                            mode:
                              description: ClusterMode of a k8s-cluster node.
                              enum:
                              - virtual
                              - kubeadm
                              type: string
                            nodes:
                              items:
                                description: ClusterNode is a member of a kubeadm
                                  cluster.
                                properties:
                                  labels:
                                    additionalProperties:
                                      type: string
                                    type: object
                                  name:
                                    type: string
                                  role:
                                    description: ClusterNodeRole of a kubeadm cluster
                                      member.
                                    enum:
                                    - control-plane
                                    - worker
                                    type: string
                                  state:
                                    description: ClusterNodeState is the initial state
                                      of a kubeadm cluster member.
                                    enum:
                                    - ready
                                    - notready
                                    type: string
                                  taints:
                                    items:
                                      type: string
                                    type: array
                                required:
                                - name
                                - role
                                type: object
                              type: array
                            version:
                              type: string
                          type: object
                        driver:
                          description: DriverName selects the NodeDriver that runs
                            a topology node.
                          enum:
                          - container
                          - vm
                          - k8s-cluster
                          - netdev
                          type: string
                        image:
                          description: Image is a catalog image ref, e.g. 'jumphost:1',
                            'frr:10', 'kubeadm:1.35'.
                          type: string
                        name:
                          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                          type: string
                        resources:
                          description: NodeResources requested by a node.
                          properties:
                            cpu:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            disks:
                              items:
                                type: string
                              type: array
                            memoryMiB:
                              format: int64
                              type: integer
                          type: object
                      required:
                      - driver
                      - name
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - nodes
                type: object
            required:
            - checks
            - description
            - solution
            - source
            - topology
            type: object
            x-kubernetes-validations:
            - message: LabTemplate spec is immutable; publish a new version instead
              rule: self == oldSelf
          status:
            description: LabTemplateStatus is the observed state of a LabTemplate.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
