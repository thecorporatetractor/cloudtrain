apiVersion: v1
kind: Namespace
metadata:
  name: cloudtrain-system
  labels: {app.kubernetes.io/part-of: cloudtrain}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-orchestrator
  namespace: cloudtrain-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-orchestrator
  namespace: cloudtrain-system
  labels: {app.kubernetes.io/name: lab-orchestrator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lab-orchestrator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lab-orchestrator}
    spec:
      serviceAccountName: lab-orchestrator
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: manager
          # Replaced by deploy/scripts/orchestrator-deploy.sh with a content-addressed tag.
          image: cloudtrain/lab-orchestrator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --image-catalog=/etc/cloudtrain/catalog
            - --max-concurrent-reconciles=8
          env:
            # Subject of the RoleBindings the manager creates in lab namespaces
            # (--session-cluster-role).
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: SERVICE_ACCOUNT_NAME
              valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
          ports:
            - {name: probes, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: catalog, mountPath: /etc/cloudtrain/catalog, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Created from deploy/images/catalog.yaml (+ optional local overlay)
        # by deploy/scripts/orchestrator-deploy.sh.
        - name: catalog
          configMap: {name: lab-image-catalog}
        - name: tmp
          emptyDir: {}
