# The API server's addresses (the default/kubernetes Endpoints), read once at
# startup: every vcluster control plane's NetworkPolicy allows egress to the host
# API server there and nowhere else (--apiserver-cidrs auto). Only that object.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-orchestrator-apiserver-endpoints
  namespace: default
rules:
  - apiGroups: [""]
    resources: [endpoints]
    resourceNames: [kubernetes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-orchestrator-apiserver-endpoints
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-orchestrator-apiserver-endpoints
subjects:
  - kind: ServiceAccount
    name: lab-orchestrator
    namespace: cloudtrain-system
