apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # cluster-wide (generated from internal/controller markers)
  - role.yaml
  - role_binding.yaml
  # bound by the manager in each lab namespace (generated from internal/rbac markers)
  - session_role.yaml
  - leader_election_role.yaml
  - ovn_central_role.yaml
  - apiserver_endpoints_role.yaml
  - admission_policy.yaml
  - vcluster_pod_network_policy.yaml
  - vcluster_host_policy.yaml
  - vcluster_host_services_mutation.yaml
