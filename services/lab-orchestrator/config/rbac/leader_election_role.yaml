# Leader election in the manager's own namespace (leases, and the events the
# elector records on them). Namespaced: cluster-wide lease writes would let the
# manager take over other controllers' leader locks (kube-scheduler, ...).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-orchestrator-leader-election
  namespace: cloudtrain-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-orchestrator-leader-election
  namespace: cloudtrain-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-orchestrator-leader-election
subjects:
  - kind: ServiceAccount
    name: lab-orchestrator
    namespace: cloudtrain-system
