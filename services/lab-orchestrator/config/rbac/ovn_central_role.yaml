# vlan-passthru on lab link switches: the manager runs ovn-nbctl in Kube-OVN's
# ovn-central pods (--ovn-central, default kube-system/app=ovn-central; Kube-OVN
# has no API for that switch option). RBAC cannot narrow exec to those pods (their
# names are generated), so this grants exec into every pod of the namespace;
# drop it together with --ovn-central= on clusters that do not need 802.1Q on lab
# links (docs/deploy.md, RBAC).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-orchestrator-ovn-central
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-orchestrator-ovn-central
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-orchestrator-ovn-central
subjects:
  - kind: ServiceAccount
    name: lab-orchestrator
    namespace: cloudtrain-system
