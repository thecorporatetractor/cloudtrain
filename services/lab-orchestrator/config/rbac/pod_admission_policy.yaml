# The pod admission backstop of lab namespaces (labs.cloudtrain.dev/lab-namespace=true):
# whatever creates them, pods there never run a privileged container on the node's
# kernel. docs/deploy.md, "Lab pod admission policy".
#
# Rejected, unless the pod's runtimeClassName is a configured sandbox (a VM
# sandbox such as Kata: variables.sandboxes, rewritten from the same sandbox
# configuration as the manager's, see below):
#   - a privileged container or init container;
#   - capabilities added beyond the Pod Security baseline set, except the exact
#     sets of the platform's own containers in pods the manager's ServiceAccount
#     creates with the label labs.cloudtrain.dev/pod-profile:
#       wired  (lab links):  node and net add NET_ADMIN, NET_RAW; net-init adds NET_ADMIN
#       netdev (FRR):        as wired, and node also SYS_ADMIN
#     (internal/network/pod.go NodeCapabilities, SidecarCapabilities,
#     InitCapabilities; internal/drivers/netdev.go FRR);
#   - SYS_ADMIN without the RuntimeDefault or Localhost seccomp profile.
# Rejected always: host network, PID or IPC namespaces, hostPath volumes, Windows
# host processes, and an unmasked /proc outside a user namespace.
# Ephemeral containers are judged on their own (no profile) when they are added.
# Deployments, ReplicaSets, StatefulSets, DaemonSets, Jobs and CronJobs are judged
# by their pod template too.
#
# Per instance, deploy/scripts/orchestrator-deploy.sh and the Helm chart rewrite
# the names, the ServiceAccount in variables.manager, variables.sandboxes (the
# sandbox RuntimeClasses), and may add a matchCondition limiting the policy to
# this manager's own requests (scope "own", several managers on one cluster).
# Needs Kubernetes 1.30+ (ValidatingAdmissionPolicy GA); without that API the
# deploy tools skip it and the manager warns at startup.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-orchestrator-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        labs.cloudtrain.dev/lab-namespace: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
      - apiGroups: [apps]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [deployments, replicasets, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: manager
      expression: "request.userInfo.username == 'system:serviceaccount:cloudtrain-system:lab-orchestrator'"
    # The sandbox RuntimeClasses (orchestrator.sandboxes / --sandboxes): rewritten per instance.
    - name: sandboxes
      expression: "[]"
    - name: kind
      expression: "request.resource.resource"
    - name: ephemeral
      expression: "request.?subResource.orValue('') == 'ephemeralcontainers'"
    # The pod, or the workload's pod template.
    - name: template
      expression: >-
        variables.kind == 'pods' ? object :
        variables.kind == 'cronjobs' ? object.spec.jobTemplate.spec.template : object.spec.template
    - name: spec
      expression: "variables.template.spec"
    - name: labels
      expression: "variables.template.?metadata.?labels.orValue({})"
    - name: sandboxed
      expression: "variables.spec.?runtimeClassName.orValue('') in variables.sandboxes"
    # The platform profile counts only on a pod the manager itself creates.
    - name: profile
      expression: >-
        variables.kind == 'pods' && !variables.ephemeral && variables.manager &&
        'labs.cloudtrain.dev/pod-profile' in variables.labels ? variables.labels['labs.cloudtrain.dev/pod-profile'] : ''
    - name: containers
      expression: >-
        variables.ephemeral ?
        object.spec.?ephemeralContainers.orValue([]).filter(c, !oldObject.spec.?ephemeralContainers.orValue([]).exists(o, o.name == c.name)) :
        variables.spec.containers
    - name: initContainers
      expression: "variables.ephemeral ? [] : variables.spec.?initContainers.orValue([])"
    - name: baselineCaps
      expression: "['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']"
  validations:
    - expression: >-
        variables.ephemeral ||
        !(variables.spec.?hostNetwork.orValue(false) || variables.spec.?hostPID.orValue(false) || variables.spec.?hostIPC.orValue(false))
      message: lab pods must not use the node's network, PID or IPC namespace
      reason: Forbidden
    - expression: "variables.ephemeral || !variables.spec.?volumes.orValue([]).exists(v, has(v.hostPath))"
      message: lab pods must not mount hostPath volumes
      reason: Forbidden
    - expression: >-
        !variables.spec.?securityContext.?windowsOptions.?hostProcess.orValue(false) &&
        (variables.containers + variables.initContainers).all(c, !c.?securityContext.?windowsOptions.?hostProcess.orValue(false))
      message: lab pods must not run Windows host processes
      reason: Forbidden
    - expression: >-
        variables.sandboxed ||
        (variables.containers + variables.initContainers).all(c, !c.?securityContext.?privileged.orValue(false))
      messageExpression: >-
        'privileged containers run in lab namespaces only inside a sandbox RuntimeClass (' +
        (size(variables.sandboxes) == 0 ? 'none is configured' : variables.sandboxes.join(', ')) + ')'
      reason: Forbidden
    - expression: >-
        variables.sandboxed ||
        (variables.containers.all(c, c.?securityContext.?capabilities.?add.orValue([]).all(x,
          x in variables.baselineCaps ||
          (variables.profile in ['wired', 'netdev'] && c.name in ['node', 'net'] && x in ['NET_ADMIN', 'NET_RAW']) ||
          (variables.profile == 'netdev' && c.name == 'node' && x == 'SYS_ADMIN'))) &&
        variables.initContainers.all(c, c.?securityContext.?capabilities.?add.orValue([]).all(x,
          x in variables.baselineCaps ||
          (variables.profile in ['wired', 'netdev'] && c.name == 'net-init' && x == 'NET_ADMIN'))))
      message: >-
        lab pods may add only the Pod Security baseline capabilities, apart from the platform's
        wired and netdev containers (NET_ADMIN, NET_RAW; SYS_ADMIN for network devices) outside a sandbox RuntimeClass
      reason: Forbidden
    - expression: >-
        variables.sandboxed ||
        variables.containers.all(c, !('SYS_ADMIN' in c.?securityContext.?capabilities.?add.orValue([])) ||
          c.?securityContext.?seccompProfile.?type.orValue(variables.spec.?securityContext.?seccompProfile.?type.orValue('')) in ['RuntimeDefault', 'Localhost'])
      message: a container with SYS_ADMIN needs the RuntimeDefault or Localhost seccomp profile
      reason: Forbidden
    - expression: >-
        variables.spec.?hostUsers.orValue(true) == false ||
        (variables.containers + variables.initContainers).all(c, c.?securityContext.?procMount.orValue('Default') == 'Default')
      message: an unmasked /proc needs a user namespace (hostUsers false)
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-orchestrator-pods
spec:
  policyName: lab-orchestrator-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        labs.cloudtrain.dev/lab-namespace: "true"
