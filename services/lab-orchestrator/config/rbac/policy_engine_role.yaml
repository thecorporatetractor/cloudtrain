# The NetworkPolicy engine startup check (internal/drivers/netengine.go): which
# engine runs (DaemonSets), whether Kube-OVN's controller switched policies off
# (Deployments) and Cilium's enforcement mode (cilium-config). Read-only, kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-orchestrator-policy-engine
  namespace: kube-system
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [kube-ovn-controller]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cilium-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-orchestrator-policy-engine
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-orchestrator-policy-engine
subjects:
  - kind: ServiceAccount
    name: lab-orchestrator
    namespace: cloudtrain-system
