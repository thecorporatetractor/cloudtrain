---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-orchestrator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - labs.cloudtrain.dev
  resources:
  - labsessions
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - labs.cloudtrain.dev
  resources:
  - labsessions/finalizers
  verbs:
  - update
- apiGroups:
  - labs.cloudtrain.dev
  resources:
  - labsessions/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - labs.cloudtrain.dev
  resources:
  - labtemplates
  verbs:
  - get
  - list
  - watch
