# Test exam for the exam engine (fixture, not curriculum content). Same shape
# as `exams` in content/curriculum.yaml; validated against
# packages/lab-schema/schema/curriculum.schema.json#/$defs/exam.
# Pools hold twice the tasks drawn, so a retake can be fully disjoint.
exams:
  - id: sim-test-k8s-dev
    title: Exam engine test simulation (application developer tasks)
    domain: kubernetes
    alignsTo: [ckad]
    disclaimer: Test fixture for the CloudTrain exam engine. It is not affiliated with or endorsed by any certifying body and confers no certification.
    format: practical
    durationMinutes: 30
    passMark: 66
    passMarkNote: Test setting.
    taskCount: 3
    envTier: V
    environment: shared
    blueprint:
      - objective: ckad:deployment
        weight: 40
        tasks: 1
        pool: [xt-scale-manifest-api, xt-set-image-tally]
      - objective: ckad:environment-config-security
        weight: 35
        tasks: 1
        pool: [xt-configmap-key, xt-secret-literal]
      - objective: ckad:services-networking
        weight: 25
        tasks: 1
        pool: [xt-expose-clusterip, xt-service-selector-tier]
    rules:
      hints: false
      timer: single
      anyOrder: true
      flagForReview: true
      rebootBeforeGrade: false
      idempotencyRerun: true
      docsAllowed: offline copy of the Kubernetes documentation only
      partialCredit: per-check
      notes: Each task names the context to use; tasks share one workstation and two virtual clusters.
    retakePolicy:
      freeRetakes: 1
      cooldownHours: 0
      maxAttemptsPer30Days: 5
      freshDraw: true
      notes: a retake draws different tasks and new parameters
    scoreReport:
      breakdown: [objective, task, skill]
      showsExpectedValues: false
      includes: [weighted score and pass/fail against the pass mark, per-objective percent, per-task pass/fail with learner-safe check messages]
    status: built
    owner: exam-engine
