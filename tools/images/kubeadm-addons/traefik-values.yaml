# Values for `helm template traefik traefik/traefik --version 41.7.1 -n traefik` (rendered
# into tools/images/kubeadm-addons/manifests/traefik.yaml by render-traefik.sh).
image: { registry: docker.io, repository: library/traefik, tag: v3.7.14 }
providers:
  kubernetesIngress: { enabled: true }
  kubernetesGateway: { enabled: true }
gateway: { enabled: false }        # labs create their own Gateway
gatewayClass: { enabled: true }    # GatewayClass "traefik"
ingressClass: { enabled: true, isDefaultClass: true }   # IngressClass "traefik"
# Entry points on 80/443 so Gateway listeners and Ingress use the usual ports.
ports:
  web: { port: 80, nodePort: 30080 }
  websecure: { port: 443, nodePort: 30443 }
podSecurityContext:
  sysctls: [{ name: net.ipv4.ip_unprivileged_port_start, value: "0" }]
service: { type: LoadBalancer }    # NodePorts 30080/30443 work without a load balancer
