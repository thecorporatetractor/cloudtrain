version: 0.1
log:
  level: info
storage:
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
http:
  addr: :5000
  # HTTP/2 stays off: the upstream binary still carries the x/net flow-control bug
  # GO-2026-6612 (see .grype.yaml); HTTP/1.1 is all docker, podman, skopeo and oras need.
  http2:
    disabled: true
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
