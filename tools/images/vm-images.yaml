# The KubeVirt containerDisks .github/workflows/vm-images.yml builds on a GitHub-hosted
# KVM runner and publishes to ghcr.io/<owner>/<repo>/<publishName> (catalog entries with
# kind containerDisk and publishable: true; the workflow checks the names against
# deploy/images/catalog.yaml). Read by .github/scripts/image-matrix.sh.
#   name         tools/images/build.sh variant
#   publishName  GHCR package name = the catalog's publishName (default: the image's last
#                path component without the tag)
#   stage        2 layers on the stage-1 kubeadm-node disk (pulled from GHCR, signature
#                verified), so it builds after stage 1
#   paths        files whose change rebuilds this image on a pull request or a push to
#                main (space-separated shell patterns, `*` crosses `/`); the shared inputs
#                (build.sh, builder, versions.env, ...) rebuild every image, see the workflow
# el-vm and ubuntu-vm are not here: they carry the package-mirror snapshot (several GB)
# built by tools/mirrors/build-content.sh (docs/deploy.md, "Publishing containerDisks").
images:
  - name: kubeadm-node
    publishName: kubeadm-node-v1.37
    stage: 1
    paths: tools/images/kubeadm-node/* tools/images/scripts/guest-kubeadm.sh tools/images/lock/calico.lock tools/images/lock/kubernetes-*.lock
  - name: kubeadm-upgrade
    publishName: kubeadm-node-v1.36-upgrade
    stage: 1
    paths: tools/images/kubeadm-node/* tools/images/scripts/guest-kubeadm.sh tools/images/lock/calico.lock tools/images/lock/kubernetes-*.lock
  - name: etcd-host
    publishName: etcd-host
    stage: 1
    paths: tools/images/etcd-host/* tools/images/scripts/guest-etcd-host.sh
  - name: docker-vm
    publishName: docker-vm
    stage: 1
    paths: tools/images/docker-vm/* tools/images/scripts/guest-docker-vm.sh tools/images/lock/docker-vm.lock
  - name: kubeadm-full
    publishName: kubeadm-node-v1.37-full
    stage: 2
    paths: tools/images/kubeadm-addons/* tools/images/scripts/guest-kubeadm-addons.sh tools/images/lock/addons.lock tools/images/kubeadm-node/* tools/images/scripts/guest-kubeadm.sh
