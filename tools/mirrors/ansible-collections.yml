# Ansible collections served as tarballs by the mirror (ansible-galaxy collection download).
# Exact versions, so a rebuild does not move the collections that ansible-ctl:2.21 bakes in
# (tools/images/ansible/collections.lock must stay a subset of lock/ansible.lock).
collections:
  - name: ansible.posix
    version: 2.2.2
  - name: community.general
    version: 13.5.0
  - name: community.crypto
    version: 3.5.0
  - name: ansible.utils
    version: 6.1.1
  - name: containers.podman
    version: 1.21.1
  - name: kubernetes.core
    version: 6.6.0
  # Event-Driven Ansible sources and filters (ansible-rulebook labs)
  - name: ansible.eda
    version: 2.13.0
  # RHEL system roles, upstream (timesync, selinux, ...): roles labs
  - name: fedora.linux_system_roles
    version: 2.5.0
