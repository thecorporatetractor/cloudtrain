server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    sendfile on;
    # read-only: only GET/HEAD
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ \.(lock)$ { default_type text/plain; }
}
