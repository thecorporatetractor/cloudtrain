# kind config for KIND_PROFILE=managed-cni on the remote verify VM: same as
# deploy/kind/cluster-managed-cni.yaml plus docker.io through mirror.gcr.io
# (tools/verify-vm/kind-cluster.yaml explains why). Small on purpose: it shares
# the VM with the batch runner's cloudtrain-dev cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.32.0.0/16
  serviceSubnet: 10.96.0.0/12
containerdConfigPatches:
  - |-
    [plugins."io.containerd.cri.v1.images".registry]
      config_path = "/etc/containerd/certs.d"
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    maxPods: 200
    serializeImagePulls: false
nodes:
  - role: control-plane
    labels:
      kube-ovn/role: master
    extraMounts:
      - { hostPath: /dev/kvm, containerPath: /dev/kvm }
      - { hostPath: /srv/ct-work/vm-config/certs.d, containerPath: /etc/containerd/certs.d, readOnly: true }
  - role: worker
    extraMounts:
      - { hostPath: /dev/kvm, containerPath: /dev/kvm }
      - { hostPath: /srv/ct-work/vm-config/certs.d, containerPath: /etc/containerd/certs.d, readOnly: true }
  - role: worker
    extraMounts:
      - { hostPath: /dev/kvm, containerPath: /dev/kvm }
      - { hostPath: /srv/ct-work/vm-config/certs.d, containerPath: /etc/containerd/certs.d, readOnly: true }
