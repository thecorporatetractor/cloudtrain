# Kube-OVN overrides for the remote verify VM: the chart's CPU limits (cni 1, controller 1)
# throttle CNI ADD/DEL under bursts (docs/dev-environment.md known gap 9).
networking:
  OVN_NORTHD_N_THREADS: 4
performance:
  OVS_VSCTL_CONCURRENCY: 200
ovn-central:
  requests: { cpu: 500m, memory: 500Mi }
  limits: { cpu: "8", memory: 8Gi }
ovs-ovn:
  requests: { cpu: 200m, memory: 300Mi }
  limits: { cpu: "6", memory: 4Gi }
kube-ovn-controller:
  requests: { cpu: 500m, memory: 500Mi }
  limits: { cpu: "8", memory: 6Gi }
kube-ovn-cni:
  requests: { cpu: 200m, memory: 200Mi }
  limits: { cpu: "6", memory: 3Gi }
